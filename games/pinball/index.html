<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a1a" />
<title>弹球骑士 · Pinball</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0d1430; --text:#e0e0f0; --muted:#8888aa;
    --accent:#ff5db1; --accent-glow:#ff5db166; --danger:#ff4d6a; --gold:#ffd700; --ok:#3ecf8e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg);
    background-image: radial-gradient(ellipse at 30% 20%, #3a1030 0%, transparent 55%), radial-gradient(ellipse at 70% 80%, #102a40 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:420px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),#ffb0e0,#ff5db1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 11px; text-align:center; min-width:48px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.05rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:auto; border-radius:10px; background:var(--board); cursor:pointer; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#0a0a1aee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; }
  .overlay-content h2 { font-size:1.9rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:14px; font-size:0.9rem; }
  .overlay.win h2 { color:var(--gold); } .overlay.lose h2 { color:var(--danger); }
  .controls { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:10px 12px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; text-align:center; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#1a0010; }
  .btn.primary:hover { box-shadow:0 0 20px var(--accent-glow); }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#1a0010; animation:pg 2s infinite; --glow:var(--accent-glow); }
  @keyframes pg { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:18px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bk .8s infinite; }
  @keyframes bk { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:6px; font-size:0.7rem; color:var(--muted); }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>弹球骑士</h1><div class="sub">P I N B A L L</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="cv" width="360" height="560"></canvas>
    <div class="overlay win" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2>Ball Master!</h2><p id="win-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
    <div class="overlay lose" id="overlay-lose"><div class="overlay-bg"></div><div class="overlay-content"><h2>Game Over</h2><p id="lose-msg"></p><button class="btn primary" onclick="game.restart()">Try Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI playing...</span></div>
  <div class="stats-bar"><span id="lives-stat">Lives: ♥♥♥</span><span id="bumper-stat">Bumpers: 3</span></div>
</div>
<script>
(function(){
  'use strict';
  const W=360,H=560;
  const canvas=document.getElementById('cv'); const ctx=canvas.getContext('2d');
  const G=0.32, R=8, MAXV=11;
  const FL=0.45, LLEN=64; // flipper rest half-angle & length

  function makeBall(){ return { x:W/2+ (Math.random()*2-1)*40, y:70, vx:(Math.random()*2-1)*2, vy:2.5, alive:true }; }

  // Static table walls (oriented segments). Ball bounces off, never leaks.
  function buildWalls(){
    const Lp=108, Rp=252, fy=500; // flipper pivots, on the funnel ends
    return [
      // boundary is a SINGLE continuous chain so the ball never wedges in a corner:
      // left:  arch -> upper wall down -> funnel inward to the left flipper pivot
      {x1:4, y1:40, x2:4, y2:360},        // left upper wall
      {x1:W-4, y1:40, x2:W-4, y2:360},    // right upper wall
      {x1:4, y1:40, x2:W/2, y2:4},       // lit arch top-left
      {x1:W-4, y1:40, x2:W/2, y2:4},     // lit arch top-right
      // funnel walls: from the wall-bottom down-inward to each flipper pivot (no wall below, no side pocket)
      {x1:4, y1:360, x2:Lp, y2:fy},
      {x1:W-4, y1:360, x2:Rp, y2:fy},
    ];
  }

  class Pinball {
    constructor(){
      this.best=parseInt(localStorage.getItem('pbBest')||'0');
      this.autoPlay=false; this.last=0; this.raf=null; this.over=false;
      this.walls=buildWalls();
      this.bumpers=[{x:W/2,y:150,r:24},{x:W*0.30,y:240,r:20},{x:W*0.70,y:240,r:20}];
      this.lflash=[0,0,0];
      // slingshots: small triangles guarding the funnel mouth (give a kick)
      const Lp=108, Rp=252, fy=500;
      this.slings=[
        {x:95, y:430, bx:62, by:430, tx:88, ty:472, dir:1},
        {x:W-95, y:430, bx:W-62, by:430, tx:W-88, ty:472, dir:-1},
      ];
      this.sflash=[0,0];
      this.flip=[{px:Lp,py:fy,len:LLEN,rest:FL,up:-0.5,ang:FL,active:false},
                 {px:Rp,py:fy,len:LLEN,rest:Math.PI-FL,up:Math.PI+0.5,ang:Math.PI-FL,active:false}];
      this.loop=this.loop.bind(this);
      this.bind();
      this.restart();
      this.last=performance.now(); this.raf=requestAnimationFrame(this.loop);
    }
    restart(){
      this.stopAuto();
      this.score=0; this.lives=3; this.over=false;
      this.ball=makeBall(); this.sinceDrain=0; this._stuck=0; this.loiterT=0; this.hoverT=0; this.deepestY=0; this.trapped=false; this.ballLife=0; this._fallAssist=0; this._stuckFrames=0; this._lifeFrames=0;
      document.getElementById('overlay-win').classList.remove('active');
      document.getElementById('overlay-lose').classList.remove('active');
      this.updateUI();
    }
    updateUI(){ document.getElementById('score').textContent=this.score; document.getElementById('best').textContent=this.best;
      document.getElementById('lives-stat').textContent='Lives: '+('♥'.repeat(this.lives)||'—'); }
    tip(f){ return { x:f.px+Math.cos(f.ang)*f.len, y:f.py+Math.sin(f.ang)*f.len }; }
    // reflect ball off all static walls (bounce + energy retention)
    bounceWalls(b){
      for(const w of this.walls){
        const dx=w.x2-w.x1, dy=w.y2-w.y1; const ll=dx*dx+dy*dy;
        let t=((b.x-w.x1)*dx+(b.y-w.y1)*dy)/ll; t=Math.max(0,Math.min(1,t));
        const cx=w.x1+dx*t, cy=w.y1+dy*t; const ddx=b.x-cx, ddy=b.y-cy; const d=Math.hypot(ddx,ddy);
        const th=R+2; if(d<th){ const n=Math.max(d,0.01); const nx=ddx/n, ny=ddy/n;
          b.x=cx+nx*th; b.y=cy+ny*th; const dot=b.vx*nx+b.vy*ny; if(dot<0){ b.vx-=2*dot*nx; b.vy-=2*dot*ny; b.vx*=0.94; b.vy*=0.94; } }
      }
    }
    bounceSlings(b){
      for(let i=0;i<2;i++){ const s=this.slings[i]; const dx=b.x-s.x, dy=b.y-s.y; const d=Math.hypot(dx,dy);
        const th=R+16; if(d<th){ const nx=dx/Math.max(d,0.01), ny=dy/Math.max(d,0.01);
          b.x=s.x+nx*th; b.y=s.y+ny*th; const dot=b.vx*nx+b.vy*ny; b.vx-=2*dot*nx; b.vy-=2*dot*ny;
          // kick back toward center + upward
          b.vx=-s.dir*2.6; b.vy=-6.2; this.sflash[i]=1; this.score+=60; this.updateUI(); } }
    }
    step(dt){
      if(this.over) return;
      // flippers
      for(let i=0;i<2;i++){ const f=this.flip[i];
        if(this.autoPlay){ // AI: press when ball low & approaching this side
          f.active = this.ball.y>H-200 && this.ball.vy>0 && ((i===0&&this.ball.x<=W/2)||(i===1&&this.ball.x>W/2));
        }
        const tgt=f.active?f.up:f.rest; const sp=6*dt;
        if(f.ang<tgt) f.ang=Math.min(tgt,f.ang+sp); else if(f.ang>tgt) f.ang=Math.max(tgt,f.ang-sp);
      }
      const b=this.ball; if(!b.alive) return;
      this.ballLife=(this.ballLife||0)+dt;
      b.vy+=G*dt;
      const sp=Math.hypot(b.vx,b.vy); if(sp>MAXV){ b.vx*=MAXV/sp; b.vy*=MAXV/sp; }
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      // outer boundary clamp (safety, shouldn't trigger often now)
      if(b.x<R){ b.x=R; b.vx=Math.abs(b.vx)*0.9; }
      if(b.x>W-R){ b.x=W-R; b.vx=-Math.abs(b.vx)*0.9; }
      if(b.y<R){ b.y=R; b.vy=Math.abs(b.vy)*0.9; }
      this.bounceWalls(b);
      this.bounceSlings(b);
      // bumpers
      for(let i=0;i<3;i++){ const bu=this.bumpers[i]; const dx=b.x-bu.x, dy=b.y-bu.y; const d=Math.hypot(dx,dy);
        if(d<b.r+R){ const n=Math.max(d,0.01); const nx=dx/n, ny=dy/n; b.x=bu.x+nx*(bu.r+R); b.y=bu.y+ny*(bu.r+R);
          const dot=b.vx*nx+b.vy*ny; b.vx-=2*dot*nx; b.vy-=2*dot*ny; b.vx*=1.05; b.vy*=1.05; this.lflash[i]=1; this.score+=100; this.updateUI(); } }
      // flippers collision
      for(const f of this.flip){ const tx=f.px+Math.cos(f.ang)*f.len, ty=f.py+Math.sin(f.ang)*f.len;
        const dx=b.x-f.px, dy=b.y-f.py, dx2=tx-f.px, dy2=ty-f.py; const ll=dx2*dx2+dy2*dy2; let t=((dx*dx2+dy*dy2)/ll); t=Math.max(0,Math.min(1,t));
        const cx=f.px+dx2*t, cy=f.py+dy2*t; const ddx=b.x-cx, ddy=b.y-cy; const d=Math.hypot(ddx,ddy);
        const th=7+R; if(d<th){ const n=Math.max(d,0.01); const nx=ddx/n, ny=ddy/n; b.x=cx+nx*th; b.y=cy+ny*th;
          const dot=b.vx*nx+b.vy*ny; b.vx-=2*dot*nx; b.vy-=2*dot*ny;
          if(f.active){ b.vy-=7; b.vx+=(f.px<W/2?-1:1)*2.4; } else { b.vx*=0.96; b.vy*=0.96; } } }
      // drain: the ball is lost once it slips below the flipper line and is between
      // the two pivots (i.e. it fell through the center gap). Also a stuck-orbit backstop.
      const pivotY=this.flip[0].py;
      const belowFlippers = b.y > pivotY-6 && b.x>this.flip[0].px && b.x<this.flip[1].px;
      const atFloor = b.y > H-10;
      if(b.y > pivotY-34 && b.y < pivotY-6){
        if(Math.hypot(b.vx,b.vy) < 1.2) this._stuck=(this._stuck||0)+dt; else this._stuck=0;
      } else this._stuck=0;
      // 防死循环：正常轨迹里球迟早落到底板/挡板缝；若卡在漏斗斜壁与挡板夹缝(重力被斜壁反复中和，
      // 下不去)，用两层独立的、与物理加力无关的"帧计时兜底"确保任何球都能在限定时间内结束：
      //  1) assist 阶段：age>2.5s 起渐进加温和下拽；
      //  2) stuckFrames：trapped 且近水平悬停累计 → 强制塞到挡板缝中央 drain；
      //  3) lifeFrames：球存活总帧独立硬上限 → 无条件强制 drain(封死一切漏判)。
      this._fallAssist=(this._fallAssist||0);
      this._lifeFrames=(this._lifeFrames||0)+dt;
      const age=this.ballLife||0;
      if(age>150){                  // ≈2.5s 还没落 → 渐进式把球往漏斗中央漏口引并下拽
        this.trapped=true;
        this._fallAssist=Math.min(2.2, this._fallAssist+0.03*dt);
        b.vy += this._fallAssist*dt;                // 额外向下重力
        b.vx += (W/2 - b.x) * 0.02 * dt;            // 同时把球往中央漏斗漏口推(消除横向环绕，更易进挡板缝)
        b.vx *= (1 - 0.012*dt);
        const s=Math.hypot(b.vx,b.vy); if(s<2.5){ const k=2.5/s; b.vx*=k; b.vy*=k; }
      }
      const stuckTooLong=(this._stuck||0)>150;
      // 卡死判定：trapped 状态下、球始终没真正落进挡板缝/底板(即停在挡板线 pivotY 之上)→
      // 视为被困，累计到 ~1.25s 就把它塞到挡板缝解开。覆盖"挡板缝正上方 450 附近"的窄带锁死。
      const hoveringHigh = this.trapped && b.y < pivotY;
      if(hoveringHigh) this._stuckFrames=(this._stuckFrames||0)+dt; else this._stuckFrames=0;
      const forceDrain = this._stuckFrames>75 || this._lifeFrames>390;        // ≈1.25s 卡死即解 或 ≈6.5s 绝对封顶
      if(forceDrain){
        b.x=W/2; b.y=pivotY+30; b.vx=0; b.vy=0;   // 塞到挡板缝下方中央 → 下一判定 belowFlippers 命中
      }
      if(belowFlippers || atFloor || b.y>H+R || stuckTooLong || forceDrain){
        b.alive=false; this.lives--; this._stuck=0; this.loiterT=0; this.hoverT=0; this.deepestY=0; this.trapped=false; this.ballLife=0; this._fallAssist=0; this._stuckFrames=0; this._lifeFrames=0; this.updateUI();
        if(this.lives<=0){ this.over=true; this.gameOver(); }
        else { this.sinceDrain=0; setTimeout(()=>{ if(this.over) return; this.ball=makeBall(); }, 600); }
      }
    }
    gameOver(){ if(this.autoPlay) this.stopAuto();
      if(this.score>this.best){ this.best=this.score; localStorage.setItem('pbBest',String(this.best)); }
      this.updateUI(); document.getElementById('lose-msg').textContent='Score '+this.score; document.getElementById('overlay-lose').classList.add('active'); }
    loop(now){
      const dt=Math.max(0.2,Math.min(2.2,(now-this.last)/16.67)); this.last=now;
      if(this.lflash) for(let i=0;i<3;i++) this.lflash[i]=Math.max(0,this.lflash[i]-0.05*dt);
      if(!this.ball.alive) this.sinceDrain+=dt;
      this.step(dt); this.draw();
      this.raf=requestAnimationFrame(this.loop);
    }
    draw(){
      ctx.clearRect(0,0,W,H);
      // table chrome frame
      ctx.strokeStyle='#2a3566'; ctx.lineWidth=2; ctx.strokeRect(4,4,W-8,H-8);
      // static walls (funnel + arch)
      ctx.strokeStyle='#3b4a8a'; ctx.lineWidth=4; ctx.lineCap='round';
      for(const w of this.walls){ ctx.beginPath(); ctx.moveTo(w.x1,w.y1); ctx.lineTo(w.x2,w.y2); ctx.stroke(); }
      // slingshots (triangular kickers)
      for(let i=0;i<2;i++){ const s=this.slings[i]; ctx.fillStyle=this.sflash[i]>0?'#ffd700':'#ff5db1'; ctx.shadowColor='#ff5db1'; ctx.shadowBlur=this.sflash[i]*16;
        ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.bx,s.by); ctx.lineTo(s.tx,s.ty); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; }
      // bumpers
      for(let i=0;i<3;i++){ const bu=this.bumpers[i]; const g=ctx.createRadialGradient(bu.x,bu.y,2,bu.x,bu.y,bu.r);
        g.addColorStop(0,'#ffd1f0'); g.addColorStop(1,'#ff5db1'); ctx.fillStyle=g; ctx.shadowColor='#ff5db1'; ctx.shadowBlur=14*this.lflash[i]+6;
        ctx.beginPath(); ctx.arc(bu.x,bu.y,bu.r,0,7); ctx.fill(); ctx.shadowBlur=0; }
      for(const f of this.flip){ const tx=f.px+Math.cos(f.ang)*f.len, ty=f.py+Math.sin(f.ang)*f.len;
        ctx.strokeStyle=f.active?'#ffd700':'#ff5db1'; ctx.lineWidth=9; ctx.lineCap='round'; ctx.shadowColor=f.active?'#ffd700':'#ff5db1'; ctx.shadowBlur=f.active?16:8;
        ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(tx,ty); ctx.stroke(); ctx.shadowBlur=0;
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(f.px,f.py,5,0,7); ctx.fill(); }
      const b=this.ball; if(b.alive){ const g=ctx.createRadialGradient(b.x-2,b.y-2,1,b.x,b.y,R);
        g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#ff9de0'); ctx.fillStyle=g; ctx.shadowColor='#ff5db1'; ctx.shadowBlur=14;
        ctx.beginPath(); ctx.arc(b.x,b.y,R,0,7); ctx.fill(); ctx.shadowBlur=0; }
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none';
      for(const f of this.flip) f.active=false; }
    bind(){
      const press=(x)=>{ if(this.autoPlay||this.over) return; const half=x<canvas.getBoundingClientRect().width/2; this.flip[half?0:1].active=true; };
      const release=()=>{ if(this.autoPlay) return; this.flip[0].active=false; this.flip[1].active=false; };
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); press(e.clientX - canvas.getBoundingClientRect().left); });
      canvas.addEventListener('pointerup',release); canvas.addEventListener('pointercancel',release);
      canvas.addEventListener('pointerleave',release);
    }
  }
  window.game=new Pinball();
})();
</script>
</body>
</html>
