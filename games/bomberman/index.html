<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0f1a" />
<title>Boom Grid · Neon</title>
<style>
  :root{
    --bg:#0a0f1a; --surface:#111a2b; --text:#e7edf7; --muted:#8090a8;
    --accent:#ff8a3d; --accent2:#5ce1ff; --accent-glow:#ff8a3d66; --danger:#ff5d6c;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 20% 10%,#241405 0%,transparent 55%),radial-gradient(ellipse at 85% 90%,#06222b 0%,transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:480px;padding:16px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .title-block h1{font-size:1.7rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,#ffd0a0,#ff8a3d,#ffd76a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:6px 12px;text-align:center;min-width:58px;}
  .score-card .label{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0a;border-radius:14px;padding:10px;box-shadow:0 0 40px #00000040,0 0 70px var(--accent-glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;z-index:10;opacity:0;transition:opacity .35s;pointer-events:none;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0f1aee;backdrop-filter:blur(4px);border-radius:14px;}
  .overlay-content{position:relative;text-align:center;z-index:1;}
  .overlay-content h2{font-size:2rem;font-weight:800;margin-bottom:6px;}
  .overlay-content p{color:var(--muted);margin-bottom:16px;font-size:.9rem;}
  .controls{display:flex;gap:10px;margin-top:14px;}
  .btn{flex:1;min-width:88px;padding:12px 16px;border:1px solid #ffffff12;border-radius:10px;background:var(--surface);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;}
  .btn:hover{background:#ffffff10;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0a0f1a;}
  .btn.primary:hover{box-shadow:0 0 20px var(--accent-glow);}
  .btn.auto-on{background:var(--accent);border-color:var(--accent);color:#0a0f1a;animation:pulse-glow 2s infinite;}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--accent-glow);}50%{box-shadow:0 0 22px var(--accent-glow),0 0 40px var(--accent-glow);}}
  .ai-indicator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.75rem;color:var(--muted);justify-content:center;min-height:20px;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
  .hint{margin-top:8px;text-align:center;font-size:.7rem;color:var(--muted);}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Boom Grid</h1><div class="sub">B O M B &nbsp; M A Z E</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Kills</div><div class="value" id="kills">0</div></div>
      <div class="score-card"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="440" height="440"></canvas>
    <div class="overlay" id="overlay-end"><div class="overlay-bg"></div><div class="overlay-content"><h2 id="end-title">Level</h2><p id="end-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI hunting…</span></div>
  <div class="hint">Move: arrows / swipe · Bomb: tap or space. Auto = AI plays.</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  function fitCanvas(){ const w=(canvas.clientWidth||canvas.width||440); const dpr=window.devicePixelRatio||1; canvas.width=w*dpr; canvas.height=w*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); return w; }
  const lerp=(a,b,t)=>a+(b-a)*t;

  const W=13, H=11, STEP=0.18, FUSE=3.2, BLAST=2;
  const isSolid=(r,c)=> (r<0||c<0||r>=H||c>=W) || (r%2===0&&c%2===0);
  const inB=(r,c)=> r>=0&&c>=0&&r<H&&c<W;
  const DIRS=[[-1,0],[1,0],[0,-1],[0,1]];

  class G{
    constructor(){ this.autoPlay=false; this.bindInput(); this.restart(); this._tick=this.tick.bind(this); requestAnimationFrame(this._tick); }
    reset(){
      this.size=fitCanvas();
      this.cell=this.size/W; this.offY=(this.size - H*this.cell)/2;
      this.kills=0; this.over=false; this.phase='play'; this.bombs=[]; this.fx=[]; this.autoAccum=0; this.endTimer=0;
      // level
      this.grid=[];
      for(let r=0;r<H;r++){ const row=[]; for(let c=0;c<W;c++){
        if(isSolid(r,c)) row.push('solid');
        else { const spawnClear=(r<=2&&c<=2); row.push(spawnClear?'empty':(Math.random()<0.72?'brick':'empty')); }
      } this.grid.push(row); }
      this.player={r:1,c:1,color:'#ff8a3d',bomb:false,alive:true,moving:null,cd:0.05};
      // enemies on far clear cells
      this.enemies=[];
      const spots=[];
      for(let r=0;r<H;r++)for(let c=0;c<W;c++){ if(this.grid[r][c]==='empty' && (Math.abs(r-1)+Math.abs(c-1))>5) spots.push([r,c]); }
      // pick 3 spread
      const picks=[];
      while(picks.length<3 && spots.length){ const i=Math.floor(Math.random()*spots.length); const s=spots.splice(i,1)[0];
        if(picks.every(p=>Math.abs(p[0]-s[0])+Math.abs(p[1]-s[1])>3)) picks.push(s); }
      for(const [r,c] of picks){ this.enemies.push({r,c,color:'#5ce1ff',bomb:false,alive:true,moving:null,cd:0.1}); }
      this.hideOverlay(); this.updateIndicators();
    }
    restart(){ this.reset(); this.stopAuto(); }
    hideOverlay(){ document.getElementById('overlay-end').classList.remove('active'); }
    showOverlay(t,m){ document.getElementById('end-title').textContent=t; document.getElementById('end-msg').textContent=m; document.getElementById('overlay-end').classList.add('active'); }
    updateIndicators(){ document.getElementById('kills').textContent=this.kills; let b=parseInt(localStorage.getItem('best_bomberman')||'0',10); if(this.kills>b){ b=this.kills; try{ localStorage.setItem('best_bomberman',String(b)); }catch(e){} } document.getElementById('best').textContent=b; }
    occupied(r,c,except){ if(this.player.alive&&this.player!==except&&this.player.r===r&&this.player.c===c) return true; for(const e of this.enemies){ if(e.alive&&e!==except&&e.r===r&&e.c===c) return true; } return false; }
    bombAt(r,c){ for(const b of this.bombs){ if(b.r===r&&b.c===c) return true; } return false; }
    freeMove(r,c,except){ return inB(r,c)&&!isSolid(r,c)&&this.grid[r][c]!=='brick'&&!this.bombAt(r,c)&&!this.occupied(r,c,except); }
    blastCells(b){
      const set=[];
      const add=(r,c)=>{ if(inB(r,c)) set.push(r+','+c); };
      add(b.r,b.c);
      for(const [dr,dc] of DIRS){ for(let i=1;i<=BLAST;i++){ const nr=b.r+dr*i, nc=b.c+dc*i; if(!inB(nr,nc)||isSolid(nr,nc)) break; set.push(nr+','+nc); if(this.grid[nr][nc]==='brick') break; } }
      return set;
    }
    cellDanger(r,c){
      for(const b of this.bombs){ if(this.blastCells(b).indexOf(r+','+c)>=0) return true; }
      for(const f of this.fx){ if(f.cells.indexOf(r+','+c)>=0) return true; }
      return false;
    }
    placeBomb(u){ if(u.bomb) return; u.bomb=true; this.bombs.push({r:u.r,c:u.c,timer:FUSE,owner:u}); }
    explode(b){
      const cells=this.blastCells(b);
      for(const key of cells){ const [r,c]=key.split(',').map(Number); if(inB(r,c)&&this.grid[r][c]==='brick') this.grid[r][c]='empty'; }
      this.fx.push({cells:cells.slice(),t:0,dur:0.45});
      // kills
      if(this.player.alive && cells.indexOf(this.player.r+','+this.player.c)>=0){ this.player.alive=false; this.lose(); }
      for(const e of this.enemies){ if(e.alive && cells.indexOf(e.r+','+e.c)>=0){ e.alive=false; this.kills++; } }
      this.bombs=this.bombs.filter(x=>x!==b); if(b.owner) b.owner.bomb=false;
      if(this.enemies.every(e=>!e.alive)) this.win();
      this.updateIndicators();
    }
    win(){ if(this.over) return; this.over=true; this.phase='win'; this.showOverlay('Cleared!','All enemies destroyed · '+this.kills+' kills'); this.endTimer=1.4; }
    lose(){ if(this.over) return; this.over=true; this.phase='lose'; this.showOverlay('Boom!','You were caught in a blast'); this.endTimer=1.4; }
    bfsStep(sr,sc,tr,tc){
      if(sr===tr&&sc===tc) return null;
      const prev={}; const q=[[sr,sc]]; const seen=new Set([sr+','+sc]);
      while(q.length){ const [r,c]=q.shift();
        for(const [dr,dc] of DIRS){ const nr=r+dr,nc=c+dc; const k=nr+','+nc; if(seen.has(k)) continue; if(!this.freeMove(nr,nc,this.player)) continue; seen.add(k); prev[k]=[r,c];
          if(nr===tr&&nc===tc){ // walk back
            let cur=k, prevk=prev[k]; while(prevk && !(prevk[0]===sr&&prevk[1]===sc)){ cur=prevk[0]+','+prevk[1]; prevk=prev[cur]; } const [pr,pc]=cur.split(',').map(Number); return {r:pr,c:pc}; }
          q.push([nr,nc]);
        }
      }
      return null;
    }
    nearestEnemyCell(r,c){
      const prev={}; const q=[[r,c]]; const seen=new Set([r+','+c]);
      while(q.length){ const [cr,cc]=q.shift();
        for(const e of this.enemies){ if(e.alive && e.r===cr&&e.c===cc) return [cr,cc]; }
        for(const [dr,dc] of DIRS){ const nr=cr+dr,nc=cc+dc; const k=nr+','+nc; if(seen.has(k)) continue; if(!this.freeMove(nr,nc,this.player)) continue; seen.add(k); prev[k]=[cr,cc];
          if(this.enemies.some(e=>e.alive&&e.r===nr&&e.c===nc)){ // backtrack to first step
            let cur=k, pk=prev[k]; while(pk && !(pk[0]===r&&pk[1]===c)){ cur=pk[0]+','+pk[1]; pk=prev[cur]; } const [pr,pc]=cur.split(',').map(Number); return {r:pr,c:pc}; }
          q.push([nr,nc]);
        }
      }
      return null;
    }
    safeCellFrom(r,c){
      const danger=new Set();
      for(const b of this.bombs) for(const k of this.blastCells(b)) danger.add(k);
      // Enqueue EVERY free cell (even ones still inside a blast) so the search can run THROUGH the
      // blast to reach a safe cell — every neighbor of a bomb is itself in-blast, so a no-push BFS
      // can never escape and always returns null. Return the first safe, non-start cell found.
      const q=[[r,c]]; const seen=new Set([r+','+c]);
      while(q.length){ const [cr,cc]=q.shift();
        for(const [dr,dc] of DIRS){ const nr=cr+dr,nc=cc+dc; const k=nr+','+nc; if(seen.has(k)) continue; if(!this.freeMove(nr,nc,this.player)) continue; seen.add(k); q.push([nr,nc]);
          if(!danger.has(k) && !(nr===r&&nc===c)) return [nr,nc];
        }
      }
      return null;
    }
    hasEscapeAfterBomb(){
      const sb=this.blastCells({r:this.player.r,c:this.player.c});
      const danger=new Set(sb);
      for(const b of this.bombs) for(const k of this.blastCells(b)) danger.add(k);
      // Allow walking THROUGH blast cells (you run through them briefly before the fuse ends);
      // we only require reaching a cell that is OUTSIDE the blast. The previous version refused to
      // step through any in-blast cell, but every neighbor of the bomb is itself in-blast, so it
      // always returned false and the AI never dared place a bomb -> could never dig or kill.
      const seen=new Set([this.player.r+','+this.player.c]); const q=[[this.player.r,this.player.c]];
      while(q.length){ const [cr,cc]=q.shift();
        for(const [dr,dc] of DIRS){ const nr=cr+dr,nc=cc+dc; const k=nr+','+nc; if(seen.has(k)) continue; if(!this.freeMove(nr,nc,this.player)) continue; seen.add(k); q.push([nr,nc]);
          if(!danger.has(k)) return true;
        }
      }
      return false;
    }
    stepToward(u,tr,tc){
      if(u.r===tr&&u.c===tc) return;
      const nb=[];
      for(const [dr,dc] of DIRS){ const nr=u.r+dr,nc=u.c+dc; if(this.freeMove(nr,nc,u)){ const d=Math.abs(nr-tr)+Math.abs(nc-tc); nb.push({r:nr,c:nc,d}); } }
      if(!nb.length){ this.randomStep(u); return; }
      nb.sort((a,b)=>a.d-b.d); const t=nb[0]; this.startMove(u,t.r,t.c);
    }
    randomStep(u){
      const nb=[]; for(const [dr,dc] of DIRS){ const nr=u.r+dr,nc=u.c+dc; if(this.freeMove(nr,nc,u)) nb.push({r:nr,c:nc}); }
      if(!nb.length) return; const t=nb[Math.floor(Math.random()*nb.length)]; this.startMove(u,t.r,t.c);
    }
    startMove(u,tr,tc){ u.moving={fr:u.r,fc:u.c,tr:tr,tc:tc,t:0,dur:STEP}; u.r=tr; u.c=tc; }
    nearestEnemyAny(){
      let best=null, bd=1e9;
      for(const e of this.enemies){ if(!e.alive) continue; const d=Math.abs(e.r-this.player.r)+Math.abs(e.c-this.player.c); if(d<bd){ bd=d; best=e; } }
      return best;
    }
    // Approach the nearest enemy, digging through bricks with safe bombs when the path is blocked.
    digToward(en){
      const p=this.player;
      if(!en){ this.randomStep(p); return; }
      // Prefer the axis with the larger delta first.
      const dr=en.r-p.r, dc=en.c-p.c;
      const order=[];
      if(Math.abs(dr)>=Math.abs(dc)){
        if(dr!==0) order.push([Math.sign(dr),0]);
        if(dc!==0) order.push([0,Math.sign(dc)]);
      } else {
        if(dc!==0) order.push([0,Math.sign(dc)]);
        if(dr!==0) order.push([Math.sign(dr),0]);
      }
      for(const [ddr,ddc] of order){
        const nr=p.r+ddr, nc=p.c+ddc;
        if(!inB(nr,nc)) continue;
        if(this.freeMove(nr,nc,p)){ this.startMove(p,nr,nc); return; }       // walk if clear
        if(this.grid[nr][nc]==='brick'){                                    // dig: safe bomb clears it
          if(!p.bomb && this.hasEscapeAfterBomb()){ this.placeBomb(p); return; }
        }
      }
      // Forward blocked (brick unsafe to bomb, or solid). Try a bomb at current cell if a brick is adjacent & escape exists.
      if(!p.bomb){
        let adjBrick=false;
        for(const [ddr,ddc] of DIRS){ const nr=p.r+ddr, nc=p.c+ddc; if(inB(nr,nc)&&this.grid[nr][nc]==='brick'){ adjBrick=true; break; } }
        if(adjBrick && this.hasEscapeAfterBomb()){ this.placeBomb(p); return; }
      }
      // Otherwise just move to the safe free neighbor that best reduces distance, else random.
      const nb=[];
      for(const [ddr,ddc] of DIRS){ const nr=p.r+ddr, nc=p.c+ddc; if(this.freeMove(nr,nc,p)){ const d=Math.abs(nr-en.r)+Math.abs(nc-en.c); nb.push({r:nr,c:nc,d}); } }
      if(nb.length){ nb.sort((a,b)=>a.d-b.d); this.startMove(p,nb[0].r,nb[0].c); }
      else this.randomStep(p);
    }
    aiPlayer(){
      if(!this.player.alive) return;
      const p=this.player;
      // 1) OWN bomb safety is the top priority. While our bomb is live, keep walking AWAY from the
      //    blast (even after the current cell looks safe) until we are fully outside the blast
      //    radius. Only then may we switch to hunting. This prevents fleeing out then walking
      //    straight back into the still-ticking bomb (the old suicide loop).
      if(p.bomb){
        if(this.fleeStep(p)) return;
        return; // reached a safe cell — hold still outside the blast
      }
      // 2) danger from any bomb (e.g. ours still ticking, or an enemy's): flee.
      if(this.cellDanger(p.r,p.c)){ if(this.fleeStep(p)) return; }
      // 3) fire a bomb when an enemy is aligned & within blast range (no own bomb is live here).
      const en=this.nearestEnemyAny();
      if(en){
        const d=Math.abs(en.r-p.r)+Math.abs(en.c-p.c);
        const aligned=(en.r===p.r||en.c===p.c);
        if(aligned && d<=BLAST && this.hasEscapeAfterBomb()){ this.placeBomb(p); return; }
      }
      // 4) approach a reachable enemy along clear cells.
      const tgt=this.nearestEnemyCell(p.r,p.c);
      if(tgt){ this.stepToward(p,tgt.r,tgt.c); return; }
      // 5) enemy not yet reachable through empty cells: dig toward it (clear bricks with safe bombs).
      if(en){ this.digToward(en); return; }
      this.randomStep(p);
    }
    // keep walking away until at least (BLAST+1) cells from any blast cell
    blastDist(r,c){
      let best=1e9;
      for(const b of this.bombs){ for(const k of this.blastCells(b)){ const parts=k.split(','); const br=+parts[0], bc=+parts[1]; const d=Math.abs(br-r)+Math.abs(bc-c); if(d<best) best=d; } }
      return best;
    }
    // Flee toward safety. Prefer an immediate free neighbor that is ITSELF outside the blast, so we
    // never step INTO the blast while circling it (which caused the old 1,0<->1,1 oscillation death).
    // If no immediately-safe neighbor exists, BFS to find the shortest path to any safe cell, then
    // take the FIRST step of that path — never rely on greedy stepToward which can step back into
    // the blast and waste precious fuse time.
    fleeStep(u){
      const needFlee = this.cellDanger(u.r,u.c) || this.blastDist(u.r,u.c) <= BLAST;
      if(!needFlee) return false;
      // candidate safe neighbors (outside blast)
      const safeNb=[];
      for(const [dr,dc] of DIRS){ const nr=u.r+dr, nc=u.c+dc; if(this.freeMove(nr,nc,u) && !this.cellDanger(nr,nc)) safeNb.push({r:nr,c:nc}); }
      if(safeNb.length){
        safeNb.sort((a,b)=>this.blastDist(b.r,b.c)-this.blastDist(a.r,a.c));
        this.startMove(u,safeNb[0].r,safeNb[0].c); return true;
      }
      // no immediately-safe neighbor: BFS to find shortest path to any safe cell
      // prefer safe cells that have at least one free neighbor (avoid dead-end traps)
      const prev={}; const q=[[u.r,u.c]]; const seen=new Set([u.r+','+u.c]); let best=null, bestDist=1e9;
      const hasFreeNb=(r,c)=>{
        for(const [ddr,ddc] of DIRS){ const nnr=r+ddr,nnc=c+ddc; if(this.freeMove(nnr,nnc,u)) return true; }
        return false;
      };
      while(q.length){ const [cr,cc]=q.shift();
        for(const [dr,dc] of DIRS){ const nr=cr+dr,nc=cc+dc; const k=nr+','+nc; if(seen.has(k)) continue; if(!this.freeMove(nr,nc,u)) continue; seen.add(k); prev[k]=[cr,cc]; q.push([nr,nc]);
          if(!this.cellDanger(nr,nc)){
            const d=Math.abs(nr-u.r)+Math.abs(nc-u.c);
            const score=d+(hasFreeNb(nr,nc)?0:100); // heavy penalty for dead-end safe cells
            if(score<bestDist){ bestDist=score; best=[nr,nc]; }
            if(score===d) break; // found a safe cell with escape room — stop searching
          }
        }
        if(best && bestDist===Math.abs(best[0]-u.r)+Math.abs(best[1]-u.c)) break; // optimal found
      }
      if(best){
        // backtrack to find the first step from current position
        let cur=best[0]+','+best[1], pk=prev[cur];
        while(pk && !(pk[0]===u.r&&pk[1]===u.c)){ cur=pk[0]+','+pk[1]; pk=prev[cur]; }
        const [sr,sc]=cur.split(',').map(Number);
        this.startMove(u,sr,sc); return true;
      }
      // no safe cell reachable at all — take any free neighbor as last resort
      this.randomStep(u); return true;
    }
    aiEnemy(e){
      if(!e.alive) return;
      if(this.cellDanger(e.r,e.c)){ const s=this.safeCellFrom(e.r,e.c); if(s && !(s[0]===e.r&&s[1]===e.c)){ this.stepToward(e,s[0],s[1]); } return; }
      if(this.player.alive){ const d=Math.abs(e.r-this.player.r)+Math.abs(e.c-this.player.c);
        if(d<=6){ const step=this.bfsStep(e.r,e.c,this.player.r,this.player.c); if(step){ this.stepToward(e,step.r,step.c); return; } } }
      this.randomStep(e);
    }
    tick(ts){ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):(16/1000)); this._last=ts; try { this.update(dt); this.render(); } catch(err){ if(this._tickErr!==err){ this._tickErr=err; try{ console.error('boom tick error:', err); }catch(e){} } } requestAnimationFrame(this._tick); }
    update(dt){
      // bombs + fx
      for(const b of this.bombs.slice()){ b.timer-=dt; if(b.timer<=0) this.explode(b); }
      for(const f of this.fx){ f.t+=dt; }
      this.fx=this.fx.filter(f=>f.t<f.dur);
      if(this.over){ this.endTimer-=dt; if(this.autoPlay && this.endTimer<=0){ this.reset(); } return; }
      // units
      const units=[this.player,...this.enemies].filter(u=>u.alive);
      for(const u of units){
        if(u.moving){ u.moving.t+=dt; if(u.moving.t>=u.moving.dur) u.moving=null;
          // own-bomb emergency: skip animation delay so the player can chain flee steps rapidly
          else if(!(u===this.player && u.bomb)) continue;
        }
        // 单位刚走到新格子：若在危险中免冷却立即决策，否则等 cd
        const urgent = this.cellDanger(u.r,u.c);
        if(!urgent){ u.cd-=dt; if(u.cd>0) continue; u.cd=STEP; }
        if(u===this.player){ if(this.autoPlay) this.aiPlayer(); }
        else this.aiEnemy(u);
      }
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.reset(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; document.getElementById('ai-status').textContent='AI hunting…'; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    bindInput(){
      const wrap=document.getElementById('board-wrap');
      let sx=0,sy=0;
      wrap.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over) return; e.preventDefault(); sx=e.clientX; sy=e.clientY; });
      wrap.addEventListener('pointerup',(e)=>{ if(this.autoPlay||this.over) return; e.preventDefault(); const dx=e.clientX-sx, dy=e.clientY-sy;
        if(Math.abs(dx)<14 && Math.abs(dy)<14){ this.tryBomb(); return; }
        if(Math.abs(dx)>Math.abs(dy)) this.tryMove(dx>0?1:-1,0); else this.tryMove(0,dy>0?1:-1); });
      window.addEventListener('keydown',(e)=>{ if(this.autoPlay||this.over) return;
        if(e.key==='ArrowUp') this.tryMove(0,-1); else if(e.key==='ArrowDown') this.tryMove(0,1);
        else if(e.key==='ArrowLeft') this.tryMove(-1,0); else if(e.key==='ArrowRight') this.tryMove(1,0);
        else if(e.key===' '||e.key==='Enter') this.tryBomb(); });
      window.addEventListener('resize',()=>{ this.size=fitCanvas(); this.cell=this.size/W; this.offY=(this.size - H*this.cell)/2; });
    }
    tryMove(dx,dy){ if(!this.player.alive||this.player.moving) return; const nr=this.player.r+dy, nc=this.player.c+dx; if(this.freeMove(nr,nc,this.player)) this.startMove(this.player,nr,nc); }
    tryBomb(){ if(this.player.alive && !this.player.bomb) this.placeBomb(this.player); }
    cellCenter(r,c){ return [this.offY + r*this.cell + this.cell/2, c*this.cell + this.cell/2]; }
    render(){
      const cell=this.cell; ctx.clearRect(0,0,this.size,this.size);
      // grid
      for(let r=0;r<H;r++)for(let c=0;c<W;c++){
        const x=c*cell, y=this.offY+r*cell; const t=this.grid[r][c];
        if(t==='solid'){ ctx.fillStyle='#243049'; ctx.shadowColor='#3a4a6e'; ctx.shadowBlur=6; roundRect(x+2,y+2,cell-4,cell-4,4); ctx.fill(); ctx.shadowBlur=0; }
        else if(t==='brick'){ const g=ctx.createLinearGradient(x,y,x+cell,y+cell); g.addColorStop(0,'#ff9d5a'); g.addColorStop(1,'#c85a2a'); ctx.fillStyle=g; ctx.shadowColor='#ff8a3d55'; ctx.shadowBlur=8; roundRect(x+2,y+2,cell-4,cell-4,4); ctx.fill(); ctx.shadowBlur=0; }
        else { ctx.fillStyle='#0e1626'; ctx.fillRect(x+1,y+1,cell-2,cell-2); }
      }
      // bombs
      for(const b of this.bombs){ const [cy,cx]=this.cellCenter(b.r,b.c); const pulse=0.5+0.5*Math.sin((FUSE-b.timer)*12); const rad=cell*0.32*(0.85+0.15*pulse);
        ctx.fillStyle='#1a0f06'; ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#ffd76a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,rad,-Math.PI/2,-Math.PI/2 + (1-b.timer/FUSE)*Math.PI*2); ctx.stroke(); }
      // explosions
      for(const f of this.fx){ const a=1-f.t/f.dur; for(const k of f.cells){ const [r,c]=k.split(',').map(Number); const x=c*cell,y=this.offY+r*cell; ctx.fillStyle='rgba(255,160,80,'+(0.85*a)+')'; ctx.shadowColor='#ff8a3d'; ctx.shadowBlur=18*a; roundRect(x+1,y+1,cell-2,cell-2,4); ctx.fill(); ctx.shadowBlur=0; } }
      // units
      const drawUnit=(u,col)=>{ if(!u.alive) return; let r=u.r,c=u.c; if(u.moving){ const tt=Math.min(1,u.moving.t/u.moving.dur); const e=tt<0.5?2*tt*tt:1-Math.pow(-2*tt+2,2)/2; r=lerp(u.moving.fr,u.moving.tr,e); c=lerp(u.moving.fc,u.moving.tc,e); }
        const [cy,cx]=this.cellCenter(r,c); ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=16; const g=ctx.createRadialGradient(cx-4,cy-4,2,cx,cy,cell*0.38); g.addColorStop(0,'#ffffff'); g.addColorStop(1,col); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,cell*0.34,0,Math.PI*2); ctx.fill(); ctx.restore(); };
      for(const e of this.enemies) drawUnit(e,e.color);
      drawUnit(this.player,this.player.color);
    }
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  window.game=new G();
})();
</script>
