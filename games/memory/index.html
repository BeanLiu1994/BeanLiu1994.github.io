<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0c0a1e" />
<title>霓虹翻牌 · Neon Memory</title>
<style>
  :root{
    --bg:#0c0a1e; --surface:#16132e; --text:#eef0ff; --muted:#8a86b8;
    --accent:#b388ff; --accent2:#36e0ff; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#b388ff55; --dim:#2a2450; --board:#0a0818;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 20% 0%, #241a48 0%, transparent 60%),
                     radial-gradient(ellipse at 80% 100%, #102a44 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:480px;padding:12px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .title-block h1{font-size:1.4rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:54px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.p .value{color:var(--accent);}
  .score-card.m .value{color:var(--accent2);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:var(--board);}
  .toolbar{display:flex;gap:8px;margin-top:10px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0818;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  .hint{text-align:center;color:var(--muted);font-size:0.72rem;margin-top:8px;line-height:1.5;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.7rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay p{color:var(--muted);font-size:0.9rem;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0818;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>霓虹翻牌 · NEON MEMORY</h1>
      <div class="sub">Match · The · Pairs</div>
    </div>
    <div class="score-panel">
      <div class="score-card p"><div class="label">配对</div><div class="value" id="pairs">0</div></div>
      <div class="score-card m"><div class="label">步数</div><div class="value" id="moves">0</div></div>
      <div class="score-card"><div class="label">最佳</div><div class="value" id="best">–</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">AUTO</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">胜利！</h2>
      <p id="ovText"></p>
      <button class="auto on" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="auto" id="autoBtn">自动游玩</button>
    <button class="ghost" id="restartBtn" style="background:transparent;">重开</button>
  </div>
  <div class="hint"><b>点击</b>翻开卡片，找出相同图案配对 · 全部配对即通关 · 自动模式演示记忆解法</div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const cv=$('cv'), elPairs=$('pairs'), elMoves=$('moves'), elBest=$('best'),
        elBadge=$('badge'), elOverlay=$('overlay'), elOvTitle=$('ovTitle'), elOvText=$('ovText'),
        btnAuto=$('autoBtn'), btnRestart=$('restartBtn'), btnOv=$('ovBtn');

  const COLS=5, ROWS=4, W=432, H=346, bw=W, bh=H;
  const SYM=['🍎','🍌','🍇','🍓','🍒','🍑','🍉','🥝','🍍','🥥'];
  const PAIRS=COLS*ROWS/2; // 10
  let dpr=Math.min(2,(typeof devicePixelRatio!=='undefined'?devicePixelRatio||1:1));
  function setupCanvas(){
    if(!cv||!cv.getContext) return;
    cv.width=bw*dpr; cv.height=bh*dpr;
    cv.style.width=bw+'px'; cv.style.height=bh+'px'; cv.style.maxWidth='100%';
  }
  setupCanvas();
  const ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;
  const GW=W/COLS, GH=H/ROWS;

  let tiles;            // array of {sym, faceUp, matched, anim, glow}
  let faceUp;           // currently face-up unmatched indices (max 2)
  let matchedPairs, moves;
  let over, won, auto, autoReplay, autoIdx, autoTimer, autoFlipB;
  let elapsed, best, winPulse, mismatchFlash;

  try{ best=parseInt(localStorage.getItem('neonmemory_best'))||0; }catch(e){best=0;}

  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }

  function newGame(){
    const syms=[]; for(let p=0;p<PAIRS;p++){ syms.push(SYM[p],SYM[p]); }
    shuffle(syms);
    tiles=syms.map(s=>({sym:s,faceUp:false,matched:false,anim:0,glow:0}));
    faceUp=[]; matchedPairs=0; moves=0;
    over=false; won=false; auto=false; autoReplay=false; autoIdx=0; autoTimer=0; autoFlipB=false;
    elapsed=0; winPulse=0; mismatchFlash=0;
    if(btnAuto){ btnAuto.classList.remove('on'); btnAuto.textContent='自动游玩'; }
    if(elBadge) elBadge.classList.remove('show');
    elOverlay.classList.remove('show');
    elPairs.textContent='0'; elMoves.textContent='0';
    elBest.textContent = best>0 ? best+'步' : '–';
  }

  function flip(i){
    const t=tiles[i]; if(t.faceUp||t.matched) return;
    t.faceUp=true; t.anim=1;
  }
  function unflip(i){ const t=tiles[i]; if(t.matched) return; t.faceUp=false; t.anim=1; }

  function humanFlip(i){
    if(over||auto) return;
    const t=tiles[i]; if(t.faceUp||t.matched) return;
    if(faceUp.length===2) return; // wait for resolve
    flip(i);
    if(faceUp.length<2){ faceUp.push(i); }
    if(faceUp.length===2){
      moves++; elMoves.textContent=moves;
      const [a,b]=faceUp;
      if(tiles[a].sym===tiles[b].sym){ tiles[a].matched=tiles[b].matched=true; tiles[a].glow=tiles[b].glow=1; matchedPairs++; elPairs.textContent=matchedPairs; faceUp=[]; checkWin(); }
      else { const fa=a, fb=b; mismatchFlash=1; setTimeout(()=>{ if(tiles[fa]&&!tiles[fa].matched) unflip(fa); if(tiles[fb]&&!tiles[fb].matched) unflip(fb); faceUp=[]; }, 650); }
    }
  }

  function checkWin(){ if(over) return; if(matchedPairs>=PAIRS) winGame(); }
  function winGame(){
    if(over) return; over=true; won=true; winPulse=1;
    if(best===0||moves<best){ best=moves; try{localStorage.setItem('neonmemory_best',String(best));}catch(e){} }
    elBest.textContent=best+'步';
    if(auto){ elOvTitle.textContent='⚡ 自动通关！'; elOvText.textContent='用 '+moves+' 步配齐 '+PAIRS+' 对'; autoTimer=1.0; }
    else { elOvTitle.textContent='🎉 通关！'; elOvText.textContent='用 '+moves+' 步配齐全部卡片'; elOverlay.classList.add('show'); }
  }

  function setAuto(v){
    auto=v;
    if(btnAuto){ btnAuto.classList.toggle('on',v); btnAuto.textContent=v?'自动中…':'自动游玩'; }
    if(elBadge) elBadge.classList.toggle('show',v);
    if(v){ autoReplay=true; autoIdx=0; autoTimer=0; autoFlipB=false; faceUp=[]; }
  }

  // auto: reveal pairs directly from known layout (guaranteed win)
  function autoStep(){
    if(matchedPairs>=PAIRS) return;
    // find an unmatched pair group
    const first=tiles.findIndex(t=>!t.matched);
    if(first<0) return;
    const sym=tiles[first].sym;
    const second=tiles.findIndex((t,i)=>i>first && !t.matched && t.sym===sym);
    if(second<0) return;
    tiles[first].faceUp=tiles[second].faceUp=true;
    tiles[first].anim=tiles[second].anim=1;
    tiles[first].matched=tiles[second].matched=true; tiles[first].glow=tiles[second].glow=1;
    matchedPairs++; elPairs.textContent=matchedPairs; moves++; elMoves.textContent=moves;
    checkWin();
  }

  // ---- input ----
  function cellAt(e){
    let x=0,y=0;
    try{
      const rect=cv.getBoundingClientRect();
      const cx=(typeof e.clientX==='number')?e.clientX:0;
      const cy=(typeof e.clientY==='number')?e.clientY:0;
      x=((cx-rect.left)/rect.width)*W; y=((cy-rect.top)/rect.height)*H;
    }catch(err){ return -1; }
    const c=Math.floor(x/GW), r=Math.floor(y/GH);
    if(r<0||c<0||r>=ROWS||c>=COLS) return -1;
    return r*COLS+c;
  }
  function onDown(e){ const i=cellAt(e); if(i<0) return; humanFlip(i); e.preventDefault&&e.preventDefault(); }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointerdown',onDown,{passive:false});
    cv.addEventListener('mousedown',onDown,{passive:false});
  }
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto) return; setAuto(!auto); if(auto&&over){ newGame(); setAuto(true);} });
  btnRestart&&btnRestart.addEventListener('click',()=>{ newGame(); setAuto(false); });
  btnOv&&btnOv.addEventListener('click',()=>{ newGame(); setAuto(false); });

  // ---- update ----
  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  function update(dt){
    if(over){
      if(winPulse>0) winPulse=Math.max(0,winPulse-dt*1.4);
      if(auto){ autoTimer-=dt; if(autoTimer<=0){ newGame(); setAuto(true); } }
      return;
    }
    elapsed+=dt;
    if(auto && autoReplay){ autoTimer-=dt; if(autoTimer<=0){ autoStep(); autoTimer=0.22; } }
    if(mismatchFlash>0) mismatchFlash=Math.max(0,mismatchFlash-dt*2);
    for(let i=0;i<tiles.length;i++){ const t=tiles[i]; if(t.anim>0) t.anim=Math.max(0,t.anim-dt*4); if(t.glow>0) t.glow=Math.max(0,t.glow-dt*0.8); }
  }

  // ---- render ----
  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,bw,bh);
    const pad=4;
    for(let i=0;i<tiles.length;i++){
      const r=(i/COLS)|0, c=i%COLS; const x=c*GW, y=r*GH;
      const t=tiles[i];
      // flip animation: scaleX
      let sx=1;
      if(t.anim>0){ const p=t.anim; sx=Math.abs(Math.cos(p*Math.PI)); }
      const cxp=x+GW/2, cyp=y+GH/2;
      ctx.save(); ctx.translate(cxp,cyp); ctx.scale(sx,1); ctx.translate(-cxp,-cyp);
      const showFace = t.matched || (t.faceUp && t.anim<0.5) || (t.faceUp && t.anim===0);
      const back = t.faceUp && t.anim>=0.5 && t.anim<1 ? false : (!t.faceUp);
      if(t.faceUp || t.matched){
        // face
        ctx.fillStyle=t.matched?'rgba(93,255,166,0.16)':'rgba(40,34,80,0.55)';
        ctx.fillRect(x+pad,y+pad,GW-2*pad,GH-2*pad);
        ctx.strokeStyle=t.matched?'#5dffa6':'#b388ff'; ctx.lineWidth=2;
        ctx.shadowColor=t.matched?'#5dffa6':'#b388ff'; ctx.shadowBlur=10+t.glow*16;
        ctx.strokeRect(x+pad,y+pad,GW-2*pad,GH-2*pad);
        ctx.shadowBlur=0;
        ctx.font=(GW*0.5)+'px Segoe UI,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(t.sym, cxp, cyp+1);
      } else {
        // back
        ctx.fillStyle='rgba(30,26,58,0.85)'; ctx.fillRect(x+pad,y+pad,GW-2*pad,GH-2*pad);
        ctx.strokeStyle='rgba(179,136,255,0.4)'; ctx.lineWidth=1.5; ctx.strokeRect(x+pad,y+pad,GW-2*pad,GH-2*pad);
        ctx.fillStyle='rgba(179,136,255,0.5)'; ctx.font='bold '+(GW*0.32)+'px Segoe UI,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('?', cxp, cyp+1);
      }
      ctx.restore();
    }
    if(winPulse>0){ ctx.save(); ctx.globalAlpha=winPulse*0.45; ctx.fillStyle='#5dffa6'; ctx.fillRect(0,0,bw,bh); ctx.restore(); }
  }

  function frame(ts){
    const now=(typeof performance!=='undefined'?(ts!==undefined?ts:performance.now()):Date.now());
    let dt=(now-last)/1000; if(!(dt>0)||dt>0.05) dt=0.016; last=now;
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  newGame();

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;},
    get score(){return matchedPairs;},
    get remaining(){return PAIRS-matchedPairs;},
    get best(){return best;}, get moves(){return moves;}, get elapsed(){return elapsed;},
    startAuto(){ setAuto(true); if(over){ newGame(); setAuto(true);} },
    toggleAuto(){ setAuto(!auto); },
    restart(){ newGame(); setAuto(false); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); },
    tick(dt){ update(dt); render(); },
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get score(){return matchedPairs;}, get remaining(){return PAIRS-matchedPairs;}, get best(){return best;}, get moves(){return moves;}
  };
})();
</script>
</body>
</html>
