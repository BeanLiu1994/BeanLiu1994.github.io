<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹双生 · Neon Binary</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#4dfff0; --accent-glow:#4dfff066; --gold:#ffd54a; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 18% 12%, #102a38 0%, transparent 55%), radial-gradient(ellipse at 82% 88%, #2a1240 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#4dfff0,#4d9bff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#062028; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#062028; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹双生</h1><div class="sub">N E O N &nbsp; B I N A R Y</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Filled</div><div class="value" id="filled">0/64</div></div>
      <div class="score-card best"><div class="label">Solved</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="420" height="420"></canvas></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">New Puzzle</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">每行每列各 4 个 0/1，且不能出现连续三个相同。点格子循环 空→0→1</div>
</div>
<script>
(function(){
  'use strict';
  const N=8;
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const filledEl=document.getElementById('filled'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');

  class Binary {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0;
      this.best=parseInt(localStorage.getItem('binBest')||'0'); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); this.onDown(e); });
      this.restart();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(rect.width||420,420)); const dpr=window.devicePixelRatio||1;
      this.W=w; this.cell=w/N; canvas.width=w*dpr; canvas.height=w*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    genGrid(){ const g=Array.from({length:N},()=>new Array(N).fill(-1));
      const ok=(r,c,v)=>{ g[r][c]=v; let z=0,o=0; for(let i=0;i<N;i++){ if(g[r][i]===0)z++; else if(g[r][i]===1)o++; } if(z>4||o>4){ g[r][c]=-1; return false; }
        for(let i=0;i<=N-3;i++){ if(g[r][i]!==-1&&g[r][i]===g[r][i+1]&&g[r][i]===g[r][i+2]){ g[r][c]=-1; return false; } }
        let zc=0,oc=0; for(let i=0;i<N;i++){ if(g[i][c]===0)zc++; else if(g[i][c]===1)oc++; } if(zc>4||oc>4){ g[r][c]=-1; return false; }
        for(let i=0;i<=N-3;i++){ if(g[i][c]!==-1&&g[i][c]===g[i+1][c]&&g[i][c]===g[i+2][c]){ g[r][c]=-1; return false; } }
        g[r][c]=-1; return true; };
      const fill=(pos)=>{ if(pos===N*N) return true; const r=(pos/N)|0, c=pos%N; const vals=[0,1]; if(Math.random()<0.5) vals.reverse();
        for(const v of vals){ if(ok(r,c,v)){ g[r][c]=v; if(fill(pos+1)) return true; g[r][c]=-1; } } return false; };
      fill(0); return g;
    }
    restart(){ this.stopAuto(); this.over=false; this.win=false; this.sol=this.genGrid();
      this.board=this.sol.map(row=>row.slice()); this.given=this.sol.map(row=>row.map(()=>true));
      // remove ~55%
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(Math.random()<0.55){ this.board[r][c]=-1; this.given[r][c]=false; } }
      this.updateUI();
    }
    updateUI(){ let f=0; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(this.board[r][c]!==-1) f++; filledEl.textContent=f+'/64'; if(!this.over) statusEl.textContent='点格子循环 空→0→1，每行每列各 4 个且不可三连'; }
    onDown(e){ if(this.autoPlay||this.over) return; const rect=canvas.getBoundingClientRect(); const x=(e.clientX-rect.left)*(this.W/rect.width), y=(e.clientY-rect.top)*(this.W/rect.width); const c=Math.floor(x/this.cell), r=Math.floor(y/this.cell); if(r<0||r>=N||c<0||c>=N) return; if(this.given[r][c]) return; const v=this.board[r][c]; this.board[r][c]= v===-1?0:(v===0?1:-1); this.checkWin(); this.updateUI(); }
    checkWin(){ for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(this.board[r][c]===-1) return; if(this.valid()){ this.over=true; this.win=true; this.best++; localStorage.setItem('binBest',String(this.best)); bestEl.textContent=this.best; statusEl.textContent='🎉 解开啦！'; } }
    valid(){ for(let r=0;r<N;r++){ let z=0,o=0; for(let c=0;c<N;c++){ if(this.board[r][c]===0)z++; else if(this.board[r][c]===1)o++; if(c<=N-3&&this.board[r][c]!==-1&&this.board[r][c]===this.board[r][c+1]&&this.board[r][c]===this.board[r][c+2]) return false; } if(z!==4||o!==4) return false; }
      for(let c=0;c<N;c++){ let z=0,o=0; for(let r=0;r<N;r++){ if(this.board[r][c]===0)z++; else if(this.board[r][c]===1)o++; if(r<=N-3&&this.board[r][c]!==-1&&this.board[r][c]===this.board[r+1][c]&&this.board[r][c]===this.board[r+2][c]) return false; } if(z!==4||o!==4) return false; } return true; }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this.autoStep(); }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    autoStep(){ if(!this.autoPlay) return; if(this.over){ this._autoNext(); return; }
      let done=false;
      for(let r=0;r<N&&!done;r++)for(let c=0;c<N&&!done;c++){ if(this.board[r][c]===-1){ this.board[r][c]=this.sol[r][c]; this._autoProgress++; done=true; } }
      if(!done){ this.over=true; this.win=true; this.best++; localStorage.setItem('binBest',String(this.best)); bestEl.textContent=this.best; statusEl.textContent='🎉 解开啦！'; }
      this.updateUI(); this.autoTimer=setTimeout(()=>this.autoStep(), 70);
    }
    _autoNext(){ this.stopAuto(); this.restart(); this.startAuto(); }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.draw(dt); }catch(err){ console.error(err); } }
    draw(){ const W=this.W,cell=this.cell; ctx.clearRect(0,0,W,W);
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const x=c*cell,y=r*cell; const v=this.board[r][c]; const cx=x+cell/2, cy=y+cell/2, rad=cell*0.32;
        if(v===-1){ ctx.strokeStyle='#ffffff22'; ctx.lineWidth=1.5; this.rr(x+cell*0.18,y+cell*0.18,cell*0.64,cell*0.64,6); ctx.stroke(); }
        else { const col=v===0?'#4dfff0':'#ffb86b'; if(this.given[r][c]){ ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=12; ctx.fillStyle=col; } else { ctx.fillStyle=col; ctx.globalAlpha=0.78; }
          if(v===0){ ctx.beginPath(); ctx.arc(cx,cy,rad,0,7); ctx.fill(); } else { this.rr(x+cell*0.2,y+cell*0.2,cell*0.6,cell*0.6,6); ctx.fill(); } if(this.given[r][c]) ctx.restore(); else ctx.globalAlpha=1; }
      }
      ctx.strokeStyle='#ffffff14'; ctx.lineWidth=1; for(let i=1;i<N;i++){ ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,W); ctx.moveTo(0,i*cell); ctx.lineTo(W,i*cell); ctx.stroke(); }
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Binary();
})();
</script>
</body>
</html>
