<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#070713" />
<title>Helix Jump · Neon</title>
<style>
  :root{
    --bg:#070713; --surface:#12122a; --board:#16163a; --text:#e6e9f5; --muted:#8a90b8;
    --accent:#46e6ff; --accent2:#b066ff; --danger:#ff4d6a; --gold:#ffd166; --ok:#4dff91;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #1a1140 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #062038 0%, transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:440px;height:100vh;max-height:780px;display:flex;flex-direction:column;padding:14px;gap:10px;}
  .header{display:flex;align-items:center;justify-content:space-between;}
  .title-block h1{font-size:1.55rem;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff10;border-radius:10px;padding:6px 13px;text-align:center;min-width:58px;}
  .score-card .label{font-size:.52rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.best .value{color:var(--gold);}
  .board-wrap{position:relative;flex:1;min-height:0;background:var(--surface);border:1px solid #ffffff10;border-radius:16px;overflow:hidden;box-shadow:0 0 50px #00000040, 0 0 70px #46e6ff22;}
  .board-wrap, .board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:100%;}
  .controls{display:flex;gap:8px;}
  .btn{flex:1;min-width:80px;padding:11px 14px;border:1px solid #ffffff14;border-radius:11px;background:var(--surface);color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .18s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff12;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#06121a;}
  .btn.primary:hover{box-shadow:0 0 22px #46e6ff55;}
  .btn.auto-on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#06121a;animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 6px #46e6ff44;}50%{box-shadow:0 0 20px #46e6ff88,0 0 38px #b066ff55;}}
  .ai-indicator{display:none;align-items:center;gap:8px;justify-content:center;font-size:.72rem;color:var(--muted);min-height:18px;margin-top:2px;}
  .ai-indicator.show{display:flex;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.7);}}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:5;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#070713dd;backdrop-filter:blur(5px);}
  .overlay-content{position:relative;text-align:center;z-index:1;padding:20px;}
  .overlay-content h2{font-size:1.9rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay-content p{color:var(--muted);margin-bottom:14px;font-size:.85rem;}
  .hint{text-align:center;font-size:.64rem;color:var(--muted);margin-top:2px;line-height:1.5;}
  @media (max-width:400px){.title-block h1{font-size:1.3rem;}.btn{padding:10px;font-size:.76rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Helix Jump</h1><div class="sub">N E O N &nbsp; D E S C E N T</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay-win">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2 id="win-title">Game Over</h2>
        <p id="win-msg">你坠毁了！</p>
        <button class="btn primary" id="btn-again" style="min-width:140px;">再来一局</button>
      </div>
    </div>
  </div>
  <div class="ai-indicator" id="ai-indicator"><span class="ai-dot"></span><span id="ai-status">AI 自动游玩中…</span></div>
  <div class="controls">
    <button class="btn primary" id="btn-auto">自动游玩</button>
    <button class="btn" id="btn-restart">重开</button>
  </div>
  <div class="hint">拖动旋转螺旋塔，让缺口对准小球让其坠落 · 勿碰红色致命段</div>
</div>
<script>
(function(){
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
  const overlay=document.getElementById('overlay-win'), winTitle=document.getElementById('win-title'), winMsg=document.getElementById('win-msg');
  const btnAuto=document.getElementById('btn-auto'), btnRestart=document.getElementById('btn-restart'), btnAgain=document.getElementById('btn-again');
  const aiInd=document.getElementById('ai-indicator'), aiStatus=document.getElementById('ai-status');

  const G=1500, BOUNCE=620, GAP=96, BALL_R=13, SHAFT_FRAC=0.62, GAP_W=84, TOP_MARGIN=150;

  class Helix{
    constructor(){
      this.autoPlay=false; this.over=false; this.score=0;
      this.best=parseInt(localStorage.getItem('helixBest')||'0',10); bestEl.textContent=this.best;
      this.rot=0; this.dragging=false; this.lastX=0;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      this.bindInput();
      this.restart();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){
      const r=canvas.getBoundingClientRect();
      const w=Math.max(280,Math.min(r.width||360,440)), h=Math.max(320,Math.min(r.height||560,720));
      const d=window.devicePixelRatio||1;
      canvas.width=w*d; canvas.height=h*d; ctx.setTransform(d,0,0,d,0,0);
      this.W=w; this.H=h; this.shaft=w*SHAFT_FRAC; this.cx=w/2;
    }
    genLevel(y){
      const baseGapX=this.cx + (Math.random()*2-1)*(this.shaft*0.32);
      const death=Math.random()<0.22;
      let deathX=0;
      if(death){ // place death on the solid side away from gap
        deathX = (Math.random()<0.5? this.cx-this.shaft*0.34 : this.cx+this.shaft*0.34);
      }
      return { y, baseGapX, gapW:GAP_W, death, deathX, passed:false };
    }
    restart(){
      this.over=false; this.score=0; scoreEl.textContent=0;
      this.rot=0; this.ballY=TOP_MARGIN; this.vy=0; this.bouncePulse=0;
      this.levels=[]; this.targetIdx=0;
      let y=TOP_MARGIN+GAP;
      for(let i=0;i<14;i++){ this.levels.push(this.genLevel(y)); y+=GAP; }
      this.lastLevelY=y-GAP;
      overlay.classList.remove('active');
      this.updateUI();
    }
    effGapX(lv){ return lv.baseGapX + this.rot; }
    gapEdges(lv){ const c=this.effGapX(lv); return [c-lv.gapW/2, c+lv.gapW/2]; }
    fitRot(){ // keep effective gaps on-screen friendly
      const lim=this.shaft*0.5;
      if(this.rot>lim) this.rot=lim; if(this.rot<-lim) this.rot=-lim;
    }
    update(dt){
      if(this.over) return;
      const lvl=this.levels[this.targetIdx];
      // auto: align current level gap to ball
      if(this.autoPlay && lvl){
        const target = this.cx - lvl.baseGapX; // rot so effGapX = baseGapX + rot = cx
        this.rot += (target-this.rot)*Math.min(1,dt*6);
        this.fitRot();
      }
      // physics
      this.vy += G*dt; this.ballY += this.vy*dt;
      if(this.bouncePulse>0) this.bouncePulse=Math.max(0,this.bouncePulse-dt*3);
      // collision with current target level
      if(lvl && this.vy>0 && this.ballY+BALL_R>=lvl.y && this.ballY-BALL_R<lvl.y+40){
        const [gl,gr]=this.gapEdges(lvl);
        const fits = (this.cx-BALL_R>=gl && this.cx+BALL_R<=gr);
        if(fits){
          // pass through
          lvl.passed=true; this.score++; scoreEl.textContent=this.score;
          this.targetIdx++;
          if(this.targetIdx>=this.levels.length-2) this.extend();
        } else {
          // bounce or die
          if(lvl.death){
            const d=Math.abs(this.cx-lvl.deathX);
            if(d<this.shaft*0.18){ this.gameOver(); return; }
          }
          this.ballY=lvl.y-BALL_R; this.vy=-BOUNCE; this.bouncePulse=1;
        }
      }
      // camera: keep ball in upper third
      this.camY=this.ballY-TOP_MARGIN;
      // endless: shift world if ball far down
      if(this.ballY-this.camY>this.H*0.6){
        const shift=this.ballY-this.camY-this.H*0.6;
        this.ballY-=shift; this.camY+=shift;
        for(const l of this.levels) l.y-=shift;
        this.lastLevelY-=shift;
      }
    }
    extend(){
      let y=this.lastLevelY+GAP;
      for(let i=0;i<6;i++){ this.levels.push(this.genLevel(y)); y+=GAP; }
      this.lastLevelY=y-GAP;
    }
    gameOver(){
      this.over=true;
      if(this.score>this.best){ this.best=this.score; localStorage.setItem('helixBest',this.best); bestEl.textContent=this.best; }
      winTitle.textContent='Game Over'; winMsg.textContent='本局得分 '+this.score+' · 最佳 '+this.best;
      overlay.classList.add('active');
      if(this.autoPlay) this.stopAuto();
    }
    draw(){
      ctx.clearRect(0,0,this.W,this.H);
      // shaft walls
      const wl=this.cx-this.shaft/2, wr=this.cx+this.shaft/2;
      ctx.strokeStyle='#2a2a55'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(wl,0); ctx.lineTo(wl,this.H); ctx.moveTo(wr,0); ctx.lineTo(wr,this.H); ctx.stroke();
      // soft inner glow column
      const g=ctx.createLinearGradient(0,0,0,this.H); g.addColorStop(0,'#46e6ff10'); g.addColorStop(1,'#b066ff10');
      ctx.fillStyle=g; ctx.fillRect(wl,0,this.shaft,this.H);
      // levels
      for(let i=this.targetIdx-1;i<this.levels.length;i++){
        const lv=this.levels[i]; if(!lv) continue;
        const sy=lv.y-this.camY; if(sy<-40||sy>this.H+40) continue;
        const [gl,gr]=this.gapEdges(lv);
        ctx.fillStyle = lv.passed? '#2a2a55' : '#3a3a7a';
        // left segment
        if(gl>wl){ ctx.fillRect(wl,sy-7,gl-wl,14); }
        // right segment
        if(gr<wr){ ctx.fillRect(gr,sy-7,wr-gr,14); }
        // gap edges glow
        ctx.fillStyle=lv.passed?'#4dff9144':'#46e6ff55';
        if(gl>wl){ ctx.fillRect(gl-3,sy-9,6,18); }
        if(gr<wr){ ctx.fillRect(gr-3,sy-9,6,18); }
        // death zone
        if(lv.death){
          const dx=lv.deathX;
          ctx.fillStyle='#ff4d6a';
          if(dx<this.cx) ctx.fillRect(wl,sy-7,Math.min(dx-wl,gr-wl>0?gl-wl:dx-wl),14);
          else ctx.fillRect(Math.max(gr,dx)-3,sy-7,wr-Math.max(gr,dx)+3,14);
        }
        // level number faint
      }
      // ball
      const by=this.ballY-this.camY;
      ctx.save();
      ctx.shadowColor='#46e6ff'; ctx.shadowBlur=18+this.bouncePulse*14;
      const bg=ctx.createRadialGradient(this.cx,by,2,this.cx,by,BALL_R);
      bg.addColorStop(0,'#ffffff'); bg.addColorStop(.4,'#9fefff'); bg.addColorStop(1,'#2aa6d6');
      ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(this.cx,by,BALL_R,0,7); ctx.fill();
      ctx.restore();
    }
    loop(ts){
      if(!this._last) this._last=ts;
      const dt=Math.min(0.05,(ts-this._last)/1000||0.016); this._last=ts;
      this.update(dt); this.draw();
      requestAnimationFrame(this.loop);
    }
    updateUI(){
      scoreEl.textContent=this.score;
      if(this.autoPlay) aiStatus.textContent='AI · 分数 '+this.score;
    }
    startAuto(){ this.autoPlay=true; btnAuto.textContent='自动中…'; btnAuto.classList.add('auto-on'); aiInd.classList.add('show'); this.updateUI(); }
    stopAuto(){ this.autoPlay=false; btnAuto.textContent='自动游玩'; btnAuto.classList.remove('auto-on'); aiInd.classList.remove('show'); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    bindInput(){
      const setRotFromX=(clientX)=>{
        const r=canvas.getBoundingClientRect();
        const x=(clientX-r.left)/r.width*this.W;
        const delta=(x-this.lastX); this.lastX=x;
        this.rot += delta*0.9; this.fitRot();
      };
      const down=(e)=>{ if(this.autoPlay||this.over) return; this.dragging=true; const p=pt(e); this.lastX=p.x; e.preventDefault(); };
      const move=(e)=>{ if(!this.dragging||this.autoPlay||this.over) return; setRotFromX(pt(e).x); e.preventDefault(); };
      const up=()=>{ this.dragging=false; };
      const pt=(e)=>{ const t=e.touches&&e.touches[0]?e.touches[0]:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e); const r=canvas.getBoundingClientRect(); return {x:(t.clientX-r.left)/r.width*this.W, y:(t.clientY-r.top)/r.height*this.H}; };
      canvas.addEventListener('pointerdown',down);
      canvas.addEventListener('pointermove',move);
      window.addEventListener('pointerup',up);
      canvas.addEventListener('touchstart',down,{passive:false});
      canvas.addEventListener('touchmove',move,{passive:false});
      window.addEventListener('touchend',up);
    }
  }
  window.game=new Helix();
  btnAuto.addEventListener('click',()=>game.toggleAuto());
  btnRestart.addEventListener('click',()=>game.restart());
  btnAgain.addEventListener('click',()=>game.restart());
})();
</script>
</body>
</html>
