<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a1a" />
<title>Tetris · Neon</title>
<style>
  :root {
    --bg:#0a0a1a; --surface:#12122a; --board:#16163a; --text:#e0e0f0; --muted:#8888aa;
    --accent:#7c5cfc; --accent-glow:#7c5cfc66; --danger:#ff4d6a; --gold:#ffd700;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:var(--bg);
    background-image:
      radial-gradient(ellipse at 15% 15%, #201040 0%, transparent 55%),
      radial-gradient(ellipse at 85% 85%, #102038 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none; touch-action:none;
  }
  .container { width:100%; max-width:460px; padding:16px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:12px; }
  .title-block h1 { font-size:1.9rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),#b388ff,#7c5cfc);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:6px 14px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.56rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.15rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .play-area { display:flex; gap:12px; align-items:flex-start; }
  .board-wrap { position:relative; flex:1; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:auto; border-radius:8px; background:var(--board); }
  .side { display:flex; flex-direction:column; gap:8px; width:74px; }
  .next-box { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:8px; text-align:center; }
  .next-box .label { font-size:0.55rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:4px; }
  .next-box canvas { width:58px; height:58px; background:transparent; margin:0 auto; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#0a0a1aee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; }
  .overlay-content h2 { font-size:2rem; font-weight:800; margin-bottom:6px; color:var(--danger); }
  .overlay-content p { color:var(--muted); margin-bottom:16px; font-size:0.9rem; }
  .controls { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .btn { flex:1; min-width:84px; padding:11px 14px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.82rem; font-weight:600; cursor:pointer; transition:all .2s; letter-spacing:.5px; text-align:center; }
  .btn:hover { background:#ffffff10; }
  .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { box-shadow:0 0 20px var(--accent-glow); }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#fff; animation:pulse-glow 2s infinite; --glow:var(--accent-glow); }
  @keyframes pulse-glow { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .pad { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .pad .btn { font-size:1.3rem; padding:14px 0; }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:20px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:blink .8s infinite; }
  @keyframes blink { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:8px; font-size:0.7rem; color:var(--muted); }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
  @media (max-width:400px){ .title-block h1{font-size:1.4rem;} .btn{padding:10px 10px; font-size:.76rem;} }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Tetris</h1><div class="sub">N E O N &nbsp; E D I T I O N</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>

  <div class="play-area">
    <div class="board-wrap" id="board-wrap">
      <canvas id="game" width="300" height="600"></canvas>
      <div class="overlay" id="overlay-lose">
        <div class="overlay-bg"></div>
        <div class="overlay-content">
          <h2>Game Over</h2>
          <p id="lose-msg">Stack reached the top</p>
          <button class="btn primary" onclick="game.restart()">Try Again</button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="next-box"><div class="label">Next</div><canvas id="next" width="58" height="58"></canvas></div>
      <div style="background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:8px;text-align:center;">
        <div class="label" style="font-size:0.55rem;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;">Lines</div>
        <div id="lines" style="font-size:1.1rem;font-weight:700;">0</div>
      </div>
      <div style="background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:8px;text-align:center;">
        <div class="label" style="font-size:0.55rem;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;">Level</div>
        <div id="level" style="font-size:1.1rem;font-weight:700;">1</div>
      </div>
    </div>
  </div>

  <div class="pad">
    <button class="btn" onclick="game.move(-1)">◀</button>
    <button class="btn" onclick="game.rotate()">⟳</button>
    <button class="btn" onclick="game.move(1)">▶</button>
    <button class="btn" onclick="game.hardDrop()">▼</button>
  </div>

  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>

  <div class="ai-indicator" id="ai-indicator" style="display:none">
    <div class="ai-dot"></div><span id="ai-status">AI thinking...</span>
  </div>

  <div class="stats-bar">
    <span id="pieces-stat">Pieces: 0</span>
    <span id="pps-stat">Speed: 1.0/s</span>
  </div>
</div>

<script>
(function(){
  'use strict';
  const COLS=10, ROWS=20;
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  const ncanvas=document.getElementById('next');
  const nctx=ncanvas.getContext('2d');

  const SHAPES={
    I:{color:'#4dffd1',cells:[[0,1],[1,1],[2,1],[3,1]]},
    O:{color:'#ffd700',cells:[[1,0],[2,0],[1,1],[2,1]]},
    T:{color:'#b388ff',cells:[[1,0],[0,1],[1,1],[2,1]]},
    S:{color:'#4dff91',cells:[[1,0],[2,0],[0,1],[1,1]]},
    Z:{color:'#ff4d6a',cells:[[0,0],[1,0],[1,1],[2,1]]},
    J:{color:'#4d9dff',cells:[[0,0],[0,1],[1,1],[2,1]]},
    L:{color:'#ff9f4d',cells:[[2,0],[0,1],[1,1],[2,1]]}
  };
  const TYPES=Object.keys(SHAPES);

  function fitCanvas(){
    const w=canvas.clientWidth||300;
    const dpr=window.devicePixelRatio||1;
    canvas.width=w*dpr; canvas.height=w*2*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return w;
  }
  function cellSize(){ return canvas.clientWidth/COLS; }

  function rotateCells(cells){
    // rotate 90deg CW within 4x4
    let maxX=0,maxY=0; cells.forEach(([x,y])=>{ if(x>maxX)maxX=x; if(y>maxY)maxY=y; });
    return cells.map(([x,y])=>[maxY-y,x]);
  }

  class Tetris{
    constructor(){
      this.bestScore=parseInt(localStorage.getItem('bestTetris')||'0');
      this.autoPlay=false; this.autoTimer=null; this.tickTimer=null;
      this.pieces=0;
      this.bindInput();
      this.restart();
    }
    restart(){
      this.stopAuto(); this.stopTick();
      this.cw=fitCanvas(); this.cs=this.cw/COLS;
      this.board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
      this.score=0; this.lines=0; this.level=1; this.pieces=0;
      this.over=false;
      this.bag=[];
      this.spawn();
      document.getElementById('overlay-lose').classList.remove('active');
      this.updateUI(); this.loop();
    }
    randType(){ if(this.bag.length===0){ this.bag=[...TYPES]; for(let i=this.bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [this.bag[i],this.bag[j]]=[this.bag[j],this.bag[i]];} } return this.bag.pop(); }
    spawn(){
      const type=this.randType();
      const def=SHAPES[type];
      this.cur={type,color:def.color,cells:def.cells.map(c=>[...c]),x:3,y:-1};
      this.nextType=this.randType();
      if(this.collides(this.cur.cells,this.cur.x,this.cur.y)){ this.gameOver(); }
    }
    collides(cells,x,y){
      for(const [cx,cy] of cells){
        const gx=x+cx, gy=y+cy;
        if(gx<0||gx>=COLS||gy>=ROWS) return true;
        if(gy>=0 && this.board[gy][gx]) return true;
      }
      return false;
    }
    merge(){
      for(const [cx,cy] of this.cur.cells){ const gy=this.cur.y+cy, gx=this.cur.x+cx; if(gy>=0) this.board[gy][gx]=this.cur.color; }
    }
    move(dir){
      if(this.autoPlay||this.over) return false;
      if(!this.collides(this.cur.cells,this.cur.x+dir,this.cur.y)){ this.cur.x+=dir; this.draw(); return true; }
      return false;
    }
    rotate(){
      if(this.autoPlay||this.over) return;
      if(this.cur.type==='O') return;
      const r=rotateCells(this.cur.cells);
      for(const k of [0,-1,1,-2,2]){
        if(!this.collides(r,this.cur.x+k,this.cur.y)){ this.cur.cells=r; this.cur.x+=k; this.draw(); return; }
      }
    }
    softDrop(){
      if(this.autoPlay||this.over) return;
      if(!this.collides(this.cur.cells,this.cur.x,this.cur.y+1)){ this.cur.y++; this.draw(); }
      else this.lock();
    }
    hardDrop(){
      if(this.autoPlay||this.over) return;
      let d=0;
      while(!this.collides(this.cur.cells,this.cur.x,this.cur.y+1)){ this.cur.y++; d++; }
      this.score+=d*2; this.lock();
    }
    lock(){
      this.merge();
      const cleared=this.clearLines();
      if(cleared){ this.lines+=cleared; this.score+= [0,100,300,500,800][cleared]*this.level; this.level=1+Math.floor(this.lines/10); }
      this.pieces++;
      this.spawn();
      this.updateUI();
    }
    clearLines(){
      let cleared=0;
      for(let y=ROWS-1;y>=0;y--){
        if(this.board[y].every(c=>c)){
          this.board.splice(y,1); this.board.unshift(Array(COLS).fill(null)); cleared++; y++;
        }
      }
      return cleared;
    }
    gameOver(){
      this.over=true; this.stopTick();
      if(this.autoPlay) this.stopAuto();
      if(this.score>this.bestScore){ this.bestScore=this.score; localStorage.setItem('bestTetris',this.bestScore); }
      document.getElementById('lose-msg').textContent='Score '+this.score;
      document.getElementById('overlay-lose').classList.add('active');
    }
    tick(){
      if(this.over) return;
      if(!this.collides(this.cur.cells,this.cur.x,this.cur.y+1)){ this.cur.y++; this.draw(); }
      else this.lock();
    }
    loop(){
      this.stopTick();
      const ms=()=>Math.max(120, 600-this.level*45);
      this.tickTimer=setInterval(()=>{ if(!this.autoPlay) this.tick(); }, ms());
    }
    stopTick(){ if(this.tickTimer){ clearInterval(this.tickTimer); this.tickTimer=null; } }

    // ---- AI: El-Tetris style weights ----
    bestPlacement(){
      let best=null, bestScore=-Infinity;
      const cells0=SHAPES[this.cur.type].cells;
      for(let rot=0; rot<4; rot++){
        const cells=rot===0?cells0:rotateNCells(cells0,rot);
        if(this.cur.type==='O'&&rot>0) continue;
        // column range
        let minX=99,maxX=-99; cells.forEach(([x])=>{ if(x<minX)minX=x; if(x>maxX)maxX=x; });
        for(let ox=-minX; ox<COLS-maxX; ox++){
          // drop
          let y=-1; while(!this.collides(cells,ox,y+1)) y++;
          if(this.collides(cells,ox,y)) continue;
          const test=this.board.map(r=>r.slice());
          for(const [cx,cy] of cells){ test[y+cy][ox+cx]=1; }
          const s=this.evaluate(test);
          if(s>bestScore){ bestScore=s; best={cells,x:ox,y,rot}; }
        }
      }
      return best;
    }
    evaluate(b){
      const agg=[]; let holes=0, aggH=0, lines=0, bump=0, prev=null;
      for(let x=0;x<COLS;x++){
        let h=0; let seen=false;
        for(let y=0;y<ROWS;y++){ if(b[y][x]){ if(!seen){ h=ROWS-y; seen=true; } } else if(seen){ holes++; } }
        agg.push(h); aggH+=h;
        if(prev!==null) bump+=Math.abs(h-prev); prev=h;
      }
      for(let y=0;y<ROWS;y++) if(b[y].every(c=>c)) lines++;
      // weights (El-Tetris): landingHeight -4.5, rows -3.4, holes -7.9, bump -3.4
      const landing = bestLanding(agg,b);
      return landing*-4.5 + lines*-3.4 + holes*-7.9 + bump*-3.4;
    }

    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){
      this.autoPlay=true; const b=document.getElementById('btn-auto');
      b.textContent='Auto: ON'; b.classList.add('auto-on');
      document.getElementById('ai-indicator').style.display='flex';
      this.autoStep();
    }
    stopAuto(){
      this.autoPlay=false; if(this.autoTimer){ clearTimeout(this.autoTimer); this.autoTimer=null; }
      const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on');
      document.getElementById('ai-indicator').style.display='none';
    }
    autoStep(){
      if(!this.autoPlay||this.over){ if(this.over) this.stopAuto(); return; }
      const p=this.bestPlacement();
      if(p){
        // align rotation
        let cur=this.cur.cells; let guard=0;
        while(!sameCells(cur,p.cells) && guard<4){ cur=rotateCells(cur); this.cur.cells=cur; guard++; }
        // move horizontally
        const dir = p.x>this.cur.x?1:(p.x<this.cur.x?-1:0);
        if(dir!==0){ this.cur.x+=dir; }
        else {
          // drop to target
          let targetY=this.cur.y;
          while(!this.collides(this.cur.cells,this.cur.x,targetY+1)) targetY++;
          this.cur.y=targetY;
          document.getElementById('ai-status').textContent='AI: placing '+this.cur.type+' · '+this.score;
          this.lock();
          this.autoTimer=setTimeout(()=>this.autoStep(), 260);
          return;
        }
        this.draw();
        this.autoTimer=setTimeout(()=>this.autoStep(), 60);
      }
    }

    updateUI(){
      document.getElementById('score').textContent=this.score;
      document.getElementById('best').textContent=this.bestScore;
      document.getElementById('lines').textContent=this.lines;
      document.getElementById('level').textContent=this.level;
      document.getElementById('pieces-stat').textContent='Pieces: '+this.pieces;
      document.getElementById('pps-stat').textContent='Speed: '+(1000/Math.max(120,600-this.level*45)).toFixed(1)+'/s';
      this.draw();
    }

    draw(){
      const cs=cellSize();
      ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
      // grid
      ctx.strokeStyle='#ffffff08'; ctx.lineWidth=1;
      for(let x=0;x<=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*cs,0); ctx.lineTo(x*cs,ROWS*cs); ctx.stroke(); }
      for(let y=0;y<=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*cs); ctx.lineTo(COLS*cs,y*cs); ctx.stroke(); }
      // settled
      for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(this.board[y][x]) this.drawCell(x,y,this.board[y][x],cs);
      // ghost + current
      if(this.cur){
        let gy=this.cur.y; while(!this.collides(this.cur.cells,this.cur.x,gy+1)) gy++;
        ctx.globalAlpha=0.22;
        for(const [cx,cy] of this.cur.cells){ const yy=gy+cy; if(yy>=0) this.drawCell(this.cur.x+cx,yy,this.cur.color,cs); }
        ctx.globalAlpha=1;
        for(const [cx,cy] of this.cur.cells){ const yy=this.cur.y+cy; if(yy>=0) this.drawCell(this.cur.x+cx,yy,this.cur.color,cs); }
      }
      // next
      nctx.clearRect(0,0,58,58);
      const def=SHAPES[this.nextType]; const ncs=12;
      const ox=(58-def.cells.reduce((m,[x])=>Math.max(m,x),0)*ncs)/2;
      const oy=(58-def.cells.reduce((m,[,y])=>Math.max(m,y),0)*ncs)/2;
      def.cells.forEach(([x,y])=>{ nctx.fillStyle=def.color; nctx.shadowColor=def.color; nctx.shadowBlur=6;
        nctx.fillRect(ox+x*ncs+1,oy+y*ncs+1,ncs-2,ncs-2); });
      nctx.shadowBlur=0;
    }
    drawCell(x,y,color,cs){
      ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=8;
      ctx.fillRect(x*cs+1,y*cs+1,cs-2,cs-2);
      ctx.shadowBlur=0;
      ctx.fillStyle='#ffffff22'; ctx.fillRect(x*cs+1,y*cs+1,cs-2,(cs-2)*0.35);
    }

    bindInput(){
      document.addEventListener('keydown',(e)=>{
        if(this.autoPlay||this.over) return;
        if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){ e.preventDefault(); this.move(-1); }
        else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){ e.preventDefault(); this.move(1); }
        else if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){ e.preventDefault(); this.rotate(); }
        else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){ e.preventDefault(); this.softDrop(); }
        else if(e.key===' '){ e.preventDefault(); this.hardDrop(); }
      });
      const wrap=document.getElementById('board-wrap');
      let sx=0,sy=0,tracking=false,fired=false,activeId=null,lastMove=0;
      const TH=22;
      wrap.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over||activeId!==null) return; activeId=e.pointerId; sx=e.clientX; sy=e.clientY; tracking=true; fired=false; try{wrap.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
      wrap.addEventListener('pointermove',(e)=>{
        if(!tracking||this.autoPlay||this.over||e.pointerId!==activeId) return;
        const dx=e.clientX-sx, dy=e.clientY-sy;
        if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>=TH){
          const now=Date.now(); if(now-lastMove>90){ if(dx>0) this.move(1); else this.move(-1); lastMove=now; sx=e.clientX; }
        } else if(dy>TH && Math.abs(dy)>Math.abs(dx)){
          fired=true; this.softDrop(); sy=e.clientY;
        }
      });
      const end=(e)=>{ if(e.pointerId!==activeId) return; activeId=null; tracking=false;
        if(!fired && !this.autoPlay && !this.over){
          const dx=e.clientX-sx, dy=e.clientY-sy;
          if(Math.abs(dx)<TH && Math.abs(dy)<TH) this.rotate(); // tap = rotate
        }
      };
      wrap.addEventListener('pointerup',end);
      wrap.addEventListener('pointercancel',end);
      window.addEventListener('resize',()=>{ this.cw=fitCanvas(); this.cs=this.cw/COLS; this.draw(); });
    }
  }
  function rotateNCells(cells,n){ let c=cells.map(c=>[...c]); for(let i=0;i<n;i++) c=rotateCells(c); return c; }
  function sameCells(a,b){ if(a.length!==b.length) return false; const sa=a.map(c=>c.join(',')).sort().join('|'); const sb=b.map(c=>c.join(',')).sort().join('|'); return sa===sb; }
  function bestLanding(agg,b){ let m=99; agg.forEach(h=>{ if(h<m) m=h; }); return m; }
  window.game=new Tetris();
})();
</script>
</body>
</html>
