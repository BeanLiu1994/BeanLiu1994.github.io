<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>蝎尾纸牌 · Scorpion</title>
<style>
  :root{
    --bg:#0a0a12; --surface:#15152a; --board:#0e0e1c; --text:#eef0ff;
    --muted:#8a8fc0; --accent:#ff7a4d; --accent-glow:rgba(255,122,77,.55);
    --gold:#ffd84d; --red:#ff5d6c; --green:#3ecf8e; --cyan:#5ad1ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);touch-action:none;overscroll-behavior:none}
  .app{display:flex;flex-direction:column;height:100%;max-width:680px;margin:0 auto;padding:10px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 8px}
  h1{font-size:19px;margin:0;letter-spacing:.5px;
    background:linear-gradient(90deg,#ff7a4d,#ffd84d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .toolbar{display:flex;gap:8px}
  button{font:inherit;font-size:14px;color:var(--text);background:var(--surface);
    border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;cursor:pointer;
    transition:transform .12s ease,box-shadow .2s ease,background .2s}
  button:active{transform:scale(.95)}
  button.on{background:linear-gradient(90deg,#7a3a1a,#ff7a4d);box-shadow:0 0 16px var(--accent-glow)}
  .board-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  .board-wrap *{touch-action:none}
  canvas{width:100%;height:100%;max-width:min(96vw,660px);max-height:92%;border-radius:14px;
    background:var(--board);box-shadow:0 0 40px rgba(255,122,77,.12),inset 0 0 0 1px rgba(255,255,255,.05)}
  .status{text-align:center;color:var(--muted);font-size:13px;padding:8px 4px;min-height:20px}
  .hint{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;padding:2px 8px 6px;opacity:.85}
  .banner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(10,10,18,.74);backdrop-filter:blur(6px);z-index:20}
  .banner.show{display:flex;animation:pop .3s ease}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  .card{background:var(--surface);border:1px solid rgba(255,255,255,.12);border-radius:16px;
    padding:26px 30px;text-align:center;box-shadow:0 0 50px rgba(255,122,77,.25)}
  .card h2{margin:0 0 6px;font-size:26px;color:var(--gold)}
  .card p{margin:4px 0;color:var(--muted);font-size:14px}
  .card button{margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>蝎尾纸牌 · Scorpion</h1>
    <div class="toolbar">
      <button id="newBtn">新局</button>
      <button id="autoBtn">自动</button>
    </div>
  </header>
  <div class="board-wrap"><canvas id="c"></canvas></div>
  <div class="status" id="status"></div>
  <div class="hint">点击一串同花递减的牌再点目标列移动；凑齐 A→K 同花整列即可收走。自动模式会自行寻找最优走法。</div>
</div>
<div class="banner" id="banner"><div class="card">
  <h2 id="bannerTitle">通关！</h2>
  <p id="bannerMsg"></p>
  <button id="bannerBtn">再来</button>
</div></div>
<script>
const PNOW = () => (typeof performance!=='undefined' && performance.now) ? performance.now() : Date.now();
const SUITS=['♠','♥','♦','♣'];
const SUITCOL=['#e6ecff','#ff7a8a','#ffd84d','#7ab8ff'];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rankStr(r){ return r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r); }

class Scorpion {
  constructor(){
    this.canvas=document.getElementById('c');
    this.ctx=this.canvas.getContext('2d');
    this.autoPlay=false; this._autoProgress=0; this._t=null;
    this._cssW=0; this._last=null;
    this.score=0; this.best=parseFloat(localStorage.getItem('scBest')||'0')||0;
    this.sel=-1; this.selK=-1;
    this.fit();
    this.restart();
    this._bind();
    this._raf=requestAnimationFrame(this.loop.bind(this));
  }
  fit(){
    const rect=this.canvas.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    const w=rect.width||360,h=rect.height||360;
    this.W=w; this.H=h;
    this.canvas.width=Math.round(w*dpr); this.canvas.height=Math.round(h*dpr);
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this._cssW=rect.width;
  }
  restart(){
    this.stopAuto();
    this.deal();
    this.over=false; this.found=0; this._hideBanner(); this._updateStatus();
  }
  deal(){
    const deck=[];
    for(let s=0;s<4;s++) for(let r=1;r<=13;r++) deck.push({s,r});
    shuffle(deck);
    this.cols=[]; for(let i=0;i<7;i++) this.cols.push([]);
    let k=0;
    for(let i=0;i<7;i++){ const n=i<4?7:6; for(let j=0;j<n;j++) this.cols[i].push(deck[k++]); }
    this.reserve=deck.slice(k); // 3 cards
    this._resIdx=0;
  }
  // is the run starting at index k in column i a valid same-suit descending sequence?
  validRun(i,k){
    const col=this.cols[i];
    for(let t=k;t<col.length-1;t++){ if(col[t].s!==col[t+1].s) return false; if(col[t].r!==col[t+1].r+1) return false; }
    return true;
  }
  canPlace(group, dest){
    if(dest.length===0) return true;
    const top=dest[dest.length-1];
    return group[0].s===top.s && group[0].r===top.r+1;
  }
  tryMove(i,k,j){
    if(i===j) return false;
    const col=this.cols[i];
    if(k<0||k>=col.length) return false;
    if(!this.validRun(i,k)) return false;
    const group=col.slice(k);
    if(!this.canPlace(group,this.cols[j])) return false;
    for(const c of group) this.cols[j].push(c);
    this.cols[i]=col.slice(0,k);
    this._checkFound();
    this._autoProgress++;
    return true;
  }
  _checkFound(){
    for(let i=0;i<7;i++){
      const col=this.cols[i];
      if(col.length===13 && col[0].r===13){
        // full K..A same suit?
        let ok=true; for(let t=0;t<13;t++){ if(col[t].s!==col[0].s || col[t].r!==13-t) { ok=false; break; } }
        if(ok){ this.cols[i]=[]; this.found++; this.score+=200; if(this.found===4){ this.win(); } }
      }
    }
  }
  win(){
    if(this.autoPlay){ this.restart(); return; }
    this.over=true; if(this.score>this.best){ this.best=this.score; localStorage.setItem('scBest',this.best); } this._showBanner('通关！','得分 '+this.score);
  }
  dealReserve(){
    if(this._resIdx>=this.reserve.length) return false;
    const c=this.reserve[this._resIdx++]; this.cols[this._resIdx%3].push(c); this._autoProgress++; return true;
  }
  autoStep(){
    // gather legal moves
    let best=null,bestScore=-1e9;
    for(let i=0;i<7;i++){
      const col=this.cols[i]; if(col.length===0) continue;
      for(let k=0;k<col.length;k++){
        if(!this.validRun(i,k)) continue;
        const group=col.slice(k);
        const completes = (group.length===13 && group[0].r===13);
        for(let j=0;j<7;j++){
          if(j===i) continue;
          if(!this.canPlace(group,this.cols[j])) continue;
          let score = group.length; // longer run preferred
          if(completes) score+=1000;
          if(this.cols[j].length===0) score-=2; // avoid needless emptying unless helps
          // bonus if it empties source column (frees space)
          if(k===0) score+=1;
          if(score>bestScore){ bestScore=score; best={i,k,j,completes}; }
        }
      }
    }
    if(best){
      this.tryMove(best.i,best.k,best.j);
      if(this.found===4) return;
      return;
    }
    // no move: use reserve
    if(this.dealReserve()) return;
    // truly stuck -> redeal (keep auto alive)
    if(this.autoPlay){ this.redeal(); return; }
  }
  redeal(){
    this.deal(); this.found=0; this.over=false; this._hideBanner(); this._updateStatus();
  }
  schedule(fn,ms){ if(this._t){ clearTimeout(this._t); } this._t=setTimeout(()=>{ this._t=null; fn(); },ms); }
  maybeAuto(){ if(!this.autoPlay||this.over) return; if(this._t) return; this.schedule(()=>this.autoStep(),420); }
  toggleAuto(){ this.autoPlay?this.stopAuto():this.startAuto(); }
  startAuto(){ this.autoPlay=true; this._autoProgress=0; this._hideBanner(); this.sel=-1; this.maybeAuto();
    document.getElementById('autoBtn').classList.add('on'); document.getElementById('autoBtn').textContent='停止'; this._updateStatus(); }
  stopAuto(){ this.autoPlay=false; if(this._t){ clearTimeout(this._t); this._t=null; }
    document.getElementById('autoBtn').classList.remove('on'); document.getElementById('autoBtn').textContent='自动'; }
  _bind(){
    const cv=this.canvas;
    cv.addEventListener('pointerdown',e=>{ e.preventDefault(); if(this.autoPlay) return; const r=cv.getBoundingClientRect(); this.onTap(e.clientX-r.left,e.clientY-r.top); });
    document.getElementById('newBtn').onclick=()=>this.restart();
    document.getElementById('autoBtn').onclick=()=>this.toggleAuto();
    document.getElementById('bannerBtn').onclick=()=>{ this._hideBanner(); this.score=0; this.restart(); };
  }
  onTap(x,y){
    const cell=Math.min((this.W*0.92)/7, this.H*0.13);
    const cw=cell*0.92, ch=cell*1.32, gap=cell*0.13;
    const colW=(this.W*0.96)/7;
    const ci=Math.floor(x/(colW));
    if(ci<0||ci>6) return;
    const col=this.cols[ci];
    const x0=this.W*0.02+ci*colW+(colW-cw)/2;
    let ki=-1;
    for(let t=0;t<col.length;t++){
      const yy=this.H*0.04+t*gap;
      if(x>=x0&&x<=x0+cw&&y>=yy&&y<=yy+ch){ ki=t; break; }
    }
    if(ki<0) return;
    if(this.sel===ci){ // toggle off
      this.sel=-1; return;
    }
    if(this.sel>=0){
      if(this.tryMove(this.sel,this.selK,ci)){ this.sel=-1; this._updateStatus(); return; }
    }
    if(this.validRun(ci,ki)){ this.sel=ci; this.selK=ki; }
  }
  loop(ts){
    const rect=this.canvas.getBoundingClientRect();
    if(rect.width && rect.width!==this._cssW) this.fit();
    const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016);
    this._last=ts;
    if(this.autoPlay) this.maybeAuto();
    this.render();
    this._raf=requestAnimationFrame(this.loop.bind(this));
  }
  render(){
    const ctx=this.ctx,W=this.W,H=this.H;
    ctx.clearRect(0,0,W,H);
    const colW=(W*0.96)/7;
    const cell=Math.min(colW*0.98, H*0.135);
    const cw=cell*0.9, ch=cell*1.34, gap=cell*0.16;
    for(let i=0;i<7;i++){
      const x0=W*0.02+i*colW+(colW-cw)/2;
      const col=this.cols[i];
      if(col.length===0){ ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.setLineDash([4,4]); ctx.strokeRect(x0,this.H*0.04,cw,ch); ctx.setLineDash([]); }
      for(let t=0;t<col.length;t++){
        const c=col[t]; const yy=this.H*0.04+t*gap;
        const selected=(this.sel===i&&t>=this.selK);
        ctx.save();
        if(selected){ ctx.shadowColor='#ffd84d'; ctx.shadowBlur=14; }
        ctx.fillStyle='#1b1b30'; rrect(ctx,x0,yy,cw,ch,6); ctx.fill();
        ctx.strokeStyle=selected?'#ffd84d':'rgba(255,255,255,.18)'; ctx.lineWidth=selected?2:1; ctx.stroke();
        ctx.fillStyle=SUITCOL[c.s]; ctx.font='bold '+(cw*0.34)+'px system-ui'; ctx.textBaseline='middle';
        ctx.fillText(rankStr(c.r),x0+cw*0.12,yy+ch*0.26);
        ctx.fillText(SUITS[c.s],x0+cw*0.12,yy+ch*0.62);
        ctx.restore();
      }
    }
    // reserve pile indicator
    ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font=(W*0.03)+'px system-ui'; ctx.textBaseline='top';
    ctx.fillText('预留 '+(this.reserve.length-this._resIdx), W*0.02, H-22);
  }
  _showBanner(t,m){ document.getElementById('bannerTitle').textContent=t; document.getElementById('bannerMsg').textContent=m; document.getElementById('banner').classList.add('show'); }
  _hideBanner(){ document.getElementById('banner').classList.remove('show'); }
  _updateStatus(){
    const best=this.best>0?(' · 最佳 '+this.best):'';
    document.getElementById('status').textContent=`收走 ${this.found}/4 · 分 ${this.score}${best}`;
  }
}
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
window.game = new Scorpion();
</script>
</body>
</html>
