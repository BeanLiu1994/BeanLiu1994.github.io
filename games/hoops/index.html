<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a16" />
<title>霓虹投篮 · Neon Hoops</title>
<style>
  :root { --bg:#0a0a16; --surface:#12122a; --board:#0c1024; --text:#e8e8f8; --muted:#8a8ab0;
    --accent:#ff9f43; --accent-glow:#ff9f4366; --danger:#ff5d6a; --gold:#ffd700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg);
    background-image: radial-gradient(ellipse at 70% 30%, #3a2410 0%, transparent 55%), radial-gradient(ellipse at 20% 80%, #102a40 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),#ffd0a0,#ff9f43); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 14px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .score-card.sc .value { color:var(--accent); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:auto; border-radius:10px; background:var(--board); cursor:grab; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#0a0a16ee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; }
  .overlay-content h2 { font-size:1.9rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:14px; font-size:0.9rem; }
  .overlay.win h2 { color:var(--gold); }
  .controls { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:10px 12px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; text-align:center; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#1a0e02; }
  .btn.primary:hover { box-shadow:0 0 20px var(--accent-glow); }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#1a0e02; animation:pg 2s infinite; --glow:var(--accent-glow); }
  @keyframes pg { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:18px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bk .8s infinite; }
  @keyframes bk { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:6px; font-size:0.7rem; color:var(--muted); }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹投篮</h1><div class="sub">N E O N &nbsp; H O O P S</div></div>
    <div class="score-panel">
      <div class="score-card sc"><div class="label">Baskets</div><div class="value" id="score-sc">0</div></div>
      <div class="score-card"><div class="label">Streak</div><div class="value" id="score-streak">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="cv" width="420" height="520"></canvas>
    <div class="overlay win" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2 id="win-title">Great Shooting!</h2><p id="win-msg"></p><button class="btn primary" onclick="game.restart()">Keep Going</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">Reset</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI is shooting...</span></div>
  <div class="stats-bar"><span id="best-stat">Best streak: 0</span><span id="acc-stat">Accuracy: 0%</span></div>
</div>
<script>
(function(){
  'use strict';
  const W=420, H=520, G=0.32, BR=12, RIM=30, SCORE_R=60;
  const canvas=document.getElementById('cv'); const ctx=canvas.getContext('2d');
  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

  class Hoops {
    constructor(){
      this.autoPlay=false; this.last=0; this.raf=null;
      this.baskets=0; this.streak=0; this.shots=0; this.best=this.loadBest();
      this.cool=0; this.aiming=false; this.aimNow=null;
      this.loop=this.loop.bind(this);
      this.bind(); this.restart();
      this.last=performance.now(); this.raf=requestAnimationFrame(this.loop);
    }
    loadBest(){ try{ return parseInt(localStorage.getItem('hoops_best')||'0')||0; }catch(e){ return 0; } }
    saveBest(){ try{ localStorage.setItem('hoops_best', String(this.best)); }catch(e){} }
    restart(){
      this.stopAuto(); this.baskets=0; this.streak=0; this.shots=0; this.cool=0; this.over=false;
      this.bx=70; this.by=H-42; this.ball={x:this.bx,y:this.by,vx:0,vy:0,alive:false};
      this.hoopX=W*0.72; this.hoopY=H*0.48; this.hoopVx=0.4;
      document.getElementById('overlay-win').classList.remove('active');
      this.updateUI();
    }
    updateUI(){ document.getElementById('score-sc').textContent=this.baskets; document.getElementById('score-streak').textContent=this.streak; const acc=this.shots?Math.round(this.baskets/this.shots*100):0; document.getElementById('best-stat').textContent='Best streak: '+this.best; document.getElementById('acc-stat').textContent='Accuracy: '+acc+'%'; }
    shoot(vx,vy){ this.ball={x:this.bx,y:this.by,vx,vy,alive:true,prevY:this.by}; this.shots++; this.updateUI(); }
    step(dt){
      // hoop movement
      this.hoopX+=this.hoopVx*dt; if(this.hoopX>W*0.9){this.hoopX=W*0.9;this.hoopVx*=-1;} if(this.hoopX<W*0.55){this.hoopX=W*0.55;this.hoopVx*=-1;}
      const b=this.ball;
      if(b.alive){
        b.prevY=b.y; b.vy+=G*dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
        // score: ball entering the capture zone around the hoop (forgiving arcade make)
        if(Math.hypot(b.x-this.hoopX, b.y-this.hoopY) < SCORE_R){
          this.baskets++; this.streak++; if(this.streak>this.best){ this.best=this.streak; this.saveBest(); } this.updateUI();
          b.alive=false; this.cool=30;
          if(this.streak>0 && this.streak%10===0){ document.getElementById('win-title').textContent=this.streak+' in a row!'; document.getElementById('win-msg').textContent='Keep the streak alive'; document.getElementById('overlay-win').classList.add('active'); setTimeout(()=>document.getElementById('overlay-win').classList.remove('active'),900); }
          return;
        }
        if(b.y>H+30||b.x<-30||b.x>W+30){ b.alive=false; this.streak=0; this.updateUI(); this.cool=22; }
      } else if(this.cool>0){ this.cool--; if(this.cool===0 && this.autoPlay) this.aiShoot(); }
      else if(this.autoPlay){ this.cool=14; }
    }
    aiShoot(){
      const F=clamp(Math.round(Math.hypot(this.hoopX-this.bx, this.hoopY-this.by)/7), 42, 90);
      const predX=clamp(this.hoopX+this.hoopVx*F, W*0.5, W-20);
      const vx=(predX-this.bx)/F;
      const vy=(this.hoopY-this.by)/F - 0.5*G*F;
      this.shoot(vx,vy);
    }
    loop(now){
      const dt=Math.max(0.3,Math.min(2.2,(now-this.last)/16.67)); this.last=now;
      this.step(dt); this.draw();
      this.raf=requestAnimationFrame(this.loop);
    }
    draw(){
      ctx.clearRect(0,0,W,H);
      // floor / launch platform
      const floorY=H-14;
      ctx.fillStyle='#1a2a3a'; ctx.fillRect(0,floorY,W,H-floorY);
      ctx.strokeStyle='#3a5a7a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,floorY); ctx.lineTo(W,floorY); ctx.stroke();
      // launcher pad (angled launch ramp)
      const lx=this.bx, ly=this.by;
      ctx.fillStyle='#2a3a4a'; ctx.beginPath(); ctx.moveTo(lx-28,ly); ctx.lineTo(lx+28,ly); ctx.lineTo(lx+20,floorY); ctx.lineTo(lx-20,floorY); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#ff9f43'; ctx.lineWidth=2; ctx.shadowColor='#ff9f43'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.moveTo(lx-24,ly); ctx.lineTo(lx+24,ly); ctx.stroke(); ctx.shadowBlur=0;
      // backboard (sits just above the rim)
      ctx.strokeStyle='#3a4a6a'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(W-30,this.hoopY-86); ctx.lineTo(W-30,this.hoopY-6); ctx.stroke();
      // capture zone (shows the generous make area)
      ctx.strokeStyle='#ff9f4333'; ctx.lineWidth=1.5; ctx.setLineDash([4,6]); ctx.beginPath(); ctx.arc(this.hoopX,this.hoopY,SCORE_R,0,7); ctx.stroke(); ctx.setLineDash([]);
      // rim
      ctx.shadowColor='#ff9f43'; ctx.shadowBlur=14; ctx.strokeStyle='#ff9f43'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.moveTo(this.hoopX-RIM,this.hoopY); ctx.lineTo(this.hoopX+RIM,this.hoopY); ctx.stroke(); ctx.shadowBlur=0;
      ctx.fillStyle='#ff9f4333'; ctx.beginPath(); ctx.ellipse(this.hoopX,this.hoopY,RIM,7,0,0,7); ctx.fill();
      // net
      ctx.strokeStyle='#ffffff55'; ctx.lineWidth=1;
      for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(this.hoopX+i*RIM/2,this.hoopY); ctx.lineTo(this.hoopX+i*RIM/4,this.hoopY+22); ctx.stroke(); }
      // aim line (points the way the ball will launch: same direction as the drag)
      if(this.aiming && this.aimNow && this.aimStart){ const dx=this.aimNow.x-this.aimStart.x, dy=this.aimNow.y-this.aimStart.y; const dl=Math.hypot(dx,dy)||1; const pw=Math.min(190, dl*0.07); ctx.strokeStyle='#ffffffcc'; ctx.lineWidth=2; ctx.setLineDash([6,8]); ctx.beginPath(); ctx.moveTo(this.ball.x,this.ball.y); ctx.lineTo(this.ball.x+dx/dl*pw, this.ball.y+dy/dl*pw); ctx.stroke(); ctx.setLineDash([]); }
      // first-shot hint
      if(this.shots===0 && !this.aiming && !this.ball.alive){ ctx.fillStyle='#ffffff66'; ctx.font='13px system-ui'; ctx.textAlign='center'; ctx.fillText('拖拽篮球，朝篮筐方向甩出投篮', W/2, H-58); ctx.textAlign='left'; }
      // ball
      ctx.shadowColor='#ff9f43'; ctx.shadowBlur=14; ctx.fillStyle='#ff9f43'; ctx.beginPath(); ctx.arc(this.ball.x,this.ball.y,BR,0,7); ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle='#1a0e02'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(this.ball.x,this.ball.y,BR,0,7); ctx.moveTo(this.ball.x-BR,this.ball.y); ctx.lineTo(this.ball.x+BR,this.ball.y); ctx.stroke();
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; document.getElementById('ai-status').textContent='AI is shooting...'; if(!this.ball.alive && this.cool===0) this.cool=8; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    bind(){
      const pos=(e)=>{ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; };
      canvas.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.ball.alive) return; canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId); this.aiming=true; this.aimStart=pos(e); this.aimNow=pos(e); });
      canvas.addEventListener('pointermove',(e)=>{ if(!this.aiming) return; this.aimNow=pos(e); });
      // Flick-to-shoot: the ball flies in the SAME direction you drag (not opposite).
      // This avoids the old slingshot trap where the ball sits in the bottom-left corner
      // with no room to pull back, so it could never launch upward.
      canvas.addEventListener('pointerup',()=>{ if(!this.aiming) return; this.aiming=false; const dx=this.aimNow.x-this.aimStart.x, dy=this.aimNow.y-this.aimStart.y; const dl=Math.hypot(dx,dy); if(dl<8) return; const power=Math.min(20, dl*0.07); this.shoot(dx/dl*power, dy/dl*power); });
    }
  }
  window.game=new Hoops();
})();
</script>
</body>
</html>
