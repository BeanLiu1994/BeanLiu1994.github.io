<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹接龙 · Neon FreeCell</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#ffb86b; --accent-glow:#ffb86b55; --gold:#ffd54a; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 20% 15%, #1a2238 0%, transparent 55%), radial-gradient(ellipse at 82% 85%, #2a1a40 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:12px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; gap:10px; }
  .title-block h1 { font-size:1.45rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#ffb86b,#ffd54a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.52rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:50px; }
  .score-card .label { font-size:0.48rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:0.95rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:8px; }
  .btn { flex:1; min-width:74px; padding:9px 10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.78rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#2a1500; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#2a1500; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:6px; font-size:0.72rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹接龙</h1><div class="sub">F R E E C E L L</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Home</div><div class="value" id="home">0/52</div></div>
      <div class="score-card best"><div class="label">Won</div><div class="value" id="won">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="440" height="520"></canvas></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">New Deal</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">点牌选中，再点目标列或回收区；把 4 种花色的 A→K 收齐即胜</div>
</div>
<script>
(function(){
  'use strict';
  const SUITS=['S','H','D','C']; const RED={H:1,D:1,S:0,C:0};
  const RL=(r)=> r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r);
  const SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const homeEl=document.getElementById('home'), wonEl=document.getElementById('won'), statusEl=document.getElementById('status');

  class FreeCell {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0; this.noProg=0;
      this.won=parseInt(localStorage.getItem('fcWon')||'0'); wonEl.textContent=this.won;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); this.onDown(e); });
      this.restart();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(rect.width||440,440)); const dpr=window.devicePixelRatio||1;
      this.W=w; this.H=w*520/440; canvas.width=w*dpr; canvas.height=this.H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      this.cw=w/9.2; this.ch=this.cw*1.38; this.gap=(w-8*this.cw)/9; this.colX=i=>4+i*(this.cw+this.gap); this.topY=6; this.colY=this.topY+this.ch+14; this.ov=this.ch*0.30; }
    newDeal(){ const deck=[]; for(const s of SUITS) for(let r=1;r<=13;r++) deck.push({s,r}); for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
      this.cols=[]; for(let c=0;c<8;c++) this.cols.push([]); let k=0; for(let c=0;c<8;c++){ const n=(c<4)?7:6; for(let j=0;j<n;j++) this.cols[c].push(deck[k++]); }
      this.free=[null,null,null,null]; this.found={S:null,H:null,D:null,C:null}; this.sel=null; this.over=false; this.win=false; this.noProg=0; this.updateUI(); }
    restart(){ this.stopAuto(); this.over=false; this.win=false; this.newDeal(); }
    autoNext(){ this.over=false; this.win=false; this.newDeal(); }
    homeCount(){ let n=0; for(const s of SUITS) if(this.found[s]) n+=this.found[s].r; return n; }
    runLen(col){ let L=1; for(let i=col.length-1;i>0;i--){ const a=col[i],b=col[i-1]; if(b.r===a.r+1 && RED[b.s]!==RED[a.s]) L++; else break; } return L; }
    freeEmpty(){ return this.free.filter(x=>x===null).length; }
    emptyCols(){ return this.cols.filter(c=>c.length===0).length; }
    maxMove(){ return (this.freeEmpty()+1)*Math.pow(2,this.emptyCols()); }
    canFound(card){ const f=this.found[card.s]; return (!f&&card.r===1)||(f&&f.s===card.s&&card.r===f.r+1); }
    doFound(card,src){ this.found[card.s]=card; this.removeSrc(src); this._autoProgress++; this.sel=null; this.checkWin(); this.updateUI(); }
    removeSrc(src){ if(src.type==='free') this.free[src.i]=null; else this.cols[src.col].pop(); }
    setSrc(src,card){ if(src.type==='free') this.free[src.i]=card; else this.cols[src.col].push(card); }
    checkWin(){ if(this.homeCount()===52){ this.over=true; this.win=true; this.won++; localStorage.setItem('fcWon',String(this.won)); wonEl.textContent=this.won; statusEl.textContent='🎉 全部收齐！'; if(this.autoPlay) this.autoNext(); } }
    // ---- interactions ----
    onDown(e){ if(this.autoPlay||this.over) return; const rect=canvas.getBoundingClientRect(); const x=(e.clientX-rect.left)*(this.W/rect.width), y=(e.clientY-rect.top)*(this.H/rect.height);
      // top row: freecells (left) / foundations (right)
      if(y<this.topY+this.ch){
        const fi=Math.floor((x-4)/ (this.cw+this.gap));
        if(fi>=0&&fi<4 && x>4 && Math.abs(x-(4+fi*(this.cw+this.gap)+this.cw/2))<this.cw/2){ if(this.free[fi]&&!this.sel) this.sel={type:'free',i:fi}; else if(this.sel) this.tryDest({type:'free',i:fi}); return; }
        const fSuits=['S','H','D','C']; for(let i=0;i<4;i++){ const fx=this.W-4-(4-i)*(this.cw+this.gap); if(Math.abs(x-(fx+this.cw/2))<this.cw/2){ if(this.sel) this.tryDest({type:'found',s:fSuits[i]}); return; } }
        return;
      }
      for(let c=0;c<8;c++){ const cx=this.colX(c); if(x>=cx-2&&x<=cx+this.cw+2){ const col=this.cols[c]; if(!col.length){ if(this.sel) this.tryDest({type:'col',col:c}); return; }
        const idx=Math.floor((y-this.colY)/this.ov); const i=Math.max(0,Math.min(col.length-1,idx)); const L=this.runLen(col);
        if(!this.sel){ if(i>=col.length-L) this.sel={type:'col',col:c,len:L}; else this.sel={type:'col',col:c,len:1}; }
        else this.tryDest({type:'col',col:c}); return; } }
    }
    tryDest(dest){
      const s=this.sel; if(!s) return; let card, len=1;
      if(s.type==='free'){ if(!this.free[s.i]){ this.sel=null; return; } card=this.free[s.i]; len=1; }
      else { const col=this.cols[s.col]; if(!col.length){ this.sel=null; return; } len=s.len||1; const start=col.length-len; card=col[start]; }
      if(dest.type==='found'){ if(len===1 && this.canFound(card)){ this.doFound(card,s); } else { this.sel=null; } return; }
      if(dest.type==='free'){ if(len===1 && this.free[dest.i]===null){ this.free[dest.i]=card; this.removeSrc(s); this.sel=null; this.updateUI(); } else this.sel=null; return; }
      if(dest.type==='col'){ const dcol=this.cols[dest.col]; if(len>this.maxMove()){ this.sel=null; return; }
        if(dcol.length===0){ for(let k=0;k<len;k++){ const col=this.cols[s.col]; const cc=col[col.length-len+k]; dcol.push(cc); } this.cols[s.col].length-=len; this.sel=null; this.updateUI(); return; }
        const dt=dcol[dcol.length-1]; if(RED[dt.s]!==RED[card.s] && card.r===dt.r-1){ for(let k=0;k<len;k++){ const col=this.cols[s.col]; const cc=col[col.length-len+k]; dcol.push(cc); } this.cols[s.col].length-=len; this.sel=null; this.updateUI(); } else this.sel=null; }
    }
    // ---- auto ----
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this.autoStep(); }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    autoStep(){ if(!this.autoPlay) return; if(this.over){ this.autoNext(); return; }
      let moved=this.tryFoundation();
      if(!moved) moved=this.tryBeneficial();
      if(moved) this.noProg=0; else { this.noProg++; if(this.noProg>45){ this.autoNext(); return; } }
      this.autoTimer=setTimeout(()=>this.autoStep(), 240);
    }
    tryFoundation(){ const cs=[]; this.free.forEach((c,i)=>{ if(c&&this.canFound(c)) cs.push({card:c,src:{type:'free',i}}); });
      for(let c=0;c<8;c++){ const col=this.cols[c]; if(col.length){ const t=col[col.length-1]; if(this.canFound(t)) cs.push({card:t,src:{type:'col',col:c}}); } }
      if(cs.length){ const m=cs[0]; this.doFound(m.card,m.src); return true; } return false;
    }
    tryBeneficial(){
      // move a single card onto a column that extends a descending run (opposite color)
      const sources=[]; this.free.forEach((c,i)=>{ if(c) sources.push({card:c,src:{type:'free',i}}); });
      for(let c=0;c<8;c++){ const col=this.cols[c]; if(col.length){ sources.push({card:col[col.length-1],src:{type:'col',col:c}}); } }
      for(const s of sources){ const card=s.card;
        for(let d=0;d<8;d++){ const dcol=this.cols[d]; if(s.src.type==='col'&&s.src.col===d) continue;
          if(dcol.length){ const dt=dcol[dcol.length-1]; if(RED[dt.s]!==RED[card.s]&&card.r===dt.r-1){ this.removeSrc(s.src); dcol.push(card); this.sel=null; this.updateUI(); return true; } }
          else if(this.freeEmpty()+this.emptyCols()>0){ if(s.src.type==='free') continue; // only relocate column card to empty col if it frees something
            this.removeSrc(s.src); dcol.push(card); this.sel=null; this.updateUI(); return true; }
        }
        // move column top to freecell if empty freecell exists and card is low (helps unblock)
        if(s.src.type==='col' && this.freeEmpty()>0 && this.emptyCols()>0 && card.r<=6){ const fi=this.free.indexOf(null); this.free[fi]=card; this.removeSrc(s.src); this.sel=null; this.updateUI(); return true; }
      }
      return false;
    }
    updateUI(){ homeEl.textContent=this.homeCount()+'/52'; if(!this.over) statusEl.textContent=this.autoPlay?'自动接龙中… 已归位 '+this._autoProgress:'点牌选中，再点目标列或回收区'; }
    // ---- render ----
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.draw(dt); }catch(err){ console.error(err); } }
    draw(){ const W=this.W; ctx.clearRect(0,0,W,this.H);
      // freecells
      for(let i=0;i<4;i++){ const x=4+i*(this.cw+this.gap); this.slot(x,this.topY); }
      // foundations
      const suits=['S','H','D','C']; for(let i=0;i<4;i++){ const x=W-4-(4-i)*(this.cw+this.gap); this.slot(x,this.topY); const f=this.found[suits[i]]; if(f) this.drawCard(f,x,this.topY); else { ctx.fillStyle='#8a8ab0'; ctx.font=(this.cw*0.4)+'px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(suits[i], x+this.cw/2, this.topY+this.ch/2); } }
      // columns
      for(let c=0;c<8;c++){ const cx=this.colX(c); const col=this.cols[c]; for(let i=0;i<col.length;i++){ const y=this.colY+i*this.ov; this.drawCard(col[i],cx,y); } }
      // selection highlight
      if(this.sel){ if(this.sel.type==='free'){ const x=4+this.sel.i*(this.cw+this.gap); ctx.strokeStyle='#ffd54a'; ctx.lineWidth=3; this.rr(x-2,this.topY-2,this.cw+4,this.ch+4,8); ctx.stroke(); }
        else { const cx=this.colX(this.sel.col); const start=col=>col.length-(this.sel.len||1); const y=this.colY+start(this.cols[this.sel.col])*this.ov; ctx.strokeStyle='#ffd54a'; ctx.lineWidth=3; this.rr(cx-2,y-2,this.cw+4,this.ch+4,8); ctx.stroke(); } }
    }
    slot(x,y){ this.rr(x,y,this.cw,this.ch,8); ctx.fillStyle='#0a0e1e'; ctx.fill(); ctx.strokeStyle='#2a2f4a'; ctx.lineWidth=1.5; ctx.stroke(); }
    drawCard(d,x,y){ const col=RED[d.s]?'#ff5d6a':'#e6e6f5'; const g=ctx.createLinearGradient(x,y,x,y+this.ch); g.addColorStop(0,'#fbfbff'); g.addColorStop(1,'#d7d9ea');
      this.rr(x,y,this.cw,this.ch,8); ctx.fillStyle=g; ctx.fill();
      ctx.fillStyle=col; ctx.font='bold '+(this.cw*0.34)+'px Segoe UI'; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(RL(d.r), x+5, y+4); ctx.textAlign='right'; ctx.fillText(SYM[d.s], x+this.cw-5, y+4);
      ctx.textAlign='center'; ctx.font=(this.cw*0.5)+'px Segoe UI'; ctx.fillText(SYM[d.s], x+this.cw/2, y+this.ch*0.56); }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new FreeCell();
})();
</script>
</body>
</html>
