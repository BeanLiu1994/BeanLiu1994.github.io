<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>隧道挖掘 · Tunnel Digger</title>
<style>
  :root{
    --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6ecff;
    --muted:#8a92b2; --accent:#ff7ad9; --accent-glow:rgba(255,122,217,.55);
    --gold:#ffd84d; --red:#ff5d6c; --green:#3ecf8e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);touch-action:none;overscroll-behavior:none}
  .app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;padding:10px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 8px}
  h1{font-size:19px;margin:0;letter-spacing:.5px;
    background:linear-gradient(90deg,#ff7ad9,#ffd84d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .toolbar{display:flex;gap:8px}
  button{font:inherit;font-size:14px;color:var(--text);background:var(--surface);
    border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;cursor:pointer;
    transition:transform .12s ease,box-shadow .2s ease,background .2s}
  button:active{transform:scale(.95)}
  button.on{background:linear-gradient(90deg,#7a1270,#ff7ad9);box-shadow:0 0 16px var(--accent-glow)}
  .board-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  .board-wrap *{touch-action:none}
  canvas{width:100%;height:100%;max-width:min(96vw,620px);max-height:92%;border-radius:14px;
    background:var(--board);box-shadow:0 0 40px rgba(255,122,217,.12),inset 0 0 0 1px rgba(255,255,255,.05)}
  .status{text-align:center;color:var(--muted);font-size:13px;padding:8px 4px;min-height:20px}
  .hint{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;padding:2px 8px 6px;opacity:.85}
  .banner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(8,10,26,.72);backdrop-filter:blur(6px);z-index:20}
  .banner.show{display:flex;animation:pop .3s ease}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  .card{background:var(--surface);border:1px solid rgba(255,255,255,.12);border-radius:16px;
    padding:26px 30px;text-align:center;box-shadow:0 0 50px rgba(255,122,217,.25)}
  .card h2{margin:0 0 6px;font-size:26px;color:var(--gold)}
  .card p{margin:4px 0;color:var(--muted);font-size:14px}
  .card button{margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>隧道挖掘 · Tunnel Digger</h1>
    <div class="toolbar">
      <button id="newBtn">新局</button>
      <button id="autoBtn">自动</button>
    </div>
  </header>
  <div class="board-wrap"><canvas id="c"></canvas></div>
  <div class="status" id="status"></div>
  <div class="hint">滑动 / 方向键移动并挖开泥土；对准敌人自动发射气泵将其击败。消灭全部敌人即过关。</div>
</div>
<div class="banner" id="banner"><div class="card">
  <h2 id="bannerTitle">过关！</h2>
  <p id="bannerMsg"></p>
  <button id="bannerBtn">继续</button>
</div></div>
<script>
const PNOW = () => (typeof performance!=='undefined' && performance.now) ? performance.now() : Date.now();
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rrect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

const DIRT=1, TUNNEL=0;
const DIRS=[[0,-1],[0,1],[-1,0],[1,0]];
class TunnelDigger {
  constructor(){
    this.COLS=17; this.ROWS=13;
    this.canvas=document.getElementById('c');
    this.ctx=this.canvas.getContext('2d');
    this.autoPlay=false; this._autoProgress=0; this.autoTimer=null;
    this._cssW=0; this._last=null; this.score=0;
    this.best=parseFloat(localStorage.getItem('tdBest')||'0')||0;
    this.level=1;
    this.fit();
    this.restart();
    this._bind();
    this._raf=requestAnimationFrame(this.loop.bind(this));
  }
  fit(){
    const rect=this.canvas.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    const w=rect.width||360,h=rect.height||360;
    this.W=w; this.H=h;
    this.canvas.width=Math.round(w*dpr); this.canvas.height=Math.round(h*dpr);
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.cell=Math.min((w*0.98)/this.COLS,(h*0.98)/this.ROWS);
    this.ox=(w-this.cell*this.COLS)/2; this.oy=(h-this.cell*this.ROWS)/2;
    this._cssW=rect.width;
  }
  passablePlayer(r,c){ return r>=0&&r<this.ROWS&&c>=0&&c<this.COLS && !this.enemyAt(r,c); }
  passableEnemy(r,c){ return r>=0&&r<this.ROWS&&c>=0&&c<this.COLS&&this.grid[r][c]===TUNNEL; }
  enemyAt(r,c){ return this.enemies.find(e=>!e.dead&&e.r===r&&e.c===c); }
  gen(){
    const R=this.ROWS,C=this.COLS;
    const g=Array.from({length:R},()=>new Array(C).fill(DIRT));
    // border tunnel
    for(let c=0;c<C;c++){ g[0][c]=TUNNEL; g[R-1][c]=TUNNEL; }
    for(let r=0;r<R;r++){ g[r][0]=TUNNEL; g[r][C-1]=TUNNEL; }
    // a few starting tunnels
    for(let r=1;r<R-1;r++) g[r][1]=TUNNEL;
    g[1][1]=TUNNEL;
    this.grid=g;
    const pr=1,pc=1; this.player={r:pr,c:pc,rx:pr,ry:pc,tr:pr,tc:pc,moving:false,dir:{x:1,y:0}};
    this.enemies=[];
    const spots=[];
    for(let r=3;r<R-2;r++)for(let c=3;c<C-2;c++) spots.push([r,c]);
    shuffle(spots);
    const n=Math.min(3+ (this.level>3?1:0), spots.length);
    for(let i=0;i<n;i++){ const [r,c]=spots[i]; this.enemies.push({r,c,rx:r,ry:c,tr:r,tc:c,moving:false,hp:4,dead:false,stepT:0,dir:{x:0,y:0}}); }
    this.over=false; this.pump=null; this.pumpCD=0; this._pendingDir=null;
    this._updateStatus();
  }
  restart(){
    this.stopAuto();
    this.gen();
    this._hideBanner();
    this._updateStatus();
  }
  bfsNext(sr,sc,goalFn,passable){
    const R=this.ROWS,C=this.COLS;
    const dist=Array.from({length:R},()=>new Array(C).fill(-1));
    const prev=Array.from({length:R},()=>new Array(C).fill(null));
    const q=[[sr,sc]]; dist[sr][sc]=0; let head=0;
    while(head<q.length){
      const [r,c]=q[head++];
      if(goalFn(r,c) && (r!==sr||c!==sc)){
        let cur=[r,c];
        while(prev[cur[0]][cur[1]] && !(prev[cur[0]][cur[1]][0]===sr&&prev[cur[0]][cur[1]][1]===sc)) cur=prev[cur[0]][cur[1]];
        return {r:cur[0],c:cur[1]};
      }
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nr=r+dr,nc=c+dc;
        if(nr<0||nr>=R||nc<0||nc>=C||dist[nr][nc]!==-1||!passable(nr,nc)) continue;
        dist[nr][nc]=dist[r][c]+1; prev[nr][nc]=[r,c]; q.push([nr,nc]);
      }
    }
    return null;
  }
  startStep(ent,tr,tc,passable){
    if(!passable(tr,tc)) return false;
    ent.tr=tr; ent.tc=tc; ent.moving=true;
    ent.dir={x:Math.sign(tc-ent.c),y:Math.sign(tr-ent.r)};
    return true;
  }
  decidePlayer(){
    const p=this.player;
    if(p.moving) return;
    if(this.autoPlay){
      const alive=this.enemies.filter(e=>!e.dead);
      if(!alive.length) return;
      // if an enemy is in harpoon range, fire
      if(this.canPump(p)){ this.tryPump(); return; }
      let near=null,nd=1e9;
      for(const e of alive){ const d=Math.abs(e.r-p.r)+Math.abs(e.c-p.c); if(d<nd){ nd=d; near=e; } }
      if(nd<=1){
        // adjacent but not aligned for a pump: step to get a clear line, else retreat
        const opts=DIRS.map(([dr,dc])=>({dr,dc})).filter(d=>this.passablePlayer(p.r+d.dr,p.c+d.dc));
        opts.sort((a,b)=>{
          const da=Math.abs((p.r+a.dr)-near.r)+Math.abs((p.c+a.dc)-near.c);
          const db=Math.abs((p.r+b.dr)-near.r)+Math.abs((p.c+b.dc)-near.c);
          return db-da;
        });
        if(opts.length && this.startStep(p,p.r+opts[0].dr,p.c+opts[0].dc,this.passablePlayer.bind(this))) return;
      } else if(nd<=3){
        // retreat away from nearest enemy
        const opts=DIRS.map(([dr,dc])=>({dr,dc})).filter(d=>this.passablePlayer(p.r+d.dr,p.c+d.dc));
        opts.sort((a,b)=>{
          const da=Math.abs((p.r+a.dr)-near.r)+Math.abs((p.c+a.dc)-near.c);
          const db=Math.abs((p.r+b.dr)-near.r)+Math.abs((p.c+b.dc)-near.c);
          return db-da;
        });
        if(opts.length && this.startStep(p,p.r+opts[0].dr,p.c+opts[0].dc,this.passablePlayer.bind(this))) return;
      } else {
        const adj=(r,c)=> alive.some(e=>(Math.abs(e.r-r)+Math.abs(e.c-c))===1);
        const next=this.bfsNext(p.r,p.c,adj,this.passablePlayer.bind(this));
        if(next && this.startStep(p,next.r,next.c,this.passablePlayer.bind(this))) return;
      }
      return;
    }
    if(this._pendingDir){
      const d=this._pendingDir; this._pendingDir=null;
      if(this.startStep(p,p.r+d.y,p.c+d.x,this.passablePlayer.bind(this))) return;
    }
  }
  decideEnemy(e){
    if(e.moving||e.dead) return;
    e.stepT+=1;
    const next=this.bfsNext(e.r,e.c,(r,c)=>(r===this.player.r&&c===this.player.c),this.passableEnemy.bind(this));
    if(next && this.startStep(e,next.r,next.c,this.passableEnemy.bind(this))) return;
    const opts=[[0,1],[0,-1],[1,0],[-1,0]].filter(d=>this.passableEnemy(e.r+d.y,e.c+d.x));
    if(opts.length){ const d=opts[(Math.random()*opts.length)|0]; this.startStep(e,e.r+d.y,e.c+d.x,this.passableEnemy.bind(this)); }
  }
  // is any enemy within 4 cells in a straight line (harpoon can reach through dirt)?
  canPump(p){
    for(const [dr,dc] of DIRS){
      for(let i=1;i<=4;i++){
        const r=p.r+dr*i, c=p.c+dc*i;
        if(r<0||r>=this.ROWS||c<0||c>=this.COLS) break;
        if(this.enemyAt(r,c)) return true;
      }
    }
    return false;
  }
  tryPump(){
    const p=this.player;
    if(this.pumpCD>0) return;
    for(const [dr,dc] of DIRS){
      for(let i=1;i<=4;i++){
        const r=p.r+dr*i, c=p.c+dc*i;
        if(r<0||r>=this.ROWS||c<0||c>=this.COLS) break;
        const e=this.enemyAt(r,c);
        if(e){ this.pump={dir:{x:dc,y:dr},len:i,t:PNOW()}; this.pumpCD=0.3; e.hp--; this._autoProgress++;
          if(e.hp<=0){ e.dead=true; this.score+=100; this._updateStatus(); }
          return;
        }
      }
    }
  }
  toggleAuto(){ this.autoPlay?this.stopAuto():this.startAuto(); }
  startAuto(){
    this.autoPlay=true; this._autoProgress=0; this._hideBanner();
    document.getElementById('autoBtn').classList.add('on');
    document.getElementById('autoBtn').textContent='停止';
    this._updateStatus();
  }
  stopAuto(){
    this.autoPlay=false;
    if(this.autoTimer){ clearTimeout(this.autoTimer); this.autoTimer=null; }
    document.getElementById('autoBtn').classList.remove('on');
    document.getElementById('autoBtn').textContent='自动';
  }
  _bind(){
    const cv=this.canvas; let sx=0,sy=0,down=false;
    cv.addEventListener('pointerdown',e=>{ e.preventDefault(); if(this.autoPlay) return; down=true; sx=e.clientX; sy=e.clientY; });
    cv.addEventListener('pointermove',e=>{ if(!down||this.autoPlay) return; const dx=e.clientX-sx,dy=e.clientY-sy; if(Math.abs(dx)+Math.abs(dy)>14){ if(Math.abs(dx)>Math.abs(dy)) this._pendingDir={x:Math.sign(dx),y:0}; else this._pendingDir={x:0,y:Math.sign(dy)}; down=false; } });
    cv.addEventListener('pointerup',e=>{ down=false; });
    cv.addEventListener('pointercancel',e=>{ down=false; });
    document.getElementById('newBtn').onclick=()=>this.restart();
    document.getElementById('autoBtn').onclick=()=>this.toggleAuto();
    document.getElementById('bannerBtn').onclick=()=>{ this._hideBanner(); if(this.over){ this.level=1; this.score=0; this.restart(); } else this.restart(); };
    window.addEventListener('keydown',e=>{
      if(this.autoPlay) return;
      const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
      const k=e.key.length===1?e.key.toLowerCase():e.key;
      if(m[k]){ this._pendingDir={x:m[k][0],y:m[k][1]}; e.preventDefault(); }
    });
  }
  _moveEnt(ent,dt,speed){
    if(!ent.moving) return;
    const step=dt*speed, dr=ent.tr-ent.rx, dc=ent.tc-ent.ry, dist=Math.hypot(dr,dc);
    if(dist<=step){ ent.rx=ent.tr; ent.ry=ent.tc; ent.r=ent.tr; ent.c=ent.tc; ent.moving=false; }
    else { ent.rx+=dr/dist*step; ent.ry+=dc/dist*step; }
  }
  tick(dt){
    const p=this.player;
    if(this.pumpCD>0) this.pumpCD-=dt;
    // player digs when arriving on dirt
    this._moveEnt(p,dt,8);
    if(!p.moving && this.grid[p.r][p.c]===DIRT){ this.grid[p.r][p.c]=TUNNEL; }
    if(!p.moving) this.decidePlayer();
    // pump when aligned
    if(!p.moving) this.tryPump();
    // enemies
    for(const e of this.enemies){
      if(e.dead) continue;
      this._moveEnt(e,dt,2.8);
      if(!e.moving){ e.stepT-=dt*3; if(e.stepT<=0){ e.stepT=0; this.decideEnemy(e); } }
    }
    if(!this.over){
      for(const e of this.enemies){ if(!e.dead && e.r===p.r && e.c===p.c){ this._caught(); break; } }
    }
    if(!this.over && this.enemies.every(e=>e.dead)){
      this.score+=200;
      if(this.score>this.best){ this.best=this.score; localStorage.setItem('tdBest',this.best); }
      if(this.autoPlay){ this.level++; this.gen(); this._updateStatus(); return; }
      this._showBanner('过关！','得分 '+this.score);
    }
  }
  _caught(){
    if(this.autoPlay){ this.gen(); return; }
    this.over=true;
    if(this.score>this.best){ this.best=this.score; localStorage.setItem('tdBest',this.best); }
    this._showBanner('被抓住了！','得分 '+this.score+(this.best===this.score?' · 新纪录！':''));
  }
  loop(ts){
    const rect=this.canvas.getBoundingClientRect();
    if(rect.width && rect.width!==this._cssW) this.fit();
    const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016);
    this._last=ts;
    this.tick(dt);
    this.render();
    this._raf=requestAnimationFrame(this.loop.bind(this));
  }
  render(){
    const ctx=this.ctx,R=this.ROWS,C=this.COLS,cell=this.cell;
    ctx.clearRect(0,0,this.W,this.H);
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      const x=this.ox+c*cell,y=this.oy+r*cell,v=this.grid[r][c];
      if(v===DIRT){ ctx.fillStyle='#3a2a16'; rrect(ctx,x+1,y+1,cell-2,cell-2,3); ctx.fill();
        ctx.fillStyle='rgba(255,200,120,.08)'; ctx.fillRect(x+3,y+3,cell*0.4,cell*0.4); }
      else { ctx.fillStyle='rgba(255,255,255,.05)'; ctx.fillRect(x,y,cell,cell); }
    }
    // enemies
    for(const e of this.enemies){ if(e.dead) continue;
      const cx=this.ox+(e.rx+0.5)*cell, cy=this.oy+(e.ry+0.5)*cell;
      ctx.save(); ctx.shadowColor='rgba(255,93,108,.7)'; ctx.shadowBlur=10;
      ctx.fillStyle='#ff5d6c'; ctx.beginPath(); ctx.arc(cx,cy,cell*0.3,0,7); ctx.fill(); ctx.restore();
      // eyes
      ctx.fillStyle='#0a0a1a'; ctx.fillRect(cx-cell*0.14,cy-cell*0.08,cell*0.09,cell*0.09); ctx.fillRect(cx+cell*0.05,cy-cell*0.08,cell*0.09,cell*0.09);
      // hp bar
      ctx.fillStyle='rgba(255,255,255,.2)'; ctx.fillRect(cx-cell*0.28,cy-cell*0.42,cell*0.56,3);
      ctx.fillStyle='#3ecf8e'; ctx.fillRect(cx-cell*0.28,cy-cell*0.42,cell*0.56*(e.hp/2),3);
    }
    // pump
    if(this.pump){
      const p=this.player; const cx=this.ox+(p.rx+0.5)*cell, cy=this.oy+(p.ry+0.5)*cell;
      const ex=cx+this.pump.dir.x*this.pump.len*cell, ey=cy+this.pump.dir.y*this.pump.len*cell;
      ctx.strokeStyle='#9be8ff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(ex,ey); ctx.stroke();
    }
    // player
    const p=this.player; const cx=this.ox+(p.rx+0.5)*cell, cy=this.oy+(p.ry+0.5)*cell;
    ctx.save(); ctx.shadowColor='rgba(255,122,217,.8)'; ctx.shadowBlur=12;
    ctx.fillStyle='#ff7ad9'; rrect(ctx,cx-cell*0.3,cy-cell*0.32,cell*0.6,cell*0.64,6); ctx.fill(); ctx.restore();
    // facing indicator
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx+p.dir.x*cell*0.28,cy+p.dir.y*cell*0.28,cell*0.08,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.04)'; ctx.lineWidth=1;
    for(let i=0;i<=C;i++){ ctx.beginPath(); ctx.moveTo(this.ox+i*cell,this.oy); ctx.lineTo(this.ox+i*cell,this.oy+R*cell); ctx.stroke(); }
    for(let i=0;i<=R;i++){ ctx.beginPath(); ctx.moveTo(this.ox,this.oy+i*cell); ctx.lineTo(this.ox+C*cell,this.oy+i*cell); ctx.stroke(); }
  }
  _showBanner(t,m){ document.getElementById('bannerTitle').textContent=t; document.getElementById('bannerMsg').textContent=m; document.getElementById('banner').classList.add('show'); }
  _hideBanner(){ document.getElementById('banner').classList.remove('show'); }
  _updateStatus(){
    const alive=this.enemies.filter(e=>!e.dead).length;
    const best=this.best>0?(' · 最佳 '+this.best):'';
    document.getElementById('status').textContent=`第 ${this.level} 关 · 剩余敌人 ${alive} · 分 ${this.score}${best}`;
  }
}
window.game = new TunnelDigger();
</script>
</body>
</html>
