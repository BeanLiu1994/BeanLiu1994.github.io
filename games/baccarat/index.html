<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹百家乐 · Neon Baccarat</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#4dff91; --accent-glow:#4dff9166; --gold:#ffd54a; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 50% 0%, #16203a 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #1a2a14 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#4dff91,#4dfff0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:0.95rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:11px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:700; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#06120a; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#06120a; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹百家乐</h1><div class="sub">N E O N &nbsp; B A C C A R A T</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Rounds</div><div class="value" id="rounds">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="420" height="300"></canvas></div>
  <div class="controls">
    <button class="btn primary" id="btn-deal" onclick="game.deal()">Deal</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">闲家(Player)对庄家(Banker)，点 Deal 发牌</div>
</div>
<script>
(function(){
  'use strict';
  const SUITS=['S','H','D','C']; const RED={H:1,D:1,S:0,C:0};
  const RL=(r)=> r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r);
  const SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
  const valOf=(r)=> (r>=10)?0:r;
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), roundsEl=document.getElementById('rounds'), statusEl=document.getElementById('status');
  const dealBtn=document.getElementById('btn-deal');

  class Bac {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0;
      this.score=0; this.rounds=0; this.busy=false; this.phaseT=0;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      this.newDeck(); this.reset();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(rect.width||420,420)); const dpr=window.devicePixelRatio||1;
      this.W=w; this.H=w*300/420; canvas.width=w*dpr; canvas.height=this.H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); this.cw=w/9; this.ch=this.cw*1.35; }
    newDeck(){ const d=[]; for(const s of SUITS) for(let r=1;r<=13;r++) d.push({s,r}); for(let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [d[i],d[j]]=[d[j],d[i]]; } this.deck=d; }
    draw(){ if(this.deck.length<6) this.newDeck(); return this.deck.pop(); }
    reset(){ this.player=[]; this.banker=[]; this.pt=0; this.bt=0; this.result=null; this.busy=false; this.reveal=0; }
    deal(){
      if(this.busy||this.autoPlay||this.result&&this.reveal<1) return;
      this.reset(); this.busy=true; this.phaseT=0;
      this.player.push(this.draw(),this.draw()); this.banker.push(this.draw(),this.draw());
      this.pt=this.tot(this.player); this.bt=this.tot(this.banker);
      this.resolve();
    }
    tot(h){ let s=0; for(const c of h) s+=valOf(c.r); return s%10; }
    resolve(){
      // naturals
      if(this.pt>=8||this.bt>=8){ this.finish(); return; }
      let pThird=null;
      if(this.pt<=5){ pThird=this.draw(); this.player.push(pThird); this.pt=this.tot(this.player); }
      // banker rule
      const pVal = pThird?valOf(pThird.r):null;
      let bDraw=false;
      if(pThird===null){ if(this.bt<=5) bDraw=true; }
      else { if(this.bt<=2) bDraw=true;
        else if(this.bt===3){ if(pVal!==8) bDraw=true; }
        else if(this.bt===4){ if(pVal>=2&&pVal<=7) bDraw=true; }
        else if(this.bt===5){ if(pVal>=4&&pVal<=7) bDraw=true; }
        else if(this.bt===6){ if(pVal>=6&&pVal<=7) bDraw=true; }
      }
      if(bDraw){ this.banker.push(this.draw()); this.bt=this.tot(this.banker); }
      this.finish();
    }
    finish(){ this.busy=false; this.reveal=0;
      if(this.pt>this.bt) this.result='P'; else if(this.bt>this.pt) this.result='B'; else this.result='T';
      this.rounds++; roundsEl.textContent=this.rounds;
      if(this.result==='P') this.score+=1; else if(this.result==='B') this.score-=1;
      scoreEl.textContent=this.score;
      statusEl.textContent = this.result==='P'?'闲家胜 ▲':(this.result==='B'?'庄家胜 ▼':'平局 ＝')+'（闲 '+this.pt+' · 庄 '+this.bt+'）';
    }
    // ---- auto ----
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else this.startAuto(); }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this.autoStep(); }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    autoStep(){ if(!this.autoPlay) return; if(!this.busy && !this.result){ this.deal(); this._autoProgress++; } this.autoTimer=setTimeout(()=>this.autoStep(), 1300); }
    // ---- render ----
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; if(this.busy) this.phaseT+=dt; if(this.result&&this.reveal<1) this.reveal=Math.min(1,this.reveal+dt*3); this.draw(); }catch(err){ console.error(err); } }
    draw(){ const W=this.W,H=this.H,cw=this.cw,ch=this.ch; ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#8a8ab0'; ctx.font='bold '+(cw*0.4)+'px Segoe UI'; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText('PLAYER', 8, H*0.28); ctx.fillText('BANKER', 8, H*0.74);
      // player cards
      const px=W*0.34; this.player.forEach((c,i)=> this.card(c, px+i*(cw+6), H*0.16, false));
      ctx.fillStyle='#ffd54a'; ctx.font='bold '+(cw*0.5)+'px Segoe UI'; ctx.textAlign='right';
      if(this.reveal>=1||!this.busy) ctx.fillText(String(this.pt), W-10, H*0.28);
      const bx=W*0.34; this.banker.forEach((c,i)=> this.card(c, bx+i*(cw+6), H*0.62, false));
      if(this.reveal>=1||!this.busy) ctx.fillText(String(this.bt), W-10, H*0.74);
      ctx.textAlign='left';
      if(this.result && this.reveal>=1){ ctx.save(); ctx.shadowColor='#4dff91'; ctx.shadowBlur=16; ctx.fillStyle='#4dff91'; ctx.font='bold '+(cw*0.55)+'px Segoe UI'; ctx.textAlign='center';
        const txt=this.result==='P'?'PLAYER WINS':(this.result==='B'?'BANKER WINS':'TIE'); ctx.fillText(txt, W/2, H-14); ctx.restore(); }
    }
    card(d,x,y){ const col=RED[d.s]?'#ff5d6a':'#e6e6f5'; const g=ctx.createLinearGradient(x,y,x,y+ch); g.addColorStop(0,'#fbfbff'); g.addColorStop(1,'#d7d9ea');
      this.rr(x,y,cw,ch,6); ctx.fillStyle=g; ctx.fill();
      ctx.fillStyle=col; ctx.font='bold '+(cw*0.34)+'px Segoe UI'; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(RL(d.r), x+5, y+4); ctx.textAlign='right'; ctx.fillText(SYM[d.s], x+cw-5, y+4);
      ctx.textAlign='center'; ctx.font=(cw*0.5)+'px Segoe UI'; ctx.fillText(SYM[d.s], x+cw/2, y+ch*0.56);
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Bac();
})();
</script>
</body>
</html>
