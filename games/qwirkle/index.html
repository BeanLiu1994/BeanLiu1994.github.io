<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0f1f" />
<title>霓虹方块 · Neon Qwirkle</title>
<style>
  :root{
    --bg:#0a0f1f; --surface:#121a30; --text:#eaf2ff; --muted:#7e90b3;
    --accent:#ff9f43; --accent2:#46e0ff; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#ff9f4355; --dim:#243352;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #1a2540 0%, transparent 60%),
                     radial-gradient(ellipse at 50% 100%, #201a30 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:460px;padding:12px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .title-block h1{font-size:1.4rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:54px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.t .value{color:var(--accent);}
  .score-card.p .value{color:var(--accent2);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:var(--board,#070e1e);}
  .toolbar{display:flex;gap:8px;margin-top:10px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  button.ghost{background:transparent;}
  .hint{text-align:center;color:var(--muted);font-size:0.72rem;margin-top:8px;line-height:1.5;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.7rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay p{color:var(--muted);font-size:0.9rem;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>霓虹方块 · NEON QWIRKLE</h1>
      <div class="sub">Match · Color · Shape</div>
    </div>
    <div class="score-panel">
      <div class="score-card t"><div class="label">得分</div><div class="value" id="score">0</div></div>
      <div class="score-card p"><div class="label">余牌</div><div class="value" id="left">108</div></div>
      <div class="score-card"><div class="label">最佳</div><div class="value" id="best">–</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">AUTO</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">完成！</h2>
      <p id="ovText"></p>
      <button class="auto on" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="auto" id="autoBtn">自动游玩</button>
    <button class="ghost" id="exBtn">换牌</button>
    <button class="ghost" id="restartBtn">重开</button>
  </div>
  <div class="hint">选下方<b>手牌</b>再点棋盘空格落子：同行/列需<b>同色或同形</b>且不可重复 · 凑齐 6 连得奖励 · 自动模式演示最优落子</div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const cv=$('cv'), elScore=$('score'), elLeft=$('left'), elBest=$('best'),
        elBadge=$('badge'), elOverlay=$('overlay'), elOvTitle=$('ovTitle'), elOvText=$('ovText'),
        btnAuto=$('autoBtn'), btnRestart=$('restartBtn'), btnEx=$('exBtn'), btnOv=$('ovBtn');

  const COLORS=['#ff5d6a','#ff9f43','#ffd23f','#5dffa6','#46a0ff','#b06bff'];
  const SHAPES=['circle','square','diamond','triangle','star','cross'];
  const BW=420, BH=420, RW=420, RH=104, W=420, H=BH+RH; // board + rack
  const PAD=14;
  let dpr=Math.min(2,(typeof devicePixelRatio!=='undefined'?devicePixelRatio||1:1));
  function setupCanvas(){
    if(!cv||!cv.getContext) return;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px'; cv.style.maxWidth='100%';
  }
  setupCanvas();
  const ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;

  function key(r,c){ return r+','+c; }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }

  let board, rack, bag, score, best;
  let over, won, auto, autoAccum, turnCount, noMoveStreak;
  let selected, lastPlaced, winPulse, autoTimer;

  try{ best=parseFloat(localStorage.getItem('qwirkle_best')); if(!(best>0)) best=0; }catch(e){best=0;}

  function newGame(){
    bag=[];
    for(let c=0;c<6;c++)for(let s=0;s<6;s++){ bag.push({color:c,shape:s}); bag.push({color:c,shape:s}); bag.push({color:c,shape:s}); }
    shuffle(bag);
    board=new Map();
    rack=[];
    for(let i=0;i<6;i++) rack.push(bag.pop());
    score=0; over=false; won=false; auto=false; autoAccum=0; turnCount=0; noMoveStreak=0;
    selected=-1; lastPlaced=null; winPulse=0; autoTimer=0;
    if(elBadge) elBadge.classList.remove('show');
    if(btnAuto){ btnAuto.classList.remove('on'); btnAuto.textContent='自动游玩'; }
    elOverlay.classList.remove('show');
    refreshHud();
  }

  function refreshHud(){
    if(elScore) elScore.textContent=score;
    if(elLeft) elLeft.textContent=(bag.length+rack.length);
    if(elBest) elBest.textContent=best>0?best:'–';
  }

  // ---- line / legality ----
  function lineTiles(r,c,dr,dc){
    const arr=[{r,c,t:board.get(key(r,c))}];
    let rr=r+dr,cc=c+dc;
    while(board.has(key(rr,cc))){ arr.push({r:rr,c:cc,t:board.get(key(rr,cc))}); rr+=dr; cc+=dc; }
    rr=r-dr; cc=c-dc;
    while(board.has(key(rr,cc))){ arr.unshift({r:rr,c:cc,t:board.get(key(rr,cc))}); rr-=dr; cc-=dc; }
    return arr;
  }
  function validLine(arr){
    if(arr.length<=1) return true;
    let sameColor=true, sameShape=true;
    for(const x of arr){ if(x.t.color!==arr[0].t.color) sameColor=false; if(x.t.shape!==arr[0].t.shape) sameShape=false; }
    if(!(sameColor||sameShape)) return false;
    const seen=new Set();
    for(const x of arr){ const k=x.t.color+','+x.t.shape; if(seen.has(k)) return false; seen.add(k); }
    return true;
  }
  function legalPlacement(tile,r,c,first){
    if(board.has(key(r,c))) return false;
    if(!first){
      let adj=false;
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]) if(board.has(key(r+dr,c+dc))) adj=true;
      if(!adj) return false;
    }
    board.set(key(r,c),tile);
    const h=validLine(lineTiles(r,c,0,1));
    const v=validLine(lineTiles(r,c,1,0));
    board.delete(key(r,c));
    return h&&v;
  }
  function runLen(r,c,dr,dc){
    let len=1, rr=r+dr,cc=c+dc;
    while(board.has(key(rr,cc))){ len++; rr+=dr; cc+=dc; }
    rr=r-dr; cc=c-dc;
    while(board.has(key(rr,cc))){ len++; rr-=dr; cc-=dc; }
    return len;
  }
  function scoreFor(tile,r,c){
    board.set(key(r,c),tile);
    const hL=runLen(r,c,0,1), vL=runLen(r,c,1,0);
    board.delete(key(r,c));
    let sc;
    if(hL>1&&vL>1) sc=hL+vL; else if(hL>1) sc=hL; else if(vL>1) sc=vL; else sc=1;
    if(hL===6||vL===6) sc+=6;
    return sc;
  }
  function emptyAdjCells(){
    const set=new Set();
    for(const k of board.keys()){
      const [r,c]=k.split(',').map(Number);
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nr=r+dr,nc=c+dc;
        if(!board.has(key(nr,nc))) set.add(key(nr,nc));
      }
    }
    return [...set].map(s=>s.split(',').map(Number));
  }
  function hasAnyLegalMove(){
    if(board.size===0) return rack.length>0;
    const cells=emptyAdjCells();
    for(const t of rack) for(const [r,c] of cells) if(legalPlacement(t,r,c,false)) return true;
    return false;
  }

  // ---- place / turn ----
  function placeTile(tile,r,c){
    const sc=scoreFor(tile,r,c);
    board.set(key(r,c),tile);
    score+=sc;
    lastPlaced={r,c};
    if(best===0||score>best){ best=score; try{localStorage.setItem('qwirkle_best',String(best));}catch(e){} }
    refreshHud();
    if(noMoveStreak>0) noMoveStreak=0;
  }
  function refill(){ while(rack.length<6 && bag.length>0) rack.push(bag.pop()); }
  function autoTurn(){
    turnCount++;
    if(turnCount>5000){ endGame(); return; }
    if(board.size===0){
      placeTile(rack.shift(),0,0); refill(); return;
    }
    const cells=emptyAdjCells();
    let bestMove=null, bestSc=-1;
    for(let i=0;i<rack.length;i++){
      const t=rack[i];
      for(const [r,c] of cells){
        if(legalPlacement(t,r,c,false)){
          const sc=scoreFor(t,r,c);
          if(sc>bestSc){ bestSc=sc; bestMove={tile:t,idx:i,r,c}; }
        }
      }
    }
    if(bestMove){
      rack.splice(bestMove.idx,1);
      placeTile(bestMove.tile,bestMove.r,bestMove.c);
      refill();
      if(bag.length===0 && !hasAnyLegalMove()) endGame();
    } else {
      // stuck: exchange
      noMoveStreak++;
      if(bag.length>0){ rack.shift(); rack.push(bag.pop()); }
      if(noMoveStreak>14 || (bag.length===0)) endGame();
    }
  }
  function endGame(){
    over=true; won=true; winPulse=1; auto=false;
    if(btnAuto){ btnAuto.classList.remove('on'); btnAuto.textContent='自动游玩'; }
    if(elBadge) elBadge.classList.remove('show');
    elOvTitle.textContent='🎉 完成！';
    elOvText.textContent='最终得分 '+score+' · 余牌 '+(bag.length+rack.length);
    elOverlay.classList.add('show');
  }

  function setAuto(v){
    auto=v;
    if(btnAuto){ btnAuto.classList.toggle('on',v); btnAuto.textContent=v?'自动中…':'自动游玩'; }
    if(elBadge) elBadge.classList.toggle('show',v);
    if(v && over){ newGame(); auto=true; if(btnAuto){btnAuto.classList.add('on');btnAuto.textContent='自动中…';} if(elBadge)elBadge.classList.add('show'); }
  }

  // ---- input ----
  function computeView(){
    let minR=0,maxR=0,minC=0,maxC=0, any=false;
    for(const k of board.keys()){ const [r,c]=k.split(',').map(Number); any=true;
      if(r<minR)minR=r; if(r>maxR)maxR=r; if(c<minC)minC=c; if(c>maxC)maxC=c; }
    let viewMinR,viewMinC,rows,cols;
    if(!any){ viewMinR=-1; viewMinC=-1; rows=3; cols=3; }
    else { viewMinR=minR-1; viewMinC=minC-1; rows=(maxR-minR)+3; cols=(maxC-minC)+3; }
    let ts=Math.min((BW-2*PAD)/cols,(BH-2*PAD)/rows); ts=Math.min(ts,56);
    const ox=(BW-cols*ts)/2, oy=(BH-rows*ts)/2;
    return {ox,oy,ts,viewMinR,viewMinC};
  }
  function cellAtBoard(x,y){
    if(y<0||y>BH) return null;
    const v=computeView();
    const c=Math.floor((x-v.ox)/v.ts)+v.viewMinC;
    const r=Math.floor((y-v.oy)/v.ts)+v.viewMinR;
    return {r,c};
  }
  function rackSlotAt(x,y){
    if(y<BH) return -1;
    const sw=BW/6;
    const i=Math.floor(x/sw);
    return (i>=0&&i<6)?i:-1;
  }
  function onDown(e){
    if(over||auto) return;
    let x=0,y=0;
    try{ const rect=cv.getBoundingClientRect(); const cx=(typeof e.clientX==='number')?e.clientX:0, cy=(typeof e.clientY==='number')?e.clientY:0;
      x=((cx-rect.left)/rect.width)*W; y=((cy-rect.top)/rect.height)*H; }catch(err){ return; }
    const slot=rackSlotAt(x,y);
    if(slot>=0){ selected=(selected===slot)?-1:slot; e.preventDefault&&e.preventDefault(); return; }
    const cell=cellAtBoard(x,y);
    if(cell && selected>=0 && selected<rack.length){
      const first=board.size===0;
      if(legalPlacement(rack[selected],cell.r,cell.c,first)){
        const t=rack[selected]; rack.splice(selected,1);
        placeTile(t,cell.r,cell.c); refill(); selected=-1;
        if(bag.length===0 && !hasAnyLegalMove()) endGame();
      } else {
        flash();
      }
    }
    e.preventDefault&&e.preventDefault();
  }
  let flashT=0;
  function flash(){ flashT=0.3; }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointerdown',onDown,{passive:false});
    cv.addEventListener('mousedown',onDown,{passive:false});
  }
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto) return; setAuto(!auto); if(auto&&over){ newGame(); setAuto(true);} });
  btnRestart&&btnRestart.addEventListener('click',()=>{ newGame(); setAuto(false); });
  btnEx&&btnEx.addEventListener('click',()=>{ if(over||auto) return; if(bag.length>0){ rack.shift(); rack.push(bag.pop()); refreshHud(); } });
  btnOv&&btnOv.addEventListener('click',()=>{ newGame(); setAuto(false); });

  // ---- update ----
  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  function update(dt){
    if(over){ if(winPulse>0) winPulse=Math.max(0,winPulse-dt*1.2); return; }
    if(flashT>0) flashT=Math.max(0,flashT-dt);
    if(auto){
      autoAccum+=dt;
      if(autoAccum>=0.22){ autoAccum=0; autoTurn(); }
    }
    if(winPulse>0) winPulse=Math.max(0,winPulse-dt*2);
  }

  // ---- render ----
  function drawShape(color,shape,cx,cy,s){
    ctx.save();
    ctx.shadowColor=color; ctx.shadowBlur=10;
    ctx.fillStyle=color; ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=Math.max(1,s*0.06);
    const r=s*0.42;
    ctx.beginPath();
    if(shape==='circle'){ ctx.arc(cx,cy,r,0,6.283); }
    else if(shape==='square'){ const a=s*0.36; ctx.rect(cx-a,cy-a,a*2,a*2); }
    else if(shape==='diamond'){ ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r,cy); ctx.closePath(); }
    else if(shape==='triangle'){ ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r*0.92,cy+r*0.78); ctx.lineTo(cx-r*0.92,cy+r*0.78); ctx.closePath(); }
    else if(shape==='star'){ for(let i=0;i<10;i++){ const ang=-Math.PI/2+i*Math.PI/5; const rad=(i%2===0)?r:r*0.45; const x=cx+Math.cos(ang)*rad, y=cy+Math.sin(ang)*rad; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.closePath(); }
    else if(shape==='cross'){ const a=s*0.16,b=s*0.42;
      ctx.moveTo(cx-a,cy-b);ctx.lineTo(cx+a,cy-b);ctx.lineTo(cx+a,cy-a);ctx.lineTo(cx+b,cy-a);ctx.lineTo(cx+b,cy+a);
      ctx.lineTo(cx+a,cy+a);ctx.lineTo(cx+a,cy+b);ctx.lineTo(cx-a,cy+b);ctx.lineTo(cx-a,cy+a);ctx.lineTo(cx-b,cy+a);
      ctx.lineTo(cx-b,cy-a);ctx.lineTo(cx-a,cy-a);ctx.closePath(); }
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    // board bg grid faint
    const v=computeView();
    ctx.strokeStyle='rgba(124,140,255,0.06)'; ctx.lineWidth=1;
    for(let r=v.viewMinR;r<v.viewMinR+30;r++)for(let c=v.viewMinC;c<v.viewMinC+30;c++){
      const x=v.ox+(c-v.viewMinC)*v.ts, y=v.oy+(r-v.viewMinR)*v.ts;
      if(x>v.ox+v.ts && x<v.ox+(BW/v.ts)*v.ts && y>v.oy && y<v.oy+BH) ctx.strokeRect(x,y,v.ts,v.ts);
    }
    // placed tiles
    for(const k of board.keys()){
      const [r,c]=k.split(',').map(Number); const t=board.get(k);
      const x=v.ox+(c-v.viewMinC+0.5)*v.ts, y=v.oy+(r-v.viewMinR+0.5)*v.ts;
      const isLast=lastPlaced&&lastPlaced.r===r&&lastPlaced.c===c;
      ctx.save();
      if(isLast){ ctx.shadowColor='#ffffff'; ctx.shadowBlur=20; }
      // tile backing
      ctx.fillStyle='rgba(255,255,255,0.04)';
      const pad=v.ts*0.08; ctx.fillRect(x-v.ts/2+pad,y-v.ts/2+pad,v.ts-2*pad,v.ts-2*pad);
      drawShape(COLORS[t.color],t.shape,x,y,v.ts*0.84);
      ctx.restore();
    }
    // rack
    const sw=BW/6, ry=BH+RH/2;
    ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(0,BH,BW,RH);
    for(let i=0;i<6;i++){
      const cx=sw*(i+0.5);
      if(i<rack.length){
        if(i===selected){ ctx.save(); ctx.strokeStyle='#ffd23f'; ctx.lineWidth=3; ctx.shadowColor='#ffd23f'; ctx.shadowBlur=16;
          ctx.strokeRect(cx-sw*0.42,ry-sw*0.42,sw*0.84,sw*0.84); ctx.restore(); }
        drawShape(COLORS[rack[i].color],rack[i].shape,cx,ry,sw*0.7);
      }
    }
    if(flashT>0){ ctx.save(); ctx.globalAlpha=flashT; ctx.fillStyle='#ff6b8a'; ctx.fillRect(0,0,BW,BH); ctx.restore(); }
    if(winPulse>0){ ctx.save(); ctx.globalAlpha=winPulse*0.5; ctx.fillStyle='#5dffa6'; ctx.fillRect(0,0,W,H); ctx.restore(); }
  }

  function frame(ts){
    const now=(typeof performance!=='undefined'?(ts!==undefined?ts:performance.now()):Date.now());
    let dt=(now-last)/1000; if(!(dt>0)||dt>0.05) dt=0.016; last=now;
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  newGame();

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;},
    get score(){return score;},
    get remaining(){return bag.length+rack.length;},
    get best(){return best;},
    startAuto(){ setAuto(true); if(over){ newGame(); setAuto(true);} },
    toggleAuto(){ setAuto(!auto); },
    restart(){ newGame(); setAuto(false); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); },
    tick(dt){ update(dt); render(); },
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get score(){return score;}, get remaining(){return bag.length+rack.length;}, get best(){return best;}
  };
})();
</script>
</body>
</html>
