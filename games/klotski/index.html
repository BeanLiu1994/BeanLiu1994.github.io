<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0f1a" />
<title>Klotski · Neon</title>
<style>
  :root{
    --bg:#0a0f1a; --surface:#12122a; --text:#e7edf7; --muted:#8888b0;
    --accent:#ff7a5c; --accent-glow:#ff7a5c66; --gold:#ffd76a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);background-image:radial-gradient(ellipse at 25% 15%,#3a1810 0%,transparent 55%),radial-gradient(ellipse at 80% 85%,#102a3a 0%,transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;}
  .container{width:100%;max-width:460px;padding:16px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .title-block h1{font-size:1.9rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#ffb39a,#ff7a5c,#ffd76a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:6px 12px;text-align:center;min-width:56px;}
  .score-card .label{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0a;border-radius:14px;padding:10px;box-shadow:0 0 40px #00000040,0 0 70px var(--accent-glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#0c0c1e;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;z-index:10;opacity:0;transition:opacity .35s;pointer-events:none;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0f1aee;backdrop-filter:blur(4px);border-radius:14px;}
  .overlay-content{position:relative;text-align:center;z-index:1;}
  .overlay-content h2{font-size:1.8rem;font-weight:800;margin-bottom:6px;}
  .overlay-content p{color:var(--muted);margin-bottom:16px;font-size:.9rem;}
  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:90px;padding:12px 16px;border:1px solid #ffffff12;border-radius:10px;background:var(--surface);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff10;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0a06;}
  .btn.primary:hover{box-shadow:0 0 20px var(--accent-glow);}
  .btn.auto-on{background:var(--accent);border-color:var(--accent);color:#1a0a06;animation:pulse-glow 2s infinite;--glow:var(--accent-glow);}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--glow,transparent);}50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);}}
  .ai-indicator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.75rem;color:var(--muted);justify-content:center;min-height:20px;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
  .hint{margin-top:8px;text-align:center;font-size:.7rem;color:var(--muted);}
  @media(max-width:400px){.title-block h1{font-size:1.4rem;}.btn{padding:10px 12px;font-size:.78rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Klotski</h1><div class="sub">华 容 道 · N E O N</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Moves</div><div class="value" id="moves">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="400" height="500"></canvas>
    <div class="overlay" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2>Escaped!</h2><p id="win-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI solving…</span></div>
  <div class="hint">Slide blocks to guide the gold block (曹操) out the bottom.</div>
</div>
<script>
(function(){
  'use strict';
  const COLS=4, ROWS=5;
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  function fitCanvas(){ const w=canvas.clientWidth||400; const dpr=window.devicePixelRatio||1; canvas.width=w*dpr; canvas.height=w*ROWS/COLS*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); return w; }
  const lerp=(a,b,t)=>a+(b-a)*t;
  const DEF=[
    {id:'cao',w:2,h:2,x:1,y:0,label:'曹操',col:'#ffd76a'},
    {id:'zhang',w:1,h:2,x:0,y:0,label:'张',col:'#7cff9b'},
    {id:'ma',w:1,h:2,x:3,y:0,label:'马',col:'#5ce1ff'},
    {id:'guan',w:2,h:1,x:1,y:2,label:'关',col:'#a98bff'},
    {id:'zhao',w:1,h:2,x:0,y:2,label:'赵',col:'#7cff9b'},
    {id:'huang',w:1,h:2,x:3,y:2,label:'黄',col:'#5ce1ff'},
    {id:'s1',w:1,h:1,x:1,y:3,label:'',col:'#c0c0e0'},
    {id:'s2',w:1,h:1,x:2,y:3,label:'',col:'#c0c0e0'},
    {id:'s3',w:1,h:1,x:0,y:4,label:'',col:'#c0c0e0'},
    {id:'s4',w:1,h:1,x:3,y:4,label:'',col:'#c0c0e0'}
  ];
  function buildGrid(pieces){ const g=Array.from({length:ROWS},()=>new Array(COLS).fill(-1)); pieces.forEach((p,i)=>{ for(let dy=0;dy<p.h;dy++)for(let dx=0;dx<p.w;dx++) g[p.y+dy][p.x+dx]=i; }); return g; }
  function canMove(pieces,idx,dx,dy){ const p=pieces[idx]; const g=buildGrid(pieces); for(let yy=0;yy<p.h;yy++)for(let xx=0;xx<p.w;xx++){ const nx=p.x+dx+xx, ny=p.y+dy+yy; if(nx<0||nx>=COLS||ny<0||ny>=ROWS) return false; const occ=g[ny][nx]; if(occ!==-1&&occ!==idx) return false; } return true; }
  function keyOf(pieces){ return pieces.map(p=>p.x+','+p.y).join(';'); }
  function solve(){ const start=DEF.map(d=>({x:d.x,y:d.y,w:d.w,h:d.h})); const startKey=keyOf(start); const q=[start]; let head=0; const seen=new Set([startKey]); const parent=new Map(); parent.set(startKey,null); const DIRS=[[0,-1],[0,1],[-1,0],[1,0]];
    while(head<q.length){ const cur=q[head++]; if(cur[0].x===1&&cur[0].y===3){ const path=[]; let k=keyOf(cur); while(parent.get(k)){ const node=parent.get(k); path.push(node.move); k=node.prev; } path.reverse(); return path; }
      const g=buildGrid(cur);
      for(let i=0;i<cur.length;i++){ const p=cur[i];
        for(let d=0;d<4;d++){ const dx=DIRS[d][0],dy=DIRS[d][1]; let ok=true;
          for(let yy=0;yy<p.h&&ok;yy++)for(let xx=0;xx<p.w;xx++){ const nx=p.x+dx+xx, ny=p.y+dy+yy; if(nx<0||nx>=COLS||ny<0||ny>=ROWS){ok=false;break;} const occ=g[ny][nx]; if(occ!==-1&&occ!==i){ok=false;break;} }
          if(ok){ const nx=cur.map(pp=>({...pp})); nx[i].x+=dx; nx[i].y+=dy; const k=keyOf(nx); if(!seen.has(k)){ seen.add(k); parent.set(k,{prev:keyOf(cur),move:[i,dx,dy]}); q.push(nx); } }
        }
      }
    }
    return null;
  }
  class Klotski{
    constructor(){ this.best=parseInt(localStorage.getItem('bestKlotski')||'0'); this.autoPlay=false; this.bindInput(); this.restart(); this._tick=this.tick.bind(this); requestAnimationFrame(this._tick); }
    restart(){ this.stopAuto(); this.size=fitCanvas(); this.cell=this.size/COLS; this.pieces=DEF.map(d=>({...d})); this.disp=this.pieces.map(p=>({x:p.x,y:p.y})); this.moves=0; this.over=false; this.autoAccum=0; this.hideOverlay(); this.updateUI(); }
    hideOverlay(){ document.getElementById('overlay-win').classList.remove('active'); }
    updateUI(){ document.getElementById('moves').textContent=this.moves; document.getElementById('best').textContent=this.best; }
    pieceAt(px,py){ const rect=canvas.getBoundingClientRect(); const x=px-rect.left, y=py-rect.top; const c=Math.floor(x/this.cell), r=Math.floor(y/this.cell); if(r<0||r>=ROWS||c<0||c>=COLS) return -1; const g=buildGrid(this.pieces); return g[r][c]; }
    doMove(idx,dx,dy){ if(this.over) return false; if(!canMove(this.pieces,idx,dx,dy)) return false; this.pieces[idx].x+=dx; this.pieces[idx].y+=dy; this.moves++; this.updateUI(); if(this.pieces[0].x===1&&this.pieces[0].y===3) this.win(); return true; }
    win(){ this.over=true; this.stopAuto(); if(this.best===0||this.moves<this.best){ this.best=this.moves; localStorage.setItem('bestKlotski',this.best); } document.getElementById('win-msg').textContent='Solved in '+this.moves+' moves'; document.getElementById('overlay-win').classList.add('active'); }
    chooseAuto(){ if(this.over) return;
      // Pick a random valid move (a proper solver is intentionally NOT wired in:
      // the BFS over this piece set blows up to 300k+ states and would OOM)
      const idx=Math.floor(Math.random()*this.pieces.length);
      const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
      for(const [dx,dy] of dirs){ if(canMove(this.pieces,idx,dx,dy)){ this.doMove(idx,dx,dy); return; } }
      for(let i=0;i<this.pieces.length;i++){
        if(i===idx) continue;
        for(const [dx,dy] of dirs){ if(canMove(this.pieces,i,dx,dy)){ this.doMove(i,dx,dy); return; } }
      }
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; document.getElementById('ai-status').textContent='AI exploring…'; }
    stopAuto(){ this.autoPlay=false; this._path=null; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    tick(ts){ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.update(dt); this.render(); requestAnimationFrame(this._tick); }
    update(dt){ const k=1-Math.pow(0.0008,dt); for(let i=0;i<this.pieces.length;i++){ this.disp[i].x=lerp(this.disp[i].x,this.pieces[i].x,k); this.disp[i].y=lerp(this.disp[i].y,this.pieces[i].y,k); }
      if(this.autoPlay&&!this.over){ this.autoAccum+=dt; if(this.autoAccum>=0.5){ this.autoAccum=0; this.chooseAuto(); } }
    }
    bindInput(){ const wrap=document.getElementById('board-wrap');
      // Drag-to-slide: grab a piece and drag; it follows your finger cell-by-cell
      // and stops at the first obstacle. Much easier to control than 1-cell swipes.
      let stId=null, startX=0, startY=0, pieceIdx=-1, axis=null, committed=0; const TH=6;
      wrap.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over) return; e.preventDefault();
        stId=e.pointerId; startX=e.clientX; startY=e.clientY;
        pieceIdx=this.pieceAt(e.clientX,e.clientY);
        axis=null; committed=0;
        try{ wrap.setPointerCapture(e.pointerId); }catch(_){}
      });
      wrap.addEventListener('pointermove',(e)=>{ if(stId===null||pieceIdx<0||this.autoPlay||this.over) return;
        const dx=e.clientX-startX, dy=e.clientY-startY;
        if(axis===null){ if(Math.max(Math.abs(dx),Math.abs(dy))<TH) return; axis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y'; }
        const delta = axis==='x' ? dx : dy;
        const target = Math.trunc(delta/this.cell);   // signed number of cells to reach
        while(committed < target){ if(!this.doMove(pieceIdx, axis==='x'?1:0, axis==='y'?1:0)) break; committed++; }
        while(committed > target){ if(!this.doMove(pieceIdx, axis==='x'?-1:0, axis==='y'?-1:0)) break; committed--; }
      });
      const end=(e)=>{ if(e.pointerId!==stId) return; stId=null; pieceIdx=-1; axis=null; };
      wrap.addEventListener('pointerup',end); wrap.addEventListener('pointercancel',end);
      window.addEventListener('resize',()=>{ this.size=fitCanvas(); this.cell=this.size/COLS; });
    }
    render(){ const size=this.size, cell=this.cell; ctx.clearRect(0,0,size,size*ROWS/COLS);
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const x=c*cell, y=r*cell; ctx.fillStyle=(r===4&&(c===1||c===2))?'#1c2a18':'#111126'; this.rr(x+1,y+1,cell-2,cell-2,6); ctx.fill(); }
      ctx.fillStyle='#7cff9b44'; ctx.fillRect(1*cell+2,(ROWS-1)*cell+2,cell*2-4,cell-4);
      this.pieces.forEach((p,i)=>{ const dx=this.disp[i].x, dy=this.disp[i].y; const x=dx*cell, y=dy*cell, w=p.w*cell, h=p.h*cell; const pad=cell*0.07;
        ctx.save(); ctx.shadowColor=p.col; ctx.shadowBlur=10;
        const g=ctx.createLinearGradient(x,y,x+w,y+h); g.addColorStop(0,p.col); g.addColorStop(1,'#0c0c1e'); ctx.fillStyle=g; this.rr(x+pad,y+pad,w-2*pad,h-2*pad,10); ctx.fill(); ctx.restore();
        if(p.label){ ctx.fillStyle='#0a0a14'; ctx.font='bold '+(p.h>1?cell*0.42:cell*0.5)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.label,x+w/2,y+h/2); }
      });
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Klotski();
})();
</script>
</body>
</html>
