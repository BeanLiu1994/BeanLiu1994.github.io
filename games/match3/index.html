<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a18" />
<title>Jewel Crush · Neon</title>
<style>
  :root{
    --bg:#0a0a18; --surface:#12122a; --board:#15163a; --text:#e7e7f5; --muted:#8888b0;
    --accent:#7c5cff; --accent-glow:#7c5cff66; --danger:#ff4d6a; --gold:#ffd76a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 20% 15%,#1c1240 0%,transparent 55%),radial-gradient(ellipse at 85% 85%,#102a3a 0%,transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:480px;padding:16px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .title-block h1{font-size:1.9rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,#a18bff,#7c5cff,#5ce1ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:6px 12px;text-align:center;min-width:54px;}
  .score-card .label{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.best .value{color:var(--gold);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0a;border-radius:14px;padding:10px;
    box-shadow:0 0 40px #00000040,0 0 70px var(--accent-glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:var(--board);}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;z-index:10;opacity:0;transition:opacity .35s;pointer-events:none;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0a18ee;backdrop-filter:blur(4px);border-radius:14px;}
  .overlay-content{position:relative;text-align:center;z-index:1;}
  .overlay-content h2{font-size:2rem;font-weight:800;margin-bottom:6px;}
  .overlay-content p{color:var(--muted);margin-bottom:16px;font-size:.9rem;}
  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:90px;padding:12px 16px;border:1px solid #ffffff12;border-radius:10px;background:var(--surface);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff10;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{box-shadow:0 0 20px var(--accent-glow);}
  .btn.auto-on{background:var(--accent);border-color:var(--accent);color:#fff;animation:pulse-glow 2s infinite;--glow:var(--accent-glow);}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--glow,transparent);}50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);}}
  .ai-indicator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.75rem;color:var(--muted);justify-content:center;min-height:20px;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
  .hint{margin-top:8px;text-align:center;font-size:.7rem;color:var(--muted);}
  @media(max-width:400px){.title-block h1{font-size:1.4rem;}.btn{padding:10px 12px;font-size:.78rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Jewel Crush</h1><div class="sub">N E O N &nbsp; M A T C H - 3</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="440" height="440"></canvas>
    <div class="overlay" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2>Nice!</h2><p id="win-msg">Keep crushing</p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI scanning…</span></div>
  <div class="hint">Tap a jewel, then tap an adjacent one to swap.</div>
</div>
<script>
(function(){
  'use strict';
  const COLS=8, ROWS=8, NCOL=6;
  const GEMS=['#ff5d8f','#5ce1ff','#7cff9b','#ffd76a','#a98bff','#ff9b5c'];
  const GEM_GLOW=['#ff5d8f','#5ce1ff','#7cff9b','#ffd76a','#a98bff','#ff9b5c'];
  const SWAP_MS=170, CLEAR_MS=190, FALL_MS=200, AUTO_DELAY=420;
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  function fitCanvas(){
    const w=canvas.clientWidth||440; const dpr=window.devicePixelRatio||1;
    canvas.width=w*dpr; canvas.height=w*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); return w;
  }
  const lerp=(a,b,t)=>a+(b-a)*t;
  class Match3{
    constructor(){
      this.best=parseInt(localStorage.getItem('bestMatch3')||'0');
      this.autoPlay=false; this.autoTimer=null; this.tickTimer=null;
      this.bindInput(); this.restart();
      this._tick=this.tick.bind(this); requestAnimationFrame(this._tick);
    }
    restart(){
      this.stopAuto(); this.size=fitCanvas(); this.cell=this.size/COLS;
      this.score=0; this.over=false; this.combo=0;
      this.board=[]; this.scale=[]; this.dispR=[]; this.dispC=[]; this.phase='idle'; this.pt=0; this.sel=null; this.swapPair=null; this.autoAccum=0;
      for(let r=0;r<ROWS;r++){
        this.board[r]=[]; this.scale[r]=[]; this.dispR[r]=[]; this.dispC[r]=[];
        for(let c=0;c<COLS;c++){ this.board[r][c]=-1; this.scale[r][c]=1; this.dispR[r][c]=r; this.dispC[r][c]=c; }
      }
      this.fillNoMatch();
      this.hideOverlays(); this.updateUI();
    }
    fillNoMatch(){
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        let col;
        do{ col=(Math.random()*NCOL)|0; }
        while((c>=2&&this.board[r][c-1]===col&&this.board[r][c-2]===col)||(r>=2&&this.board[r-1][c]===col&&this.board[r-2][c]===col));
        this.board[r][c]=col; this.scale[r][c]=0; this.dispR[r][c]=r-ROWS; this.dispC[r][c]=c; // drop-in
      }
    }
    key(r,c){return r+','+c;}
    inB(r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS;}
    findMatches(){
      const set=new Set();
      for(let r=0;r<ROWS;r++){ let run=1; for(let c=1;c<=COLS;c++){ const same=c<COLS&&this.board[r][c]!==-1&&this.board[r][c]===this.board[r][c-1]; if(same)run++; else{ if(run>=3)for(let k=c-run;k<c;k++)set.add(this.key(r,k)); run=1; } } }
      for(let c=0;c<COLS;c++){ let run=1; for(let r=1;r<=ROWS;r++){ const same=r<ROWS&&this.board[r][c]!==-1&&this.board[r][c]===this.board[r-1][c]; if(same)run++; else{ if(run>=3)for(let k=r-run;k<r;k++)set.add(this.key(k,c)); run=1; } } }
      return set;
    }
    hasAnyMatch(){ return this.findMatches().size>0; }
    trySwap(a,b){
      if(this.phase!=='idle'||this.over) return;
      this.swapCells(a,b); this.swapPair=[a,b]; this.phase='swap'; this.pt=0;
    }
    swapCells(a,b){ const t=this.board[a[0]][a[1]]; this.board[a[0]][a[1]]=this.board[b[0]][b[1]]; this.board[b[0]][b[1]]=t; }
    findBestSwap(){
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        // right
        if(c+1<COLS){ this.swapCells([r,c],[r,c+1]); const ok=this.hasAnyMatch(); this.swapCells([r,c],[r,c+1]); if(ok) return [[r,c],[r,c+1]]; }
        if(r+1<ROWS){ this.swapCells([r,c],[r+1,c]); const ok=this.hasAnyMatch(); this.swapCells([r,c],[r+1,c]); if(ok) return [[r,c],[r+1,c]]; }
      }
      return null;
    }
    gravity(){
      for(let c=0;c<COLS;c++){
        let ptr=ROWS-1;
        for(let r=ROWS-1;r>=0;r--){ if(this.board[r][c]!==-1){ if(ptr!==r){ this.board[ptr][c]=this.board[r][c]; this.board[r][c]=-1; this.dispR[ptr][c]=this.dispR[r][c]; this.scale[ptr][c]=this.scale[r][c]; } ptr--; } }
        for(let r=ptr;r>=0;r--){ this.board[r][c]=(Math.random()*NCOL)|0; this.scale[r][c]=1; this.dispR[r][c]=r-ROWS-1; this.dispC[r][c]=c; }
      }
    }
    // ---- AI ----
    chooseAuto(){
      const sw=this.findBestSwap();
      if(sw){ this.trySwap(sw[0],sw[1]); }
      else { const r=(Math.random()*ROWS)|0,c=(Math.random()*COLS)|0; const hor=Math.random()<.5; const b=hor?[r,c+1<COLS?c+1:c-1]:[r+1<ROWS?r+1:r-1,c]; this.trySwap([r,c],b); }
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    hideOverlays(){ document.getElementById('overlay-win').classList.remove('active'); }
    updateUI(){
      document.getElementById('score').textContent=this.score;
      document.getElementById('best').textContent=this.best;
    }
    tick(ts){
      const dt=Math.min(0.05, ts!==undefined?((ts-(this._last||ts))/1000):0.016); this._last=ts;
      this.animate(dt); this.advance(dt); this.render();
      requestAnimationFrame(this._tick);
    }
    animate(dt){
      const k=1-Math.pow(0.001,dt/1000); // smoothing
      const ks=1-Math.pow(0.0015,dt/1000);
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        this.dispR[r][c]=lerp(this.dispR[r][c],r,k);
        this.dispC[r][c]=lerp(this.dispC[r][c],c,k);
        const tgt=(this.phase==='clear'&&this.board[r][c]===-2)?0:1;
        this.scale[r][c]=lerp(this.scale[r][c],tgt,ks);
      }
    }
    advance(dt){
      if(this.over) return;
      this.pt+=dt;
      if(this.phase==='idle'){
        if(this.autoPlay){ this.autoAccum+=dt; if(this.autoAccum>=AUTO_DELAY){ this.autoAccum=0; this.chooseAuto(); } }
        return;
      }
      if(this.phase==='swap'){
        if(this.pt>=SWAP_MS){
          const m=this.findMatches();
          if(m.size>0){ this.combo=0; this.phase='clear'; this.pt=0; }
          else { this.swapCells(this.swapPair[0],this.swapPair[1]); this.phase='swapback'; this.pt=0; }
        }
      } else if(this.phase==='swapback'){
        if(this.pt>=SWAP_MS){ this.phase='idle'; this.pt=0; this.sel=null; }
      } else if(this.phase==='clear'){
        if(this.pt>=CLEAR_MS){
          this.combo++;
          const cells=[...this.findMatches()];
          let gained=0;
          cells.forEach(k=>{ const [r,c]=k.split(',').map(Number); this.board[r][c]=-2; gained+=10*this.combo; });
          this.score+=gained;
          if(this.score>this.best){ this.best=this.score; localStorage.setItem('bestMatch3',this.best); }
          this.updateUI();
          // remove cleared
          for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(this.board[r][c]===-2) this.board[r][c]=-1;
          this.gravity();
          this.phase='fall'; this.pt=0;
        }
      } else if(this.phase==='fall'){
        if(this.pt>=FALL_MS){ this.phase='idle'; this.pt=0; this.sel=null; }
      }
    }
    pointerToCell(px,py){
      const rect=canvas.getBoundingClientRect();
      const x=px-rect.left, y=py-rect.top; const c=Math.floor(x/(rect.width/COLS)), r=Math.floor(y/(rect.height/ROWS));
      if(this.inB(r,c)) return [r,c]; return null;
    }
    bindInput(){
      const wrap=document.getElementById('board-wrap');
      let downCell=null;
      wrap.addEventListener('pointerdown',(e)=>{
        if(this.autoPlay||this.over||this.phase!=='idle') return;
        const cell=this.pointerToCell(e.clientX,e.clientY); if(!cell) return;
        e.preventDefault();
        if(!this.sel){ this.sel=cell; }
        else {
          const dr=Math.abs(cell[0]-this.sel[0]), dc=Math.abs(cell[1]-this.sel[1]);
          if((dr+dc)===1){ const a=this.sel; this.sel=null; this.trySwap(a,cell); }
          else if(dr===0&&dc===0){ this.sel=null; }
          else { this.sel=cell; }
        }
      });
      window.addEventListener('resize',()=>{ this.size=fitCanvas(); this.cell=this.size/COLS; });
    }
    render(){
      const cell=this.cell; ctx.clearRect(0,0,this.size,this.size);
      // subtle grid
      ctx.fillStyle='#ffffff06';
      for(let i=0;i<=COLS;i++){ ctx.fillRect(i*cell,0,1,this.size); ctx.fillRect(0,i*cell,this.size,1); }
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        const col=this.board[r][c]; if(col<0) continue;
        const cx=(this.dispC[r][c]+0.5)*cell, cy=(this.dispR[r][c]+0.5)*cell;
        const s=this.scale[r][c]; if(s<=0.02) continue;
        const rad=cell*0.38*s;
        ctx.save();
        ctx.shadowColor=GEM_GLOW[col]; ctx.shadowBlur=14*s;
        const g=ctx.createRadialGradient(cx-rad*0.3,cy-rad*0.3,rad*0.2,cx,cy,rad);
        g.addColorStop(0,'#ffffff'); g.addColorStop(0.35,GEMS[col]); g.addColorStop(1,GEMS[col]);
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.fill();
        ctx.restore();
        if(this.sel&&this.sel[0]===r&&this.sel[1]===c){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,rad+3,0,Math.PI*2); ctx.stroke(); }
      }
    }
  }
  window.game=new Match3();
})();
</script>
</body>
</html>
