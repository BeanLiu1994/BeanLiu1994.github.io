<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#100a1e" />
<title>Hex 2048 · Neon</title>
<style>
  :root{
    --bg:#100a1e; --surface:#171029; --text:#f3ecff; --muted:#8779b8;
    --accent:#b18cff; --accent2:#39d0ff; --gold:#ffd166; --ok:#39ff9e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;position:fixed;width:100%;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #2a1556 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #10243f 0%, transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:480px;height:100vh;max-height:880px;display:flex;flex-direction:column;padding:12px;gap:10px;}
  .header{display:flex;align-items:center;justify-content:space-between;}
  .title-block h1{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff10;border-radius:10px;padding:6px 12px;text-align:center;min-width:54px;}
  .score-card .label{font-size:.5rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.best .value{color:var(--gold);}
  .board-wrap{position:relative;flex:1;min-height:0;background:var(--surface);border:1px solid #ffffff10;border-radius:16px;overflow:hidden;box-shadow:0 0 50px #00000040,0 0 70px #b18cff18;}
  .board-wrap, .board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:100%;}
  .controls{display:flex;gap:8px;}
  .btn{flex:1;min-width:80px;padding:11px 14px;border:1px solid #ffffff14;border-radius:11px;background:var(--surface);color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .18s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff12;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#100a1e;}
  .btn.primary:hover{box-shadow:0 0 22px #b18cff55;}
  .btn.auto-on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#100a1e;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 6px #b18cff44;}50%{box-shadow:0 0 20px #b18cff88,0 0 38px #39d0ff55;}}
  .ai-indicator{display:none;align-items:center;gap:8px;justify-content:center;font-size:.72rem;color:var(--muted);min-height:18px;}
  .ai-indicator.show{display:flex;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.7);}}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:5;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#100a1edd;backdrop-filter:blur(5px);}
  .overlay-content{position:relative;text-align:center;z-index:1;padding:20px;}
  .overlay-content h2{font-size:2rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay-content p{color:var(--muted);margin-bottom:14px;font-size:.85rem;}
  .hint{text-align:center;font-size:.64rem;color:var(--muted);line-height:1.5;}
  @media (max-width:400px){.title-block h1{font-size:1.3rem;}.btn{padding:10px;font-size:.76rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Hex 2048</h1><div class="sub">H E X A G O N   M E R G E</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay-over">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2>无路可走</h2>
        <p id="over-msg">六边形已填满，再来一局</p>
        <button class="btn primary" id="btn-again" style="min-width:140px;">再来一局</button>
      </div>
    </div>
  </div>
  <div class="ai-indicator" id="ai-indicator"><span class="ai-dot"></span><span id="ai-status">AI 自动合成中…</span></div>
  <div class="controls">
    <button class="btn primary" id="btn-auto">自动游玩</button>
    <button class="btn" id="btn-restart">重开</button>
  </div>
  <div class="hint">向六个方向滑动合并相同数字 · 合成 2048 即通关 · 自动模式 AI 替你凑出大数</div>
</div>
<script>
(function(){
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
  const overlay=document.getElementById('overlay-over'), overMsg=document.getElementById('over-msg');
  const btnAuto=document.getElementById('btn-auto'), btnRestart=document.getElementById('btn-restart'), btnAgain=document.getElementById('btn-again');
  const aiInd=document.getElementById('ai-indicator'), aiStatus=document.getElementById('ai-status');

  const R=3; // hexagon radius
  const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  const SQ3=Math.sqrt(3);
  const TAU=Math.PI*2;
  // color ramp by exponent
  const RAMP=['#3a2c5e','#5b3f8f','#7b54c0','#9b6cf0','#39d0ff','#39ff9e','#ffd166','#ff8a3d','#ff5d6c','#ff3df0','#b6ff00','#00ffe0'];
  function valColor(v){ const e=v<=0?0:Math.round(Math.log2(v)); return RAMP[Math.min(RAMP.length-1, Math.max(0,e-1))]; }

  class Game{
    constructor(){
      this.autoPlay=false; this.over=false;
      this.best=parseInt(localStorage.getItem('hex2048Best')||'0',10); bestEl.textContent=this.best;
      this.cells=[]; this.key=new Map();
      for(let q=-R;q<=R;q++) for(let r=-R;r<=R;r++){ if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=R){ const k=q+','+r; this.cells.push({q,r}); this.key.set(k,{q,r}); } }
      this.corners=new Set();
      for(const c of this.cells){ const deg=Math.max(Math.abs(c.q),Math.abs(c.r),Math.abs(c.q+c.r)); if(deg===R) this.corners.add(c.q+','+c.r); }
      this.dirAngle=DIRS.map(d=>{ const dx=SQ3*(d[0]+d[1]/2), dy=1.5*d[1]; return Math.atan2(dy,dx); });
      this.fit(); window.addEventListener('resize',()=>this.fit());
      this.bindInput(); this.newGame();
      this.last=performance.now(); this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){
      const rc=canvas.getBoundingClientRect();
      this.W=Math.max(300,Math.min(rc.width||420,480)); this.H=Math.max(360,Math.min(rc.height||640,860));
      const d=window.devicePixelRatio||1; canvas.width=this.W*d; canvas.height=this.H*d; ctx.setTransform(d,0,0,d,0,0);
      const raw=this.cells.map(c=>({c,nx:SQ3*(c.q+c.r/2),ny:1.5*c.r}));
      let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
      for(const o of raw){ minX=Math.min(minX,o.nx-1); maxX=Math.max(maxX,o.nx+1); minY=Math.min(minY,o.ny-SQ3/2); maxY=Math.max(maxY,o.ny+SQ3/2); }
      const availW=this.W*0.94, availH=this.H*0.96;
      this.size=Math.min(availW/(maxX-minX), availH/(maxY-minY));
      const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
      this.ox=this.W/2 - cx*this.size; this.oy=this.H/2 - cy*this.size;
    }
    px(q,r){ return { x:this.ox+SQ3*(q+r/2)*this.size, y:this.oy+1.5*r*this.size }; }
    newGame(){
      this.grid=new Map(); for(const c of this.cells) this.grid.set(c.q+','+c.r,0);
      this.score=0; this.level=0; this.over=false; this.overFrame=0;
      this.frame=0; this.lastAutoFrame=-99; this.autoStep=7; this.move=null; this.winShown=false;
      this.spawn(); this.spawn();
      scoreEl.textContent='0'; bestEl.textContent=this.best;
      overlay.classList.remove('active');
    }
    emptyCells(){ const e=[]; for(const c of this.cells){ if(!this.grid.get(c.q+','+c.r)) e.push(c); } return e; }
    spawn(){
      const e=this.emptyCells(); if(!e.length) return null;
      const c=e[Math.floor(Math.random()*e.length)]; const v=Math.random()<0.9?2:4; this.grid.set(c.q+','+c.r, v); return {q:c.q,r:c.r,v};
    }
    lineForDir(d){
      const [dq,dr]=d; const starts=[];
      for(const c of this.cells){ if(!this.grid.has((c.q-dq)+','+(c.r-dr))) starts.push(c); }
      const lines=[]; for(const s of starts){ const line=[]; let cur=s; while(this.grid.has(cur.q+','+cur.r)){ line.push(cur); cur={q:cur.q+dq,r:cur.r+dr}; } lines.push(line); }
      return lines;
    }
    // simulate move on a grid map copy; returns {grid, changed, merged, movemap}
    doMove(dir){
      const lines=this.lineForDir(dir);
      const ng=new Map(this.grid);
      const movemap=[]; let merged=0, changed=false;
      for(const line of lines){
        const v=line.map(c=>this.grid.get(c.q+','+c.r));
        const items=[]; for(let i=0;i<v.length;i++) if(v[i]) items.push({i,val:v[i]});
        const out=[]; let k=items.length-1;
        while(k>=0){ if(k>0&&items[k].val===items[k-1].val){ out.push({val:items[k].val*2,src:[items[k].i,items[k-1].i]}); merged++; k-=2; } else { out.push({val:items[k].val,src:[items[k].i]}); k--; } }
        out.reverse(); while(out.length<v.length) out.unshift({val:0,src:[]});
        for(let j=0;j<line.length;j++){
          const cell=line[j], nv=out[j].val; ng.set(cell.q+','+cell.r,nv);
          const prev=this.grid.get(cell.q+','+cell.r);
          if(prev!==nv) changed=true;
          if(nv>0){
            if(out[j].src.length===2){ const a=line[out[j].src[0]], b=line[out[j].src[1]]; movemap.push({fromQ:a.q,fromR:a.r,toQ:cell.q,toR:cell.r,value:prev,merged:true}); movemap.push({fromQ:b.q,fromR:b.r,toQ:cell.q,toR:cell.r,value:prev,merged:true}); movemap.push({toQ:cell.q,toR:cell.r,value:nv,result:true}); }
            else if(out[j].src.length===1){ const a=line[out[j].src[0]]; movemap.push({fromQ:a.q,fromR:a.r,toQ:cell.q,toR:cell.r,value:nv,merged:false}); }
          }
        }
      }
      return {grid:ng,changed,merged,movemap};
    }
    applyMove(dir){
      const res=this.doMove(dir); if(!res.changed) return false;
      this.grid=res.grid;
      let g=0; for(const m of res.movemap) if(m.result) g+=m.value;
      this.score+=g;
      if(this.score>this.best){ this.best=this.score; localStorage.setItem('hex2048Best',String(this.best)); bestEl.textContent=this.best; }
      scoreEl.textContent=this.score;
      const sp=this.spawn(); if(sp) res.movemap.push({spawn:true,toQ:sp.q,toR:sp.r,value:sp.v});
      this.move={map:res.movemap,t:0,dur:9};
      this.updateLevel();
      if(!this.winShown && this.level>=2048){ this.winShown=true; aiStatus.textContent='AI 已合成 2048 · 继续冲更高'; }
      return true;
    }
    updateLevel(){ let mx=0; for(const v of this.grid.values()) if(v>mx) mx=v; this.level=mx; }
    anyMove(){
      for(const d of DIRS){ const res=this.doMove(d); if(res.changed) return true; }
      return false;
    }
    startAuto(){ this.autoPlay=true; btnAuto.classList.add('auto-on'); btnAuto.textContent='自动中'; aiInd.classList.add('show'); aiStatus.textContent='AI 自动合成中…'; }
    stopAuto(){ this.autoPlay=false; btnAuto.classList.remove('auto-on'); btnAuto.textContent='自动游玩'; aiInd.classList.remove('show'); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else this.startAuto(); }
    bestDir(){
      let best=null, bestScore=-1e18;
      for(let di=0;di<DIRS.length;di++){ const res=this.doMove(DIRS[di]); if(!res.changed) continue; let sc=this.evalBoard(res.grid)+res.merged*60; if(sc>bestScore){ bestScore=sc; best=di; } }
      return best;
    }
    evalBoard(grid){
      let empty=0, mono=0; const vals=[];
      for(const c of this.cells){ const v=grid.get(c.q+','+c.r); if(!v) empty++; else vals.push(v); }
      // smoothness: compare neighbors
      let smooth=0;
      for(const c of this.cells){ const v=grid.get(c.q+','+c.r); if(!v) continue; for(const d of DIRS){ const nk=(c.q+d[0])+','+(c.r+d[1]); if(!this.grid.has(nk)) continue; const nv=grid.get(nk); if(nv) smooth-=Math.abs(Math.log2(v)-Math.log2(nv)); } }
      // corner: max tile in corner
      let mx=0; for(const v of grid.values()) if(v>mx) mx=v;
      let corner=0; for(const c of this.cells){ if(grid.get(c.q+','+c.r)===mx && this.corners.has(c.q+','+c.r)) corner=1; }
      let total=0; for(const v of vals) total+=Math.log2(v);
      return total*1.2 + smooth*1.5 + empty*12 + corner*120;
    }
    bindInput(){
      let sx=0,sy=0;
      const getXY=(e)=>{ const r=canvas.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX); const cy=(e.touches?e.touches[0].clientY:e.clientY); return {x:cx-r.left,y:cy-r.top}; };
      const onDown=(e)=>{ if(this.autoPlay||this.over||this.move) return; const p=getXY(e); sx=p.x; sy=p.y; e.preventDefault(); };
      const onUp=(e)=>{ if(this.autoPlay||this.over||this.move) return; const p=getXY(e); const dx=p.x-sx, dy=p.y-sy; if(Math.hypot(dx,dy)<18) return; const ang=Math.atan2(dy,dx); let bi=0,bd=1e9; for(let i=0;i<this.dirAngle.length;i++){ let da=Math.abs(Math.atan2(Math.sin(ang-this.dirAngle[i]),Math.cos(ang-this.dirAngle[i]))); if(da<bd){bd=da;bi=i;} } this.applyMove(DIRS[bi]); e.preventDefault(); };
      canvas.addEventListener('pointerdown',onDown); window.addEventListener('pointerup',onUp);
      canvas.addEventListener('touchstart',onDown,{passive:false}); window.addEventListener('touchend',onUp,{passive:false});
      window.addEventListener('keydown',(e)=>{ if(this.autoPlay||this.over||this.move) return; const m={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowUp:[0,-1],ArrowDown:[0,1],q:[1,-1],e:[-1,1]}; const d=m[e.key]; if(d) this.applyMove(d); });
    }
    loop(now){ const dt=Math.min(40,now-this.last); this.last=now; this.frame++; this.update(dt); this.render(); requestAnimationFrame(this.loop); }
    update(dt){
      const f=dt/16.67;
      if(this.move){ this.move.t+=f; if(this.move.t>=this.move.dur) this.move=null; }
      else if(this.autoPlay&&!this.over){
        if(this.frame-this.lastAutoFrame>=this.autoStep){ this.lastAutoFrame=this.frame; const di=this.bestDir();
          if(di!==null) this.applyMove(DIRS[di]); else this.gameOver(); }
      }
      if(this.over&&this.autoPlay&&this.frame-this.overFrame>40){ this.newGame(); if(this.autoPlay) btnAuto.classList.add('auto-on'); }
    }
    gameOver(){ if(this.over) return; this.over=true; this.overFrame=this.frame; if(!this.autoPlay) overlay.classList.add('active'); }
    hexPath(x,y,s){ ctx.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i); const vx=x+s*Math.cos(a), vy=y+s*Math.sin(a); if(i===0) ctx.moveTo(vx,vy); else ctx.lineTo(vx,vy); } ctx.closePath(); }
    drawCellHex(q,r,fill,stroke){
      const p=this.px(q,r); this.hexPath(p.x,p.y,this.size*0.92);
      if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.5; ctx.stroke(); }
    }
    drawTile(x,y,s,value,alpha,scale){
      const v=Math.max(2,value); const col=valColor(v);
      ctx.globalAlpha=alpha; ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=s*0.5;
      this.hexPath(x,y,s*scale); ctx.fill(); ctx.shadowBlur=0;
      ctx.globalAlpha=alpha; ctx.fillStyle='#ffffff'; ctx.globalAlpha=alpha*0.35; this.hexPath(x,y,s*scale*0.7); ctx.fill();
      ctx.globalAlpha=alpha; ctx.fillStyle='#0a0612'; ctx.font='bold '+Math.max(11,s*0.5)+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(v, x, y+1); ctx.globalAlpha=1;
    }
    render(){
      ctx.clearRect(0,0,this.W,this.H);
      for(const c of this.cells) this.drawCellHex(c.q,c.r,'#130e22','#221a3a');
      if(this.move){
        const e=this.move.t/this.move.dur; const er=e<0.5?2*e*e:1-Math.pow(-2*e+2,2)/2;
        for(const m of this.move.map){ if(m.result||m.spawn) continue; if(m.merged && e>0.5) continue; const from=this.px(m.fromQ,m.fromR), to=this.px(m.toQ,m.toR); const x=from.x+(to.x-from.x)*er, y=from.y+(to.y-from.y)*er; this.drawTile(x,y,this.size,m.value,1,1); }
        if(e>0.5){ for(const m of this.move.map){ if(m.result){ const p=this.px(m.toQ,m.toR); const sc=Math.min(1,(e-0.5)*2.2); this.drawTile(p.x,p.y,this.size,m.value,1,sc); } else if(m.spawn){ const p=this.px(m.toQ,m.toR); const sc=Math.min(1,e*1.4); this.drawTile(p.x,p.y,this.size,m.value,sc,sc); } } }
      } else if(!this.over){
        for(const c of this.cells){ const v=this.grid.get(c.q+','+c.r); if(v) { const p=this.px(c.q,c.r); this.drawTile(p.x,p.y,this.size,v,1,1); } }
      }
    }
  }
  const game=new Game();
  window.game=game;
  btnAuto.addEventListener('click',()=>game.toggleAuto());
  btnRestart.addEventListener('click',()=>{ game.stopAuto(); game.newGame(); });
  btnAgain.addEventListener('click',()=>{ game.stopAuto(); game.newGame(); });
})();
</script>
</body>
</html>
