<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a1a" />
<title>Bubble Pop · Neon</title>
<style>
  :root{
    --bg:#0a0a1a; --surface:#12122a; --board:#16163a; --text:#e0e0f0; --muted:#8888aa;
    --accent:#ff7ad9; --accent-glow:#ff7ad966; --danger:#ff4d6a; --gold:#ffd700;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);background-image:radial-gradient(ellipse at 20% 20%,#2a1030 0%,transparent 55%),radial-gradient(ellipse at 80% 80%,#102a38 0%,transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;}
  .container{width:100%;max-width:460px;padding:16px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .title-block h1{font-size:1.9rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--accent),#ffc7ef,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:6px 14px;text-align:center;min-width:58px;}
  .score-card .label{font-size:0.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.best .value{color:var(--gold);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0a;border-radius:14px;padding:10px;box-shadow:0 0 40px #00000030,0 0 70px var(--accent-glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#0b0b1c;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;z-index:10;pointer-events:none;opacity:0;transition:opacity .35s;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0a1aee;backdrop-filter:blur(4px);border-radius:14px;}
  .overlay-content{position:relative;text-align:center;z-index:1;}
  .overlay-content h2{font-size:2rem;font-weight:800;margin-bottom:6px;}
  .overlay-content p{color:var(--muted);margin-bottom:16px;font-size:0.9rem;}
  .overlay.win h2{color:#4dff91;} .overlay.lose h2{color:var(--danger);}
  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:90px;padding:12px 16px;border:1px solid #ffffff12;border-radius:10px;background:var(--surface);color:var(--text);font-size:0.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff10;} .btn:active{transform:scale(0.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0a0a1a;}
  .btn.primary:hover{box-shadow:0 0 20px var(--accent-glow);}
  .btn.auto-on{background:var(--accent);border-color:var(--accent);color:#0a0a1a;animation:pulse-glow 2s infinite;--glow:var(--accent-glow);}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--glow,transparent);}50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);}}
  .ai-indicator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:0.75rem;color:var(--muted);justify-content:center;min-height:20px;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
  .stats-bar{display:flex;gap:8px;justify-content:center;margin-top:8px;font-size:0.7rem;color:var(--muted);}
  .stats-bar span{background:var(--surface);padding:3px 8px;border-radius:6px;border:1px solid #ffffff08;}
  @media (max-width:400px){.title-block h1{font-size:1.4rem;}.btn{padding:10px 12px;font-size:.78rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Bubble Pop</h1><div class="sub">H E X &nbsp; S H O O T E R</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game"></canvas>
    <div class="overlay win" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2>Cleared!</h2><p id="win-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
    <div class="overlay lose" id="overlay-lose"><div class="overlay-bg"></div><div class="overlay-content"><h2>Too Low!</h2><p id="lose-msg"></p><button class="btn primary" onclick="game.restart()">Try Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Board</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI aiming...</span></div>
  <div class="stats-bar"><span id="bub-stat">Bubbles: 0</span><span id="combo-stat">Combo: 0</span></div>
</div>
<script>
(function(){
  'use strict';
  const W=400,H=540,r=15,COLS=11,MAXROWS=14,rowH=r*1.732,topMargin=38;
  const ox=(W-COLS*2*r)/2+r, shooterY=H-34, shooterX=W/2;
  const PAL=['#ff4d6a','#4dff91','#4d9bff','#ffd166','#b06bff'];
  const canvas=document.getElementById('game');
  function fit(){ const dpr=window.devicePixelRatio||1; canvas.width=W*dpr; canvas.height=H*dpr; const c=canvas.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); return c; }
  const ctx=fit();
  const centerX=(row,col)=>ox+col*2*r+(row%2?r:0);
  const centerY=(row)=>topMargin+r+rowH*row;

  class Bubble{
    constructor(){ this.best=parseInt(localStorage.getItem('bestBub')||'0'); this.autoPlay=false; this.running=false; this.rafId=null; this.bindInput(); this.restart(); }
    restart(){ this.stopAuto(); this.stopLoop();
      this.grid=[]; for(let row=0;row<MAXROWS;row++) this.grid.push(new Array(row%2?COLS-1:COLS).fill(null));
      for(let row=0;row<5;row++) for(let col=0;col<this.grid[row].length;col++) this.grid[row][col]=Math.floor(Math.random()*PAL.length);
      this.current=Math.floor(Math.random()*PAL.length); this.next=Math.floor(Math.random()*PAL.length);
      this.proj=null; this.angle=0; this.score=0; this.combo=0; this.over=false; this.autoDelay=0;
      document.getElementById('overlay-win').classList.remove('active'); document.getElementById('overlay-lose').classList.remove('active');
      this.startLoop();
    }
    neighbors(row,col){ const e=row%2===0; const base=e?[[row,col-1],[row,col+1],[row-1,col-1],[row-1,col],[row+1,col-1],[row+1,col]]:[[row,col-1],[row,col+1],[row-1,col],[row-1,col+1],[row+1,col],[row+1,col+1]];
      return base.filter(([rr,cc])=>rr>=0&&rr<MAXROWS&&cc>=0&&cc<this.grid[rr].length); }
    countBubbles(){ let n=0; for(const row of this.grid) for(const c of row) if(c!=null) n++; return n; }
    march(angle){ let x=shooterX,y=shooterY,dx=Math.sin(angle),dy=-Math.cos(angle); const step=4;
      for(let i=0;i<500;i++){ x+=dx*step; y+=dy*step; if(x<r){x=r;dx=-dx;} if(x>W-r){x=W-r;dx=-dx;} if(y<=topMargin+r) return {x,y};
        for(let row=0;row<MAXROWS;row++) for(let col=0;col<this.grid[row].length;col++){ if(this.grid[row][col]!=null){ const d=Math.hypot(centerX(row,col)-x,centerY(row)-y); if(d<2*r-3) return {x,y}; } } }
      return {x,y}; }
    snap(x,y){ let row=Math.max(0,Math.round((y-topMargin-r)/rowH)); row=Math.min(MAXROWS-1,row); let col=Math.round((x-ox-(row%2?r:0))/(2*r)); col=Math.max(0,Math.min(this.grid[row].length-1,col));
      if(this.grid[row][col]==null) return {row,col};
      let best=null,bd=1e9; const cand=[[row,col],[row,col-1],[row,col+1],[row-1,col],[row-1,col-1],[row+1,col],[row+1,col-1],[row+1,col+1]];
      for(const [rr,cc] of cand){ if(rr<0||rr>=MAXROWS||cc<0||cc>=this.grid[rr].length) continue; if(this.grid[rr][cc]==null){ const d=Math.hypot(centerX(rr,cc)-x,centerY(rr)-y); if(d<bd){bd=d;best={row:rr,col:cc};} } }
      return best||{row,col}; }
    cluster(row,col,color){ const seen=new Set([row+','+col]); const stack=[[row,col]]; let n=0; while(stack.length){ const [rr,cc]=stack.pop(); n++; for(const [nr,nc] of this.neighbors(rr,cc)){ const k=nr+','+nc; if(seen.has(k)) continue; if(this.grid[nr][nc]===color){ seen.add(k); stack.push([nr,nc]); } } } return n; }
    fire(angle){ if(this.over||this.proj) return; this.angle=angle; const dx=Math.sin(angle),dy=-Math.cos(angle); this.proj={x:shooterX,y:shooterY,dx,dy,color:this.current}; }
    updateProj(){ if(!this.proj) return; const step=7; this.proj.x+=this.proj.dx*step; this.proj.y+=this.proj.dy*step; if(this.proj.x<r){this.proj.x=r;this.proj.dx=-this.proj.dx;} if(this.proj.x>W-r){this.proj.x=W-r;this.proj.dx=-this.proj.dx;}
      if(this.proj.y<=topMargin+r){ this.land(); return; }
      for(let row=0;row<MAXROWS;row++) for(let col=0;col<this.grid[row].length;col++){ if(this.grid[row][col]!=null){ const d=Math.hypot(centerX(row,col)-this.proj.x,centerY(row)-this.proj.y); if(d<2*r-3){ this.land(); return; } } }
    }
    land(){ const p=this.proj; const cell=this.snap(p.x,p.y); this.proj=null; if(this.grid[cell.row][cell.col]!=null){ const alt=this.snap(p.x,p.y+2); cell.row=alt.row; cell.col=alt.col; }
      this.grid[cell.row][cell.col]=p.color; const cnt=this.cluster(cell.row,cell.col,p.color);
      if(cnt>=3){ this.removeCluster(cell.row,cell.col); this.combo++; this.score+=cnt*10*this.combo; if(this.score>this.best){this.best=this.score;localStorage.setItem('bestBub',this.best);} this.dropFloating(); }
      else this.combo=0;
      this.current=this.next; this.next=Math.floor(Math.random()*PAL.length);
      if(this.countBubbles()===0){ this.win(); return; }
      for(let row=0;row<MAXROWS;row++) for(let col=0;col<this.grid[row].length;col++){ if(this.grid[row][col]!=null && centerY(row)+r>=shooterY-18){ this.lose(); return; } }
    }
    removeCluster(row,col){ const color=this.grid[row][col]; const seen=new Set([row+','+col]); const stack=[[row,col]]; while(stack.length){ const [rr,cc]=stack.pop(); this.grid[rr][cc]=null; for(const [nr,nc] of this.neighbors(rr,cc)){ const k=nr+','+nc; if(seen.has(k)) continue; if(this.grid[nr][nc]===color){ seen.add(k); stack.push([nr,nc]); } } } }
    dropFloating(){ const anchored=new Set(); const stack=[]; for(let col=0;col<this.grid[0].length;col++) if(this.grid[0][col]!=null){ anchored.add('0,'+col); stack.push([0,col]); }
      while(stack.length){ const [rr,cc]=stack.pop(); for(const [nr,nc] of this.neighbors(rr,cc)){ const k=nr+','+nc; if(anchored.has(k)) continue; if(this.grid[nr][nc]!=null){ anchored.add(k); stack.push([nr,nc]); } } }
      for(let row=0;row<MAXROWS;row++) for(let col=0;col<this.grid[row].length;col++){ if(this.grid[row][col]!=null && !anchored.has(row+','+col)) this.grid[row][col]=null; }
    }
    win(){ this.over=true; this.autoPlay=false; document.getElementById('win-msg').textContent='Board cleared · '+this.score+' pts'; document.getElementById('overlay-win').classList.add('active'); this.autoCont(); }
    lose(){ this.over=true; this.autoPlay=false; document.getElementById('lose-msg').textContent='Bubbles reached the floor'; document.getElementById('overlay-lose').classList.add('active'); this.autoCont(); }
    bestAim(){ let best={ang:0,score:-1}; for(let a=-78;a<=78;a+=5){ const ang=a*Math.PI/180; const pt=this.march(ang); const cell=this.snap(pt.x,pt.y); if(!cell) continue; const cnt=this.cluster(cell.row,cell.col,this.current); let s=cnt; if(cnt>=3) s+=12; if(centerY(cell.row)>H-130) s-=6; if(s>best.score) best={ang,s}; } return best.ang; }
    autoCont(){ if(!this.autoActive) return; const self=this; this.contTimer=setTimeout(()=>{ if(!self.autoActive) return; self.restart(); self.startAuto(); },1400); }
    toggleAuto(){ if(this.autoPlay){ this.autoActive=false; this.stopAuto(); } else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoActive=true; this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; this.autoDelay=20; }
    stopAuto(){ this.autoPlay=false; if(this.contTimer){clearTimeout(this.contTimer);this.contTimer=null;} const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    startLoop(){ this.stopLoop(); this.running=true; this.lastT=performance.now(); this.acc=0; const loop=()=>{ if(!this.running) return; const now=performance.now(); this.acc+=now-this.lastT; this.lastT=now; if(this.acc>500) this.acc=16; while(this.acc>=16){ this.acc-=16; if(!this.over){ if(this.proj) this.updateProj(); else if(this.autoPlay){ this.autoDelay--; if(this.autoDelay<=0){ this.fire(this.bestAim()); this.autoDelay=26; } } } } this.draw(); this.rafId=requestAnimationFrame(loop); }; this.rafId=requestAnimationFrame(loop); }
    stopLoop(){ this.running=false; if(this.rafId){ cancelAnimationFrame(this.rafId); this.rafId=null; } }
    bindInput(){ const wrap=document.getElementById('board-wrap'); let id=null;
      const aimAt=(cx,cy)=>{ const dx=cx-shooterX, dy=cy-shooterY; if(dy>=-4) return; let ang=Math.atan2(dx,-dy); ang=Math.max(-78*Math.PI/180,Math.min(78*Math.PI/180,ang)); this.angle=ang; };
      wrap.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over) return; id=e.pointerId; try{wrap.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); const r2=canvas.getBoundingClientRect(); aimAt((e.clientX-r2.left)/r2.width*W,(e.clientY-r2.top)/r2.height*H); });
      wrap.addEventListener('pointermove',(e)=>{ if(this.autoPlay||this.over||e.pointerId!==id) return; const r2=canvas.getBoundingClientRect(); aimAt((e.clientX-r2.left)/r2.width*W,(e.clientY-r2.top)/r2.height*H); });
      const fire=(e)=>{ if(this.autoPlay||this.over||e.pointerId!==id) return; const r2=canvas.getBoundingClientRect(); aimAt((e.clientX-r2.left)/r2.width*W,(e.clientY-r2.top)/r2.height*H); this.fire(this.angle); id=null; };
      wrap.addEventListener('pointerup',fire); wrap.addEventListener('pointercancel',(e)=>{ if(e.pointerId===id) id=null; });
      document.addEventListener('keydown',(e)=>{ if(this.autoPlay||this.over) return; if(e.key===' '){ this.fire(this.angle); e.preventDefault(); } });
      window.addEventListener('resize',()=>this.draw()); }
    draw(){ ctx.clearRect(0,0,W,H);
      ctx.strokeStyle='#ff7ad933'; ctx.beginPath(); ctx.moveTo(0,shooterY-18); ctx.lineTo(W,shooterY-18); ctx.stroke();
      for(let row=0;row<MAXROWS;row++) for(let col=0;col<this.grid[row].length;col++){ if(this.grid[row][col]!=null){ this.bubble(centerX(row,col),centerY(row),r,PAL[this.grid[row][col]]); } }
      if(this.proj) this.bubble(this.proj.x,this.proj.y,r,PAL[this.proj.color]);
      // aim line
      if(!this.proj){ ctx.strokeStyle='#ffffff33'; ctx.setLineDash([4,6]); ctx.beginPath(); ctx.moveTo(shooterX,shooterY); ctx.lineTo(shooterX+Math.sin(this.angle)*60,shooterY-Math.cos(this.angle)*60); ctx.stroke(); ctx.setLineDash([]); }
      // next bubble preview + shooter
      this.bubble(shooterX,shooterY,r,PAL[this.current]);
      ctx.fillStyle='#ffffff66'; ctx.font='10px Segoe UI'; ctx.textAlign='left'; ctx.fillText('NEXT',W-44,shooterY-22); this.bubble(W-30,shooterY,r*0.7,PAL[this.next]);
      document.getElementById('score').textContent=this.score; document.getElementById('best').textContent=this.best; document.getElementById('bub-stat').textContent='Bubbles: '+this.countBubbles(); document.getElementById('combo-stat').textContent='Combo: '+this.combo;
      if(this.autoPlay) document.getElementById('ai-status').textContent='AI: '+this.countBubbles()+' bubbles · aiming';
    }
    bubble(x,y,rr,col){ ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=10; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.fill(); ctx.restore(); ctx.fillStyle='#ffffff44'; ctx.beginPath(); ctx.arc(x-rr*0.3,y-rr*0.3,rr*0.3,0,7); ctx.fill(); }
  }
  window.game=new Bubble();
})();
</script>
</body>
</html>
