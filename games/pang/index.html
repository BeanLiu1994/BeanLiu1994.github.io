<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0f1f" />
<title>霓虹爆裂 · Neon Pang</title>
<style>
  :root{
    --bg:#0a0f1f; --surface:#121a30; --text:#eaf2ff; --muted:#7e90b3;
    --accent:#ff5db1; --accent2:#46e0ff; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#ff5db155; --dim:#243352;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #1a2540 0%, transparent 60%),
                     radial-gradient(ellipse at 50% 100%, #1a0f30 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:460px;padding:12px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .title-block h1{font-size:1.4rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:54px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.t .value{color:var(--accent);}
  .score-card.p .value{color:var(--accent2);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:var(--board,#070e1e);}
  .toolbar{display:flex;gap:8px;margin-top:10px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  button.ghost{background:transparent;}
  .hint{text-align:center;color:var(--muted);font-size:0.72rem;margin-top:8px;line-height:1.5;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.7rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay p{color:var(--muted);font-size:0.9rem;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>霓虹爆裂 · NEON PANG</h1>
      <div class="sub">Aim · Shoot · Clear</div>
    </div>
    <div class="score-panel">
      <div class="score-card t"><div class="label">剩余</div><div class="value" id="remain">0</div></div>
      <div class="score-card p"><div class="label">清除</div><div class="value" id="cleared">0</div></div>
      <div class="score-card"><div class="label">最佳</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">AUTO</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">胜利！</h2>
      <p id="ovText"></p>
      <button class="auto on" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="auto" id="autoBtn">自动游玩</button>
    <button class="ghost" id="restartBtn">重开</button>
  </div>
  <div class="hint"><b>拖动</b>移动炮台，<b>点击/按住</b>发射鱼叉击破泡泡 · 大泡裂成小泡，清空全部通关 · 自动模式<b>无敌</b>带你速通</div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const cv=$('cv'), elRemain=$('remain'), elCleared=$('cleared'), elBest=$('best'),
        elBadge=$('badge'), elOverlay=$('overlay'), elOvTitle=$('ovTitle'), elOvText=$('ovText'),
        btnAuto=$('autoBtn'), btnRestart=$('restartBtn'), btnOv=$('ovBtn');

  const W=420, H=600, bw=W, bh=H;
  let dpr=Math.min(2,(typeof devicePixelRatio!=='undefined'?devicePixelRatio||1:1));
  function setupCanvas(){
    if(!cv||!cv.getContext) return;
    cv.width=bw*dpr; cv.height=bh*dpr;
    cv.style.width=bw+'px'; cv.style.height=bh+'px'; cv.style.maxWidth='100%';
  }
  setupCanvas();
  const ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;

  const GRAV=420;
  const TIER_R=[13,20,28];
  const FLOOR=H-66, CEIL=6, PLAYER_Y=H-34, PLAYER_R=15;
  let playerX, targetX, cooldown, harpoonActive;
  let bubbles, cleared, over, won, auto, invuln, autoTimer, flash, shake, best;
  let particles=[], popFlash=0;

  try{ best=parseInt(localStorage.getItem('pang_best')||'0',10)||0; }catch(e){best=0;}

  function rand(a,b){ return a+Math.random()*(b-a); }

  function newGame(){
    playerX=W/2; targetX=W/2; cooldown=0; harpoonActive=0;
    cleared=0; over=false; won=false; invuln=false; autoTimer=0; flash=0; shake=0; popFlash=0;
    particles=[];
    bubbles=[];
    const n=4;
    const tiers=[2,2,1,2];
    for(let i=0;i<n;i++){
      const tier=tiers[i%tiers.length];
      bubbles.push({
        x:rand(40,W-40), y:rand(40,180),
        vy:rand(-60,60), vx:rand(-34,34),
        r:TIER_R[tier], tier
      });
    }
    elOverlay.classList.remove('show');
  }

  function setAuto(v){
    auto=v; invuln=v;
    if(btnAuto){ btnAuto.classList.toggle('on',v); btnAuto.textContent=v?'自动中…':'自动游玩'; }
    if(elBadge) elBadge.classList.toggle('show',v);
  }

  function spawnParticles(x,y,r,tier){
    const hue = tier===2 ? '#ff5db1' : tier===1 ? '#46e0ff' : '#ffd23f';
    for(let i=0;i<10;i++){
      const a=Math.random()*6.28, sp=rand(40,160);
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col:hue});
    }
  }

  function popBubble(idx){
    const b=bubbles[idx];
    spawnParticles(b.x,b.y,b.r,b.tier);
    popFlash=1;
    if(b.tier>0){
      const nt=b.tier-1, nr=TIER_R[nt];
      bubbles.splice(idx,1);
      bubbles.push({x:b.x-b.r*0.45,y:b.y,vy:-130,vx:-40,r:nr,tier:nt});
      bubbles.push({x:b.x+b.r*0.45,y:b.y,vy:130,vx:40,r:nr,tier:nt});
    } else {
      bubbles.splice(idx,1);
    }
    cleared++;
  }

  function fire(){
    if(cooldown>0) return;
    cooldown=0.18; harpoonActive=0.10;
    let hit=-1, bestY=-1;
    for(let i=0;i<bubbles.length;i++){
      const b=bubbles[i];
      if(playerX>=b.x-b.r && playerX<=b.x+b.r){
        if(b.y>bestY){ bestY=b.y; hit=i; }
      }
    }
    if(hit>=0) popBubble(hit);
  }

  function winGame(){
    over=true; won=true;
    if(best===0||cleared>best){ best=cleared; try{localStorage.setItem('pang_best',String(best));}catch(e){} }
    if(auto){ elOvTitle.textContent='⚡ 自动通关！'; elOvText.textContent='清除 '+cleared+' 颗泡泡'; autoTimer=1.0; }
    else { elOvTitle.textContent='🎉 通关！'; elOvText.textContent='清除 '+cleared+' 颗泡泡'; elOverlay.classList.add('show'); }
  }
  function loseGame(){
    over=true; won=false;
    if(auto){ newGame(); setAuto(true); return; }
    elOvTitle.textContent='💥 被击中'; elOvText.textContent='清除 '+cleared+' 颗泡泡'; elOverlay.classList.add('show');
  }

  function autoControl(dt){
    if(bubbles.length===0) return;
    let low=bubbles[0];
    for(const b of bubbles) if(b.y>low.y) low=b;
    targetX=low.x;
    playerX += (targetX-playerX)*Math.min(1,dt*16);
    let aligned=false;
    for(const b of bubbles){ if(Math.abs(b.x-playerX)<=b.r){ aligned=true; break; } }
    if(aligned) fire();
  }

  // ---- input ----
  function pointerToX(e){
    let x=playerX;
    try{
      const rect=cv.getBoundingClientRect();
      const cx=(typeof e.clientX==='number')?e.clientX:0;
      x=((cx-rect.left)/rect.width)*W;
    }catch(err){}
    return Math.max(PLAYER_R, Math.min(W-PLAYER_R, x));
  }
  function onDown(e){ if(over||auto) return; targetX=pointerToX(e); fire(); e.preventDefault&&e.preventDefault(); }
  function onMove(e){ if(over||auto) return; targetX=pointerToX(e); e.preventDefault&&e.preventDefault(); }
  function onUp(e){ if(over||auto) return; e.preventDefault&&e.preventDefault(); }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointerdown',onDown,{passive:false});
    cv.addEventListener('pointermove',onMove,{passive:false});
    cv.addEventListener('pointerup',onUp,{passive:false});
    cv.addEventListener('pointercancel',onUp,{passive:false});
    cv.addEventListener('touchstart',onDown,{passive:false});
    cv.addEventListener('touchmove',onMove,{passive:false});
    cv.addEventListener('touchend',onUp,{passive:false});
  }
  window.addEventListener('keydown',(e)=>{ if(over||auto) return; if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){ targetX=Math.max(PLAYER_R,targetX-22);} else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){ targetX=Math.min(W-PLAYER_R,targetX+22);} else if(e.key===' '){ fire(); e.preventDefault&&e.preventDefault(); } });
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto) return; setAuto(!auto); if(auto&&over){ newGame(); setAuto(true);} });
  btnRestart&&btnRestart.addEventListener('click',()=>{ newGame(); setAuto(false); });
  btnOv&&btnOv.addEventListener('click',()=>{ newGame(); setAuto(false); });

  // ---- update ----
  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  function update(dt){
    if(over){
      if(auto){ autoTimer-=dt; if(autoTimer<=0){ newGame(); setAuto(true); } }
      if(popFlash>0) popFlash=Math.max(0,popFlash-dt*3);
      if(flash>0) flash=Math.max(0,flash-dt*3);
      if(shake>0) shake=Math.max(0,shake-dt*3);
      return;
    }
    if(cooldown>0) cooldown-=dt;
    if(harpoonActive>0) harpoonActive-=dt;
    if(popFlash>0) popFlash=Math.max(0,popFlash-dt*4);

    if(auto) autoControl(dt);
    else playerX += (targetX-playerX)*Math.min(1,dt*16);

    // bubbles physics
    for(const b of bubbles){
      b.vy += GRAV*dt;
      b.y += b.vy*dt;
      b.x += (b.vx||0)*dt;
      if(b.x < b.r){ b.x=b.r; b.vx=Math.abs(b.vx||0); }
      if(b.x > W-b.r){ b.x=W-b.r; b.vx=-Math.abs(b.vx||0); }
      if(b.y - b.r <= CEIL){ b.y=CEIL+b.r; b.vy=Math.abs(b.vy); }
      if(b.y + b.r >= FLOOR){ b.y=FLOOR-b.r; b.vy=-Math.abs(b.vy)*0.92; }
    }

    // collision with player
    if(!invuln){
      for(const b of bubbles){
        const dx=b.x-playerX, dy=b.y-PLAYER_Y;
        if(dx*dx+dy*dy < (b.r+PLAYER_R)*(b.r+PLAYER_R)){ loseGame(); return; }
      }
    }

    // particles
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt; p.life-=dt*1.8; }
    particles=particles.filter(p=>p.life>0);

    if(bubbles.length===0){ winGame(); return; }

    if(elRemain) elRemain.textContent=bubbles.length;
    if(elCleared) elCleared.textContent=cleared;
    if(elBest) elBest.textContent=best;
    if(flash>0) flash=Math.max(0,flash-dt*3);
    if(shake>0) shake=Math.max(0,shake-dt*3);
  }

  // ---- render ----
  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,bw,bh);
    const shx=(shake>0)?(Math.random()-0.5)*shake*7:0;
    const shy=(shake>0)?(Math.random()-0.5)*shake*7:0;
    ctx.save(); ctx.translate(shx,shy);
    // bg grid
    ctx.strokeStyle='rgba(124,140,255,0.06)'; ctx.lineWidth=1;
    for(let gx=0;gx<=W;gx+=42){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
    for(let gy=0;gy<=H;gy+=42){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
    // floor line
    ctx.strokeStyle='rgba(255,93,177,0.25)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,FLOOR+8); ctx.lineTo(W,FLOOR+8); ctx.stroke();

    // bubbles
    for(const b of bubbles){
      const col = b.tier===2 ? '#ff5db1' : b.tier===1 ? '#46e0ff' : '#ffd23f';
      ctx.save();
      ctx.shadowColor=col; ctx.shadowBlur=16;
      const g=ctx.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.2,b.x,b.y,b.r);
      g.addColorStop(0,'#ffffff'); g.addColorStop(0.35,col); g.addColorStop(1,col+'66');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.fill();
      ctx.strokeStyle='#ffffff'; ctx.globalAlpha=0.5; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.stroke();
      ctx.restore();
    }

    // particles
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,3,0,6.28); ctx.fill();
    }
    ctx.globalAlpha=1;

    // harpoon beam
    if(harpoonActive>0){
      ctx.save(); ctx.globalAlpha=Math.min(1,harpoonActive*10);
      ctx.strokeStyle='#ffd23f'; ctx.shadowColor='#ffd23f'; ctx.shadowBlur=18; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(playerX,PLAYER_Y-PLAYER_R); ctx.lineTo(playerX,CEIL); ctx.stroke();
      ctx.restore();
    }

    // player
    const pf=flash>0?1+flash*0.4:1;
    ctx.save();
    ctx.shadowColor=invuln?'#5dffa6':'#46e0ff'; ctx.shadowBlur=18;
    ctx.fillStyle=invuln?'#5dffa6':'#46e0ff';
    ctx.beginPath(); ctx.arc(playerX,PLAYER_Y,PLAYER_R*pf,0,6.28); ctx.fill();
    ctx.fillStyle='rgba(6,18,29,0.85)'; ctx.beginPath(); ctx.arc(playerX,PLAYER_Y,PLAYER_R*0.42,0,6.28); ctx.fill();
    // barrel
    ctx.strokeStyle='#ffd23f'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(playerX,PLAYER_Y-PLAYER_R); ctx.lineTo(playerX,PLAYER_Y-PLAYER_R-10); ctx.stroke();
    ctx.restore();

    // auto target marker
    if(auto && bubbles.length>0){
      let low=bubbles[0]; for(const b of bubbles) if(b.y>low.y) low=b;
      ctx.save(); ctx.globalAlpha=0.5; ctx.strokeStyle='#ff5db1'; ctx.setLineDash([4,4]); ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(low.x,0); ctx.lineTo(low.x,H); ctx.stroke(); ctx.restore();
    }
    ctx.restore();
  }

  function frame(ts){
    const now=(typeof performance!=='undefined'?(ts!==undefined?ts:performance.now()):Date.now());
    let dt=(now-last)/1000; if(!(dt>0)||dt>0.05) dt=0.016; last=now;
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  newGame();

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;},
    get score(){return cleared;},
    get remaining(){return bubbles.length;},
    get best(){return best;}, get cleared(){return cleared;}, get playerX(){return playerX;},
    startAuto(){ setAuto(true); if(over){ newGame(); setAuto(true);} },
    toggleAuto(){ setAuto(!auto); },
    restart(){ newGame(); setAuto(false); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); },
    tick(dt){ update(dt); render(); },
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get score(){return cleared;}, get remaining(){return bubbles.length;}, get best(){return best;}
  };
})();
</script>
</body>
</html>
