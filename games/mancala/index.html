<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0f1a" />
<title>Mancala · Neon</title>
<style>
  :root{
    --bg:#0a0f1a; --surface:#111a2b; --text:#e7edf7; --muted:#8090a8;
    --accent:#7cff9b; --accent-glow:#7cff9b66; --danger:#ff5d6c; --gold:#ffd76a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);background-image:radial-gradient(ellipse at 25% 15%,#0f3a26 0%,transparent 55%),radial-gradient(ellipse at 80% 85%,#2a2033 0%,transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;}
  .container{width:100%;max-width:480px;padding:16px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .title-block h1{font-size:1.9rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#b6ffce,#7cff9b,#5ce1ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:6px 12px;text-align:center;min-width:54px;}
  .score-card .label{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0a;border-radius:14px;padding:10px;box-shadow:0 0 40px #00000040,0 0 70px var(--accent-glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#0c1622;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;z-index:10;opacity:0;transition:opacity .35s;pointer-events:none;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0f1aee;backdrop-filter:blur(4px);border-radius:14px;}
  .overlay-content{position:relative;text-align:center;z-index:1;}
  .overlay-content h2{font-size:1.8rem;font-weight:800;margin-bottom:6px;}
  .overlay-content p{color:var(--muted);margin-bottom:16px;font-size:.9rem;}
  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:90px;padding:12px 16px;border:1px solid #ffffff12;border-radius:10px;background:var(--surface);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff10;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#06120c;}
  .btn.primary:hover{box-shadow:0 0 20px var(--accent-glow);}
  .btn.auto-on{background:var(--accent);border-color:var(--accent);color:#06120c;animation:pulse-glow 2s infinite;--glow:var(--accent-glow);}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--glow,transparent);}50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);}}
  .ai-indicator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.75rem;color:var(--muted);justify-content:center;min-height:20px;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
  .hint{margin-top:8px;text-align:center;font-size:.7rem;color:var(--muted);}
  @media(max-width:400px){.title-block h1{font-size:1.4rem;}.btn{padding:10px 12px;font-size:.78rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Mancala</h1><div class="sub">N E O N &nbsp; K A L A H</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">You</div><div class="value" id="s1" style="color:#7cff9b">0</div></div>
      <div class="score-card"><div class="label">AI</div><div class="value" id="s2" style="color:#ffb14d">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="440" height="300"></canvas>
    <div class="overlay" id="overlay-end"><div class="overlay-bg"></div><div class="overlay-content"><h2 id="end-title">Game Over</h2><p id="end-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI thinking…</span></div>
  <div class="hint">Tap one of YOUR pits (bottom row) to sow. Auto plays both sides.</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  function fitCanvas(){ const w=canvas.clientWidth||440; const dpr=window.devicePixelRatio||1; canvas.width=w*dpr; canvas.height=300*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); return w; }
  const lerp=(a,b,t)=>a+(b-a)*t;
  function opp(t){ return t===1?2:1; }
  function legalMoves(b,turn){ const out=[]; const lo=turn===1?0:7, hi=turn===1?5:12; for(let i=lo;i<=hi;i++) if(b[i]>0) out.push(i); return out; }
  function sideEmpty(b,turn){ const lo=turn===1?0:7, hi=turn===1?5:12; let s=0; for(let i=lo;i<=hi;i++) s+=b[i]; return s; }
  function finalize(b){ for(let i=0;i<6;i++){ b[6]+=b[i]; b[i]=0; } for(let i=7;i<13;i++){ b[13]+=b[i]; b[i]=0; } return b[6]>b[13]?1:(b[13]>b[6]?2:0); }
  function clone(b){ return b.slice(); }
  function applyState(b,turn,pit){
    b=clone(b); let seeds=b[pit]; b[pit]=0; let pos=pit; const skip=turn===1?13:6;
    while(seeds>0){ pos=(pos+1)%14; if(pos===skip) continue; b[pos]++; seeds--; }
    let extra=false, over=false;
    if(turn===1 && pos>=0 && pos<=5 && b[pos]===1){ const oppPit=12-pos; if(b[oppPit]>0){ b[6]+=b[pos]+b[oppPit]; b[pos]=0; b[oppPit]=0; } }
    if(turn===2 && pos>=7 && pos<=12 && b[pos]===1){ const oppPit=12-pos; if(b[oppPit]>0){ b[13]+=b[pos]+b[oppPit]; b[pos]=0; b[oppPit]=0; } }
    if((turn===1&&pos===6)||(turn===2&&pos===13)) extra=true;
    if(sideEmpty(b,1)===0||sideEmpty(b,2)===0){ const w=finalize(b); over=true; b._winner=w; }
    return {b,extra,over,winner:b._winner};
  }
  function evalB(b,persp){ const a=b[6], c=b[13]; return persp===1?(a-c):(c-a); }
  let NODES=0;
  function search(b,turn,depth,alpha,beta,persp){
    if(depth===0||NODES>200000) return evalB(b,persp);
    const moves=legalMoves(b,turn);
    if(moves.length===0){ const r=applyState(b,turn, -1); const nb=r.b; let sc=evalB(nb,persp); return sc; }
    NODES++;
    let best=-Infinity;
    for(const m of moves){ const r=applyState(b,turn,m); const nb=r.b; const nturn=r.extra?turn:opp(turn); let sc; if(r.over){ sc=(r.winner===persp)?1000+evalB(nb,persp):-1000-evalB(nb,persp); } else { sc=-search(nb,nturn,depth-1,-beta,-alpha,persp); } if(sc>best)best=sc; if(best>alpha)alpha=best; if(alpha>=beta)break; }
    return best;
  }
  function bestMove(b,turn,depth){ const moves=legalMoves(b,turn); if(!moves.length) return -1; let best=-Infinity,bm=moves[0]; NODES++; for(const m of moves){ const r=applyState(b,turn,m); const nb=r.b; const nturn=r.extra?turn:opp(turn); let sc; if(r.over) sc=(r.winner===turn)?1000+evalB(nb,turn):-1000-evalB(nb,turn); else sc=-search(nb,nturn,depth-1,-Infinity,Infinity,turn); if(sc>best){best=sc;bm=m;} } return bm; }
  class Mancala{
    constructor(){ this.autoPlay=false; this.bindInput(); this.restart(); this._tick=this.tick.bind(this); requestAnimationFrame(this._tick); }
    restart(){ this.stopAuto(); this.size=fitCanvas(); this.b=[4,4,4,4,4,4,0,4,4,4,4,4,4,0]; this.turn=1; this.over=false; this.disp=this.b.slice(); this.lastPit=-1; this.phase='play'; this.busy=0; this.autoAccum=0; this.winner=0; this.hideOverlay(); this.updateUI(); }
    hideOverlay(){ document.getElementById('overlay-end').classList.remove('active'); }
    updateUI(){ document.getElementById('s1').textContent=this.b[6]; document.getElementById('s2').textContent=this.b[13]; }
    posFor(size){
      const W=size, H=size*300/440, m=10, n=6;
      const storeW=W*0.105, storeH=H-2*m;
      const storeR={x:W-m-storeW/2, y:H/2, w:storeW, h:storeH};
      const storeL={x:m+storeW/2, y:H/2, w:storeW, h:storeH};
      const areaL=storeL.x+storeW/2+8, areaR=storeR.x-storeW/2-8;
      const areaW=areaR-areaL;
      let pitR=Math.min(areaW/13.5,(H-2*m)/4.4); if(pitR<8) pitR=8;
      const leftStart=areaL+pitR, stepX=(areaW-2*pitR)/(n-1);
      const topY=m+pitR, botY=H-m-pitR;
      const pits=[]; for(let i=0;i<14;i++) pits.push(null);
      for(let i=0;i<n;i++){ pits[i]={x:leftStart+i*stepX,y:botY}; }       // bottom 0..5 (left->right)
      for(let i=0;i<n;i++){ pits[12-i]={x:leftStart+i*stepX,y:topY}; }    // top 7..12 (pit12 left, pit7 right)
      return {pits, storeR, storeL, pitR, H};
    }
    pitAt(px,py){ const size=this.size; const {pits,storeR,storeL,pitR}=this.posFor(size); const rect=canvas.getBoundingClientRect(); const x=px-rect.left, y=py-rect.top; const rr=pitR*1.08; for(let i=0;i<14;i++){ if(i===6||i===13) continue; if(pits[i]&&Math.hypot(x-pits[i].x,y-pits[i].y)<rr) return i; } return -1; }
    doMove(pit){ if(this.over||this.phase!=='play') return; if(this.turn===1 && (pit<0||pit>5)) return; const r=applyState(this.b,this.turn,pit); this.b=r.b; this.lastPit=pit; this.over=r.over; this.winner=r.winner||0; this.turn=r.extra?this.turn:opp(this.turn); this.phase='anim'; this.busy=0.45; this.updateUI(); if(this.over) this.showEnd(); }
    showEnd(){ const w=this.winner; document.getElementById('end-title').textContent=w===1?'You Win!':(w===2?'AI Wins':'Draw'); document.getElementById('end-msg').textContent='You '+this.b[6]+' · AI '+this.b[13]; document.getElementById('overlay-end').classList.add('active'); }
    chooseAuto(){ NODES=0; if(this.over) return; const m=bestMove(this.b,this.turn,7); if(m<0){ this.over=true; this.winner=this.b[6]>this.b[13]?1:2; this.showEnd(); return; } this.doMove(m); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    tick(ts){ const dt=Math.min(50,(ts!==undefined)?((ts-(this._last||ts))):16)/1000; this._last=ts; this.update(dt); this.render(); requestAnimationFrame(this._tick); }
    update(dt){
      for(let i=0;i<14;i++) this.disp[i]=lerp(this.disp[i],this.b[i],1-Math.pow(0.002,dt));
      if(this.busy>0){ this.busy-=dt; if(this.busy<=0){ this.busy=0; this.phase='play'; } }
      if(this.over||this.phase!=='play') return;
      if(this.autoPlay){ this.autoAccum+=dt; if(this.autoAccum>=0.55){ this.autoAccum=0; this.chooseAuto(); } }
    }
    bindInput(){ const wrap=document.getElementById('board-wrap'); wrap.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over||this.phase!=='play') return; const pit=this.pitAt(e.clientX,e.clientY); if(pit<0) return; e.preventDefault(); this.doMove(pit); }); window.addEventListener('resize',()=>{ this.size=fitCanvas(); }); }
    render(){ const size=this.size, h=size*300/440; ctx.clearRect(0,0,size,h); const {pits,storeR,storeL,pitR}=this.posFor(size);
      // board bg
      ctx.fillStyle='#0c1622'; this.rr(6,6,size-12,h-12,18); ctx.fill();
      const drawPit=(x,y,seeds,hl)=>{ const r=pitR; ctx.save(); if(hl){ctx.shadowColor='#7cff9b';ctx.shadowBlur=14;} const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.2,x,y,r); g.addColorStop(0,'#1c2c24'); g.addColorStop(1,'#0a1410'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
        const n=Math.round(seeds); this.drawSeeds(x,y,Math.min(n,12),r);
        if(n>12){ ctx.fillStyle='#bfffd0'; ctx.font='bold '+(r*0.5)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(n,x,y); }
      };
      for(let i=0;i<14;i++){ if(i===6||i===13) continue; const mine=(i>=0&&i<=5); const activeTurn = (this.turn===1&&mine)||(this.turn===2&&!mine); const hl=(this.lastPit===i)||(!this.autoPlay&&activeTurn); drawPit(pits[i].x,pits[i].y,this.disp[i],hl&&this.phase==='play'); }
      // stores (vertical rounded rects on left/right)
      const sr=storeR, sl=storeL;
      ctx.fillStyle='#15241c'; this.rr(sr.x-sr.w/2,sr.y-sr.h/2,sr.w,sr.h,12); ctx.fill();
      ctx.fillStyle='#15241c'; this.rr(sl.x-sl.w/2,sl.y-sl.h/2,sl.w,sl.h,12); ctx.fill();
      this.drawSeeds(sr.x,sr.y,Math.min(Math.round(this.disp[6]),16),sr.w*0.42); this.drawSeeds(sl.x,sl.y,Math.min(Math.round(this.disp[13]),16),sl.w*0.42);
      ctx.fillStyle='#7cff9b'; ctx.font='bold '+(sr.w*0.42)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(Math.round(this.disp[6]),sr.x,sr.y); ctx.fillStyle='#ffb14d'; ctx.fillText(Math.round(this.disp[13]),sl.x,sl.y);
    }
    drawSeeds(x,y,n,r){ if(n<=0) return; ctx.fillStyle='#caa86a'; for(let i=0;i<n;i++){ const a=(i*2.39996); const rr=r*0.62; const sx=x+Math.cos(a)*rr, sy=y+Math.sin(a)*rr; ctx.beginPath(); ctx.arc(sx,sy,r*0.20,0,Math.PI*2); ctx.fill(); } }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Mancala();
})();
</script>
</body>
</html>
