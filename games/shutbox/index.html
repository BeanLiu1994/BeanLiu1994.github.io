<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a1a2a" />
<title>Shut the Box · 关箱子</title>
<style>
  :root { --bg:#0a1a2a; --surface:#0e2236; --board:#06121e; --text:#e6f6ff; --muted:#7fb8d8; --accent:#4dd2ff; --accent2:#5dffb0; --accent-glow:#4dd2ff55; --gold:#ffd54a; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image:radial-gradient(ellipse at 50% 0%, #103048 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #071a28 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#4dd2ff,#5dffb0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:56px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:11px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:700; cursor:pointer; transition:all .2s; letter-spacing:.5px; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#06121e; }
  .btn.primary:disabled { opacity:.4; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#06121e; animation:pulse 1.6s infinite; --glow:var(--accent-glow); }
  .btn.lock { background:var(--accent2); border-color:var(--accent2); color:#06121e; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 6px var(--glow,transparent);} 50%{box-shadow:0 0 18px var(--glow,transparent),0 0 34px var(--glow,transparent);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
  .hint { margin-top:4px; font-size:0.62rem; color:#5f88a0; text-align:center; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>关箱子</h1><div class="sub">S H U T &nbsp; T H E &nbsp; B O X</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Shut</div><div class="value" id="shut">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">9</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="440" height="300"></canvas></div>
  <div class="controls">
    <button class="btn primary" id="btn-roll" onclick="game.roll()">Roll</button>
    <button class="btn lock" id="btn-lock" onclick="game.lock()" style="display:none">Lock</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">点击 Roll 掷两颗骰子，点数字牌凑出点数和将其翻下</div>
  <div class="hint">触屏点按操作 · 自动模式按最优策略翻牌</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const shutEl=document.getElementById('shut'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  const btnAuto=document.getElementById('btn-auto'), btnRoll=document.getElementById('btn-roll'), btnLock=document.getElementById('btn-lock');
  const W=canvas.width, H=canvas.height;
  function rint(n){ return Math.floor(Math.random()*n); }
  function subsetSum(avail, target){
    // return combo (array) summing to target, preferring largest-tile inclusion; null if none
    let best=null;
    const rec=(i, cur, sum)=>{
      if(sum===target){ if(!best || cur.length && cur[cur.length-1]>best[best.length-1]) best=cur.slice(); return; }
      if(sum>target) return; if(i>=avail.length) return;
      cur.push(avail[i]); rec(i+1, cur, sum+avail[i]); cur.pop();
      rec(i+1, cur, sum);
    };
    rec(0, [], 0);
    return best;
  }
  class ShutBox {
    constructor(){
      this.autoPlay=false; this._last=0; this._autoCd=0; this.time=0; this._autoProgress=0;
      this.bestKey='shutboxBest'; this.best=parseInt(localStorage.getItem(this.bestKey)||'9'); bestEl.textContent=this.best;
      this.tiles=[true,true,true,true,true,true,true,true,true]; // 1..9 available
      this.d1=1; this.d2=1; this.tumble=0; this.state='idle'; // idle | rolling | select | over
      this.sel=[]; this.closed=0; this.shutCount=0; this.flash=0; this.flashTxt=''; this.flashColor='#4dd2ff';
      this.bestRemaining=9;
      requestAnimationFrame(this.tick.bind(this));
    }
    restart(){ this.tiles=[true,true,true,true,true,true,true,true,true]; this.state='idle'; this.tumble=0; this.sel=[]; this.closed=0; btnLock.style.display='none'; this.flash=0; this.setStatus('点击 Roll 掷两颗骰子，点数字牌凑出点数和将其翻下'); }
    setStatus(t){ statusEl.textContent=t; }
    remaining(){ let s=0; for(let i=0;i<9;i++) if(this.tiles[i]) s+=i+1; return s; }
    roll(){
      if(this.state==='rolling'||this.state==='over') return;
      this.d1=1+rint(6); this.d2=1+rint(6); this.tumble=0.5; this.state='rolling'; this.sel=[]; btnLock.style.display='none'; btnRoll.disabled=true;
    }
    _resolveRoll(){
      btnRoll.disabled=false;
      const sum=this.d1+this.d2; const avail=[]; for(let i=0;i<9;i++) if(this.tiles[i]) avail.push(i+1);
      const combo=subsetSum(avail, sum);
      if(!combo){ // no move available -> round over
        this.state='over'; const rem=this.remaining();
        this.flash=1.0; this.flashColor='#ff5d6a'; this.flashTxt='NO MOVE';
        if(rem<this.best){ this.best=rem; bestEl.textContent=this.best; localStorage.setItem(this.bestKey,String(this.best)); }
        this.setStatus('无可用组合（和='+sum+'）· 剩余 '+rem+' 分 · 稍后重开');
        this._autoCd=1.0; return;
      }
      this.state='select'; this.setStatus('掷出 '+sum+' · 点数字牌凑出 '+sum+'（最优可翻 '+combo.join('+')+'）');
    }
    toggleTile(i){
      if(this.state!=='select') return;
      if(!this.tiles[i]) return;
      const idx=this.sel.indexOf(i);
      if(idx>=0) this.sel.splice(idx,1); else this.sel.push(i);
      const s=this.sel.reduce((a,b)=>a+b+1,0);
      if(s===this.d1+this.d2){ btnLock.style.display='inline-block'; } else { btnLock.style.display='none'; }
    }
    lock(){
      if(this.state!=='select') return;
      const s=this.sel.reduce((a,b)=>a+b+1,0); if(s!==this.d1+this.d2) return;
      for(const i of this.sel) this.tiles[i]=false;
      this.closed+=this.sel.length; this.sel=[]; btnLock.style.display='none';
      this.flash=0.5; this.flashColor='#5dffb0'; this.flashTxt='+'+s;
      if(this.remaining()===0){ this.shutCount++; shutEl.textContent=this.shutCount; this.flash=1.0; this.flashColor='#ffd54a'; this.flashTxt='SHUT!'; this.state='over'; this._autoCd=1.0; this.setStatus('关箱子成功！🎉 稍后重开'); }
      else { this.state='idle'; this.setStatus('已翻下，剩余 '+this.remaining()+' 分 · 点 Roll 继续'); }
    }
    toggleAuto(){ this.autoPlay=!this.autoPlay; if(this.autoPlay){ btnAuto.textContent='Auto: ON'; btnAuto.classList.add('auto-on'); this._autoCd=0.4; } else { btnAuto.textContent='Auto: OFF'; btnAuto.classList.remove('auto-on'); } }
    startAuto(){ this.autoPlay=true; btnAuto.textContent='Auto: ON'; btnAuto.classList.add('auto-on'); this._autoCd=0.4; }
    stopAuto(){ this.autoPlay=false; btnAuto.textContent='Auto: OFF'; btnAuto.classList.remove('auto-on'); }
    maybeAuto(dt){
      if(!this.autoPlay) return; this._autoCd-=dt; if(this._autoCd>0) return;
      if(this.state==='rolling'){ this._autoCd=0.2; return; }
      if(this.state==='over'){ this.restart(); this._autoCd=0.6; return; }
      if(this.state==='idle'){ this._autoCd=0.5; this.roll(); return; }
      if(this.state==='select'){ // auto pick best combo
        const sum=this.d1+this.d2; const avail=[]; for(let i=0;i<9;i++) if(this.tiles[i]) avail.push(i+1);
        const combo=subsetSum(avail, sum); if(combo){ this.sel=combo.map(v=>v-1); this.lock(); this._autoProgress++; this._autoCd=0.7; }
        else { this._resolveRoll(); this._autoCd=0.5; }
      }
    }
    update(dt){
      if(this.tumble>0){ this.tumble-=dt; if(this.tumble<=0){ this._resolveRoll(); } }
      if(this.flash>0) this.flash-=dt;
      this.maybeAuto(dt);
    }
    tick(ts){
      const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016);
      this._last=ts!==undefined?ts:this._last; this.time+=dt;
      this.update(dt); this.draw(); requestAnimationFrame(this.tick.bind(this));
    }
    draw(){
      ctx.clearRect(0,0,W,H);
      const g=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,W*0.7); g.addColorStop(0,'#0e2236'); g.addColorStop(1,'#06121e'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      // dice top
      const dz=46, dx0=W/2-dz-20, dy=22;
      this._die(dx0, dy, dz, this.d1); this._die(dx0+dz+40, dy, dz, this.d2);
      // tiles grid (3x3)
      const cols=3, tw=(W-60)/cols-12, th=58, x0=30, y0=110, gap=12;
      for(let i=0;i<9;i++){
        const c=i%cols, r=Math.floor(i/cols); const x=x0+c*(tw+gap), y=y0+r*(th+gap);
        const open=this.tiles[i], sel=this.sel.includes(i);
        ctx.save();
        const col= open?(sel?'#5dffb0':'#4dd2ff'):'#16283a';
        ctx.shadowColor=open?(sel?'#5dffb0':'#4dd2ff'):'transparent'; ctx.shadowBlur=open?16:0;
        this._round(x,y,tw,th,10); ctx.fillStyle=col; ctx.fill(); ctx.shadowBlur=0;
        ctx.fillStyle=open?'#06121e':'#3a5570'; ctx.font='bold 26px Segoe UI, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(String(i+1), x+tw/2, y+th/2);
        ctx.restore();
      }
      if(this.flash>0){ ctx.save(); ctx.globalAlpha=Math.min(1,this.flash*1.3); ctx.font='bold 38px Segoe UI'; ctx.fillStyle=this.flashColor; ctx.shadowColor=this.flashColor; ctx.shadowBlur=22; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(this.flashTxt, W/2, H/2); ctx.restore(); }
      ctx.fillStyle='#7fb8d8'; ctx.font='13px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.fillText('剩余分 '+this.remaining(), W/2, H-12);
    }
    _die(x,y,s,v){ const r=10; ctx.save(); ctx.shadowColor='#4dd2ff'; ctx.shadowBlur=14; this._round(x,y,s,s,r); ctx.fillStyle='#0a2a40'; ctx.fill(); ctx.shadowBlur=0; const pip=(cx,cy)=>{ctx.beginPath();ctx.arc(cx,cy,4.5,0,7);ctx.fillStyle='#4dd2ff';ctx.fill();}; const u=s/4; const P={tl:[x+u,y+u],tr:[x+3*u,y+u],ml:[x+u,y+2*u],mr:[x+3*u,y+2*u],c:[x+2*u,y+2*u],bl:[x+u,y+3*u],br:[x+3*u,y+3*u]};
      if(v===1)pip(...P.c); else if(v===2){pip(...P.tl);pip(...P.br);} else if(v===3){pip(...P.tl);pip(...P.c);pip(...P.br);} else if(v===4){pip(...P.tl);pip(...P.tr);pip(...P.bl);pip(...P.br);} else if(v===5){pip(...P.tl);pip(...P.tr);pip(...P.c);pip(...P.bl);pip(...P.br);} else {pip(...P.tl);pip(...P.tr);pip(...P.ml);pip(...P.mr);pip(...P.bl);pip(...P.br);} ctx.restore(); }
    _round(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  // tap tiles
  canvas.addEventListener('pointerdown', (e)=>{
    const rect=canvas.getBoundingClientRect(); const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
    const px=(e.clientX-rect.left)*sx, py=(e.clientY-rect.top)*sy;
    const cols=3, tw=(W-60)/cols-12, th=58, x0=30, y0=110, gap=12;
    for(let i=0;i<9;i++){ const c=i%cols, r=Math.floor(i/cols); const x=x0+c*(tw+gap), y=y0+r*(th+gap); if(px>=x&&px<=x+tw&&py>=y&&py<=y+th){ if(!game.autoPlay) game.toggleTile(i); return; } }
  });
  window.game=new ShutBox();
})();
</script>
</body>
</html>
