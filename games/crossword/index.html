<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0f1f" />
<title>霓虹填字 · Neon Crossword</title>
<style>
  :root{
    --bg:#080b18; --surface:#121a30; --text:#eaf2ff; --muted:#7e90b3;
    --accent:#46e0ff; --accent2:#b46bff; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#46e0ff55; --dim:#243352; --cell:#0e1730; --cellline:#2a3a5e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #18244a 0%, transparent 60%),
                     radial-gradient(ellipse at 50% 100%, #1a0f30 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:460px;padding:10px 10px 6px;display:flex;flex-direction:column;gap:8px;height:100%;}
  .header{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .title-block h1{font-size:1.3rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.5rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:50px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:0.98rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.s .value{color:var(--accent);}
  .score-card.t .value{color:var(--accent2);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);flex:0 0 auto;}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#060c1c;}
  .clue{background:#0d1530;border:1px solid #ffffff10;border-radius:10px;padding:8px 12px;font-size:0.8rem;line-height:1.35;
    min-height:38px;display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .clue .num{font-weight:800;color:var(--gold);white-space:nowrap;}
  .clue .txt{color:var(--text);}
  .clue .dir{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .keyboard{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;flex:0 0 auto;}
  .key{background:var(--surface);border:1px solid #ffffff14;border-radius:8px;padding:9px 0;text-align:center;
    font-weight:700;font-size:0.9rem;color:var(--text);cursor:pointer;transition:transform .1s ease,background .15s ease,box-shadow .15s ease;}
  .key:active{transform:scale(.9);background:var(--accent);color:#06121d;box-shadow:0 0 14px var(--glow);}
  .key.wide{grid-column:span 2;font-size:0.7rem;color:var(--muted);}
  .toolbar{display:flex;gap:8px;align-items:center;flex:0 0 auto;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  button.ghost{background:transparent;}
  .hint{text-align:center;color:var(--muted);font-size:0.66rem;line-height:1.4;flex:0 0 auto;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.6rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;}
  .overlay p{color:var(--muted);font-size:0.9rem;text-align:center;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>霓虹填字 · CROSSWORD</h1>
      <div class="sub">Tap · Type · Solve</div>
    </div>
    <div class="score-panel">
      <div class="score-card s"><div class="label">已解</div><div class="value" id="solved">0</div></div>
      <div class="score-card t"><div class="label">总词</div><div class="value" id="total">0</div></div>
      <div class="score-card"><div class="label">最佳</div><div class="value" id="best">--</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">AUTO</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">胜利！</h2>
      <p id="ovText"></p>
      <button class="auto on" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="clue"><span class="num" id="clueNum">1A</span><span class="dir" id="clueDir"></span><span class="txt" id="clueTxt">—</span></div>
  <div class="keyboard" id="kb"></div>
  <div class="toolbar">
    <button class="auto" id="autoBtn">自动游玩</button>
    <button class="ghost" id="restartBtn">换一题</button>
  </div>
  <div class="hint">点选格子，用<b>屏幕键盘</b>或<b>实体键盘</b>输入字母 · 再次点选同格可切换横/竖 · <b>自动模式</b>会流畅点亮全部答案</div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const cv=$('cv'), elSolved=$('solved'), elTotal=$('total'), elBest=$('best'),
        elBadge=$('badge'), elOverlay=$('overlay'), elOvTitle=$('ovTitle'), elOvText=$('ovText'),
        elClueNum=$('clueNum'), elClueTxt=$('clueTxt'), elClueDir=$('clueDir'), elKb=$('kb'),
        btnAuto=$('autoBtn'), btnRestart=$('restartBtn'), btnOv=$('ovBtn');

  // ---- puzzles (verified) ----
  const CLUES={
    FOREST:'大片树木覆盖的土地', SHUTTLE:'往返太空的航天器', PLANET:'绕恒星运行的天体', CASTLE:'中世纪的石砌堡垒',
    GREEN:'草与叶的颜色', ROYAL:'与国王或女王相关的', MAP:'显示地理的图', FOX:'橙红色的狡猾犬科动物',
    ROCKET:'靠推力升空的飞行器', HEART:'泵血的器官；也指爱', STORM:'狂风暴雨的天气', ART:'绘画或雕塑等创作',
    ARM:'连接肩与手的部位', PEACE:'没有战争的状态', CLIFF:'陡峭的岩壁', TRAIL:'林间小路',
    FLUTE:'吹奏的管乐器', FIRE:'燃烧释放的光热', LEAF:'植物的绿色扁片', ICE:'水的固态'
  };
  const PUZZLES=[
    {"rows":7,"cols":7,"sol":[["F","O","R","E","S","T",null],["O",null,"O",null,"H",null,"G"],["X",null,"Y",null,"U",null,"R"],[null,"C","A","S","T","L","E"],["M",null,"L",null,"T",null,"E"],["A",null,null,null,"L",null,"N"],["P","L","A","N","E","T",null]],"words":[{"word":"FOREST","r":0,"c":0,"dir":"H"},{"word":"SHUTTLE","r":0,"c":4,"dir":"V"},{"word":"PLANET","r":6,"c":0,"dir":"H"},{"word":"CASTLE","r":3,"c":1,"dir":"H"},{"word":"GREEN","r":1,"c":6,"dir":"V"},{"word":"ROYAL","r":0,"c":2,"dir":"V"},{"word":"MAP","r":4,"c":0,"dir":"V"},{"word":"FOX","r":0,"c":0,"dir":"V"}]},
    {"rows":7,"cols":7,"sol":[["R","O","C","K","E","T",null],["O",null,"A",null,null,null,null],["Y",null,"S","T","O","R","M"],["A","R","T",null,null,null,"A"],["L",null,"L",null,"A",null,"P"],[null,"H","E","A","R","T",null],[null,null,null,null,"M",null,null]],"words":[{"word":"ROCKET","r":0,"c":0,"dir":"H"},{"word":"CASTLE","r":0,"c":2,"dir":"V"},{"word":"HEART","r":5,"c":1,"dir":"H"},{"word":"STORM","r":2,"c":2,"dir":"H"},{"word":"ROYAL","r":0,"c":0,"dir":"V"},{"word":"ART","r":3,"c":0,"dir":"H"},{"word":"MAP","r":2,"c":6,"dir":"V"},{"word":"ARM","r":4,"c":4,"dir":"V"}]},
    {"rows":7,"cols":7,"sol":[["P","E","A","C","E",null,null],[null,null,null,"L",null,null,null],["T","R","A","I","L",null,null],[null,"O",null,"F",null,null,"L"],[null,"Y",null,"F","I","R","E"],[null,"A",null,null,"C",null,"A"],["F","L","U","T","E",null,"F"]],"words":[{"word":"PEACE","r":0,"c":0,"dir":"H"},{"word":"CLIFF","r":0,"c":3,"dir":"V"},{"word":"TRAIL","r":2,"c":0,"dir":"H"},{"word":"ROYAL","r":2,"c":1,"dir":"V"},{"word":"FLUTE","r":6,"c":0,"dir":"H"},{"word":"FIRE","r":4,"c":3,"dir":"H"},{"word":"LEAF","r":3,"c":6,"dir":"V"},{"word":"ICE","r":4,"c":4,"dir":"V"}]}
  ];

  const W=420, H=420;
  let dpr=Math.min(2,(typeof devicePixelRatio!=='undefined'?devicePixelRatio||1:1));
  function setupCanvas(){
    if(!cv||!cv.getContext) return;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px'; cv.style.maxWidth='100%';
  }
  setupCanvas();
  const ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;

  // ---- state ----
  let pz, rows, cols, sol, grid, cellWord, numAt, wordNum, total, selR, selC, selDir;
  let auto, over, won, solvedCount, best, autoIdx, autoTimer, popAnim, startT, finishT, autoDelay;
  let puzzleIdx=0;

  try{ best=parseFloat(localStorage.getItem('cw_best')||'0')||0; }catch(e){best=0;}

  function loadPuzzle(idx){
    pz=PUZZLES[idx]; rows=pz.rows; cols=pz.cols; sol=pz.sol;
    grid=[]; for(let r=0;r<rows;r++){ const row=[]; for(let c=0;c<cols;c++) row.push(sol[r][c]===null?null:''); grid.push(row); }
    // number cells & map cell->word
    numAt=[]; for(let r=0;r<rows;r++){ numAt.push(new Array(cols).fill(0)); }
    cellWord=[]; for(let r=0;r<rows;r++){ const row=[]; for(let c=0;c<cols;c++) row.push({H:null,V:null}); cellWord.push(row); }
    let n=0;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        if(sol[r][c]===null) continue;
        const isAcrossStart = (c===0||sol[r][c-1]===null) && (c+1<cols && sol[r][c+1]!==null);
        const isDownStart = (r===0||sol[r-1][c]===null) && (r+1<rows && sol[r+1][c]!==null);
        if(isAcrossStart||isDownStart){ n++; numAt[r][c]=n; }
      }
    }
    for(const w of pz.words){
      w.num=numAt[w.r][w.c];
      w.clue=CLUES[w.word]||'';
      const dr = w.dir==='H'?0:1, dc = w.dir==='H'?1:0;
      for(let i=0;i<w.word.length;i++){ cellWord[w.r+dr*i][w.c+dc*i][w.dir]=w; }
    }
    total=pz.words.length; wordNum=n;
    popAnim=[]; for(let r=0;r<rows;r++) popAnim.push(new Array(cols).fill(0));
    selR=-1; selC=-1; selDir='H';
    autoIdx=0; autoTimer=0; autoDelay=0;
    solvedCount=0; over=false; won=false;
    startT=(typeof performance!=='undefined'?performance.now():Date.now());
    // pick initial selection: first across or down word start
    selectFirst();
  }

  function white(r,c){ return r>=0&&c>=0&&r<rows&&c<cols&&sol[r][c]!==null; }

  function selectFirst(){
    for(const w of pz.words){ if(w.dir==='H'){ selR=w.r; selC=w.c; selDir='H'; return; } }
    const w=pz.words[0]; selR=w.r; selC=w.c; selDir=w.dir;
    updateClue();
  }

  function activeWord(){ if(selR<0) return null; return cellWord[selR][selC][selDir]; }

  function updateClue(){
    const w=activeWord();
    if(!w){ elClueNum.textContent='-'; elClueDir.textContent=''; elClueTxt.textContent='—'; return; }
    elClueNum.textContent=w.num+(w.dir==='H'?'A':'D');
    elClueDir.textContent=w.dir==='H'?'横':'竖';
    elClueTxt.textContent=w.clue+'（'+w.word.length+'）';
  }

  function setAuto(v){
    auto=v;
    if(btnAuto){ btnAuto.classList.toggle('on',v); btnAuto.textContent=v?'自动中…':'自动游玩'; }
    if(elBadge) elBadge.classList.toggle('show',v);
    if(v){ // start auto from current state
      autoIdx=0; autoTimer=0; autoDelay=0;
      // build auto order (word by word)
      autoOrder=[];
      const ordered=pz.words.slice().sort((a,b)=>a.num-b.num);
      for(const w of ordered){ const dr=w.dir==='H'?0:1, dc=w.dir==='H'?1:0; for(let i=0;i<w.word.length;i++) autoOrder.push([w.r+dr*i,w.c+dc*i]); }
    }
  }
  let autoOrder=[];

  function setCell(r,c,ch){ if(white(r,c)){ grid[r][c]=ch; popAnim[r][c]=ch?1:0; } }

  function moveSelection(dir){
    if(selR<0) return;
    const dr=dir==='V'?1:0, dc=dir==='H'?1:0;
    let r=selR+dr, c=selC+dc;
    while(white(r,c) && cellWord[r][c][dir]===activeWord()){ selR=r; selC=c; r+=dr; c+=dc; }
  }

  function onCellTap(r,c){
    if(over||auto) return;
    if(!white(r,c)) return;
    if(r===selR && c===selC){
      // toggle direction if both exist
      const other = selDir==='H'?'V':'H';
      if(cellWord[r][c][other]) selDir=other;
    } else {
      selR=r; selC=c;
      if(!cellWord[r][c][selDir]){ const other=selDir==='H'?'V':'H'; if(cellWord[r][c][other]) selDir=other; }
    }
    updateClue();
  }

  function typeLetter(ch){
    if(over||auto||selR<0) return;
    setCell(selR,selC,ch);
    // advance
    const w=activeWord();
    const dr=selDir==='V'?1:0, dc=selDir==='H'?1:0;
    let nr=selR+dr, nc=selC+dc;
    if(white(nr,nc) && cellWord[nr][nc][selDir]===w){ selR=nr; selC=nc; }
    checkWin();
    updateClue();
  }
  function backspace(){
    if(over||auto||selR<0) return;
    if(grid[selR][selC]){ setCell(selR,selC,''); }
    else { const dr=selDir==='V'?-1:0, dc=selDir==='H'?-1:0; let pr=selR+dr,pc=selC+dc; if(white(pr,pc)&&cellWord[pr][pc][selDir]===activeWord()){ selR=pr; selC=pc; } }
    updateClue();
  }

  function recomputeSolved(){
    let s=0;
    for(const w of pz.words){
      const dr=w.dir==='H'?0:1, dc=w.dir==='H'?1:0;
      let ok=true;
      for(let i=0;i<w.word.length;i++){ const ch=grid[w.r+dr*i][w.c+dc*i]; if(ch!==w.word[i]){ ok=false; break; } }
      w._solved=ok; if(ok) s++;
    }
    solvedCount=s;
  }

  function checkWin(){
    recomputeSolved();
    if(solvedCount>=total){ winGame(); }
  }

  function winGame(){
    over=true; won=true;
    finishT=(typeof performance!=='undefined'?performance.now():Date.now());
    const secs=((finishT-startT)/1000);
    if(!auto){
      if(best===0||secs<best){ best=secs; try{localStorage.setItem('cw_best',String(best));}catch(e){} }
    }
    if(auto){ autoDelay=0.9; elOvTitle.textContent='⚡ 自动通关！'; elOvText.textContent='点亮 '+total+' 个词'; }
    else { elOvTitle.textContent='🎉 通关！'; elOvText.textContent='用时 '+secs.toFixed(1)+' 秒'; elOverlay.classList.add('show'); }
  }
  function loseGame(){}

  function nextPuzzle(){
    puzzleIdx=(puzzleIdx+1)%PUZZLES.length;
    loadPuzzle(puzzleIdx); setAuto(false); elOverlay.classList.remove('show');
  }

  // ---- auto control ----
  function autoControl(dt){
    if(autoOrder.length===0) return;
    if(autoIdx>=autoOrder.length){ if(!over) checkWin(); return; }
    autoTimer+=dt;
    const step=0.09;
    while(autoTimer>=step && autoIdx<autoOrder.length){
      autoTimer-=step;
      const [r,c]=autoOrder[autoIdx];
      grid[r][c]=sol[r][c];
      popAnim[r][c]=1;
      autoIdx++;
    }
    if(autoIdx>=autoOrder.length){ recomputeSolved(); if(solvedCount>=total) winGame(); }
  }

  // ---- input ----
  function pointerToCell(e){
    let r=-1,c=-1;
    try{
      const rect=cv.getBoundingClientRect();
      const px=(typeof e.clientX==='number'?e.clientX:0);
      const py=(typeof e.clientY==='number'?e.clientY:0);
      const x=((px-rect.left)/rect.width)*W;
      const y=((py-rect.top)/rect.height)*H;
      const geo=boardGeo();
      c=Math.floor((x-geo.ox)/geo.cs); r=Math.floor((y-geo.oy)/geo.cs);
    }catch(err){}
    return [r,c];
  }
  function onDown(e){
    if(over||auto) return;
    const [r,c]=pointerToCell(e);
    onCellTap(r,c);
    e.preventDefault&&e.preventDefault();
  }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointerdown',onDown,{passive:false});
    cv.addEventListener('touchstart',onDown,{passive:false});
  }
  window.addEventListener('keydown',(e)=>{
    if(over||auto) return;
    if(e.key==='Backspace'||e.key==='Delete'){ backspace(); e.preventDefault&&e.preventDefault(); return; }
    if(e.key==='ArrowLeft'){ if(selR>=0&&white(selR,selC-1)){ selC--; } e.preventDefault&&e.preventDefault(); updateClue(); return; }
    if(e.key==='ArrowRight'){ if(selR>=0&&white(selR,selC+1)){ selC++; } e.preventDefault&&e.preventDefault(); updateClue(); return; }
    if(e.key==='ArrowUp'){ if(selR>=0&&white(selR-1,selC)){ selR--; } e.preventDefault&&e.preventDefault(); updateClue(); return; }
    if(e.key==='ArrowDown'){ if(selR>=0&&white(selR+1,selC)){ selR++; } e.preventDefault&&e.preventDefault(); updateClue(); return; }
    if(/^[a-zA-Z]$/.test(e.key)){ typeLetter(e.key.toUpperCase()); e.preventDefault&&e.preventDefault(); }
  });
  // on-screen keyboard
  if(elKb){
    const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    for(const L of letters){
      const b=document.createElement('button'); b.className='key'; b.textContent=L;
      b.addEventListener('click',()=>typeLetter(L));
      elKb.appendChild(b);
    }
    const bk=document.createElement('button'); bk.className='key wide'; bk.textContent='⌫ 退格';
    bk.addEventListener('click',backspace); elKb.appendChild(bk);
  }
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto){ nextPuzzle(); return; } setAuto(!auto); });
  btnRestart&&btnRestart.addEventListener('click',()=>{ nextPuzzle(); });
  btnOv&&btnOv.addEventListener('click',()=>{ nextPuzzle(); });

  // ---- update ----
  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  function boardGeo(){
    const pad=10, cs=Math.floor((W-pad*2)/Math.max(rows,cols));
    const gw=cs*cols, gh=cs*rows;
    const ox=(W-gw)/2, oy=(H-gh)/2;
    return {cs,ox,oy,gw,gh};
  }
  function update(dt){
    if(over){
      if(auto){ autoDelay-=dt; if(autoDelay<=0){ nextPuzzle(); setAuto(true);} }
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(popAnim[r][c]>0) popAnim[r][c]=Math.max(0,popAnim[r][c]-dt*2.5);
      return;
    }
    if(popAnim){ for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(popAnim[r][c]>0) popAnim[r][c]=Math.max(0,popAnim[r][c]-dt*2.5); }
    if(auto) autoControl(dt);
    if(elSolved) elSolved.textContent=solvedCount;
    if(elTotal) elTotal.textContent=total;
    if(elBest) elBest.textContent= best>0 ? best.toFixed(1)+'s' : '--';
  }

  // ---- render ----
  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    const g=boardGeo();
    // subtle grid bg
    ctx.strokeStyle='rgba(70,224,255,0.05)'; ctx.lineWidth=1;
    for(let i=0;i<=W;i+=42){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
    for(let i=0;i<=H;i+=42){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }
    const w=activeWord();
    const activeCells=new Set();
    if(w){ const dc=w.dir==='H'?0:1, dr=w.dir==='H'?1:0; for(let i=0;i<w.word.length;i++) activeCells.add((w.r+dr*i)+','+(w.c+dc*i)); }
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        if(sol[r][c]===null) continue;
        const x=g.ox+c*g.cs, y=g.oy+r*g.cs;
        const isSel=(r===selR&&c===selC);
        const isActive=activeCells.has(r+','+c);
        ctx.fillStyle= isActive ? '#16294d' : '#0e1730';
        roundRect(x+1.5,y+1.5,g.cs-3,g.cs-3,6); ctx.fill();
        ctx.lineWidth=1.2; ctx.strokeStyle= isSel ? '#ffd23f' : '#2a3a5e';
        if(isSel){ ctx.shadowColor='#ffd23f'; ctx.shadowBlur=14; } roundRect(x+1.5,y+1.5,g.cs-3,g.cs-3,6); ctx.stroke(); ctx.shadowBlur=0;
        // clue number
        if(numAt[r][c]){ ctx.fillStyle='#7e90b3'; ctx.font='bold '+(g.cs*0.22)+'px system-ui'; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(String(numAt[r][c]),x+4,y+3); }
        // letter
        const ch=grid[r][c];
        if(ch){
          const pop=popAnim[r][c]||0;
          ctx.save();
          if(pop>0){ ctx.shadowColor= auto?'#5dffa6':'#46e0ff'; ctx.shadowBlur=10+pop*16; }
          ctx.fillStyle = (auto&&pop>0)?'#5dffa6':(w&&w._solved&&isActive?'#5dffa6':'#eaf2ff');
          ctx.font='bold '+(g.cs*0.5)+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
          const sc=1+pop*0.25;
          ctx.translate(x+g.cs/2,y+g.cs/2); ctx.scale(sc,sc);
          ctx.fillText(ch,0,1);
          ctx.restore();
        }
      }
    }
  }
  function roundRect(x,y,w,h,r){ if(!ctx) return; ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function frame(ts){
    const now=(typeof performance!=='undefined'?(ts!==undefined?ts:performance.now()):Date.now());
    let dt=(now-last)/1000; if(!(dt>0)||dt>0.05) dt=0.016; last=now;
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  loadPuzzle(puzzleIdx); setAuto(false);

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;},
    get score(){return solvedCount;}, get remaining(){return total-solvedCount;},
    get total(){return total;}, get best(){return best;},
    startAuto(){ setAuto(true); }, toggleAuto(){ setAuto(!auto); },
    restart(){ nextPuzzle(); }, next(){ nextPuzzle(); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); },
    tick(dt){ update(dt); render(); },
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get score(){return solvedCount;}, get remaining(){return total-solvedCount;}, get total(){return total;}, get best(){return best;},
    typeLetter(ch){ typeLetter(ch); }, onCellTap(r,c){ onCellTap(r,c); }, gridVal(r,c){ return grid[r][c]; }
  };
})();
</script>
</body>
