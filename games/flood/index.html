<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹漫染 · Neon Flood</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#4dff91; --accent-glow:#4dff9166; --gold:#ffd54a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 18% 12%, #102038 0%, transparent 55%), radial-gradient(ellipse at 82% 88%, #2a1240 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#4dff91,#4dfff0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:52px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .swatches { display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .swatch { width:44px; height:44px; border-radius:12px; border:2px solid #ffffff22; cursor:pointer; transition:transform .15s, box-shadow .15s; }
  .swatch:active { transform:scale(0.9); }
  .swatch.sel { border-color:#fff; box-shadow:0 0 16px currentColor; transform:translateY(-3px); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#06120a; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#06120a; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹漫染</h1><div class="sub">N E O N &nbsp; F L O O D</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Moves</div><div class="value" id="moves">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">–</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="420" height="420"></canvas></div>
  <div class="swatches" id="swatches"></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">New Board</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">点色块把漫染区染成该色，把整块板染成同色即胜</div>
</div>
<script>
(function(){
  'use strict';
  const COLS=14, ROWS=14;
  const COLORS=['#ff4d6a','#4dff91','#4d9bff','#ffd54a','#b06bff','#4dfff0'];
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const movesEl=document.getElementById('moves'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  const swatchWrap=document.getElementById('swatches');
  const hex2rgb=(h)=>({r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)});
  const RGB=COLORS.map(hex2rgb);
  const lerp=(a,b,t)=>a+(b-a)*t;

  class Flood {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0;
      this.best=parseInt(localStorage.getItem('floodBest')||'0'); bestEl.textContent=this.best?this.best:'–';
      this.buildSwatches();
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); this.onDown(e); });
      this.restart();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    buildSwatches(){
      swatchWrap.innerHTML='';
      COLORS.forEach((c,i)=>{ const d=document.createElement('div'); d.className='swatch'; d.style.background=c; d.style.color=c; d.dataset.i=i;
        d.addEventListener('pointerdown',(e)=>{ e.preventDefault(); e.stopPropagation(); if(!this.autoPlay&&!this.over) this.apply(i); });
        swatchWrap.appendChild(d); });
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(260,Math.min(rect.width||420,420)); const dpr=window.devicePixelRatio||1;
      this.W=w; this.cell=w/COLS; canvas.width=w*dpr; canvas.height=w*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    restart(){ this.stopAuto(); this.over=false; this.win=false; this.moves=0;
      this.floodColor=Math.floor(Math.random()*COLORS.length);
      this.board=[]; for(let r=0;r<ROWS;r++){ const row=[]; for(let c=0;c<COLS;c++) row.push(Math.floor(Math.random()*COLORS.length)); this.board.push(row); }
      this.board[0][0]=this.floodColor;
      this.disp=this.board.map(row=>row.map(v=>({r:RGB[v].r,g:RGB[v].g,b:RGB[v].b})));
      this.claimed=this.computeClaimed();
      this.updateUI();
    }
    computeClaimed(){
      const seen=Array.from({length:ROWS},()=>new Array(COLS).fill(false));
      const q=[[0,0]]; seen[0][0]=true;
      while(q.length){ const cur=q.shift(); const r=cur[0],c=cur[1];
        const nb=[[r+1,c],[r-1,c],[r,c+1],[r,c-1]];
        for(const n of nb){ const nr=n[0],nc=n[1]; if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue; if(seen[nr][nc]) continue;
          if(this.board[nr][nc]===this.floodColor){ seen[nr][nc]=true; q.push([nr,nc]); } } }
      return seen;
    }
    claimedCount(){ let n=0; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(this.claimed[r][c]) n++; return n; }
    apply(k){
      if(this.over||this.autoPlay) return;
      if(k===this.floodColor) return;
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(this.claimed[r][c]) this.board[r][c]=k;
      this.floodColor=k; this.moves++; this.claimed=this.computeClaimed();
      this.updateUI();
      if(this.claimedCount()===ROWS*COLS) this.winGame();
    }
    winGame(){ this.over=true; this.win=true;
      if(!this.best||this.moves<this.best){ this.best=this.moves; localStorage.setItem('floodBest',String(this.best)); bestEl.textContent=this.best; }
      statusEl.textContent='🎉 通关！用了 '+this.moves+' 步';
    }
    onDown(e){ if(this.autoPlay||this.over) return; const rect=canvas.getBoundingClientRect(); const x=(e.clientX-rect.left)*(this.W/rect.width), y=(e.clientY-rect.top)*(this.W/rect.width); const c=Math.floor(x/this.cell), r=Math.floor(y/this.cell); if(r>=0&&r<ROWS&&c>=0&&c<COLS) this.apply(this.board[r][c]); }
    updateUI(){ movesEl.textContent=this.moves; const s=swatchWrap.children; for(let i=0;i<s.length;i++) s[i].classList.toggle('sel', i==this.floodColor);
      if(!this.over) statusEl.textContent='已染 '+this.claimedCount()+'/'+ (ROWS*COLS)+' · 点色块染色'; }
    // ---- auto ----
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this.autoStep(); }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    autoStep(){
      if(!this.autoPlay) return;
      if(this.over){ this._autoNext(); return; }
      let bestK=-1,bestGain=-1;
      for(let k=0;k<COLORS.length;k++){ if(k===this.floodColor) continue; const g=this.simGain(k); if(g>bestGain){ bestGain=g; bestK=k; } }
      if(bestK>=0) this.applyAuto(bestK);
      this.autoTimer=setTimeout(()=>this.autoStep(), 240);
    }
    simGain(k){
      const seen=Array.from({length:ROWS},()=>new Array(COLS).fill(false));
      const q=[[0,0]]; seen[0][0]=true; let cnt=1;
      while(q.length){ const cur=q.shift(); const r=cur[0],c=cur[1];
        const nb=[[r+1,c],[r-1,c],[r,c+1],[r,c-1]];
        for(const n of nb){ const nr=n[0],nc=n[1]; if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue; if(seen[nr][nc]) continue;
          const col=(this.claimed[r][c])?k:this.board[nr][nc];
          if(col===k){ seen[nr][nc]=true; q.push([nr,nc]); cnt++; } } }
      return cnt - this.claimedCount();
    }
    applyAuto(k){ for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(this.claimed[r][c]) this.board[r][c]=k; this.floodColor=k; this.moves++; this._autoProgress++; this.claimed=this.computeClaimed(); this.updateUI(); if(this.claimedCount()===ROWS*COLS) this.winGame(); }
    _autoNext(){ this.stopAuto(); this.restart(); this.startAuto(); }
    // ---- render ----
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.draw(dt); }catch(err){ console.error(err); } }
    draw(dt){
      const W=this.W, cell=this.cell; ctx.clearRect(0,0,W,W);
      const k=Math.min(1, dt*9);
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        const t=RGB[this.board[r][c]]; const d=this.disp[r][c];
        d.r=lerp(d.r,t.r,k); d.g=lerp(d.g,t.g,k); d.b=lerp(d.b,t.b,k);
        const x=c*cell,y=r*cell;
        if(this.claimed[r][c]){ ctx.save(); ctx.shadowColor='rgb('+(d.r|0)+','+(d.g|0)+','+(d.b|0)+')'; ctx.shadowBlur=12; }
        ctx.fillStyle='rgb('+(d.r|0)+','+(d.g|0)+','+(d.b|0)+')';
        this.roundRect(x+1.5,y+1.5,cell-3,cell-3,4); ctx.fill();
        if(this.claimed[r][c]) ctx.restore();
      }
    }
    roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Flood();
})();
</script>
</body>
</html>
