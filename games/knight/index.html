<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>骑士巡游 · Knight's Tour</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#7c5cff; --accent-glow:#7c5cff66; --gold:#ffd54a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 18% 12%, #1a1640 0%, transparent 55%), radial-gradient(ellipse at 82% 88%, #102038 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#7c5cff,#4d9bff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#0c0820; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#0c0820; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>骑士巡游</h1><div class="sub">K N I G H T ' S &nbsp; T O U R</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">已走</div><div class="value" id="progress">1/64</div></div>
      <div class="score-card best"><div class="label">巡游</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="440" height="440"></canvas></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">新巡游</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">点亮处为当前马，光圈为可走的“日”字格。把马走遍全部 64 格且不重复。</div>
</div>
<script>
(function(){
  'use strict';
  const N=8;
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const progEl=document.getElementById('progress'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  const M=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
  class Knight {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0; this.moveT=1;
      this.best=parseInt(localStorage.getItem('knightBest')||'0'); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); this.onDown(e); });
      this.restart();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(rect.width||440,440)); const dpr=window.devicePixelRatio||1;
      this.W=w; this.cell=w/N; canvas.width=w*dpr; canvas.height=w*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    restart(){ this.stopAuto(); this.over=false; this.win=false; this.visited=0; this._autoProgress=0;
      this.board=Array.from({length:N},()=>new Array(N).fill(0));
      const r=(Math.random()*N)|0, c=(Math.random()*N)|0;
      this.board[r][c]=1; this.visited=1; this.kr=r; this.kc=c; this.kx=c; this.ky=r; this.tkx=c; this.tky=r; this.moveT=1;
      this.status('走“日”字遍历 64 格。点亮处为当前马，光圈为可走格。'); this.updateUI();
    }
    status(t){ statusEl.textContent=t; }
    updateUI(){ progEl.textContent=this.visited+'/64'; }
    legal(r,c){ const out=[]; for(const [dr,dc] of M){ const nr=r+dr, nc=c+dc; if(nr>=0&&nr<N&&nc>=0&&nc<N&&this.board[nr][nc]===0) out.push([nr,nc]); } return out; }
    move(r,c){
      const or=this.kr, oc=this.kc;
      this.board[r][c]=++this.visited; this.kr=r; this.kc=c; this.tkx=c; this.tky=r; this.moveT=0; this.updateUI();
      if(this.visited===N*N){ this.win=true; this.over=true; this.best++; localStorage.setItem('knightBest',String(this.best)); bestEl.textContent=this.best; this.status('🎉 完美巡游，一笔画满 64 格！'); if(this.autoPlay) this.autoNext(); }
      else { const lg=this.legal(r,c); if(lg.length===0){ this.over=true; this.status('⛔ 无路可走 — 点“新巡游”再来一局'); if(this.autoPlay) this.autoNext(); } }
    }
    onDown(e){ if(this.autoPlay||this.over) return; const rect=canvas.getBoundingClientRect(); const x=(e.clientX-rect.left)*(this.W/rect.width), y=(e.clientY-rect.top)*(this.W/rect.width); const c=Math.floor(x/this.cell), r=Math.floor(y/this.cell); if(r<0||r>=N||c<0||c>=N) return; if(this.board[r][c]!==0) return; const ok=this.legal(this.kr,this.kc).some(([a,b])=>a===r&&b===c); if(ok) this.move(r,c); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this.autoStep(); }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){ clearTimeout(this.autoTimer); this.autoTimer=null; } const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    autoStep(){ if(!this.autoPlay||this.over) return; const moves=this.legal(this.kr,this.kc); if(moves.length===0){ this.autoNext(); return; }
      let best=null, bestDeg=99;
      for(const [r,c] of moves){ const d=this.legal(r,c).length; if(d<bestDeg || (d===bestDeg && Math.random()<0.5)){ bestDeg=d; best=[r,c]; } }
      this._autoProgress++; this.move(best[0],best[1]);
      if(!this.over) this.autoTimer=setTimeout(()=>this.autoStep(),190);
    }
    autoNext(){ this.stopAuto(); this.restart(); this.startAuto(); }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.draw(dt); }catch(err){ console.error(err); } }
    draw(dt){
      const W=this.W, cell=this.cell; ctx.clearRect(0,0,W,W);
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const x=c*cell,y=r*cell; ctx.fillStyle=((r+c)&1)?'#11152e':'#0d1124'; ctx.fillRect(x,y,cell,cell); }
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const v=this.board[r][c]; if(v===0) continue; const x=c*cell,y=r*cell; const t=v/(N*N); const hue=200+t*150;
        ctx.fillStyle=`hsla(${hue},80%,55%,${0.10+0.5*t})`; this.rr(x+cell*0.1,y+cell*0.1,cell*0.8,cell*0.8,8); ctx.fill();
        ctx.fillStyle=`hsla(${hue},90%,82%,0.92)`; ctx.font=`${cell*0.3}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(v,x+cell/2,y+cell*0.28);
      }
      if(!this.autoPlay&&!this.over){ for(const [r,c] of this.legal(this.kr,this.kc)){ const x=c*cell,y=r*cell; ctx.save(); ctx.shadowColor='#7c5cff'; ctx.shadowBlur=14; ctx.strokeStyle='#7c5cff'; ctx.lineWidth=2; this.rr(x+cell*0.16,y+cell*0.16,cell*0.68,cell*0.68,8); ctx.stroke(); ctx.restore(); } }
      this.moveT=Math.min(1,this.moveT+dt/0.18);
      const e=this.moveT<0.5?2*this.moveT*this.moveT:1-Math.pow(-2*this.moveT+2,2)/2;
      const kx=this.kx+(this.tkx-this.kx)*e, ky=this.ky+(this.tky-this.ky)*e; this.kx=kx; this.ky=ky;
      const px=(kx+0.5)*cell, py=(ky+0.5)*cell;
      ctx.save(); ctx.shadowColor='#ffd54a'; ctx.shadowBlur=18; ctx.fillStyle='#ffd54a'; ctx.beginPath(); ctx.arc(px,py,cell*0.34,0,7); ctx.fill();
      ctx.fillStyle='#0c0820'; ctx.font=`${cell*0.5}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('♞',px,py+cell*0.02); ctx.restore();
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Knight();
})();
</script>
</body>
</html>
