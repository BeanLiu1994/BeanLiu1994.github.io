<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a1a" />
<title>Tower Defense · Neon</title>
<style>
  :root{
    --bg:#0a0a1a; --surface:#12122a; --board:#16163a; --text:#e0e0f0; --muted:#8888aa;
    --accent:#ffb14d; --accent-glow:#ffb14d66; --danger:#ff4d6a; --gold:#ffd700;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);background-image:radial-gradient(ellipse at 20% 20%,#2a1f10 0%,transparent 55%),radial-gradient(ellipse at 80% 80%,#102a38 0%,transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;}
  .container{width:100%;max-width:460px;padding:16px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .title-block h1{font-size:1.9rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--accent),#ffe0b3,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:6px 14px;text-align:center;min-width:58px;}
  .score-card .label{font-size:0.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.best .value{color:var(--gold);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0a;border-radius:14px;padding:10px;box-shadow:0 0 40px #00000030,0 0 70px var(--accent-glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#0a0e1c;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;z-index:10;pointer-events:none;opacity:0;transition:opacity .35s;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0a1aee;backdrop-filter:blur(4px);border-radius:14px;}
  .overlay-content{position:relative;text-align:center;z-index:1;}
  .overlay-content h2{font-size:2rem;font-weight:800;margin-bottom:6px;}
  .overlay-content p{color:var(--muted);margin-bottom:16px;font-size:0.9rem;}
  .overlay.win h2{color:#4dff91;} .overlay.lose h2{color:var(--danger);}
  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:90px;padding:12px 16px;border:1px solid #ffffff12;border-radius:10px;background:var(--surface);color:var(--text);font-size:0.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff10;} .btn:active{transform:scale(0.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0a0a1a;}
  .btn.primary:hover{box-shadow:0 0 20px var(--accent-glow);}
  .btn.auto-on{background:var(--accent);border-color:var(--accent);color:#0a0a1a;animation:pulse-glow 2s infinite;--glow:var(--accent-glow);}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--glow,transparent);}50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);}}
  .ai-indicator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:0.75rem;color:var(--muted);justify-content:center;min-height:20px;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
  .stats-bar{display:flex;gap:8px;justify-content:center;margin-top:8px;font-size:0.7rem;color:var(--muted);}
  .stats-bar span{background:var(--surface);padding:3px 8px;border-radius:6px;border:1px solid #ffffff08;}
  @media (max-width:400px){.title-block h1{font-size:1.4rem;}.btn{padding:10px 12px;font-size:.78rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Tower Defense</h1><div class="sub">C R Y S T A L &nbsp; S I E G E</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game"></canvas>
    <div class="overlay win" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2>Defended!</h2><p id="win-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
    <div class="overlay lose" id="overlay-lose"><div class="overlay-bg"></div><div class="overlay-content"><h2>Breached!</h2><p id="lose-msg"></p><button class="btn primary" onclick="game.restart()">Try Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI building...</span></div>
  <div class="stats-bar"><span id="money-stat">Gold: 0</span><span id="wave-stat">Wave: 0/8</span><span id="life-stat">Lives: 5</span></div>
</div>
<script>
(function(){
  'use strict';
  const COLS=12,ROWS=9,CELL=36,W=COLS*CELL,H=ROWS*CELL+34,STEP_MS=33;
  const WP=[[-1,1],[10,1],[10,4],[1,4],[1,7],[12,7]];
  const canvas=document.getElementById('game');
  function fit(){ const dpr=window.devicePixelRatio||1; canvas.width=W*dpr; canvas.height=H*dpr; const c=canvas.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); return c; }
  const ctx=fit();
  const cx=(col)=>col*CELL+CELL/2, cy=(row)=>row*CELL+CELL/2;

  class TD{
    constructor(){ this.best=parseInt(localStorage.getItem('bestTD')||'0'); this.autoPlay=false; this.running=false; this.rafId=null; this.bindInput(); this.restart(); }
    buildPath(){ this.pathCells=new Set(); this.segs=[]; this.total=0;
      for(let i=0;i<WP.length-1;i++){ let [c0,r0]=WP[i],[c1,r1]=WP[i+1]; const steps=Math.max(Math.abs(c1-c0),Math.abs(r1-r0)); const dc=(c1-c0)/steps, dr=(r1-r0)/steps;
        for(let s=0;s<=steps;s++){ const c=Math.round(c0+dc*s), r=Math.round(r0+dr*s); if(c>=0&&c<COLS&&r>=0&&r<ROWS) this.pathCells.add(r+','+c); }
        const x0=cx(c0),y0=cy(r0),x1=cx(c1),y1=cy(r1); const len=Math.hypot(x1-x0,y1-y0); this.segs.push({x0,y0,x1,y1,len,start:this.total}); this.total+=len; }
    }
    posAt(dist){ for(const s of this.segs){ if(dist<=s.start+s.len){ const t=(dist-s.start)/s.len; return {x:s.x0+(s.x1-s.x0)*t, y:s.y0+(s.y1-s.y0)*t}; } } const last=this.segs[this.segs.length-1]; return {x:last.x1,y:last.y1}; }
    restart(){ this.stopAuto(); this.stopLoop(); this.buildPath();
      this.towers=[]; this.enemies=[]; this.beams=[]; this.money=140; this.lives=5; this.score=0; this.over=false;
      this.wave=0; this.totalWaves=8; this.toSpawn=0; this.spawnTimer=0; this.spawnInt=1400; this.waveDelay=600; this.autoPlace=0; this.bestCell=null;
      document.getElementById('overlay-win').classList.remove('active'); document.getElementById('overlay-lose').classList.remove('active');
      this.nextWave(); this.startLoop();
    }
    nextWave(){ this.wave++; this.toSpawn=4+this.wave*2; this.spawnInt=Math.max(500,1400-this.wave*90); this.spawnTimer=200; }
    spawn(){ const hp=26+this.wave*9, sp=38+this.wave*4; this.enemies.push({dist:0,hp,maxhp:hp,sp,col:this.pathCellsColor()}); }
    pathCellsColor(){ return '#ff6a8a'; }
    update(dt){
      if(this.waveDelay>0){ this.waveDelay-=dt; if(this.waveDelay>0) {/* still spawning? no */} else { if(this.wave<this.totalWaves) this.nextWave(); } }
      if(this.toSpawn>0){ this.spawnTimer-=dt; if(this.spawnTimer<=0){ this.spawn(); this.toSpawn--; this.spawnTimer=this.spawnInt; } }
      // move enemies
      for(const e of this.enemies){ e.dist+=e.sp*dt/1000; const p=this.posAt(e.dist); e.x=p.x; e.y=p.y; if(e.dist>=this.total){ e.dead=true; this.lives--; if(this.lives<=0){ this.lose(); return; } } }
      // towers fire
      for(const t of this.towers){ t.cd-=dt; if(t.cd<=0){ let best=null,bd=t.range; for(const e of this.enemies){ if(e.dead) continue; const d=Math.hypot(e.x-t.x,e.y-t.y); if(d<bd){ bd=d; best=e; } } if(best){ best.hp-=t.dmg; t.cd=t.fire; this.beams.push({x1:t.x,y1:t.y,x2:best.x,y2:best.y,life:120}); } else t.cd=80; } }
      // beams
      for(const b of this.beams) b.life-=dt;
      this.beams=this.beams.filter(b=>b.life>0);
      // dead enemies
      for(const e of this.enemies){ if(e.hp<=0&&!e.dead){ e.dead=true; this.money+=8; this.score+=10; if(this.score>this.best){this.best=this.score;localStorage.setItem('bestTD',this.best);} } }
      this.enemies=this.enemies.filter(e=>!e.dead);
      // wave clear
      if(this.toSpawn===0 && this.enemies.length===0 && this.waveDelay<=0){ if(this.wave>=this.totalWaves){ this.win(); return; } else { this.waveDelay=800; } }
      // auto place
      if(this.autoPlay){ this.autoPlace-=dt; if(this.autoPlace<=0){ this.autoPlace=700; if(this.money>=60) this.tryPlace(); } }
    }
    tryPlace(){ let best=null,bs=-1; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ if(this.pathCells.has(r+','+c)) continue; if(this.towers.some(t=>t.col===c&&t.row===r)) continue; let adj=0; for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]) if(this.pathCells.has((r+dr)+','+(c+dc))) adj++; if(adj>bs){ bs=adj; best={row:r,col:c}; } }
      if(best && bs>0){ this.towers.push({row:best.row,col:best.col,x:cx(best.col),y:cy(best.row),range:CELL*2.7,dmg:20,fire:420,cd:0}); this.money-=60; } }
    win(){ this.over=true; this.autoPlay=false; document.getElementById('win-msg').textContent='All '+this.totalWaves+' waves held · '+this.score+' pts'; document.getElementById('overlay-win').classList.add('active'); this.autoCont(); }
    lose(){ this.over=true; this.autoPlay=false; document.getElementById('lose-msg').textContent='The crystal was breached'; document.getElementById('overlay-lose').classList.add('active'); this.autoCont(); }
    autoCont(){ if(!this.autoActive) return; const self=this; this.contTimer=setTimeout(()=>{ if(!self.autoActive) return; self.restart(); self.startAuto(); },1600); }
    toggleAuto(){ if(this.autoPlay){ this.autoActive=false; this.stopAuto(); } else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoActive=true; this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; }
    stopAuto(){ this.autoPlay=false; if(this.contTimer){clearTimeout(this.contTimer);this.contTimer=null;} const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    startLoop(){ this.stopLoop(); this.running=true; this.lastT=performance.now(); this.acc=0; const loop=()=>{ if(!this.running) return; const now=performance.now(); this.acc+=now-this.lastT; this.lastT=now; if(this.acc>400) this.acc=STEP_MS; while(this.acc>=STEP_MS){ this.acc-=STEP_MS; if(!this.over) this.update(STEP_MS); if(this.over) break; } this.draw(); this.rafId=requestAnimationFrame(loop); }; this.rafId=requestAnimationFrame(loop); }
    stopLoop(){ this.running=false; if(this.rafId){ cancelAnimationFrame(this.rafId); this.rafId=null; } }
    bindInput(){ const wrap=document.getElementById('board-wrap'); let id=null;
      wrap.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over) return; id=e.pointerId; try{wrap.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); const r2=canvas.getBoundingClientRect(); const x=(e.clientX-r2.left)/r2.width*W, y=(e.clientY-r2.top)/r2.height*H; const c=Math.floor(x/CELL), r=Math.floor(y/CELL); if(c<0||c>=COLS||r<0||r>=ROWS) return; if(this.pathCells.has(r+','+c)) return; if(this.towers.some(t=>t.col===c&&t.row===r)) return; if(this.money>=60){ this.towers.push({row:r,col:c,x:cx(c),y:cy(r),range:CELL*2.7,dmg:20,fire:420,cd:0}); this.money-=60; this.draw(); } });
      wrap.addEventListener('pointerup',(e)=>{ if(e.pointerId===id) id=null; }); wrap.addEventListener('pointercancel',(e)=>{ if(e.pointerId===id) id=null; });
      window.addEventListener('resize',()=>this.draw()); }
    draw(){ ctx.clearRect(0,0,W,H);
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ if(this.pathCells.has(r+','+c)){ ctx.fillStyle='#10243a'; this.rrect(c*CELL+1,r*CELL+1,CELL-2,CELL-2,5); ctx.fill(); } else { ctx.fillStyle='#0c1124'; this.rrect(c*CELL+1,r*CELL+1,CELL-2,CELL-2,5); ctx.fill(); ctx.strokeStyle='#ffffff0a'; this.rrect(c*CELL+1,r*CELL+1,CELL-2,CELL-2,5); ctx.stroke(); } }
      for(const t of this.towers){ ctx.save(); ctx.shadowColor='#ffb14d'; ctx.shadowBlur=12; ctx.fillStyle='#ffb14d'; this.rrect(t.x-CELL*0.32,t.y-CELL*0.32,CELL*0.64,CELL*0.64,6); ctx.fill(); ctx.restore(); ctx.fillStyle='#3a1f00'; ctx.beginPath(); ctx.arc(t.x,t.y,CELL*0.16,0,7); ctx.fill(); }
      for(const e of this.enemies){ ctx.save(); ctx.shadowColor='#ff6a8a'; ctx.shadowBlur=10; ctx.fillStyle='#ff6a8a'; ctx.beginPath(); ctx.arc(e.x,e.y,CELL*0.3,0,7); ctx.fill(); ctx.restore(); ctx.fillStyle='#0a0a1a'; ctx.fillRect(e.x-CELL*0.28,e.y-CELL*0.08,CELL*0.56,3); ctx.fillStyle='#4dff91'; ctx.fillRect(e.x-CELL*0.28,e.y-CELL*0.08,CELL*0.56*(e.hp/e.maxhp),3); }
      for(const b of this.beams){ ctx.strokeStyle='rgba(255,177,77,'+(b.life/120)+')'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke(); }
      ctx.fillStyle='#ffd700'; ctx.font='600 13px Segoe UI'; ctx.textAlign='left'; ctx.fillText('Gold '+this.money,W-150,H-12); ctx.fillStyle='#9fe9ff'; ctx.fillText('Wave '+this.wave+'/'+this.totalWaves,10,H-12); ctx.fillStyle='#ff8a8a'; ctx.fillText('Lives '+this.lives,W/2-20,H-12);
      document.getElementById('score').textContent=this.score; document.getElementById('best').textContent=this.best; document.getElementById('money-stat').textContent='Gold: '+this.money; document.getElementById('wave-stat').textContent='Wave: '+this.wave+'/'+this.totalWaves; document.getElementById('life-stat').textContent='Lives: '+this.lives;
      if(this.autoPlay) document.getElementById('ai-status').textContent='AI: '+this.towers.length+' towers · wave '+this.wave;
    }
    rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new TD();
})();
</script>
</body>
</html>
