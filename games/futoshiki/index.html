<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>不等式数独 · Futoshiki</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#4dfff0; --accent-glow:#4dfff066; --gold:#ffd54a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 18% 12%, #103038 0%, transparent 55%), radial-gradient(ellipse at 82% 88%, #2a1240 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#4dfff0,#4d9bff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .numpad { display:flex; gap:6px; margin-top:10px; }
  .nbtn { flex:1; padding:12px 0; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:1rem; font-weight:700; cursor:pointer; transition:all .15s; }
  .nbtn:hover { background:#ffffff10; } .nbtn:active { transform:scale(0.95); }
  .nbtn.erase { color:var(--accent); flex:0 0 56px; }
  .controls { display:flex; gap:8px; margin-top:8px; }
  .btn { flex:1; min-width:80px; padding:10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#062028; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#062028; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>不等式数独</h1><div class="sub">F U T O S H I K I</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">已填</div><div class="value" id="progress">0/25</div></div>
      <div class="score-card best"><div class="label">解出</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="420" height="420"></canvas></div>
  <div class="numpad" id="numpad">
    <button class="nbtn" onclick="game.input(1)">1</button>
    <button class="nbtn" onclick="game.input(2)">2</button>
    <button class="nbtn" onclick="game.input(3)">3</button>
    <button class="nbtn" onclick="game.input(4)">4</button>
    <button class="nbtn" onclick="game.input(5)">5</button>
    <button class="nbtn erase" onclick="game.input(0)">⌫</button>
  </div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">新题</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">每行每列 1–5 不重复，并满足相邻格的大小符号。点格子后用下方键盘填数。</div>
</div>
<script>
(function(){
  'use strict';
  const N=5;
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const progEl=document.getElementById('progress'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  class Futo {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0; this.sel=null;
      this.best=parseInt(localStorage.getItem('futoBest')||'0'); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); this.onDown(e); });
      window.addEventListener('keydown',(e)=>{ if(this.autoPlay||this.over) return; if(e.key>='1'&&e.key<='5') this.input(+e.key); else if(e.key==='0'||e.key==='Backspace') this.input(0); else if(this.sel){ if(e.key==='ArrowUp')this.moveSel(-1,0); if(e.key==='ArrowDown')this.moveSel(1,0); if(e.key==='ArrowLeft')this.moveSel(0,-1); if(e.key==='ArrowRight')this.moveSel(0,1);} });
      this.restart(); this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(rect.width||420,420)); const dpr=window.devicePixelRatio||1; this.W=w; this.cell=w/N; canvas.width=w*dpr; canvas.height=w*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    genSol(){ const g=Array.from({length:N},()=>new Array(N).fill(0));
      const ok=(r,c,v)=>{ for(let i=0;i<N;i++){ if(g[r][i]===v||g[i][c]===v) return false; } return true; };
      const fill=(pos)=>{ if(pos===N*N) return true; const r=(pos/N)|0,c=pos%N; for(const v of shuffle([1,2,3,4,5])){ if(ok(r,c,v)){ g[r][c]=v; if(fill(pos+1)) return true; g[r][c]=0; } } return false; };
      fill(0); return g;
    }
    restart(){ this.stopAuto(); this.over=false; this.win=false; this._autoProgress=0; this.sel=null;
      const sol=this.genSol(); this.sol=sol; this.board=sol.map(r=>r.slice());
      this.cons=[];
      for(let r=0;r<N;r++)for(let c=0;c<N-1;c++){ if(Math.random()<0.55){ this.cons.push({r,c,dir:'h',less:sol[r][c]<sol[r][c+1]}); } }
      for(let c=0;c<N;c++)for(let r=0;r<N-1;r++){ if(Math.random()<0.55){ this.cons.push({r,c,dir:'v',less:sol[r][c]<sol[r+1][c]}); } }
      this.given=sol.map(r=>r.map(()=>Math.random()<0.45));
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(!this.given[r][c]) this.board[r][c]=0; }
      this.status('每行每列 1–5 不重复，且满足大小符号。点格 + 键盘填数。'); this.updateUI();
    }
    status(t){ statusEl.textContent=t; }
    updateUI(){ let f=0; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(this.board[r][c]) f++; progEl.textContent=f+'/25'; }
    onDown(e){ if(this.autoPlay||this.over) return; const rect=canvas.getBoundingClientRect(); const x=(e.clientX-rect.left)*(this.W/rect.width), y=(e.clientY-rect.top)*(this.W/rect.width); const c=Math.floor(x/this.cell), r=Math.floor(y/this.cell); if(r<0||r>=N||c<0||c>=N) return; this.sel={r,c}; }
    moveSel(dr,dc){ let r=(this.sel.r+dr+N)%N, c=(this.sel.c+dc+N)%N; this.sel={r,c}; }
    input(v){ if(this.autoPlay||this.over||!this.sel) return; const {r,c}=this.sel; if(this.given[r][c]) return; this.board[r][c]=v; this.checkWin(); this.updateUI(); }
    checkWin(){ for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(this.board[r][c]!==this.sol[r][c]) return; this.over=true; this.win=true; this.best++; localStorage.setItem('futoBest',String(this.best)); bestEl.textContent=this.best; this.status('🎉 解开了！'); if(this.autoPlay) this.autoNext(); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this.autoStep(); }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){ clearTimeout(this.autoTimer); this.autoTimer=null; } const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    autoStep(){ if(!this.autoPlay||this.over) return; let done=false;
      for(let r=0;r<N&&!done;r++)for(let c=0;c<N&&!done;c++){ if(this.board[r][c]===0){ this.board[r][c]=this.sol[r][c]; this._autoProgress++; this.sel={r,c}; done=true; } }
      this.updateUI();
      if(!done){ this.checkWin(); return; }
      this.autoTimer=setTimeout(()=>this.autoStep(),110);
    }
    autoNext(){ this.stopAuto(); this.restart(); this.startAuto(); }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.draw(dt); }catch(err){ console.error(err); } }
    draw(){
      const W=this.W,cell=this.cell; ctx.clearRect(0,0,W,W);
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const x=c*cell,y=r*cell; const v=this.board[r][c];
        if(this.given[r][c]){ ctx.fillStyle='#16204a'; this.rr(x+1,y+1,cell-2,cell-2,6); ctx.fill(); }
        ctx.fillStyle=v?'#e6e6f5':'#5a5a7a'; ctx.font=`bold ${cell*0.42}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(v?String(v):'',x+cell/2,y+cell/2);
      }
      ctx.strokeStyle='#ffffff22'; ctx.lineWidth=1.5;
      for(let i=0;i<=N;i++){ ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,W); ctx.moveTo(0,i*cell); ctx.lineTo(W,i*cell); ctx.stroke(); }
      ctx.fillStyle='#4dfff0'; ctx.font=`bold ${cell*0.34}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
      for(const cn of this.cons){ if(cn.dir==='h'){ const x=(cn.c+1)*cell, y=(cn.r+0.5)*cell; ctx.fillText(cn.less?'<':'>',x,y); } else { const x=(cn.c+0.5)*cell, y=(cn.r+1)*cell; ctx.fillText(cn.less?'∧':'∨',x,y); } }
      if(this.sel){ const x=this.sel.c*cell,y=this.sel.r*cell; ctx.save(); ctx.shadowColor='#4dfff0'; ctx.shadowBlur=14; ctx.strokeStyle='#4dfff0'; ctx.lineWidth=3; this.rr(x+2,y+2,cell-4,cell-4,6); ctx.stroke(); ctx.restore(); }
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Futo();
})();
</script>
</body>
</html>
