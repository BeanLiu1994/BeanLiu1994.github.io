<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹矩形拼图 · Rectangles</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0b1024; --text:#e0e0f0; --muted:#8888aa;
    --accent:#ffb347; --accent-glow:#ffb34766; --danger:#ff5d8a; --gold:#ffd700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg);
    background-image: radial-gradient(ellipse at 50% 0%, #302010 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #102844 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),#ffd9a0,#ffb347); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 12px; text-align:center; min-width:64px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .score-card.s .value { color:var(--accent); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:auto; border-radius:10px; background:var(--board); cursor:pointer; }
  .controls { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:10px 12px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:600; cursor:pointer; transition:all .2s; text-align:center; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.96); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#1a1000; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#1a1000; animation:pg 2s infinite; --glow:var(--accent-glow); }
  @keyframes pg { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:18px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bk .8s infinite; }
  @keyframes bk { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:6px; font-size:0.7rem; color:var(--muted); flex-wrap:wrap; }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>矩形拼图</h1><div class="sub">R E C T A N G L E S</div></div>
    <div class="score-panel">
      <div class="score-card s"><div class="label">Solved</div><div class="value" id="score-solved">0</div></div>
      <div class="score-card"><div class="label">Time</div><div class="value" id="score-time">0s</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="cv" width="460" height="520"></canvas>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.newGame()">New</button>
    <button class="btn" id="btn-erase" onclick="game.clearBoard()">Clear</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI is solving…</span></div>
  <div class="stats-bar"><span id="best-stat">Best: —</span><span id="hint-stat">Drag to draw a rectangle = its number</span></div>
</div>
<script>
(function(){
  'use strict';
  const W=460, H=520, N=8, PAD=14, TOP=70;
  const canvas=document.getElementById('cv'); const ctx=canvas.getContext('2d');

  class Shikaku {
    constructor(){
      this.autoPlay=false; this.last=0; this.raf=null;
      this.solved=0; this.best=0; this.num=[]; this.cages=[]; this.assigned=[]; this.rects=[];
      this.win=false; this.time=0; this.winTimer=0; this.drag=null; this.autoIdx=0; this.autoTimer=0; this.invalid=0;
      this.loop=this.loop.bind(this); this.bind();
      this.newGame();
      this.last=performance.now(); this.raf=requestAnimationFrame(this.loop);
    }
    loadBest(){ try{ return parseInt(localStorage.getItem('shikaku_best')||'0')||0; }catch(e){ return 0; } }
    saveBest(){ try{ localStorage.setItem('shikaku_best', String(this.best)); }catch(e){} }
    gen(){
      this.num=new Array(N*N).fill(0); this.assigned=new Array(N*N).fill(-1); this.rects=[]; this.cages=[];
      const used=new Array(N*N).fill(false);
      // greedy rectangle tiling
      const dirs=[]; // candidate sizes
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){
        if(used[r*N+c]) continue;
        const maxW=Math.min(N-c, 4), maxH=Math.min(N-r, 4);
        // try sizes largest first for nicer shapes
        let placed=false;
        const sizes=[]; for(let h=1;h<=maxH;h++) for(let w=1;w<=maxW;w++) sizes.push([w,h]);
        sizes.sort((a,b)=> (b[0]*b[1])-(a[0]*a[1]));
        for(const [w,h] of sizes){
          let ok=true;
          for(let rr=r;rr<r+h;rr++) for(let cc=c;cc<c+w;cc++){ if(used[rr*N+cc]){ ok=false; break; } }
          if(ok){ const cells=[]; for(let rr=r;rr<r+h;rr++) for(let cc=c;cc<c+w;cc++){ used[rr*N+cc]=true; cells.push(rr*N+cc); }
            const area=w*h; this.num[r*N+c]=area; this.cages.push({cells, area, id:this.rects.length}); this.rects.push({cells, id:this.rects.length}); placed=true; break; }
        }
        if(!placed){ used[r*N+c]=true; this.num[r*N+c]=1; this.cages.push({cells:[r*N+c],area:1,id:this.rects.length}); this.rects.push({cells:[r*N+c],id:this.rects.length}); }
      }
    }
    newGame(){ this.stopAuto(); this.win=false; this.time=0; this.winTimer=0; this.drag=null; this.invalid=0; this.gen();
      document.getElementById('score-time').textContent='0s'; }
    autoNext(){ // soft reset keeping auto engaged (continuous auto demo)
      this.win=false; this.winTimer=0; this.drag=null; this.invalid=0;
      this.assigned=new Array(N*N).fill(-1); this.rects=[]; this.autoIdx=0; this.autoTimer=10;
      this.gen(); document.getElementById('score-time').textContent='0s'; }
    clearBoard(){ if(this.autoPlay) return; this.assigned=new Array(N*N).fill(-1); this.rects=[]; this.win=false; }
    hue(id){ return (id*53)%360; }
    tryPlace(r0,c0,r1,c1){
      const rr0=Math.min(r0,r1), rr1=Math.max(r0,r1), cc0=Math.min(c0,c1), cc1=Math.max(c0,c1);
      const area=(rr1-rr0+1)*(cc1-cc0+1);
      let numCount=0, numVal=0;
      for(let r=rr0;r<=rr1;r++) for(let c=cc0;c<=cc1;c++){
        const i=r*N+c;
        if(this.assigned[i]!==-1){ this.invalid=20; return; }
        if(this.num[i]>0){ numCount++; numVal=this.num[i]; }
      }
      if(numCount!==1 || numVal!==area){ this.invalid=20; return; }
      const id=this.rects.length; const cells=[];
      for(let r=rr0;r<=rr1;r++) for(let c=cc0;c<=cc1;c++){ const i=r*N+c; this.assigned[i]=id; cells.push(i); }
      this.rects.push({cells, id});
      this.checkWin();
    }
    checkWin(){
      if(this.assigned.indexOf(-1)>=0) return;
      this.win=true; this.winTimer=140; this.solved++;
      if(this.best===0||this.time<this.best){ this.best=this.time; this.saveBest(); }
      document.getElementById('score-solved').textContent=this.solved;
      document.getElementById('best-stat').textContent='Best: '+this.best+'s';
    }
    step(dt){
      if(this.invalid>0) this.invalid-=dt;
      if(this.win){ this.winTimer-=dt; if(this.autoPlay && this.winTimer<=0) this.autoNext(); return; }
      if(!this.autoPlay){ this.time+=dt/60; document.getElementById('score-time').textContent=Math.floor(this.time)+'s'; return; }
      this.autoTimer-=dt;
      if(this.autoTimer<=0){
        if(this.autoIdx<this.cages.length){ const cage=this.cages[this.autoIdx++]; for(const i of cage.cells) this.assigned[i]=cage.id; this.rects.push({cells:cage.cells.slice(), id:cage.id}); this.checkWin(); }
        else { this.autoNext(); return; }
        this.autoTimer=18;
      }
    }
    cellRect(i){ const r=(i/N)|0,c=i%N; const gw=W-PAD*2, cs=gw/N; return {x:PAD+c*cs,y:TOP+r*cs,s:cs}; }
    loop(now){
      const dt=Math.max(0.4,Math.min(2.2,(now-this.last)/16.67)); this.last=now;
      this.step(dt); this.draw();
      this.raf=requestAnimationFrame(this.loop);
    }
    draw(){
      ctx.clearRect(0,0,W,H);
      const gw=W-PAD*2, cs=gw/N;
      // cells
      for(let i=0;i<N*N;i++){ const {x,y,s}=this.cellRect(i); const a=this.assigned[i];
        ctx.beginPath(); ctx.rect(x+1,y+1,s-2,s-2);
        if(a>=0){ const h=this.hue(a); ctx.fillStyle='hsla('+h+',70%,55%,0.30)'; ctx.shadowColor='hsl('+h+',70%,55%)'; ctx.shadowBlur=8; }
        else { ctx.fillStyle='#10162e'; ctx.shadowBlur=0; }
        ctx.fill(); ctx.shadowBlur=0;
      }
      // grid
      ctx.strokeStyle='#222a48'; ctx.lineWidth=1;
      for(let k=0;k<=N;k++){ ctx.beginPath(); ctx.moveTo(PAD, TOP+k*cs); ctx.lineTo(PAD+gw, TOP+k*cs); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(PAD+k*cs, TOP); ctx.lineTo(PAD+k*cs, TOP+gw); ctx.stroke(); }
      // numbers
      ctx.textAlign='center'; ctx.textBaseline='middle';
      for(let i=0;i<N*N;i++){ if(this.num[i]>0){ const {x,y,s}=this.cellRect(i); ctx.fillStyle='#ffd9a0'; ctx.font='bold '+(cs*0.36)+'px sans-serif'; ctx.fillText(String(this.num[i]), x+s/2, y+s/2); } }
      // rect borders
      for(const rect of this.rects){ const cells=rect.cells; let r0=99,c0=99,r1=0,c1=0; for(const i of cells){ const r=(i/N)|0,c=i%N; if(r<r0)r0=r; if(c<c0)c0=c; if(r>r1)r1=r; if(c>c1)c1=c; }
        const x=PAD+c0*cs, y=TOP+r0*cs, w=(c1-c0+1)*cs, h=(r1-r0+1)*cs;
        const hc=this.hue(rect.id); ctx.strokeStyle='hsl('+hc+',80%,65%)'; ctx.lineWidth=2.5; ctx.strokeRect(x+1.5,y+1.5,w-3,h-3); }
      // drag preview
      if(this.drag && this.drag.active){ const d=this.drag; const rr0=Math.min(d.r0,d.r1),rr1=Math.max(d.r0,d.r1),cc0=Math.min(d.c0,d.c1),cc1=Math.max(d.c0,d.c1);
        const x=PAD+cc0*cs,y=TOP+rr0*cs,w=(cc1-cc0+1)*cs,h=(rr1-rr0+1)*cs;
        ctx.fillStyle='rgba(255,179,71,0.18)'; ctx.fillRect(x,y,w,h); ctx.strokeStyle='#ffb347'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,w-2,h-2); }
      if(this.invalid>0){ ctx.fillStyle='rgba(255,93,138,'+(this.invalid/20*0.5)+')'; ctx.fillRect(PAD,TOP,gw,gw); }
      if(this.win){ ctx.fillStyle='#ffd700'; ctx.font='bold 30px sans-serif'; ctx.fillText('SOLVED!', W/2, TOP-26); }
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else this.startAuto(); }
    startAuto(){ this.autoPlay=true; this.autoIdx=0; this.autoTimer=10; this.assigned=new Array(N*N).fill(-1); this.rects=[]; this.win=false;
      const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on');
      const ind=document.getElementById('ai-indicator'); if(ind) ind.style.display='flex';
      document.getElementById('ai-status').textContent='AI is solving…'; }
    stopAuto(){ this.autoPlay=false;
      const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on');
      const ind=document.getElementById('ai-indicator'); if(ind) ind.style.display='none'; }
    bind(){
      const cellAt=(e)=>{ const r=canvas.getBoundingClientRect(); const mx=(e.clientX-r.left)/r.width*W, my=(e.clientY-r.top)/r.height*H; const gw=W-PAD*2, cs=gw/N;
        const c=Math.floor((mx-PAD)/cs), row=Math.floor((my-TOP)/cs); if(c<0||c>=N||row<0||row>=N) return null; return {r:row,c}; };
      canvas.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.win) return; const cl=cellAt(e); if(!cl) return; canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId); this.drag={active:true,r0:cl.r,c0:cl.c,r1:cl.r,c1:cl.c}; });
      canvas.addEventListener('pointermove',(e)=>{ if(!this.drag||!this.drag.active) return; const cl=cellAt(e); if(cl){ this.drag.r1=cl.r; this.drag.c1=cl.c; } });
      const end=(e)=>{ if(!this.drag||!this.drag.active) return; const d=this.drag; this.drag=null; this.tryPlace(d.r0,d.c0,d.r1,d.c1); };
      canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end);
    }
  }
  window.game=new Shikaku();
})();
</script>
</body>
</html>
