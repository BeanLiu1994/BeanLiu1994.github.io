<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>黑白阵 · Hitori</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#3ecf8e; --accent-glow:#3ecf8e66; --gold:#ffd54a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 18% 12%, #0f2a1c 0%, transparent 55%), radial-gradient(ellipse at 82% 88%, #2a1038 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#3ecf8e,#4d9bff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .legend { display:flex; gap:14px; justify-content:center; margin-top:8px; font-size:0.7rem; color:var(--muted); }
  .legend span b { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:4px; }
  .controls { display:flex; gap:8px; margin-top:8px; }
  .btn { flex:1; min-width:80px; padding:10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#06201a; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#06201a; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>黑白阵</h1><div class="sub">H I T O R I</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">黑格</div><div class="value" id="progress">0</div></div>
      <div class="score-card best"><div class="label">解出</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="420" height="420"></canvas></div>
  <div class="legend"><span><b style="background:#3ecf8e"></b>白（保留）</span><span><b style="background:#1a1a2e"></b>黑（涂掉）</span><span>点格切换</span></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">新题</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">把重复的数字涂黑，使每行每列数字不重复、白格连通、且黑格不三连。</div>
</div>
<script>
(function(){
  'use strict';
  const N=5;
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const progEl=document.getElementById('progress'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  const key=(r,c)=>r*N+c;
  class Hitori {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0; this.flash=null;
      this.best=parseInt(localStorage.getItem('hitoBest')||'0'); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); this.onDown(e); });
      this.restart(); this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(rect.width||420,420)); const dpr=window.devicePixelRatio||1; this.W=w; this.cell=w/N; canvas.width=w*dpr; canvas.height=w*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    genB(){ const B=new Set(); const has=(r,c)=>B.has(key(r,c));
      const no3=(r,c)=>{ const h=[has(r,c-2),has(r,c-1),has(r,c),has(r,c+1),has(r,c+2)]; for(let i=0;i<3;i++) if(h[i]&&h[i+1]&&h[i+2]) return false; const v=[has(r-2,c),has(r-1,c),has(r,c),has(r+1,c),has(r+2,c)]; for(let i=0;i<3;i++) if(v[i]&&v[i+1]&&v[i+2]) return false; return true; };
      const connected=()=>{ const total=N*N-B.size; if(total===0) return false; const whites=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(!has(r,c)) whites.push([r,c]); const seen=new Set(); const st=[whites[0]]; seen.add(key(whites[0][0],whites[0][1])); while(st.length){ const [r,c]=st.pop(); for(const[dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nr=r+dr,nc=c+dc; if(nr<0||nr>=N||nc<0||nc>=N||has(nr,nc)) continue; const k=key(nr,nc); if(!seen.has(k)){ seen.add(k); st.push([nr,nc]); } } } return seen.size===total; };
      const cells=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++) cells.push([r,c]); shuffle(cells);
      const target=7+((Math.random()*4)|0);
      for(const [r,c] of cells){ if(B.size>=target) break; B.add(key(r,c)); if(!no3(r,c)||!connected()) B.delete(key(r,c)); }
      return [...B].map(k=>[Math.floor(k/N),k%N]);
    }
    fillLatin(Bset){ const g=Array.from({length:N},()=>new Array(N).fill(0)); const isB=(r,c)=>Bset.has(key(r,c));
      const ok=(r,c,v)=>{ for(let i=0;i<N;i++){ if(i!==c&&!isB(r,i)&&g[r][i]===v) return false; if(i!==r&&!isB(i,c)&&g[i][c]===v) return false; } return true; };
      const cells=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(!isB(r,c)) cells.push([r,c]);
      const fill=(pos)=>{ if(pos===cells.length) return true; const [r,c]=cells[pos]; for(const v of shuffle([1,2,3,4,5])){ if(ok(r,c,v)){ g[r][c]=v; if(fill(pos+1)) return true; g[r][c]=0; } } return false; };
      return fill(0)?g:null;
    }
    restart(){ this.stopAuto(); this.over=false; this.win=false; this._autoProgress=0; this.flash=null;
      let sol=null,num=null,Bset=null;
      for(let tries=0;tries<200;tries++){ const bl=this.genB(); const B=new Set(bl.map(([r,c])=>key(r,c))); const g=this.fillLatin(B); if(!g) continue;
        num=g.map(r=>r.slice());
        for(const [r,c] of bl){ // assign a duplicate value from a white cell in same row
          let k=-1; for(let cc=0;cc<N;cc++){ if(cc!==c&&!B.has(key(r,cc))){ k=cc; break; } }
          if(k<0) for(let rr=0;rr<N;rr++){ if(rr!==r&&!B.has(key(rr,c))){ num[r][c]=g[rr][c]; break; } } else num[r][c]=g[r][k];
        }
        sol=bl; Bset=B; break;
      }
      this.num=num; this.solBlack=new Set(Bset?sol.map(([r,c])=>key(r,c)):[]); this.black=Array.from({length:N},()=>new Array(N).fill(false));
      this.status('点格子在 白 / 黑 间切换。每行每列数字不重复、白格连通、黑格不三连。'); this.updateUI();
    }
    status(t){ statusEl.textContent=t; }
    updateUI(){ let b=0; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(this.black[r][c]) b++; progEl.textContent=b; }
    onDown(e){ if(this.autoPlay||this.over) return; const rect=canvas.getBoundingClientRect(); const x=(e.clientX-rect.left)*(this.W/rect.width), y=(e.clientY-rect.top)*(this.W/rect.width); const c=Math.floor(x/this.cell), r=Math.floor(y/this.cell); if(r<0||r>=N||c<0||c>=N) return; this.black[r][c]=!this.black[r][c]; this.flash={r,c,t:0}; this.checkWin(); this.updateUI(); }
    valid(blackSet){ const has=(r,c)=>blackSet.has(key(r,c));
      for(let r=0;r<N;r++){ const h=[has(r,0),has(r,1),has(r,2),has(r,3),has(r,4)]; for(let i=0;i<3;i++) if(h[i]&&h[i+1]&&h[i+2]) return false; }
      for(let c=0;c<N;c++){ const v=[has(0,c),has(1,c),has(2,c),has(3,c),has(4,c)]; for(let i=0;i<3;i++) if(v[i]&&v[i+1]&&v[i+2]) return false; }
      const total=N*N-blackSet.size; if(total===0) return false; const whites=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(!has(r,c)) whites.push([r,c]); const seen=new Set(); const st=[whites[0]]; seen.add(key(whites[0][0],whites[0][1])); while(st.length){ const [r,c]=st.pop(); for(const[dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nr=r+dr,nc=c+dc; if(nr<0||nr>=N||nc<0||nc>=N||has(nr,nc)) continue; const k=key(nr,nc); if(!seen.has(k)){ seen.add(k); st.push([nr,nc]); } } } if(seen.size!==total) return false;
      for(let r=0;r<N;r++){ const s=new Set(); for(let c=0;c<N;c++){ if(has(r,c)) continue; const v=this.num[r][c]; if(s.has(v)) return false; s.add(v); } if(s.size!==N) return false; }
      for(let c=0;c<N;c++){ const s=new Set(); for(let r=0;r<N;r++){ if(has(r,c)) continue; const v=this.num[r][c]; if(s.has(v)) return false; s.add(v); } if(s.size!==N) return false; }
      return true;
    }
    checkWin(){ const bs=new Set(); for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(this.black[r][c]) bs.add(key(r,c)); if(bs.size===0) return; if(this.valid(bs)){ this.over=true; this.win=true; this.best++; localStorage.setItem('hitoBest',String(this.best)); bestEl.textContent=this.best; this.status('🎉 黑白分明，解开啦！'); if(this.autoPlay) this.autoNext(); } }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this.autoStep(); }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){ clearTimeout(this.autoTimer); this.autoTimer=null; } const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    autoStep(){ if(!this.autoPlay||this.over) return; let done=false;
      for(let r=0;r<N&&!done;r++)for(let c=0;c<N&&!done;c++){ if(this.solBlack.has(key(r,c))&&!this.black[r][c]){ this.black[r][c]=true; this._autoProgress++; this.flash={r,c,t:0}; done=true; } }
      this.updateUI(); if(!done){ this.checkWin(); return; } this.autoTimer=setTimeout(()=>this.autoStep(),140);
    }
    autoNext(){ this.stopAuto(); this.restart(); this.startAuto(); }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.draw(dt); }catch(err){ console.error(err); } }
    draw(dt){
      const W=this.W,cell=this.cell; ctx.clearRect(0,0,W,W);
      if(this.flash){ this.flash.t+=dt; if(this.flash.t>0.5) this.flash=null; }
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const x=c*cell,y=r*cell; const black=this.black[r][c]; const v=this.num[r][c];
        if(black){ ctx.fillStyle='#16161f'; this.rr(x+1,y+1,cell-2,cell-2,6); ctx.fill();
          ctx.strokeStyle='#3ecf8e'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x+cell*0.32,y+cell*0.32); ctx.lineTo(x+cell*0.68,y+cell*0.68); ctx.moveTo(x+cell*0.68,y+cell*0.32); ctx.lineTo(x+cell*0.32,y+cell*0.68); ctx.stroke();
          ctx.fillStyle='#3ecf8e'; ctx.font=`bold ${cell*0.34}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(v,x+cell/2,y+cell/2);
        } else { ctx.fillStyle='#e9fbf3'; this.rr(x+1,y+1,cell-2,cell-2,6); ctx.fill(); ctx.fillStyle='#0c2a1c'; ctx.font=`bold ${cell*0.42}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(v,x+cell/2,y+cell/2); }
        if(this.flash&&this.flash.r===r&&this.flash.c===c){ ctx.save(); ctx.globalAlpha=0.5*(1-this.flash.t/0.5); ctx.strokeStyle='#fff'; ctx.lineWidth=3; this.rr(x+2,y+2,cell-4,cell-4,6); ctx.stroke(); ctx.restore(); }
      }
      ctx.strokeStyle='#ffffff22'; ctx.lineWidth=1.5;
      for(let i=0;i<=N;i++){ ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,W); ctx.moveTo(0,i*cell); ctx.lineTo(W,i*cell); ctx.stroke(); }
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Hitori();
})();
</script>
</body>
</html>
