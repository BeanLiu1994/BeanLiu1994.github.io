<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#2a1604" />
<title>霓虹竞速 · Neon Racer</title>
<style>
  :root { --bg:#2a1604; --surface:#2e1c08; --board:#1c1206; --text:#fff3e0; --muted:#c8a06f; --accent:#ff9f4d; --accent-glow:#ff9f4d55; --gold:#ffd54a; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image:radial-gradient(ellipse at 50% 0%, #3a2208 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #1c1004 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#ff9f4d,#ffd54a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:62px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:11px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:700; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#2a1604; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#2a1604; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹竞速</h1><div class="sub">N E O N &nbsp; R A C E R</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Dist</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="360" height="560"></canvas></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">Restart</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">点屏幕左/右半区变道，躲开其他车辆；距离越远分越高</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  const LANES=3;
  class Racer {
    constructor(){
      this.autoPlay=false; this._last=0; this._autoProgress=0; this.over=false; this.time=0;
      this.best=parseInt(localStorage.getItem('racerBest')||'0'); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',e=>this.onDown(e));
      this.restart(); this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const r=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(r.width||360,420)); const d=window.devicePixelRatio||1; this.W=w; this.H=w*1.55; canvas.width=w*d; canvas.height=this.H*d; ctx.setTransform(d,0,0,d,0,0); }
    laneX(i){ return this.W*(i+1)/(LANES+1); }
    restart(){ this.stopAuto(); this.over=false; this.dist=0; this.speed=200; this.lane=1; this.x=this.laneX(1); this.py=this.H-70; this.obs=[]; this.spawnT=0; this.scroll=0; }
    spawn(){ const lane=Math.floor(Math.random()*LANES); const cols=['#ff5d6a','#4d9fff','#b06bff','#4dff91','#ff6bd0']; this.obs.push({lane,y:-50,col:cols[Math.floor(Math.random()*cols.length)]}); }
    autoControl(){ const clear=new Array(LANES).fill(1e9);
      for(const o of this.obs){ const ahead=o.y-this.py; if(ahead>-30) clear[o.lane]=Math.min(clear[o.lane],ahead); }
      let best=this.lane, bestv=-1e9; for(let l=0;l<LANES;l++){ const prefer=(l===this.lane)?60:0; if(clear[l]+prefer>bestv){ bestv=clear[l]+prefer; best=l; } }
      this.lane=best; this.targetX=this.laneX(best); }
    update(dt){ if(this.over) return; this.time+=dt; this.speed=200+Math.min(this.dist*0.01,260); this.dist+=this.speed*dt; this.scroll=(this.scroll+this.speed*dt)%40;
      if(!this.autoPlay) this.targetX=this.laneX(this.lane);
      this.x+=(this.targetX-this.x)*Math.min(1,dt*12);
      this.spawnT-=dt; if(this.spawnT<=0){ this.spawn(); this.spawnT=Math.max(0.5,1.0-this.dist*0.0002)+Math.random()*0.4; }
      for(const o of this.obs) o.y+=this.speed*dt; this.obs=this.obs.filter(o=>o.y<this.H+60);
      for(const o of this.obs){ if(o.lane===this.lane && Math.abs(o.y-this.py)<46){ this.crash(); break; } }
      if(this.autoPlay) this.autoControl();
      scoreEl.textContent=Math.floor(this.dist/10); }
    crash(){ this.over=true; const d=Math.floor(this.dist/10); if(d>this.best){ this.best=d; localStorage.setItem('racerBest',String(this.best)); bestEl.textContent=this.best; } statusEl.textContent='💥 撞车！距离 '+d; if(this.autoPlay) this._autoNext(); }
    _autoNext(){ this.stopAuto(); this.restart(); this.startAuto(); }
    onDown(e){ e.preventDefault(); if(this.over||this.autoPlay) return; const r=canvas.getBoundingClientRect(); const x=e.clientX-r.left; this.lane=(x<this.W/2)?Math.max(0,this.lane-1):Math.min(LANES-1,this.lane+1); this.targetX=this.laneX(this.lane); }
    draw(){ const W=this.W,H=this.H; ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#0e0a04'; ctx.fillRect(W*0.18,0,W*0.64,H);
      ctx.strokeStyle='#ff9f4d55'; ctx.lineWidth=3; ctx.setLineDash([18,22]); ctx.lineDashOffset=-this.scroll;
      for(let l=1;l<LANES;l++){ const x=this.laneX(l)-this.W/(LANES+1)*0+ (W*0.18 + (W*0.64)*l/LANES); ctx.beginPath(); ctx.moveTo(this.laneX(l),0); ctx.lineTo(this.laneX(l),H); ctx.stroke(); }
      ctx.setLineDash([]);
      const cw=W*0.13, ch=H*0.11;
      for(const o of this.obs){ const x=this.laneX(o.lane); this.car(x,o.y,cw,ch,o.col); }
      this.car(this.x,this.py,cw,ch,'#ff9f4d',true);
      ctx.fillStyle='#fff3e0'; ctx.font='bold 14px Segoe UI'; ctx.textAlign='left'; ctx.fillText('Dist '+Math.floor(this.dist/10), 8, 20);
      if(this.over){ ctx.save(); ctx.shadowColor='#ff5d6a'; ctx.shadowBlur=18; ctx.fillStyle='#ff5d6a'; ctx.font='bold '+(W*0.09)+'px Segoe UI'; ctx.textAlign='center'; ctx.fillText('GAME OVER', W/2, H/2); ctx.restore(); }
    }
    car(x,y,w,h,col,player){ ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=player?16:10; ctx.fillStyle=col; this.rr(x-w/2,y-h/2,w,h,8); ctx.fill(); ctx.shadowBlur=0; ctx.fillStyle='#00000040'; this.rr(x-w/2+3,y-h/2+3,w-6,h*0.4,5); ctx.fill(); ctx.restore(); }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; if(this.autoPlay) this._autoProgress=Math.floor(this.dist/10); this.update(dt); this.draw(); }catch(err){ console.error(err); } }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this._autoProgress=0; this.targetX=this.laneX(this.lane); }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
  }
  window.game=new Racer();
})();
</script>
</body>
</html>
