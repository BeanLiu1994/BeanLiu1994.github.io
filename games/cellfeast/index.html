<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#04121f" />
<title>细胞盛宴 · Cell Feast</title>
<style>
  :root { --bg:#04121f; --surface:#0a1c30; --board:#071626; --text:#e6f4ff; --muted:#6c93b8; --accent:#4d9fff; --accent-glow:#4d9fff55; --gold:#ffd700; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image:radial-gradient(ellipse at 50% 50%, #0c2a48 0%, transparent 65%); color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,var(--accent),#a6d4ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 12px; text-align:center; min-width:58px; }
  .score-card .label { font-size:0.52rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1.05rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#04121fee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; padding:20px; }
  .overlay-content h2 { font-size:2rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:16px; font-size:0.9rem; }
  .overlay.lose h2 { color:var(--red); }
  .overlay.win h2 { color:var(--accent); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:11px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:700; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; }
  .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#04121f; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#04121f; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:20px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:blink .8s infinite; }
  @keyframes blink { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>细胞盛宴</h1>
      <div class="sub">C E L L &nbsp; F E A S T</div>
    </div>
    <div class="score-panel">
      <div class="score-card"><div class="label">质量</div><div class="value" id="score">18</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">18</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="game" width="420" height="420"></canvas>
    <div class="overlay lose" id="overlay-lose">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2>被吞噬了!</h2>
        <p id="lose-msg">质量太小</p>
        <button class="btn primary" onclick="game.restart()">再来一局</button>
      </div>
    </div>
    <div class="overlay win" id="overlay-win">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2>称霸竞技场!</h2>
        <p id="win-msg">质量达标</p>
        <button class="btn primary" onclick="game.restart()">再来一局</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">新游戏</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">自动: 关</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none">
    <div class="ai-dot"></div><span id="ai-status">AI 觅食中…</span>
  </div>
  <div class="status" id="status">拖动屏幕控制移动，吃掉光点和更小的细胞来成长</div>
</div>
<script>
(function(){
  'use strict';
  const PAL=['#ff5d6a','#4d9fff','#4dff91','#ffd23f','#b06bff','#ff8a3d','#4dffd0'];
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
  const statusEl=document.getElementById('status');
  const overlayLose=document.getElementById('overlay-lose'), loseMsg=document.getElementById('lose-msg');
  const overlayWin=document.getElementById('overlay-win'), winMsg=document.getElementById('win-msg');
  const aiInd=document.getElementById('ai-indicator'), aiStatus=document.getElementById('ai-status');
  const rand=(a,b)=>a+Math.random()*(b-a);
  function eyes(x,y,r,ang){
    const ex=Math.cos(ang), ey=Math.sin(ang); const ox=-ey, oy=ex;
    for(const s of [-1,1]){ const px=x+ex*r*0.32+ox*r*0.34*s, py=y+ey*r*0.32+oy*r*0.34*s;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px,py,r*0.2,0,7); ctx.fill();
      ctx.fillStyle='#13315c'; ctx.beginPath(); ctx.arc(px+ex*r*0.06,py+ey*r*0.06,r*0.1,0,7); ctx.fill(); }
  }
  class Feast {
    constructor(){
      this.autoPlay=false; this.over=false; this.win=false; this.time=0;
      this.best=parseInt(localStorage.getItem('feastBest')||'18'); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      this.bindInput();
      this.restart(); this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const r=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(r.width||420,440)); const d=window.devicePixelRatio||1; this.W=w; this.H=w; canvas.width=w*d; canvas.height=w*d; ctx.setTransform(d,0,0,d,0,0); this.cx=w/2; this.cy=w/2; this.A=w*0.46; }
    spawnFood(){ const a=Math.random()*6.28, rr2=Math.sqrt(Math.random())*this.A*0.96; return {x:this.cx+Math.cos(a)*rr2, y:this.cy+Math.sin(a)*rr2, r:rand(4,6), color:PAL[Math.floor(Math.random()*PAL.length)]}; }
    spawnBot(maxr){ const a=Math.random()*6.28, rr2=Math.sqrt(Math.random())*this.A*0.9; return {x:this.cx+Math.cos(a)*rr2, y:this.cy+Math.sin(a)*rr2, r:rand(12,Math.min(40,maxr||34)), color:PAL[Math.floor(Math.random()*PAL.length)], name:['菌','藻','噬','孢','芽'][Math.floor(Math.random()*5)]}; }
    restart(){
      this.stopAuto(); this.over=false; this.win=false; this.player={x:this.cx,y:this.cy,r:18,dx:0,dy:0,color:'#4d9fff'};
      this.food=[]; for(let i=0;i<46;i++) this.food.push(this.spawnFood());
      this.bots=[]; for(let i=0;i<5;i++) this.bots.push(this.spawnBot(this.player.r*0.9));
      this.tx=this.cx; this.ty=this.cy; this.pointerDown=false; this.autoTarget=null;
      overlayLose.classList.remove('active'); overlayWin.classList.remove('active');
      scoreEl.textContent='18';
    }
    clamp(e){ const dx=e.x-this.cx, dy=e.y-this.cy; const d=Math.hypot(dx,dy); const lim=this.A-e.r; if(d>lim){ e.x=this.cx+dx/d*lim; e.y=this.cy+dy/d*lim; } }
    speed(r){ return 235/(1+r*0.02); }
    aiDir(){
      const p=this.player; let bx=0,by=0,bd=1e9;
      for(const b of this.bots){ if(b.r>p.r*1.1){ const d=Math.hypot(b.x-p.x,b.y-p.y); if(d<bd){ bd=d; bx=b.x; by=b.y; } } }
      if(bd < p.r*2+90){ const dx=p.x-bx, dy=p.y-by, d=Math.hypot(dx,dy)||1; return {x:dx/d,y:dy/d, flee:true}; }
      let tx=null,ty=null,td=1e9, eatBot=null;
      for(const b of this.bots){ if(p.r>b.r*1.1){ const d=Math.hypot(b.x-p.x,b.y-p.y); if(d<td){ td=d; tx=b.x; ty=b.y; eatBot=b; } } }
      if(eatBot && td<p.r*3+40){ return {x:(tx-p.x), y:(ty-p.y), eat:true}; }
      let fx=null,fy=null,fd=1e9;
      for(const f of this.food){ const d=Math.hypot(f.x-p.x,f.y-p.y); if(d<fd){ fd=d; fx=f.x; fy=f.y; } }
      if(fx!=null){ const dx=fx-p.x, dy=fy-p.y, d=Math.hypot(dx,dy)||1; return {x:dx/d,y:dy/d, food:true}; }
      return {x:0,y:0};
    }
    update(dt){
      if(this.over||this.win) return; this.time+=dt;
      const p=this.player; let dirx=0,diry=0;
      if(this.autoPlay){ const a=this.aiDir(); dirx=a.x; diry=a.y; this.autoTarget=a; aiStatus.textContent= a.flee?'AI 躲避大体细胞…':(a.eat?'AI 追捕小细胞…':'AI 觅食中…'); }
      else { const dx=this.tx-p.x, dy=this.ty-p.y, d=Math.hypot(dx,dy); if(d>2){ dirx=dx/d; diry=dy/d; } }
      const sp=this.speed(p.r); p.x+=dirx*sp*dt; p.y+=diry*sp*dt; this.clamp(p);
      const pang=Math.atan2(diry||p.dy, dirx||p.dx); p.dx=dirx; p.dy=diry;
      for(const b of this.bots){
        let dx=0,dy=0, threat=false;
        if(p.r>b.r*1.1 && Math.hypot(b.x-p.x,b.y-p.y)<b.r*3+50){ dx=p.x-b.x; dy=p.y-b.y; threat=true; }
        else { let fx=null,fy=null,fd=1e9; for(const f of this.food){ const d=Math.hypot(f.x-b.x,f.y-b.y); if(d<fd){ fd=d; fx=f.x; fy=f.y; } } if(fx!=null){ dx=fx-b.x; dy=fy-b.y; } }
        const d=Math.hypot(dx,dy)||1; const bs=this.speed(b.r); b.x+=dx/d*bs*dt; b.y+=dy/d*bs*dt; this.clamp(b);
      }
      // eating food (player)
      for(let i=this.food.length-1;i>=0;i--){ const f=this.food[i]; if(Math.hypot(f.x-p.x,f.y-p.y)<p.r){ p.r=Math.min(90,p.r+0.6); this.food.splice(i,1); this.food.push(this.spawnFood()); } }
      // bots eat food
      for(const b of this.bots){ for(let i=this.food.length-1;i>=0;i--){ const f=this.food[i]; if(Math.hypot(f.x-b.x,f.y-b.y)<b.r){ b.r=Math.min(48,b.r+0.5); this.food.splice(i,1); this.food.push(this.spawnFood()); } } }
      // player vs bots
      for(let i=this.bots.length-1;i>=0;i--){ const b=this.bots[i]; const d=Math.hypot(b.x-p.x,b.y-p.y);
        if(p.r>b.r*1.1 && d<p.r){ p.r=Math.min(90,p.r+b.r*0.5); this.bots.splice(i,1); this.bots.push(this.spawnBot(p.r*0.8)); scoreEl.textContent=Math.floor(p.r); }
        else if(b.r>p.r*1.1 && d<b.r){ p.r*=0.7; const ang=Math.atan2(p.y-b.y,p.x-b.x); p.x+=Math.cos(ang)*20; p.y+=Math.sin(ang)*20; this.clamp(p);
          if(p.r<10){ this.caught(); return; } scoreEl.textContent=Math.floor(p.r); }
      }
      if(Math.floor(p.r)>this.best){ this.best=Math.floor(p.r); localStorage.setItem('feastBest',String(this.best)); bestEl.textContent=this.best; }
      if(p.r>=70){ this.victory(); }
    }
    caught(){ this.over=true; loseMsg.textContent='质量降至 '+Math.floor(this.player.r); overlayLose.classList.add('active'); if(this.autoPlay) setTimeout(()=>{ if(this.autoPlay) this.restart(); },1100); }
    victory(){ this.win=true; winMsg.textContent='最终质量 '+Math.floor(this.player.r); overlayWin.classList.add('active'); if(this.autoPlay) setTimeout(()=>{ if(this.autoPlay) this.restart(); },1200); }
    bindInput(){
      const setT=e=>{ const r=canvas.getBoundingClientRect(); this.tx=(e.clientX-r.left)*(this.W/r.width); this.ty=(e.clientY-r.top)*(this.H/r.height); };
      canvas.addEventListener('pointerdown',e=>{ e.preventDefault(); if(this.autoPlay||this.over||this.win) return; this.pointerDown=true; setT(e); });
      canvas.addEventListener('pointermove',e=>{ if(this.pointerDown && !this.autoPlay){ e.preventDefault(); setT(e); } });
      const up=()=>{ this.pointerDown=false; };
      canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
      document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
    }
    cell(e,ang){
      ctx.save(); ctx.shadowColor=e.color; ctx.shadowBlur=14; ctx.fillStyle=e.color; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,7); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='#ffffff22'; ctx.beginPath(); ctx.arc(e.x-e.r*0.25,e.y-e.r*0.25,e.r*0.5,0,7); ctx.fill();
      ctx.restore(); eyes(e.x,e.y,e.r,ang);
      if(e.name){ ctx.fillStyle='#ffffffcc'; ctx.font='bold '+Math.max(9,e.r*0.42)+'px Segoe UI'; ctx.textAlign='center'; ctx.fillText(e.name,e.x,e.y+e.r+12); }
    }
    draw(){
      const W=this.W,H=this.H; ctx.clearRect(0,0,W,H);
      ctx.save(); ctx.beginPath(); ctx.arc(this.cx,this.cy,this.A,0,7); ctx.clip();
      ctx.fillStyle='#071626'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='#ffffff10'; ctx.lineWidth=1; for(let gx=this.cx-this.A; gx<this.cx+this.A; gx+=28){ ctx.beginPath(); ctx.moveTo(gx,this.cy-this.A); ctx.lineTo(gx,this.cy+this.A); ctx.stroke(); }
      for(let gy=this.cy-this.A; gy<this.cy+this.A; gy+=28){ ctx.beginPath(); ctx.moveTo(this.cx-this.A,gy); ctx.lineTo(this.cx+this.A,gy); ctx.stroke(); }
      for(const f of this.food){ ctx.save(); ctx.shadowColor=f.color; ctx.shadowBlur=8; ctx.fillStyle=f.color; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill(); ctx.restore(); }
      ctx.restore();
      ctx.save(); ctx.strokeStyle='#4d9fff'; ctx.lineWidth=3; ctx.shadowColor='#4d9fff'; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(this.cx,this.cy,this.A,0,7); ctx.stroke(); ctx.restore();
      if(this.autoPlay && this.autoTarget && this.autoTarget.x!==0){ const p=this.player; const tx=p.x+this.autoTarget.x*60, ty=p.y+this.autoTarget.y*60; ctx.strokeStyle=this.autoTarget.flee?'#ff5d6a':'#4dff91'; ctx.lineWidth=2; ctx.globalAlpha=0.5+0.4*Math.sin(this.time*6); ctx.beginPath(); ctx.arc(tx,ty,10,0,7); ctx.stroke(); ctx.globalAlpha=1; }
      for(const b of this.bots) this.cell(b,Math.atan2(b.dy||0,b.dx||0));
      const p=this.player; const ang=Math.atan2(p.dy,p.dx); this.cell(p,ang);
      ctx.fillStyle='#e6f4ff'; ctx.font='bold '+Math.round(W*0.045)+'px Segoe UI'; ctx.textAlign='left'; ctx.fillText('质量 '+Math.floor(p.r),10,24);
    }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.update(dt); this.draw(); }catch(err){ console.error(err); } }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over||this.win) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='自动: 开'; b.classList.add('auto-on'); aiInd.style.display='flex'; this.autoTarget=null; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='自动: 关'; b.classList.remove('auto-on'); aiInd.style.display='none'; }
  }
  window.game=new Feast();
})();
</script>
</body>
</html>
