<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#05060f" />
<title>Defender · Neon</title>
<style>
  :root{
    --bg:#05060f; --surface:#0e1124; --text:#e8ecff; --muted:#7d86b8;
    --accent:#34f5ff; --accent2:#9b6bff; --danger:#ff4d7d; --gold:#ffd166; --ok:#4dff91;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 20% 0%, #18215a 0%, transparent 55%), radial-gradient(ellipse at 90% 100%, #3a1150 0%, transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:480px;height:100vh;max-height:860px;display:flex;flex-direction:column;padding:12px;gap:10px;}
  .header{display:flex;align-items:center;justify-content:space-between;}
  .title-block h1{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff10;border-radius:10px;padding:6px 12px;text-align:center;min-width:54px;}
  .score-card .label{font-size:.5rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.best .value{color:var(--gold);}
  .score-card.wave .value{color:var(--accent);}
  .board-wrap{position:relative;flex:1;min-height:0;background:var(--surface);border:1px solid #ffffff10;border-radius:16px;overflow:hidden;box-shadow:0 0 50px #00000040,0 0 70px #34f5ff1a;}
  .board-wrap, .board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:100%;}
  .controls{display:flex;gap:8px;}
  .btn{flex:1;min-width:80px;padding:11px 14px;border:1px solid #ffffff14;border-radius:11px;background:var(--surface);color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .18s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff12;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#051018;}
  .btn.primary:hover{box-shadow:0 0 22px #34f5ff55;}
  .btn.auto-on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#051018;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 6px #34f5ff44;}50%{box-shadow:0 0 20px #34f5ff88,0 0 38px #9b6bff55;}}
  .ai-indicator{display:none;align-items:center;gap:8px;justify-content:center;font-size:.72rem;color:var(--muted);min-height:18px;}
  .ai-indicator.show{display:flex;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.7);}}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:5;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#05060fdd;backdrop-filter:blur(5px);}
  .overlay-content{position:relative;text-align:center;z-index:1;padding:20px;}
  .overlay-content h2{font-size:2rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay-content p{color:var(--muted);margin-bottom:14px;font-size:.85rem;}
  .hint{text-align:center;font-size:.64rem;color:var(--muted);line-height:1.5;}
  @media (max-width:400px){.title-block h1{font-size:1.3rem;}.btn{padding:10px;font-size:.76rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Defender</h1><div class="sub">S T A R   P A T R O L</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card wave"><div class="label">Wave</div><div class="value" id="wave">1</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay-over">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2>任务失败</h2>
        <p id="over-msg">战机被击毁</p>
        <button class="btn primary" id="btn-again" style="min-width:140px;">再来一局</button>
      </div>
    </div>
  </div>
  <div class="ai-indicator" id="ai-indicator"><span class="ai-dot"></span><span id="ai-status">AI 自动巡逻中…</span></div>
  <div class="controls">
    <button class="btn primary" id="btn-auto">自动游玩</button>
    <button class="btn" id="btn-restart">重开</button>
  </div>
  <div class="hint">拖动战机上下移动并自动开火 · 击落来犯敌机、躲避弹幕 · 清完一波进入下一波</div>
</div>
<script>
(function(){
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), waveEl=document.getElementById('wave'), bestEl=document.getElementById('best');
  const overlay=document.getElementById('overlay-over'), overMsg=document.getElementById('over-msg');
  const btnAuto=document.getElementById('btn-auto'), btnRestart=document.getElementById('btn-restart'), btnAgain=document.getElementById('btn-again');
  const aiInd=document.getElementById('ai-indicator'), aiStatus=document.getElementById('ai-status');

  const rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

  class Defender{
    constructor(){
      this.autoPlay=false; this.over=false;
      this.best=parseInt(localStorage.getItem('defenderBest')||'0',10); bestEl.textContent=this.best;
      this.stars=[];
      this.fit(); window.addEventListener('resize',()=>this.fit());
      this.bindInput(); this.newGame();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){
      const r=canvas.getBoundingClientRect();
      this.W=Math.max(320,Math.min(r.width||420,480)); this.H=Math.max(360,Math.min(r.height||600,820));
      const d=window.devicePixelRatio||1; canvas.width=this.W*d; canvas.height=this.H*d; ctx.setTransform(d,0,0,d,0,0);
      this.makeStars();
    }
    makeStars(){ this.stars=[]; const n=Math.floor(this.W*this.H/5200); for(let i=0;i<n;i++) this.stars.push({x:Math.random()*this.W,y:Math.random()*this.H,z:rand(0.3,1)}); }
    newGame(){
      this.over=false; this.score=0; this.wave=1; this.kills=0; this.quota=8;
      this.lives=3; this.iframe=0; this.autoShield=false;
      this.sx=this.W*0.16; this.sy=this.H*0.5; this.svx=0; this.svy=0;
      this.bullets=[]; this.ebullets=[]; this.enemies=[]; this.parts=[]; this.pews=[];
      this.fireCD=0; this.spawnCD=0.6; this.shieldFlash=0; this.t=0;
      scoreEl.textContent=0; waveEl.textContent=1;
      overlay.classList.remove('active'); this.updateUI();
    }
    spawnEnemy(){
      const shooter = this.kills>3 && Math.random()<0.34;
      const y=rand(30,this.H-30);
      this.enemies.push({x:this.W+24,y,vy:rand(-30,30),sp:rand(52,72)+this.wave*7,r:14,shooter,fireCD:rand(0.6,1.6),hue:rand(0,360),ph:Math.random()*6.28});
    }
    fire(){ if(this.fireCD>0) return; this.fireCD=0.16; this.bullets.push({x:this.sx+18,y:this.sy,vx:560,r:3}); this.pews.push({x:this.sx+18,y:this.sy,t:0}); }
    hitShip(){
      if(this.iframe>0||this.autoShield){ if(this.autoShield){ this.shieldFlash=0.3; } return; }
      this.lives--; this.iframe=1.1; this.shieldFlash=0.3;
      for(let i=0;i<18;i++) this.parts.push({x:this.sx,y:this.sy,vx:rand(-180,180),vy:rand(-180,180),life:rand(0.3,0.7),c:'#ff4d7d'});
      if(this.lives<=0) this.gameOver();
    }
    gameOver(){
      this.over=true;
      if(this.score>this.best){ this.best=this.score; localStorage.setItem('defenderBest',this.best); bestEl.textContent=this.best; }
      overMsg.textContent='得分 '+this.score+' · 抵达第 '+this.wave+' 波';
      overlay.classList.add('active');
      if(this.autoPlay) this.autoTimer=setTimeout(()=>{ this.stopAuto(); this.newGame(); this.startAuto(); }, 1700);
    }
    // ---- AI ----
    autoThink(){
      // pick nearest enemy to the right of the ship
      let tgt=null,best=1e9;
      for(const e of this.enemies){ const dx=e.x-this.sx; if(dx< -10) continue; const d=Math.abs(e.y-this.sy)+dx*0.4; if(d<best){best=d;tgt=e;} }
      let desiredY=this.sy;
      // dodge incoming enemy bullets first
      let threat=null,td=1e9;
      for(const b of this.ebullets){ const d=Math.hypot(b.x-this.sx,b.y-this.sy); if(d<td && b.x>this.sx-10){td=d;threat=b;} }
      // also dodge close enemies
      for(const e of this.enemies){ const d=Math.hypot(e.x-this.sx,e.y-this.sy); if(d<td && e.x>this.sx-6){td=d;threat={x:e.x,y:e.y};} }
      if(threat && td<70){ desiredY = this.sy + (this.sy>=threat.y? 1:-1)* (90); }
      else if(tgt){ desiredY = tgt.y; }
      desiredY=clamp(desiredY,24,this.H-24);
      // move toward desiredY with max speed
      const v=clamp((desiredY-this.sy)*6,-300,300);
      this.sy=clamp(this.sy+v*(1/60),24,this.H-24);
      // keep ship on left side
      this.sx=clamp(this.sx+( (this.W*0.16)-this.sx)*4*(1/60), 20, this.W*0.46);
      // fire when aligned with a target in lane
      if(tgt){ const dx=tgt.x-this.sx; if(dx>0 && dx<this.W && Math.abs(tgt.y-this.sy)<16) this.fire(); }
      else if(this.fireCD<=0 && Math.random()<0.3) this.fire();
    }
    update(dt){
      this.t+=dt;
      // parallax stars (sense of flight)
      for(const s of this.stars){ s.x -= (20+s.z*70)*dt; if(s.x<0){ s.x=this.W; s.y=Math.random()*this.H; } }
      if(this.over) return;
      if(this.iframe>0) this.iframe-=dt;
      if(this.shieldFlash>0) this.shieldFlash-=dt;
      if(this.autoPlay) this.autoThink();

      // ship manual easing handled by pointer; auto moves directly
      this.fireCD-=dt;

      // spawn
      this.spawnCD-=dt;
      if(this.spawnCD<=0){ this.spawnEnemy(); this.spawnCD=clamp(0.95-this.wave*0.04,0.42,0.95); }

      // player bullets
      for(let i=this.bullets.length-1;i>=0;i--){ const b=this.bullets[i]; b.x+=b.vx*dt; if(b.x>this.W+20) this.bullets.splice(i,1); }
      // enemy bullets
      for(let i=this.ebullets.length-1;i>=0;i--){ const b=this.ebullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
        if(Math.hypot(b.x-this.sx,b.y-this.sy)<b.r+12){ this.hitShip(); this.ebullets.splice(i,1); continue; }
        if(b.x<-20) this.ebullets.splice(i,1);
      }
      // enemies
      for(let i=this.enemies.length-1;i>=0;i--){ const e=this.enemies[i]; e.x-=e.sp*dt; e.y+=Math.sin(this.t*1.5+e.ph)*e.vy*dt; e.y=clamp(e.y,20,this.H-20);
        // shoot
        if(e.shooter){ e.fireCD-=dt; if(e.fireCD<=0 && e.x<this.W-10 && e.x>this.sx){ e.fireCD=rand(1.1,2.0); const dx=this.sx-e.x,dy=this.sy-e.y,d=Math.hypot(dx,dy)||1; this.ebullets.push({x:e.x,y:e.y,vx:dx/d*300,vy:dy/d*300,r:4}); } }
        // collide ship
        if(Math.hypot(e.x-this.sx,e.y-this.sy)<e.r+12){ this.hitShip(); this.enemies.splice(i,1); this.kills++; this.addScore(5); continue; }
        // collide bullets
        let dead=false;
        for(let j=this.bullets.length-1;j>=0;j--){ const b=this.bullets[j]; if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){ this.bullets.splice(j,1); dead=true; break; } }
        if(dead){ this.enemies.splice(i,1); this.kills++; this.addScore(10); for(let k=0;k<12;k++) this.parts.push({x:e.x,y:e.y,vx:rand(-160,160),vy:rand(-160,160),life:rand(0.3,0.6),c:'hsl('+e.hue+',90%,65%)'}); continue; }
        if(e.x<-30) this.enemies.splice(i,1);
      }
      // particles
      for(let i=this.parts.length-1;i>=0;i--){ const p=this.parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.96; p.vy*=0.96; p.life-=dt; if(p.life<=0) this.parts.splice(i,1); }
      for(let i=this.pews.length-1;i>=0;i--){ this.pews[i].t+=dt; if(this.pews[i].t>0.18) this.pews.splice(i,1); }
      // wave advance
      if(this.kills>=this.quota){ this.wave++; this.quota+=3; this.addScore(50); waveEl.textContent=this.wave; this.spawnCD=0.3; }
    }
    addScore(n){ this.score+=n; scoreEl.textContent=this.score; if(this.score>this.best){ this.best=this.score; bestEl.textContent=this.best; } }
    draw(){
      ctx.clearRect(0,0,this.W,this.H);
      // stars
      for(const s of this.stars){ ctx.globalAlpha=0.3+s.z*0.7; ctx.fillStyle='#9fb4ff'; ctx.fillRect(s.x,s.y,s.z*1.6,s.z*1.6); }
      ctx.globalAlpha=1;
      // enemy bullets
      for(const b of this.ebullets){ ctx.fillStyle='#ff7da6'; ctx.shadowColor='#ff4d7d'; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); }
      ctx.shadowBlur=0;
      // player bullets
      ctx.strokeStyle='#34f5ff'; ctx.lineWidth=3; ctx.shadowColor='#34f5ff'; ctx.shadowBlur=12;
      for(const b of this.bullets){ ctx.beginPath(); ctx.moveTo(b.x-b.r*2,b.y); ctx.lineTo(b.x+b.r*2,b.y); ctx.stroke(); }
      ctx.shadowBlur=0;
      // enemies
      for(const e of this.enemies){ ctx.save(); ctx.translate(e.x,e.y); ctx.shadowColor='hsl('+e.hue+',90%,60%)'; ctx.shadowBlur=14;
        ctx.fillStyle='hsl('+e.hue+',85%,60%)';
        ctx.beginPath(); ctx.moveTo(-e.r,0); ctx.lineTo(0,-e.r*0.8); ctx.lineTo(e.r,0); ctx.lineTo(0,e.r*0.8); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-2,0,2.4,0,7); ctx.fill(); ctx.restore(); }
      ctx.shadowBlur=0;
      // ship
      ctx.save(); ctx.translate(this.sx,this.sy);
      if(this.iframe>0 && Math.floor(this.t*20)%2===0) ctx.globalAlpha=0.4;
      ctx.shadowColor='#34f5ff'; ctx.shadowBlur=16;
      const g=ctx.createLinearGradient(-16,0,20,0); g.addColorStop(0,'#9b6bff'); g.addColorStop(1,'#34f5ff');
      ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(-14,-11); ctx.lineTo(-7,0); ctx.lineTo(-14,11); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(2,0,3,0,7); ctx.fill(); ctx.restore();
      // shield
      if(this.autoShield||this.shieldFlash>0){ ctx.strokeStyle=this.autoShield?'rgba(52,245,255,0.5)':'rgba(255,77,125,0.7)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(this.sx,this.sy,22,0,7); ctx.stroke(); }
      ctx.globalAlpha=1; ctx.shadowBlur=0;
      // particles
      for(const p of this.parts){ ctx.globalAlpha=Math.max(0,p.life*1.6); ctx.fillStyle=p.c; ctx.fillRect(p.x-2,p.y-2,4,4); }
      ctx.globalAlpha=1;
      // AI indicator on ship
      if(this.autoPlay){ ctx.fillStyle='rgba(52,245,255,0.9)'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText('AI',this.sx,this.sy-26); }
    }
    loop(ts){
      if(!this._last) this._last=ts;
      const dt=Math.min(0.05,(ts-this._last)/1000||0.016); this._last=ts;
      try{ this.update(dt); this.draw(); }catch(e){}
      requestAnimationFrame(this.loop);
    }
    updateUI(){ if(this.autoPlay) aiStatus.textContent='AI · 第 '+this.wave+' 波 · 得分 '+this.score; }
    startAuto(){ this.autoPlay=true; this.autoShield=true; btnAuto.textContent='自动中…'; btnAuto.classList.add('auto-on'); aiInd.classList.add('show'); this.updateUI(); }
    stopAuto(){ this.autoPlay=false; this.autoShield=false; btnAuto.textContent='自动游玩'; btnAuto.classList.remove('auto-on'); aiInd.classList.remove('show'); if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.newGame(); this.startAuto(); } }
    bindInput(){
      const rectXY=(e)=>{ const t=e.touches&&e.touches[0]?e.touches[0]:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e); const r=canvas.getBoundingClientRect(); return {x:(t.clientX-r.left)/r.width*this.W, y:(t.clientY-r.top)/r.height*this.H}; };
      let dragging=false;
      const onMove=(e)=>{ if(this.autoPlay) return; const {x,y}=rectXY(e); this.sy=clamp(y,24,this.H-24); this.sx=clamp(x,20,this.W*0.6); if(e.cancelable) e.preventDefault(); };
      const onDown=(e)=>{ if(this.autoPlay) return; dragging=true; onMove(e); this.fire(); };
      const onUp=()=>{ dragging=false; };
      canvas.addEventListener('pointerdown',onDown); canvas.addEventListener('pointermove',onMove);
      window.addEventListener('pointerup',onUp);
      canvas.addEventListener('touchstart',onDown,{passive:false}); canvas.addEventListener('touchmove',onMove,{passive:false}); window.addEventListener('touchend',onUp);
    }
  }
  window.game=new Defender();
  btnAuto.addEventListener('click',()=>game.toggleAuto());
  btnRestart.addEventListener('click',()=>game.newGame());
  btnAgain.addEventListener('click',()=>game.newGame());
})();
</script>
</body>
</html>
