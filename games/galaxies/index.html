<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#070b1c" />
<title>霓虹星域 · Neon Galaxies</title>
<style>
  :root{
    --bg:#070b1c; --surface:#101830; --text:#eaf2ff; --muted:#7e90b3;
    --accent:#7c5cff; --accent2:#46e0ff; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#7c5cff55; --dim:#243352;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #1a2244 0%, transparent 60%),
                     radial-gradient(ellipse at 50% 100%, #1a0f30 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:460px;padding:12px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .title-block h1{font-size:1.4rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:54px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.t .value{color:var(--accent);}
  .score-card.p .value{color:var(--accent2);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:var(--board,#070e1e);}
  .toolbar{display:flex;gap:8px;margin-top:10px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  button.ghost{background:transparent;}
  .hint{text-align:center;color:var(--muted);font-size:0.72rem;margin-top:8px;line-height:1.5;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.7rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay p{color:var(--muted);font-size:0.9rem;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>霓虹星域 · NEON GALAXIES</h1>
      <div class="sub">Symmetry · Partition</div>
    </div>
    <div class="score-panel">
      <div class="score-card t"><div class="label">星核</div><div class="value" id="centers">0</div></div>
      <div class="score-card p"><div class="label">星墙</div><div class="value" id="walls">0</div></div>
      <div class="score-card"><div class="label">最佳</div><div class="value" id="best">–</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">AUTO</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">胜利！</h2>
      <p id="ovText"></p>
      <button class="auto on" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="auto" id="autoBtn">自动游玩</button>
    <button class="ghost" id="restartBtn">重开</button>
  </div>
  <div class="hint">点按格子之间的<b>边界</b>画/擦星墙，把星域划分成各自含一个<b>星核</b>且关于星核<b>中心对称</b>的区域 · 自动模式演示解法</div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const cv=$('cv'), elCenters=$('centers'), elWalls=$('walls'), elBest=$('best'),
        elBadge=$('badge'), elOverlay=$('overlay'), elOvTitle=$('ovTitle'), elOvText=$('ovText'),
        btnAuto=$('autoBtn'), btnRestart=$('restartBtn'), btnOv=$('ovBtn');

  const G=8, W=420, H=420, PAD=14, CELL=(W-2*PAD)/G;
  let dpr=Math.min(2,(typeof devicePixelRatio!=='undefined'?devicePixelRatio||1:1));
  function setupCanvas(){
    if(!cv||!cv.getContext) return;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px'; cv.style.maxWidth='100%';
  }
  setupCanvas();
  const ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;

  function ekey(r1,c1,r2,c2){ const a=r1+','+c1, b=r2+','+c2; return a<b?a+'|'+b:b+'|'+a; }
  function parseKey(k){ const p=k.split('|'); return [p[0], p[1]]; }
  function inb(r,c){ return r>=0&&c>=0&&r<G&&c<G; }
  function idx(r,c){ return r*G+c; }

  // ---- generate a valid galaxies partition (each region point-symmetric about its center) ----
  function genRegions(){
    const reg=new Array(G*G).fill(-1);
    const ctr=[]; // centers {r,c}
    function reflect(cell,C){ return {r:2*C.r-cell.r, c:2*C.c-cell.c}; }
    let remaining=G*G;
    while(remaining>0){
      // pick an unassigned cell farthest from existing centers -> spread regions
      let best=-1,bestD=-1;
      for(let r=0;r<G;r++)for(let c=0;c<G;c++){
        if(reg[idx(r,c)]!==-1) continue;
        let d=Infinity;
        for(const C of ctr){ const dd=Math.abs(C.r-r)+Math.abs(C.c-c); if(dd<d)d=dd; }
        if(d>bestD){ bestD=d; best=idx(r,c); }
      }
      const cr=Math.floor(best/G), cc=best%G;
      const C={r:cr,c:cc};
      const id=ctr.length; ctr.push(C);
      reg[best]=id; remaining--;
      // grow region symmetrically
      let grew=true;
      while(grew){
        grew=false;
        const cells=[];
        for(let i=0;i<G*G;i++) if(reg[i]===id) cells.push(i);
        const cand=new Set();
        for(const i of cells){
          const r=Math.floor(i/G), c=i%G;
          for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
            const nr=r+dr,nc=c+dc;
            if(inb(nr,nc)&&reg[idx(nr,nc)]===-1) cand.add(idx(nr,nc));
          }
        }
        for(const f of cand){
          const r=Math.floor(f/G), c=f%G;
          const rf=reflect({r,c},C);
          if(inb(rf.r,rf.c)&&reg[idx(rf.r,rf.c)]===-1){
            reg[f]=id; reg[idx(rf.r,rf.c)]=id; remaining-=2; grew=true;
          }
        }
      }
    }
    return {reg, ctr};
  }

  // ---- state ----
  let reg, ctr, regColor, walls, solWalls, solOrder;
  let over, won, auto, autoReplay, autoIdx, autoAccum, lastWallKey;
  let elapsed, best, autoTimer, winPulse;

  try{ best=parseFloat(localStorage.getItem('galaxies_best')); if(!(best>0)) best=0; }catch(e){best=0;}

  function buildSolution(){
    solWalls=new Set();
    for(let r=0;r<G;r++)for(let c=0;c<G;c++){
      if(c<G-1 && reg[idx(r,c)]!==reg[idx(r,c+1)]) solWalls.add(ekey(r,c,r,c+1));
      if(r<G-1 && reg[idx(r,c)]!==reg[idx(r+1,c)]) solWalls.add(ekey(r,c,r+1,c));
    }
    solOrder=[...solWalls].sort();
  }
  function colorFor(id){
    const hue=(id*67+23)%360;
    return {fill:`hsla(${hue},70%,55%,0.13)`, line:`hsl(${hue},80%,65%)`};
  }

  function newGame(){
    const res=genRegions();
    reg=res.reg; ctr=res.ctr;
    regColor=ctr.map((_,i)=>colorFor(i));
    walls=new Set();
    buildSolution();
    over=false; won=false; auto=false; autoReplay=false; autoIdx=0; autoAccum=0; lastWallKey=null;
    elapsed=0; autoTimer=0; winPulse=0;
    if(elBadge) elBadge.classList.remove('show');
    if(btnAuto){ btnAuto.classList.remove('on'); btnAuto.textContent='自动游玩'; }
    elOverlay.classList.remove('show');
    if(elCenters) elCenters.textContent=ctr.length;
    if(elWalls) elWalls.textContent='0 / '+solWalls.size;
    if(elBest) elBest.textContent = best>0 ? best.toFixed(1)+'s' : '–';
  }

  function setAuto(v){
    auto=v;
    if(btnAuto){ btnAuto.classList.toggle('on',v); btnAuto.textContent=v?'自动中…':'自动游玩'; }
    if(elBadge) elBadge.classList.toggle('show',v);
    if(v){ autoReplay=true; autoIdx=0; autoAccum=0; walls=new Set(); lastWallKey=null; }
  }

  function addWall(k){ walls.add(k); lastWallKey=k; }
  function delWall(k){ walls.delete(k); }

  // ---- true Galaxies win condition (handles alternative symmetric partitions too) ----
  function checkWin(){
    if(over||won) return;
    // build connected components separated by walls + grid boundary
    const comp=new Array(G*G).fill(-1);
    let ncomp=0;
    for(let i=0;i<G*G;i++){
      if(comp[i]!==-1) continue;
      const stack=[i]; comp[i]=ncomp;
      while(stack.length){
        const cur=stack.pop();
        const r=Math.floor(cur/G), c=cur%G;
        for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nr=r+dr,nc=c+dc;
          if(!inb(nr,nc)) continue;
          const ni=idx(nr,nc);
          if(comp[ni]!==-1) continue;
          if(walls.has(ekey(r,c,nr,nc))) continue; // wall blocks
          comp[ni]=ncomp; stack.push(ni);
        }
      }
      ncomp++;
    }
    // each component: exactly one center, symmetric about it
    const compCells={};
    for(let i=0;i<G*G;i++){ (compCells[comp[i]]||(compCells[comp[i]]=[])).push(i); }
    for(const id in compCells){
      const cells=compCells[id];
      // find center(s)
      let center=null, ncenters=0;
      for(const i of cells){
        const r=Math.floor(i/G), c=i%G;
        for(const C of ctr){ if(C.r===r&&C.c===c){ center=C; ncenters++; break; } }
      }
      if(ncenters!==1) return; // must contain exactly one star core
      for(const i of cells){
        const r=Math.floor(i/G), c=i%G;
        const rr=2*center.r-r, cc=2*center.c-c;
        if(!inb(rr,cc)) return;
        if(comp[idx(rr,cc)]!==Number(id)) return; // not symmetric about its core
      }
    }
    winGame();
  }

  function winGame(){
    over=true; won=true; winPulse=1;
    if(best===0||elapsed<best){ best=elapsed; try{localStorage.setItem('galaxies_best',String(best));}catch(e){} }
    if(auto){ elOvTitle.textContent='⚡ 自动通关！'; elOvText.textContent='用 '+elapsed.toFixed(1)+'s 划出 '+ctr.length+' 个星域'; autoTimer=1.0; }
    else { elOvTitle.textContent='🎉 通关！'; elOvText.textContent='用 '+elapsed.toFixed(1)+'s 划出 '+ctr.length+' 个星域'; elOverlay.classList.add('show'); }
  }

  function autoStep(){
    if(autoIdx<solOrder.length){
      addWall(solOrder[autoIdx]); autoIdx++;
    } else {
      checkWin();
    }
  }

  // ---- input ----
  function edgeAt(x,y){
    const gx=Math.floor((x-PAD)/CELL), gy=Math.floor((y-PAD)/CELL);
    if(gx<0||gy<0||gx>=G||gy>=G) return null;
    const lx=x-(PAD+gx*CELL), ly=y-(PAD+gy*CELL);
    const cand=[];
    if(gx>0) cand.push({k:ekey(gy,gx,gy,gx-1), d:lx});
    if(gx<G-1) cand.push({k:ekey(gy,gx,gy,gx+1), d:CELL-lx});
    if(gy>0) cand.push({k:ekey(gy,gx,gy-1,gx), d:ly});
    if(gy<G-1) cand.push({k:ekey(gy,gx,gy+1,gx), d:CELL-ly});
    let best=null,bd=1e9;
    for(const e of cand){ if(e.d<bd){ bd=e.d; best=e.k; } }
    if(bd<=CELL*0.5) return best;
    return null;
  }
  function onDown(e){
    if(over||auto) return;
    let x=0,y=0;
    try{ const rect=cv.getBoundingClientRect(); const cx=(typeof e.clientX==='number')?e.clientX:0, cy=(typeof e.clientY==='number')?e.clientY:0;
      x=((cx-rect.left)/rect.width)*W; y=((cy-rect.top)/rect.height)*H; }catch(err){ return; }
    const k=edgeAt(x,y); if(!k) return;
    if(walls.has(k)) delWall(k); else addWall(k);
    if(elWalls) elWalls.textContent=walls.size+' / '+solWalls.size;
    e.preventDefault&&e.preventDefault();
  }
  function onMove(e){
    if(over||auto) return;
    if(e.buttons===0 && e.pointerType==='mouse' && !(e.pressure>0)) return;
    let x=0,y=0;
    try{ const rect=cv.getBoundingClientRect(); const cx=(typeof e.clientX==='number')?e.clientX:0, cy=(typeof e.clientY==='number')?e.clientY:0;
      x=((cx-rect.left)/rect.width)*W; y=((cy-rect.top)/rect.height)*H; }catch(err){ return; }
    const k=edgeAt(x,y);
    if(k && !walls.has(k)){ addWall(k); if(elWalls) elWalls.textContent=walls.size+' / '+solWalls.size; }
    e.preventDefault&&e.preventDefault();
  }
  function onUp(e){ if(over||auto) return; checkWin(); e.preventDefault&&e.preventDefault(); }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointerdown',onDown,{passive:false});
    cv.addEventListener('pointermove',onMove,{passive:false});
    cv.addEventListener('pointerup',onUp,{passive:false});
    cv.addEventListener('pointercancel',onUp,{passive:false});
    cv.addEventListener('mousedown',onDown,{passive:false});
    cv.addEventListener('mousemove',onMove,{passive:false});
    cv.addEventListener('mouseup',onUp,{passive:false});
  }
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto) return; setAuto(!auto); if(auto&&over){ newGame(); setAuto(true);} });
  btnRestart&&btnRestart.addEventListener('click',()=>{ newGame(); setAuto(false); });
  btnOv&&btnOv.addEventListener('click',()=>{ newGame(); setAuto(false); });

  // ---- update ----
  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  function update(dt){
    if(over){
      if(winPulse>0) winPulse=Math.max(0,winPulse-dt*1.5);
      if(auto){ autoTimer-=dt; if(autoTimer<=0){ newGame(); setAuto(true); } }
      return;
    }
    elapsed+=dt;
    if(auto && autoReplay){
      autoAccum+=dt;
      if(autoAccum>=0.07){ autoAccum=0; autoStep(); }
    }
    if(winPulse>0) winPulse=Math.max(0,winPulse-dt*2);
  }

  // ---- render ----
  function cc(r,c){ return [PAD+c*CELL+CELL/2, PAD+r*CELL+CELL/2]; }
  function wallSeg(k){
    const [a,b]=parseKey(k); const [r1,c1]=a.split(',').map(Number), [r2,c2]=b.split(',').map(Number);
    if(r1===r2){ const x=PAD+Math.max(c1,c2)*CELL; return [[x,PAD+r1*CELL],[x,PAD+(r1+1)*CELL]]; }
    const y=PAD+Math.max(r1,r2)*CELL; return [[PAD+c1*CELL,y],[PAD+(c1+1)*CELL,y]];
  }
  function star(x,y,s){
    ctx.beginPath();
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2 - Math.PI/2;
      const ax=x+Math.cos(a)*s, ay=y+Math.sin(a)*s;
      const bx=x+Math.cos(a+Math.PI/4)*s*0.42, by=y+Math.sin(a+Math.PI/4)*s*0.42;
      if(i===0) ctx.moveTo(ax,ay); else ctx.lineTo(ax,ay);
      ctx.lineTo(bx,by);
    }
    ctx.closePath();
  }
  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    // region tints
    for(let r=0;r<G;r++)for(let c=0;c<G;c++){
      const id=reg[idx(r,c)]; const col=regColor[id];
      ctx.fillStyle=col.fill;
      ctx.fillRect(PAD+c*CELL+1, PAD+r*CELL+1, CELL-2, CELL-2);
    }
    // grid
    ctx.strokeStyle='rgba(124,140,255,0.10)'; ctx.lineWidth=1;
    for(let i=0;i<=G;i++){
      ctx.beginPath(); ctx.moveTo(PAD+i*CELL,PAD); ctx.lineTo(PAD+i*CELL,PAD+G*CELL); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(PAD,PAD+i*CELL); ctx.lineTo(PAD+G*CELL,PAD+i*CELL); ctx.stroke();
    }
    // walls
    for(const k of walls){
      const [p1,p2]=wallSeg(k);
      const isLast=(k===lastWallKey);
      ctx.save();
      ctx.shadowColor=isLast?'#ffffff':'#46e0ff'; ctx.shadowBlur=isLast?22:14;
      ctx.strokeStyle=isLast?'#ffffff':'#7c5cff'; ctx.lineWidth=isLast?8:7; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
      ctx.restore();
    }
    // centers (stars)
    for(const C of ctr){
      const [x,y]=cc(C.r,C.c);
      ctx.save();
      ctx.shadowColor='#ffd23f'; ctx.shadowBlur=18;
      ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#fff3b0'; ctx.lineWidth=2;
      star(x,y,CELL*0.30); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    // auto pen
    if(auto && autoReplay && lastWallKey){
      const [p1,p2]=wallSeg(lastWallKey);
      const mx=(p1[0]+p2[0])/2, my=(p1[1]+p2[1])/2;
      ctx.save(); ctx.shadowColor='#ffd23f'; ctx.shadowBlur=20; ctx.fillStyle='#ffd23f';
      ctx.beginPath(); ctx.arc(mx,my,5,0,6.28); ctx.fill(); ctx.restore();
    }
    if(winPulse>0){
      ctx.save(); ctx.globalAlpha=winPulse*0.5; ctx.fillStyle='#5dffa6'; ctx.fillRect(0,0,W,H); ctx.restore();
    }
  }

  function frame(ts){
    const now=(typeof performance!=='undefined'?(ts!==undefined?ts:performance.now()):Date.now());
    let dt=(now-last)/1000; if(!(dt>0)||dt>0.05) dt=0.016; last=now;
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  newGame();

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;},
    get score(){return walls.size;},
    get target(){return solWalls.size;},
    get centers(){return ctr.length;},
    get best(){return best;}, get elapsed(){return elapsed;},
    startAuto(){ setAuto(true); if(over){ newGame(); setAuto(true);} },
    toggleAuto(){ setAuto(!auto); },
    restart(){ newGame(); setAuto(false); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); },
    tick(dt){ update(dt); render(); },
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get score(){return walls.size;}, get target(){return solWalls.size;}, get centers(){return ctr.length;}, get best(){return best;}
  };
})();
</script>
</body>
</html>
