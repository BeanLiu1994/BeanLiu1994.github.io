<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0e0a24" />
<title>霓虹防卫 · Neon Defender</title>
<style>
  :root { --bg:#0e0a24; --surface:#16103a; --board:#100b2c; --text:#efeaff; --muted:#9b8fd6; --accent:#ff5d6a; --accent-glow:#ff5d6a55; --gold:#ffd700; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image:radial-gradient(ellipse at 50% 0%, #281a55 0%, transparent 60%), radial-gradient(ellipse at 50% 100%, #1a1140 0%, transparent 60%); color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,var(--accent),#ffb3b3); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 12px; text-align:center; min-width:58px; }
  .score-card .label { font-size:0.52rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1.05rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .score-card.lives .value { color:var(--accent); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#0e0a24ee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; padding:20px; }
  .overlay-content h2 { font-size:2rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:16px; font-size:0.9rem; }
  .overlay.lose h2 { color:var(--red); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:11px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:700; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; }
  .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#0e0a24; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#0e0a24; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:20px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:blink .8s infinite; }
  @keyframes blink { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>霓虹防卫</h1>
      <div class="sub">N E O N &nbsp; D E F E N D E R</div>
    </div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card lives"><div class="label">Life</div><div class="value" id="lives">3</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="game" width="360" height="360"></canvas>
    <div class="overlay lose" id="overlay-lose">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2>防线失守!</h2>
        <p id="lose-msg">外星舰队突破了</p>
        <button class="btn primary" onclick="game.restart()">再来一局</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">新游戏</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">自动: 关</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none">
    <div class="ai-dot"></div><span id="ai-status">AI 锁定中…</span>
  </div>
  <div class="status" id="status">左右移动 · 空格/点击射击 · 别让外星人突破底线</div>
</div>
<script>
(function(){
  'use strict';
  const PAL=['#ff5d6a','#4d9fff','#4dff91','#ffd23f','#b06bff','#ff8a3d'];
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), livesEl=document.getElementById('lives');
  const statusEl=document.getElementById('status');
  const overlayLose=document.getElementById('overlay-lose'), loseMsg=document.getElementById('lose-msg');
  const aiInd=document.getElementById('ai-indicator'), aiStatus=document.getElementById('ai-status');

  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

  class Defender {
    constructor(){
      this.autoPlay=false; this.over=false; this.time=0;
      this.best=parseInt(localStorage.getItem('neonBest')||'0'); bestEl.textContent=this.best;
      this.keys={left:false,right:false,upv:false,downv:false,fire:false};
      this.pointer={active:false,x:0};
      this.fit(); window.addEventListener('resize',()=>this.fit());
      this.bindInput();
      this.restart(); this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const r=canvas.getBoundingClientRect(); const w=Math.max(260,Math.min(r.width||360,440)); const d=window.devicePixelRatio||1; this.W=w; this.H=w; canvas.width=w*d; canvas.height=w*d; ctx.setTransform(d,0,0,d,0,0); }
    // ---- entities ----
    initStars(){ this.stars=[]; const n=70; for(let i=0;i<n;i++){ this.stars.push({x:Math.random()*this.W, y:Math.random()*this.H, vy:18+Math.random()*70, s:0.6+Math.random()*1.6, b:0.3+Math.random()*0.7}); } }
    spawnAlien(forceX){
      const W=this.W, H=this.H;
      const r=12+Math.random()*7;
      const x=forceX!=null?forceX:(r+6+Math.random()*(W-2*(r+6)));
      const speedBase=34+this.wave*5;
      const a={ x, y:-r-4, vx:(Math.random()*2-1)*40, vy:speedBase+Math.random()*40, r, hp:1, color:PAL[(Math.floor(Math.random()*PAL.length))], type:Math.floor(Math.random()*3), fireCD:1+Math.random()*2.5, spin:Math.random()*7, wob:Math.random()*7 };
      this.aliens.push(a);
    }
    fire(){ if(this.fireCD>0||this.over) return; this.fireCD=0.16; const p=this.player; this.bullets.push({x:p.x, y:p.y-14, vy:-460, r:3.4}); this.muzzle=1; }
    explode(x,y,color,n){ this.fx.push({x,y,r:4,life:1,color}); const c=n||10; for(let i=0;i<c;i++){ const a=Math.random()*7, sp=60+Math.random()*180; this.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color}); } }
    loseLife(){
      this.lives--; livesEl.textContent=this.lives;
      this.explode(this.player.x,this.player.y,'#ff5d6a',16); this.hitFlash=1;
      if(this.lives<=0) this.gameOver();
    }
    gameOver(){ if(this.over) return; this.over=true; if(this.score>this.best){ this.best=this.score; localStorage.setItem('neonBest',String(this.best)); bestEl.textContent=this.best; } loseMsg.textContent='本局得分 '+this.score; overlayLose.classList.add('active'); if(this.autoPlay) setTimeout(()=>{ if(this.autoPlay) this.restart(); },1500); }
    // ---- update ----
    update(dt){
      this.time+=dt;
      if(this.hitFlash>0) this.hitFlash-=dt*2.5;
      if(this.muzzle>0) this.muzzle-=dt*6;
      // stars scroll
      for(const s of this.stars){ s.y+=s.vy*dt; if(s.y>this.H+2){ s.y=-2; s.x=Math.random()*this.W; } }
      // fx + parts
      for(let i=this.fx.length-1;i>=0;i--){ const f=this.fx[i]; f.r+=dt*120; f.life-=dt*2.2; if(f.life<=0) this.fx.splice(i,1); }
      for(let i=this.parts.length-1;i>=0;i--){ const p=this.parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; p.life-=dt*1.8; if(p.life<=0) this.parts.splice(i,1); }
      if(this.over) return;

      if(this.fireCD>0) this.fireCD-=dt;

      if(this.autoPlay){ this.updateAuto(dt); }
      else { this.updateHuman(dt); }

      // bullets
      for(let i=this.bullets.length-1;i>=0;i--){ const b=this.bullets[i]; b.y+=b.vy*dt; if(b.y<-12){ this.bullets.splice(i,1); } }
      // aliens
      const lineY=this.player.y+10;
      for(let i=this.aliens.length-1;i>=0;i--){ const a=this.aliens[i];
        a.y+=a.vy*dt; a.x+=a.vx*dt; a.spin+=dt*3; a.wob+=dt*4;
        if(a.x<a.r){ a.x=a.r; a.vx=Math.abs(a.vx); }
        if(a.x>this.W-a.r){ a.x=this.W-a.r; a.vx=-Math.abs(a.vx); }
        a.x+=Math.sin(a.wob)*18*dt;
        // fire at player
        a.fireCD-=dt;
        if(a.fireCD<=0 && a.y>30 && a.y<lineY){ a.fireCD=1.8+Math.random()*2; const dx=this.player.x-a.x, dy=this.player.y-a.y, d=Math.hypot(dx,dy)||1; const sp=200; this.alienBullets.push({x:a.x,y:a.y+a.r, vx:dx/d*sp, vy:dy/d*sp, r:4, color:'#ff8a3d'}); }
        // reached bottom defense line
        if(a.y>lineY){ this.aliens.splice(i,1); this.explode(a.x,a.y,a.color,8); this.loseLife(); if(this.over) return; continue; }
      }
      // alien bullets
      for(let i=this.alienBullets.length-1;i>=0;i--){ const b=this.alienBullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
        if(b.y>this.H+12||b.x<-12||b.x>this.W+12){ this.alienBullets.splice(i,1); continue; }
        if(!this.over && Math.hypot(b.x-this.player.x,b.y-this.player.y)<this.player.w*0.5+b.r){ this.alienBullets.splice(i,1); this.loseLife(); if(this.over) return; }
      }
      // bullet vs alien
      for(let i=this.bullets.length-1;i>=0;i--){ const b=this.bullets[i];
        for(let j=this.aliens.length-1;j>=0;j--){ const a=this.aliens[j];
          if(Math.hypot(b.x-a.x,b.y-a.y)<a.r+b.r){ this.bullets.splice(i,1); a.hp--; if(a.hp<=0){ this.aliens.splice(j,1); this.score+=10*this.wave; scoreEl.textContent=this.score; this.explode(a.x,a.y,a.color,12); } else { this.explode(b.x,b.y,a.color,4); } break; }
        }
      }
      // spawning
      this.spawnTimer-=dt;
      if(this.spawnTimer<=0 && this.aliens.length<16){
        const interval=Math.max(0.45, 1.5 - this.wave*0.08);
        this.spawnTimer=interval*(0.7+Math.random()*0.6);
        const g=1+Math.floor(Math.random()*3);
        for(let k=0;k<g;k++) this.spawnAlien();
      }
      // wave progression
      this.waveTimer-=dt;
      if(this.waveTimer<=0){ this.wave++; this.waveTimer=22; if(this.autoPlay) aiStatus.textContent='AI 第 '+this.wave+' 波…'; }
    }
    updateHuman(dt){
      const p=this.player, sp=p.speed;
      let dx=0, dy=0;
      if(this.keys.left) dx-=1; if(this.keys.right) dx+=1;
      if(this.keys.upv) dy-=1; if(this.keys.downv) dy+=1;
      if(this.pointer.active){ const diff=this.pointer.x-p.x; p.x+=clamp(diff,-sp*1.4*dt,sp*1.4*dt); }
      p.x+=dx*sp*dt; p.y+=dy*sp*0.55*dt;
      p.x=clamp(p.x,p.w*0.5,this.W-p.w*0.5);
      p.y=clamp(p.y,this.H*0.5,this.H*0.92);
      if(this.keys.fire||this.pointer.active) this.fire();
    }
    updateAuto(dt){
      const p=this.player, sp=p.speed;
      // pick most dangerous alien (closest to bottom)
      let tgt=null, bestY=-1;
      for(const a of this.aliens){ if(a.y>bestY){ bestY=a.y; tgt=a; } }
      this.autoTarget=tgt;
      // dodge incoming alien bullets
      let danger=null, dmin=1e9;
      for(const b of this.alienBullets){ const dy=b.y-p.y; if(dy>-12 && dy<220){ const dd=Math.hypot(b.x-p.x,b.y-p.y); if(dd<dmin){ dmin=dd; danger=b; } } }
      if(danger && dmin<p.w*1.6){
        const dir = danger.x<=p.x ? 1 : -1;
        p.x+=dir*sp*1.3*dt; aiStatus.textContent='AI 闪避…';
      } else if(tgt){
        const diff=tgt.x-p.x; p.x+=clamp(diff,-sp*dt,sp*dt); aiStatus.textContent='AI 锁定中…';
      } else { aiStatus.textContent='AI 待命…'; }
      p.x=clamp(p.x,p.w*0.5,this.W-p.w*0.5);
      this.fire();
    }
    // ---- draw ----
    glow(c,b){ ctx.shadowColor=c; ctx.shadowBlur=b; }
    noglow(){ ctx.shadowBlur=0; }
    draw(){
      const W=this.W,H=this.H;
      ctx.clearRect(0,0,W,H);
      // starfield
      for(const s of this.stars){ ctx.globalAlpha=s.b; ctx.fillStyle='#bcd2ff'; ctx.fillRect(s.x,s.y,s.s,s.s*2.4); }
      ctx.globalAlpha=1;
      // defense line
      const lineY=this.player.y+10;
      ctx.save(); ctx.setLineDash([6,8]); ctx.strokeStyle='#ff5d6a44'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,lineY); ctx.lineTo(W,lineY); ctx.stroke(); ctx.restore();
      // player
      this.drawPlayer();
      // aliens
      for(const a of this.aliens) this.drawAlien(a);
      // auto target highlight
      if(this.autoPlay && this.autoTarget){ const a=this.autoTarget; ctx.save(); ctx.strokeStyle='#ff5d6a'; ctx.lineWidth=2.5; ctx.globalAlpha=0.5+0.5*Math.sin(this.time*8); ctx.strokeRect(a.x-a.r-5,a.y-a.r-5,(a.r+5)*2,(a.r+5)*2); ctx.restore(); }
      // bullets
      for(const b of this.bullets){ ctx.save(); this.glow('#9be7ff',12); ctx.fillStyle='#cdf3ff'; ctx.fillRect(b.x-1.6,b.y-9,3.2,12); this.noglow(); ctx.restore(); }
      // alien bullets
      for(const b of this.alienBullets){ ctx.save(); this.glow(b.color,14); ctx.fillStyle=b.color; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); this.noglow(); ctx.restore(); }
      // fx rings
      for(const f of this.fx){ ctx.save(); ctx.globalAlpha=Math.max(0,f.life); ctx.strokeStyle=f.color; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.stroke(); ctx.restore(); }
      // particles
      for(const p of this.parts){ ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,7); ctx.fill(); ctx.restore(); }
      // hit flash
      if(this.hitFlash>0){ ctx.save(); ctx.globalAlpha=this.hitFlash*0.4; ctx.fillStyle='#ff5d6a'; ctx.fillRect(0,0,W,H); ctx.restore(); }
    }
    drawPlayer(){
      const p=this.player; ctx.save(); ctx.translate(p.x,p.y);
      // engine flame
      const fl=4+Math.random()*5; ctx.fillStyle='#4d9fff'; this.glow('#4d9fff',10); ctx.beginPath(); ctx.moveTo(-4,p.h); ctx.lineTo(0,p.h+fl); ctx.lineTo(4,p.h); ctx.closePath(); ctx.fill(); this.noglow();
      // muzzle flash
      if(this.muzzle>0){ ctx.fillStyle='#cdf3ff'; this.glow('#cdf3ff',14); ctx.beginPath(); ctx.arc(0,-p.h-4,3+this.muzzle*4,0,7); ctx.fill(); this.noglow(); }
      // body
      ctx.fillStyle='#ff5d6a'; this.glow('#ff5d6a',16);
      ctx.beginPath(); ctx.moveTo(0,-p.h); ctx.lineTo(p.w,p.h); ctx.lineTo(p.w*0.4,p.h*0.5); ctx.lineTo(-p.w*0.4,p.h*0.5); ctx.lineTo(-p.w,p.h); ctx.closePath(); ctx.fill();
      this.noglow();
      // cockpit
      ctx.fillStyle='#cdf3ff'; this.glow('#cdf3ff',8); ctx.beginPath(); ctx.arc(0,-p.h*0.1,3.2,0,7); ctx.fill(); this.noglow();
      ctx.restore();
    }
    drawAlien(a){
      ctx.save(); ctx.translate(a.x,a.y);
      this.glow(a.color,14); ctx.fillStyle=a.color;
      if(a.type===0){ // diamond
        ctx.beginPath(); ctx.moveTo(0,-a.r); ctx.lineTo(a.r,0); ctx.lineTo(0,a.r); ctx.lineTo(-a.r,0); ctx.closePath(); ctx.fill();
      } else if(a.type===1){ // spiked circle
        ctx.beginPath(); for(let i=0;i<8;i++){ const ang=a.spin+i*Math.PI/4; const rr=(i%2?a.r:a.r*0.6); ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr); } ctx.closePath(); ctx.fill();
      } else { // triangle
        ctx.beginPath(); ctx.moveTo(0,a.r); ctx.lineTo(a.r,-a.r*0.7); ctx.lineTo(-a.r,-a.r*0.7); ctx.closePath(); ctx.fill();
      }
      this.noglow();
      // core eye
      ctx.fillStyle='#0e0a24'; ctx.beginPath(); ctx.arc(0,0,a.r*0.32,0,7); ctx.fill();
      ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(0,0,a.r*0.15,0,7); ctx.fill();
      ctx.restore();
    }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.update(dt); this.draw(); }catch(err){ console.error(err); } }
    // ---- input ----
    bindInput(){
      window.addEventListener('keydown',e=>{
        if(this.over) return;
        switch(e.code){
          case 'ArrowLeft': case 'KeyA': this.keys.left=true; e.preventDefault(); break;
          case 'ArrowRight': case 'KeyD': this.keys.right=true; e.preventDefault(); break;
          case 'ArrowUp': case 'KeyW': this.keys.fire=true; e.preventDefault(); break;
          case 'KeyS': this.keys.downv=true; e.preventDefault(); break;
          case 'Space': this.keys.fire=true; e.preventDefault(); break;
        }
      });
      window.addEventListener('keyup',e=>{
        switch(e.code){
          case 'ArrowLeft': case 'KeyA': this.keys.left=false; break;
          case 'ArrowRight': case 'KeyD': this.keys.right=false; break;
          case 'ArrowUp': case 'KeyW': this.keys.fire=false; break;
          case 'KeyS': this.keys.downv=false; break;
          case 'Space': this.keys.fire=false; break;
        }
      });
      const posX=(e)=>{ const r=canvas.getBoundingClientRect(); return (e.clientX-r.left)*(this.W/r.width); };
      canvas.addEventListener('pointerdown',e=>{ e.preventDefault(); if(this.over||this.autoPlay) return; this.pointer.active=true; this.pointer.x=posX(e); this.fire(); });
      canvas.addEventListener('pointermove',e=>{ if(this.pointer.active) this.pointer.x=posX(e); });
      window.addEventListener('pointerup',()=>{ this.pointer.active=false; });
      window.addEventListener('pointercancel',()=>{ this.pointer.active=false; });
      document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
    }
    // ---- auto ----
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='自动: 开'; b.classList.add('auto-on'); aiInd.style.display='flex'; this.autoTarget=null; aiStatus.textContent='AI 锁定中…'; if(this.over) this.restart(); }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='自动: 关'; b.classList.remove('auto-on'); aiInd.style.display='none'; }
    restart(){ this.stopAuto(); this.over=false; this.score=0; this.lives=3; this.wave=1; this.time=0; scoreEl.textContent='0'; livesEl.textContent='3'; this.fireCD=0; this.muzzle=0; this.hitFlash=0; this.spawnTimer=0.5; this.waveTimer=22; this.bullets=[]; this.aliens=[]; this.alienBullets=[]; this.fx=[]; this.parts=[]; this.autoTarget=null; this.player={x:this.W/2, y:this.H*0.84, w:16, h:13, speed:300}; this.initStars(); overlayLose.classList.remove('active'); statusEl.textContent='左右移动 · 空格/点击射击 · 别让外星人突破底线'; }
  }
  window.game=new Defender();
})();
</script>
