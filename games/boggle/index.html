<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0f1f" />
<title>霓虹拼词 · Neon Words</title>
<style>
  :root{
    --bg:#0a0f1f; --surface:#121a30; --text:#eaf2ff; --muted:#7e90b3;
    --accent:#ff6b8a; --accent2:#ffd23f; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#ff6b8a55; --dim:#243352;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #1a2540 0%, transparent 60%),
                     radial-gradient(ellipse at 50% 100%, #0a1a30 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:460px;padding:12px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .title-block h1{font-size:1.4rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:54px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.t .value{color:var(--accent);}
  .score-card.p .value{color:var(--accent2);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:var(--board,#07101e);}
  .toolbar{display:flex;gap:8px;margin-top:10px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  button.ghost{background:transparent;}
  .hint{text-align:center;color:var(--muted);font-size:0.72rem;margin-top:8px;line-height:1.5;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.7rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay p{color:var(--muted);font-size:0.9rem;text-align:center;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}
</style>

  const DICT=new Set(DICT_STR.split(/\s+/).filter(w=>w.length>=3&&w.length<=8));
  function buildTrie(){
    const root={};

  // letter bag with vowel bias

  }
  function findAll(g){
    const res=[];
    const visited=new Array(g.length).fill(false);
    function dfs(i, str, path){
      visited[i]=true; str+=g[i]; path=path.concat(i);

    for(const w of res){ if(seen.has(w.word)) continue; seen.add(w.word); out.push(w); }

  }
  function newGame(){
    let bestG=null, bestN=-1;
    for(let t=0;t<80;t++){ const g=genGrid(); const w=findAll(g); if(w.length>bestN){ bestN=w.length; bestG=g; } if(w.length>=MIN_WORDS) break; }

    if(found.has(entry.word)) return false;

    score+=wordScore(entry.word);

    flashMsg=entry.word.toUpperCase()+' +'+wordScore(entry.word);
    flashT=1.1;
    return true;

  function winGame(){
    over=true; won=true;
    if(score>best){ best=score; try{localStorage.setItem('words_best',String(best));}catch(e){} }
    if(auto){ elOvTitle.textContent='⚡ 自动通关！'; elOvText.textContent='找到 '+foundList.length+' 个词 · 分数 '+score+' · 继续下一局…'; autoTimer=1.0; }
    else { elOvTitle.textContent='🎉 通关！'; elOvText.textContent='找到 '+foundList.length+' 个词 · 分数 '+score; elOverlay.classList.add('show'); }
  }
  function loseGame(){
    over=true; won=false;
    elOvTitle.textContent='⏱ 时间到'; elOvText.textContent='找到 '+foundList.length+' 个词 · 分数 '+score; elOverlay.classList.add('show');
  }

  // ---- manual input ----
  function tileAt(clientX, clientY){
    let x=0,y=0; try{ const r=cv.getBoundingClientRect(); x=(clientX-r.left)/r.width*bw; y=(clientY-r.top)/r.height*bh; }catch(e){}
    for(let i=0;i<grid.length;i++){ const [r,c]=rc(i); const x0=PAD+c*(CELL+GAP), y0=PAD+r*(CELL+GAP); if(x>=x0&&x<=x0+CELL&&y>=y0&&y<=y0+CELL) return i; }
    return -1;
  }
  function inPath(i){ return selPath.indexOf(i)>=0; }
  function adjacent(a,b){ const [ar,ac]=rc(a),[br,bc]=rc(b); return Math.abs(ar-br)<=1&&Math.abs(ac-bc)<=1&&a!==b; }
  function onTap(e){
    if(over||auto) return;
    let cx=0,cy=0; if(e.touches&&e.touches[0]){cx=e.touches[0].clientX;cy=e.touches[0].clientY;} else {cx=e.clientX;cy=e.clientY;}
    const i=tileAt(cx,cy); if(i<0) return;
    if(selPath.length===0){ selPath.push(i); }
    else if(i===selPath[selPath.length-1]){ submitWord(); }
    else if(!inPath(i) && adjacent(i, selPath[selPath.length-1])){ selPath.push(i); }
    else { selPath=[i]; }
    e.preventDefault&&e.preventDefault();
  }
  function submitWord(){
    if(selPath.length<1){ return; }
    const w=selPath.map(i=>grid[i]).join('');
    if(w.length>=3 && DICT.has(w)){ const entry={word:w, path:selPath.slice()}; if(addWord(entry)){ if(foundList.length>=TARGET) winGame(); } }
    selPath=[];
  }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointerdown',onTap,{passive:false});
    cv.addEventListener('touchstart',onTap,{passive:false});
  }
  btnClear&&btnClear.addEventListener('click',()=>{ if(over||auto) return; selPath=[]; });
  btnSubmit&&btnSubmit.addEventListener('click',()=>{ if(over||auto) return; submitWord(); });
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto) return; setAuto(!auto); if(auto&&over){ newGame(); setAuto(true);} });
  btnRestart&&btnRestart.addEventListener('click',()=>{ newGame(); setAuto(false); });
  btnOv&&btnOv.addEventListener('click',()=>{ newGame(); setAuto(false); });

  // ---- update ----
  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  let autoAcc=0;
  function update(dt){
    if(over){
      if(auto){ autoTimer-=dt; if(autoTimer<=0){ newGame(); setAuto(true); } }
      if(flashT>0) flashT-=dt;
      if(autoFlash){ autoFlash.t-=dt; if(autoFlash.t<=0) autoFlash=null; }
      return;
    }
    timeLeft-=dt;
    if(flashT>0) flashT-=dt;
    if(autoFlash){ autoFlash.t-=dt; if(autoFlash.t<=0) autoFlash=null; }
    if(auto){
      autoAcc+=dt;
      if(autoAcc>=0.30 && autoIdx<allWords.length){
        autoAcc=0; const e=allWords[autoIdx++]; addWord(e);
        if(foundList.length>=TARGET){ winGame(); return; }
      }
    }
    if(timeLeft<=0){ timeLeft=0; if(foundList.length>=TARGET) winGame(); else loseGame(); return; }
    if(elFound) elFound.textContent=foundList.length;
    if(elTime) elTime.textContent=Math.ceil(timeLeft);
    if(elScore) elScore.textContent=score;
  }

  // ---- render ----
  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,bw,bh);
    ctx.strokeStyle='rgba(255,107,138,0.06)'; ctx.lineWidth=1;
    for(let gx=0;gx<=W;gx+=42){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
    for(let gy=0;gy<=H;gy+=42){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
    // tiles
    for(let i=0;i<grid.length;i++){
      const [r,c]=rc(i); const x0=PAD+c*(CELL+GAP), y0=PAD+r*(CELL+GAP);
      const sel=inPath(i)||(autoFlash&&autoFlash.cells.indexOf(i)>=0);
      const hue=sel?'#ffd23f':'#ff6b8a';
      ctx.save(); ctx.shadowColor=hue; ctx.shadowBlur=sel?22:10; ctx.strokeStyle=hue; ctx.fillStyle=sel?'rgba(255,210,63,0.18)':'rgba(255,255,255,0.04)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.roundRect(x0,y0,CELL,CELL,10); ctx.fill(); ctx.stroke();
      ctx.shadowBlur=sel?16:0; ctx.fillStyle=sel?'#ffd23f':'#eaf2ff'; ctx.font='bold '+(CELL*0.46|0)+'px Segoe UI,system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(grid[i].toUpperCase(), x0+CELL/2, y0+CELL/2+1);
      ctx.restore();
    }
    // path line
    if(selPath.length>1){
      ctx.save(); ctx.strokeStyle='#ffd23f'; ctx.lineWidth=4; ctx.shadowColor='#ffd23f'; ctx.shadowBlur=12; ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.beginPath();
      for(let k=0;k<selPath.length;k++){ const [r,c]=rc(selPath[k]); const cx=PAD+c*(CELL+GAP)+CELL/2, cy=PAD+r*(CELL+GAP)+CELL/2; if(k===0) ctx.moveTo(cx,cy); else ctx.lineTo(cx,cy); }
      ctx.stroke(); ctx.restore();
    }
    // current word preview
    if(selPath.length>0){ const w=selPath.map(i=>grid[i]).join(''); ctx.fillStyle='#ffd23f'; ctx.font='bold 22px Segoe UI,system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillText(w.toUpperCase(), W/2, H-14); }
    // flash message
    if(flashT>0){ ctx.save(); ctx.globalAlpha=Math.min(1,flashT); ctx.fillStyle='#5dffa6'; ctx.font='bold 26px Segoe UI,system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillText(flashMsg, W/2, H/2); ctx.restore(); }
  }

  function frame(ts){
    const now=(typeof performance!=='undefined'?ts:(typeof performance!=='undefined'?performance.now():Date.now()));
    const dt=Math.min(0.05,((ts!==undefined?ts:now)-(last))/1000); last=(ts!==undefined?ts:now);
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  newGame();

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;},
    get score(){return score;}, get best(){return best;}, get found(){return foundList.length;}, get total(){return allWords.length;},
    startAuto(){ setAuto(true); if(over){ newGame(); setAuto(true);} },
    toggleAuto(){ setAuto(!auto); },
    restart(){ newGame(); setAuto(false); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); },
    tick(dt){ update(dt); render(); },
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get score(){return score;}, get found(){return foundList.length;}, get total(){return allWords.length;}
  };
})();
</script>
</body>
</html>
