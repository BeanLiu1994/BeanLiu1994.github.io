<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1a0a2a" />
<title>Craps · 霓虹双骰</title>
<style>
  :root { --bg:#1a0a2a; --surface:#241040; --board:#160a26; --text:#f0e6ff; --muted:#a98fd0; --accent:#b15dff; --accent2:#5de1ff; --accent-glow:#b15dff55; --gold:#ffd54a; --red:#ff5d6a; --green:#4dff91; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image:radial-gradient(ellipse at 50% 0%, #2a1248 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #140828 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#b15dff,#5de1ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:58px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn { flex:1; min-width:90px; padding:11px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:700; cursor:pointer; transition:all .2s; letter-spacing:.5px; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#160826; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#160826; animation:pulse 1.6s infinite; --glow:var(--accent-glow); }
  @keyframes pulse { 0%,100%{box-shadow:0 0 6px var(--glow,transparent);} 50%{box-shadow:0 0 18px var(--glow,transparent),0 0 34px var(--glow,transparent);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
  .hint { margin-top:4px; font-size:0.62rem; color:#7a5fa0; text-align:center; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Craps</h1><div class="sub">N E O N &nbsp; D I C E</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Wins</div><div class="value" id="wins">0</div></div>
      <div class="score-card"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="420" height="260"></canvas></div>
  <div class="controls">
    <button class="btn primary" id="btn-roll" onclick="game.roll()">Roll</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">点击 Roll 投掷两颗骰子 · 7/11 直接赢，2/3/12 输，其余设点数</div>
  <div class="hint">触屏：点按屏幕或按钮投掷 · 自动模式持续下注 Pass Line</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const winsEl=document.getElementById('wins'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  const btnAuto=document.getElementById('btn-auto'), btnRoll=document.getElementById('btn-roll');

  const W=canvas.width, H=canvas.height;

  function rint(n){ return Math.floor(Math.random()*n); }

  class Craps {
    constructor(){
      this.autoPlay=false; this._last=0; this._autoCd=0; this.time=0;
      this._autoProgress=0; this.bestKey='crapsBest';
      this.best=parseInt(localStorage.getItem(this.bestKey)||'0'); bestEl.textContent=this.best;
      this.wins=0; this.point=0; this.state='idle'; // idle | rolling | point | done
      this.tumble=0; this.d1=1; this.d2=1; this.lock1=1; this.lock2=1;
      this.flash=0; this.flashColor='#4dff91'; this.banner='';
      this.restart();
      requestAnimationFrame(this.tick.bind(this));
    }
    restart(){
      this.wins=0; this.point=0; this.state='idle'; this.tumble=0;
      this.banner=''; this.flash=0; this._autoCd=0;
      winsEl.textContent='0'; this.setStatus('点击 Roll 投掷两颗骰子 · 7/11 直接赢，2/3/12 输，其余设点数');
    }
    setStatus(t){ statusEl.textContent=t; }
    roll(){
      if(this.state==='rolling') return;
      this.lock1=1+rint(6); this.lock2=1+rint(6);
      this.tumble=0.55; this.state='rolling';
      btnRoll.disabled=true;
    }
    _finishRoll(sum){
      btnRoll.disabled=false; this._autoProgress++;
      if(this.point===0){
        if(sum===7||sum===11){ this._win('Pass! 7/11 直接通杀'); }
        else if(sum===2||sum===3||sum===12){ this._lose('Craps! 2/3/12 出局'); }
        else { this.point=sum; this.state='point'; this.setStatus('点数 = '+sum+' · 继续投掷，掷出 '+sum+' 赢，先掷 7 输'); }
      } else {
        if(sum===this.point){ this._win('命中点数 '+this.point+'！'); }
        else if(sum===7){ this._lose('掷出 7，Pass Line 输'); }
        else { this.setStatus('点数 = '+this.point+' · 当前掷出 '+sum+'，继续…'); }
      }
    }
    _win(msg){ this.wins++; winsEl.textContent=this.wins; if(this.wins>this.best){ this.best=this.wins; bestEl.textContent=this.best; localStorage.setItem(this.bestKey,String(this.best)); } this.flash=0.9; this.flashColor='#4dff91'; this.banner='WIN +1'; this.point=0; this.state='idle'; this.setStatus(msg+' · 连胜 '+this.wins); }
    _lose(msg){ this.flash=0.9; this.flashColor='#ff5d6a'; this.banner='LOSE'; this.point=0; this.state='idle'; this.setStatus(msg+' · 连胜清零'); }
    toggleAuto(){
      this.autoPlay=!this.autoPlay;
      if(this.autoPlay){ btnAuto.textContent='Auto: ON'; btnAuto.classList.add('auto-on'); this._autoCd=0.4; }
      else { btnAuto.textContent='Auto: OFF'; btnAuto.classList.remove('auto-on'); }
    }
    startAuto(){ this.autoPlay=true; btnAuto.textContent='Auto: ON'; btnAuto.classList.add('auto-on'); this._autoCd=0.4; }
    stopAuto(){ this.autoPlay=false; btnAuto.textContent='Auto: OFF'; btnAuto.classList.remove('auto-on'); }
    maybeAuto(dt){ if(!this.autoPlay) return; this._autoCd-=dt; if(this._autoCd>0) return;
      if(this.state==='rolling'){ this._autoCd=0.2; return; }
      this._autoCd=0.95; this.roll(); }
    update(dt){
      if(this.tumble>0){ this.tumble-=dt;
        if(this.tumble>0){ this.d1=1+rint(6); this.d2=1+rint(6); }
        else { this.d1=this.lock1; this.d2=this.lock2; this._finishRoll(this.d1+this.d2); }
      }
      if(this.flash>0) this.flash-=dt;
      this.maybeAuto(dt);
    }
    _beginRollValues(){}
    tick(ts){
      const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016);
      this._last=ts!==undefined?ts:this._last;
      this.time+=dt;
      this.update(dt);
      this.draw();
      requestAnimationFrame(this.tick.bind(this));
    }
    draw(){
      ctx.clearRect(0,0,W,H);
      // table felt glow
      const g=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,W*0.7);
      g.addColorStop(0,'#2a1248'); g.addColorStop(1,'#160a26'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      // point indicator
      ctx.textAlign='center';
      ctx.font='bold 15px Segoe UI, sans-serif';
      ctx.fillStyle=this.point?('#ffd54a'):('#7a5fa0');
      ctx.fillText(this.point?('POINT  '+this.point):'PASS LINE', W/2, 30);
      // dice
      const sz=78, gap=34, total=sz*2+gap, x0=(W-total)/2, y=H/2-10;
      this._die(x0, y, sz, this.d1, '#b15dff', '#5de1ff');
      this._die(x0+sz+gap, y, sz, this.d2, '#5de1ff', '#b15dff');
      // sum
      const sum=this.d1+this.d2;
      ctx.font='bold 22px Segoe UI, sans-serif'; ctx.fillStyle='#f0e6ff';
      ctx.fillText(this.tumble>0?('…'):(String(sum)), W/2, y+sz+30);
      // banner flash
      if(this.flash>0){ ctx.save(); ctx.globalAlpha=Math.min(1,this.flash*1.3);
        ctx.font='bold 40px Segoe UI, sans-serif'; ctx.fillStyle=this.flashColor;
        ctx.shadowColor=this.flashColor; ctx.shadowBlur=24; ctx.fillText(this.banner, W/2, H/2); ctx.restore(); }
    }
    _die(x,y,s,v,c1,c2){
      const r=14;
      ctx.save();
      ctx.shadowColor=c1; ctx.shadowBlur=18;
      const grad=ctx.createLinearGradient(x,y,x+s,y+s); grad.addColorStop(0,c1); grad.addColorStop(1,c2);
      this._round(x,y,s,s,r); ctx.fillStyle=grad; ctx.fill();
      ctx.shadowBlur=0;
      const pip=(cx,cy)=>{ ctx.beginPath(); ctx.arc(cx,cy,7,0,7); ctx.fillStyle='#160826'; ctx.fill(); };
      const u=s/4;
      const P={ tl:[x+u,y+u], tr:[x+3*u,y+u], ml:[x+u,y+2*u], mr:[x+3*u,y+2*u], c:[x+2*u,y+2*u], bl:[x+u,y+3*u], br:[x+3*u,y+3*u] };
      if(v===1) pip(...P.c);
      else if(v===2){ pip(...P.tl); pip(...P.br); }
      else if(v===3){ pip(...P.tl); pip(...P.c); pip(...P.br); }
      else if(v===4){ pip(...P.tl); pip(...P.tr); pip(...P.bl); pip(...P.br); }
      else if(v===5){ pip(...P.tl); pip(...P.tr); pip(...P.c); pip(...P.bl); pip(...P.br); }
      else { pip(...P.tl); pip(...P.tr); pip(...P.ml); pip(...P.mr); pip(...P.bl); pip(...P.br); }
      ctx.restore();
    }
    _round(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }

  // canvas tap to roll
  canvas.addEventListener('pointerdown', ()=>{ if(!game.autoPlay) game.roll(); });

  window.game=new Craps();
})();
</script>
</body>
</html>
