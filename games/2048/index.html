<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a1a" />
<title>2048 · Neon</title>
<style>
  :root {
    --bg: #0a0a1a;
    --surface: #12122a;
    --board: #1a1a3a;
    --text: #e0e0f0;
    --muted: #8888aa;
    --accent: #7c5cfc;
    --accent-glow: #7c5cfc66;
    --danger: #ff4d6a;
    --success: #4dff91;
    --gold: #ffd700;
    --cell-size: 80px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 50%, #1a1040 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, #102040 0%, transparent 60%),
      radial-gradient(ellipse at 50% 80%, #1a1040 0%, transparent 60%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  .container {
    width: 100%;
    max-width: 440px;
    padding: 16px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 12px;
  }
  .title-block h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent), #b388ff, #7c5cfc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .title-block .sub {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 2px;
  }

  /* Score cards */
  .score-panel { display: flex; gap: 8px; }
  .score-card {
    background: var(--surface);
    border: 1px solid #ffffff0a;
    border-radius: 10px;
    padding: 6px 14px;
    text-align: center;
    min-width: 60px;
  }
  .score-card .label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .score-card .value {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .score-card.best .value { color: var(--gold); }

  /* Board */
  .board-wrap {
    position: relative;
    background: var(--surface);
    border: 1px solid #ffffff0a;
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 0 40px #00000030, 0 0 80px var(--accent-glow);
  }
  /* touch-action is NOT inherited — must cover children (board/cell/tile)
     so swiping on a tile doesn't fall back to browser pan/scroll. */
  .board-wrap, .board-wrap * {
    touch-action: none;
    -webkit-touch-callout: none;
  }
  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
    aspect-ratio: 1;
  }
  .cell {
    background: var(--board);
    border-radius: 10px;
    position: relative;
    aspect-ratio: 1;
  }

  /* Tiles — outer handles position (translate), inner handles visuals */
  .tile {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--cell-size);
    height: var(--cell-size);
    transition: transform 0.15s cubic-bezier(0.25, 0.7, 0.3, 1);
    will-change: transform;
    z-index: 2;
    pointer-events: none;
  }
  .tile-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: 800;
    font-size: calc(var(--cell-size) * 0.44);
    line-height: 1;
  }
  .tile.merged .tile-inner { animation: merge-pop 0.18s ease-out; }
  .tile.new-tile .tile-inner { animation: spawn-in 0.16s ease-out; }

  @keyframes merge-pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.24); }
    100% { transform: scale(1); }
  }
  @keyframes spawn-in {
    0%   { transform: scale(0); opacity: 0; }
    60%  { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes pulse-glow {
    0%,100% { box-shadow: 0 0 8px var(--glow, transparent); }
    50%     { box-shadow: 0 0 20px var(--glow, transparent), 0 0 40px var(--glow, transparent); }
  }

  /* Tile colors (applied to .tile-inner) */
  .t-2    { background: #2a2a4a; color: #c0c0e0; --glow: #2a2a4a; }
  .t-4    { background: #2a3a5a; color: #b8d0f0; --glow: #2a3a5a; }
  .t-8    { background: #3a4a7a; color: #a0c8ff; --glow: #3a5aaa; }
  .t-16   { background: #4a3a6a; color: #b8a0f0; --glow: #4a3a7a; }
  .t-32   { background: #6a3a5a; color: #f0a0c0; --glow: #6a3a6a; }
  .t-64   { background: #7a2a3a; color: #ff90a0; --glow: #7a2a4a; }
  .t-128  { background: #6a5a1a; color: #ffe090; --glow: #7a6a2a; font-size: calc(var(--cell-size) * 0.34); animation: pulse-glow 2s infinite; }
  .t-256  { background: #5a6a1a; color: #d0f090; --glow: #6a7a2a; font-size: calc(var(--cell-size) * 0.34); animation: pulse-glow 2s infinite; }
  .t-512  { background: #1a6a4a; color: #90ffc0; --glow: #2a7a5a; font-size: calc(var(--cell-size) * 0.34); animation: pulse-glow 1.5s infinite; }
  .t-1024 { background: #1a4a6a; color: #90d0ff; --glow: #2a5a8a; font-size: calc(var(--cell-size) * 0.30); animation: pulse-glow 1.2s infinite; }
  .t-2048 { background: linear-gradient(135deg, #7c5cfc, #b388ff); color: #fff; --glow: #7c5cfc; font-size: calc(var(--cell-size) * 0.30); animation: pulse-glow 0.8s infinite; }
  .t-4096 { background: linear-gradient(135deg, #ff4d6a, #ff7b93); color: #fff; --glow: #ff4d6a; font-size: calc(var(--cell-size) * 0.28); animation: pulse-glow 0.6s infinite; }
  .t-8192 { background: linear-gradient(135deg, #ffd700, #ffed4a); color: #1a1a2e; --glow: #ffd700; font-size: calc(var(--cell-size) * 0.28); animation: pulse-glow 0.5s infinite; }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .btn {
    flex: 1;
    min-width: 90px;
    padding: 12px 16px;
    border: 1px solid #ffffff12;
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    text-align: center;
  }
  .btn:hover { background: #ffffff10; border-color: #ffffff20; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #8b6ffc; box-shadow: 0 0 20px var(--accent-glow); }
  .btn.auto-on {
    background: var(--success);
    border-color: var(--success);
    color: #0a0a1a;
    animation: pulse-glow 2s infinite;
    --glow: #4dff9166;
  }
  .btn.auto-on:hover { box-shadow: 0 0 24px #4dff9188; }

  /* Overlays */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.35s;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }
  .overlay-bg {
    position: absolute;
    inset: 0;
    background: #0a0a1aee;
    backdrop-filter: blur(4px);
    border-radius: 14px;
  }
  .overlay-content { position: relative; text-align: center; z-index: 1; }
  .overlay-content h2 { font-size: 2rem; font-weight: 800; margin-bottom: 6px; }
  .overlay-content p { color: var(--muted); margin-bottom: 16px; font-size: 0.9rem; }
  .win h2 { color: var(--gold); }
  .lose h2 { color: var(--danger); }

  /* AI indicator */
  .ai-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--muted);
    justify-content: center;
    min-height: 20px;
  }
  .ai-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    animation: blink 0.8s infinite;
  }
  @keyframes blink {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: 0.4; transform: scale(0.7); }
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .stats-bar span {
    background: var(--surface);
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid #ffffff08;
  }

  @media (max-width: 400px) {
    .title-block h1 { font-size: 1.5rem; }
    .btn { padding: 10px 12px; font-size: 0.78rem; }
    .board { gap: 5px; }
    .board-wrap { padding: 7px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>2048</h1>
      <div class="sub">N E O N &nbsp; E D I T I O N</div>
    </div>
    <div class="score-panel">
      <div class="score-card">
        <div class="label">Score</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-card best">
        <div class="label">Best</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="board-wrap" id="board-wrap">
    <div class="board" id="board"><!-- cells + tiles injected by JS --></div>

    <div class="overlay win" id="overlay-win">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2>You Win!</h2>
        <p>You reached 2048!</p>
        <button class="btn primary" onclick="game.continueGame()">Continue</button>
      </div>
    </div>

    <div class="overlay lose" id="overlay-lose">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2>Game Over</h2>
        <p>No more moves available</p>
        <button class="btn primary" onclick="game.restart()">Try Again</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>

  <div class="ai-indicator" id="ai-indicator" style="display:none">
    <div class="ai-dot"></div>
    <span id="ai-status">AI thinking...</span>
  </div>

  <div class="stats-bar">
    <span id="moves-stat">Moves: 0</span>
    <span id="merges-stat">Merges: 0</span>
    <span id="highest-stat">Max: 2</span>
  </div>
</div>

<script>
(function() {
  'use strict';

  const SIZE = 4;
  const SLIDE_MS = 150;

  // ==================== PURE GAME LOGIC ====================

  // Compute a move and return resulting grid + per-tile movement map (for animation).
  function computeMove(grid, dir) {
    // dir: 0=up, 1=right, 2=down, 3=left
    const newGrid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
    const movements = [];
    let scoreGain = 0;
    let changed = false;

    for (let line = 0; line < SIZE; line++) {
      const tiles = [];
      if (dir === 3) { // left: row, left→right
        for (let c = 0; c < SIZE; c++) if (grid[line][c] !== 0) tiles.push({ v: grid[line][c], r: line, c });
      } else if (dir === 1) { // right: row, right→left
        for (let c = SIZE - 1; c >= 0; c--) if (grid[line][c] !== 0) tiles.push({ v: grid[line][c], r: line, c });
      } else if (dir === 0) { // up: col, top→bottom
        for (let r = 0; r < SIZE; r++) if (grid[r][line] !== 0) tiles.push({ v: grid[r][line], r, c: line });
      } else { // down: col, bottom→top
        for (let r = SIZE - 1; r >= 0; r--) if (grid[r][line] !== 0) tiles.push({ v: grid[r][line], r, c: line });
      }

      const result = [];
      let i = 0;
      while (i < tiles.length) {
        if (i < tiles.length - 1 && tiles[i].v === tiles[i + 1].v) {
          result.push({ v: tiles[i].v * 2, merged: true, from: tiles[i], absorb: tiles[i + 1] });
          scoreGain += tiles[i].v * 2;
          i += 2;
        } else {
          result.push({ v: tiles[i].v, merged: false, from: tiles[i] });
          i++;
        }
      }

      let pos = 0;
      for (const t of result) {
        let toR, toC;
        if (dir === 3)      { toR = line; toC = pos; }
        else if (dir === 1) { toR = line; toC = SIZE - 1 - pos; }
        else if (dir === 0) { toR = pos; toC = line; }
        else                { toR = SIZE - 1 - pos; toC = line; }

        newGrid[toR][toC] = t.v;
        movements.push({ fromR: t.from.r, fromC: t.from.c, toR, toC, merged: t.merged, newVal: t.v });
        if (t.absorb) {
          movements.push({ fromR: t.absorb.r, fromC: t.absorb.c, toR, toC, absorbed: true, newVal: t.absorb.v });
        }
        pos++;
      }
    }

    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (newGrid[r][c] !== grid[r][c]) changed = true;

    return { newGrid, scoreGain, changed, movements };
  }

  function isGameOver(grid) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) return false;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return false;
        if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return false;
      }
    return true;
  }

  function evaluateBoard(grid) {
    let emptyCount = 0, maxTile = 0;

    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) emptyCount++;
        if (grid[r][c] > maxTile) maxTile = grid[r][c];
      }

    const weights = [
      [20, 16, 12, 8],
      [16, 12, 8, 6],
      [12, 8, 6, 4],
      [8, 6, 4, 2]
    ];
    let monoScore = 0;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        monoScore += Math.log2(grid[r][c] || 1) * weights[r][c];

    let cornerBonus = 0;
    if (grid[3][3] === maxTile) cornerBonus = Math.log2(maxTile) * 200;
    else if (grid[3][0] === maxTile) cornerBonus = Math.log2(maxTile) * 80;
    else if (grid[0][3] === maxTile) cornerBonus = Math.log2(maxTile) * 40;

    let smoothPenalty = 0;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) continue;
        if (c < SIZE - 1 && grid[r][c + 1] !== 0)
          smoothPenalty += Math.abs(Math.log2(grid[r][c]) - Math.log2(grid[r][c + 1]));
        if (r < SIZE - 1 && grid[r + 1][c] !== 0)
          smoothPenalty += Math.abs(Math.log2(grid[r][c]) - Math.log2(grid[r + 1][c]));
      }

    return monoScore * 10 + emptyCount * 20000 + cornerBonus - smoothPenalty * 5;
  }

  // ==================== GAME ENGINE ====================

  class Game2048 {
    constructor() {
      this.grid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
      this.tiles = new Map();      // id -> { id, value, row, col, el, inner, absorbed, pendingMerge }
      this.tileGrid = Array.from({length: SIZE}, () => Array(SIZE).fill(null));
      this.nextTileId = 0;
      this.score = 0;
      this.bestScore = parseInt(localStorage.getItem('best2048') || '0');
      this.moves = 0;
      this.merges = 0;
      this.highest = 2;
      this.won = false;
      this.over = false;
      this.autoPlay = false;
      this.autoTimer = null;
      this.isMoving = false;
      this.cellSize = 80;
      this.gap = 8;

      this.buildBoard();
      this.updateMetrics();
      this.updateBest();
      this.spawnTile();
      this.spawnTile();
      this.updateUI();
      this.bindInput();

      window.addEventListener('resize', () => this.onResize());
    }

    buildBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          board.appendChild(cell);
        }
    }

    updateMetrics() {
      const board = document.getElementById('board');
      const cell = board.querySelector('.cell');
      this.cellSize = cell ? cell.offsetWidth : 80;
      const styles = getComputedStyle(board);
      this.gap = parseInt(styles.gap) || 8;
      board.style.setProperty('--cell-size', this.cellSize + 'px');
    }

    posFor(r, c) {
      return {
        x: c * (this.cellSize + this.gap),
        y: r * (this.cellSize + this.gap)
      };
    }

    tileClass(value) {
      return value <= 8192 ? 't-' + value : 't-8192';
    }

    createTileEl(value, r, c) {
      const el = document.createElement('div');
      el.className = 'tile';
      const inner = document.createElement('div');
      inner.className = 'tile-inner ' + this.tileClass(value);
      inner.textContent = this.formatNum(value);
      el.appendChild(inner);

      const p = this.posFor(r, c);
      el.style.width = this.cellSize + 'px';
      el.style.height = this.cellSize + 'px';
      el.style.transform = `translate(${p.x}px, ${p.y}px)`;
      document.getElementById('board').appendChild(el);
      return { el, inner };
    }

    spawnTile() {
      const empty = [];
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (this.grid[r][c] === 0) empty.push([r, c]);
      if (empty.length === 0) return false;

      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      const val = Math.random() < 0.9 ? 2 : 4;
      this.grid[r][c] = val;

      const id = this.nextTileId++;
      const { el, inner } = this.createTileEl(val, r, c);
      el.classList.add('new-tile');
      setTimeout(() => el.classList.remove('new-tile'), 220);

      this.tiles.set(id, { id, value: val, row: r, col: c, el, inner });
      this.tileGrid[r][c] = id;
      if (val > this.highest) this.highest = val;
      return true;
    }

    move(dir) {
      if (this.isMoving || this.over) return false;

      const { newGrid, scoreGain, changed, movements } = computeMove(this.grid, dir);
      if (!changed) return false;

      this.isMoving = true;
      this.grid = newGrid;
      this.score += scoreGain;
      this.moves++;

      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (this.grid[r][c] > this.highest) this.highest = this.grid[r][c];

      // Phase 1: slide every tile to its target position
      const oldTileGrid = this.tileGrid;
      this.tileGrid = Array.from({length: SIZE}, () => Array(SIZE).fill(null));

      for (const m of movements) {
        const tileId = oldTileGrid[m.fromR][m.fromC];
        if (tileId == null) continue;
        const tile = this.tiles.get(tileId);
        if (!tile) continue;

        tile.row = m.toR;
        tile.col = m.toC;

        if (m.absorbed) {
          tile.absorbed = true;
        } else {
          this.tileGrid[m.toR][m.toC] = tileId;
          if (m.merged) tile.pendingMerge = m.newVal;
        }
        const p = this.posFor(m.toR, m.toC);
        tile.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
      }

      this.updateUI();

      // Phase 2: after the slide, resolve merges + spawn a tile
      setTimeout(() => {
        // Remove absorbed tiles
        for (const [id, tile] of this.tiles) {
          if (tile.absorbed) {
            tile.el.remove();
            this.tiles.delete(id);
          }
        }
        // Apply pending merges (update value + pop animation)
        for (const [, tile] of this.tiles) {
          if (tile.pendingMerge) {
            const v = tile.pendingMerge;
            tile.value = v;
            tile.pendingMerge = null;
            tile.inner.textContent = this.formatNum(v);
            tile.inner.className = 'tile-inner ' + this.tileClass(v);
            tile.merges = (tile.merges || 0) + 1;
            tile.el.classList.remove('merged');
            void tile.el.offsetWidth; // force reflow so the animation restarts
            tile.el.classList.add('merged');
            setTimeout(() => tile.el.classList.remove('merged'), 200);
            this.merges++;
          }
        }

        this.spawnTile();
        this.updateBest();

        if (!this.won && this.highest >= 2048) {
          this.won = true;
          document.getElementById('overlay-win').classList.add('active');
        }
        if (isGameOver(this.grid)) {
          this.over = true;
          if (this.autoPlay) this.stopAuto();
          document.getElementById('overlay-lose').classList.add('active');
        }

        this.isMoving = false;
      }, SLIDE_MS + 10);

      return true;
    }

    continueGame() {
      document.getElementById('overlay-win').classList.remove('active');
    }

    restart() {
      this.stopAuto();
      this.grid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
      document.getElementById('board').querySelectorAll('.tile').forEach(t => t.remove());
      this.tiles.clear();
      this.tileGrid = Array.from({length: SIZE}, () => Array(SIZE).fill(null));
      this.nextTileId = 0;
      this.score = 0;
      this.moves = 0;
      this.merges = 0;
      this.highest = 2;
      this.won = false;
      this.over = false;
      this.isMoving = false;
      document.getElementById('overlay-win').classList.remove('active');
      document.getElementById('overlay-lose').classList.remove('active');
      document.getElementById('ai-indicator').style.display = 'none';
      this.updateMetrics();
      this.spawnTile();
      this.spawnTile();
      this.updateUI();
    }

    updateBest() {
      if (this.score > this.bestScore) {
        this.bestScore = this.score;
        localStorage.setItem('best2048', this.bestScore);
      }
    }

    // ---- AI ----
    findBestMove() {
      let bestDir = -1;
      let bestScore = -Infinity;
      for (let dir = 0; dir < 4; dir++) {
        const { newGrid, scoreGain, changed } = computeMove(this.grid, dir);
        if (!changed) continue;
        const total = evaluateBoard(newGrid) + scoreGain * 500;
        if (total > bestScore) { bestScore = total; bestDir = dir; }
      }
      return bestDir;
    }

    toggleAuto() {
      if (this.autoPlay) this.stopAuto();
      else { if (this.over) this.restart(); this.startAuto(); }
    }

    startAuto() {
      this.autoPlay = true;
      const btn = document.getElementById('btn-auto');
      btn.textContent = 'Auto: ON';
      btn.classList.add('auto-on');
      document.getElementById('ai-indicator').style.display = 'flex';
      this.autoStep();
    }

    stopAuto() {
      this.autoPlay = false;
      if (this.autoTimer) { clearTimeout(this.autoTimer); this.autoTimer = null; }
      const btn = document.getElementById('btn-auto');
      btn.textContent = 'Auto: OFF';
      btn.classList.remove('auto-on');
      document.getElementById('ai-indicator').style.display = 'none';
    }

    autoStep() {
      if (!this.autoPlay || this.over) { if (this.over) this.stopAuto(); return; }

      const dir = this.findBestMove();
      if (dir === -1) { this.stopAuto(); return; }

      const dirNames = ['Up', 'Right', 'Down', 'Left'];
      document.getElementById('ai-status').textContent = `AI: ${dirNames[dir]} → ${this.score} pts`;

      this.move(dir);

      this.autoTimer = setTimeout(() => {
        if (!this.over && this.autoPlay) this.autoStep();
        else if (this.over) { this.stopAuto(); document.getElementById('ai-status').textContent = 'Game Over'; }
      }, SLIDE_MS + 160 + Math.random() * 60);
    }

    // ---- Rendering helpers ----
    formatNum(n) {
      if (n < 10000) return n;
      if (n < 1000000) return (n / 1000).toFixed(1) + 'K';
      return (n / 1000000).toFixed(1) + 'M';
    }

    updateUI() {
      document.getElementById('score').textContent = this.score;
      document.getElementById('best').textContent = this.bestScore;
      document.getElementById('moves-stat').textContent = 'Moves: ' + this.moves;
      document.getElementById('merges-stat').textContent = 'Merges: ' + this.merges;
      document.getElementById('highest-stat').textContent = 'Max: ' + this.highest;
    }

    onResize() {
      this.updateMetrics();
      for (const [, tile] of this.tiles) {
        tile.el.style.width = this.cellSize + 'px';
        tile.el.style.height = this.cellSize + 'px';
        const p = this.posFor(tile.row, tile.col);
        tile.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
      }
    }

    // ---- Input ----
    bindInput() {
      document.addEventListener('keydown', (e) => {
        if (this.autoPlay || this.over) return;
        let dir = -1;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dir = 0;
        else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dir = 1;
        else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dir = 2;
        else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dir = 3;
        if (dir !== -1) { e.preventDefault(); this.move(dir); }
      });

      // ---- Pointer: unified mouse + touch + pen swipe ----
      const wrap = document.getElementById('board-wrap');
      let sx = 0, sy = 0, tracking = false, fired = false, activeId = null;
      const THRESHOLD = 22;          // px to register a swipe (lower = more sensitive)

      const handleSwipe = (dx, dy) => {
        const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
        const moved = this.move(dir);
        if (moved && navigator.vibrate) navigator.vibrate(12);
        return moved;
      };

      wrap.addEventListener('pointerdown', (e) => {
        if (this.autoPlay || this.over) return;
        if (activeId !== null) return;          // ignore extra fingers
        activeId = e.pointerId;
        sx = e.clientX; sy = e.clientY;
        tracking = true; fired = false;
        try { wrap.setPointerCapture(e.pointerId); } catch (_) {}
        e.preventDefault();
      });

      wrap.addEventListener('pointermove', (e) => {
        if (!tracking || fired || this.autoPlay || this.over) return;
        if (e.pointerId !== activeId) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        e.preventDefault();                      // extra guard vs page scroll/rubber-band
        if (Math.max(Math.abs(dx), Math.abs(dy)) >= THRESHOLD) {
          fired = true;                         // fire once as soon as intent is clear
          handleSwipe(dx, dy);
        }
      });

      const endPointer = (e) => {
        if (e.pointerId !== activeId) return;
        activeId = null;
        if (!tracking) return;
        tracking = false;
        if (fired || this.autoPlay || this.over) return;
        // Fallback: fast flick that never crossed threshold mid-move
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (Math.max(Math.abs(dx), Math.abs(dy)) >= THRESHOLD) handleSwipe(dx, dy);
      };
      wrap.addEventListener('pointerup', endPointer);
      wrap.addEventListener('pointercancel', endPointer);

    }
  }

  window.game = new Game2048();
})();
</script>
