<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹跑酷 · Neon Runner</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#4dff91; --accent-glow:#4dff9166; --gold:#ffd54a; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 50% 0%, #102a2a 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #2a1240 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#4dff91,#4dfff0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:62px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:11px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:700; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#06120a; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#06120a; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹跑酷</h1><div class="sub">N E O N &nbsp; R U N N E R</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Dist</div><div class="value" id="dist">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="420" height="320"></canvas></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">Restart</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">点屏幕/空格跳起，越过红色尖刺</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const distEl=document.getElementById('dist'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  const G=2200, JUMP=-820;

  class Runner {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0;
      this.best=parseInt(localStorage.getItem('runnerBest')||'0'); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); if(!this.autoPlay&&!this.over) this.jump(); });
      window.addEventListener('keydown',(e)=>{ if((e.key===' '||e.key==='ArrowUp')&&!this.autoPlay&&!this.over){ e.preventDefault(); this.jump(); } });
      this.restart();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(rect.width||420,420)); const dpr=window.devicePixelRatio||1;
      this.W=w; this.H=w*320/420; canvas.width=w*dpr; canvas.height=this.H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); this.groundY=this.H*0.82; }
    restart(){ this.stopAuto(); this.over=false; this.dist=0; this.speed=240; this.px=this.W*0.26; this.pw=30; this.ph=34; this.py=this.groundY-this.ph; this.vy=0; this.onGround=true; this.obs=[]; this.spawnT=0; this.stars=[]; for(let i=0;i<40;i++) this.stars.push({x:Math.random()*this.W,y:Math.random()*this.groundY,r:Math.random()*1.6+0.4,s:Math.random()*40+20}); distEl.textContent=0; }
    jump(){ if(this.onGround){ this.vy=JUMP; this.onGround=false; } }
    spawn(){ const h=24+Math.random()*Math.floor(this.H*0.13); const w=18+Math.random()*16; this.obs.push({x:this.W+20, w, h}); }
    update(dt){
      if(this.over) return;
      this.dist+=this.speed*dt; this.speed=240+Math.min(this.dist*0.02, 360);
      distEl.textContent=Math.floor(this.dist/10);
      // physics
      this.vy+=G*dt; this.py+=this.vy*dt;
      if(this.py>=this.groundY-this.ph){ this.py=this.groundY-this.ph; this.vy=0; this.onGround=true; }
      // obstacles
      this.spawnT-=dt; if(this.spawnT<=0){ this.spawn(); const gap=Math.max(0.9, 1.9 - this.dist/4000); this.spawnT=gap+Math.random()*0.5; }
      for(const o of this.obs) o.x-=this.speed*dt;
      this.obs=this.obs.filter(o=>o.x+o.w>-10);
      // collision
      const pl=this.px, pr=this.px+this.pw, pt=this.py, pb=this.py+this.ph;
      for(const o of this.obs){ const ol=o.x, or=o.x+o.w, ot=this.groundY-o.h, ob=this.groundY; if(pr>ol&&pl<or&&pb>ot&&pt<ob){ this.gameOver(); return; } }
      // auto
      if(this.autoPlay && this.onGround){
        for(const o of this.obs){ const ol=o.x; if(ol> this.px+this.pw-6 && ol < this.px+this.pw+80){ this.jump(); break; } }
      }
      // stars
      for(const s of this.stars){ s.x-=s.s*dt; if(s.x<0){ s.x=this.W; s.y=Math.random()*this.groundY; } }
    }
    gameOver(){ this.over=true; const d=Math.floor(this.dist/10); if(d>this.best){ this.best=d; localStorage.setItem('runnerBest',String(this.best)); bestEl.textContent=this.best; } statusEl.textContent='💥 撞击！距离 '+d; if(this.autoPlay) this._autoNext(); }
    _autoNext(){ this.stopAuto(); this.restart(); this.startAuto(); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this._autoProgress=0; }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; if(this.autoPlay) this._autoProgress=Math.floor(this.dist/10); this.update(dt); this.draw(); }catch(err){ console.error(err); } }
    draw(){ const W=this.W,H=this.H; ctx.clearRect(0,0,W,H);
      for(const s of this.stars){ ctx.fillStyle='#ffffff44'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); }
      // ground
      ctx.strokeStyle='#4dff91'; ctx.lineWidth=3; ctx.shadowColor='#4dff91'; ctx.shadowBlur=12; ctx.beginPath(); ctx.moveTo(0,this.groundY); ctx.lineTo(W,this.groundY); ctx.stroke(); ctx.shadowBlur=0;
      // obstacles
      for(const o of this.obs){ const x=o.x,y=this.groundY-o.h; ctx.save(); ctx.shadowColor='#ff5d6a'; ctx.shadowBlur=12; ctx.fillStyle='#ff5d6a'; ctx.beginPath(); const n=4; for(let i=0;i<=n;i++){ const sx=x+o.w*i/n; if(i%2===0) ctx.lineTo(sx,y); else ctx.lineTo(sx+(o.w/n)/2,this.groundY); } ctx.closePath(); ctx.fill(); ctx.restore(); }
      // player
      const x=this.px,y=this.py; ctx.save(); ctx.shadowColor='#4dff91'; ctx.shadowBlur=16; ctx.fillStyle='#4dff91'; this.rr(x,y,this.pw,this.ph,9); ctx.fill(); ctx.restore();
      ctx.fillStyle='#0a0a1a'; ctx.fillRect(x+this.pw*0.55,y+8,5,5);
      if(this.over){ ctx.save(); ctx.shadowColor='#ff5d6a'; ctx.shadowBlur=18; ctx.fillStyle='#ff5d6a'; ctx.font='bold '+(W*0.09)+'px Segoe UI'; ctx.textAlign='center'; ctx.fillText('GAME OVER', W/2, H/2); ctx.restore(); }
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Runner();
})();
</script>
</body>
</html>
