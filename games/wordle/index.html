<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wordle</title>
<style>
  :root{
    --bg:#0a0f1a; --surface:#111a2b; --text:#e7edf7; --muted:#8090a8;
    --accent:#5ce1a8; --accent2:#ffd76a; --accent-glow:#5ce1a866; --danger:#ff5d6c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
    margin:0;background:radial-gradient(1200px 800px at 50% -10%,#13203a 0%,var(--bg) 55%);
    color:var(--text);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    -webkit-tap-highlight-color:transparent;
  }
  .shell{width:min(94vw,460px);display:flex;flex-direction:column;gap:10px;padding:14px 12px 18px;align-items:center;}
  header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .logo{font-weight:800;font-size:26px;letter-spacing:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 22px var(--accent-glow);}
  .scores{display:flex;gap:8px;}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
    border:1px solid rgba(128,144,168,.18);border-radius:14px;padding:6px 12px;text-align:center;
    min-width:62px;backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(92,225,168,.05) inset;}
  .card .lbl{font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
  .card .val{font-size:20px;font-weight:800;color:var(--text);}
  .card.win .val{color:var(--accent);text-shadow:0 0 12px var(--accent-glow);}
  .card.streak .val{color:var(--accent2);text-shadow:0 0 12px #ffd76a55;}
  .board-wrap{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    border-radius:18px;position:relative;
    background:linear-gradient(180deg,rgba(17,26,43,.6),rgba(10,15,26,.4));
    border:1px solid rgba(128,144,168,.14);box-shadow:0 10px 40px rgba(0,0,0,.45),0 0 0 1px rgba(92,225,168,.04) inset;}
  .board-wrap,.board-wrap *{touch-action:none;}
  #game{width:100%;height:100%;display:block;}
  .keyboard{width:100%;display:flex;flex-direction:column;gap:6px;}
  .krow{display:flex;gap:5px;justify-content:center;}
  .key{flex:1;min-width:0;height:46px;border:none;border-radius:9px;cursor:pointer;
    background:linear-gradient(180deg,#1b2740,#141d31);color:var(--text);
    font-weight:700;font-size:14px;letter-spacing:.5px;
    border:1px solid rgba(128,144,168,.18);box-shadow:0 2px 0 rgba(0,0,0,.35);
    transition:transform .06s ease,background .2s ease,box-shadow .2s ease,color .2s ease;
    display:flex;align-items:center;justify-content:center;}
  .key:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.35);}
  .key.wide{flex:1.5;font-size:11px;}
  .key.green{background:linear-gradient(180deg,#6cf0b6,#3fbf8c);color:#06140e;
    border-color:#5ce1a8;box-shadow:0 0 14px var(--accent-glow);}
  .key.yellow{background:linear-gradient(180deg,#ffe08a,#e7b94a);color:#1a1405;
    border-color:#ffd76a;box-shadow:0 0 14px #ffd76a55;}
  .key.gray{background:linear-gradient(180deg,#39455f,#2a344a);color:#9aa6bd;
    border-color:#39455f;}
  .controls{width:100%;display:flex;gap:10px;align-items:center;justify-content:center;}
  button.ctrl{flex:1;max-width:200px;height:42px;border-radius:12px;cursor:pointer;
    font-weight:700;font-size:14px;letter-spacing:.5px;border:1px solid rgba(128,144,168,.22);
    background:linear-gradient(180deg,#1b2740,#141d31);color:var(--text);
    transition:transform .06s ease,box-shadow .2s ease;}
  button.ctrl:active{transform:translateY(2px);}
  #btn-auto.on{background:linear-gradient(180deg,#1f5a45,#134034);border-color:var(--accent);
    color:var(--accent);box-shadow:0 0 16px var(--accent-glow);}
  .ai{width:100%;display:flex;align-items:center;gap:10px;justify-content:center;
    font-size:13px;color:var(--muted);min-height:22px;}
  #ai-indicator{width:11px;height:11px;border-radius:50%;background:#39455f;flex:0 0 auto;
    box-shadow:0 0 0 rgba(92,225,168,0);}
  #ai-indicator.active{background:var(--accent);animation:pulse-glow 1.1s infinite;
    box-shadow:0 0 12px var(--accent-glow);}
  #ai-status{letter-spacing:.4px;}
  #ai-status.win{color:var(--accent);} #ai-status.lose{color:var(--danger);}
  .hint{font-size:11px;color:var(--muted);opacity:.8;text-align:center;letter-spacing:.3px;}
  @keyframes pulse-glow{0%{box-shadow:0 0 0 0 var(--accent-glow);}
    70%{box-shadow:0 0 0 9px rgba(92,225,168,0);}100%{box-shadow:0 0 0 0 rgba(92,225,168,0);}}
  @keyframes blink{50%{opacity:.35;}}
  .blink{animation:blink 1s steps(1) infinite;}
</style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="logo">WORDLE</div>
      <div class="scores">
        <div class="card win"><div class="lbl">Won</div><div class="val" id="won">0</div></div>
        <div class="card streak"><div class="lbl">Streak</div><div class="val" id="streak">0</div></div>
        <div class="card"><div class="lbl">Best</div><div class="val" id="best">0</div></div>
      </div>
    </header>

    <div class="board-wrap" id="board-wrap">
      <canvas id="game"></canvas>
    </div>

    <div class="controls">
      <button class="ctrl" id="btn-restart" onclick="game.restart()">New Game</button>
      <button class="ctrl" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
    </div>

    <div class="ai">
      <span id="ai-indicator"></span>
      <span id="ai-status">Ready</span>
    </div>

    <div class="keyboard" id="keyboard"></div>

    <div class="hint">Type or tap letters · Enter to guess · Auto plays itself</div>
  </div>

<script>
const WORDS=["crane","slate","roate","about","above","abuse","actor","acute","admit","adopt","adult","after","again","agent","agree","ahead","alarm","album","alert","alike","alive","allow","alone","along","alter","among","angel","anger","angle","angry","apart","apple","apply","arena","argue","arise","armor","array","arrow","asset","audio","audit","avoid","awake","award","aware","badly","baker","bases","basic","beach","began","begin","begun","being","below","bench","birth","black","blame","blank","blast","blind","block","blood","board","boost","booth","bound","brain","brand","brave","bread","break","breed","brief","bring","broad","broke","brown","build","built","buyer","cable","camera","candy","carry","catch","cause","chain","chair","chaos","charm","chart","chase","cheap","check","chest","chief","child","chili","chill","choir","claim","class","clean","clear","clerk","click","climb","clock","close","cloth","cloud","coach","coast","could","count","court","cover","crack","craft","crash","cream","crime","cross","crowd","crown","curve","cycle","daily","dance","dated","dealt","death","debut","delay","depth","devil","diary","dirty","diver","doing","doubt","dozen","draft","drama","drank","drawn","dream","dress","drill","drink","drive","drove","dying","eager","eagle","early","earth","eight","elite","empty","enemy","enjoy","enter","entry","equal","error","event","every","exact","exist","extra","faith","false","fault","fence","fever","field","final","first","fixed","flame","flash","fleet","flesh","float","flood","floor","flour","fluid","focus","force","forge","forth","forty","forum","found","frame","frank","fraud","fresh","front","frost","fruit","fully","funny","giant","given","glass","globe","glory","grace","grade","grain","grand","grant","grape","grass","grave","great","green","greet","grief","gross","group","grown","guard","guess","guest","guide","happy","harsh","heart","heavy","hence","horse","hotel","house","human","ideal","image","index","inner","input","issue","jeans","joint","judge","juice","label","labor","large","laser","later","laugh","layer","learn","lease","least","leave","legal","lemon","level","light","limit","local","logic","loose","lover","lower","lucky","lunch","magic","major","maker","march","match","maybe","mayor","meant","medal","media","metal","might","minor","minus","mixed","model","money","month","moral","motor","mount","mouse","mouth","movie","music","naked","nerve","never","newly","night","noise","north","notch","novel","nurse","occur","ocean","offer","often","olive","onion","order","other","ought","paint","panel","paper","party","peace","phase","phone","photo","piece","pilot","pitch","place","plain","plane","plant","plate","point","pound","power","press","price","pride","prime","print","prior","prize","proof","proud","prove","queen","quick","quiet","quite","radio","raise","range","rapid","ratio","reach","ready","realm","rebel","refer","relax","relay","reply","right","rigid","river","roman","rough","round","route","royal","rural","salad","scale","scalp","scare","scene","scope","score","sense","serve","setup","seven","shade","shake","shallow","shape","share","sharp","sheep","sheet","shelf","shell","shift","shine","shirt","shock","shoot","shore","short","shown","sight","silly","since","skill","sleep","slice","slide","small","smart","smell","smile","smoke","snack","snake","solar","solid","solve","sorry","sound","south","space","spare","speak","speed","spell","spend","spent","spice","spike","spill","spine","split","spoke","sport","staff","stage","stake","stand","start","state","steam","steel","steep","steer","stick","still","stock","stone","store","storm","story","strip","stuck","study","stuff","style","sugar","suite","super","sweet","table","taken","taste","teach","teeth","theme","there","these","thick","thing","think","third","those","three","threw","throw","thumb","tiger","tight","timer","title","today","token","topic","total","touch","tough","tower","track","trade","trail","train","trait","trash","treat","trend","trial","tribe","trick","tried","tries","truck","truly","trust","truth","twice","under","undue","union","unity","until","upper","upset","urban","usage","usual","vague","valid","value","vapor","vault","venom","verse","video","virus","visit","vital","vocal","voice","waste","watch","water","wheel","where","which","while","white","whole","whose","woman","world","worry","worse","worst","worth","would","wound","write","wrong","yield","young","youth"];

const noopCtx = new Proxy({}, { get: () => () => {} });
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

class G {
  constructor(){
    this.words = WORDS.map(w => w.toUpperCase());
    this.wordSet = new Set(this.words);
    this.freq = this.computeFreq();
    this.cols = 5; this.rows = 6;
    this.stepInterval = 0.6;
    this.autoPlay = false;

    this.canvas = document.getElementById('game');
    this.ctx = (this.canvas && this.canvas.getContext) ? (this.canvas.getContext('2d') || noopCtx) : noopCtx;
    this.wonEl = document.getElementById('won');
    this.streakEl = document.getElementById('streak');
    this.bestEl = document.getElementById('best');
    this.aiStatusEl = document.getElementById('ai-status');
    this.aiIndicatorEl = document.getElementById('ai-indicator');
    this.btnAuto = document.getElementById('btn-auto');

    this.wonCount = 0;
    this.streak = 0;
    this.best = parseInt(store.get('best_wordle') || '0', 10) || 0;

    this._w = this.fitCanvas();
    this.buildKeyboard();
    this.bindEvents();
    this.reset();

    this._last = undefined;
    this._tick = this.tick.bind(this);
    requestAnimationFrame(this._tick);
  }

  fitCanvas(){
    const canvas = this.canvas;
    const w = (canvas.clientWidth || canvas.width || 440);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = w * dpr;
    if (this.ctx && this.ctx.setTransform) this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return w;
  }

  computeFreq(){
    const f = {};
    for (const w of this.words) for (const c of w) f[c] = (f[c] || 0) + 1;
    return f;
  }
  freqScore(w){ let s = 0; for (const c of w) s += this.freq[c] || 0; return s; }

  /* ---------- keyboard (DOM) ---------- */
  buildKeyboard(){
    const layout = [
      ['Q','W','E','R','T','Y','U','I','O','P'],
      ['A','S','D','F','G','H','J','K','L'],
      ['ENTER','Z','X','C','V','B','N','M','BACK']
    ];
    const wrap = document.getElementById('keyboard');
    this.keyEls = {};
    for (const row of layout){
      const r = document.createElement('div'); r.className = 'krow';
      for (const k of row){
        const b = document.createElement('button');
        b.className = 'key';
        if (k === 'ENTER'){ b.textContent = 'Enter'; b.id = 'key-enter'; b.classList.add('wide'); b.onclick = () => this.submit(); }
        else if (k === 'BACK'){ b.innerHTML = '&#9003;'; b.id = 'key-back'; b.classList.add('wide'); b.onclick = () => this.backspace(); }
        else { b.textContent = k; b.id = 'key-' + k; b.onclick = () => this.typeLetter(k); }
        r.appendChild(b);
        this.keyEls[k] = b;
      }
      wrap.appendChild(r);
    }
  }
  updateKeyboard(){
    for (const ch in this.keyEls){
      if (ch.length === 1){
        const st = this.status[ch];
        this.keyEls[ch].className = 'key' + (st ? (' ' + st) : '');
      }
    }
  }

  bindEvents(){
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const k = e.key;
      if (k === 'Enter'){ e.preventDefault(); this.submit(); }
      else if (k === 'Backspace'){ e.preventDefault(); this.backspace(); }
      else if (/^[a-zA-Z]$/.test(k)){ this.typeLetter(k.toUpperCase()); }
    });
    window.addEventListener('resize', () => { this._w = this.fitCanvas(); });
    const bw = document.getElementById('board-wrap');
    if (bw) bw.addEventListener('pointerdown', (e) => { e.preventDefault(); }, { passive:false });
    const kb = document.getElementById('keyboard');
    if (kb) kb.addEventListener('pointerdown', (e) => { e.preventDefault(); }, { passive:false });
  }

  /* ---------- game logic ---------- */
  reset(){
    this.solution = this.words[Math.floor(Math.random() * this.words.length)];
    this.guesses = [];
    this.current = '';
    this.roundOver = false;
    this.won = false;
    this.revealing = null;
    this.typing = null;
    this.autoTimer = 0;
    this.endTimer = 0;
    this.history = [];
    this.status = {};
    this.updateKeyboard();
    this.updateScore();
    if (this.autoPlay) this.setAI('AI guessing…', false);
    else this.setAI('Ready', false);
  }
  restart(){ this.reset(); this.stopAuto(); this.setAI('Idle', false); }

  toggleAuto(){
    this.autoPlay = !this.autoPlay;
    this.updateAutoBtn();
    if (this.autoPlay){
      this.autoTimer = 0;
      if (this.roundOver) this.reset();
      this.setAI('AI guessing…', false);
    } else {
      this.setAI('Auto off', false);
    }
  }
  stopAuto(){
    this.autoPlay = false;
    this.typing = null;
    this.updateAutoBtn();
  }
  updateAutoBtn(){
    if (!this.btnAuto) return;
    this.btnAuto.textContent = 'Auto: ' + (this.autoPlay ? 'ON' : 'OFF');
    this.btnAuto.classList.toggle('on', this.autoPlay);
    if (this.aiIndicatorEl) this.aiIndicatorEl.classList.toggle('active', this.autoPlay);
  }
  setAI(text, done){
    if (!this.aiStatusEl) return;
    this.aiStatusEl.textContent = text;
    this.aiStatusEl.classList.remove('win','lose','blink');
    if (done) this.aiStatusEl.classList.add('blink');
  }
  updateScore(){
    if (this.wonEl) this.wonEl.textContent = this.wonCount;
    if (this.streakEl) this.streakEl.textContent = this.streak;
    if (this.bestEl) this.bestEl.textContent = this.best;
  }

  typeLetter(ch){
    if (this.revealing || this.roundOver) return;
    if (this.current.length >= this.cols) return;
    this.current += ch;
  }
  backspace(){
    if (this.revealing || this.roundOver) return;
    this.current = this.current.slice(0, -1);
  }
  submit(){
    if (this.revealing || this.typing || this.roundOver) return;
    if (this.current.length !== this.cols) return;
    if (!this.wordSet.has(this.current)) return;
    const colors = this.computeColors(this.current, this.solution);
    this.guesses.push({ word: this.current, colors });
    for (let i = 0; i < this.cols; i++) this.setStatus(this.current[i], colors[i]);
    this.history.push({ word: this.current, colors });
    this.revealing = { row: this.guesses.length - 1, word: this.current, colors, timer: 0, perTile: 0.12, flipDur: 0.3 };
    this.current = '';
    this.updateKeyboard();
  }

  setStatus(ch, c){
    const rank = { green:3, yellow:2, gray:1 }[c] || 0;
    const cur = this.status[ch] ? ({ green:3, yellow:2, gray:1 }[this.status[ch]] || 0) : 0;
    if (rank > cur) this.status[ch] = c;
  }

  computeColors(guess, sol){
    const n = guess.length;
    const res = new Array(n).fill('gray');
    const counts = {};
    for (const ch of sol) counts[ch] = (counts[ch] || 0) + 1;
    for (let i = 0; i < n; i++){
      if (guess[i] === sol[i]){ res[i] = 'green'; counts[guess[i]]--; }
    }
    for (let i = 0; i < n; i++){
      if (res[i] === 'green') continue;
      const ch = guess[i];
      if (counts[ch] > 0){ res[i] = 'yellow'; counts[ch]--; }
    }
    return res;
  }

  /* ---------- AI ---------- */
  consistent(cand, history){
    for (const h of history){
      if (!this.arraysEqual(this.computeColors(h.word, cand), h.colors)) return false;
    }
    return true;
  }
  arraysEqual(a, b){
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  chooseGuess(){
    if (this.history.length === 0) return 'CRANE';
    let cands = this.words.filter(w => this.consistent(w, this.history));
    if (!cands.length) cands = this.words.slice();
    const used = new Set(this.history.map(h => h.word));
    let best = cands[0], bestScore = -1;
    for (const w of cands){
      const dist = new Set(w).size;
      let score = dist * 1000 + this.freqScore(w);
      if (used.has(w)) score -= 50;
      if (score > bestScore){ bestScore = score; best = w; }
    }
    return best;
  }
  doAutoStep(){
    const w = this.chooseGuess();
    if (!w) return;
    this.typing = { word: w, idx: 0, timer: 0, perLetter: 0.1 };
    this.setAI('AI: ' + w, false);
  }

  finishGuess(){
    const last = this.guesses[this.guesses.length - 1];
    if (last.word === this.solution){
      this.won = true; this.roundOver = true; this.endTimer = 0;
      this.streak++; this.wonCount++;
      if (this.streak > this.best){ this.best = this.streak; store.set('best_wordle', this.best); }
      this.updateScore();
      this.setAI('Solved: ' + this.solution + ' ✔', true);
    } else if (this.guesses.length >= this.rows){
      this.won = false; this.roundOver = true; this.endTimer = 0;
      this.streak = 0;
      this.updateScore();
      this.setAI('Answer: ' + this.solution, true);
    } else if (this.autoPlay){
      this.setAI('AI guessing…', false);
    }
    this.updateKeyboard();
  }

  /* ---------- loop ---------- */
  tick(ts){
    const dt = Math.min(0.05, (ts !== undefined) ? ((ts - (this._last || ts)) / 1000) : 0.016);
    this._last = ts;
    this.update(dt);
    this.render();
    requestAnimationFrame(this._tick);
  }

  update(dt){
    if (this.revealing){
      this.revealing.timer += dt;
      if (this.revealing.timer >= this.cols * this.revealing.perTile + this.revealing.flipDur + 0.05){
        this.revealing = null;
        this.finishGuess();
      }
    }
    if (this.typing){
      this.typing.timer += dt;
      while (this.typing.timer >= this.typing.perLetter && this.typing.idx < this.cols){
        this.typing.timer -= this.typing.perLetter;
        this.typeLetter(this.typing.word[this.typing.idx]);
        this.typing.idx++;
      }
      if (this.typing.idx >= this.cols){
        this.typing = null;
        this.submit();
      }
    }
    if (this.autoPlay){
      if (this.roundOver){
        this.endTimer += dt;
        if (this.endTimer >= 1.2) this.reset();
      } else if (!this.revealing && !this.typing){
        this.autoTimer += dt;
        if (this.autoTimer >= this.stepInterval){
          this.autoTimer = 0;
          this.doAutoStep();
        }
      }
    }
  }

  /* ---------- render ---------- */
  colorFor(state){
    switch(state){
      case 'green':  return { fill:'#5ce1a8', stroke:'#5ce1a8', text:'#06140e' };
      case 'yellow': return { fill:'#ffd76a', stroke:'#ffd76a', text:'#1a1405' };
      case 'gray':   return { fill:'#39455f', stroke:'#39455f', text:'#c2ccdd' };
      case 'filled': return { fill:'#16203a', stroke:'rgba(231,237,247,0.5)', text:'#e7edf7' };
      default:      return { fill:'#111a2b', stroke:'rgba(128,144,168,0.25)', text:'#e7edf7' };
    }
  }
  roundRect(x,y,w,h,r){
    const c = this.ctx;
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }
  drawTile(x,y,s,letter,state,scale){
    const ctx = this.ctx;
    scale = scale || 1;
    const cx = x + s/2, cy = y + s/2;
    const col = this.colorFor(state);
    ctx.save();
    ctx.translate(cx,cy); ctx.scale(1, scale); ctx.translate(-cx,-cy);
    if (state === 'green' || state === 'yellow'){
      ctx.shadowColor = state === 'green' ? '#5ce1a8' : '#ffd76a';
      ctx.shadowBlur = 14;
    }
    this.roundRect(x+1, y+1, s-2, s-2, s*0.16);
    ctx.fillStyle = col.fill; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = Math.max(1, s*0.04); ctx.strokeStyle = col.stroke; ctx.stroke();
    if (letter){
      ctx.fillStyle = col.text;
      ctx.font = '700 ' + (s*0.46) + 'px ui-sans-serif,system-ui,Segoe UI,Roboto,Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(letter, cx, cy + s*0.02);
    }
    ctx.restore();
  }
  revealTile(c){
    const rv = this.revealing;
    const tStart = c * rv.perTile;
    const local = rv.timer - tStart;
    if (local <= 0) return { color: 'filled', scale: 1 };
    const p = Math.min(1, local / rv.flipDur);
    const scale = Math.abs(Math.cos(p * Math.PI));
    const color = p >= 0.5 ? rv.colors[c] : 'filled';
    return { color, scale };
  }
  render(){
    const ctx = this.ctx, w = this._w;
    ctx.clearRect(0, 0, w, w);
    const cols = this.cols, rows = this.rows;
    const gap = Math.max(4, w * 0.025);
    const tile = (w - gap * (cols + 1)) / cols;
    const boardH = tile * rows + gap * (rows + 1);
    const x0 = gap, y0 = (w - boardH) / 2;
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const x = x0 + c * (tile + gap), y = y0 + r * (tile + gap);
        let letter = '', state = 'empty', scale = 1;
        if (r < this.guesses.length){
          const g = this.guesses[r];
          letter = g.word[c];
          if (this.revealing && this.revealing.row === r){
            const info = this.revealTile(c);
            state = info.color; scale = info.scale;
          } else {
            state = g.colors[c];
          }
        } else if (r === this.guesses.length){
          letter = this.current[c] || '';
          if (letter) state = 'filled';
        }
        this.drawTile(x, y, tile, letter, state, scale);
      }
    }
  }
}

window.game = new G();
</script>
