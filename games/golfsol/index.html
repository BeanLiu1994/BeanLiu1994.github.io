<title>高尔夫接龙 · Golf Solitaire</title>
<style>

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }

    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;

  .container { width:100%; max-width:520px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }

  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#06201a; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#06201a; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }

.ai-indicator{position:fixed;left:50%;top:8px;transform:translateX(-50%) translateY(-12px);display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;background:rgba(10,14,24,.84);border:1px solid rgba(79,156,255,.55);color:var(--text,#e6e6e6);font-size:.78rem;font-weight:600;letter-spacing:.3px;z-index:60;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 18px rgba(79,156,255,.35);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease,transform .3s ease;pointer-events:none;white-space:nowrap}
.ai-indicator.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent,#4f9cff);box-shadow:0 0 8px var(--accent,#4f9cff);animation:aiPulse .8s infinite}
@keyframes aiPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.55);opacity:.5}}
</style>

    stopAuto(){ this.autoPlay=false; if(this.autoTimer){ clearTimeout(this.autoTimer); this.autoTimer=null; } const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on');
      var __ai=document.getElementById('ai-indicator');if(__ai)__ai.classList.remove('show'); }
    autoStep(){ if(!this.autoPlay||this.over) return;
      if(this._autoMode==='solve' && this._sol){
        if(this._solIdx>=this._sol.length){ this._autoMode='heuristic'; }
        else {
          const m=this._sol[this._solIdx++];
          if(m[0]==='p'){ const i=parseInt(m.slice(1),10); const p=this.piles[i]; if(p.length){ const card=p[p.length-1]; if(this.canMove(card)){ this.found=card; p.pop(); this._autoProgress++; this.checkWin(); if(!this.over) this.status('收入 '+RANKS[card.r]+SUITS[card.s]); } else { this._autoMode='heuristic'; } } else this._autoMode='heuristic'; }
          else { if(this.stock.length){ this.found=this.stock.pop(); this.status('翻牌 → '+RANKS[this.found.r]+SUITS[this.found.s]); } else { this._autoMode='heuristic'; } }
          if(this._autoMode==='solve'){ this.updateUI(); this.autoTimer=setTimeout(()=>this.autoStep(),420); return; }
        }
      }
      let moved=false;
      for(let i=0;i<7;i++){ const p=this.piles[i]; if(p.length){ const card=p[p.length-1]; if(this.canMove(card)){ this.found=card; p.pop(); this._autoProgress++; moved=true; this.checkWin(); if(!this.over) this.status('收入 '+RANKS[card.r]+SUITS[card.s]); break; } } }
      if(!moved){ if(this.stock.length){ this.found=this.stock.pop(); this.status('翻牌 → '+RANKS[this.found.r]+SUITS[this.found.s]); } else { this.over=true; this.status('牌堆空，余 '+this.remaining()+' 张。'); if(this.autoPlay) this.autoNext(); return; } }
      this.updateUI(); this.autoTimer=setTimeout(()=>this.autoStep(),420);
    }
    autoNext(){ this.stopAuto(); this.restart(); this.startAuto(); }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.draw(dt); }catch(err){ console.error(err); } }
    cardW(){ return this.W/7*0.86; } cardH(){ return this.cardW()*1.4; }
    card(x,y,w,h,cd){ ctx.save(); ctx.shadowColor='#00000066'; ctx.shadowBlur=8; ctx.fillStyle='#f7f7ff'; this.rr(x,y,w,h,6); ctx.fill(); ctx.shadowBlur=0; ctx.strokeStyle='#ffffff22'; ctx.lineWidth=1; this.rr(x,y,w,h,6); ctx.stroke(); const red=RED[cd.s]; ctx.fillStyle=red?'#ff5d6a':'#1a1a2e'; ctx.font=`bold ${h*0.26}px system-ui`; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(RANKS[cd.r],x+w*0.1,y+h*0.06); ctx.font=`${h*0.34}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(SUITS[cd.s],x+w/2,y+h*0.56); ctx.restore(); }
    draw(){
      const W=this.W,H=this.H; ctx.clearRect(0,0,W,H); const cw=this.cardW(), ch=this.cardH(), colW=W/7, off=(colW-cw)/2;
      // stock + foundation
      this.card(W*0.04, H*0.04, cw*0.8, ch*0.8, {r:0,s:0}, false);
      ctx.fillStyle='#8a8ab0'; ctx.font=`${cw*0.22}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(this.stock.length, W*0.04+cw*0.4, H*0.04+ch*0.92);
      if(this.found) this.card(W/2-cw/2, H*0.02, cw, ch, this.found, true);
      // piles
      for(let i=0;i<7;i++){ const pile=this.piles[i]; const x=i*colW+off;
        for(let k=0;k<pile.length;k++){ const y=H*0.30 + k*ch*0.28; this.card(x,y,cw,ch,pile[k],true); }
        const top=pile.length?pile[pile.length-1]:null;
        if(top && this.canMove(top)){ const ty=H*0.30 + (pile.length-1)*ch*0.28; ctx.save(); ctx.strokeStyle='#3ecf8e'; ctx.shadowColor='#3ecf8e'; ctx.shadowBlur=10; ctx.lineWidth=2; this.rr(x-2,ty-2,cw+4,ch+4,7); ctx.stroke(); ctx.restore(); }
      }
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Golf();
})();
</script>
<div class="ai-indicator" id="ai-indicator"><span class="ai-dot"></span><span id="ai-status">AI 自动游玩中…</span></div>
