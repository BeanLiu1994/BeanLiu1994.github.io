<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#050a18" />
<title>Galaga · 星系浪潮</title>
<style>
  :root { --bg:#050a18; --surface:#0a1226; --board:#040810; --text:#e6f0ff; --muted:#7f95c8; --accent:#5de1ff; --accent2:#ff5de1; --accent-glow:#5de1ff55; --gold:#ffd54a; --red:#ff5d6a; --green:#4dff91; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image:radial-gradient(ellipse at 50% 0%, #0a1838 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #0a0820 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#5de1ff,#ff5de1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:11px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:700; cursor:pointer; transition:all .2s; letter-spacing:.5px; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#04101a; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#04101a; animation:pulse 1.6s infinite; --glow:var(--accent-glow); }
  @keyframes pulse { 0%,100%{box-shadow:0 0 6px var(--glow,transparent);} 50%{box-shadow:0 0 18px var(--glow,transparent),0 0 34px var(--glow,transparent);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>星系浪潮</h1><div class="sub">G A L A G A</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card"><div class="label">Wave</div><div class="value" id="wave">1</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="420" height="520"></canvas></div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">拖动屏幕左右移动战机 · 自动连发 · 清空整队外星人进入下一波</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), waveEl=document.getElementById('wave'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  const btnAuto=document.getElementById('btn-auto');
  const W=canvas.width, H=canvas.height;
  function rint(n){ return Math.floor(Math.random()*n); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  class Galaga {
    constructor(){
      this.autoPlay=false; this._last=0; this.time=0; this._autoProgress=0; this._autoCd=0;
      this.bestKey='galagaBest'; this.best=parseInt(localStorage.getItem(this.bestKey)||'0'); bestEl.textContent=this.best;
      this.player={x:W/2, tx:W/2, y:H-46, w:38, h:26};
      this.bullets=[]; this.ebullets=[]; this.enemies=[]; this.particles=[];
      this.lives=3; this.score=0; this.wave=1; this.state='play'; // play | over
      this.fireCd=0; this.diveTimer=1.5; this.swayT=0; this.gameOverT=0;
      this.pointerX=null;
      this.newWave();
      requestAnimationFrame(this.tick.bind(this));
    }
    restart(){ this.lives=3; this.score=0; this.wave=1; this.state='play'; this.bullets=[]; this.ebullets=[]; this.particles=[]; this.gameOverT=0; this.newWave(); scoreEl.textContent='0'; waveEl.textContent='1'; this.setStatus('拖动屏幕左右移动战机 · 自动连发'); }
    setStatus(t){ statusEl.textContent=t; }
    newWave(){
      this.enemies=[]; const cols=8, rows=4, sxp=42, syp=40, ox=(W-cols*sxp)/2+sxp/2, oy=70;
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
        this.enemies.push({bx:ox+c*sxp, by:oy+r*syp, x:ox+c*sxp, y:oy+r*sxp*0+r*syp, col:c, row:r, alive:true, diving:false, vx:0, vy:0, t:Math.random()*6, hue:r===0?'#ff5de1':(r<3?'#5de1ff':'#9d7bff')});
      }
      this.diveTimer=1.2; this.swayT=0;
    }
    toggleAuto(){ this.autoPlay=!this.autoPlay; if(this.autoPlay){ btnAuto.textContent='Auto: ON'; btnAuto.classList.add('auto-on'); } else { btnAuto.textContent='Auto: OFF'; btnAuto.classList.remove('auto-on'); } }
    startAuto(){ this.autoPlay=true; btnAuto.textContent='Auto: ON'; btnAuto.classList.add('auto-on'); }
    stopAuto(){ this.autoPlay=false; btnAuto.textContent='Auto: OFF'; btnAuto.classList.remove('auto-on'); }
    maybeAuto(dt){
      if(!this.autoPlay) return;
      // dodge diving aliens, else align under lowest alien
      let danger=null, ddist=1e9;
      for(const e of this.enemies){ if(e.alive && e.diving && e.y>H*0.45){ const d=Math.abs(e.x-this.player.x)+(e.y>this.player.y?0:200); if(d<ddist){ ddist=d; danger=e; } } }
      if(danger && Math.abs(danger.x-this.player.x)<46 && danger.y>this.player.y-120){
        this.player.tx = clamp(this.player.x + (this.player.x<danger.x?-1:1)*120, 30, W-30);
      } else {
        // align under lowest alive alien in nearest column
        let target=W/2, bestY=-1;
        for(const e of this.enemies){ if(e.alive && !e.diving && e.y>bestY){ bestY=e.y; target=e.x; } }
        this.player.tx += (target-this.player.tx)*Math.min(1,dt*4);
      }
      this.fireCd-=dt; if(this.fireCd<=0){ this.fire(); this.fireCd=0.32; }
    }
    fire(){ this.bullets.push({x:this.player.x, y:this.player.y-16, vy:-520}); }
    update(dt){
      this.swayT+=dt; const sway=Math.sin(this.swayT*0.9)*46;
      // player smooth move
      if(this.pointerX!==null && !this.autoPlay) this.player.tx=clamp(this.pointerX,30,W-30);
      this.player.x += (this.player.tx-this.player.x)*Math.min(1,dt*14);
      // enemies formation + dive
      for(const e of this.enemies){ if(!e.alive) continue;
        if(e.diving){ e.x+=e.vx*dt; e.y+=e.vy*dt; e.vy+=120*dt; if(e.y>H+30){ e.diving=false; e.x=e.bx+sway; } }
        else { e.x=e.bx+sway; e.y=e.by; }
      }
      if(this.state==='play'){
        this.diveTimer-=dt;
        if(this.diveTimer<=0){ this.diveTimer=1.0+Math.random()*1.6; const live=this.enemies.filter(e=>e.alive&&!e.diving); if(live.length){ const e=live[rint(live.length)]; e.diving=true; e.vy=120; e.vx=(this.player.x-e.x)*0.5; } }
        // occasional enemy fire
        if(Math.random()<dt*0.6){ const live=this.enemies.filter(e=>e.alive); if(live.length){ const e=live[rint(live.length)]; this.ebullets.push({x:e.x,y:e.y+10,vy:200}); } }
      }
      // bullets
      for(const b of this.bullets){ b.y+=b.vy*dt; }
      for(const b of this.ebullets){ b.y+=b.vy*dt; }
      // collisions
      for(const b of this.bullets){ if(b.y<-10) continue; for(const e of this.enemies){ if(e.alive && !b.dead && Math.abs(b.x-e.x)<16 && Math.abs(b.y-e.y)<14){ e.alive=false; b.dead=true; this.score+=10*this.wave; scoreEl.textContent=this.score; this._autoProgress++; this._burst(e.x,e.y,e.hue); break; } } }
      this.bullets=this.bullets.filter(b=>!b.dead && b.y>-12);
      // player hit
      if(this.state==='play'){
        for(const e of this.enemies){ if(e.alive && e.diving && Math.abs(e.x-this.player.x)<22 && Math.abs(e.y-this.player.y)<20){ e.alive=false; this._hitPlayer(); break; } }
        for(const b of this.ebullets){ if(Math.abs(b.x-this.player.x)<20 && Math.abs(b.y-this.player.y)<18){ b.dead=true; this._hitPlayer(); break; } }
      }
      this.ebullets=this.ebullets.filter(b=>!b.dead && b.y<H+12);
      // particles
      for(const p of this.particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
      this.particles=this.particles.filter(p=>p.life>0);
      // wave clear
      if(this.state==='play' && this.enemies.every(e=>!e.alive)){ this.wave++; waveEl.textContent=this.wave; this.newWave(); this.setStatus('第 '+this.wave+' 波来袭！'); }
      if(this.state==='over'){ this.gameOverT-=dt; if(this.gameOverT<=0){ this.restart(); if(this.autoPlay){} } }
      if(this.score>this.best){ this.best=this.score; bestEl.textContent=this.best; localStorage.setItem(this.bestKey,String(this.best)); }
      this.maybeAuto(dt);
    }
    _hitPlayer(){ this.lives--; this._burst(this.player.x,this.player.y,'#ff5d6a'); if(this.lives<=0){ this.state='over'; this.gameOverT=1.3; this.setStatus('Game Over · 自动重开'); } }
    _burst(x,y,c){ for(let i=0;i<10;i++){ const a=Math.random()*6.28, s=40+Math.random()*120; this.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.3,c}); } }
    tick(ts){
      const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016);
      this._last=ts!==undefined?ts:this._last; this.time+=dt;
      this.update(dt); this.draw(); requestAnimationFrame(this.tick.bind(this));
    }
    draw(){
      ctx.clearRect(0,0,W,H);
      const g=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,W*0.7); g.addColorStop(0,'#0a1226'); g.addColorStop(1,'#040810'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      // stars
      ctx.fillStyle='#1a2a4a'; for(let i=0;i<40;i++){ const x=(i*97%W), y=((i*53+this.time*30)%H); ctx.fillRect(x,y,2,2); }
      // enemies
      for(const e of this.enemies){ if(!e.alive) continue; ctx.save(); ctx.shadowColor=e.hue; ctx.shadowBlur=12; ctx.fillStyle=e.hue;
        ctx.beginPath(); ctx.ellipse(e.x,e.y,15,11,0,0,6.28); ctx.fill();
        ctx.fillStyle='#040810'; ctx.beginPath(); ctx.arc(e.x,e.y,5,0,6.28); ctx.fill(); ctx.restore(); }
      // bullets
      ctx.fillStyle='#5de1ff'; for(const b of this.bullets){ ctx.fillRect(b.x-2,b.y-8,4,12); }
      ctx.fillStyle='#ff5de1'; for(const b of this.ebullets){ ctx.fillRect(b.x-2,b.y-6,4,10); }
      // player
      ctx.save(); ctx.shadowColor='#5de1ff'; ctx.shadowBlur=16; ctx.fillStyle='#5de1ff';
      const px=this.player.x, py=this.player.y;
      ctx.beginPath(); ctx.moveTo(px,py-16); ctx.lineTo(px-18,py+12); ctx.lineTo(px,py+4); ctx.lineTo(px+18,py+12); ctx.closePath(); ctx.fill(); ctx.restore();
      // particles
      for(const p of this.particles){ ctx.globalAlpha=Math.max(0,p.life*2); ctx.fillStyle=p.c; ctx.fillRect(p.x-2,p.y-2,4,4); } ctx.globalAlpha=1;
      // lives
      ctx.fillStyle='#7f95c8'; ctx.font='12px Segoe UI'; ctx.textAlign='left'; ctx.fillText('♥'.repeat(Math.max(0,this.lives)), 10, H-10);
    }
  }
  canvas.addEventListener('pointerdown',(e)=>{ const r=canvas.getBoundingClientRect(); game.pointerX=(e.clientX-r.left)*(canvas.width/r.width); });
  canvas.addEventListener('pointermove',(e)=>{ if(e.buttons||e.pointerType==='touch'){ const r=canvas.getBoundingClientRect(); game.pointerX=(e.clientX-r.left)*(canvas.width/r.width); } });
  canvas.addEventListener('pointerup',()=>{});
  window.game=new Galaga();
})();
</script>
</body>
</html>
