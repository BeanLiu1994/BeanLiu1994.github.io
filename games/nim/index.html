<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a18" />
<title>Nim · Neon</title>
<style>
  :root{
    --bg:#0a0a18; --surface:#12122a; --text:#e7e7f5; --muted:#8888b0;
    --accent:#a98bff; --accent-glow:#a98bff66; --danger:#ff5d6c; --gold:#ffd76a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);background-image:radial-gradient(ellipse at 25% 15%,#2a1840 0%,transparent 55%),radial-gradient(ellipse at 80% 85%,#102a3a 0%,transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;}
  .container{width:100%;max-width:460px;padding:16px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .title-block h1{font-size:1.9rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#cbb2ff,#a98bff,#5ce1ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:6px 12px;text-align:center;min-width:56px;}
  .score-card .label{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0a;border-radius:14px;padding:10px;box-shadow:0 0 40px #00000040,0 0 70px var(--accent-glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#0c0c1e;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;z-index:10;opacity:0;transition:opacity .35s;pointer-events:none;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0a18ee;backdrop-filter:blur(4px);border-radius:14px;}
  .overlay-content{position:relative;text-align:center;z-index:1;}
  .overlay-content h2{font-size:1.8rem;font-weight:800;margin-bottom:6px;}
  .overlay-content p{color:var(--muted);margin-bottom:16px;font-size:.9rem;}
  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:80px;padding:12px 16px;border:1px solid #ffffff12;border-radius:10px;background:var(--surface);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff10;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#160a26;}
  .btn.primary:hover{box-shadow:0 0 20px var(--accent-glow);}
  .btn.auto-on{background:var(--accent);border-color:var(--accent);color:#160a26;animation:pulse-glow 2s infinite;--glow:var(--accent-glow);}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--glow,transparent);}50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);}}
  .takebar{display:flex;gap:8px;margin-top:10px;justify-content:center;}
  .takebar .btn{display:none;flex:0 0 auto;min-width:54px;padding:9px 14px;}
  .takebar .btn.show{display:block;}
  .ai-indicator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.75rem;color:var(--muted);justify-content:center;min-height:20px;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
  .hint{margin-top:8px;text-align:center;font-size:.7rem;color:var(--muted);}
  @media(max-width:400px){.title-block h1{font-size:1.4rem;}.btn{padding:10px 12px;font-size:.78rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Nim</h1><div class="sub">尼 姆 · N E O N</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Turn</div><div class="value" id="turn">You</div></div>
      <div class="score-card best"><div class="label">Wins</div><div class="value" id="wins">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="420" height="320"></canvas>
    <div class="overlay" id="overlay-end"><div class="overlay-bg"></div><div class="overlay-content"><h2 id="end-title">Game Over</h2><p id="end-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
  </div>
  <div class="takebar" id="takebar">
    <button class="btn" id="t1" onclick="game.take(1)">1</button>
    <button class="btn" id="t2" onclick="game.take(2)">2</button>
    <button class="btn" id="t3" onclick="game.take(3)">3</button>
    <button class="btn primary" id="tAll" onclick="game.takeAll()">All</button>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI computing…</span></div>
  <div class="hint">Tap a pile to select, then choose how many to take. Last to take wins.</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  function fitCanvas(){ const w=canvas.clientWidth||420; const dpr=window.devicePixelRatio||1; canvas.width=w*dpr; canvas.height=320*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); return w; }
  const lerp=(a,b,t)=>a+(b-a)*t;
  function nimSum(p){ let s=0; for(const x of p) s^=x; return s; }
  function optimalMove(p){ const s=nimSum(p); if(s===0){ let mi=0; for(let i=0;i<p.length;i++) if(p[i]>p[mi]) mi=i; return [mi,1]; } for(let i=0;i<p.length;i++){ const t=p[i]^s; if(t<p[i]) return [i,p[i]-t]; } return [0,1]; }
  class Nim{
    constructor(){ this.wins=parseInt(localStorage.getItem('bestNim')||'0'); this.autoPlay=false; this.bindInput(); this.restart(); this._tick=this.tick.bind(this); requestAnimationFrame(this._tick); }
    restart(){ this.stopAuto(); this.size=fitCanvas(); this.piles=[]; const n=3+((Math.random()*2)|0); for(let i=0;i<n;i++) this.piles.push(2+((Math.random()*5)|0)); this.disp=this.piles.slice(); this.turn=1; this.over=false; this.winner=0; this.sel=null; this.autoAccum=0; this.hideOverlay(); this.updateUI(); }
    hideOverlay(){ document.getElementById('overlay-end').classList.remove('active'); }
    updateUI(){ document.getElementById('turn').textContent=this.autoPlay?'AI':(this.turn===1?'You':'AI'); document.getElementById('wins').textContent=this.wins; const tb=document.getElementById('takebar'); if(this.sel!==null&&!this.autoPlay&&!this.over&&this.turn===1){ for(let k=1;k<=3;k++){ const b=document.getElementById('t'+k); if(k<=this.piles[this.sel]){ b.classList.add('show'); } else b.classList.remove('show'); } const ta=document.getElementById('tAll'); ta.classList.add('show'); ta.textContent=this.piles[this.sel]>3?('All('+this.piles[this.sel]+')'):'All'; } else { ['t1','t2','t3','tAll'].forEach(id=>document.getElementById(id).classList.remove('show')); } }
    take(n){ if(this.over||this.sel===null||this.turn!==1||this.autoPlay) return; if(n>this.piles[this.sel]) n=this.piles[this.sel]; this.apply(this.sel,n); }
    takeAll(){ this.take(this.piles[this.sel]); }
    apply(idx,n){ if(n<=0||n>this.piles[idx]) return; this.piles[idx]-=n; this.sel=null; const total=this.piles.reduce((a,b)=>a+b,0); if(total===0){ this.over=true; this.winner=this.turn; if(this.turn===1){ this.wins++; localStorage.setItem('bestNim',this.wins); } this.showEnd(); return; } this.turn=this.turn===1?2:1; this.updateUI(); }
    showEnd(){ document.getElementById('end-title').textContent=this.autoPlay?'Game Over':(this.winner===1?'You Win!':'AI Wins'); document.getElementById('end-msg').textContent=this.autoPlay?('Winner: '+(this.winner===1?'Player 1':'Player 2')):''; document.getElementById('overlay-end').classList.add('active'); }
    chooseAuto(){ const [i,n]=optimalMove(this.piles); this.apply(i,n); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    tick(ts){ const dt=Math.min(50,(ts!==undefined)?((ts-(this._last||ts))):16)/1000; this._last=ts; this.update(dt); this.render(); requestAnimationFrame(this._tick); }
    update(dt){ for(let i=0;i<this.piles.length;i++) this.disp[i]=lerp(this.disp[i],this.piles[i],1-Math.pow(0.002,dt)); if(this.autoPlay&&!this.over){ this.autoAccum+=dt; if(this.autoAccum>=0.55){ this.autoAccum=0; this.chooseAuto(); } } else if(!this.autoPlay&&!this.over&&this.turn===2){ this.autoAccum+=dt; if(this.autoAccum>=0.6){ this.autoAccum=0; this.chooseAuto(); } } }
    bindInput(){ const wrap=document.getElementById('board-wrap'); wrap.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over||this.turn!==1) return; const rect=canvas.getBoundingClientRect(); const x=e.clientX-rect.left, y=e.clientY-rect.top; const idx=this.pileAt(x,y); if(idx<0) return; e.preventDefault(); this.sel=(this.sel===idx)?null:idx; this.updateUI(); }); window.addEventListener('resize',()=>{ this.size=fitCanvas(); }); }
    pileAt(x,y){ const W=this.size,H=320; const n=this.piles.length; const cw=W/n; for(let i=0;i<n;i++){ const px=i*cw+cw/2; if(Math.abs(x-px)<cw*0.36 && y>H*0.18) return i; } return -1; }
    render(){ const W=this.size,H=320; ctx.clearRect(0,0,W,H); const n=this.piles.length; const cw=W/n; const baseY=H-26; const maxH=H*0.66; const tr=Math.min(cw*0.32, maxH/14);
      for(let i=0;i<n;i++){ const px=i*cw+cw/2; const cnt=this.disp[i]; const count=Math.max(0,Math.round(cnt)); const sel=this.sel===i;
        // base post
        ctx.fillStyle='#1a1a30'; ctx.fillRect(px-3,baseY-2,6,12);
        for(let k=0;k<count;k++){ const ty=baseY-k*(tr*2.1)-tr; ctx.save(); if(sel){ ctx.shadowColor='#a98bff'; ctx.shadowBlur=14; } const g=ctx.createRadialGradient(px-tr*0.3,ty-tr*0.3,tr*0.2,px,ty,tr); g.addColorStop(0,'#d9c9ff'); g.addColorStop(1,sel?'#7c5cff':'#5a3fb0'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,ty,tr,0,Math.PI*2); ctx.fill(); ctx.restore(); }
        ctx.fillStyle=sel?'#a98bff':'#8888b0'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.fillText('pile '+(i+1)+': '+this.piles[i], px, H-6);
        if(sel){ ctx.strokeStyle='#a98bff'; ctx.lineWidth=2; ctx.strokeRect(px-cw*0.4,baseY-maxH-10,cw*0.8,maxH+14); }
      }
    }
  }
  window.game=new Nim();
})();
</script>
</body>
</html>
