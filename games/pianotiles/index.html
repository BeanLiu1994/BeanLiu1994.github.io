<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0e1a" />
<title>Piano Tiles · Neon Tap</title>
<style>
  :root{
    --bg:#0a0e1a; --surface:#11182b; --text:#eaf2ff; --muted:#7d8bb5;
    --accent:#39d0ff; --accent2:#ff5d9e; --gold:#ffd166; --ok:#39ff9e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;position:fixed;width:100%;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #11304f 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #3a1140 0%, transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:480px;height:100vh;max-height:880px;display:flex;flex-direction:column;padding:12px;gap:10px;}
  .header{display:flex;align-items:center;justify-content:space-between;}
  .title-block h1{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff10;border-radius:10px;padding:6px 12px;text-align:center;min-width:54px;}
  .score-card .label{font-size:.5rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.best .value{color:var(--gold);}
  .score-card.wave .value{color:var(--accent);}
  .board-wrap{position:relative;flex:1;min-height:0;background:var(--surface);border:1px solid #ffffff10;border-radius:16px;overflow:hidden;box-shadow:0 0 50px #00000040,0 0 70px #39d0ff18;}
  .board-wrap, .board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:100%;}
  .controls{display:flex;gap:8px;}
  .btn{flex:1;min-width:80px;padding:11px 14px;border:1px solid #ffffff14;border-radius:11px;background:var(--surface);color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .18s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff12;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#0a0e1a;}
  .btn.primary:hover{box-shadow:0 0 22px #39d0ff55;}
  .btn.auto-on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#0a0e1a;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 6px #39d0ff44;}50%{box-shadow:0 0 20px #39d0ff88,0 0 38px #ff5d9e55;}}
  .ai-indicator{display:none;align-items:center;gap:8px;justify-content:center;font-size:.72rem;color:var(--muted);min-height:18px;}
  .ai-indicator.show{display:flex;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.7);}}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:5;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0e1add;backdrop-filter:blur(5px);}
  .overlay-content{position:relative;text-align:center;z-index:1;padding:20px;}
  .overlay-content h2{font-size:2rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay-content p{color:var(--muted);margin-bottom:14px;font-size:.85rem;}
  .hint{text-align:center;font-size:.64rem;color:var(--muted);line-height:1.5;}
  @media (max-width:400px){.title-block h1{font-size:1.3rem;}.btn{padding:10px;font-size:.76rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Piano Tiles</h1><div class="sub">N E O N   T A P</div></div>
    <div class="score-panel">
      <div class="score-card wave"><div class="label">Lv</div><div class="value" id="wave">1</div></div>
      <div class="score-card"><div class="label">Tiles</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay-over">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2 id="over-title">通关！</h2>
        <p id="over-msg">完美弹奏</p>
        <button class="btn primary" id="btn-again" style="min-width:140px;">再来一局</button>
      </div>
    </div>
  </div>
  <div class="ai-indicator" id="ai-indicator"><span class="ai-dot"></span><span id="ai-status">AI 自动演奏中…</span></div>
  <div class="controls">
    <button class="btn primary" id="btn-auto">自动游玩</button>
    <button class="btn" id="btn-restart">重开</button>
  </div>
  <div class="hint">黑块落到触控线时点击对应列 · 别点错 · 自动模式 AI 完美通关</div>
</div>
<script>
(function(){
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), waveEl=document.getElementById('wave');
  const overlay=document.getElementById('overlay-over'), overMsg=document.getElementById('over-msg'), overTitle=document.getElementById('over-title');
  const btnAuto=document.getElementById('btn-auto'), btnRestart=document.getElementById('btn-restart'), btnAgain=document.getElementById('btn-again');
  const aiInd=document.getElementById('ai-indicator'), aiStatus=document.getElementById('ai-status');

  const COLS=4, GOAL=40, SPEED0=2.2;
  const COLORS=['#39d0ff','#ff5d9e','#ffd166','#39ff9e'];

  class Game{
    constructor(){
      this.autoPlay=false; this.over=false;
      this.best=parseInt(localStorage.getItem('pianotilesBest')||'0',10); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      this.bindInput(); this.newGame();
      this.last=performance.now(); this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){
      const rc=canvas.getBoundingClientRect();
      this.W=Math.max(300,Math.min(rc.width||420,480)); this.H=Math.max(360,Math.min(rc.height||640,860));
      const d=window.devicePixelRatio||1; canvas.width=this.W*d; canvas.height=this.H*d; ctx.setTransform(d,0,0,d,0,0);
      this.cw=this.W/COLS; this.th=Math.max(56,Math.min(96,this.H/6)); this.tapY=this.H-this.th*0.6;
    }
    newGame(){
      this.rows=[]; this.speed=SPEED0; this.score=0; this.level=1;
      this.over=false; this.overFrame=0; this.frame=0; this.tapFlash=[-1,-1,-1,-1]; this.shake=0;
      for(let k=0;k<10;k++) this.rows.push({col:(Math.random()*COLS)|0, y:-this.th*(k+1), played:false});
      scoreEl.textContent='0'; waveEl.textContent='1'; bestEl.textContent=this.best;
      overlay.classList.remove('active'); aiStatus.textContent='AI 自动演奏中…';
    }
    inTap(r){ return r.y <= this.tapY+this.th*0.4 && r.y+this.th >= this.tapY-this.th*0.4; }
    lowestUnplayed(){
      let best=null, bestY=-1e9;
      for(const r of this.rows){ if(r.played) continue; if(r.y>bestY){ bestY=r.y; best=r; } }
      return best;
    }
    ensureStream(){
      let minY=Infinity; for(const r of this.rows) if(r.y<minY) minY=r.y;
      while(minY > -this.th*5){ this.rows.push({col:(Math.random()*COLS)|0, y:minY-this.th, played:false}); minY-=this.th; }
    }
    play(col){
      if(this.over) return;
      this.tapFlash[col]=10;
      let target=null;
      for(const r of this.rows){ if(r.played||r.col!==col) continue; if(!this.inTap(r)) continue; if(!target||r.y>target.y) target=r; }
      if(target){
        target.played=true; this.score++;
        if(this.score>this.best){ this.best=this.score; localStorage.setItem('pianotilesBest',String(this.best)); } bestEl.textContent=this.best; scoreEl.textContent=this.score;
        if(this.score%8===0){ this.level++; waveEl.textContent=this.level; this.speed=Math.min(7,SPEED0+this.level*0.25); }
        if(this.score>=GOAL) this.win();
      } else {
        let any=false; for(const r of this.rows){ if(!r.played && this.inTap(r)){ any=true; break; } }
        if(any) this.lose('点错列了！');
      }
    }
    lose(msg){ if(this.over) return; this.over=true; this.overFrame=this.frame; overTitle.textContent='游戏结束'; overMsg.textContent=msg; if(!this.autoPlay) overlay.classList.add('active'); }
    win(){ if(this.over) return; this.over=true; this.overFrame=this.frame; overTitle.textContent='通关！'; overMsg.textContent='完美弹奏 '+GOAL+' 块 🎹'; if(!this.autoPlay) overlay.classList.add('active'); }
    startAuto(){ this.autoPlay=true; btnAuto.classList.add('auto-on'); btnAuto.textContent='自动中'; aiInd.classList.add('show'); }
    stopAuto(){ this.autoPlay=false; btnAuto.classList.remove('auto-on'); btnAuto.textContent='自动游玩'; aiInd.classList.remove('show'); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else this.startAuto(); }
    bindInput(){
      const getCol=(e)=>{ const r=canvas.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX); return Math.max(0,Math.min(COLS-1,Math.floor((cx-r.left)/this.cw))); };
      const onDown=(e)=>{ if(this.autoPlay||this.over) return; this.play(getCol(e)); e.preventDefault(); };
      canvas.addEventListener('pointerdown',onDown); canvas.addEventListener('touchstart',onDown,{passive:false});
    }
    autoPlayStep(){
      const r=this.lowestUnplayed(); if(!r) return; if(this.inTap(r)) this.play(r.col);
    }
    loop(now){ const dt=Math.min(40,now-this.last); this.last=now; this.frame++; this.update(dt); this.render(); requestAnimationFrame(this.loop); }
    update(dt){
      const f=dt/16.67;
      if(this.shake>0) this.shake-=f;
      for(let i=0;i<4;i++) if(this.tapFlash[i]>0) this.tapFlash[i]-=f;
      if(!this.over){
        for(const r of this.rows) r.y+=this.speed*f;
        for(const r of this.rows){ if(!r.played && r.y>this.tapY+this.th+8){ this.lose('漏掉黑块了！'); break; } }
        this.ensureStream();
        this.rows=this.rows.filter(r=>!(r.played && r.y>this.tapY+this.th+8));
        if(this.autoPlay) this.autoPlayStep();
      } else if(this.autoPlay && this.frame-this.overFrame>70){ this.newGame(); }
    }
    render(){
      const sx=(this.shake>0)?(Math.random()-.5)*this.shake:0;
      ctx.clearRect(0,0,this.W,this.H); ctx.save(); ctx.translate(0,sx);
      for(let c=0;c<COLS;c++){ ctx.fillStyle=c%2? '#0d1424':'#0c1322'; ctx.fillRect(c*this.cw,0,this.cw,this.H); ctx.strokeStyle='#ffffff0a'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(c*this.cw,0); ctx.lineTo(c*this.cw,this.H); ctx.stroke(); }
      ctx.strokeStyle='#39d0ff'; ctx.lineWidth=3; ctx.shadowColor='#39d0ff'; ctx.shadowBlur=12; ctx.beginPath(); ctx.moveTo(0,this.tapY); ctx.lineTo(this.W,this.tapY); ctx.stroke(); ctx.shadowBlur=0;
      for(let c=0;c<COLS;c++){ if(this.tapFlash[c]>0){ ctx.globalAlpha=this.tapFlash[c]/10*0.25; ctx.fillStyle=COLORS[c]; ctx.fillRect(c*this.cw,this.tapY-this.th/2,this.cw,this.th); ctx.globalAlpha=1; } }
      for(const r of this.rows){ const y=r.y; if(y>this.H||y+this.th<0) continue;
        if(r.played){ ctx.fillStyle='#39ff9e22'; this.roundRect(r.col*this.cw+2,y+2,this.cw-4,this.th-4,8); ctx.fill(); }
        else { const col=COLORS[r.col]; ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=14; this.roundRect(r.col*this.cw+2,y+2,this.cw-4,this.th-4,8); ctx.fill(); ctx.shadowBlur=0;
          ctx.fillStyle='#0a0e1a'; ctx.font=Math.floor(this.th*0.4)+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('♪',r.col*this.cw+this.cw/2,y+this.th/2+1); }
      }
      ctx.restore();
    }
    roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  const game=new Game();
  window.game=game;
  btnAuto.addEventListener('click',()=>game.toggleAuto());
  btnRestart.addEventListener('click',()=>{ game.stopAuto(); game.newGame(); });
  btnAgain.addEventListener('click',()=>{ game.stopAuto(); game.newGame(); });
})();
</script>
</body>
</html>
