<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0f1a" />
<title>Yahtzee · Neon</title>
<style>
  :root{
    --bg:#0a0f1a; --surface:#111a2b; --text:#e7edf7; --muted:#8090a8;
    --accent:#ffb14d; --accent-glow:#ffb14d66; --danger:#ff5d6c; --gold:#ffd76a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);background-image:radial-gradient(ellipse at 25% 15%,#3a2410 0%,transparent 55%),radial-gradient(ellipse at 80% 85%,#102a3a 0%,transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;}
  .container{width:100%;max-width:480px;padding:16px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .title-block h1{font-size:1.9rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#ffd79a,#ffb14d,#ff8a5c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:6px 12px;text-align:center;min-width:60px;}
  .score-card .label{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.best .value{color:var(--gold);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0a;border-radius:14px;padding:10px;box-shadow:0 0 40px #00000040,0 0 70px var(--accent-glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#0c1424;}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;}
  .cat{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:#0e1626;border:1px solid #ffffff0a;border-radius:9px;font-size:.8rem;transition:all .15s;}
  .cat .n{color:var(--muted);}
  .cat .v{font-weight:700;font-variant-numeric:tabular-nums;}
  .cat.open{cursor:pointer;}
  .cat.open:hover{border-color:var(--accent);}
  .cat.open.act{background:#1c2a18;border-color:#7cff9b;box-shadow:0 0 14px #7cff9b44;}
  .cat.done{opacity:.6;}
  .cat.done .v{color:var(--gold);}
  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:90px;padding:12px 16px;border:1px solid #ffffff12;border-radius:10px;background:var(--surface);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff10;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1004;}
  .btn.primary:hover{box-shadow:0 0 20px var(--accent-glow);}
  .btn.auto-on{background:var(--accent);border-color:var(--accent);color:#1a1004;animation:pulse-glow 2s infinite;--glow:var(--accent-glow);}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--glow,transparent);}50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);}}
  .ai-indicator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.75rem;color:var(--muted);justify-content:center;min-height:20px;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
  .hint{margin-top:8px;text-align:center;font-size:.7rem;color:var(--muted);}
  @media(max-width:400px){.title-block h1{font-size:1.4rem;}.btn{padding:10px 12px;font-size:.78rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Yahtzee</h1><div class="sub">N E O N &nbsp; D I C E</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
      <div class="score-card"><div class="label">Rolls</div><div class="value" id="rolls">3</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="440" height="150"></canvas>
  </div>
  <div class="cats" id="cats"></div>
  <div class="controls">
    <button class="btn primary" id="btn-roll" onclick="game.roll()">Roll</button>
    <button class="btn" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI rolling…</span></div>
  <div class="hint">Tap dice to hold (lock) before rerolling. Tap a category to score.</div>
</div>
<script>
(function(){
  'use strict';
  const CATS=[['ones','Ones'],['twos','Twos'],['threes','Threes'],['fours','Fours'],['fives','Fives'],['sixes','Sixes'],
    ['3k','3 of Kind'],['4k','4 of Kind'],['fh','Full House'],['ss','Sm Straight'],['ls','Lg Straight'],['y','Yahtzee'],['ch','Chance']];
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  function fitCanvas(){ const w=canvas.clientWidth||440; const dpr=window.devicePixelRatio||1; canvas.width=w*dpr; canvas.height=150*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); return w; }
  const lerp=(a,b,t)=>a+(b-a)*t;
  function counts(d){ const c=[0,0,0,0,0,0,0]; d.forEach(v=>c[v]++); return c; }
  function score(cat,d){ const c=counts(d); const sum=d.reduce((a,b)=>a+b,0);
    if(['ones','twos','threes','fours','fives','sixes'].includes(cat)) return c[parseInt(cat[0])]*parseInt(cat[0]);
    if(cat==='3k') return c.some(x=>x>=3)?sum:0;
    if(cat==='4k') return c.some(x=>x>=4)?sum:0;
    if(cat==='fh'){ const has3=c.some(x=>x===3),has2=c.some(x=>x===2); const has5=c.some(x=>x===5); return (has3&&has2)||has5?25:0; }
    if(cat==='ss'){ const s=new Set(d); return (s.has(1)&&s.has(2)&&s.has(3)&&s.has(4))||(s.has(2)&&s.has(3)&&s.has(4)&&s.has(5))||(s.has(3)&&s.has(4)&&s.has(5)&&s.has(6))?30:0; }
    if(cat==='ls'){ const s=new Set(d); return (s.has(1)&&s.has(2)&&s.has(3)&&s.has(4)&&s.has(5))||(s.has(2)&&s.has(3)&&s.has(4)&&s.has(5)&&s.has(6))?40:0; }
    if(cat==='y') return c.some(x=>x===5)?50:0;
    if(cat==='ch') return sum;
    return 0;
  }
  class Yahtzee{
    constructor(){ this.best=parseInt(localStorage.getItem('bestYahtzee')||'0'); this.autoPlay=false; this.buildCats(); this.bindInput(); this.restart(); this._tick=this.tick.bind(this); requestAnimationFrame(this._tick); }
    buildCats(){ const el=document.getElementById('cats'); CATS.forEach(([id,name])=>{ const d=document.createElement('div'); d.className='cat open'; d.dataset.cat=id; d.innerHTML='<span class="n">'+name+'</span><span class="v" id="cat-'+id+'">-</span>'; el.appendChild(d); }); }
    restart(){ this.stopAuto(); this.size=fitCanvas(); this.dice=[1,2,3,4,5]; this.held=[false,false,false,false,false]; this.rollsLeft=3; this.turn=0; this.scoreCard={}; this.totalScore=0; this.over=false; this.rolling=null; this.autoAccum=0; this.phase='idle'; this.updateUI(); this.render(); }
    updateUI(){
      document.getElementById('score').textContent=this.totalScore;
      document.getElementById('best').textContent=this.best;
      document.getElementById('rolls').textContent=this.rollsLeft;
      CATS.forEach(([id,name])=>{ const e=document.getElementById('cat-'+id); const d=document.getElementById('cats').querySelector('[data-cat="'+id+'"]');
        if(this.scoreCard[id]!==undefined){ e.textContent=this.scoreCard[id]; d.className='cat done'; }
        else { e.textContent='-'; d.className=(this.rollsLeft===0&&!this.over)?'cat open act':'cat open'; }
      });
    }
    roll(){
      if(this.over||this.rolling) return;
      if(this.rollsLeft<=0) return;
      this.rolling={t:0,dur:0.5}; this.rollsLeft--;
      document.getElementById('rolls').textContent=this.rollsLeft;
      this._tickRoll=()=>{};
    }
    finishRoll(){ let changed=true; while(changed){ changed=false; for(let i=0;i<5;i++){ if(!this.held[i]){ const nv=1+(Math.random()*6|0); if(nv!==this.dice[i]){ this.dice[i]=nv; changed=true; } } } }
      this.phase = this.rollsLeft===0?'score':'idle'; this.updateUI();
    }
    chooseAuto(){
      if(this.rollsLeft===3){ this.roll(); return; }
      if(this.rollsLeft>0){ // decide holds for best open category and reroll
        const open=CATS.map(c=>c[0]).filter(id=>this.scoreCard[id]===undefined);
        // keep the value that yields best current score across open cats
        let bestVal=this.dice[0], bestSc=-1;
        for(let v=1;v<=6;v++){ const test=this.dice.map(d=>d===v?d:1); let sc=0; open.forEach(id=>{ sc=Math.max(sc,score(id,test)); }); if(sc>bestSc){bestSc=sc;bestVal=v;} }
        for(let i=0;i<5;i++) this.held[i]=(this.dice[i]===bestVal);
        this.roll(); return;
      }
      // score: pick open category with max score
      const open=CATS.map(c=>c[0]).filter(id=>this.scoreCard[id]===undefined);
      let bestId=open[0], bestSc=-1; open.forEach(id=>{ const sc=score(id,this.dice); if(sc>bestSc){bestSc=sc;bestId=id;} });
      this.scoreCard[bestId]=bestSc; this.totalScore+=bestSc;
      if(this.totalScore>this.best){ this.best=this.totalScore; localStorage.setItem('bestYahtzee',this.best); }
      this.turn++; if(this.turn>=13){ this.over=true; } else { this.dice=[1,2,3,4,5]; this.held=[false,false,false,false,false]; this.rollsLeft=3; }
      this.phase='idle'; this.updateUI();
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    tick(ts){ const dt=Math.min(50,(ts!==undefined)?((ts-(this._last||ts))):16)/1000; this._last=ts; this.update(dt); this.render(); requestAnimationFrame(this._tick); }
    update(dt){
      if(this.rolling){ this.rolling.t+=dt; if(this.rolling.t>=this.rolling.dur){ this.rolling=null; this.finishRoll(); } }
      if(this.over||this.rolling) return;
      if(this.autoPlay){ this.autoAccum+=dt; const wait=this.phase==='score'?0.45:0.35; if(this.autoAccum>=wait){ this.autoAccum=0; this.chooseAuto(); } }
    }
    bindInput(){
      const wrap=document.getElementById('board-wrap');
      wrap.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over||this.rolling) return; const sq=this.diceAt(e.clientX,e.clientY); if(sq<0)return; e.preventDefault(); if(this.rollsLeft<3&&this.phase!=='score'){ this.held[sq]=!this.held[sq]; this.render(); } });
      document.getElementById('cats').querySelectorAll('.cat').forEach(el=>{ el.addEventListener('pointerdown',()=>{ if(this.autoPlay||this.over) return; const id=el.dataset.cat; if(this.scoreCard[id]!==undefined||this.rollsLeft>0) return; this.scoreCard[id]=score(id,this.dice); this.totalScore+=this.scoreCard[id]; if(this.totalScore>this.best){this.best=this.totalScore;localStorage.setItem('bestYahtzee',this.best);} this.turn++; if(this.turn>=13){this.over=true;} else { this.dice=[1,2,3,4,5]; this.held=[false,false,false,false,false]; this.rollsLeft=3; this.phase='idle'; } this.updateUI(); this.render(); }); });
      window.addEventListener('resize',()=>{ this.size=fitCanvas(); });
    }
    diceAt(px,py){ const rect=canvas.getBoundingClientRect(); const x=px-rect.left, y=py-rect.top; const dw=this.size/5; for(let i=0;i<5;i++){ const dx=i*dw+8, dy=20, dwd=dw-16, dhd=110; if(x>=dx&&x<=dx+dwd&&y>=dy&&y<=dy+dhd) return i; } return -1; }
    render(){
      const w=this.size; ctx.clearRect(0,0,w,150);
      const dw=w/5;
      for(let i=0;i<5;i++){
        const dx=i*dw+8, dy=20, dwd=dw-16, dhd=110;
        let face=this.dice[i];
        if(this.rolling){ face=1+(Math.random()*6|0); }
        const isHeld=this.held[i];
        ctx.save();
        if(isHeld){ ctx.shadowColor='#7cff9b'; ctx.shadowBlur=16; }
        const g=ctx.createLinearGradient(dx,dy,dx+dwd,dy+dhd); g.addColorStop(0,'#fdfdff'); g.addColorStop(1,'#cdd6e6');
        ctx.fillStyle=g; this.rr(dx,dy,dwd,dhd,14); ctx.fill();
        ctx.restore();
        // pips
        ctx.fillStyle='#1a2236';
        const cx=dx+dwd/2, cy=dy+dhd/2, sp=dwd*0.24, r=dwd*0.09;
        const P={ c:[cx,cy], tl:[cx-sp,cy-sp], tr:[cx+sp,cy-sp], bl:[cx-sp,cy+sp], br:[cx+sp,cy+sp], ml:[cx-sp,cy], mr:[cx+sp,cy] };
        const maps={1:['c'],2:['tl','br'],3:['tl','c','br'],4:['tl','tr','bl','br'],5:['tl','tr','c','bl','br'],6:['tl','tr','ml','mr','bl','br']};
        (maps[face]||['c']).forEach(k=>{ ctx.beginPath(); ctx.arc(P[k][0],P[k][1],r,0,Math.PI*2); ctx.fill(); });
        if(isHeld){ ctx.fillStyle='#7cff9b'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.fillText('HELD',cx,dy+dhd-8); }
      }
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Yahtzee();
})();
</script>
</body>
</html>
