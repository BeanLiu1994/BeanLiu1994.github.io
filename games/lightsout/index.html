<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a1a" />
<title>Lights Out · Neon</title>
<style>
  :root{
    --bg:#0a0a1a; --surface:#12122a; --text:#e7e7f5; --muted:#8888b0;
    --accent:#ffe14d; --accent-glow:#ffe14d66; --gold:#ffd76a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);background-image:radial-gradient(ellipse at 25% 15%,#3a3610 0%,transparent 55%),radial-gradient(ellipse at 80% 85%,#102a3a 0%,transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;}
  .container{width:100%;max-width:460px;padding:16px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .title-block h1{font-size:1.9rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#fff39a,#ffe14d,#ffb14d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:6px 12px;text-align:center;min-width:54px;}
  .score-card .label{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0a;border-radius:14px;padding:10px;box-shadow:0 0 40px #00000040,0 0 70px var(--accent-glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#0c0c1e;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;z-index:10;opacity:0;transition:opacity .35s;pointer-events:none;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0a1aee;backdrop-filter:blur(4px);border-radius:14px;}
  .overlay-content{position:relative;text-align:center;z-index:1;}
  .overlay-content h2{font-size:1.8rem;font-weight:800;margin-bottom:6px;}
  .overlay-content p{color:var(--muted);margin-bottom:16px;font-size:.9rem;}
  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:90px;padding:12px 16px;border:1px solid #ffffff12;border-radius:10px;background:var(--surface);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff10;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1604;}
  .btn.primary:hover{box-shadow:0 0 20px var(--accent-glow);}
  .btn.auto-on{background:var(--accent);border-color:var(--accent);color:#1a1604;animation:pulse-glow 2s infinite;--glow:var(--accent-glow);}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--glow,transparent);}50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);}}
  .ai-indicator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.75rem;color:var(--muted);justify-content:center;min-height:20px;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
  .hint{margin-top:8px;text-align:center;font-size:.7rem;color:var(--muted);}
  @media(max-width:400px){.title-block h1{font-size:1.4rem;}.btn{padding:10px 12px;font-size:.78rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Lights Out</h1><div class="sub">N E O N &nbsp; P U Z Z L E</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Moves</div><div class="value" id="moves">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="420" height="420"></canvas>
    <div class="overlay" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2>Solved!</h2><p id="win-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI solving…</span></div>
  <div class="hint">Tap lights to toggle them &amp; neighbors. Turn them all off.</div>
</div>
<script>
(function(){
  'use strict';
  const N=5;
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  function fitCanvas(){ const w=canvas.clientWidth||420; const dpr=window.devicePixelRatio||1; canvas.width=w*dpr; canvas.height=w*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); return w; }
  const lerp=(a,b,t)=>a+(b-a)*t;
  function toggleCell(b,r,c){ const aff=[[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]]; for(const [a,b2] of aff){ if(a>=0&&a<N&&b2>=0&&b2<N) b[a*N+b2]^=1; } }
  function solve(initial){
    const M=N*N; const mat=[];
    for(let i=0;i<M;i++){ const row=new Array(M+1).fill(0); const r=(i/N)|0,c=i%N; const aff=[[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]]; for(const [a,b2] of aff){ if(a>=0&&a<N&&b2>=0&&b2<N) row[a*N+b2]=1; } row[M]=initial[i]; mat.push(row); }
    const where=new Array(M).fill(-1); let row=0;
    for(let col=0;col<M&&row<M;col++){ let sel=-1; for(let i=row;i<M;i++) if(mat[i][col]){sel=i;break;} if(sel<0) continue; const t=mat[sel]; mat[sel]=mat[row]; mat[row]=t; where[col]=row; for(let i=0;i<M;i++) if(i!==row&&mat[i][col]){ for(let j=col;j<=M;j++) mat[i][j]^=mat[row][j]; } row++; }
    for(let i=row;i<M;i++) if(mat[i][M]) return null;
    const x=new Array(M).fill(0); for(let i=0;i<M;i++) if(where[i]>=0) x[i]=mat[where[i]][M]; return x;
  }
  class Lights{
    constructor(){ this.best=parseInt(localStorage.getItem('bestLights')||'0'); this.autoPlay=false; this.bindInput(); this.restart(); this._tick=this.tick.bind(this); requestAnimationFrame(this._tick); }
    restart(){ this.stopAuto(); this.size=fitCanvas(); this.pad=20; this.cell=(this.size-2*this.pad)/N; this.board=new Array(N*N).fill(0); let k=8+((Math.random()*8)|0); const tmp=new Array(N*N).fill(0); for(let i=0;i<k;i++){ const r=(Math.random()*N)|0,c=(Math.random()*N)|0; toggleCell(tmp,r,c); } for(let i=0;i<N*N;i++) this.board[i]=tmp[i]; this.moves=0; this.over=false; this.glow=new Array(N*N).fill(0); this.target=new Array(N*N).fill(0); for(let i=0;i<N*N;i++) this.target[i]=this.board[i]?1:0; this.queue=[]; this.autoAccum=0; this.flash=new Array(N*N).fill(0); this.hideOverlay(); this.updateUI(); }
    hideOverlay(){ document.getElementById('overlay-win').classList.remove('active'); }
    updateUI(){ document.getElementById('moves').textContent=this.moves; document.getElementById('best').textContent=this.best; }
    cellAt(px,py){ const rect=canvas.getBoundingClientRect(); const x=px-rect.left, y=py-rect.top; const c=Math.floor((x-this.pad)/this.cell), r=Math.floor((y-this.pad)/this.cell); if(r>=0&&r<N&&c>=0&&c<N) return r*N+c; return -1; }
    press(i){ if(this.over) return; const r=(i/N)|0,c=i%N; toggleCell(this.board,r,c); this.moves++; for(const [a,b2] of [[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]]) if(a>=0&&a<N&&b2>=0&&b2<N){ this.target[a*N+b2]=this.board[a*N+b2]?1:0; this.flash[a*N+b2]=1; } this.updateUI(); if(this.board.every(v=>v===0)) this.win(); }
    win(){ this.over=true; this.stopAuto(); if(!this.solvedBefore||this.moves<this.best||this.best===0){ if(this.best===0||this.moves<this.best){ this.best=this.moves; localStorage.setItem('bestLights',this.best); } } this.solvedBefore=true; document.getElementById('win-msg').textContent='Solved in '+this.moves+' moves'; document.getElementById('overlay-win').classList.add('active'); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; const sol=solve(this.board); this.queue=[]; if(sol){ for(let i=0;i<N*N;i++) if(sol[i]) this.queue.push(i); } }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    tick(ts){ const dt=Math.min(50,(ts!==undefined)?((ts-(this._last||ts))):16)/1000; this._last=ts; this.update(dt); this.render(); requestAnimationFrame(this._tick); }
    update(dt){ for(let i=0;i<N*N;i++){ this.glow[i]=lerp(this.glow[i],this.target[i],1-Math.pow(0.001,dt)); if(this.flash[i]>0) this.flash[i]=Math.max(0,this.flash[i]-dt*2.5); }
      if(this.autoPlay&&!this.over){ this.autoAccum+=dt; if(this.autoAccum>=0.22&&this.queue.length){ this.autoAccum=0; this.press(this.queue.shift()); } }
    }
    bindInput(){ const wrap=document.getElementById('board-wrap'); wrap.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over) return; const i=this.cellAt(e.clientX,e.clientY); if(i<0) return; e.preventDefault(); this.press(i); }); window.addEventListener('resize',()=>{ this.size=fitCanvas(); }); }
    render(){ const size=this.size; ctx.clearRect(0,0,size,size); const pad=this.pad, cell=this.cell;
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const i=r*N+c; const x=pad+c*cell, y=pad+r*cell; const cs=cell*0.86, ox=x+(cell-cs)/2, oy=y+(cell-cs)/2; const g=this.glow[i]; const fl=this.flash[i];
        ctx.save(); const baseG=ctx.createLinearGradient(ox,oy,ox+cs,oy+cs); if(g>0.5){ baseG.addColorStop(0,'rgba(255,240,150,'+(0.25+0.75*g)+')'); baseG.addColorStop(1,'rgba(255,170,60,'+(0.25+0.75*g)+')'); ctx.shadowColor='#ffe14d'; ctx.shadowBlur=(10+18*g)*(1+fl); } else { baseG.addColorStop(0,'#191930'); baseG.addColorStop(1,'#111126'); }
        ctx.fillStyle=baseG; this.rr(ox,oy,cs,cs,12); ctx.fill(); ctx.restore();
        if(fl>0){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.globalAlpha=fl; this.rr(ox,oy,cs,cs,12); ctx.stroke(); ctx.globalAlpha=1; }
      }
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Lights();
})();
</script>
</body>
</html>
