<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹疯狂八 · Neon Crazy Eights</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#ff6bd6; --accent-glow:#ff6bd655; --gold:#ffd54a; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 22% 12%, #241238 0%, transparent 55%), radial-gradient(ellipse at 80% 88%, #122a3a 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:12px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; gap:10px; }
  .title-block h1 { font-size:1.42rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#ff6bd6,#ffd54a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.52rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:50px; }
  .score-card .label { font-size:0.48rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:0.95rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:8px; }
  .btn { flex:1; min-width:74px; padding:10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.82rem; font-weight:700; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#2a0020; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#2a0020; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:6px; font-size:0.72rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹疯狂八</h1><div class="sub">C R A Z Y &nbsp; E I G H T S</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">手牌</div><div class="value" id="hand">7</div></div>
      <div class="score-card best"><div class="label">胜局</div><div class="value" id="won">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="420" height="500"></canvas></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">新发牌</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">点你手中的牌出牌；凑不到就点牌库抽牌；8 可作任意花色</div>
</div>
<script>
(function(){
  'use strict';
  const SUITS=['S','H','D','C'];
  const RED={H:1,D:1,S:0,C:0};
  const RL=(r)=> r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r);
  const SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
  const sCol=(s)=> RED[s]?'#ff5d6a':'#e6e6f5';
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const handEl=document.getElementById('hand'), wonEl=document.getElementById('won'), statusEl=document.getElementById('status');

  class Crazy {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this.aiTimer=null; this._last=0; this._autoProgress=0; this.now=0;
      this.wins=parseInt(localStorage.getItem('ceWins')||'0'); wonEl.textContent=this.wins;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); this.onDown(e); });
      this.restart();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(rect.width||420,420)); const dpr=window.devicePixelRatio||1;
      this.W=w; this.H=w*500/420; canvas.width=w*dpr; canvas.height=this.H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      this.cw=w/8.4; this.ch=this.cw*1.4; }
    newDeal(){
      const deck=[]; for(const s of SUITS) for(let r=1;r<=13;r++) deck.push({s,r});
      for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
      this.you=deck.splice(0,7); this.ai=deck.splice(0,7); this.stock=deck;
      const top=this.stock.pop(); this.discard=[top];
      if(top.r===8){ this.currentSuit=SUITS[Math.floor(Math.random()*4)]; this.currentRank=0; }
      else { this.currentRank=top.r; this.currentSuit=top.s; }
      this.turn='you'; this.over=false; this.winner=null; this.passes=0; this.pendingSuit=false; this.pendingCard=null;
      this.flashUntil=0; this.handRects=[]; this.suitBtns=[]; this.updateUI();
    }
    restart(){ this.stopAuto(); this.over=false; this.winner=null; this.newDeal(); }
    autoNext(){ this.over=false; this.winner=null; this.newDeal(); if(this.autoPlay){ this.autoTimer=setTimeout(()=>this.autoStep(),500); } }
    // ---- rules ----
    playable(c){ return c.r===8 || c.r===this.currentRank || c.s===this.currentSuit; }
    legalMoves(who){ const hand=(who==='you')?this.you:this.ai; const out=[]; for(const c of hand) if(this.playable(c)) out.push(c); return out; }
    bestSuit(who){ const hand=(who==='you')?this.you:this.ai; const cnt={S:0,H:0,D:0,C:0}; for(const c of hand){ if(c.r!==8) cnt[c.s]++; } let best='S',bv=-1; for(const s of SUITS){ if(cnt[s]>bv){ bv=cnt[s]; best=s; } } return best; }
    bestNormal(lm){ const byRank=lm.filter(c=>c.r===this.currentRank); const pool=byRank.length?byRank:lm; pool.sort((a,b)=>b.r-a.r); return pool[0]; }
    // ---- move application ----
    play(who, card, suit){
      const hand=(who==='you')?this.you:this.ai;
      const i=hand.indexOf(card); if(i<0) return;
      hand.splice(i,1); this.discard.push(card);
      if(card.r===8){ this.currentSuit=suit; this.currentRank=0; } else { this.currentRank=card.r; this.currentSuit=card.s; }
      this._autoProgress++; this.passes=0; this.flashUntil=this.now+320;
      this.updateUI();
      if(this.you.length===0){ this.endGame('you'); return; }
      if(this.ai.length===0){ this.endGame('ai'); return; }
      this.turn=(who==='you')?'ai':'you'; this.postMove();
    }
    pass(who){ this.turn=(who==='you')?'ai':'you'; this.passes++;
      if(this.passes>=2){ this.endByCount(); return; } this.postMove(); }
    endByCount(){ const youN=this.you.length, aiN=this.ai.length; const w= youN<aiN?'you':(aiN<youN?'ai':'draw'); this.endGame(w); }
    endGame(winner){
      this.over=true; this.winner=winner;
      if(winner==='you'){ this.wins++; localStorage.setItem('ceWins',String(this.wins)); wonEl.textContent=this.wins; }
      if(this.autoPlay){ statusEl.textContent=(winner==='you'?'你赢了！':(winner==='ai'?'AI 赢了':'平局'))+' · 自动重开…'; this.autoNext(); }
      else { this.stopAuto(); statusEl.textContent=(winner==='you'?'🎉 你赢了！':(winner==='ai'?'AI 获胜，点新发牌再战':'平局')); }
    }
    postMove(){ if(this.over) return;
      if(this.autoPlay){ this.autoTimer=setTimeout(()=>this.autoStep(),500); }
      else { if(this.turn==='ai'){ this.aiTimer=setTimeout(()=>this.aiTurn(),680); } } }
    // ---- ai / auto ----
    aiTakeTurn(who){
      const hand=(who==='you')?this.you:this.ai;
      let lm=this.legalMoves(who);
      if(lm.length===0){
        while(this.stock.length>0 && lm.length===0){ hand.push(this.stock.pop()); lm=this.legalMoves(who); }
        if(lm.length===0){ this.pass(who); return; }
      }
      const non8=lm.filter(c=>c.r!==8);
      const pick=(non8.length>0)?this.bestNormal(non8):lm[0];
      const suit=(pick.r===8)?this.bestSuit(who):pick.s;
      this.play(who, pick, suit);
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this.autoStep(); }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} if(this.aiTimer){clearTimeout(this.aiTimer);this.aiTimer=null;}
      const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    autoStep(){ if(!this.autoPlay) return; if(this.over){ this.autoNext(); return; } this.aiTakeTurn(this.turn); }
    aiTurn(){ if(this.over||this.autoPlay) return; this.aiTakeTurn('ai'); }
    // ---- input ----
    onDown(e){
      const rect=canvas.getBoundingClientRect(); const x=(e.clientX-rect.left)*(this.W/rect.width), y=(e.clientY-rect.top)*(this.H/rect.height);
      if(this.pendingSuit){ for(const sb of this.suitBtns){ if(x>=sb.x&&x<=sb.x+sb.w&&y>=sb.y&&y<=sb.y+sb.h){ const card=this.pendingCard; this.pendingSuit=false; this.pendingCard=null; this.play('you',card,sb.suit); return; } }
        this.pendingSuit=false; this.pendingCard=null; this.updateUI(); return; }
      if(this.autoPlay||this.over||this.turn!=='you') return;
      // stock tap (draw when stuck)
      const sr=this.stockRect; if(sr && x>=sr.x&&x<=sr.x+sr.w&&y>=sr.y&&y<=sr.y+sr.h){
        if(this.legalMoves('you').length>0){ statusEl.textContent='你还能出牌，先出一张吧'; return; }
        if(this.stock.length===0){ this.pass('you'); return; }
        this.you.push(this.stock.pop()); this.updateUI();
        if(this.legalMoves('you').length===0 && this.stock.length===0){ this.pass('you'); } return; }
      for(const hr of this.handRects){ if(x>=hr.x&&x<=hr.x+hr.w&&y>=hr.y&&y<=hr.y+hr.h){
        const card=hr.card; if(!this.playable(card)){ statusEl.textContent='这张牌不符合规则'; return; }
        if(card.r===8){ this.pendingSuit=true; this.pendingCard=card; this.updateUI(); return; }
        this.play('you', card, card.s); return; } }
    }
    updateUI(){ handEl.textContent=this.you.length;
      if(this.over) return;
      if(this.pendingSuit){ statusEl.textContent='选择要变的花色'; return; }
      if(this.autoPlay) statusEl.textContent='自动对战中… 已出 '+this._autoProgress+' 张';
      else statusEl.textContent=this.turn==='you'?'你的回合：出牌，或点牌库抽牌':'AI 思考中…'; }
    // ---- render ----
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.now=ts||0; this.draw(dt); }catch(err){ console.error(err); } }
    cardRow(n,x0,y){ const pad=8, cw=this.cw, ch=this.ch; const avail=this.W-2*pad; let off; if(n*cw<=avail) off=cw; else off=(avail-cw)/(n-1); const startX=(this.W-(n-1)*off-cw)/2; return {off,startX,y,rects:[]}; }
    draw(dt){
      const W=this.W,H=this.H,cw=this.cw,ch=this.ch; ctx.clearRect(0,0,W,H);
      // AI hand (backs)
      const nA=this.ai.length; const aiRow=this.cardRow(nA,0,10);
      ctx.fillStyle='#8a8ab0'; ctx.font='bold '+(cw*0.34)+'px Segoe UI'; ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('AI ('+nA+')', 8, 12);
      for(let i=0;i<nA;i++){ const x=aiRow.startX+i*aiRow.off; this.back(x, aiRow.y+ch*0.42); }
      // middle: stock + discard
      const midY=H*0.40;
      const sx=W*0.26-cw/2, dx=W*0.62-cw/2;
      this.slot(sx, midY, cw, ch);
      if(this.stock.length>0){ this.back(sx, midY); }
      ctx.fillStyle='#8a8ab0'; ctx.font='bold '+(cw*0.3)+'px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(this.stock.length), sx+cw/2, midY+ch+12);
      this.slot(dx, midY, cw, ch);
      const top=this.discard[this.discard.length-1];
      if(top) this.face(top, dx, midY, false);
      // requirement badge
      const bx=dx+cw+10, by=midY;
      ctx.fillStyle='#8a8ab0'; ctx.font='bold '+(cw*0.26)+'px Segoe UI'; ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('出', bx, by-2);
      ctx.fillStyle=sCol(this.currentSuit); ctx.font='bold '+(cw*0.5)+'px Segoe UI'; ctx.textBaseline='middle';
      ctx.fillText(SYM[this.currentSuit], bx+6, by+ch*0.42);
      ctx.fillStyle='#e6e6f5'; ctx.font='bold '+(cw*0.42)+'px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle';
      if(this.currentRank>0){ ctx.fillText(RL(this.currentRank), bx+6+cw*0.5, by+ch*0.42); }
      // flash on discard
      if(this.now<this.flashUntil){ ctx.save(); ctx.shadowColor='#ff6bd6'; ctx.shadowBlur=22; ctx.strokeStyle='#ff6bd6'; ctx.lineWidth=3; this.rr(dx-3,midY-3,cw+6,ch+6,10); ctx.stroke(); ctx.restore(); }
      // your hand
      const nY=this.you.length; const yRowY=H-ch-12; const yRow=this.cardRow(nY,0,yRowY);
      this.handRects=[]; this.stockRect={x:sx,y:midY,w:cw,h:ch};
      ctx.fillStyle='#8a8ab0'; ctx.font='bold '+(cw*0.34)+'px Segoe UI'; ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.fillText('你 ('+nY+')', 8, yRowY-4);
      for(let i=0;i<nY;i++){ const x=yRow.startX+i*yRow.off; const card=this.you[i]; const can=this.playable(card)&&!this.autoPlay&&!this.over&&this.turn==='you';
        this.face(card, x, yRowY, can);
        this.handRects.push({x,y:yRowY,w:cw,h:ch,card}); }
      // suit picker
      this.suitBtns=[];
      if(this.pendingSuit){ const bw=cw*1.1, gap=10, total=bw*4+gap*3; const sx0=(W-total)/2; const py=H*0.30;
        for(let i=0;i<4;i++){ const s=SUITS[i]; const x=sx0+i*(bw+gap); this.rr(x,py,bw,bw,10); ctx.fillStyle='#0e1226'; ctx.fill(); ctx.strokeStyle=sCol(s); ctx.lineWidth=3; ctx.stroke();
          ctx.fillStyle=sCol(s); ctx.font='bold '+(bw*0.5)+'px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(SYM[s], x+bw/2, py+bw/2);
          this.suitBtns.push({x,y:py,w:bw,h:bw,suit:s}); } }
    }
    slot(x,y){ this.rr(x,y,this.cw,this.ch,10); ctx.fillStyle='#0a0e1e'; ctx.fill(); ctx.strokeStyle='#2a2f4a'; ctx.lineWidth=1.5; ctx.stroke(); }
    back(x,y){ const g=ctx.createLinearGradient(x,y,x,y+this.ch); g.addColorStop(0,'#2a1240'); g.addColorStop(1,'#160a28');
      this.rr(x,y,this.cw,this.ch,10); ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='#ff6bd6'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#ff6bd6'; ctx.font='bold '+(this.cw*0.5)+'px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('◆', x+this.cw/2, y+this.ch/2); }
    face(d,x,y,hl){ const col=sCol(d.s); const g=ctx.createLinearGradient(x,y,x,y+this.ch); g.addColorStop(0,'#fbfbff'); g.addColorStop(1,'#d7d9ea');
      this.rr(x,y,this.cw,this.ch,10); ctx.fillStyle=g; ctx.fill();
      if(hl){ ctx.save(); ctx.shadowColor='#ff6bd6'; ctx.shadowBlur=16; ctx.strokeStyle='#ff6bd6'; ctx.lineWidth=3; this.rr(x-1,y-1,this.cw+2,this.ch+2,11); ctx.stroke(); ctx.restore(); }
      else { ctx.strokeStyle='#c8cad8'; ctx.lineWidth=1; ctx.stroke(); }
      ctx.fillStyle=col; ctx.font='bold '+(this.cw*0.34)+'px Segoe UI'; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(RL(d.r), x+5, y+4);
      ctx.textAlign='right'; ctx.fillText(SYM[d.s], x+this.cw-5, y+4);
      ctx.textAlign='center'; ctx.font=(this.cw*0.5)+'px Segoe UI'; ctx.fillText(SYM[d.s], x+this.cw/2, y+this.ch*0.58); }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Crazy();
})();
</script>
</body>
</html>
