<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹华容道 · Klotski</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0b1024; --text:#e0e0f0; --muted:#8888aa;
    --accent:#4dd0ff; --accent-glow:#4dd0ff66; --danger:#ff5d6a; --gold:#ffd700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg);
    background-image: radial-gradient(ellipse at 30% 20%, #103048 0%, transparent 55%), radial-gradient(ellipse at 70% 80%, #301040 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--danger),#ffb0b8,#4dd0ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 14px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .score-card.mv .value { color:var(--accent); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:auto; border-radius:10px; background:var(--board); cursor:grab; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#0a0a1aee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; }
  .overlay-content h2 { font-size:1.9rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:14px; font-size:0.9rem; }
  .overlay.win h2 { color:var(--gold); }
  .controls { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:10px 12px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; text-align:center; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#021018; }
  .btn.primary:hover { box-shadow:0 0 20px var(--accent-glow); }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#021018; animation:pg 2s infinite; --glow:var(--accent-glow); }
  @keyframes pg { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:18px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bk .8s infinite; }
  @keyframes bk { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:6px; font-size:0.7rem; color:var(--muted); }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹华容道</h1><div class="sub">K L O T S K I &nbsp;·&nbsp; 横刀立马</div></div>
    <div class="score-panel">
      <div class="score-card mv"><div class="label">步数</div><div class="value" id="score-mv">0</div></div>
      <div class="score-card"><div class="label">最佳</div><div class="value" id="score-best">--</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="cv" width="400" height="500"></canvas>
    <div class="overlay win" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2 id="win-title">曹操脱困！</h2><p id="win-msg"></p><button class="btn primary" onclick="game.restart()">再来一局</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">新棋盘</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">自动: 关</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI 求解中…</span></div>
  <div class="stats-bar"><span>移动棋子 · 让曹操(红)从底部出口逃出</span></div>
</div>
<script>
(function(){
  'use strict';
  const COLS=4, ROWS=5, W=400, H=500, CS=W/COLS;
  const canvas=document.getElementById('cv'); const ctx=canvas.getContext('2d');
  const PAL=['#4dd0ff','#54e08a','#ffd24d','#b06bff','#ff8c1a','#2ad6c8','#ff5db1','#7ad0ff'];
  const EXIT_C=1; // 曹操出口占据 cols 1-2

  // 经典华容道棋子：曹操(2x2) 必须从底部中间出口逃出
  // 类型: b=2x2(曹操)  v=竖2x1  h=横1x2  s=1x1(兵)
  class Klotski {
    constructor(){
      this.autoPlay=false; this.last=0; this.raf=null; this.over=false;
      this.moves=0; this.best=this.loadBest(); this.cool=0; this.solution=[]; this.solIdx=0;
      this.drag=null;
      this.loop=this.loop.bind(this);
      this.bind(); this.restart();
      this.last=performance.now(); this.raf=requestAnimationFrame(this.loop);
    }
    loadBest(){ try{ return localStorage.getItem('klotski_best')||'--'; }catch(e){ return '--'; } }
    saveBest(v){ try{ localStorage.setItem('klotski_best', v); }catch(e){} }
    box(p){ return (p.type==='b'||p.type==='v')?2:1; }   // 高度
    wide(p){ return (p.type==='b'||p.type==='h')?2:1; }  // 宽度
    dirs(p){
      // 真·华容道：所有棋子均可四向滑动（不旋转），曹操(2x2)亦如此
      return [[1,0],[-1,0],[0,1],[0,-1]];
    }
    occ(list, exceptId){
      const g=Array.from({length:ROWS},()=>Array(COLS).fill(-1));
      for(const p of list){ if(p.id===exceptId) continue;
        const h=this.box(p), w=this.wide(p);
        for(let i=0;i<h;i++) for(let j=0;j<w;j++){ const r=p.r+i, c=p.c+j; if(r>=0&&r<ROWS&&c>=0&&c<COLS) g[r][c]=p.id; }
      }
      return g;
    }
    canStep(list, p, dr, dc){
      const h=this.box(p), w=this.wide(p);
      const nr=p.r+dr, nc=p.c+dc;
      const g=this.occ(list, p.id);
      for(let i=0;i<h;i++) for(let j=0;j<w;j++){
        const r=nr+i, c=nc+j;
        if(r<0||r>=ROWS||c<0||c>=COLS) return false;
        if(g[r][c]!==-1 && g[r][c]!==p.id) return false;
      }
      return true;
    }
    freeSteps(list, p, dr, dc){
      const g=this.occ(list, p.id); let n=0;
      let nr=p.r, nc=p.c;
      while(true){ nr+=dr; nc+=dc; const h=this.box(p), w=this.wide(p); let ok=true;
        for(let i=0;i<h;i++) for(let j=0;j<w;j++){ const r=nr+i, c=nc+j;
          if(r<0||r>=ROWS||c<0||c>=COLS){ ok=false; break; }
          if(g[r][c]!==-1 && g[r][c]!==p.id){ ok=false; break; } }
        if(!ok) break; n++;
      }
      return n;
    }
    isWin(list){ const cao=list.find(function(p){ return p.type==='b'; }); return cao.r===(ROWS-2) && cao.c===EXIT_C; }
    solve(list0, cap=200000){
      const self=this;
      const key=function(ls){ return ls.map(function(p){ return p.id+':'+p.type+':'+p.r+':'+p.c; }).join('|'); };
      const start=list0.map(function(p){ return Object.assign({},p); });
      if(this.isWin(start)) return {path:[],capped:false};
      const q=[start]; let head=0; const seen=new Set([key(start)]);
      const parent=new Map(); parent.set(key(start),{prev:null,move:null});
      while(head<q.length){
        const cur=q[head++]; const g=this.occ(cur,-1);
        for(let ci=0; ci<cur.length; ci++){
          const c=cur[ci]; const ds=this.dirs(c);
          for(let di=0; di<ds.length; di++){
            const dr=ds[di][0], dc=ds[di][1];
            const nr=c.r+dr, nc=c.c+dc; const h=this.box(c), w=this.wide(c); let ok=true;
            for(let i=0;i<h;i++) for(let j=0;j<w;j++){ const r=nr+i, ccol=nc+j;
              if(r<0||r>=ROWS||ccol<0||ccol>=COLS||(g[r][ccol]!==-1&&g[r][ccol]!==c.id)){ ok=false; break; } }
            if(!ok) continue;
            const nx=cur.map(function(x){ return x.id===c.id ? Object.assign({},x,{r:nr,c:nc}) : Object.assign({},x); });
            const kk=key(nx);
            if(this.isWin(nx)){
              const path=[{id:c.id,dr:dr,dc:dc}]; let pk=key(cur);
              while(parent.get(pk) && parent.get(pk).prev!==null){ const node=parent.get(pk); path.push(node.move); pk=node.prev; }
              path.reverse(); return {path:path,capped:false};
            }
            if(!seen.has(kk)){ seen.add(kk); parent.set(kk,{prev:key(cur),move:{id:c.id,dr:dr,dc:dc}}); q.push(nx); }
          }
        }
        if(seen.size>cap) return {path:null,capped:true};
      }
      return {path:null,capped:false};
    }
    bfsPath(start, isGoal){
      // 通用 BFS：从 start 出发找首个满足 isGoal 的局面，返回「移动序列」
      // （每步均为合法单步滑动）。找不到则返回 null。用于一次性求出「出口→顶行」路径。
      const key=ls=>ls.map(p=>p.id+':'+p.type+':'+p.r+':'+p.c).join('|');
      if(isGoal(start)) return [];
      const q=[start.map(p=>({...p}))]; let head=0; const seen=new Set([key(q[0])]);
      const parent=new Map(); parent.set(key(q[0]),{prev:null,move:null});
      while(head<q.length){
        const cur=q[head++]; const g=this.occ(cur,-1);
        for(let ci=0; ci<cur.length; ci++){
          const c=cur[ci]; const ds=this.dirs(c);
          for(let di=0; di<ds.length; di++){
            const dr=ds[di][0], dc=ds[di][1];
            const nr=c.r+dr, nc=c.c+dc, h=this.box(c), w=this.wide(c); let ok=true;
            for(let i=0;i<h;i++) for(let j=0;j<w;j++){ const r=nr+i, ccol=nc+j;
              if(r<0||r>=ROWS||ccol<0||ccol>=COLS||(g[r][ccol]!==-1&&g[r][ccol]!==c.id)){ ok=false; break; } }
            if(!ok) continue;
            const nx=cur.map(x=>x.id===c.id?{...x,r:nr,c:nc}:{...x});
            const kk=key(nx);
            if(isGoal(nx)){
              const path=[{id:c.id,dr,dc}]; let pk=key(cur);
              while(parent.get(pk) && parent.get(pk).prev!==null){ const node=parent.get(pk); path.push(node.move); pk=node.prev; }
              path.reverse(); return path;
            }
            if(!seen.has(kk)){ seen.add(kk); parent.set(kk,{prev:key(cur),move:{id:c.id,dr,dc}}); q.push(nx); }
          }
        }
        if(seen.size>300000) return null;
      }
      return null;
    }
    genPuzzle(){
      // 目标：曹操(2x2)开局在顶行(r0,c1)，离底部出口(r3,c1)很远，绝不会「挪一格就赢」。
      // 做法：从「曹操已在出口(底中)」的合法终局出发，BFS 一次性求出「出口→顶行」的升顶路径并缓存；
      // 每局复用该路径把曹操升到顶行，再随机挪动其余棋子做变化（不动曹操，守住顶行）。
      // 逆向(变化)+逆向(升顶) 即「当前局面→顶行→出口」的解法，由构造保证一定可解。
      const EXIT_R=ROWS-2, EXIT_C=1;
      const solved=[
        {id:'cao', type:'b', r:3, c:1, name:'曹操', color:'#ff5d6a'},
        {id:'guan',type:'h', r:0, c:1, name:'关羽', color:PAL[0]},
        {id:'zhang',type:'v', r:0, c:0, name:'张飞', color:PAL[1]},
        {id:'zhao',type:'v', r:0, c:3, name:'赵云', color:PAL[2]},
        {id:'ma',  type:'v', r:2, c:0, name:'马超', color:PAL[3]},
        {id:'huang',type:'v', r:2, c:3, name:'黄忠', color:PAL[4]},
        {id:'b1', type:'s', r:1, c:1, name:'兵', color:PAL[5]},
        {id:'b2', type:'s', r:1, c:2, name:'兵', color:PAL[5]},
        {id:'b3', type:'s', r:4, c:0, name:'兵', color:PAL[5]},
        {id:'b4', type:'s', r:4, c:3, name:'兵', color:PAL[5]},
      ];
      if(!this._ascend){
        // 一次性：从终局 BFS 到「曹操到顶行」的局面，得到升顶路径
        this._ascend = this.bfsPath(solved.map(p=>({...p})), ls=>ls.find(p=>p.type==='b').r===0) || [];
      }
      const caoOneMoveWin=(ls)=>{ const cao=ls.find(p=>p.type==='b'); for(const [dr,dc] of this.dirs(cao)){ if(this.canStep(ls,cao,dr,dc)){ const t=ls.map(p=>p.id===cao.id?{...p,r:cao.r+dr,c:cao.c+dc}:{...p}); if(this.isWin(t)) return true; } } return false; };
      const ascend=this._ascend;
      let chosen=null, chosenSol=null, outer=0;
      while(!chosen && outer<50){
        outer++;
        const cur=solved.map(p=>({...p}));
        // ① 复用缓存的升顶路径 → 曹操到顶行
        for(const m of ascend){ const p=cur.find(x=>x.id===m.id); p.r+=m.dr; p.c+=m.dc; }
        // ② 只随机挪动其余棋子做变化（绝不动曹操，守住顶行）
        const extra=[];
        const K=30+((Math.random()*40)|0);
        for(let k=0;k<K;k++){
          const others=cur.filter(p=>p.type!=='b');
          const p=others[(Math.random()*others.length)|0];
          const d=this.dirs(p)[(Math.random()*4)|0];
          if(this.canStep(cur,p,d[0],d[1])){ p.r+=d[0]; p.c+=d[1]; extra.push({id:p.id,dr:d[0],dc:d[1]}); }
        }
        if(caoOneMoveWin(cur)) continue; // 安全阀：极端情况下曹操仍不能一步就赢
        chosen=cur;
        // 解法：逆向(变化) 回到顶行局面，再逆向(升顶) 回到出口
        chosenSol=extra.slice().reverse().map(m=>({id:m.id, dr:-m.dr, dc:-m.dc}))
                   .concat(ascend.slice().reverse().map(m=>({id:m.id, dr:-m.dr, dc:-m.dc})));
      }
      if(!chosen){ chosen=solved.map(p=>({...p})); chosenSol=ascend.slice().reverse(); }
      this.pieces=chosen.map(p=>({...p, dr:p.r, dc:p.c}));
      this.solution=chosenSol;
    }
    restart(){
      this.stopAuto(); this.over=false; this.moves=0; this.cool=0; this.solIdx=0; this.drag=null;
      document.getElementById('overlay-win').classList.remove('active');
      this.genPuzzle(); this.updateUI();
    }
    updateUI(){ document.getElementById('score-mv').textContent=this.moves; document.getElementById('score-best').textContent=this.best; }
    doMove(id,dr,dc){ const p=this.pieces.find(x=>x.id===id); if(!p) return false; if(!this.canStep(this.pieces,p,dr,dc)) return false; p.r+=dr; p.c+=dc; this.moves++; this.updateUI(); if(this.isWin(this.pieces)){ this.over=true; this.finish(); } return true; }
    step(dt){
      if(this.over) return;
      for(const p of this.pieces){ p.dr+=(p.r-p.dr)*0.3; p.dc+=(p.c-p.dc)*0.3; }
      if(this.autoPlay){
        if(this.cool>0) this.cool--;
        else if(this.solIdx<this.solution.length){ const m=this.solution[this.solIdx]; if(this.doMove(m.id,m.dr,m.dc)) this.solIdx++; this.cool=8; }
        else if(!this.over){ this.over=true; this.finish(); }
      }
    }
    finish(){ if(this.autoPlay) this.stopAuto();
      document.getElementById('win-title').textContent='曹操脱困！';
      document.getElementById('win-msg').textContent='用了 '+this.moves+' 步';
      if(this.best==='--' || this.moves<parseInt(this.best)) this.saveBest(String(this.moves));
      document.getElementById('overlay-win').classList.add('active');
    }
    loop(now){
      const dt=Math.max(0.3,Math.min(2.2,(now-this.last)/16.67)); this.last=now;
      this.step(dt); this.draw();
      this.raf=requestAnimationFrame(this.loop);
    }
    cellAt(e){ const r=canvas.getBoundingClientRect(); return {r:this.clampIdx(((e.clientY-r.top)/r.height*H/CS)|0), c:this.clampIdx(((e.clientX-r.left)/r.width*W/CS)|0)}; }
    clampIdx(v){ return v<0?0:(v>=ROWS?ROWS-1:v); }
    pieceAt(rc){ for(const p of this.pieces){ const h=this.box(p), w=this.wide(p); for(let i=0;i<h;i++) for(let j=0;j<w;j++){ if(p.r+i===rc.r && p.c+j===rc.c) return p; } } return null; }
    draw(){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#0b1024'; ctx.fillRect(0,0,W,H);
      // 出口高亮（底部中间两格）
      ctx.fillStyle='#ffd70022';
      ctx.fillRect(EXIT_C*CS, (ROWS-1)*CS, 2*CS, CS);
      ctx.strokeStyle='#ffd70088'; ctx.lineWidth=2; ctx.setLineDash([6,5]);
      ctx.strokeRect(EXIT_C*CS+3, (ROWS-1)*CS+3, 2*CS-6, CS-6); ctx.setLineDash([]);
      // 网格
      ctx.strokeStyle='#1a2240'; ctx.lineWidth=1;
      for(let i=0;i<=COLS;i++){ ctx.beginPath(); ctx.moveTo(i*CS,0); ctx.lineTo(i*CS,H); ctx.stroke(); }
      for(let i=0;i<=ROWS;i++){ ctx.beginPath(); ctx.moveTo(0,i*CS); ctx.lineTo(W,i*CS); ctx.stroke(); }
      // 棋子
      for(const p of this.pieces){
        const h=this.box(p), w=this.wide(p);
        const x=p.dc*CS+4, y=p.dr*CS+4, pw=w*CS-8, ph=h*CS-8;
        ctx.shadowColor=p.color; ctx.shadowBlur=12; ctx.fillStyle=p.color; this.rr(x,y,pw,ph,8); ctx.fill(); ctx.shadowBlur=0;
        ctx.fillStyle='#0a0a1a55'; this.rr(x+5,y+5,pw-10,ph-10,5); ctx.fill();
        ctx.fillStyle='#ffffff'; ctx.textAlign='center'; ctx.textBaseline='middle';
        const fs = p.type==='b'?22:(p.type==='s'?15:17);
        ctx.font='800 '+fs+'px "Segoe UI",system-ui,sans-serif';
        ctx.fillText(p.name, x+pw/2, y+ph/2);
      }
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){
      // 优先使用生成时已算好并验证过的解法（曹操从开局到出口，由构造保证可解），
      // 仅当玩家手动改动过棋盘（moves>0）才实时 BFS 重新求解——避免每次开自动都跑全量 BFS。
      if(!(this.moves===0 && this.solution && this.solution.length)){
        const res=this.solve(this.pieces,200000);
        if(!res||res.capped||!res.path){ this.flashStatus('当前局面无解'); return; }
        this.solution=res.path;
      }
      this.solIdx=0; this.cool=8; this.autoPlay=true;
      const b=document.getElementById('btn-auto'); b.textContent='自动: 开'; b.classList.add('auto-on');
      document.getElementById('ai-indicator').style.display='flex';
      document.getElementById('ai-status').textContent='AI 求解中…（'+this.solution.length+' 步）';
    }
    flashStatus(t){ const el=document.getElementById('ai-status'); if(el) el.textContent=t; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='自动: 关'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    bind(){
      const pos=(e)=>{ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; };
      canvas.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over) return; canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId); const rc=this.cellAt(e); const p=this.pieceAt(rc); if(!p) return; this.drag={p, start:pos(e), baseR:p.r, baseC:p.c}; });
      canvas.addEventListener('pointermove',(e)=>{ if(!this.drag||this.autoPlay||this.over) return; const d=pos(e); const p=this.drag.p;
        // 所有棋子均可四向滑动（真实华容道规则）：按拖拽主方向在单一轴线上移动并夹紧到可行步数
        const ddx=(d.x-this.drag.start.x)/CS, ddy=(d.y-this.drag.start.y)/CS;
        let dr=0, dc=0;
        if(Math.abs(ddy)>=Math.abs(ddx)){ dr=Math.round(ddy); } else { dc=Math.round(ddx); }
        if(dr<0){ dr=Math.max(-this.freeSteps(this.pieces,p,-1,0), dr); } else if(dr>0){ dr=Math.min(this.freeSteps(this.pieces,p,1,0), dr); }
        if(dc<0){ dc=Math.max(-this.freeSteps(this.pieces,p,0,-1), dc); } else if(dc>0){ dc=Math.min(this.freeSteps(this.pieces,p,0,1), dc); }
        p.r=this.drag.baseR+dr; p.c=this.drag.baseC+dc;
      });
      canvas.addEventListener('pointerup',()=>{ if(!this.drag) return; const p=this.drag.p;
        const moved = (p.r!==this.drag.baseR)||(p.c!==this.drag.baseC);
        this.drag=null;
        if(moved){ this.moves++; this.updateUI(); }
        if(this.isWin(this.pieces)){ this.over=true; this.finish(); }
      });
    }
  }
  window.game=new Klotski();
})();
</script>
