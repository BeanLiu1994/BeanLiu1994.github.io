<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0e1a" />
<title>Fruit Ninja · Neon Slice</title>
<style>
  :root{
    --bg:#0a0e1a; --surface:#11182b; --text:#eaf2ff; --muted:#7d8bb5;
    --accent:#39ff9e; --accent2:#ff5d9e; --gold:#ffd166; --ok:#39ff9e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;position:fixed;width:100%;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #11304f 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #3a1140 0%, transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:480px;height:100vh;max-height:880px;display:flex;flex-direction:column;padding:12px;gap:10px;}
  .header{display:flex;align-items:center;justify-content:space-between;}
  .title-block h1{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff10;border-radius:10px;padding:6px 12px;text-align:center;min-width:54px;}
  .score-card .label{font-size:.5rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.best .value{color:var(--gold);}
  .score-card.wave .value{color:var(--accent);}
  .board-wrap{position:relative;flex:1;min-height:0;background:var(--surface);border:1px solid #ffffff10;border-radius:16px;overflow:hidden;box-shadow:0 0 50px #00000040,0 0 70px #39ff9e18;}
  .board-wrap, .board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:100%;}
  .controls{display:flex;gap:8px;}
  .btn{flex:1;min-width:80px;padding:11px 14px;border:1px solid #ffffff14;border-radius:11px;background:var(--surface);color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .18s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff12;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#0a0e1a;}
  .btn.primary:hover{box-shadow:0 0 22px #39ff9e55;}
  .btn.auto-on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#0a0e1a;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 6px #39ff9e44;}50%{box-shadow:0 0 20px #39ff9e88,0 0 38px #ff5d9e55;}}
  .ai-indicator{display:none;align-items:center;gap:8px;justify-content:center;font-size:.72rem;color:var(--muted);min-height:18px;}
  .ai-indicator.show{display:flex;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.7);}}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:5;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0e1add;backdrop-filter:blur(5px);}
  .overlay-content{position:relative;text-align:center;z-index:1;padding:20px;}
  .overlay-content h2{font-size:2rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay-content p{color:var(--muted);margin-bottom:14px;font-size:.85rem;}
  .hint{text-align:center;font-size:.64rem;color:var(--muted);line-height:1.5;}
  @media (max-width:400px){.title-block h1{font-size:1.3rem;}.btn{padding:10px;font-size:.76rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Fruit Ninja</h1><div class="sub">N E O N   S L I C E</div></div>
    <div class="score-panel">
      <div class="score-card wave"><div class="label">Wave</div><div class="value" id="wave">1</div></div>
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay-over">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2 id="over-title">通关！</h2>
        <p id="over-msg">全部水果已切完</p>
        <button class="btn primary" id="btn-again" style="min-width:140px;">再来一局</button>
      </div>
    </div>
  </div>
  <div class="ai-indicator" id="ai-indicator"><span class="ai-dot"></span><span id="ai-status">AI 自动挥刀切水果…</span></div>
  <div class="controls">
    <button class="btn primary" id="btn-auto">自动游玩</button>
    <button class="btn" id="btn-restart">重开</button>
  </div>
  <div class="hint">滑动屏幕切开水果 · 别碰炸弹 · 自动模式 AI 安全通关</div>
</div>
<script>
(function(){
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), waveEl=document.getElementById('wave');
  const overlay=document.getElementById('overlay-over'), overMsg=document.getElementById('over-msg'), overTitle=document.getElementById('over-title');
  const btnAuto=document.getElementById('btn-auto'), btnRestart=document.getElementById('btn-restart'), btnAgain=document.getElementById('btn-again');
  const aiInd=document.getElementById('ai-indicator'), aiStatus=document.getElementById('ai-status');

  const FRUITS=[
    {sym:'🍉',col:'#ff5d6c',juice:'#ff6b81'},{sym:'🍎',col:'#ff3b5c',juice:'#ff5d6c'},
    {sym:'🍊',col:'#ff8a3d',juice:'#ffa94d'},{sym:'🍋',col:'#ffd166',juice:'#ffe08a'},
    {sym:'🍇',col:'#b18cff',juice:'#c9a6ff'},{sym:'🫐',col:'#5d8bff',juice:'#7aa2ff'},
    {sym:'🍓',col:'#ff5d9e',juice:'#ff8ac0'},{sym:'🥝',col:'#39ff9e',juice:'#7dffc4'}
  ];
  const MAX_WAVE=5;
  const G=0.34;

  class Game{
    constructor(){
      this.autoPlay=false; this.over=false;
      this.best=parseInt(localStorage.getItem('fruitninjaBest')||'0',10); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      this.bindInput(); this.newGame();
      this.last=performance.now(); this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){
      const rc=canvas.getBoundingClientRect();
      this.W=Math.max(300,Math.min(rc.width||420,480)); this.H=Math.max(360,Math.min(rc.height||640,860));
      const d=window.devicePixelRatio||1; canvas.width=this.W*d; canvas.height=this.H*d; ctx.setTransform(d,0,0,d,0,0);
    }
    newGame(){
      this.fruits=[]; this.halves=[]; this.parts=[]; this.blade=[]; this.bladeHead={x:this.W/2,y:this.H/2}; this.bladeActive=0;
      this.score=0; this.lives=3; this.wave=1; this.frame=0; this.overFrame=0;
      this.spawnQueue=[]; this.spawnTimer=0; this.spawned=0; this.quota=0; this.waveCleared=false;
      this.over=false; this.shake=0; this.flash=0;
      scoreEl.textContent='0'; waveEl.textContent='1'; bestEl.textContent=this.best;
      overlay.classList.remove('active'); aiStatus.textContent='AI 自动挥刀切水果…';
      this.buildWave(this.wave);
    }
    buildWave(w){
      this.quota=4+w*2; this.spawned=0; this.waveCleared=false; this.spawnQueue=[];
      const bombCount=Math.min(1+Math.floor(w/2),3);
      for(let i=0;i<this.quota;i++){
        const isBomb=(bombCount>0 && Math.random()<0.22 && i>1);
        this.spawnQueue.push({t:this.frame+12+i*26+(Math.random()*8|0), bomb:isBomb});
      }
      this.spawnTimer=0;
    }
    spawnFruit(bomb){
      const x=this.W*(0.16+Math.random()*0.68);
      const r=bomb?20:24+Math.random()*10;
      const vy=-(12.5+Math.random()*3.2);
      const vx=(x<this.W/2?1:-1)*(1.4+Math.random()*2.6);
      const f={x,y:this.H+r+10,vx,vy,r,kind:bomb?'bomb':'fruit',sliced:false,rot:Math.random()*6.28,vrot:(Math.random()-.5)*0.2};
      if(!bomb){ const fr=FRUITS[(Math.random()*FRUITS.length)|0]; f.sym=fr.sym; f.col=fr.col; f.juice=fr.juice; }
      this.fruits.push(f); this.spawned++;
    }
    sliceFruit(f){
      f.sliced=true;
      const half={x:f.x,y:f.y,vx:f.vx*0.5,vy:f.vy*0.5,r:f.r,sym:f.sym,col:f.col,rot:f.rot,side:1,life:26};
      const half2={x:f.x,y:f.y,vx:f.vx*0.5,vy:f.vy*0.5,r:f.r,sym:f.sym,col:f.col,rot:f.rot,side:-1,life:26};
      this.halves.push(half,half2);
      for(let i=0;i<10;i++){ const a=Math.random()*6.28, s=2+Math.random()*4; this.parts.push({x:f.x,y:f.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:22,r:2+Math.random()*2,col:f.kind==='bomb'?'#ff5d6c':f.juice}); }
      this.score+=10; if(this.score>this.best){ this.best=this.score; localStorage.setItem('fruitninjaBest',String(this.best)); bestEl.textContent=this.best; }
      scoreEl.textContent=this.score; this.flash=8;
    }
    bombHit(f){
      f.sliced=true; this.shake=14; this.flash=12; for(let i=0;i<22;i++){ const a=Math.random()*6.28,s=3+Math.random()*5; this.parts.push({x:f.x,y:f.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,r:2+Math.random()*3,col:'#ff5d6c'}); }
      this.lose('💥 切到炸弹了！');
    }
    lose(msg){ if(this.over) return; this.over=true; this.overFrame=this.frame; overTitle.textContent='游戏结束'; overMsg.textContent=msg; if(!this.autoPlay) overlay.classList.add('active'); }
    win(){ if(this.over) return; this.over=true; this.overFrame=this.frame; overTitle.textContent='通关！'; overMsg.textContent='全部 '+MAX_WAVE+' 关水果切完 🎉'; if(!this.autoPlay) overlay.classList.add('active'); }
    startAuto(){ this.autoPlay=true; btnAuto.classList.add('auto-on'); btnAuto.textContent='自动中'; aiInd.classList.add('show'); }
    stopAuto(){ this.autoPlay=false; btnAuto.classList.remove('auto-on'); btnAuto.textContent='自动游玩'; aiInd.classList.remove('show'); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else this.startAuto(); }
    bindInput(){
      const getXY=(e)=>{ const r=canvas.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX); const cy=(e.touches?e.touches[0].clientY:e.clientY); return {x:cx-r.left,y:cy-r.top}; };
      const segHit=(ax,ay,bx,by,f)=>{ const dx=bx-ax,dy=by-ay; const len2=dx*dx+dy*dy||1; const t=Math.max(0,Math.min(1,((f.x-ax)*dx+(f.y-ay)*dy)/len2)); const px=ax+dx*t, py=ay+dy*t; const ddx=f.x-px, ddy=f.y-py; return (ddx*ddx+ddy*ddy)<=(f.r+10)*(f.r+10); };
      const trySlice=(x,y)=>{
        const n=this.blade.length;
        for(const f of this.fruits){ if(f.sliced) continue;
          if(n>=2){ if(segHit(this.blade[n-2].x,this.blade[n-2].y,x,y,f)){ if(f.kind==='bomb') this.bombHit(f); else this.sliceFruit(f); } }
          else { const ddx=f.x-x,ddy=f.y-y; if(ddx*ddx+ddy*ddy<=(f.r+10)*(f.r+10)){ if(f.kind==='bomb') this.bombHit(f); else this.sliceFruit(f); } }
        }
      };
      const onMove=(e)=>{ if(this.autoPlay||this.over) return; const p=getXY(e); this.blade.push({x:p.x,y:p.y}); if(this.blade.length>14) this.blade.shift(); this.bladeActive=6; trySlice(p.x,p.y); e.preventDefault(); };
      const onDown=(e)=>{ if(this.autoPlay||this.over) return; const p=getXY(e); this.blade=[{x:p.x,y:p.y}]; this.bladeActive=6; e.preventDefault(); };
      canvas.addEventListener('pointermove',onMove); canvas.addEventListener('pointerdown',onDown);
      canvas.addEventListener('touchstart',onDown,{passive:false}); canvas.addEventListener('touchmove',onMove,{passive:false});
    }
    autoSlice(){
      // pick the most urgent unsliced, non-bomb fruit (closest to leaving screen)
      let target=null, bestY=-1;
      for(const f of this.fruits){ if(f.sliced||f.kind==='bomb') continue; if(f.y>bestY){ bestY=f.y; target=f; } }
      if(!target){ this.bladeActive=Math.max(0,this.bladeActive-1); return; }
      const dx=target.x-this.bladeHead.x, dy=target.y-this.bladeHead.y, dist=Math.hypot(dx,dy)||1;
      const step=Math.min(dist, 14+dist*0.4);
      this.bladeHead.x+=dx/dist*step; this.bladeHead.y+=dy/dist*step;
      this.blade.push({x:this.bladeHead.x,y:this.bladeHead.y}); if(this.blade.length>14) this.blade.shift(); this.bladeActive=4;
      if(dist < target.r+12){ this.sliceFruit(target); }
    }
    loop(now){ const dt=Math.min(40,now-this.last); this.last=now; this.frame++; this.update(dt); this.render(); requestAnimationFrame(this.loop); }
    update(dt){
      const f=dt/16.67;
      if(this.shake>0) this.shake-=f; if(this.flash>0) this.flash-=f;
      // spawn
      if(!this.waveCleared && this.spawned<this.quota){
        while(this.spawnQueue.length && this.spawnQueue[0].t<=this.frame){ const ev=this.spawnQueue.shift(); this.spawnFruit(ev.bomb); }
      }
      // physics
      for(const fr of this.fruits){ if(fr.sliced) continue; fr.vy+=G*f; fr.x+=fr.vx*f; fr.y+=fr.vy*f; fr.rot+=fr.vrot*f;
        if(fr.x<fr.r){ fr.x=fr.r; fr.vx=Math.abs(fr.vx); } if(fr.x>this.W-fr.r){ fr.x=this.W-fr.r; fr.vx=-Math.abs(fr.vx); }
        if(fr.y>this.H+fr.r+30){ fr.sliced=true; if(fr.kind!=='bomb'){ this.lives--; if(this.lives<=0) this.lose('漏掉太多水果了！'); } }
      }
      this.fruits=this.fruits.filter(fr=>!fr.sliced);
      for(const h of this.halves){ h.vy+=G*f; h.x+=h.vx*f; h.y+=h.vy*f; h.rot+=h.side*0.12*f; h.life-=f; }
      this.halves=this.halves.filter(h=>h.life>0);
      for(const p of this.parts){ p.vy+=0.4*f; p.x+=p.vx*f; p.y+=p.vy*f; p.life-=f; }
      this.parts=this.parts.filter(p=>p.life>0);
      if(this.bladeActive>0 && !this.autoPlay) this.bladeActive-=f;
      // wave / win / auto
      if(!this.over){
        if(this.autoPlay) this.autoSlice();
        const allSpawned=this.spawned>=this.quota;
        if(allSpawned && this.fruits.length===0 && !this.waveCleared){
          this.waveCleared=true;
          if(this.wave>=MAX_WAVE){ this.win(); }
          else { this.wave++; waveEl.textContent=this.wave; this.buildWave(this.wave); }
        }
      } else if(this.autoPlay && this.frame-this.overFrame>70){ this.newGame(); }
    }
    render(){
      const sx=(this.shake>0)?(Math.random()-.5)*this.shake:0, sy=(this.shake>0)?(Math.random()-.5)*this.shake:0;
      ctx.clearRect(0,0,this.W,this.H); ctx.save(); ctx.translate(sx,sy);
      // bg glow
      ctx.fillStyle='#0c1322'; this.roundRect(0,0,this.W,this.H,16); ctx.fill();
      // halves
      for(const h of this.halves){ ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(h.rot); ctx.globalAlpha=Math.min(1,h.life/26); const s=h.r; ctx.fillStyle=h.col; this.roundRect(-s/2,-s/2+s*0.0, s, s/2, 6); ctx.fill(); ctx.restore(); }
      // fruits
      for(const fr of this.fruits){ ctx.save(); ctx.translate(fr.x,fr.y); ctx.rotate(fr.rot);
        if(fr.kind==='bomb'){ ctx.shadowColor='#ff5d6c'; ctx.shadowBlur=18; ctx.fillStyle='#1a1f2e'; ctx.beginPath(); ctx.arc(0,0,fr.r,0,6.2832); ctx.fill(); ctx.shadowBlur=0; ctx.strokeStyle='#ff5d6c'; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle='#ff5d6c'; ctx.font=Math.floor(fr.r*1.1)+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('💣',0,1); }
        else { ctx.shadowColor=fr.col; ctx.shadowBlur=16; ctx.font=Math.floor(fr.r*1.7)+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(fr.sym,0,1); ctx.shadowBlur=0; }
        ctx.restore();
      }
      // particles
      for(const p of this.parts){ ctx.globalAlpha=Math.min(1,p.life/22); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill(); } ctx.globalAlpha=1;
      // blade trail
      if(this.blade.length>=2 && this.bladeActive>0){ ctx.strokeStyle='rgba(180,255,230,0.9)'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.shadowColor='#39ff9e'; ctx.shadowBlur=14; ctx.beginPath(); ctx.moveTo(this.blade[0].x,this.blade[0].y); for(let i=1;i<this.blade.length;i++) ctx.lineTo(this.blade[i].x,this.blade[i].y); ctx.stroke(); ctx.shadowBlur=0; }
      // lives
      for(let i=0;i<3;i++){ ctx.globalAlpha=i<this.lives?1:0.25; ctx.fillStyle=i<this.lives?'#ffd166':'#445'; ctx.font='18px system-ui'; ctx.textAlign='left'; ctx.fillText('❤',12+i*22,26); } ctx.globalAlpha=1;
      ctx.restore();
      if(this.flash>0){ ctx.globalAlpha=this.flash/12*0.3; ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,this.W,this.H); ctx.globalAlpha=1; }
    }
    roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  const game=new Game();
  window.game=game;
  btnAuto.addEventListener('click',()=>game.toggleAuto());
  btnRestart.addEventListener('click',()=>{ game.stopAuto(); game.newGame(); });
  btnAgain.addEventListener('click',()=>{ game.stopAuto(); game.newGame(); });
})();
</script>
</body>
</html>
