<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>坦克对决 · Tank Battle</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#ffb347; --accent-glow:#ffb34766; --gold:#ffd54a; --ok:#3ecf8e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 18% 12%, #2a1c10 0%, transparent 55%), radial-gradient(ellipse at 82% 88%, #102a38 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#ffb347,#ff5d6a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#1a1006; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#1a1006; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>坦克对决</h1><div class="sub">T A N K &nbsp; B A T T L E</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">胜局</div><div class="value" id="best">0</div></div>
      <div class="score-card"><div class="label">回合</div><div class="value" id="progress">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="460" height="320"></canvas></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">新对局</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">按住屏幕/方向键驾驶坦克朝指针方向移动并自动开火；敌方由 AI 操控。三发命中即胜。</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const progEl=document.getElementById('progress'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  const GW=23, GH=16;
  function norm(a){ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; }
  class Tank {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0; this.aim=null; this.keys={};
      this.best=parseInt(localStorage.getItem('tankBest')||'0'); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); if(this.autoPlay) return; const rect=canvas.getBoundingClientRect(); this.aim={x:(e.clientX-rect.left)*(this.W/rect.width),y:(e.clientY-rect.top)*(this.W/rect.height)}; });
      canvas.addEventListener('pointermove',(e)=>{ if(this.aim&&!this.autoPlay){ const rect=canvas.getBoundingClientRect(); this.aim={x:(e.clientX-rect.left)*(this.W/rect.width),y:(e.clientY-rect.top)*(this.W/rect.height)}; } });
      canvas.addEventListener('pointerup',()=>{ if(!this.autoPlay) this.aim=null; });
      window.addEventListener('keydown',(e)=>{ if(this.autoPlay) return; this.keys[e.key.toLowerCase()]=true; if(e.key===' ') this.fire(this.you); });
      window.addEventListener('keyup',(e)=>{ this.keys[e.key.toLowerCase()]=false; });
      this.restart(); this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(300,Math.min(rect.width||460,460)); const dpr=window.devicePixelRatio||1; this.W=w; this.cell=w/GW; this.H=this.cell*GH; canvas.width=w*dpr; canvas.height=this.H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    isWall(x,y){ const c=Math.floor(x/this.cell), r=Math.floor(y/this.cell); if(c<0||c>=GW||r<0||r>=GH) return true; return this.walls.has(r*GW+c); }
    genWalls(){ this.walls=new Set(); for(let c=0;c<GW;c++){ this.walls.add(c); this.walls.add((GH-1)*GW+c); } for(let r=0;r<GH;r++){ this.walls.add(r*GW); this.walls.add(r*GW+GW-1); }
      const nb=3+((Math.random()*3)|0);
      for(let i=0;i<nb;i++){ const ww=2+((Math.random()*2)|0), hh=1+((Math.random()*2)|0); const c=3+((Math.random()*(GW-6-ww))|0), r=3+((Math.random()*(GH-6-hh))|0);
        for(let dr=0;dr<hh;dr++)for(let dc=0;dc<ww;dc++) this.walls.add((r+dr)*GW+(c+dc));
      }
      // guarantee a clear firing lane along the spawn-to-spawn diagonal
      for(let i=0;i<=48;i++){ const t=i/48; const x=(2.2+(GW-4.4)*t)*this.cell, y=((GH-2.2)+(2.2-(GH-2.2))*t)*this.cell; const c=Math.floor(x/this.cell), r=Math.floor(y/this.cell); this.walls.delete(r*GW+c); }
    }
    restart(){ this.stopAuto(); this.over=false; this.round=0; this._autoProgress=0; this.bullets=[]; this.genWalls();
      const mk=(x,y,a,col)=>({x,y,ang:a,aimAng:a,moveAng:a,hp:3,cd:0,thrust:false,col,spd:78,strafe:1,strafeT:0});
      this.you=mk(this.cell*2.2, this.cell*(GH-2.2), -Math.PI/2, '#3ecf8e');
      this.foe=mk(this.cell*(GW-2.2), this.cell*2.2, Math.PI/2, '#ff5d6a');
      this.status('驾驶坦克（按住屏幕/方向键）并自动开火，三发命中取胜。');
    }
    status(t){ statusEl.textContent=t; }
    fire(t){ if(t.cd>0) return; const bx=t.x+Math.cos(t.ang)*this.cell*0.6, by=t.y+Math.sin(t.ang)*this.cell*0.6; this.bullets.push({x:bx,y:by,vx:Math.cos(t.ang)*230,vy:Math.sin(t.ang)*230,owner:t}); t.cd=0.45; this._autoProgress++; }
    lineBlocked(a,b){ const d=Math.hypot(b.x-a.x,b.y-a.y); const n=Math.ceil(d/(this.cell*0.5)); for(let i=1;i<n;i++){ const x=a.x+(b.x-a.x)*i/n, y=a.y+(b.y-a.y)*i/n; if(this.isWall(x,y)) return true; } return false; }
    aiControl(t,opp){ const dx=opp.x-t.x, dy=opp.y-t.y, dist=Math.hypot(dx,dy)||1; const ux=dx/dist, uy=dy/dist; const toOpp=Math.atan2(dy,dx);
      t.aimAng=toOpp; t.thrust=true; const stand=this.cell*5.5;
      if(dist>stand+this.cell*1.5) t.moveAng=toOpp;
      else if(dist<stand-this.cell*1.5) t.moveAng=Math.atan2(-dy,-dx);
      else { t.moveAng=Math.atan2(-uy*t.strafe, ux*t.strafe); }
      t.strafeT-=0.016; if(t.strafeT<=0){ t.strafe*=-1; t.strafeT=0.8+Math.random()*1.2; }
      if(Math.abs(norm(toOpp-t.ang))<0.28 && !this.lineBlocked(t,opp) && t.cd<=0) this.fire(t);
    }
    inputControl(t){ const k=this.keys; let dx=0,dy=0; if(k['arrowup']||k['w']) dy-=1; if(k['arrowdown']||k['s']) dy+=1; if(k['arrowleft']||k['a']) dx-=1; if(k['arrowright']||k['d']) dx+=1;
      if(dx||dy){ t.aimAng=Math.atan2(dy,dx); t.moveAng=t.aimAng; t.thrust=true; if(t.cd<=0 && Math.random()<0.06) this.fire(t); }
      else if(this.aim){ const ax=this.aim.x-t.x, ay=this.aim.y-t.y; const ad=Math.hypot(ax,ay); t.aimAng=Math.atan2(ay,ax); t.moveAng=t.aimAng; if(ad>this.cell*0.4) t.thrust=true; else t.thrust=false; if(t.cd<=0) this.fire(t); }
      else { t.thrust=false; }
    }
    moveTank(t,dt){ let da=norm(t.aimAng-t.ang); const mt=4.5*dt; t.ang+=Math.max(-mt,Math.min(mt,da)); if(!t.thrust) return;
      const nx=t.x+Math.cos(t.moveAng)*t.spd*dt, ny=t.y+Math.sin(t.moveAng)*t.spd*dt;
      if(!this.isWall(nx,t.y)) t.x=nx; if(!this.isWall(t.x,ny)) t.y=ny;
      t.x=Math.max(this.cell*0.5,Math.min(this.W-this.cell*0.5,t.x)); t.y=Math.max(this.cell*0.5,Math.min(this.H-this.cell*0.5,t.y));
    }
    update(dt){ if(this.over) return;
      if(this.autoPlay){ this.aiControl(this.you,this.foe); this.aiControl(this.foe,this.you); }
      else { this.inputControl(this.you); this.aiControl(this.foe,this.you); }
      this.moveTank(this.you,dt); this.moveTank(this.foe,dt);
      for(const t of [this.you,this.foe]) if(t.cd>0) t.cd-=dt;
      for(let i=this.bullets.length-1;i>=0;i--){ const b=this.bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
        if(this.isWall(b.x,b.y)){ this.bullets.splice(i,1); continue; }
        for(const t of [this.you,this.foe]){ if(t!==b.owner && Math.hypot(t.x-b.x,t.y-b.y)<this.cell*0.45){ t.hp--; this.bullets.splice(i,1); if(t.hp<=0) this.endRound(t===this.foe); break; } }
      }
    }
    endRound(youWon){ this.round++; this._autoProgress++; progEl.textContent=this.round;
      if(youWon){ this.best++; localStorage.setItem('tankBest',String(this.best)); bestEl.textContent=this.best; }
      if(this.autoPlay){ this.bullets=[]; const mk=(x,y,a,col)=>({x,y,ang:a,hp:3,cd:0,desiredAng:a,thrust:false,col,spd:78,strafe:1,strafeT:0}); this.you=mk(this.cell*2.2,this.cell*(GH-2.2),-Math.PI/2,'#3ecf8e'); this.foe=mk(this.cell*(GW-2.2),this.cell*2.2,Math.PI/2,'#ff5d6a'); this.status(youWon?'🏆 击毁敌方坦克！':'💥 我方被击毁，再来'); }
      else { this.over=true; this.status(youWon?'🏆 你赢了！':'💥 你被击毁'); }
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.update(dt); this.draw(); }catch(err){ console.error(err); } }
    draw(){ const W=this.W,H=this.H; ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#0e1226'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#1b1b2e'; for(const key of this.walls){ const c=key%GW, r=(key/GW)|0; ctx.fillRect(c*this.cell,r*this.cell,this.cell,this.cell); }
      for(const t of [this.you,this.foe]){ ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.ang); ctx.fillStyle=t.col; ctx.shadowColor=t.col; ctx.shadowBlur=10; ctx.beginPath(); ctx.moveTo(this.cell*0.5,0); ctx.lineTo(-this.cell*0.35,this.cell*0.32); ctx.lineTo(-this.cell*0.2,0); ctx.lineTo(-this.cell*0.35,-this.cell*0.32); ctx.closePath(); ctx.fill(); ctx.restore();
        // hp
        for(let i=0;i<3;i++){ ctx.fillStyle=i<t.hp?t.col:'#33334a'; ctx.fillRect(t.x-this.cell*0.5+i*this.cell*0.34, t.y-this.cell*0.8, this.cell*0.26, this.cell*0.12); }
      }
      ctx.fillStyle='#ffd54a'; for(const b of this.bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,this.cell*0.16,0,7); ctx.fill(); }
    }
  }
  window.game=new Tank();
})();
</script>
</body>
</html>
