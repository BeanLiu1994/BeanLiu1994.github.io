<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹宾果 · Bingo</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0b1024; --text:#e0e0f0; --muted:#8888aa;
    --accent:#3ecf8e; --accent-glow:#3ecf8e66; --danger:#ff5d8a; --gold:#ffd700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg);
    background-image: radial-gradient(ellipse at 50% 0%, #103028 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #281038 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),#9af5c8,#3ecf8e); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 12px; text-align:center; min-width:64px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .score-card.w .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:auto; border-radius:10px; background:var(--board); cursor:pointer; }
  .controls { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:10px 12px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:600; cursor:pointer; transition:all .2s; text-align:center; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.96); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#04140c; }
  .btn.primary:hover { box-shadow:0 0 20px var(--accent-glow); }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#04140c; animation:pg 2s infinite; --glow:var(--accent-glow); }
  @keyframes pg { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:18px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bk .8s infinite; }
  @keyframes bk { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:6px; font-size:0.7rem; color:var(--muted); flex-wrap:wrap; }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹宾果</h1><div class="sub">N E O N &nbsp; B I N G O</div></div>
    <div class="score-panel">
      <div class="score-card w"><div class="label">Win</div><div class="value" id="score-win">0</div></div>
      <div class="score-card"><div class="label">Called</div><div class="value" id="score-called">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="cv" width="460" height="520"></canvas>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.newGame()">New Card</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI is calling numbers…</span></div>
  <div class="stats-bar"><span id="best-stat">Best: —</span><span id="last-stat">Last: —</span></div>
</div>
<script>
(function(){
  'use strict';
  const W=460, H=520, N=5, PAD=14, TOP=64;
  const canvas=document.getElementById('cv'); const ctx=canvas.getContext('2d');
  const COLS=['B','I','N','G','O'];
  const RANGES=[[1,15],[16,30],[31,45],[46,60],[61,75]];

  class Bingo {
    constructor(){
      this.autoPlay=false; this.last=0; this.raf=null;
      this.wins=0; this.best=0; this.called=[]; this.calledSet=new Set();
      this.cells=[]; this.marked=[]; this.lastN=0; this.win=false; this.winCells=[]; this.phase='play';
      this.callTimer=0; this.winTimer=0; this.pulse=0;
      this.loop=this.loop.bind(this); this.bind();
      this.newGame();
      this.last=performance.now(); this.raf=requestAnimationFrame(this.loop);
    }
    loadBest(){ try{ return parseInt(localStorage.getItem('bingo_best')||'0')||0; }catch(e){ return 0; } }
    saveBest(){ try{ localStorage.setItem('bingo_best', String(this.best)); }catch(e){} }
    newGame(){
      this.stopAuto();
      this.cells=[]; this.marked=[];
      for(let c=0;c<N;c++){ const [lo,hi]=RANGES[c]; const pool=[]; for(let v=lo;v<=hi;v++) pool.push(v);
        for(let i=pool.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }
        for(let r=0;r<N;r++){ const isFree=(c===2&&r===2); this.cells.push(isFree?0:pool[r]); this.marked.push(isFree); } }
      this.called=[]; this.calledSet=new Set(); this.calledCount=0; this.lastN=0; this.win=false; this.winCells=[]; this.phase='play'; this.callTimer=0; this.winTimer=0;
      document.getElementById('score-called').textContent='0';
      document.getElementById('last-stat').textContent='Last: —';
    }
    callNumber(){ // draw next called number
      if(this.calledCount>=75){ return; }
      // find next unused
      let n; do { n=(Math.random()*75|0)+1; } while(this.calledSet.has(n));
      this.calledSet.add(n); this.called.push(n); this.calledCount++; this.lastN=n;
      // auto-daub
      for(let i=0;i<this.cells.length;i++){ if(this.cells[i]===n) this.marked[i]=true; }
      document.getElementById('score-called').textContent=this.calledCount;
      document.getElementById('last-stat').textContent='Last: '+n;
      this.checkWin();
    }
    checkWin(){
      const idx=(r,c)=> r*N+c;
      const lines=[];
      for(let r=0;r<N;r++){ const line=[]; for(let c=0;c<N;c++) line.push(idx(r,c)); lines.push(line); }
      for(let c=0;c<N;c++){ const line=[]; for(let r=0;r<N;r++) line.push(idx(r,c)); lines.push(line); }
      lines.push([idx(0,0),idx(1,1),idx(2,2),idx(3,3),idx(4,4)]);
      lines.push([idx(0,4),idx(1,3),idx(2,2),idx(3,1),idx(4,0)]);
      for(const line of lines){ if(line.every(i=>this.marked[i])){ this.win=true; this.winCells=line; this.onWin(); return; } }
    }
    onWin(){
      if(this.phase==='win') return;
      this.phase='win'; this.winTimer=120; this.wins++;
      if(this.best===0||this.calledCount<this.best){ this.best=this.calledCount; this.saveBest(); }
      document.getElementById('score-win').textContent=this.wins;
      document.getElementById('best-stat').textContent='Best: '+this.best;
    }
    autoNext(){ // soft reset: keep auto engaged, just deal a fresh card
      this.cells=[]; this.marked=[];
      for(let c=0;c<N;c++){ const [lo,hi]=RANGES[c]; const pool=[]; for(let v=lo;v<=hi;v++) pool.push(v);
        for(let i=pool.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }
        for(let r=0;r<N;r++){ const isFree=(c===2&&r===2); this.cells.push(isFree?0:pool[r]); this.marked.push(isFree); } }
      this.called=[]; this.calledSet=new Set(); this.calledCount=0; this.lastN=0; this.win=false; this.winCells=[]; this.phase='play'; this.callTimer=10; this.winTimer=0;
      document.getElementById('score-called').textContent='0';
      document.getElementById('last-stat').textContent='Last: —';
    }
    step(dt){
      this.pulse += dt*0.08;
      if(this.phase==='win'){
        this.winTimer -= dt;
        if(this.autoPlay && this.winTimer<=0){ this.autoNext(); }
        return;
      }
      if(this.autoPlay){
        this.callTimer -= dt;
        if(this.callTimer<=0 && this.calledCount<75){ this.callNumber(); this.callTimer=26; }
      }
    }
    cellRect(i){
      const r=(i/N)|0, c=i%N;
      const gw=W-PAD*2, cs=gw/N;
      const x=PAD+c*cs, y=TOP+r*cs;
      return {x,y,s:cs};
    }
    loop(now){
      const dt=Math.max(0.4,Math.min(2.2,(now-this.last)/16.67)); this.last=now;
      this.step(dt); this.draw();
      this.raf=requestAnimationFrame(this.loop);
    }
    draw(){
      ctx.clearRect(0,0,W,H);
      // column letters + last number
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const gw=W-PAD*2, cs=gw/N;
      ctx.font='bold 18px sans-serif'; ctx.fillStyle='#3ecf8e';
      for(let c=0;c<N;c++){ ctx.fillText(COLS[c], PAD+c*cs+cs/2, 30); }
      if(this.lastN>0){
        ctx.beginPath(); ctx.arc(W/2, TOP-30, 16, 0, 7); ctx.fillStyle='#1a1f3a'; ctx.fill();
        ctx.strokeStyle='#3ecf8e'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#ffd700'; ctx.font='bold 15px sans-serif'; ctx.fillText(String(this.lastN), W/2, TOP-30);
      }
      // cells
      for(let i=0;i<this.cells.length;i++){
        const {x,y,s}=this.cellRect(i);
        const m=this.marked[i];
        const isWin=this.winCells.indexOf(i)>=0;
        const px=x+3, py=y+3, ps=s-6;
        const isFree=this.cells[i]===0;
        const glow = isWin ? (0.5+0.5*Math.sin(this.pulse*2)) : 0;
        ctx.beginPath();
        const rr=10;
        ctx.moveTo(px+rr,py);
        ctx.arcTo(px+ps,py,px+ps,py+ps,rr); ctx.arcTo(px+ps,py+ps,px,py+ps,rr);
        ctx.arcTo(px,py+ps,px,py,rr); ctx.arcTo(px,py,px+ps,py,rr); ctx.closePath();
        if(isWin){ ctx.fillStyle='rgba(255,215,0,'+(0.25+glow*0.5)+')'; ctx.shadowColor='#ffd700'; ctx.shadowBlur=18*glow+6; }
        else if(m){ ctx.fillStyle='rgba(62,207,142,0.22)'; ctx.shadowColor='#3ecf8e'; ctx.shadowBlur=10; }
        else { ctx.fillStyle='#141a33'; ctx.shadowBlur=0; }
        ctx.fill(); ctx.shadowBlur=0;
        ctx.lineWidth=1.5; ctx.strokeStyle=isWin?'#ffd700':(m?'#3ecf8e':'#2a3358'); ctx.stroke();
        ctx.fillStyle=isFree?'#ffd700':(m?'#9af5c8':'#cdd6f0');
        ctx.font= isFree?'bold 13px sans-serif':'bold 17px sans-serif';
        ctx.fillText(isFree?'★':String(this.cells[i]), x+s/2, y+s/2);
      }
      if(this.win){ ctx.fillStyle='#ffd700'; ctx.font='bold 30px sans-serif'; ctx.fillText('BINGO!', W/2, H-18); }
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else this.startAuto(); }
    startAuto(){ this.autoPlay=true; this.callTimer=8;
      const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on');
      const ind=document.getElementById('ai-indicator'); if(ind) ind.style.display='flex';
      document.getElementById('ai-status').textContent='AI is calling numbers…'; }
    stopAuto(){ this.autoPlay=false;
      const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on');
      const ind=document.getElementById('ai-indicator'); if(ind) ind.style.display='none'; }
    bind(){
      canvas.addEventListener('pointerdown',(e)=>{ if(this.autoPlay) return; const r=canvas.getBoundingClientRect();
        const mx=(e.clientX-r.left)/r.width*W, my=(e.clientY-r.top)/r.height*H;
        for(let i=0;i<this.cells.length;i++){ const {x,y,s}=this.cellRect(i); if(mx>=x&&mx<x+s&&my>=y&&my<y+s){ const v=this.cells[i]; if(v>0 && this.calledSet.has(v)){ this.marked[i]=!this.marked[i]; this.checkWin(); } break; } } });
    }
  }
  window.game=new Bingo();
})();
</script>
</body>
</html>
