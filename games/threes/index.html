<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#06121e" />
<title>霓虹三消 · Neon Threes</title>
<style>
  :root{
    --bg:#06121e; --surface:#0e1c30; --text:#eafaff; --muted:#7e96b8;
    --accent:#36e0ff; --accent2:#b14dff; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#36e0ff55; --dim:#1b2c45;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #103a52 0%, transparent 60%),
                     radial-gradient(ellipse at 50% 100%, #2a0f3a 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;position:fixed;inset:0;
  }
  .container{width:100%;max-width:480px;padding:12px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .title-block h1{font-size:1.35rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:54px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.s .value{color:var(--gold);}
  .score-card.t .value{color:var(--accent);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#04101c;}
  .toolbar{display:flex;gap:8px;margin-top:10px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  .hint{text-align:center;color:var(--muted);font-size:0.72rem;margin-top:8px;line-height:1.5;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.7rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay p{color:var(--muted);font-size:0.9rem;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>霓虹三消 · NEON THREES</h1>
      <div class="sub">Merge · 1+2=3 · 3+3=6</div>
    </div>
    <div class="score-panel">
      <div class="score-card s"><div class="label">分数</div><div class="value" id="score">0</div></div>
      <div class="score-card t"><div class="label">最大</div><div class="value" id="max">–</div></div>
      <div class="score-card"><div class="label">最佳</div><div class="value" id="best">–</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">AUTO</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">通关！</h2>
      <p id="ovText"></p>
      <button class="auto on" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="auto" id="autoBtn">自动游玩</button>
    <button class="ghost" id="restartBtn" style="background:transparent;">重开</button>
  </div>
  <div class="hint">滑动 / <b>方向键 WASD</b> 移动 · 1+2=3，相同≥3 合并 · 合成出 <b>192</b> 即通关 · 自动模式智能通关</div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const cv=$('cv'), elScore=$('score'), elMax=$('max'), elBest=$('best'),
        elBadge=$('badge'), elOverlay=$('overlay'), elOvTitle=$('ovTitle'), elOvText=$('ovText'),
        btnAuto=$('autoBtn'), btnRestart=$('restartBtn'), btnOv=$('ovBtn');

  const N=4, CELL=96, PAD=24, W=432, H=432;
  const WIN_TILE=192;
  let dpr=Math.min(2,(typeof devicePixelRatio!=='undefined'?devicePixelRatio||1:1));
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  let rngSeed=73;
  let rng=mulberry32(rngSeed);
  function setupCanvas(){
    if(!cv||!cv.getContext) return;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px'; cv.style.maxWidth='100%';
  }
  setupCanvas();
  const ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;

  let grid, tiles, nextId, score, best, maxTile, over, won, auto, winFlash, autoTimer, cooldown;
  try{ best=parseInt(localStorage.getItem('neonthrees_best'))||0; }catch(e){best=0;}

  // ---------- helpers ----------
  function cellCenter(r,c){ return { x:PAD + c*CELL + CELL/2, y:PAD + r*CELL + CELL/2 }; }
  function inb(r,c){ return r>=0&&r<N&&c>=0&&c<N; }
  function canMerge(a,b){ return (a===1&&b===2)||(a===2&&b===1)||(a>=3&&b>=3&&a===b); }
  function mergeVal(a,b){ return (a===1||a===2)?3:a+b; }
  function emptyCount(){ let n=0; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(!grid[r][c]) n++; return n; }
  function valueGrid(){ const g=[]; for(let r=0;r<N;r++){ g.push([]); for(let c=0;c<N;c++) g[r].push(grid[r][c]?grid[r][c].val:0); } return g; }

  function lineCoords(dir){
    const lines=[];
    if(dir===0){ for(let c=0;c<N;c++) lines.push([{r:0,c},{r:1,c},{r:2,c},{r:3,c}]); }
    else if(dir===2){ for(let c=0;c<N;c++) lines.push([{r:3,c},{r:2,c},{r:1,c},{r:0,c}]); }
    else if(dir===1){ for(let r=0;r<N;r++) lines.push([{r,c:0},{r,c:1},{r,c:2},{r,c:3}]); }
    else { for(let r=0;r<N;r++) lines.push([{r,c:3},{r,c:2},{r,c:1},{r,c:0}]); }
    return lines;
  }

  function simulateValues(g, dir){
    const lines=lineCoords(dir);
    const ng=g.map(row=>row.slice());
    let changed=false;
    for(const coords of lines){
      const orig=coords.map(({r,c})=>ng[r][c]);
      const vals=orig.filter(v=>v>0);
      const out=[]; let i=0;
      while(i<vals.length){
        const a=vals[i];
        if(i+1<vals.length && canMerge(a,vals[i+1])){ out.push(mergeVal(a,vals[i+1])); i+=2; continue; }
        out.push(a); i++;
      }
      for(let k=0;k<coords.length;k++){ const {r,c}=coords[k]; ng[r][c]=(k<out.length)?out[k]:0; }
      for(let k=0;k<coords.length;k++){ if(ng[coords[k].r][coords[k].c]!==orig[k]){ changed=true; break; } }
    }
    return {ng, changed};
  }

  const GW=[
    [0.05,0.10,0.18,0.30],
    [0.10,0.15,0.25,0.40],
    [0.18,0.25,0.40,0.60],
    [0.30,0.40,0.60,1.00]
  ];
  function valRank(v){ if(v<=0) return 0; if(v===1) return 1; if(v===2) return 2; return Math.log2(v/3)+3; }
  function evalGrid(g){
    let s=0, empties=0;
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const v=g[r][c];
      if(!v){ empties++; continue; }
      s += GW[r][c]*Math.log2(v+1);
    }
    s += empties*3;
    let mg=0;
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const v=g[r][c]; if(!v) continue;
      for(const [dr,dc] of [[0,1],[1,0]]){
        const nr=r+dr,nc=c+dc; if(nr>=N||nc>=N) continue;
        const u=g[nr][nc]; if(!u) continue;
        if(canMerge(v,u)) mg+=10;
        else if(v>=3&&u>=3) mg -= Math.abs(Math.log2(v/3)-Math.log2(u/3))*1.5;
        else mg -= 1;
      }
    }
    s += mg;
    return s;
  }

  function spawnEdges(g, dir){
    const e=[];
    if(dir===0) for(let c=0;c<N;c++) if(!g[N-1][c]) e.push([N-1,c]);
    else if(dir===2) for(let c=0;c<N;c++) if(!g[0][c]) e.push([0,c]);
    else if(dir===1) for(let r=0;r<N;r++) if(!g[r][N-1]) e.push([r,N-1]);
    else for(let r=0;r<N;r++) if(!g[r][0]) e.push([r,0]);
    return e;
  }
  function bestNext(g){
    let best=-Infinity;
    for(const d of [0,1,2,3]){
      const {ng,changed}=simulateValues(g,d);
      if(!changed) continue;
      const sc=evalGrid(ng);
      if(sc>best) best=sc;
    }
    return best===-Infinity ? evalGrid(g) : best;
  }
  function expectedScore(g, dir){
    const {ng, changed}=simulateValues(g, dir);
    if(!changed) return -Infinity;
    const edges=spawnEdges(ng, dir);
    const spawns=[[1,0.45],[2,0.45],[3,0.10]];
    if(edges.length===0) return evalGrid(ng);
    let total=0, wsum=0;
    for(const [r,c] of edges){
      for(const [v,p] of spawns){
        ng[r][c]=v; total += p*evalGrid(ng); ng[r][c]=0; wsum += p;
      }
    }
    return wsum>0 ? total/wsum : evalGrid(ng);
  }
  // 1-ply greedy with spawn expectation (robust, no error-amplifying deep lookahead)
  function bestDir(){
    let best=-Infinity, bd=null;
    for(const d of [0,1,2,3]){
      const sc=expectedScore(valueGrid(), d);
      if(sc>best){ best=sc; bd=d; }
    }
    return bd;
  }
  function hasMove(){ for(const d of [0,1,2,3]){ const {changed}=simulateValues(valueGrid(),d); if(changed) return true; } return false; }

  // ---------- spawn ----------
  function spawnTile(dir){
    let edge=[];
    if(dir===0) for(let c=0;c<N;c++) if(!grid[N-1][c]) edge.push([N-1,c]);
    else if(dir===2) for(let c=0;c<N;c++) if(!grid[0][c]) edge.push([0,c]);
    else if(dir===1) for(let r=0;r<N;r++) if(!grid[r][N-1]) edge.push([r,N-1]);
    else for(let r=0;r<N;r++) if(!grid[r][0]) edge.push([r,0]);
    if(edge.length===0){ for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(!grid[r][c]) edge.push([r,c]); }
    if(edge.length===0) return;
    const [r,c]=edge[Math.floor(rng()*edge.length)];
    const v=rng()<0.9 ? (rng()<0.5?1:2) : 3;
    const t={id:nextId++, val:v, r, c, px:0, py:0, scale:0.25, flash:0};
    const p=cellCenter(r,c); t.px=p.x; t.py=p.y;
    grid[r][c]=t; tiles.push(t);
  }

  // ---------- move ----------
  function move(dir){
    if(over) return false;
    const lines=lineCoords(dir);
    const before=tiles.map(t=>({t,r:t.r,c:t.c,val:t.val}));
    let merged=false;
    for(const coords of lines){
      const lineTiles=coords.map(({r,c})=>grid[r][c]).filter(Boolean);
      const out=[]; const rem=[]; let i=0;
      while(i<lineTiles.length){
        const a=lineTiles[i];
        if(i+1<lineTiles.length && canMerge(a.val,lineTiles[i+1].val)){
          const b=lineTiles[i+1];
          out.push({keep:a,remove:b,newVal:mergeVal(a.val,b.val)}); rem.push(b); i+=2; continue;
        }
        out.push({keep:a,remove:null,newVal:a.val}); i++;
      }
      for(const {r,c} of coords) grid[r][c]=null;
      for(let k=0;k<out.length;k++){
        const o=out[k]; const {r,c}=coords[k];
        if(o.remove){ const idx=tiles.indexOf(o.remove); if(idx>=0) tiles.splice(idx,1); o.remove.r=r; o.remove.c=c; }
        o.keep.val=o.newVal; o.keep.r=r; o.keep.c=c;
        grid[r][c]=o.keep;
        if(o.remove){ score+=o.newVal; o.keep.flash=1; merged=true; }
      }
    }
    let moved=false;
    for(const b of before){ if(b.t.r!==b.r||b.t.c!==b.c||b.t.val!==b.val){ moved=true; break; } }
    if(!moved) return false;
    maxTile=0; for(const t of tiles) if(t.val>maxTile) maxTile=t.val;
    spawnTile(dir);
    maxTile=0; for(const t of tiles) if(t.val>maxTile) maxTile=t.val;
    if(maxTile>=WIN_TILE){ winGame(); return true; }
    if(emptyCount()===0 && !hasMove()){ loseGame(); return true; }
    return true;
  }

  // ---------- win / lose ----------
  function winGame(){
    if(over) return; over=true; won=true; winFlash=1;
    if(best===0||score>best){ best=score; try{localStorage.setItem('neonthrees_best',String(best));}catch(e){} }
    elBest.textContent=best;
    elOvTitle.textContent='⚡ 自动通关！';
    elOvText.textContent='合成出 '+WIN_TILE+'！分数 '+score;
    if(auto){ autoTimer=1.1; } else { elOverlay.classList.add('show'); }
  }
  function loseGame(){
    if(over) return; over=true; won=false; winFlash=1;
    elOvTitle.textContent='💥 棋盘锁死';
    elOvText.textContent='最大合成 '+maxTile+'，差 '+(WIN_TILE-maxTile)+' 到 '+WIN_TILE;
    elOverlay.classList.add('show');
  }

  function setAuto(v){
    auto=v;
    if(btnAuto){ btnAuto.classList.toggle('on',v); btnAuto.textContent=v?'自动中…':'自动游玩'; }
    if(elBadge) elBadge.classList.toggle('show',v);
  }

  function newGame(){
    grid=[]; for(let r=0;r<N;r++){ grid.push([]); for(let c=0;c<N;c++) grid[r].push(null); }
    tiles=[]; nextId=1; score=0; maxTile=0; over=false; won=false; winFlash=0; autoTimer=0; cooldown=0;
    setAuto(false);
    elOverlay.classList.remove('show');
    elScore.textContent='0'; elMax.textContent='–'; elBest.textContent=best>0?best+'':'–';
    // seed two starting tiles
    spawnTile(0); spawnTile(0);
    maxTile=0; for(const t of tiles) if(t.val>maxTile) maxTile=t.val;
  }

  // ---------- input ----------
  let sx=0,sy=0,sd=false;
  function pointerCell(e){ try{ const rect=cv.getBoundingClientRect(); const x=((e.clientX-rect.left)/rect.width)*W; const y=((e.clientY-rect.top)/rect.height)*H; const c=Math.floor((x-PAD)/CELL), r=Math.floor((y-PAD)/CELL); if(inb(r,c)) return {r,c}; }catch(err){} return null; }
  function swipeDir(dx,dy){ if(Math.max(Math.abs(dx),Math.abs(dy))<24) return null; if(Math.abs(dx)>Math.abs(dy)) return dx>0?1:3; return dy>0?2:0; }
  function onDown(e){ if(auto||over) return; sd=true; sx=e.clientX||0; sy=e.clientY||0; e.preventDefault&&e.preventDefault(); }
  function onUp(e){ if(auto||over||!sd) return; sd=false; const dx=(e.clientX||0)-sx, dy=(e.clientY||0)-sy; const d=swipeDir(dx,dy); if(d!==null) move(d); e.preventDefault&&e.preventDefault(); }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointerdown',onDown,{passive:false});
    cv.addEventListener('pointerup',onUp,{passive:false});
    cv.addEventListener('mousedown',onDown,{passive:false});
    cv.addEventListener('mouseup',onUp,{passive:false});
  }
  function onKey(e){
    if(auto||over) return;
    let d=null;
    if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') d=0;
    else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') d=1;
    else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') d=2;
    else if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') d=3;
    if(d!==null){ move(d); e.preventDefault&&e.preventDefault(); }
  }
  if(typeof window!=='undefined' && window.addEventListener) window.addEventListener('keydown',onKey);
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto) return; setAuto(!auto); if(auto&&over){ newGame(); setAuto(true);} });
  btnRestart&&btnRestart.addEventListener('click',()=>{ newGame(); setAuto(false); });
  btnOv&&btnOv.addEventListener('click',()=>{ newGame(); setAuto(false); });

  // ---------- update ----------
  function update(dt){
    if(over){
      if(winFlash>0) winFlash=Math.max(0,winFlash-dt*1.4);
      if(auto){ autoTimer-=dt; if(autoTimer<=0){ newGame(); setAuto(true); } }
      return;
    }
    for(const t of tiles){
      const p=cellCenter(t.r,t.c);
      const k=Math.min(1,dt*20);
      t.px += (p.x-t.px)*k; t.py += (p.y-t.py)*k;
      if(t.scale<1) t.scale=Math.min(1,t.scale+dt*7);
      if(t.flash>0) t.flash=Math.max(0,t.flash-dt*3);
    }
    if(auto){
      cooldown-=dt;
      if(cooldown<=0){
        const d=bestDir();
        if(d===null){ loseGame(); }
        else { move(d); cooldown=0.11; }
      }
    }
    elScore.textContent=score; elMax.textContent=maxTile; if(best>0) elBest.textContent=best;
  }

  // ---------- render ----------
  function tileColor(v){
    if(v===1) return {bg:'#1f6feb', glow:'#3b8bff', text:'#eafaff'};
    if(v===2) return {bg:'#ff5d6a', glow:'#ff7d8a', text:'#1a0b0e'};
    const hues=[185,150,140,95,50,320,265];
    const lvl=Math.max(0,Math.floor(Math.log2(v/3)+0.5));
    const hue=hues[Math.min(hues.length-1,lvl)];
    return {bg:'hsl('+hue+',85%,56%)', glow:'hsl('+hue+',90%,60%)', text:'#06121d'};
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    // board cells
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const p=cellCenter(r,c); const s=CELL-8;
      ctx.save(); ctx.fillStyle='rgba(255,255,255,0.04)';
      roundRect(p.x-s/2,p.y-s/2,s,s,14); ctx.fill(); ctx.restore();
    }
    // tiles
    for(const t of tiles){
      const col=tileColor(t.val); const s=CELL-8;
      const sz=s*(0.9+0.1*t.scale);
      ctx.save();
      ctx.shadowColor=col.glow; ctx.shadowBlur=18*(0.6+0.4*t.scale) + (t.flash>0?20*t.flash:0);
      ctx.fillStyle=col.bg;
      roundRect(t.px-sz/2,t.py-sz/2,sz,sz,14); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle=col.text; ctx.font='800 '+(t.val>=100?26:32)+'px Segoe UI,system-ui,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(t.val), t.px, t.py+1);
      ctx.restore();
    }
    if(winFlash>0){ ctx.save(); ctx.globalAlpha=winFlash*0.35; ctx.fillStyle=won?'#5dffa6':'#ff6b8a'; ctx.fillRect(0,0,W,H); ctx.restore(); }
  }

  function frame(ts){
    const now=(typeof performance!=='undefined'?(ts!==undefined?ts:performance.now()):Date.now());
    let dt=(now-last)/1000; if(!(dt>0)||dt>0.05) dt=0.016; last=now;
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  newGame();

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;},
    get score(){return score;}, get best(){return best;}, get maxTile(){return maxTile;},
    get remaining(){return Math.max(0,WIN_TILE-maxTile);},
    startAuto(){ setAuto(true); }, toggleAuto(){ setAuto(!auto); }, restart(){ newGame(); setAuto(false); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); }, tick(dt){ update(dt); render(); },
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get score(){return score;}, get best(){return best;}, get maxTile(){return maxTile;}, get remaining(){return Math.max(0,WIN_TILE-maxTile);}
  };
})();
