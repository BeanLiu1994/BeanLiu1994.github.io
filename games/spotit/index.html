<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0f1f" />
<title>霓虹找相同 · Neon Spot</title>
<style>
  :root{
    --bg:#080b18; --surface:#121a30; --text:#eaf2ff; --muted:#7e90b3;
    --accent:#ff7ad9; --accent2:#46e0ff; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#ff7ad955; --dim:#243352;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #2a1840 0%, transparent 60%),
                     radial-gradient(ellipse at 50% 100%, #10243a 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:460px;padding:10px;display:flex;flex-direction:column;gap:8px;height:100%;}
  .header{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .title-block h1{font-size:1.3rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.5rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:50px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:0.98rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.s .value{color:var(--accent);}
  .score-card.t .value{color:var(--accent2);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#060c1c;max-height:100%;}
  .toolbar{display:flex;gap:8px;align-items:center;flex:0 0 auto;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  button.ghost{background:transparent;}
  .hint{text-align:center;color:var(--muted);font-size:0.68rem;line-height:1.4;flex:0 0 auto;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.6rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;}
  .overlay p{color:var(--muted);font-size:0.9rem;text-align:center;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>霓虹找相同 · SPOT</h1>
      <div class="sub">Find · The · Match</div>
    </div>
    <div class="score-panel">
      <div class="score-card s"><div class="label">已对</div><div class="value" id="solved">0</div></div>
      <div class="score-card t"><div class="label">目标</div><div class="value" id="total">12</div></div>
      <div class="score-card"><div class="label">连击</div><div class="value" id="combo">0</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">AUTO</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">胜利！</h2>
      <p id="ovText"></p>
      <button class="auto on" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="auto" id="autoBtn">自动游玩</button>
    <button class="ghost" id="restartBtn">重开</button>
  </div>
  <div class="hint">两张牌里<b>只有一个</b>相同图案 · 点中它即可过关 · <b>自动模式</b>会流畅帮你找出相同并通关</div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const cv=$('cv'), elSolved=$('solved'), elTotal=$('total'), elCombo=$('combo'),
        elBadge=$('badge'), elOverlay=$('overlay'), elOvTitle=$('ovTitle'), elOvText=$('ovText'),
        btnAuto=$('autoBtn'), btnRestart=$('restartBtn'), btnOv=$('ovBtn');

  const EMOJI=['🌟','🔥','💧','🌿','🌸','⚡','🌈','☀️','🌙','🌊','🍎','🍊','🍋','🍉','🍇','🍓','🍒','🍑','🥝','🍍','🌵','🐱','🐶','🐭','🐰','🦊','🐻','🐼','🐨','🦁','🐮'];
  const DECK=[[0,1,2,3,4,5],[0,6,11,16,21,26],[0,7,12,17,22,27],[0,8,13,18,23,28],[0,9,14,19,24,29],[0,10,15,20,25,30],[1,6,12,18,24,30],[1,7,13,19,25,26],[1,8,14,20,21,27],[1,9,15,16,22,28],[1,10,11,17,23,29],[2,6,13,20,22,29],[2,7,14,16,23,30],[2,8,15,17,24,26],[2,9,11,18,25,27],[2,10,12,19,21,28],[3,6,14,17,25,28],[3,7,15,18,21,29],[3,8,11,19,22,30],[3,9,12,20,23,26],[3,10,13,16,24,27],[4,6,15,19,23,27],[4,7,11,20,24,28],[4,8,12,16,25,29],[4,9,13,17,21,30],[4,10,14,18,22,26],[5,6,7,8,9,10],[5,11,12,13,14,15],[5,16,17,18,19,20],[5,21,22,23,24,25],[5,26,27,28,29,30]];
  const TARGET=12;

  const W=420, H=330;
  let dpr=Math.min(2,(typeof devicePixelRatio!=='undefined'?devicePixelRatio||1:1));
  function setupCanvas(){
    if(!cv||!cv.getContext) return;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px'; cv.style.maxWidth='100%';
  }
  setupCanvas();
  const ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;

  // ---- state ----
  let cardA, cardB, common, state, flashT, flashSym, wrongT, wrongSym, completed, combo, best, auto, over, won, autoTimer, autoDelay, roundDelay, flashDelay;
  let bestCombo=0;
  try{ bestCombo=parseInt(localStorage.getItem('spot_best_combo')||'0',10)||0; }catch(e){bestCombo=0;}

  function randInt(n){ return Math.floor(Math.random()*n); }
  function pickPair(){
    let a=randInt(DECK.length), b=randInt(DECK.length);
    while(b===a) b=randInt(DECK.length);
    cardA=DECK[a].slice(); cardB=DECK[b].slice();
    let com=-1;
    const set=new Set(cardA);
    for(const s of cardB) if(set.has(s)){ com=s; break; }
    common=com;
  }
  function newRound(){
    pickPair(); state='play'; flashT=0; wrongT=0;
  }
  function newGame(){
    completed=0; combo=0; over=false; won=false; autoTimer=0; autoDelay=0;
    elOverlay.classList.remove('show');
    newRound();
  }
  function setAuto(v){
    auto=v;
    if(btnAuto){ btnAuto.classList.toggle('on',v); btnAuto.textContent=v?'自动中…':'自动游玩'; }
    if(elBadge) elBadge.classList.toggle('show',v);
    if(v){ autoTimer=0; }
  }

  // geometry of two discs + symbol positions
  function geo(){
    const discR=Math.min(98, (W/2-14)/1.0*0.98);
    const cx1=W*0.27, cx2=W*0.73, cy=H*0.5;
    const ringR=discR*0.6;
    return {discR,cx1,cx2,cy,ringR};
  }
  function symbolPos(card, idx, side){
    const g=geo(); const cx= side===0?g.cx1:g.cx2;
    const ang = -Math.PI/2 + idx*(Math.PI*2/card.length);
    return { x: cx + Math.cos(ang)*g.ringR, y: g.cy + Math.sin(ang)*g.ringR };
  }
  function symbolRadius(){ return geo().discR*0.26; }

  function doCorrect(sym){
    if(state!=='play') return;
    if(sym!==common){ // wrong
      wrongT=0.4; wrongSym=sym; combo=0; return;
    }
    state='flash'; flashT=0; flashSym=sym; completed++; combo++;
    if(combo>bestCombo){ bestCombo=combo; try{localStorage.setItem('spot_best_combo',String(bestCombo));}catch(e){} }
    if(completed>=TARGET) winGame();
  }
  function autoTap(){
    if(state==='play') doCorrect(common);
  }

  function winGame(){
    over=true; won=true;
    if(auto){ autoDelay=0.9; elOvTitle.textContent='⚡ 自动通关！'; elOvText.textContent='完成 '+TARGET+' 对 · 最高连击 '+bestCombo; }
    else { elOvTitle.textContent='🎉 通关！'; elOvText.textContent='完成 '+TARGET+' 对 · 最高连击 '+bestCombo; elOverlay.classList.add('show'); }
  }

  // ---- input ----
  function pointerToSym(e){
    let sx=-1,sy=-1,side=-1,idx=-1;
    try{
      const rect=cv.getBoundingClientRect();
      const px=(typeof e.clientX==='number'?e.clientX:0), py=(typeof e.clientY==='number'?e.clientY:0);
      sx=((px-rect.left)/rect.width)*W; sy=((py-rect.top)/rect.height)*H;
    }catch(err){}
    const sr=symbolRadius()*1.25;
    // check both cards
    for(let s=0;s<2;s++){
      const card = s===0?cardA:cardB;
      for(let i=0;i<card.length;i++){
        const p=symbolPos(card,i,s);
        const d=Math.hypot(sx-p.x, sy-p.y);
        if(d<sr) return {side:s,idx:i,sym:card[i]};
      }
    }
    return null;
  }
  function onDown(e){
    if(over||auto) return;
    const hit=pointerToSym(e);
    if(hit) doCorrect(hit.sym);
    e.preventDefault&&e.preventDefault();
  }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointerdown',onDown,{passive:false});
    cv.addEventListener('touchstart',onDown,{passive:false});
  }
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto){ newGame(); return; } setAuto(!auto); });
  btnRestart&&btnRestart.addEventListener('click',()=>{ newGame(); setAuto(false); });
  btnOv&&btnOv.addEventListener('click',()=>{ newGame(); setAuto(false); });

  // ---- update ----
  function update(dt){
    if(over){
      if(auto){ autoDelay-=dt; if(autoDelay<=0){ newGame(); setAuto(true);} }
      return;
    }
    if(wrongT>0) wrongT=Math.max(0,wrongT-dt*2.5);
    if(state==='flash'){
      flashT+=dt;
      if(flashT>=0.42){ newRound(); }
      return;
    }
    if(auto){
      autoTimer+=dt;
      const delay = (autoTimer<0.5)?0.55:0.6;
      if(autoTimer>=delay){ autoTimer=0; autoTap(); }
    }
    if(elSolved) elSolved.textContent=completed;
    if(elTotal) elTotal.textContent=TARGET;
    if(elCombo) elCombo.textContent=combo;
  }

  // ---- render ----
  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    const g=geo();
    // bg dots
    ctx.fillStyle='rgba(255,122,217,0.05)';
    for(let i=0;i<40;i++){ const x=(i*53)%W, y=(i*97)%H; ctx.beginPath(); ctx.arc(x,y,1.5,0,6.28); ctx.fill(); }
    drawDisc(cardA,0,'#ff7ad9');
    drawDisc(cardB,1,'#46e0ff');
  }
  function drawDisc(card, side, col){
    const g=geo(); const cx= side===0?g.cx1:g.cx2;
    // disc
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur=18;
    ctx.fillStyle='#0c1430'; ctx.beginPath(); ctx.arc(cx,g.cy,g.discR,0,6.28); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(cx,g.cy,g.discR,0,6.28); ctx.stroke();
    ctx.restore();
    const sr=symbolRadius();
    for(let i=0;i<card.length;i++){
      const p=symbolPos(card,i,side);
      const isCommon = (card[i]===common);
      const isFlash = (state==='flash' && isCommon);
      const isWrong = (wrongT>0 && wrongSym===card[i]);
      ctx.save();
      if(isFlash){ ctx.shadowColor='#5dffa6'; ctx.shadowBlur=22; ctx.fillStyle='rgba(93,255,166,0.18)'; }
      else if(isWrong){ ctx.shadowColor='#ff6b8a'; ctx.shadowBlur=18; ctx.fillStyle='rgba(255,107,138,0.18)'; }
      else { ctx.shadowColor=col; ctx.shadowBlur=8; ctx.fillStyle='rgba(255,255,255,0.05)'; }
      ctx.beginPath(); ctx.arc(p.x,p.y,sr*1.05,0,6.28); ctx.fill();
      ctx.strokeStyle= isFlash?'#5dffa6':(isWrong?'#ff6b8a':col+'88'); ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(p.x,p.y,sr*1.05,0,6.28); ctx.stroke();
      ctx.restore();
      // emoji
      ctx.save();
      ctx.font=(sr*1.15)+'px system-ui';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(EMOJI[card[i]]||'?', p.x, p.y+1);
      ctx.restore();
    }
  }

  function frame(ts){
    const now=(typeof performance!=='undefined'?(ts!==undefined?ts:performance.now()):Date.now());
    let dt=(now-last)/1000; if(!(dt>0)||dt>0.05) dt=0.016; last=now;
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  newGame(); setAuto(false);

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;},
    get score(){return completed;}, get remaining(){return TARGET-completed;},
    get combo(){return combo;}, get best(){return bestCombo;},
    startAuto(){ setAuto(true); }, toggleAuto(){ setAuto(!auto); }, restart(){ newGame(); setAuto(false); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); },
    tick(dt){ update(dt); render(); },
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get score(){return completed;}, get remaining(){return TARGET-completed;}, get combo(){return combo;}, get best(){return bestCombo;},
    tapSym(sym){ doCorrect(sym); }, getCommon(){ return common; }, getState(){ return state; }
  };
})();
</script>
</body>
</html>
