<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0f1a" />
<title>Hop Cross · Neon</title>
<style>
  :root{
    --bg:#0a0f1a; --surface:#12122a; --text:#e7edf7; --muted:#8888b0;
    --accent:#7cff9b; --accent-glow:#7cff9b66; --danger:#ff5d6c; --gold:#ffd76a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);background-image:radial-gradient(ellipse at 25% 15%,#0f3a18 0%,transparent 55%),radial-gradient(ellipse at 80% 85%,#102a3a 0%,transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;}
  .container{width:100%;max-width:460px;padding:16px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .title-block h1{font-size:1.8rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#b6ffce,#7cff9b,#5ce1ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:6px 12px;text-align:center;min-width:48px;}
  .score-card .label{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0a;border-radius:14px;padding:10px;box-shadow:0 0 40px #00000040,0 0 70px var(--accent-glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#0c1420;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;z-index:10;opacity:0;transition:opacity .35s;pointer-events:none;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0f1aee;backdrop-filter:blur(4px);border-radius:14px;}
  .overlay-content{position:relative;text-align:center;z-index:1;}
  .overlay-content h2{font-size:1.8rem;font-weight:800;margin-bottom:6px;}
  .overlay-content p{color:var(--muted);margin-bottom:16px;font-size:.9rem;}
  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:90px;padding:12px 16px;border:1px solid #ffffff12;border-radius:10px;background:var(--surface);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff10;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#06120c;}
  .btn.primary:hover{box-shadow:0 0 20px var(--accent-glow);}
  .btn.auto-on{background:var(--accent);border-color:var(--accent);color:#06120c;animation:pulse-glow 2s infinite;--glow:var(--accent-glow);}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--glow,transparent);}50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);}}
  .ai-indicator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.75rem;color:var(--muted);justify-content:center;min-height:20px;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
  .hint{margin-top:8px;text-align:center;font-size:.7rem;color:var(--muted);}
  @media(max-width:400px){.title-block h1{font-size:1.4rem;}.btn{padding:10px 12px;font-size:.78rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Hop Cross</h1><div class="sub">过 马 路 · N E O N</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Cross</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
      <div class="score-card"><div class="label">Lives</div><div class="value" id="lives">3</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="390" height="270"></canvas>
    <div class="overlay" id="overlay-end"><div class="overlay-bg"></div><div class="overlay-content"><h2>Game Over</h2><p id="end-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI crossing…</span></div>
  <div class="hint">Swipe / arrow keys to hop. Reach the glowing top. Avoid cars!</div>
</div>
<script>
(function(){
  'use strict';
  const COLS=13, ROWS=9, GOAL=0, START=8, ROAD0=1, ROAD1=7;
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  function fitCanvas(){ const w=canvas.clientWidth||390; const dpr=window.devicePixelRatio||1; canvas.width=w*dpr; canvas.height=w*ROWS/COLS*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); return w; }
  const lerp=(a,b,t)=>a+(b-a)*t;
  function makeLanes(){ const lanes=[]; for(let r=ROAD0;r<=ROAD1;r++){ const dir=(r%2===0)?1:-1; const speed=0.7+Math.random()*1.4; const len=1+(Math.random()<0.35?1:0); const cars=[]; const gap=2.5+Math.random()*2.5; let x=0; const span=COLS+4; let pos=-2; while(pos<COLS+2){ cars.push({x:pos,len}); pos+=len+gap+Math.random()*1.5; } lanes.push({r,dir,speed,cars,col:r%2? '#ff6ad5':'#5ce1ff'}); } return lanes; }
  class Crossing{
    constructor(){ this.best=parseInt(localStorage.getItem('bestCross')||'0'); this.autoPlay=false; this.bindInput(); this.restart(); this._tick=this.tick.bind(this); requestAnimationFrame(this._tick); }
    restart(){ this.stopAuto(); this.size=fitCanvas(); this.cell=this.size/COLS; this.score=0; this.lives=3; this.over=false; this.lanes=makeLanes(); this.resetFrog(); this.autoAccum=0; this.flash=0; this.hideOverlay(); this.updateUI(); }
    resetFrog(){ this.frog={cx:(COLS/2)|0, ry:START, fx:(COLS/2)|0, fy:START, hop:0}; }
    hideOverlay(){ document.getElementById('overlay-end').classList.remove('active'); }
    updateUI(){ document.getElementById('score').textContent=this.score; document.getElementById('best').textContent=this.best; document.getElementById('lives').textContent=this.lives; }
    laneAt(r){ return this.lanes.find(l=>l.r===r); }
    carHits(fx,r){ const lane=this.laneAt(r); if(!lane) return false; for(const c of lane.cars){ if(fx+0.5> c.x && fx+0.5 < c.x+c.len) return true; } return false; }
    move(dx,dy){ if(this.over||this.flash>0) return; const nx=this.frog.cx+dx, ny=this.frog.ry+dy; if(nx<0||nx>=COLS||ny<0||ny>=ROWS) return; this.frog.cx=nx; this.frog.ry=ny; this.frog.hop=1; if(ny===GOAL){ this.score++; if(this.score>this.best){this.best=this.score;localStorage.setItem('bestCross',this.best);} this.updateUI(); this.resetFrog(); } }
    hit(){ if(this.flash>0) return; this.lives--; this.flash=0.5; this.updateUI(); if(this.lives<=0){ this.over=true; this.stopAuto(); document.getElementById('end-msg').textContent='You crossed '+this.score+' times'; document.getElementById('overlay-end').classList.add('active'); } else { this.resetFrog(); } }
    // auto
    decideAuto(){ if(this.over||this.flash>0) return; const f=this.frog; if(f.ry===GOAL){ return; } if(f.ry===START){ this.move(0,-1); return; } const target=f.ry-1; const laneT=this.laneAt(target); const laneC=this.laneAt(f.ry);
      const clear=(lane)=>{ if(!lane) return true; for(const c of lane.cars){ const d=f.cx-c.x; if(d>-0.6&&d<c.len+0.6) return false; } return true; };
      if(clear(laneT)){ this.move(0,-1); return; }
      // try sidestep to a safer column
      for(const sx of [-1,1]){ const nx=f.cx+sx; if(nx<0||nx>=COLS) continue; let safe=true; if(this.laneAt(f.ry)&&this.carHits(nx,f.ry)) safe=false; if(this.laneAt(target)&&this.carHits(nx,target)) safe=false; if(safe){ this.move(sx,0); return; } }
    }
    chooseAuto(){ this.decideAuto(); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    tick(ts){ const dt=Math.min(50,(ts!==undefined)?((ts-(this._last||ts))):16)/1000; this._last=ts; this.update(dt); this.render(); requestAnimationFrame(this._tick); }
    update(dt){
      for(const lane of this.lanes){ for(const c of lane.cars){ c.x+=lane.dir*lane.speed*dt; if(lane.dir>0 && c.x>COLS+1) c.x=-(c.len+2)-Math.random()*2; if(lane.dir<0 && c.x< -c.len-1) c.x=COLS+1+Math.random()*2; } }
      const f=this.frog; f.fx=lerp(f.fx,f.cx,1-Math.pow(0.0005,dt)); f.fy=lerp(f.fy,f.ry,1-Math.pow(0.0005,dt)); if(f.hop>0) f.hop=Math.max(0,f.hop-dt*6);
      if(this.flash>0){ this.flash-=dt; if(this.flash<=0&&this.lives>0){ /* respawn done in hit */ } }
      if(this.flash<=0 && !this.over){ if(this.frog.ry>=ROAD0&&this.frog.ry<=ROAD1 && this.carHits(f.fx,this.frog.ry)) this.hit(); }
      if(this.autoPlay&&!this.over&&this.flash<=0){ this.autoAccum+=dt; if(this.autoAccum>=0.18){ this.autoAccum=0; this.decideAuto(); } }
    }
    bindInput(){ const wrap=document.getElementById('board-wrap'); let sx=0,sy=0,act=false,id=null; wrap.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over) return; id=e.pointerId; sx=e.clientX; sy=e.clientY; act=true; try{wrap.setPointerCapture(e.pointerId);}catch(_){} }); wrap.addEventListener('pointerup',(e)=>{ if(!act||e.pointerId!==id) return; act=false; const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.max(Math.abs(dx),Math.abs(dy))<12){ if(this.frog.ry>GOAL) this.move(0,-1); return; } if(Math.abs(dx)>Math.abs(dy)) this.move(dx>0?1:-1,0); else this.move(0,dy>0?1:-1); });
      window.addEventListener('keydown',(e)=>{ if(this.autoPlay||this.over) return; if(e.key==='ArrowUp'||e.key==='w') this.move(0,-1); else if(e.key==='ArrowDown'||e.key==='s') this.move(0,1); else if(e.key==='ArrowLeft'||e.key==='a') this.move(-1,0); else if(e.key==='ArrowRight'||e.key==='d') this.move(1,0); });
      window.addEventListener('resize',()=>{ this.size=fitCanvas(); this.cell=this.size/COLS; });
    }
    render(){ const size=this.size, cell=this.cell, H=size*ROWS/COLS; ctx.clearRect(0,0,size,H);
      for(let r=0;r<ROWS;r++){ const y=r*cell; if(r===GOAL){ ctx.fillStyle='#1c3a22'; ctx.fillRect(0,y,size,cell); ctx.fillStyle='#7cff9b'; ctx.font='bold '+(cell*0.5)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('HOME',size/2,y+cell/2); }
        else if(r===START){ ctx.fillStyle='#152a3a'; ctx.fillRect(0,y,size,cell); }
        else { ctx.fillStyle=(r%2)?'#13131f':'#101019'; ctx.fillRect(0,y,size,cell); const lane=this.laneAt(r); if(lane){ for(const c of lane.cars){ ctx.save(); ctx.shadowColor=lane.col; ctx.shadowBlur=10; const g=ctx.createLinearGradient(c.x*cell,y,c.x*cell+c.len*cell,y+cell); g.addColorStop(0,lane.col); g.addColorStop(1,'#0c0c1e'); ctx.fillStyle=g; this.rr(c.x*cell+2,y+cell*0.18,c.len*cell-4,cell*0.64,6); ctx.fill(); ctx.restore(); } } }
      }
      // frog
      const f=this.frog; const fx=f.fx*cell+cell/2, fy=f.fy*cell+cell/2; const sc=1+f.hop*0.18; const R=cell*0.36*sc;
      ctx.save(); if(this.flash>0){ ctx.globalAlpha=Math.abs(Math.sin(this.flash*30)); ctx.shadowColor='#ff5d6c'; ctx.shadowBlur=18; ctx.fillStyle='#ff5d6c'; } else { ctx.shadowColor='#7cff9b'; ctx.shadowBlur=14; ctx.fillStyle='#7cff9b'; }
      ctx.beginPath(); ctx.arc(fx,fy,R,0,Math.PI*2); ctx.fill(); ctx.restore();
      if(this.flash<=0){ ctx.fillStyle='#06120c'; ctx.beginPath(); ctx.arc(fx-R*0.32,fy-R*0.25,R*0.16,0,7); ctx.arc(fx+R*0.32,fy-R*0.25,R*0.16,0,7); ctx.fill(); }
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new Crossing();
})();
</script>
</body>
</html>
