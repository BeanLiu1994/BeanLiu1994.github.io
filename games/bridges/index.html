<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹连桥 · Neon Bridges</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#4dff91; --accent-glow:#4dff9166; --gold:#ffd54a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 18% 12%, #102a38 0%, transparent 55%), radial-gradient(ellipse at 82% 88%, #2a1240 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#4dff91,#4d9bff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#06120a; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#06120a; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹连桥</h1><div class="sub">N E O N &nbsp; B R I D G E S</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Bridges</div><div class="value" id="br">0</div></div>
      <div class="score-card best"><div class="label">Solved</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="420" height="420"></canvas></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">New Puzzle</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">点两座同行/同列且无阻挡的岛建桥（最多 2 座），使每岛桥数等于标号</div>
</div>
<script>
(function(){
  'use strict';
  const GX=5, GY=5;
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const brEl=document.getElementById('br'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  const ekey=(a,b)=> (a.id<b.id)? a.id+'_'+b.id : b.id+'_'+a.id;

  class Bridges {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0;
      this.best=parseInt(localStorage.getItem('brBest')||'0'); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); this.onDown(e); });
      this.restart();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(rect.width||420,420)); const dpr=window.devicePixelRatio||1;
      this.W=w; canvas.width=w*dpr; canvas.height=w*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      this.mx=w*0.12; this.my=w*0.12; this.stepX=(w*0.76)/(GX-1); this.stepY=(w*0.76)/(GY-1); this.ir=w*0.052; }
    gen(){ this.islands=[]; let id=0;
      // choose random subset of lattice
      const cells=[]; for(let ly=0;ly<GY;ly++) for(let lx=0;lx<GX;lx++) cells.push({lx,ly});
      for(let i=cells.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cells[i],cells[j]]=[cells[j],cells[i]]; }
      const picked=cells.slice(0, 11+Math.floor(Math.random()*3));
      for(const p of picked){ this.islands.push({id:id++, lx:p.lx, ly:p.ly, x:this.mx+p.lx*this.stepX, y:this.my+p.ly*this.stepY, num:0}); }
      // adjacency: nearest same-row right, nearest same-col down
      this.edges=[];
      for(const a of this.islands){ for(const b of this.islands){ if(a.id===b.id) continue;
        if(a.ly===b.ly && b.lx>a.lx){ let ok=true; for(const c of this.islands){ if(c.id!==a.id&&c.id!==b.id&&c.ly===a.ly&&c.lx>a.lx&&c.lx<b.lx) ok=false; } if(ok){ this.edges.push([a,b]); } }
        else if(a.lx===b.lx && b.ly>a.ly){ let ok=true; for(const c of this.islands){ if(c.id!==a.id&&c.id!==b.id&&c.lx===a.lx&&c.ly>a.ly&&c.ly<b.ly) ok=false; } if(ok){ this.edges.push([a,b]); } }
      } }
      // Kruskal spanning tree
      const parent={}; this.islands.forEach(i=>parent[i.id]=i.id); const find=(x)=>{ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; }; const uni=(a,b)=>{ parent[find(a)]=find(b); };
      const sh=this.edges.slice(); for(let i=sh.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [sh[i],sh[j]]=[sh[j],sh[i]]; }
      this.tree=[]; for(const [a,b] of sh){ if(find(a.id)!==find(b.id)){ uni(a.id,b.id); this.tree.push([a,b]); a.num++; b.num++; } }
    }
    restart(){ this.stopAuto(); this.over=false; this.win=false; this.gen(); this.bridges={}; this.sol={}; this.tree.forEach(([a,b])=>{ this.sol[ekey(a,b)]=1; });
      this.autoList=this.tree.slice(); this.sel=null; this.updateUI(); }
    incident(island){ let n=0; for(const e of this.edges){ if((e[0].id===island.id||e[1].id===island.id)){ const k=ekey(e[0],e[1]); if(this.bridges[k]) n+=this.bridges[k]; } } return n; }
    capOK(island, delta){ return this.incident(island)+delta <= island.num; }
    between(a,b){ if(a.ly===b.ly){ const lo=Math.min(a.lx,b.lx),hi=Math.max(a.lx,b.lx); for(const c of this.islands){ if(c.id!==a.id&&c.id!==b.id&&c.ly===a.ly&&c.lx>lo&&c.lx<hi) return false; } return true; }
      if(a.lx===b.lx){ const lo=Math.min(a.ly,b.ly),hi=Math.max(a.ly,b.ly); for(const c of this.islands){ if(c.id!==a.id&&c.id!==b.id&&c.lx===a.lx&&c.ly>lo&&c.ly<hi) return false; } return true; } return false; }
    crosses(a,b,x,y){ const aH=a.ly===b.ly, xH=x.ly===y.ly; if(aH===xH) return false; let h,v; if(aH){h=[a,b];v=[x,y];} else {h=[x,y];v=[a,b];}
      const hy=h[0].ly, hx1=Math.min(h[0].lx,h[1].lx), hx2=Math.max(h[0].lx,h[1].lx); const vx=v[0].lx, vy1=Math.min(v[0].ly,v[1].ly), vy2=Math.max(v[0].ly,v[1].ly);
      return (vx>hx1&&vx<hx2&&hy>vy1&&hy<vy2); }
    onDown(e){ if(this.autoPlay||this.over) return; const rect=canvas.getBoundingClientRect(); const x=(e.clientX-rect.left)*(this.W/rect.width), y=(e.clientY-rect.top)*(this.W/rect.width);
      let hit=null; for(const is of this.islands){ if((x-is.x)**2+(y-is.y)**2 < (this.ir*1.4)**2){ hit=is; break; } }
      if(!hit) return;
      if(!this.sel){ this.sel=hit; return; }
      if(this.sel.id===hit.id){ this.sel=null; return; }
      const a=this.sel, b=hit; const k=ekey(a,b); const aligned=(a.ly===b.ly)||(a.lx===b.lx);
      const cur=this.bridges[k]||0;
      if(aligned && this.between(a,b)){ const next=(cur+1)%3; const delta=next-cur;
        if(delta!==0){ if(this.capOK(a,delta)&&this.capOK(b,delta)){ let cross=false; if(next>0){ for(const e of this.edges){ const ek=ekey(e[0],e[1]); if(this.bridges[ek] && !((e[0].id===a.id&&e[1].id===b.id)||(e[0].id===b.id&&e[1].id===a.id))){ if(this.crosses(a,b,e[0],e[1])) cross=true; } } }
          if(!cross){ this.bridges[k]=next; this._autoProgress++; this.sel=null; this.checkWin(); this.updateUI(); return; } } }
        else { this.bridges[k]=0; this.sel=null; this.updateUI(); return; }
      }
      this.sel=null;
    }
    checkWin(){ for(const is of this.islands){ if(this.incident(is)!==is.num) return; } this.over=true; this.win=true; this.best++; localStorage.setItem('brBest',String(this.best)); bestEl.textContent=this.best; statusEl.textContent='🎉 全部连通！'; }
    updateUI(){ let n=0; for(const k in this.bridges) if(this.bridges[k]) n+=this.bridges[k]; brEl.textContent=n; if(!this.over) statusEl.textContent='点两岛建桥，使每岛桥数等于标号'; }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this.autoStep(); }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    autoStep(){ if(!this.autoPlay) return; if(this.over){ this._autoNext(); return; }
      if(this.autoList.length){ const [a,b]=this.autoList.shift(); this.bridges[ekey(a,b)]=1; this._autoProgress++; this.checkWin(); this.updateUI(); this.autoTimer=setTimeout(()=>this.autoStep(), 120); }
      else { this._autoNext(); }
    }
    _autoNext(){ this.stopAuto(); this.restart(); this.startAuto(); }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.draw(dt); }catch(err){ console.error(err); } }
    draw(){ const W=this.W; ctx.clearRect(0,0,W);
      // bridges
      for(const e of this.edges){ const k=ekey(e[0],e[1]); const cnt=this.bridges[k]||0; if(!cnt) continue; const a=e[0],b=e[1];
        ctx.strokeStyle='#4dff91'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.shadowColor='#4dff91'; ctx.shadowBlur=8;
        if(cnt===1){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
        else { const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1; const ox=-dy/len*5, oy=dx/len*5;
          ctx.beginPath(); ctx.moveTo(a.x+ox,a.y+oy); ctx.lineTo(b.x+ox,b.y+oy); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(a.x-ox,a.y-oy); ctx.lineTo(b.x-ox,b.y-oy); ctx.stroke(); }
        ctx.shadowBlur=0;
      }
      // islands
      for(const is of this.islands){ const sat=this.incident(is)===is.num; ctx.save(); ctx.shadowColor=sat?'#4dff91':'#4d9bff'; ctx.shadowBlur=12; ctx.fillStyle=sat?'#4dff91':'#16203a'; ctx.beginPath(); ctx.arc(is.x,is.y,this.ir,0,7); ctx.fill(); ctx.restore();
        ctx.strokeStyle=sat?'#4dff91':'#4d9bff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(is.x,is.y,this.ir,0,7); ctx.stroke();
        ctx.fillStyle='#e6e6f5'; ctx.font='bold '+(this.ir*0.95)+'px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(is.num, is.x, is.y+1);
        if(this.sel&&this.sel.id===is.id){ ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(is.x,is.y,this.ir+4,0,7); ctx.stroke(); }
      }
    }
  }
  window.game=new Bridges();
})();
</script>
</body>
</html>
