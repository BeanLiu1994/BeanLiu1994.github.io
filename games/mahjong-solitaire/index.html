<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#070713" />
<title>Mahjong Solitaire · Neon</title>
<style>
  :root{
    --bg:#070713; --surface:#12122a; --text:#e6e9f5; --muted:#8a90b8;
    --accent:#ffb347; --accent2:#ff6ec7; --danger:#ff4d6a; --gold:#ffd166; --ok:#4dff91;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #2a1640 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #06304a 0%, transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:480px;height:100vh;max-height:820px;display:flex;flex-direction:column;padding:14px;gap:10px;}
  .header{display:flex;align-items:center;justify-content:space-between;}
  .title-block h1{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.56rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff10;border-radius:10px;padding:6px 12px;text-align:center;min-width:56px;}
  .score-card .label{font-size:.5rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.best .value{color:var(--gold);}
  .board-wrap{position:relative;flex:1;min-height:0;background:var(--surface);border:1px solid #ffffff10;border-radius:16px;overflow:hidden;box-shadow:0 0 50px #00000040,0 0 70px #ffb34722;}
  .board-wrap, .board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:100%;}
  .controls{display:flex;gap:8px;}
  .btn{flex:1;min-width:80px;padding:11px 14px;border:1px solid #ffffff14;border-radius:11px;background:var(--surface);color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .18s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff12;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#1a1020;}
  .btn.primary:hover{box-shadow:0 0 22px #ffb34755;}
  .btn.auto-on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#1a1020;animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 6px #ffb34744;}50%{box-shadow:0 0 20px #ffb34788,0 0 38px #ff6ec755;}}
  .ai-indicator{display:none;align-items:center;gap:8px;justify-content:center;font-size:.72rem;color:var(--muted);min-height:18px;}
  .ai-indicator.show{display:flex;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.7);}}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:5;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#070713dd;backdrop-filter:blur(5px);}
  .overlay-content{position:relative;text-align:center;z-index:1;padding:20px;}
  .overlay-content h2{font-size:1.9rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay-content p{color:var(--muted);margin-bottom:14px;font-size:.85rem;}
  .hint{text-align:center;font-size:.64rem;color:var(--muted);line-height:1.5;}
  @media (max-width:400px){.title-block h1{font-size:1.3rem;}.btn{padding:10px;font-size:.76rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Mahjong</h1><div class="sub">S O L I T A I R E</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Pairs</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay-win">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2 id="win-title">通关！</h2>
        <p id="win-msg">全部消除</p>
        <button class="btn primary" id="btn-again" style="min-width:140px;">再来一局</button>
      </div>
    </div>
  </div>
  <div class="ai-indicator" id="ai-indicator"><span class="ai-dot"></span><span id="ai-status">AI 自动消除中…</span></div>
  <div class="controls">
    <button class="btn primary" id="btn-auto">自动游玩</button>
    <button class="btn" id="btn-restart">重开</button>
  </div>
  <div class="hint">点选两张相同且「左右至少一侧空、上方无压」的空闲牌即可消除</div>
</div>
<script>
(function(){
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
  const overlay=document.getElementById('overlay-win'), winTitle=document.getElementById('win-title'), winMsg=document.getElementById('win-msg');
  const btnAuto=document.getElementById('btn-auto'), btnRestart=document.getElementById('btn-restart'), btnAgain=document.getElementById('btn-again');
  const aiInd=document.getElementById('ai-indicator'), aiStatus=document.getElementById('ai-status');

  const FACES=['🀄','🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏','🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘','🌸','🌿','🔥','💧','⚡','🍃','🌟','🌙','☀️','❄️','🍂','🐉','🐅','🐍','🦊','🐼','🦋'];
  const TW=44, TH=56, LX=8, LY=-8;
  const LAYERS=[ {rows:6,cols:8,oy:0,ox:0}, {rows:4,cols:6,oy:1,ox:1}, {rows:2,cols:4,oy:2,ox:2} ];

  class MJ{
    constructor(){
      this.autoPlay=false; this.over=false;
      this.best=parseInt(localStorage.getItem('mjBest')||'0',10); bestEl.textContent=this.best;
      this.selected=null; this.anim=[];
      this.fit(); window.addEventListener('resize',()=>this.fit());
      this.bindInput(); this.newGame();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){
      const r=canvas.getBoundingClientRect();
      this.W=Math.max(300,Math.min(r.width||420,480)); this.H=Math.max(320,Math.min(r.height||600,760));
      const d=window.devicePixelRatio||1; canvas.width=this.W*d; canvas.height=this.H*d; ctx.setTransform(d,0,0,d,0,0);
    }
    key(l,r,c){ return l+','+r+','+c; }
    buildLayout(){
      this.slots=[]; this.map={};
      let id=0;
      for(const L of LAYERS){
        for(let i=0;i<L.rows;i++) for(let j=0;j<L.cols;j++){
          const r=L.oy+i, c=L.ox+j, l=LAYERS.indexOf(L);
          const s={id:id++, layer:l, r, c, face:null, state:'present', t:0};
          this.slots.push(s); this.map[this.key(l,r,c)]=s;
        }
      }
    }
    present(l,r,c){ const s=this.map[this.key(l,r,c)]; return s && s.state==='present'; }
    covered(s){ return this.present(s.layer+1,s.r,s.c); }
    sideOpen(s){ return !this.present(s.layer,s.r,s.c-1) || !this.present(s.layer,s.r,s.c+1); }
    isFree(s){ return s.state==='present' && !this.covered(s) && this.sideOpen(s); }
    // reverse-pair generation: add pairs into currently-free empty slots -> guarantees solvable
    generate(){
      const total=this.slots.length;
      const presentSet=new Set();
      const addable=()=>this.slots.filter(s=>!presentSet.has(s.id) && (s.layer===LAYERS.length-1 || !this.present(s.layer+1,s.r,s.c)) && (!this.present(s.layer,s.r,s.c-1)||!this.present(s.layer,s.r,s.c+1)) && !this.covered(s));
      const order=[];
      let faceI=0;
      while(presentSet.size<total){
        let a=addable(); if(!a.length) break;
        const A=a[Math.floor(Math.random()*a.length)];
        presentSet.add(A.id);
        let b=addable(); if(!b.length){ presentSet.delete(A.id); break; }
        const B=b[Math.floor(Math.random()*b.length)];
        presentSet.add(B.id);
        const face=FACES[faceI%FACES.length]; faceI++;
        A.face=face; B.face=face;
        order.push([A.id,B.id]);
      }
      // solution removal order = reverse of add order
      this.solution=order.reverse();
      // ensure all filled
      for(const s of this.slots){ if(s.face===null){ s.face=FACES[0]; } s.state='present'; s.t=0; }
    }
    newGame(){
      this.over=false; this.removed=0; this.selected=null; this.anim=[];
      this.slots=[]; this.map={};
      this.buildLayout(); this.generate();
      scoreEl.textContent=0;
      this.solIdx=0;
      this.autoCD=0.4;
      overlay.classList.remove('active');
      this.updateUI();
    }
    tileXY(s){
      const x=this.ox + s.c*TW + s.layer*LX;
      const y=this.oy + s.r*TH + s.layer*LY;
      return {x,y};
    }
    layoutBoard(){
      let maxX=0,maxY=0;
      for(const s of this.slots){ const p=this.tileXY(s); maxX=Math.max(maxX,p.x+TW); maxY=Math.max(maxY,p.y+TH); }
      this.ox=(this.W-maxX)/2; this.oy=(this.H-maxY)/2;
    }
    removePair(a,b){
      for(const id of [a,b]){ const s=this.slots[id]; if(s.state==='present'){ s.state='removing'; s.t=0; this.anim.push(s); } }
      this.removed++; scoreEl.textContent=this.removed;
    }
    stepAuto(){
      if(this.over) return;
      // follow solution order
      while(this.solIdx<this.solution.length){
        const [a,b]=this.solution[this.solIdx];
        const A=this.slots[a], B=this.slots[b];
        if(A.state==='present' && B.state==='present' && this.isFree(A) && this.isFree(B)){
          this.removePair(a,b); this.solIdx++; return;
        }
        this.solIdx++; // skip if blocked (manual interference)
      }
      // if no solution pairs left but tiles remain, find any free match
      const free=this.slots.filter(s=>this.isFree(s));
      for(let i=0;i<free.length;i++) for(let j=i+1;j<free.length;j++){
        if(free[i].face===free[j].face){ this.removePair(free[i].id,free[j].id); return; }
      }
      if(this.remaining()===0) this.win();
    }
    remaining(){ return this.slots.filter(s=>s.state==='present').length; }
    win(){
      this.over=true;
      if(this.removed>this.best){ this.best=this.removed; localStorage.setItem('mjBest',this.best); bestEl.textContent=this.best; }
      winTitle.textContent='通关！'; winMsg.textContent='消除 '+this.removed+' 对 · 最佳 '+this.best;
      overlay.classList.add('active');
      if(this.autoPlay) this.autoTimer=setTimeout(()=>{ this.stopAuto(); this.newGame(); this.startAuto(); }, 1600);
    }
    update(dt){
      // animations
      for(let i=this.anim.length-1;i>=0;i--){ const s=this.anim[i]; s.t+=dt/0.28; if(s.t>=1){ s.state='removed'; this.anim.splice(i,1); } }
      if(this.over) return;
      if(this.autoPlay){
        this.autoCD-=dt;
        if(this.autoCD<=0){ this.stepAuto(); this.autoCD=0.42; }
      }
    }
    draw(){
      ctx.clearRect(0,0,this.W,this.H);
      // draw bottom layer first for proper overlap
      const order=this.slots.slice().sort((a,b)=> a.layer-b.layer || a.r-b.r || a.c-b.c);
      for(const s of order){
        if(s.state==='removed') continue;
        const {x,y}=this.tileXY(s);
        let alpha=1, scale=1;
        if(s.state==='removing'){ alpha=1-s.t; scale=1+s.t*0.4; }
        const w=TW*scale, h=TH*scale;
        const dx=x-(w-TW)/2, dy=y-(h-TH)/2;
        ctx.save(); ctx.globalAlpha=alpha;
        // shadow / 3D edge
        if(s.state==='present'){
          ctx.fillStyle='#0a0a18'; ctx.fillRect(dx+3, dy+4, w, h);
        }
        const free=this.isFree(s);
        let bg = s.layer%2===0 ? '#f3ead2' : '#e7dcc0';
        if(free){ ctx.shadowColor='#ffb347'; ctx.shadowBlur=12; }
        else { ctx.shadowBlur=0; }
        ctx.fillStyle=bg; this.roundRect(dx,dy,w,h,7); ctx.fill();
        ctx.shadowBlur=0;
        ctx.lineWidth=1.5; ctx.strokeStyle = (this.selected===s)?'#ff6ec7':'#b9a878'; ctx.stroke();
        ctx.fillStyle='#2a2030'; ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(s.face, dx+w/2, dy+h/2+1);
        ctx.restore();
      }
    }
    roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    loop(ts){
      if(!this._last) this._last=ts;
      const dt=Math.min(0.05,(ts-this._last)/1000||0.016); this._last=ts;
      this.update(dt); this.draw();
      requestAnimationFrame(this.loop);
    }
    updateUI(){ scoreEl.textContent=this.removed; if(this.autoPlay) aiStatus.textContent='AI · 已消除 '+this.removed; }
    startAuto(){ this.autoPlay=true; btnAuto.textContent='自动中…'; btnAuto.classList.add('auto-on'); aiInd.classList.add('show'); this.autoCD=0.3; this.updateUI(); }
    stopAuto(){ this.autoPlay=false; btnAuto.textContent='自动游玩'; btnAuto.classList.remove('auto-on'); aiInd.classList.remove('show'); if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.newGame(); this.startAuto(); } }
    bindInput(){
      const hit=(cx,cy)=>{
        let best=null;
        for(const s of this.slots){ if(s.state!=='present') continue; const {x,y}=this.tileXY(s); if(cx>=x&&cx<=x+TW&&cy>=y&&cy<=y+TH){ if(!best||s.layer>best.layer) best=s; } }
        return best;
      };
      const rectXY=(e)=>{ const t=e.touches&&e.touches[0]?e.touches[0]:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e); const r=canvas.getBoundingClientRect(); return {x:(t.clientX-r.left)/r.width*this.W, y:(t.clientY-r.top)/r.height*this.H}; };
      const onDown=(e)=>{
        if(this.autoPlay||this.over) return;
        const {x,y}=rectXY(e); const s=hit(x,y); if(!s) return; e.preventDefault();
        if(!this.isFree(s)) return;
        if(this.selected===s){ this.selected=null; return; }
        if(this.selected && this.selected.face===s.face){ this.removePair(this.selected.id,s.id); this.selected=null; if(this.remaining()===0) this.win(); }
        else this.selected=s;
      };
      canvas.addEventListener('pointerdown',onDown);
      canvas.addEventListener('touchstart',onDown,{passive:false});
    }
  }
  window.game=new MJ();
  btnAuto.addEventListener('click',()=>game.toggleAuto());
  btnRestart.addEventListener('click',()=>game.newGame());
  btnAgain.addEventListener('click',()=>game.newGame());
})();
</script>
</body>
</html>
