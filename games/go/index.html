<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a140a" />
<title>Go · 围棋</title>
<style>
  :root { --bg:#0a140a; --surface:#0e1c10; --board:#0c2414; --text:#e6ffe6; --muted:#7fbf8f; --accent:#5dff9e; --accent2:#ffd54a; --accent-glow:#5dff9e55; --gold:#ffd54a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image:radial-gradient(ellipse at 50% 0%, #103018 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #081a0e 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#5dff9e,#ffd54a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:50px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:11px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:700; cursor:pointer; transition:all .2s; letter-spacing:.5px; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#0a1a0e; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#0a1a0e; animation:pulse 1.6s infinite; --glow:var(--accent-glow); }
  @keyframes pulse { 0%,100%{box-shadow:0 0 6px var(--glow,transparent);} 50%{box-shadow:0 0 18px var(--glow,transparent),0 0 34px var(--glow,transparent);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>围棋</h1><div class="sub">G O &nbsp;·&nbsp; W E I Q I</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Black</div><div class="value" id="black">0</div></div>
      <div class="score-card"><div class="label">White</div><div class="value" id="white">0</div></div>
      <div class="score-card best"><div class="label">Games</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="440" height="440"></canvas></div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">点击交叉点落子 · 提子规则自动判定 · 双方连续停手即终局算目</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const blackEl=document.getElementById('black'), whiteEl=document.getElementById('white'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  const btnAuto=document.getElementById('btn-auto');
  const W=canvas.width, N=9, M=24, cell=(W-2*M)/(N-1);
  function inB(r,c){ return r>=0&&r<N&&c>=0&&c<N; }
  function key(r,c){ return r*N+c; }
  class Go {
    constructor(){
      this.autoPlay=false; this._last=0; this.time=0; this._autoProgress=0; this._autoCd=0;
      this.bestKey='goGames'; this.games=parseInt(localStorage.getItem(this.bestKey)||'0'); bestEl.textContent=this.games;
      this.board=[]; this.turn=1; this.last=null; this.ko=null; this.caps={1:0,2:0}; this.state='play'; this.passCount=0; this.overT=0; this.winner='';
      this.restart();
      requestAnimationFrame(this.tick.bind(this));
    }
    restart(){ this.board=Array.from({length:N},()=>new Array(N).fill(0)); this.turn=1; this.last=null; this.ko=null; this.caps={1:0,2:0}; this.state='play'; this.passCount=0; this.winner=''; this._autoCd=0.4; this.setStatus('黑棋先行 · 点击交叉点落子'); this.refreshScores(); }
    setStatus(t){ statusEl.textContent=t; }
    refreshScores(){ const s=this.score(); blackEl.textContent=s[1]; whiteEl.textContent=s[2]; }
    group(r,c){ const col=this.board[r][c]; const st=[[r,c]]; const seen=new Set([key(r,c)]); const libs=new Set(); const stones=[];
      while(st.length){ const [a,b]=st.pop(); stones.push([a,b]);
        for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nr=a+dr,nc=b+dc; if(!inB(nr,nc)) continue; const k=key(nr,nc);
          if(this.board[nr][nc]===0) libs.add(k);
          else if(this.board[nr][nc]===col && !seen.has(k)){ seen.add(k); st.push([nr,nc]); } } }
      return {stones, libs:libs.size}; }
    place(r,c,color){
      if(!inB(r,c)||this.board[r][c]!==0) return {ok:false};
      if(this.ko && this.ko.r===r && this.ko.c===c && this.ko.forbid===color) return {ok:false};
      this.board[r][c]=color;
      const opp=3-color; let captured=0, capPoint=null;
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nr=r+dr,nc=c+dc; if(inB(nr,nc)&&this.board[nr][nc]===opp){ const g=this.group(nr,nc); if(g.libs===0){ for(const [a,b] of g.stones){ this.board[a][b]=0; captured++; } if(g.stones.length===1) capPoint=[nr,nc]; } } }
      const own=this.group(r,c);
      if(own.libs===0 && captured===0){ this.board[r][c]=0; return {ok:false}; }
      this.ko = (captured===1 && capPoint)? {r:capPoint[0],c:capPoint[1],forbid:opp} : null;
      this.caps[color]+=captured;
      return {ok:true, captured};
    }
    pass(){ this.passCount++; this.turn=3-this.turn; this.ko=null; this.last=null; if(this.passCount>=2) this.endGame(); else this.setStatus((this.turn===1?'黑':'白')+' 停手'); }
    endGame(){ const s=this.score(); this.state='over'; this.overT=2.0; this.winner = s[1]>s[2]?'黑胜':(s[2]>s[1]?'白胜':'和棋'); this.games++; bestEl.textContent=this.games; localStorage.setItem(this.bestKey,String(this.games)); this.setStatus('终局：黑 '+s[1]+' · 白 '+s[2]+' → '+this.winner); }
    score(){
      let s1=0,s2=0; const visited=new Set();
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){ if(this.board[r][c]===1) s1++; else if(this.board[r][c]===2) s2++; }
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){ if(this.board[r][c]!==0||visited.has(key(r,c))) continue;
        const st=[[r,c]]; const reg=[]; const touch=new Set(); visited.add(key(r,c));
        while(st.length){ const [a,b]=st.pop(); reg.push([a,b]);
          for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nr=a+dr,nc=b+dc; if(!inB(nr,nc)) continue; if(this.board[nr][nc]===0){ const k=key(nr,nc); if(!visited.has(k)){ visited.add(k); st.push([nr,nc]); } } else touch.add(this.board[nr][nc]); } }
        if(touch.size===1){ const col=[...touch][0]; if(col===1) s1+=reg.length; else s2+=reg.length; } }
      return {1:s1,2:s2};
    }
    aiMove(){ const color=this.turn; let best=null, bestScore=-1e9;
      const snap=this.board.map(r=>r.slice()); const snapCaps={...this.caps}; const snapKo=this.ko;
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){ if(this.board[r][c]!==0) continue;
        // skip single-point own eye
        let nb=0, ownEye=true, oppAdj=false;
        for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nr=r+dr,nc=c+dc; if(inB(nr,nc)){ const v=this.board[nr][nc]; if(v===color) nb++; else if(v===3-color) oppAdj=true; if(v!==color) ownEye=false; } }
        if(ownEye && nb===4) continue;
        const res=this.place(r,c,color); if(!res.ok){ continue; }
        let sc=0;
        const g=this.group(r,c); sc+=res.captured*12; sc+=g.libs*0.6;
        let near=0; for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++){ const nr=r+dr,nc=c+dc; if(inB(nr,nc)&&this.board[nr][nc]!==0) near++; } sc+=near*0.4;
        if(oppAdj) sc-=0.2;
        this.board=snap.map(rr=>rr.slice()); this.caps={...snapCaps}; this.ko=snapKo; // full restore
        if(sc>bestScore){ bestScore=sc; best=[r,c]; }
      }
      const empties=this.board.flat().filter(v=>v===0).length;
      if(best && (bestScore>0.6 || empties>N*N*0.45)) return best;
      return null;
    }
    doMove(r,c){ const res=this.place(r,c,this.turn); if(!res.ok) return false; this.last=[r,c]; this.passCount=0; this._autoProgress++; this.turn=3-this.turn; this.refreshScores(); return true; }
    toggleAuto(){ this.autoPlay=!this.autoPlay; if(this.autoPlay){ btnAuto.textContent='Auto: ON'; btnAuto.classList.add('auto-on'); this._autoCd=0.4; } else { btnAuto.textContent='Auto: OFF'; btnAuto.classList.remove('auto-on'); } }
    startAuto(){ this.autoPlay=true; btnAuto.textContent='Auto: ON'; btnAuto.classList.add('auto-on'); this._autoCd=0.4; }
    stopAuto(){ this.autoPlay=false; btnAuto.textContent='Auto: OFF'; btnAuto.classList.remove('auto-on'); }
    maybeAuto(dt){
      if(!this.autoPlay) return; this._autoCd-=dt; if(this._autoCd>0) return;
      if(this.state==='over'){ this._autoCd=0.5; return; }
      const mv=this.aiMove();
      if(mv){ this.doMove(mv[0],mv[1]); this._autoCd=0.45; }
      else { this.pass(); this._autoCd=0.5; }
    }
    update(dt){ if(this.state==='over'){ this.overT-=dt; if(this.overT<=0) this.restart(); } this.maybeAuto(dt); }
    tick(ts){
      const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016);
      this._last=ts!==undefined?ts:this._last; this.time+=dt;
      this.update(dt); this.draw(); requestAnimationFrame(this.tick.bind(this));
    }
    draw(){
      ctx.clearRect(0,0,W,W);
      const g=ctx.createRadialGradient(W/2,W/2,20,W/2,W/2,W*0.7); g.addColorStop(0,'#0c2414'); g.addColorStop(1,'#06160c'); ctx.fillStyle=g; ctx.fillRect(0,0,W,W);
      ctx.strokeStyle='#3a6a4a'; ctx.lineWidth=1.2;
      for(let i=0;i<N;i++){ const p=M+i*cell; ctx.beginPath(); ctx.moveTo(M,p); ctx.lineTo(W-M,p); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p,M); ctx.lineTo(p,W-M); ctx.stroke(); }
      const stars=[[2,2],[2,6],[6,2],[6,6],[4,4]]; ctx.fillStyle='#5a8a6a'; for(const [r,c] of stars){ ctx.beginPath(); ctx.arc(M+c*cell,M+r*cell,3,0,6.28); ctx.fill(); }
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){ const v=this.board[r][c]; if(!v) continue; const x=M+c*cell,y=M+r*cell; ctx.save(); ctx.shadowColor=v===1?'#000':'#fff'; ctx.shadowBlur=8; ctx.fillStyle=v===1?'#0a0a0a':'#f0fff0'; ctx.beginPath(); ctx.arc(x,y,cell*0.46,0,6.28); ctx.fill(); ctx.restore();
        if(v===1){ ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(x,y,cell*0.46,0,6.28); ctx.stroke(); } }
      if(this.last){ const x=M+this.last[1]*cell,y=M+this.last[0]*cell; ctx.strokeStyle='#ffd54a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,cell*0.46+3,0,6.28); ctx.stroke(); }
    }
  }
  canvas.addEventListener('pointerdown',(e)=>{ if(game.autoPlay||game.state!=='play') return; const rect=canvas.getBoundingClientRect(); const sx=canvas.width/rect.width, sy=canvas.height/rect.height; const px=(e.clientX-rect.left)*sx, py=(e.clientY-rect.top)*sy; const c=Math.round((px-M)/cell), r=Math.round((py-M)/cell); if(r>=0&&r<N&&c>=0&&c<N){ if(game.doMove(r,c)){} else game.setStatus('此处不可落子（禁着/打吃）'); } });
  window.game=new Go();
})();
</script>
</body>
</html>
