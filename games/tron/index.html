<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Light Cycle</title>
<style>
  :root{
    --bg:#0a0f1a; --surface:#111a2b; --text:#e7edf7; --muted:#8090a8;
    --accent:#5ce1ff; --accent2:#ff9f43; --accent-glow:#5ce1ff66; --danger:#ff5d6c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    margin:0; background:radial-gradient(1200px 800px at 50% -10%, #0e1830 0%, var(--bg) 60%);
    color:var(--text); font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
    touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none;
    display:flex; flex-direction:column; align-items:center; gap:14px; padding:14px;
  }
  header{width:100%; max-width:520px; text-align:center;}
  header h1{
    margin:0; font-size:26px; letter-spacing:3px; font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 18px var(--accent-glow);
  }
  header p{margin:4px 0 0; color:var(--muted); font-size:12px; letter-spacing:1px;}

  .scores{display:flex; gap:12px; justify-content:center; width:100%; max-width:520px;}
  .card{
    flex:1; background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:10px 12px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); text-align:center;
  }
  .card .lbl{font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase;}
  .card .val{font-size:28px; font-weight:700; line-height:1.1; margin-top:2px;}
  .card.you .val{color:var(--accent); text-shadow:0 0 14px var(--accent-glow);}
  .card.ai .val{color:var(--accent2); text-shadow:0 0 14px #ff9f4355;}

  .board-wrap{
    position:relative; width:min(92vw, 520px); aspect-ratio:1/1;
    border-radius:18px; overflow:hidden;
    background:var(--surface);
    border:1px solid rgba(92,225,255,0.18);
    box-shadow:0 0 40px rgba(92,225,255,0.10), inset 0 0 60px rgba(0,0,0,0.5);
  }
  .board-wrap *{touch-action:none;}
  #game{display:block; width:100%; height:100%;}

  .overlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; background:rgba(5,9,18,0.72); backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px); text-align:center; padding:20px;
  }
  .overlay .big{font-size:40px; font-weight:800; letter-spacing:3px;}
  .overlay.win .big{color:var(--accent); text-shadow:0 0 24px var(--accent-glow);}
  .overlay.lose .big{color:var(--accent2); text-shadow:0 0 24px #ff9f4355;}
  .overlay.draw .big{color:var(--muted);}
  .overlay .sub{font-size:13px; color:var(--muted); letter-spacing:1px;}

  .controls{display:flex; gap:10px; align-items:center; justify-content:center; width:100%; max-width:520px; flex-wrap:wrap;}
  button{
    font:inherit; cursor:pointer; color:var(--text); letter-spacing:1px;
    background:linear-gradient(180deg, rgba(92,225,255,0.16), rgba(92,225,255,0.04));
    border:1px solid rgba(92,225,255,0.35); border-radius:12px; padding:10px 18px;
    transition:transform .08s ease, box-shadow .2s ease;
  }
  button:hover{box-shadow:0 0 16px var(--accent-glow);}
  button:active{transform:scale(0.96);}
  #btn-auto.on{
    background:linear-gradient(180deg, rgba(255,159,67,0.18), rgba(255,159,67,0.04));
    border-color:rgba(255,159,67,0.5); box-shadow:0 0 16px #ff9f4355;
  }
  .ai-line{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; letter-spacing:1px;}
  #ai-indicator{
    width:10px; height:10px; border-radius:50%; background:var(--muted);
    box-shadow:0 0 0 transparent; transition:all .2s ease;
  }
  #ai-indicator.active{background:var(--accent2); box-shadow:0 0 12px var(--accent2);}
  .hint{color:var(--muted); font-size:12px; letter-spacing:1px; text-align:center; max-width:520px;}
</style>
</head>
<body>
  <header>
    <h1>LIGHT CYCLE</h1>
    <p>光轮对战 · neon grid duel</p>
  </header>

  <div class="scores">
    <div class="card you"><div class="lbl">You</div><div class="val" id="score-you">0</div></div>
    <div class="card ai"><div class="lbl">AI</div><div class="val" id="score-ai">0</div></div>
  </div>

  <div class="board-wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay"><div class="big" id="overlay-text"></div><div class="sub" id="overlay-sub">next round…</div></div>
  </div>

  <div class="controls">
    <button id="btn-restart">New Game</button>
    <button id="btn-auto">Auto: OFF</button>
  </div>

  <div class="ai-line">
    <span id="ai-indicator"></span>
    <span id="ai-status">AI opponent active</span>
  </div>

  <div class="hint">Swipe / arrow keys to turn. Auto = AI vs AI.</div>

<script>
(function(){
  const COLS = 41, ROWS = 41;
  const STEP_INTERVAL = 0.06;     // seconds per grid step
  const MAX_FLOOD = 1200;         // cap flood-fill search

  function inBounds(x,y){ return x>=0 && x<COLS && y>=0 && y<ROWS; }
  function leftOf(h){ return {dx:h.dy, dy:-h.dx}; }
  function rightOf(h){ return {dx:-h.dy, dy:h.dx}; }

  class G {
    constructor(){
      this.autoPlay = false;
      this.canvas = document.getElementById('game');
      this.ctx = this.canvas.getContext('2d');
      this.youWins = 0;
      this.aiWins = 0;
      this.humanDir = {dx:1, dy:0};
      this.ptr = null;
      this._last = undefined;
      this.w = this.fitCanvas();
      this.loadBest();
      this.reset();
      this.updateScoreUI();
      this.updateIndicators();
      this.attach();
      // harness contract
      this._tick = this.tick.bind(this);
      requestAnimationFrame(this._tick);
    }

    fitCanvas(){
      const w = (this.canvas.clientWidth || this.canvas.width || 440);
      const dpr = window.devicePixelRatio || 1;
      this.canvas.width = w * dpr;
      this.canvas.height = w * dpr;
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return w;
    }

    loadBest(){
      try { this.youWins = parseInt(localStorage.getItem('best_tron') || '0', 10) || 0; }
      catch(e){ this.youWins = 0; }
    }
    saveBest(){
      try { localStorage.setItem('best_tron', String(this.youWins)); } catch(e){}
    }

    /* ---- round lifecycle ---- */
    reset(){
      this.grid = Array.from({length:ROWS}, () => new Array(COLS).fill(0));
      const cy = Math.floor(ROWS/2);
      this.cycles = [
        {x:4,      y:cy, heading:{dx:1,dy:0},  alive:true, color:1, isHuman:true,  prevX:4,      prevY:cy},
        {x:COLS-5, y:cy, heading:{dx:-1,dy:0}, alive:true, color:2, isHuman:false, prevX:COLS-5, prevY:cy}
      ];
      this.grid[cy][4] = 1;
      this.grid[cy][COLS-5] = 2;
      this.stepAcc = 0;
      this.progress = 0;
      this.roundActive = true;
      this.endTimer = 0;
      this.hideOverlay();
    }
    restart(){
      this.reset();
      this.stopAuto();
      this.updateScoreUI();
      this.updateIndicators();
    }

    /* ---- auto controls ---- */
    toggleAuto(){
      this.autoPlay = !this.autoPlay;
      if(this.autoPlay && !this.roundActive) this.reset();
      this.updateIndicators();
    }
    stopAuto(){
      this.autoPlay = false;
      this.updateIndicators();
    }

    /* ---- main loop ---- */
    tick(ts){
      const dt = Math.min(0.05, (ts !== undefined) ? ((ts - (this._last || ts)) / 1000) : 0.016);
      this._last = ts;
      this.update(dt);
      this.render();
      requestAnimationFrame(this._tick);
    }

    update(dt){
      if(this.roundActive){
        this.stepAcc += dt;
        let steps = 0;
        while(this.stepAcc >= STEP_INTERVAL && this.roundActive && steps < 5){
          this.stepAcc -= STEP_INTERVAL;
          this.doStep();
          steps++;
        }
        this.progress = this.roundActive ? Math.min(1, this.stepAcc / STEP_INTERVAL) : 1;
      } else {
        this.endTimer -= dt;
        if(this.endTimer <= 0) this.reset();
      }
    }

    doStep(){
      const alive = this.cycles.filter(c => c.alive);
      // decide headings
      for(const c of alive){
        let nh;
        if(c.isHuman && !this.autoPlay){
          const d = this.humanDir;
          if(d && (d.dx !== -c.heading.dx || d.dy !== -c.heading.dy)) nh = d;
          else nh = c.heading;
        } else {
          nh = this.chooseAIDir(c);
        }
        c.nextHeading = nh;
        c._nx = c.x + nh.dx;
        c._ny = c.y + nh.dy;
      }
      // detect deaths
      for(const c of alive){
        let dead = false;
        if(!inBounds(c._nx, c._ny)) dead = true;
        else if(this.grid[c._ny][c._nx] !== 0) dead = true;
        for(const o of alive){
          if(o === c) continue;
          if(o._nx === c._nx && o._ny === c._ny) dead = true;          // same target
          if(o._nx === c.x && o._ny === c.y && c._nx === o.x && c._ny === o.y) dead = true; // swap
        }
        c._dead = dead;
      }
      // apply
      for(const c of alive){
        c.prevX = c.x; c.prevY = c.y;
        if(c._dead){
          c.alive = false;
        } else {
          c.heading = c.nextHeading;
          c.x = c._nx; c.y = c._ny;
          this.grid[c.y][c.x] = c.color;
        }
      }
      // round end?
      const deadCount = this.cycles.filter(c => !c.alive).length;
      if(deadCount > 0) this.endRound();
    }

    endRound(){
      this.roundActive = false;
      const cyan = this.cycles[0], orange = this.cycles[1];
      let result;
      if(cyan.alive && !orange.alive) result = 'win';
      else if(!cyan.alive && orange.alive) result = 'lose';
      else result = 'draw';

      if(result === 'win'){ this.youWins++; this.saveBest(); }
      else if(result === 'lose'){ this.aiWins++; }
      this.updateScoreUI();
      this.showOverlay(result);
      this.endTimer = 1.5;
    }

    /* ---- AI ---- */
    chooseAIDir(c){
      const candidates = [c.heading, leftOf(c.heading), rightOf(c.heading)];
      let best = -Infinity, bestDir = c.heading, ties = [];
      for(const d of candidates){
        const nx = c.x + d.dx, ny = c.y + d.dy;
        if(!inBounds(nx, ny) || this.grid[ny][nx] !== 0) continue; // death -> skip
        const score = this.floodFill(nx, ny);
        if(score > best){ best = score; bestDir = d; ties = [d]; }
        else if(score === best){ ties.push(d); }
      }
      if(best < 0) return c.heading; // trapped, just go
      if(ties.length > 1) return ties[(Math.random() * ties.length) | 0];
      return bestDir;
    }

    floodFill(sx, sy){
      if(!inBounds(sx, sy) || this.grid[sy][sx] !== 0) return 0;
      const seen = new Uint8Array(COLS * ROWS);
      const stack = [sx + sy * COLS];
      seen[sx + sy * COLS] = 1;
      let count = 0;
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      while(stack.length && count < MAX_FLOOD){
        const idx = stack.pop();
        count++;
        const x = idx % COLS, y = (idx / COLS) | 0;
        for(const d of dirs){
          const nx = x + d[0], ny = y + d[1];
          if(!inBounds(nx, ny)) continue;
          const ni = nx + ny * COLS;
          if(seen[ni]) continue;
          if(this.grid[ny][nx] !== 0) continue;
          seen[ni] = 1;
          stack.push(ni);
        }
      }
      return count;
    }

    /* ---- render ---- */
    render(){
      const ctx = this.ctx, w = this.w, cell = w / COLS;
      ctx.clearRect(0, 0, w, w);
      ctx.fillStyle = '#0a0f1a';
      ctx.fillRect(0, 0, w, w);

      // grid
      ctx.strokeStyle = 'rgba(92,225,255,0.06)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for(let i = 0; i <= COLS; i++){
        const p = i * cell;
        ctx.moveTo(p, 0); ctx.lineTo(p, w);
        ctx.moveTo(0, p); ctx.lineTo(w, p);
      }
      ctx.stroke();

      // trails
      for(let y = 0; y < ROWS; y++){
        for(let x = 0; x < COLS; x++){
          const v = this.grid[y][x];
          if(v) this.drawCell(x, y, cell, v === 1 ? '#5ce1ff' : '#ff9f43', 0.38);
        }
      }

      // heads
      const p = this.progress;
      for(const c of this.cycles){
        if(!c.alive) continue;
        const rx = c.prevX + (c.x - c.prevX) * p;
        const ry = c.prevY + (c.y - c.prevY) * p;
        this.drawHead(rx, ry, cell, c.color === 1 ? '#5ce1ff' : '#ff9f43');
      }
    }

    drawCell(x, y, cell, color, alpha){
      const ctx = this.ctx;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.shadowBlur = cell * 0.5;
      ctx.shadowColor = color;
      const pad = cell * 0.12;
      ctx.fillRect(x * cell + pad, y * cell + pad, cell - 2 * pad, cell - 2 * pad);
      ctx.restore();
    }
    drawHead(rx, ry, cell, color){
      const ctx = this.ctx;
      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowBlur = cell * 1.3;
      ctx.shadowColor = color;
      const s = cell * 0.92;
      ctx.fillRect(rx * cell + (cell - s) / 2, ry * cell + (cell - s) / 2, s, s);
      ctx.restore();
    }

    /* ---- UI helpers ---- */
    updateScoreUI(){
      const a = document.getElementById('score-you');
      const b = document.getElementById('score-ai');
      if(a) a.textContent = String(this.youWins);
      if(b) b.textContent = String(this.aiWins);
    }
    updateIndicators(){
      const btn = document.getElementById('btn-auto');
      if(btn){ btn.textContent = 'Auto: ' + (this.autoPlay ? 'ON' : 'OFF'); btn.classList.toggle('on', this.autoPlay); }
      const ind = document.getElementById('ai-indicator');
      if(ind) ind.classList.toggle('active', this.autoPlay);
      const st = document.getElementById('ai-status');
      if(st) st.textContent = this.autoPlay ? 'AI vs AI — watching…' : 'AI opponent active';
    }
    showOverlay(result){
      const o = document.getElementById('overlay');
      const t = document.getElementById('overlay-text');
      if(t) t.textContent = result === 'win' ? 'YOU WIN' : result === 'lose' ? 'AI WINS' : 'DRAW';
      if(o){ o.style.display = 'flex'; o.className = 'overlay ' + (result === 'win' ? 'win' : result === 'lose' ? 'lose' : 'draw'); }
    }
    hideOverlay(){
      const o = document.getElementById('overlay');
      if(o) o.style.display = 'none';
    }

    /* ---- input ---- */
    attach(){
      const c = this.canvas;
      try { c.addEventListener('pointerdown', e => this.onPointerDown(e)); } catch(e){}
      try { c.addEventListener('pointermove', e => this.onPointerMove(e)); } catch(e){}
      try { window.addEventListener('pointerup',   e => this.onPointerUp(e)); } catch(e){}
      try { window.addEventListener('keydown',     e => this.onKey(e)); } catch(e){}
      try { window.addEventListener('resize', () => { this.w = this.fitCanvas(); }); } catch(e){}
      const rb = document.getElementById('btn-restart');
      if(rb){ try { rb.addEventListener('click', () => this.restart()); } catch(e){} }
      const ab = document.getElementById('btn-auto');
      if(ab){ try { ab.addEventListener('click', () => this.toggleAuto()); } catch(e){} }
    }
    onKey(e){
      let d = null;
      if(e.key === 'ArrowUp') d = {dx:0, dy:-1};
      else if(e.key === 'ArrowDown') d = {dx:0, dy:1};
      else if(e.key === 'ArrowLeft') d = {dx:-1, dy:0};
      else if(e.key === 'ArrowRight') d = {dx:1, dy:0};
      if(d){ this.humanDir = d; if(e.preventDefault) e.preventDefault(); }
    }
    onPointerDown(e){
      this.ptr = {x: e.clientX, y: e.clientY};
      if(e.preventDefault) e.preventDefault();
    }
    onPointerMove(e){
      if(!this.ptr) return;
      const dx = e.clientX - this.ptr.x, dy = e.clientY - this.ptr.y;
      if(Math.hypot(dx, dy) > 24){
        let d;
        if(Math.abs(dx) > Math.abs(dy)) d = {dx: dx > 0 ? 1 : -1, dy: 0};
        else d = {dx: 0, dy: dy > 0 ? 1 : -1};
        this.humanDir = d;
        this.ptr = {x: e.clientX, y: e.clientY};
      }
      if(e.preventDefault) e.preventDefault();
    }
    onPointerUp(){ this.ptr = null; }
  }

  window.game = new G();
})();
</script>
</body>
</html>
