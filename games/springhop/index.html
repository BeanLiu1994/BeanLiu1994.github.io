<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#04140f" />
<title>弹簧跳跳 · Spring Hop</title>
<style>
  :root { --bg:#04140f; --surface:#08231a; --board:#061a13; --text:#e6fff4; --muted:#6fae93; --accent:#4dffd0; --accent-glow:#4dffd055; --gold:#ffd700; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image:radial-gradient(ellipse at 50% 0%, #0c3a2a 0%, transparent 60%), radial-gradient(ellipse at 50% 100%, #07241a 0%, transparent 60%); color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,var(--accent),#b6fff0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 12px; text-align:center; min-width:60px; }
  .score-card .label { font-size:0.52rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1.05rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#04140fee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; padding:20px; }
  .overlay-content h2 { font-size:2rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:16px; font-size:0.9rem; }
  .overlay.lose h2 { color:var(--red); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:11px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:700; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; }
  .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#04140f; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#04140f; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:20px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:blink .8s infinite; }
  @keyframes blink { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>弹簧跳跳</h1>
      <div class="sub">S P R I N G &nbsp; H O P</div>
    </div>
    <div class="score-panel">
      <div class="score-card"><div class="label">高度</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="game" width="360" height="540"></canvas>
    <div class="overlay lose" id="overlay-lose">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2>掉下去了!</h2>
        <p id="lose-msg">没能踩到平台</p>
        <button class="btn primary" onclick="game.restart()">再来一局</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">新游戏</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">自动: 关</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none">
    <div class="ai-dot"></div><span id="ai-status">AI 自动游玩中…</span>
  </div>
  <div class="status" id="status">按住屏幕左右滑动控制角色，踩平台不断往上跳</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
  const statusEl=document.getElementById('status');
  const overlayLose=document.getElementById('overlay-lose'), loseMsg=document.getElementById('lose-msg');
  const aiInd=document.getElementById('ai-indicator'), aiStatus=document.getElementById('ai-status');
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  class Hop {
    constructor(){
      this.autoPlay=false; this.over=false; this.time=0;
      this.best=parseInt(localStorage.getItem('hopBest')||'0'); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      this.bindInput();
      this.restart(); this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const r=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(r.width||360,440)); const d=window.devicePixelRatio||1; this.W=w; this.H=w*1.5; canvas.width=w*d; canvas.height=this.H*d; ctx.setTransform(d,0,0,d,0,0); }
    platHalf(){ return 0.11; }
    platW(){ return this.W*0.2; }
    makePlat(y,force){
      const r=Math.random();
      const type= force || (r<0.12?'spring':(r<0.24?'move':'normal'));
      return { xFrac:0.12+Math.random()*0.76, y:y, type:type, phase:Math.random()*6.28 };
    }
    restart(){
      this.stopAuto(); this.over=false; this.score=0;
      this.platforms=[]; let y=70; this.gap=this.H*0.15;
      for(let i=0;i<13;i++){ this.platforms.push(this.makePlat(y, i===0?'normal':undefined)); y+=this.gap*(0.78+Math.random()*0.5); }
      this.player={ xFrac:this.platforms[0].xFrac, y:this.platforms[0].y, vy:0 };
      this.cameraY=0; this.topY=y; this.targetXFrac=this.player.xFrac; this.keyDir=0; this.pointerDown=false; this.autoTargetPlat=null;
      overlayLose.classList.remove('active');
    }
    bindInput(){
      const setX=(cx)=>{ const r=canvas.getBoundingClientRect(); this.targetXFrac=Math.max(0,Math.min(1,(cx-r.left)/r.width)); };
      canvas.addEventListener('pointerdown',e=>{ e.preventDefault(); this.pointerDown=true; setX(e.clientX); });
      canvas.addEventListener('pointermove',e=>{ if(this.pointerDown){ e.preventDefault(); setX(e.clientX); } });
      const up=()=>{ this.pointerDown=false; };
      canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
      window.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')this.keyDir=-1; else if(e.key==='ArrowRight')this.keyDir=1; });
      window.addEventListener('keyup',e=>{ if(e.key==='ArrowLeft'&&this.keyDir===-1)this.keyDir=0; else if(e.key==='ArrowRight'&&this.keyDir===1)this.keyDir=0; });
      document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
    }
    platX(pl){ return (pl.type==='move'? pl.xFrac+Math.sin(this.time*1.5+pl.phase)*0.12 : pl.xFrac); }
    autoControl(){
      const p=this.player; let best=null, bs=-1e9;
      for(const pl of this.platforms){ const dy=pl.y-p.y; if(dy>20&&dy<185){ const s=dy-Math.abs(p.xFrac-this.platX(pl))*1.6; if(s>bs){ bs=s; best=pl; } } }
      if(!best){ for(const pl of this.platforms){ const dy=pl.y-p.y; if(dy>0 && (!best||dy<best.y-p.y)) best=pl; } }
      if(best){ this.targetXFrac=this.platX(best); this.autoTargetPlat=best; }
    }
    update(dt){
      if(this.over) return; this.time+=dt;
      const p=this.player, G=1750, bounce=780, spring=1400;
      let tx=this.targetXFrac; if(this.keyDir) tx=p.xFrac+this.keyDir*dt*2.4;
      p.xFrac+= (tx-p.xFrac)*Math.min(1,dt*14);
      if(p.xFrac<0)p.xFrac+=1; if(p.xFrac>1)p.xFrac-=1;
      const prevY=p.y; p.vy-=G*dt; p.y+=p.vy*dt;
      if(p.vy<0){
        const half=this.platHalf();
        for(const pl of this.platforms){ const px=this.platX(pl);
          if(Math.abs(p.xFrac-px)<half){ const top=pl.y;
            if(prevY>=top-2 && p.y<=top+2){ p.y=top; p.vy=pl.type==='spring'?spring:bounce; break; }
          }
        }
      }
      const targetCam=Math.max(0,p.y-this.H*0.38);
      this.cameraY+=(targetCam-this.cameraY)*Math.min(1,dt*6);
      if(p.y>this._maxY||this._maxY===undefined){ this._maxY=p.y; this.score=Math.max(this.score,Math.floor(p.y/26)); }
      while(this.topY<this.cameraY+this.H+240){ this.topY+=this.gap*(0.78+Math.random()*0.5); this.platforms.push(this.makePlat(this.topY)); }
      this.platforms=this.platforms.filter(pl=>pl.y>this.cameraY-this.H*0.6);
      if(this.autoPlay) this.autoControl();
      if(p.y<this.cameraY-this.H*0.16){ this.gameOver(); }
      scoreEl.textContent=this.score;
    }
    gameOver(){
      this.over=true; if(this.score>this.best){ this.best=this.score; localStorage.setItem('hopBest',String(this.best)); bestEl.textContent=this.best; }
      loseMsg.textContent='本局高度 '+this.score; overlayLose.classList.add('active');
      if(this.autoPlay) setTimeout(()=>{ if(this.autoPlay) this.restart(); },900);
    }
    draw(){
      const W=this.W,H=this.H; ctx.clearRect(0,0,W,H);
      for(const pl of this.platforms){
        const px=this.platX(pl)*W, py=H-(pl.y-this.cameraY); if(py<-30||py>H+30) continue;
        const pw=this.platW(), ph=H*0.022;
        let col=pl.type==='spring'?'#ff7ad9':(pl.type==='move'?'#4dffd0':'#69f0b8');
        ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=12; ctx.fillStyle=col; rr(px-pw/2,py-ph/2,pw,ph,ph/2); ctx.fill();
        if(pl.type==='spring'){ ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.fillRect(px-2,py-ph,4,ph*1.7); }
        ctx.restore();
        if(this.autoPlay&&this.autoTargetPlat===pl){ ctx.strokeStyle='#4dffd0'; ctx.lineWidth=2; ctx.globalAlpha=0.55+0.45*Math.sin(this.time*6); ctx.beginPath(); ctx.arc(px,py,pw*0.72,0,7); ctx.stroke(); ctx.globalAlpha=1; }
      }
      const px=(((this.player.xFrac%1)+1)%1)*W, py=H-(this.player.y-this.cameraY);
      if(py>-40&&py<H+40){
        const rad=H*0.04;
        ctx.save(); ctx.shadowColor='#4dffd0'; ctx.shadowBlur=16; ctx.fillStyle='#bfffe9';
        ctx.beginPath(); ctx.arc(px,py,rad,0,7); ctx.fill();
        ctx.shadowBlur=0; ctx.fillStyle='#0a3326'; ctx.beginPath(); ctx.arc(px-rad*0.32,py-rad*0.2,rad*0.16,0,7); ctx.arc(px+rad*0.32,py-rad*0.2,rad*0.16,0,7); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle='#e6fff4'; ctx.font='bold '+Math.round(W*0.05)+'px Segoe UI'; ctx.textAlign='left'; ctx.fillText('高度 '+this.score,10,26);
    }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.update(dt); this.draw(); }catch(err){ console.error(err); } }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='自动: 开'; b.classList.add('auto-on'); aiInd.style.display='flex'; this.autoTargetPlat=null; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='自动: 关'; b.classList.remove('auto-on'); aiInd.style.display='none'; }
  }
  window.game=new Hop();
})();
</script>
</body>
</html>
