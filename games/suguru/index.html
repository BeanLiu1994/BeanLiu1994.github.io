<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b1020" />
<title>数块迷阵 · Neon Suguru</title>
<style>
  :root{
    --bg:#0b1020; --surface:#111a30; --text:#eaf2ff; --muted:#7e90b3;
    --accent:#ff7eb6; --accent2:#46e0ff; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#ff7eb655; --dim:#243352;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #2a1640 0%, transparent 60%),
                     radial-gradient(ellipse at 50% 100%, #102a44 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:460px;padding:12px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .title-block h1{font-size:1.4rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:54px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.t .value{color:var(--accent);}
  .score-card.p .value{color:var(--accent2);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#080f1e;}
  .toolbar{display:flex;gap:8px;margin-top:10px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1020;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  button.ghost{background:transparent;}
  .hint{text-align:center;color:var(--muted);font-size:0.72rem;margin-top:8px;line-height:1.5;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.7rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay p{color:var(--muted);font-size:0.9rem;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1020;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>数块迷阵 · NEON SUGURU</h1>
      <div class="sub">Number Blocks</div>
    </div>
    <div class="score-panel">
      <div class="score-card t"><div class="label">已填</div><div class="value" id="filled">0 / 0</div></div>
      <div class="score-card p"><div class="label">最佳</div><div class="value" id="best">–</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">AUTO</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">胜利！</h2>
      <p id="ovText"></p>
      <button class="auto on" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="auto" id="autoBtn">自动游玩</button>
    <button class="ghost" id="restartBtn">重开</button>
  </div>
  <div class="hint">点格子<b>循环</b>切换数字 1…区域大小；同区域数字不重复，相邻格数字不<b>相同</b></div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const cv=$('cv'), elFilled=$('filled'), elBest=$('best'),
        elBadge=$('badge'), elOverlay=$('overlay'), elOvTitle=$('ovTitle'), elOvText=$('ovText'),
        btnAuto=$('autoBtn'), btnRestart=$('restartBtn'), btnOv=$('ovBtn');

  const G=7, W=420, H=420, PAD=14, CELL=(W-2*PAD)/G, N=G*G;
  let dpr=Math.min(2,(typeof devicePixelRatio!=='undefined'?devicePixelRatio||1:1));
  function setupCanvas(){
    if(!cv||!cv.getContext) return;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px'; cv.style.maxWidth='100%';
  }
  setupCanvas();
  const ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;

  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  const inb=(r,c)=>r>=0&&c>=0&&r<G&&c<G;
  const idx=(r,c)=>r*G+c;
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  function regionSizes(reg){ const s=[]; for(let i=0;i<N;i++){ const r=reg[i]; if(s[r]===undefined) s[r]=0; s[r]++; } return s; }

  function genRegions(){
    const reg=new Array(N).fill(-1);
    let nextId=0;
    const order=shuffle([...Array(N).keys()]);
    for(const start of order){
      if(reg[start]!==-1) continue;
      const target=2+Math.floor(Math.random()*4); // 2..5
      const cells=[start]; reg[start]=nextId;
      while(cells.length<target){
        const frontier=[];
        for(const c of cells){ const r=Math.floor(c/G), col=c%G;
          for(const [dr,dc] of dirs){ const nr=r+dr,nc=col+dc; if(inb(nr,nc)){ const ni=idx(nr,nc); if(reg[ni]===-1) frontier.push(ni); } } }
        if(!frontier.length) break;
        const pick=frontier[Math.floor(Math.random()*frontier.length)];
        reg[pick]=nextId; cells.push(pick);
      }
      nextId++;
    }
    // merge leftover size-1 regions into an adjacent region of size<5
    let sizes=regionSizes(reg);
    for(let pass=0; pass<60; pass++){
      let changed=false;
      for(let i=0;i<N;i++){
        if(sizes[reg[i]]===1){
          const r=Math.floor(i/G), c=i%G; const adj=new Set();
          for(const [dr,dc] of dirs){ const nr=r+dr,nc=c+dc; if(inb(nr,nc)) adj.add(reg[idx(nr,nc)]); }
          let target=-1, best=0;
          for(const a of adj){ if(sizes[a]<5 && sizes[a]>best){ best=sizes[a]; target=a; } }
          if(target>=0){ reg[i]=target; sizes=regionSizes(reg); changed=true; }
        }
      }
      if(!changed) break;
    }
    // compact ids to contiguous 0..k-1 (merging may have emptied some ids)
    const remap={}; let nid=0;
    for(let i=0;i<N;i++){ if(remap[reg[i]]===undefined) remap[reg[i]]=nid++; }
    for(let i=0;i<N;i++) reg[i]=remap[reg[i]];
    return reg;
  }

  function buildSolution(reg){
    const sizes=regionSizes(reg);
    const numReg=sizes.length;
    const sol=new Array(N).fill(0);
    const used=[]; for(let r=0;r<numReg;r++) used[r]=new Array(sizes[r]+1).fill(false);
    function dfs(i){
      if(i===N) return true;
      const rid=reg[i], maxV=sizes[rid];
      const r=Math.floor(i/G), c=i%G; const cand=[];
      for(let v=1;v<=maxV;v++){
        if(used[rid][v]) continue;
        let ok=true;
        for(const [dr,dc] of dirs){ const nr=r+dr,nc=c+dc; if(inb(nr,nc)){ if(sol[idx(nr,nc)]===v){ ok=false; break; } } }
        if(ok) cand.push(v);
      }
      shuffle(cand);
      for(const v of cand){ sol[i]=v; used[rid][v]=true; if(dfs(i+1)) return true; used[rid][v]=false; sol[i]=0; }
      return false;
    }
    return dfs(0) ? sol : null;
  }

  function genPuzzle(){
    for(let attempt=0; attempt<60; attempt++){
      const reg=genRegions();
      const sol=buildSolution(reg);
      if(sol) return {reg, sol, sizes:regionSizes(reg)};
    }
    return null;
  }

  let reg, sol, sizes, numReg, given, value, filledCount;
  let over, won, auto, autoReplay, autoIdx, autoAccum, glowCell, sel;
  let elapsed, best, winPulse, autoTimer;

  try{ best=parseFloat(localStorage.getItem('suguru_best')); if(!(best>0)) best=0; }catch(e){best=0;}

  function resetToGivens(){
    value=new Array(N).fill(0); filledCount=0;
    for(let i=0;i<N;i++){ if(given[i]){ value[i]=sol[i]; filledCount++; } }
    sel=-1; glowCell=-1;
  }

  function newGame(){
    let p=null;
    for(let t=0;t<30 && !p;t++) p=genPuzzle();
    if(!p) p=genPuzzle();
    reg=p.reg; sol=p.sol; sizes=p.sizes; numReg=sizes.length;
    // choose blanks (~52%)
    given=new Array(N).fill(false);
    for(let i=0;i<N;i++){ if(Math.random()>0.52) given[i]=true; }
    resetToGivens();
    over=false; won=false; auto=false; autoReplay=false; autoIdx=0; autoAccum=0;
    elapsed=0; winPulse=0; autoTimer=0;
    if(elBadge) elBadge.classList.remove('show');
    if(btnAuto){ btnAuto.classList.remove('on'); btnAuto.textContent='自动游玩'; }
    elOverlay.classList.remove('show');
    updateHUD();
  }

  function updateHUD(){
    if(elFilled) elFilled.textContent=filledCount+' / '+N;
    if(elBest) elBest.textContent = best>0 ? best.toFixed(1)+'s' : '–';
  }

  function setAuto(v){
    auto=v;
    if(btnAuto){ btnAuto.classList.toggle('on',v); btnAuto.textContent=v?'自动中…':'自动游玩'; }
    if(elBadge) elBadge.classList.toggle('show',v);
    if(v){ resetToGivens(); autoReplay=true; autoIdx=0; autoAccum=0; glowCell=-1; }
  }

  function autoStep(){
    while(autoIdx<N){
      const i=autoIdx;
      if(!given[i]){ value[i]=sol[i]; filledCount++; glowCell=i; }
      autoIdx++;
      if(autoIdx>=N){ updateHUD(); checkWin(); return; }
      return;
    }
  }

  function checkWin(){
    if(over||won) return;
    if(filledCount<N) return;
    // region permutation
    const seen=[]; for(let r=0;r<numReg;r++) seen[r]=new Array(sizes[r]+1).fill(false);
    for(let i=0;i<N;i++){ const rid=reg[i], v=value[i]; if(v<1||v>sizes[rid]) return; if(seen[rid][v]) return; seen[rid][v]=true; }
    // adjacency
    for(let r=0;r<G;r++)for(let c=0;c<G;c++){ const i=idx(r,c);
      for(const [dr,dc] of [[1,0],[0,1]]){ const nr=r+dr,nc=c+dc; if(inb(nr,nc)){ if(value[i]===value[idx(nr,nc)]) return; } }
    }
    winGame();
  }

  function winGame(){
    over=true; won=true; winPulse=1;
    if(best===0||elapsed<best){ best=elapsed; try{localStorage.setItem('suguru_best',String(best));}catch(e){} }
    if(elBest) elBest.textContent=best.toFixed(1)+'s';
    if(auto){ elOvTitle.textContent='⚡ 自动通关！'; elOvText.textContent='用 '+elapsed.toFixed(1)+'s 填满数块'; autoTimer=1.0; }
    else { elOvTitle.textContent='🎉 通关！'; elOvText.textContent='用 '+elapsed.toFixed(1)+'s 填满数块'; elOverlay.classList.add('show'); }
  }

  function cellAt(x,y){
    const gx=Math.floor((x-PAD)/CELL), gy=Math.floor((y-PAD)/CELL);
    if(gx<0||gy<0||gx>=G||gy>=G) return -1;
    return idx(gy,gx);
  }
  function handleTap(x,y){
    if(over||auto) return;
    const i=cellAt(x,y); if(i<0) return;
    if(given[i]){ sel=i; return; }
    const maxV=sizes[reg[i]];
    const cur=value[i];
    const next=(cur>=maxV)?0:cur+1;
    if(cur>0) filledCount--;
    if(next>0) filledCount++;
    value[i]=next; sel=i; glowCell=i;
    if(filledCount===N) checkWin();
    updateHUD();
  }

  function onDown(e){
    if(over||auto) return;
    let x=0,y=0;
    try{ const rect=cv.getBoundingClientRect(); const cx=(typeof e.clientX==='number')?e.clientX:0, cy=(typeof e.clientY==='number')?e.clientY:0;
      x=((cx-rect.left)/rect.width)*W; y=((cy-rect.top)/rect.height)*H; }catch(err){ return; }
    handleTap(x,y);
    e.preventDefault&&e.preventDefault();
  }
  function onUp(e){ e.preventDefault&&e.preventDefault(); }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointerdown',onDown,{passive:false});
    cv.addEventListener('pointerup',onUp,{passive:false});
    cv.addEventListener('pointercancel',onUp,{passive:false});
    cv.addEventListener('mousedown',onDown,{passive:false});
    cv.addEventListener('mouseup',onUp,{passive:false});
  }
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto) return; setAuto(!auto); if(auto&&over){ newGame(); setAuto(true);} });
  btnRestart&&btnRestart.addEventListener('click',()=>{ newGame(); setAuto(false); });
  btnOv&&btnOv.addEventListener('click',()=>{ newGame(); setAuto(false); });

  function update(dt){
    if(over){
      if(winPulse>0) winPulse=Math.max(0,winPulse-dt*1.5);
      if(auto){ autoTimer-=dt; if(autoTimer<=0){ newGame(); setAuto(true); } }
      return;
    }
    elapsed+=dt;
    if(auto && autoReplay){ autoAccum+=dt; if(autoAccum>=0.05){ autoAccum=0; autoStep(); } }
    if(winPulse>0) winPulse=Math.max(0,winPulse-dt*2);
  }

  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function cc(i){ return [PAD+(i%G)*CELL+CELL/2, PAD+Math.floor(i/G)*CELL+CELL/2]; }
  function regionHue(rid){ return (rid*53+17)%360; }

  function hasConflict(i){
    const v=value[i]; if(v<=0) return false;
    const r=Math.floor(i/G), c=i%G;
    for(const [dr,dc] of dirs){ const nr=r+dr,nc=c+dc; if(inb(nr,nc)){ if(value[idx(nr,nc)]===v) return true; } }
    return false;
  }

  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    // region tints
    for(let i=0;i<N;i++){
      const r=Math.floor(i/G), c=i%G, x=PAD+c*CELL, y=PAD+r*CELL;
      const h=regionHue(reg[i]);
      ctx.fillStyle='hsla('+h+',55%,50%,0.12)';
      roundRect(x+1,y+1,CELL-2,CELL-2,8); ctx.fill();
    }
    // region borders
    ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=2;
    for(let r=0;r<G;r++)for(let c=0;c<G;c++){
      const i=idx(r,c);
      if(c<G-1 && reg[idx(r,c+1)]!==reg[i]){ const x=PAD+(c+1)*CELL; ctx.beginPath(); ctx.moveTo(x,PAD+r*CELL); ctx.lineTo(x,PAD+(r+1)*CELL); ctx.stroke(); }
      if(r<G-1 && reg[idx(r+1,c)]!==reg[i]){ const y=PAD+(r+1)*CELL; ctx.beginPath(); ctx.moveTo(PAD+c*CELL,y); ctx.lineTo(PAD+(c+1)*CELL,y); ctx.stroke(); }
    }
    // inner: fill numbers
    for(let i=0;i<N;i++){
      const r=Math.floor(i/G), c=i%G, x=PAD+c*CELL, y=PAD+r*CELL, v=value[i];
      if(v>0){
        const conflict = !auto && hasConflict(i);
        const isGiven=given[i];
        ctx.save();
        if(conflict){ ctx.fillStyle='rgba(255,107,138,0.22)'; }
        else if(isGiven){ ctx.fillStyle='rgba(255,126,182,0.30)'; }
        else { ctx.fillStyle='rgba(70,224,255,0.16)'; }
        roundRect(x+3,y+3,CELL-6,CELL-6,7); ctx.fill(); ctx.restore();
      }
    }
    // numbers
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let i=0;i<N;i++){ const v=value[i]; if(v<=0) continue; const [x,y]=cc(i);
      ctx.save();
      if(given[i]){ ctx.fillStyle='#fff'; ctx.shadowColor='#ff7eb6'; ctx.shadowBlur=10; }
      else { ctx.fillStyle='#dffaff'; ctx.shadowColor='#46e0ff'; ctx.shadowBlur=8; }
      ctx.font='700 '+Math.floor(CELL*0.4)+'px Segoe UI,sans-serif';
      ctx.fillText(v,x,y); ctx.restore();
    }
    // selected / glow
    if(glowCell>=0 && value[glowCell]>0){
      const [x,y]=cc(glowCell);
      ctx.save(); ctx.shadowColor='#ffd23f'; ctx.shadowBlur=22; ctx.strokeStyle='rgba(255,210,63,0.85)'; ctx.lineWidth=3;
      roundRect(PAD+(glowCell%G)*CELL+3,PAD+Math.floor(glowCell/G)*CELL+3,CELL-6,CELL-6,7); ctx.stroke(); ctx.restore();
    }
    if(sel>=0 && !over){
      const [x,y]=cc(sel);
      ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=2;
      roundRect(PAD+(sel%G)*CELL+2,PAD+Math.floor(sel/G)*CELL+2,CELL-4,CELL-4,8); ctx.stroke(); ctx.restore();
    }
    if(winPulse>0){ ctx.save(); ctx.globalAlpha=winPulse*0.5; ctx.fillStyle='#5dffa6'; ctx.fillRect(0,0,W,H); ctx.restore(); }
  }

  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  function frame(ts){
    const now=(typeof performance!=='undefined'?(ts!==undefined?ts:performance.now()):Date.now());
    let dt=(now-last)/1000; if(!(dt>0)||dt>0.05) dt=0.016; last=now;
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  newGame();

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;},
    get score(){return filledCount;}, get target(){return N;},
    get filled(){return filledCount;}, get best(){return best;}, get elapsed(){return elapsed;},
    startAuto(){ setAuto(true); if(over){ newGame(); setAuto(true);} },
    toggleAuto(){ setAuto(!auto); },
    restart(){ newGame(); setAuto(false); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); }, tick(dt){ update(dt); render(); },
    tap(i){ const p=cc(i); handleTap(p[0],p[1]); },
    get sol(){return sol;}, get givens(){return given;},
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get filled(){return filledCount;}, get target(){return N;}, get best(){return best;}
  };
})();
</script>
</body>
</html>
