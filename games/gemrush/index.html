<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#06121e" />
<title>霓虹接宝 · Neon Gem Rush</title>
<style>
  :root{
    --bg:#06121e; --surface:#0e1c30; --text:#eafaff; --muted:#7e96b8;
    --accent:#36e0ff; --accent2:#ff5db1; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#36e0ff55; --dim:#1b2c45;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #0f3350 0%, transparent 60%),
                     radial-gradient(ellipse at 50% 100%, #2a0f3a 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:480px;padding:12px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .title-block h1{font-size:1.4rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:54px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.g .value{color:var(--gold);}
  .score-card.t .value{color:var(--accent);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#04101c;}
  .toolbar{display:flex;gap:8px;margin-top:10px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  .hint{text-align:center;color:var(--muted);font-size:0.72rem;margin-top:8px;line-height:1.5;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.7rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay p{color:var(--muted);font-size:0.9rem;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>霓虹接宝 · NEON GEM RUSH</h1>
      <div class="sub">Catch · The · Gems</div>
    </div>
    <div class="score-panel">
      <div class="score-card g"><div class="label">宝石</div><div class="value" id="gems">0</div></div>
      <div class="score-card t"><div class="label">时间</div><div class="value" id="time">60</div></div>
      <div class="score-card"><div class="label">最佳</div><div class="value" id="best">–</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">AUTO</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">胜利！</h2>
      <p id="ovText"></p>
      <button class="auto on" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="auto" id="autoBtn">自动游玩</button>
    <button class="ghost" id="restartBtn" style="background:transparent;">重开</button>
  </div>
  <div class="hint"><b>拖动/移动</b>控制底部光篮接住掉落宝石 · 收集 <b>24</b> 颗即通关 · 自动模式完美接宝</div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const cv=$('cv'), elGems=$('gems'), elTime=$('time'), elBest=$('best'),
        elBadge=$('badge'), elOverlay=$('overlay'), elOvTitle=$('ovTitle'), elOvText=$('ovText'),
        btnAuto=$('autoBtn'), btnRestart=$('restartBtn'), btnOv=$('ovBtn');

  const W=432, H=600, bw=W, bh=H;
  const TARGET=24, TIME_LIMIT=60;
  const HUES=[185,320,50,140,265,12,95];
  let dpr=Math.min(2,(typeof devicePixelRatio!=='undefined'?devicePixelRatio||1:1));
  function setupCanvas(){
    if(!cv||!cv.getContext) return;
    cv.width=bw*dpr; cv.height=bh*dpr;
    cv.style.width=bw+'px'; cv.style.height=bh+'px'; cv.style.maxWidth='100%';
  }
  setupCanvas();
  const ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;

  let gems, particles, catcher, targetX, caught, missed, timeLeft, spawnAccum, speedScale;
  let over, won, auto, elapsed, best, winPulse, losePulse, autoTimer;

  try{ best=parseInt(localStorage.getItem('neongem_best'))||0; }catch(e){best=0;}

  function newGame(){
    gems=[]; particles=[]; catcher={x:W/2, w:104, h:22, y:H-46};
    targetX=W/2; caught=0; missed=0; timeLeft=TIME_LIMIT; spawnAccum=0; speedScale=1;
    over=false; won=false; auto=false; elapsed=0; winPulse=0; losePulse=0; autoTimer=0;
    if(btnAuto){ btnAuto.classList.remove('on'); btnAuto.textContent='自动游玩'; }
    if(elBadge) elBadge.classList.remove('show');
    elOverlay.classList.remove('show');
    elGems.textContent='0'; elTime.textContent=TIME_LIMIT;
    elBest.textContent = best>0 ? best+'s' : '–';
  }

  function spawnGem(){
    const x=20+Math.random()*(W-40);
    const hue=HUES[Math.floor(Math.random()*HUES.length)];
    gems.push({x, y:-18, r:14, vy:120+Math.random()*40, hue, trail:[], dead:false});
  }

  function spawnParticles(x,y,hue,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*6.28, sp=60+Math.random()*160;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:1,hue});
    }
  }

  function tryCatch(){
    const top=catcher.y-catcher.h/2;
    for(const g of gems){
      if(g.dead) continue;
      if(g.y+g.r>=top && g.y-g.r<=catcher.y+catcher.h/2){
        if(Math.abs(g.x-catcher.x) <= catcher.w/2 + g.r){
          g.dead=true; caught++; elGems.textContent=caught;
          spawnParticles(g.x,g.y,g.hue,14);
          checkWin();
        }
      }
    }
  }

  function checkWin(){ if(over) return; if(caught>=TARGET){ winGame(); } }
  function winGame(){
    if(over) return; over=true; won=true; winPulse=1;
    const used=Math.round((TIME_LIMIT-timeLeft)*10)/10;
    if(best===0||used<best){ best=used; try{localStorage.setItem('neongem_best',String(best));}catch(e){} }
    elBest.textContent=best+'s';
    if(auto){ elOvTitle.textContent='⚡ 自动通关！'; elOvText.textContent='用 '+used+'s 接满 '+TARGET+' 颗宝石'; autoTimer=1.0; }
    else { elOvTitle.textContent='🎉 通关！'; elOvText.textContent='用 '+used+'s 接满 '+TARGET+' 颗宝石'; elOverlay.classList.add('show'); }
  }
  function loseGame(){
    if(over) return; over=true; won=false; losePulse=1;
    elOvTitle.textContent='⏱ 时间到'; elOvText.textContent='接住 '+caught+' 颗，差 '+(TARGET-caught)+' 颗，再试试自动模式'; elOverlay.classList.add('show');
  }

  function setAuto(v){
    auto=v;
    if(btnAuto){ btnAuto.classList.toggle('on',v); btnAuto.textContent=v?'自动中…':'自动游玩'; }
    if(elBadge) elBadge.classList.toggle('show',v);
  }

  // ---- input (human) ----
  function pointerX(e){
    let x=W/2;
    try{ const rect=cv.getBoundingClientRect(); const cx=(typeof e.clientX==='number')?e.clientX:0; x=((cx-rect.left)/rect.width)*W; }catch(err){}
    return x;
  }
  function onMove(e){ if(auto||over) return; targetX=Math.max(catcher.w/2,Math.min(W-catcher.w/2,pointerX(e))); e.preventDefault&&e.preventDefault(); }
  function onDown(e){ if(auto||over) return; targetX=Math.max(catcher.w/2,Math.min(W-catcher.w/2,pointerX(e))); e.preventDefault&&e.preventDefault(); }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointermove',onMove,{passive:false});
    cv.addEventListener('pointerdown',onDown,{passive:false});
    cv.addEventListener('mousemove',onMove,{passive:false});
    cv.addEventListener('mousedown',onDown,{passive:false});
  }
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto) return; setAuto(!auto); if(auto&&over){ newGame(); setAuto(true);} });
  btnRestart&&btnRestart.addEventListener('click',()=>{ newGame(); setAuto(false); });
  btnOv&&btnOv.addEventListener('click',()=>{ newGame(); setAuto(false); });

  // ---- update ----
  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  function update(dt){
    if(over){
      if(winPulse>0) winPulse=Math.max(0,winPulse-dt*1.4);
      if(losePulse>0) losePulse=Math.max(0,losePulse-dt*1.4);
      if(auto){ autoTimer-=dt; if(autoTimer<=0){ newGame(); setAuto(true); } }
      return;
    }
    elapsed+=dt; timeLeft-=dt; if(timeLeft<0) timeLeft=0;
    elTime.textContent=Math.ceil(timeLeft);
    if(timeLeft<=0 && caught<TARGET){ loseGame(); return; }

    // auto: follow the lowest (closest to catcher) live gem
    if(auto){
      let bestGem=null, bestY=-1;
      for(const g of gems){ if(g.dead) continue; if(g.y>bestY){ bestY=g.y; bestGem=g; } }
      if(bestGem) targetX=Math.max(catcher.w/2,Math.min(W-catcher.w/2,bestGem.x));
    }
    // move catcher toward targetX
    const maxSpeed=1100;
    const dx=targetX-catcher.x;
    const step=maxSpeed*dt;
    if(Math.abs(dx)<=step) catcher.x=targetX; else catcher.x+=Math.sign(dx)*step;

    // spawn
    spawnAccum+=dt;
    const interval=Math.max(0.32, 0.55 - elapsed*0.004);
    if(spawnAccum>=interval){ spawnAccum=0; spawnGem(); speedScale=1+Math.min(0.6, elapsed*0.01); }

    // move gems
    for(const g of gems){
      if(g.dead) continue;
      g.trail.push(g.y); if(g.trail.length>6) g.trail.shift();
      g.y+=g.vy*speedScale*dt;
      if(g.y-g.r>catcher.y+catcher.h/2+10){ g.dead=true; missed++; }
    }
    tryCatch();
    gems=gems.filter(g=>!g.dead || g.y<H+40);

    // particles
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=320*dt; p.life-=dt*1.6; }
    particles=particles.filter(p=>p.life>0);
  }

  // ---- render ----
  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,bw,bh);
    // faint starfield
    ctx.fillStyle='rgba(54,224,255,0.05)';
    for(let i=0;i<18;i++){ const sx=(i*53)%W, sy=(i*97+ (elapsed*20))%H; ctx.fillRect(sx,sy,2,2); }
    // gems
    for(const g of gems){
      // trail
      for(let i=0;i<g.trail.length;i++){
        const ty=g.trail[i]; const a=(i/g.trail.length)*0.25;
        ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='hsl('+g.hue+',90%,60%)';
        ctx.beginPath(); ctx.arc(g.x,ty,g.r*0.7,0,6.28); ctx.fill(); ctx.restore();
      }
      ctx.save(); ctx.shadowColor='hsl('+g.hue+',90%,60%)'; ctx.shadowBlur=18;
      ctx.fillStyle='hsl('+g.hue+',90%,62%)';
      ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,6.28); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(g.x-g.r*0.3,g.y-g.r*0.3,g.r*0.3,0,6.28); ctx.fill();
      ctx.restore();
    }
    // catcher (neon basket)
    const cx=catcher.x, cy=catcher.y, hw=catcher.w/2, hh=catcher.h/2;
    ctx.save(); ctx.shadowColor='#36e0ff'; ctx.shadowBlur=20;
    ctx.strokeStyle='#36e0ff'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(cx-hw, cy-hh); ctx.lineTo(cx-hw, cy+hh); ctx.lineTo(cx+hw, cy+hh); ctx.lineTo(cx+hw, cy-hh);
    ctx.stroke();
    ctx.strokeStyle='rgba(54,224,255,0.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx-hw, cy-hh); ctx.lineTo(cx+hw, cy-hh); ctx.stroke();
    ctx.restore();
    // particles
    for(const p of particles){ ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle='hsl('+p.hue+',90%,65%)'; ctx.shadowColor='hsl('+p.hue+',90%,65%)'; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,6.28); ctx.fill(); ctx.restore(); }
    // target progress bar
    const prog=Math.min(1,caught/TARGET);
    ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(8,8,W-16,6);
    ctx.save(); ctx.shadowColor='#ffd23f'; ctx.shadowBlur=10; ctx.fillStyle='#ffd23f'; ctx.fillRect(8,8,(W-16)*prog,6); ctx.restore();

    if(winPulse>0){ ctx.save(); ctx.globalAlpha=winPulse*0.4; ctx.fillStyle='#5dffa6'; ctx.fillRect(0,0,bw,bh); ctx.restore(); }
    if(losePulse>0){ ctx.save(); ctx.globalAlpha=losePulse*0.4; ctx.fillStyle='#ff6b8a'; ctx.fillRect(0,0,bw,bh); ctx.restore(); }
  }

  function frame(ts){
    const now=(typeof performance!=='undefined'?(ts!==undefined?ts:performance.now()):Date.now());
    let dt=(now-last)/1000; if(!(dt>0)||dt>0.05) dt=0.016; last=now;
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  newGame();

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;},
    get score(){return caught;},
    get remaining(){return TARGET-caught;},
    get best(){return best;}, get timeLeft(){return timeLeft;}, get elapsed(){return elapsed;},
    startAuto(){ setAuto(true); if(over){ newGame(); setAuto(true);} },
    toggleAuto(){ setAuto(!auto); },
    restart(){ newGame(); setAuto(false); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); },
    tick(dt){ update(dt); render(); },
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get score(){return caught;}, get remaining(){return TARGET-caught;}, get best(){return best;}, get timeLeft(){return timeLeft;}
  };
})();
</script>
</body>
</html>
