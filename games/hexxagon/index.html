<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹六角 · Neon Hexxagon</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#4d9bff; --accent-glow:#4d9bff66; --gold:#ffd54a; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 18% 12%, #102a38 0%, transparent 55%), radial-gradient(ellipse at 82% 88%, #2a1240 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#4d9bff,#b06bff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:52px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.you .value { color:var(--accent); }
  .score-card.ai .value { color:var(--red); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#06101e; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#06101e; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹六角</h1><div class="sub">N E O N &nbsp; H E X X A G O N</div></div>
    <div class="score-panel">
      <div class="score-card you"><div class="label">You</div><div class="value" id="you">1</div></div>
      <div class="score-card ai"><div class="label">AI</div><div class="value" id="ai">1</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="440" height="400"></canvas></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">New Game</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">点你的棋子选中，再点空位克隆/跳跃（距离1克隆，距离2跳跃）</div>
</div>
<script>
(function(){
  'use strict';
  const R=4; // hexagon radius -> 61 cells
  const DIRS=[[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
  const YC={1:'#4d9bff',2:'#ff5d6a'};
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const youEl=document.getElementById('you'), aiEl=document.getElementById('ai'), statusEl=document.getElementById('status');
  const key=(q,r)=>q+','+r;
  const dist=(a,b)=>{ const dq=a.q-b.q, dr=a.r-b.r, ds=(-a.q-a.r)-(-b.q-b.r); return (Math.abs(dq)+Math.abs(dr)+Math.abs(ds))/2; };

  class Hexx {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); this.onDown(e); });
      this.restart();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(rect.width||440,440)); const dpr=window.devicePixelRatio||1;
      this.W=w; this.H=w*400/440; canvas.width=w*dpr; canvas.height=this.H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); this.layout(); }
    layout(){ // center board in W x H
      let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9; const size=20;
      this.cells=[]; this.pos={};
      for(let q=-R;q<=R;q++) for(let r=Math.max(-R,-q-R);r<=Math.min(R,-q+R);r++){
        const x=size*Math.sqrt(3)*(q + r/2), y=size*1.5*r;
        this.cells.push({q,r,x,y}); this.pos[key(q,r)]={x,y};
        minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y);
      }
      const bw=maxX-minX, bh=maxY-minY; const ox=(this.W-bw)/2-minX, oy=(this.H-bh)/2-minY;
      for(const c of this.cells){ c.x+=ox; c.y+=oy; this.pos[key(c.q,c.r)]={x:c.x,y:c.y}; }
      this.size=size;
    }
    restart(){ this.stopAuto(); this.over=false; this.win=null; this.turn=1; this.sel=null; this.board={}; this.scale={};
      for(const c of this.cells) this.board[key(c.q,c.r)]=0;
      const corners=[[R,0],[-R,0]]; // left/right extremes
      this.board[key(R,0)]=1; this.board[key(-R,0)]=2;
      this.scale[key(R,0)]=0.05; this.scale[key(-R,0)]=0.05;
      this.youCt=1; this.aiCt=1; this.updateUI();
    }
    emptyCells(){ const out=[]; for(const c of this.cells) if(this.board[key(c.q,c.r)]===0) out.push(c); return out; }
    ownCells(p){ const out=[]; for(const c of this.cells) if(this.board[key(c.q,c.r)]===p) out.push(c); return out; }
    count(p){ let n=0; for(const c of this.cells) if(this.board[key(c.q,c.r)]===p) n++; return n; }
    neighbors(cell){ const out=[]; for(const d of DIRS){ const q=cell.q+d[0], r=cell.r+d[1]; if(this.board[key(q,r)]!==undefined) out.push({q,r}); } return out; }
    applyMove(p, from, to){
      const d=dist(from,to);
      if(d===1){ this.board[key(to.q,to.r)]=p; } // clone
      else { this.board[key(from.q,from.r)]=0; this.board[key(to.q,to.r)]=p; } // jump (d===2)
      for(const n of this.neighbors(to)){ if(this.board[key(n.q,n.r)]===3-p) this.board[key(n.q,n.r)]=p; }
      this.scale[key(to.q,to.r)]=0.05;
    }
    legalMoves(p){ const out=[]; for(const a of this.ownCells(p)) for(const b of this.emptyCells()){ const d=dist(a,b); if(d===1||d===2) out.push({from:a,to:b}); } return out; }
    gain(p, from, to){
      const d=dist(from,to); let g=(d===1)?1:0;
      for(const n of this.neighbors(to)) if(this.board[key(n.q,n.r)]===3-p) g++;
      return g;
    }
    doMove(p, mv){ this.applyMove(p, mv.from, mv.to); this.turn=(p===1)?2:1; this.youCt=this.count(1); this.aiCt=this.count(2); this.checkEnd(); }
    checkEnd(){
      const y=this.count(1), a=this.count(2);
      if(y===0||a===0||this.emptyCells().length===0||(this.legalMoves(1).length===0&&this.legalMoves(2).length===0)){
        this.over=true; this.win = y>a?1:(a>y?2:0);
        statusEl.textContent = this.win===0?'平局！':(this.win===1?'🎉 你赢了！':'AI 胜');
      }
    }
    bestMove(p){ const ms=this.legalMoves(p); if(!ms.length) return null; let best=null,bg=-1;
      for(const m of ms){ const g=this.gain(p,m.from,m.to); if(g>bg){ bg=g; best=m; } } return best; }
    onDown(e){ if(this.autoPlay||this.over) return; const rect=canvas.getBoundingClientRect(); const x=(e.clientX-rect.left)*(this.W/rect.width), y=(e.clientY-rect.top)*(this.H/rect.height);
      let hit=null; for(const c of this.cells){ const p=this.pos[key(c.q,c.r)]; if((x-p.x)**2+(y-p.y)**2 < (this.size*0.9)**2){ hit=c; break; } }
      if(!hit) return;
      const v=this.board[key(hit.q,hit.r)];
      if(this.sel){ if(v===0 && (dist(this.sel,hit)===1||dist(this.sel,hit)===2)){ this.doMove(1,{from:this.sel,to:hit}); this.sel=null; this.afterHuman(); } else if(v===1){ this.sel=hit; } else { this.sel=null; } }
      else if(v===1){ this.sel=hit; }
    }
    afterHuman(){ if(this.over) return; if(this.turn===2) this.autoTimer=setTimeout(()=>{ if(!this.autoPlay&&!this.over){ const m=this.bestMove(2); if(m) this.doMove(2,m); } }, 480); }
    updateUI(){ youEl.textContent=this.youCt; aiEl.textContent=this.aiCt; if(!this.over) statusEl.textContent=this.autoPlay?('自动对弈中… 你 '+this.youCt+' · AI '+this.aiCt):(this.turn===1?'轮到你':'AI 思考中…'); }
    // ---- auto ----
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; this.sel=null; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this.autoStep(); }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    autoStep(){ if(!this.autoPlay) return; if(this.over){ this._autoNext(); return; }
      const m=this.bestMove(this.turn); if(m){ this.doMove(this.turn, m); this._autoProgress++; this.updateUI(); }
      this.autoTimer=setTimeout(()=>this.autoStep(), 360);
    }
    _autoNext(){ this.stopAuto(); this.restart(); this.startAuto(); }
    // ---- render ----
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.draw(dt); }catch(err){ console.error(err); } }
    draw(dt){ const W=this.W,H=this.H; ctx.clearRect(0,0,W,H); const k=Math.min(1,dt*8); const s=this.size;
      // cells
      for(const c of this.cells){ const p=this.pos[key(c.q,c.r)]; ctx.fillStyle='#ffffff08'; this.hex(p.x,p.y,s*0.92); ctx.fill(); }
      for(const c of this.cells){ const v=this.board[key(c.q,c.r)]; const p=this.pos[key(c.q,c.r)]; const sk=this.scale[key(c.q,c.r)]||1; const ns=sk+(1-sk)*k; this.scale[key(c.q,c.r)]=ns;
        if(v!==0){ const s2=s*0.7*ns; ctx.save(); ctx.shadowColor=YC[v]; ctx.shadowBlur=14; ctx.fillStyle=YC[v]; this.hex(p.x,p.y,s2); ctx.fill(); ctx.restore();
          if(this.sel && this.sel.q===c.q && this.sel.r===c.r){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; this.hex(p.x,p.y,s*0.8); ctx.stroke(); } }
      }
    }
    hex(x,y,r){ ctx.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i-90); const px=x+r*Math.cos(a), py=y+r*Math.sin(a); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); } ctx.closePath(); }
  }
  window.game=new Hexx();
})();
</script>
</body>
</html>
