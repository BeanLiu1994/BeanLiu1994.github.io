<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#06120c" />
<title>霓虹桌球 · Neon Pool</title>
<style>
  :root { --bg:#06120c; --surface:#0d1f14; --board:#08200f; --text:#e6fff0; --muted:#7fae93;
    --accent:#54e08a; --accent-glow:#54e08a66; --danger:#ff6b6b; --gold:#ffd700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg);
    background-image: radial-gradient(ellipse at 50% 30%, #0c3a22 0%, transparent 55%), radial-gradient(ellipse at 50% 80%, #10331f 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:700px; padding:12px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),#b6ffcf,#54e08a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 14px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .score-card.pot .value { color:var(--accent); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:auto; border-radius:10px; background:var(--board); cursor:crosshair; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#06120cee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; }
  .overlay-content h2 { font-size:1.9rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:14px; font-size:0.9rem; }
  .overlay.win h2 { color:var(--gold); } .overlay.lose h2 { color:var(--danger); }
  .controls { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:10px 12px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; text-align:center; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#031208; }
  .btn.primary:hover { box-shadow:0 0 20px var(--accent-glow); }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#031208; animation:pg 2s infinite; --glow:var(--accent-glow); }
  @keyframes pg { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:18px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bk .8s infinite; }
  @keyframes bk { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:6px; font-size:0.7rem; color:var(--muted); }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹桌球</h1><div class="sub">N E O N &nbsp; P O O L</div></div>
    <div class="score-panel">
      <div class="score-card pot"><div class="label">Potted</div><div class="value" id="score-pot">0</div></div>
      <div class="score-card"><div class="label">Shots</div><div class="value" id="score-shots">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="cv" width="640" height="320"></canvas>
    <div class="overlay win" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2 id="win-title">Clear!</h2><p id="win-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
    <div class="overlay lose" id="overlay-lose"><div class="overlay-bg"></div><div class="overlay-content"><h2>Scratch!</h2><p id="lose-msg"></p><button class="btn primary" onclick="game.restart()">Try Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Rack</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI is aiming...</span></div>
  <div class="stats-bar"><span id="best-stat">Best: 0 pots</span><span>Pot all 15 to win</span></div>
</div>
<script>
(function(){
  'use strict';
  const W=640, H=320, M=26, BR=11, PR=17, FR=0.986, REST=0.9;
  const canvas=document.getElementById('cv'); const ctx=canvas.getContext('2d');
  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
  const cols=['#ffd24d','#3a7bff','#ff4d6a','#9b59ff','#ff8c1a','#2ad6c8','#8b1a1a','#1a1a1a','#ff5db1','#36c24a','#5a3a1a','#1aa0ff','#ff2d2d','#7a4dff','#2ecc71'];
  const pockets=[ [M,M],[W/2,M],[W-M,M],[M,H-M],[W/2,H-M],[W-M,H-M] ];

  class Pool {
    constructor(){
      this.autoPlay=false; this.last=0; this.raf=null; this.over=false; this.win=false;
      this.potted=0; this.shots=0; this.cool=0; this.best=this.loadBest();
      this.aiming=false; this.aimNow=null;
      this.loop=this.loop.bind(this);
      this.bind(); this.restart();
      this.last=performance.now(); this.raf=requestAnimationFrame(this.loop);
    }
    loadBest(){ try{ return parseInt(localStorage.getItem('pool_best')||'0')||0; }catch(e){ return 0; } }
    saveBest(){ try{ localStorage.setItem('pool_best', String(this.best)); }catch(e){} }
    rack(){
      this.balls=[];
      this.cue={x:W*0.26,y:H/2,vx:0,vy:0,r:BR,color:'#f4f4f4',cue:true,potted:false};
      this.balls.push(this.cue);
      const ax=W*0.64, ay=H/2, dx=BR*1.82, dy=2*BR+0.6;
      let n=0;
      for(let row=0;row<5;row++){
        for(let i=0;i<=row;i++){
          const x=ax+row*dx, y=ay+(i-row/2)*dy;
          this.balls.push({x,y,vx:0,vy:0,r:BR,color:cols[n%cols.length],num:n+1,potted:false});
          n++;
        }
      }
    }
    restart(){
      this.stopAuto(); this.over=false; this.win=false; this.potted=0; this.shots=0; this.cool=0;
      document.getElementById('overlay-win').classList.remove('active');
      document.getElementById('overlay-lose').classList.remove('active');
      this.rack(); this.updateUI();
    }
    updateUI(){ document.getElementById('score-pot').textContent=this.potted; document.getElementById('score-shots').textContent=this.shots; document.getElementById('best-stat').textContent='Best: '+this.best+' pots'; }
    stopped(){ for(const b of this.balls){ if(!b.potted && (b.vx*b.vx+b.vy*b.vy)>0.0025) return false; } return true; }
    step(dt){
      if(this.over) return;
      // integrate
      for(const b of this.balls){ if(b.potted) continue;
        b.x+=b.vx*dt; b.y+=b.vy*dt; b.vx*=FR; b.vy*=FR;
        if(b.vx*b.vx+b.vy*b.vy<0.0016){ b.vx=0; b.vy=0; }
      }
      // collisions
      for(let i=0;i<this.balls.length;i++){ const a=this.balls[i]; if(a.potted) continue;
        for(let j=i+1;j<this.balls.length;j++){ const b=this.balls[j]; if(b.potted) continue; this.resolve(a,b); }
      }
      // cushions + pockets
      for(const b of this.balls){ if(b.potted) continue;
        for(const p of pockets){ if(Math.hypot(b.x-p[0],b.y-p[1])<PR){ this.pot(b); break; } }
        if(b.potted) continue;
        if(b.x<M+b.r){ b.x=M+b.r; b.vx=Math.abs(b.vx)*REST; }
        if(b.x>W-M-b.r){ b.x=W-M-b.r; b.vx=-Math.abs(b.vx)*REST; }
        if(b.y<M+b.r){ b.y=M+b.r; b.vy=Math.abs(b.vy)*REST; }
        if(b.y>H-M-b.r){ b.y=H-M-b.r; b.vy=-Math.abs(b.vy)*REST; }
      }
      // turn logic
      if(this.cool>0) this.cool--;
      if(this.stopped() && !this.over){
        if(this.autoPlay && this.cool===0){ this.aiShoot(); this.cool=24; }
      }
    }
    resolve(a,b){
      const dx=b.x-a.x, dy=b.y-a.y; const d=Math.hypot(dx,dy); const min=a.r+b.r;
      if(d>0.0001 && d<min){
        const nx=dx/d, ny=dy/d; const ov=(min-d)/2;
        a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
        const rvx=b.vx-a.vx, rvy=b.vy-a.vy; const vn=rvx*nx+rvy*ny;
        if(vn<0){ a.vx+=vn*nx; a.vy+=vn*ny; b.vx-=vn*nx; b.vy-=vn*ny; }
      }
    }
    pot(b){
      b.potted=true; b.vx=0; b.vy=0;
      if(b.cue){ this.cue={x:W*0.26,y:H/2,vx:0,vy:0,r:BR,color:'#f4f4f4',cue:true,potted:false};
        const idx=this.balls.indexOf(b); this.balls[idx]=this.cue;
        this.flash('Scratch! Cue reset.'); this.updateUI();
        if(this.autoPlay){ this.aiShoot(); this.cool=24; }
        return;
      }
      this.potted++; if(this.potted>this.best){ this.best=this.potted; this.saveBest(); }
      this.updateUI();
      if(this.potted>=15){ this.over=true; this.win=true; this.finish(); }
    }
    flash(msg){ const el=document.getElementById('ai-status'); if(el) el.textContent=msg; }
    clearLine(x0,y0,x1,y1,ignore,marginMul){
      const steps=Math.ceil(Math.hypot(x1-x0,y1-y0)/ (BR*0.8));
      const margin=BR*0.6*(marginMul||1);
      for(let s=1;s<steps;s++){ const t=s/steps, x=x0+(x1-x0)*t, y=y0+(y1-y0)*t;
        for(const b of this.balls){ if(b.potted||b===ignore) continue; if(Math.hypot(b.x-x,b.y-y)<b.r+margin) return false; } }
      return true;
    }
    aiShoot(){
      const cue=this.cue; let best=null, bestCost=1e9;
      for(const b of this.balls){ if(b.potted||b.cue) continue;
        for(const p of pockets){
          const ux=(p[0]-b.x), uy=(p[1]-b.y); const ul=Math.hypot(ux,uy)||1; const uxh=ux/ul, uyh=uy/ul;
          const gx0=b.x-uxh*2*b.r, gy0=b.y-uyh*2*b.r; // nominal ghost ball center
          // 对 ghost ball 位置做微扰采样（±3px），找到最优碰球角度
          for(let sa=-1.5;sa<=1.5;sa+=1.5){
            for(let sb=-1.5;sb<=1.5;sb+=1.5){
              const gx=gx0+sa, gy=gy0+sb;
              if(gx<M+b.r||gx>W-M-b.r||gy<M+b.r||gy>H-M-b.r) continue;
              const ad=Math.hypot(gx-cue.x,gy-cue.y);
              // 降低 margin：AI 可以用更窄的通道（0.5x margin）
              if(!this.clearLine(cue.x,cue.y,gx,gy,cue,0.5)) continue;
              // 推算目标球受击后的方向，与口袋方向的偏差
              const hitAng=Math.atan2(b.y-gy, b.x-gx);
              const pktAng=Math.atan2(p[1]-b.y, p[0]-b.x);
              let angErr=Math.abs(hitAng-pktAng);
              if(angErr>Math.PI) angErr=2*Math.PI-angErr;
              if(angErr>0.22) continue; // 偏差太大，跳过
              if(!this.clearLine(b.x,b.y,p[0],p[1],b,0.5)) continue;
              const cost=ad + ul*0.25 + angErr*600;
              if(cost<bestCost){ bestCost=cost; best={dx:gx-cue.x,dy:gy-cue.y,dist:ad+ul}; }
            }
          }
        }
      }
      let dx,dy,power;
      if(best){ dx=best.dx; dy=best.dy; power=clamp(5+best.dist*0.028, 5.5, 19); }
      else { // 无直接进球路线，打安全球：把目标球往中间驱散
        let nb=null,nd=1e9; for(const b of this.balls){ if(b.potted||b.cue) continue; const d=Math.hypot(b.x-cue.x,b.y-cue.y); if(d<nd){nd=d;nb=b;} }
        if(!nb) return;
        // 瞄准时往桌面中心方向偏移，减少白球落袋概率
        const cx=W/2,cy=H/2; const tdx=nb.x-cue.x+(cx-nb.x)*0.4; const tdy=nb.y-cue.y+(cy-nb.y)*0.4;
        const tdl=Math.hypot(tdx,tdy)||1; dx=tdx/tdl; dy=tdy/tdl; power=clamp(6+nd*0.03, 5.5, 14);
        dx=dx*power; dy=dy*power;
        this.shots++; this.updateUI(); cue.vx=dx; cue.vy=dy; return;
      }
      const dl=Math.hypot(dx,dy)||1; cue.vx=dx/dl*power; cue.vy=dy/dl*power; this.shots++; this.updateUI();
    }
    finish(){ if(this.autoPlay) this.stopAuto();
      const win=document.getElementById('overlay-win'), lose=document.getElementById('overlay-lose');
      if(this.win){ document.getElementById('win-title').textContent='Rack Cleared!'; document.getElementById('win-msg').textContent='Potted all 15 in '+this.shots+' shots'; win.classList.add('active'); }
      else lose.classList.add('active');
    }
    loop(now){
      const dt=Math.max(0.3,Math.min(2.2,(now-this.last)/16.67)); this.last=now;
      this.step(dt); this.draw();
      this.raf=requestAnimationFrame(this.loop);
    }
    draw(){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#0c2a17'; ctx.fillRect(M-6,M-6,W-2*(M-6),H-2*(M-6));
      ctx.strokeStyle='#1c4a2e'; ctx.lineWidth=8; ctx.strokeRect(M-2,M-2,W-2*(M-2),H-2*(M-2));
      for(const p of pockets){ ctx.fillStyle='#04140a'; ctx.beginPath(); ctx.arc(p[0],p[1],PR,0,7); ctx.fill(); }
      // aim line
      if(this.aiming && this.aimNow){
        const c=this.cue; const dx=this.aimNow.x-c.x, dy=this.aimNow.y-c.y; const dl=Math.hypot(dx,dy)||1;
        const px=c.x-dx/dl*Math.min(140,dl), py=c.y-dy/dl*Math.min(140,dl);
        ctx.strokeStyle='#ffffff88'; ctx.lineWidth=2; ctx.setLineDash([6,8]);
        ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(px,py); ctx.stroke(); ctx.setLineDash([]);
      }
      for(const b of this.balls){ if(b.potted) continue;
        ctx.shadowColor=b.color; ctx.shadowBlur=10; ctx.fillStyle=b.color;
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); ctx.shadowBlur=0;
        if(!b.cue){ ctx.fillStyle='#00000055'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r*0.45,0,7); ctx.fill(); }
      }
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; this.flash('AI is aiming...'); }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    bind(){
      const pos=(e)=>{ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; };
      canvas.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over) return; canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId); this.aiming=true; this.aimNow=pos(e); });
      canvas.addEventListener('pointermove',(e)=>{ if(!this.aiming) return; this.aimNow=pos(e); });
      canvas.addEventListener('pointerup',(e)=>{ if(!this.aiming) return; this.aiming=false; const p=pos(e); const dx=this.cue.x-p.x, dy=this.cue.y-p.y; const dl=Math.hypot(dx,dy); if(dl<6) return; const power=Math.min(15, dl*0.06); this.cue.vx=dx/dl*power; this.cue.vy=dy/dl*power; this.shots++; this.updateUI(); });
    }
  }
  window.game=new Pool();
})();
</script>
</body>
</html>
