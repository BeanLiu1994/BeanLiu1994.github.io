<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹乒乓 · Pong</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0b1024; --text:#e0e0f0; --muted:#8888aa;
    --accent:#4dffd0; --accent-glow:#4dffd066; --danger:#ff4d6a; --gold:#ffd700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg);
    background-image: radial-gradient(ellipse at 30% 30%, #103a30 0%, transparent 55%), radial-gradient(ellipse at 70% 70%, #301030 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:440px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),#a0fff0,#4dffd0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 14px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .score-card.you .value { color:var(--accent); } .score-card.ai .value { color:var(--danger); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:auto; border-radius:10px; background:var(--board); cursor:pointer; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#0a0a1aee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; }
  .overlay-content h2 { font-size:1.9rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:14px; font-size:0.9rem; }
  .overlay.win h2 { color:var(--gold); } .overlay.lose h2 { color:var(--danger); }
  .controls { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:10px 12px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; text-align:center; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#021410; }
  .btn.primary:hover { box-shadow:0 0 20px var(--accent-glow); }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#021410; animation:pg 2s infinite; --glow:var(--accent-glow); }
  @keyframes pg { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:18px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bk .8s infinite; }
  @keyframes bk { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:6px; font-size:0.7rem; color:var(--muted); }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹乒乓</h1><div class="sub">N E O N &nbsp; P O N G</div></div>
    <div class="score-panel">
      <div class="score-card you"><div class="label">You</div><div class="value" id="score-you">0</div></div>
      <div class="score-card ai"><div class="label">AI</div><div class="value" id="score-ai">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="cv" width="420" height="520"></canvas>
    <div class="overlay win" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2 id="win-title">You Win!</h2><p id="win-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
    <div class="overlay lose" id="overlay-lose"><div class="overlay-bg"></div><div class="overlay-content"><h2>Game Over</h2><p id="lose-msg"></p><button class="btn primary" onclick="game.restart()">Try Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI rallying...</span></div>
  <div class="stats-bar"><span id="rally-stat">Rally: 0</span><span id="target-stat">First to 7</span></div>
</div>
<script>
(function(){
  'use strict';
  const W=420,H=520;
  const canvas=document.getElementById('cv'); const ctx=canvas.getContext('2d');
  const PH=74, PW=12, WIN=7;
  const SPMAX=9.5; // 球速上限

  class Pong {
    constructor(){
      this.autoPlay=false; this.last=0; this.raf=null; this.over=false;
      this.you={y:H/2}; this.ai={y:H/2}; this.targetY=H/2; this.rally=0;
      this.loop=this.loop.bind(this);
      this.bind(); this.restart();
      this.last=performance.now(); this.raf=requestAnimationFrame(this.loop);
    }
    reset(){ this._autoErr=0; this._aiErr=0; this._autoAITarget=H/2; this._autoHits=0; this._autoLet=0; this.ball={ x:W/2, y:H/2, vx:(Math.random()<.5?-1:1)*4.4, vy:(Math.random()*2-1)*2.2 }; this.rally=0; this.updateUI(); }
    restart(){
      this.stopAuto();
      this.youS=0; this.aiS=0; this.over=false;
      this.you.y=H/2; this.ai.y=H/2; this.targetY=H/2;
      document.getElementById('overlay-win').classList.remove('active');
      document.getElementById('overlay-lose').classList.remove('active');
      this.reset();
    }
    updateUI(){ document.getElementById('score-you').textContent=this.youS; document.getElementById('score-ai').textContent=this.aiS; document.getElementById('rally-stat').textContent='Rally: '+this.rally; }
    aiMovePaddle(p,target,dt,spd){ const sp=(spd||7.2)*dt; if(p.y<target) p.y=Math.min(target,p.y+sp); else p.y=Math.max(target,p.y-sp); p.y=Math.max(PH/2,Math.min(H-PH/2,p.y)); }
    step(dt){
      if(this.over) return;
      const b=this.ball;
      // paddles
      if(this.autoPlay){
        // 自动演示：双方都带缓慢游走误差让对拉 lively；再用"轮转漏球"保证比分稳稳推进、比赛必然收敛
        const boost = 1 + Math.max(0, this.rally-20)*0.08;
        this._autoErr += (Math.random()*2-1)*12*dt;
        this._autoErr = Math.max(-PH*0.45*boost, Math.min(PH*0.45*boost, this._autoErr*0.96));
        this.targetY = b.y + this._autoErr; // 我方带误差
        this._aiErr += (Math.random()*2-1)*12*dt;
        this._aiErr = Math.max(-PH*0.45*boost, Math.min(PH*0.45*boost, this._aiErr*0.96));
        this._autoAITarget = b.y + this._aiErr; // AI 也带误差
        // 轮转漏球：让"要漏球"的一方把拍子主动撤到角落，使球从其旁边经过——看起来是主动退让，而非"拍子挡着却穿模"。
        if(this._autoLet!==0){
          const retreat = (b.y < H/2) ? H-PH/2-12 : PH/2+12;
          if(this._autoLet===-1) this._autoAITarget = retreat;   // 右拍(AI)退让
          if(this._autoLet===1)  this.targetY = retreat;          // 左拍(我方)退让
        }
      }
      // 手动模式挡板跟球更跟手(10.2/帧)；自动演示挡板限速低一些，配合游走误差更"human"
      this.aiMovePaddle(this.ai, this.autoPlay ? this._autoAITarget : b.y, dt, this.autoPlay?7.2:10.2);
      this.aiMovePaddle(this.you, this.targetY, dt, 10.2);
      // 自动演示的"轮转漏球"：领先方每接若干球故意漏一拍→球穿过得分，比分稳推、比赛必然收敛
      let letLeft=false, letRight=false;
      if(this.autoPlay && this._autoLet===1) letLeft=true; else if(this.autoPlay && this._autoLet===-1) letRight=true;
      // 击球反弹：连续角度(按击球点偏移计算) + 夹紧到 ±MAXA，杜绝过斜乱飞；
      // 仅在自动模式加极小抖动(±0.05rad)破极端死水平；手动模式完全由玩家手感决定
      const bounce=(dir)=>{ // dir: +1 球改向右(击中左拍)、-1 球改向左(击中右拍)
        const paddleY=(dir>0)?this.you.y:this.ai.y;
        let off=(b.y-paddleY)/(PH/2); // 越界也夹到 [-1,1]，避免拍边命中时角度过斜
        off=Math.max(-1,Math.min(1,off));
        const MAXA=Math.PI/3.8;       // 最大偏转约 47°(夹紧，避免过水平也避免过垂直)
        let ang=off*MAXA;             // 连续：打点越偏，出射角越斜
        if(this.autoPlay){ ang += (Math.random()*2-1)*0.05; } // 仅自动破极少真水平直线
        // 速度上限随 rally 增长而缓降：长局球略慢，让挡板误差真正转化成失分、保证比赛收敛
        const spCap = Math.max(5.2, SPMAX - Math.max(0,this.rally-20)*0.06);
        let sp=Math.min(Math.hypot(b.vx,b.vy)+0.25, spCap);
        b.vx=dir*Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp; // 水平分=cos、垂直分=sin
        // 球放回所击拍同侧前方内侧：左拍命中(dir>0,球向右)→放左侧；右拍命中(dir<0,球向左)→放右侧。
        b.x=(dir>0)?PW+8+10:W-PW-8-10; this.rally++; this.updateUI();
        if(this.autoPlay){ // 真实击球数累计，达阈值则安排领先方下次漏球
          this._autoHits++;
          const diff=Math.abs(this.youS-this.aiS);
          const nearEnd = (this.youS>=6||this.aiS>=6);
          const stale = this.rally>400?5 : this.rally>800?4 : 14;
          const every=nearEnd?4:Math.max(4, Math.min(stale, 14-diff*2));
          if(this._autoHits>=every){
            this._autoHits=0;
            if(this.youS>this.aiS) this._autoLet=1; else if(this.aiS>this.youS) this._autoLet=-1; else this._autoLet=(this._autoLet>0?-1:1);
          }
        }
      };
      // ball：子步进，避免大 dt 单帧穿墙/穿挡板，手感更稳
      const dist=Math.hypot(b.vx,b.vy)*dt; const steps=Math.max(1,Math.ceil(dist/6)); const sdt=dt/steps;
      for(let s=0;s<steps;s++){
        b.x+=b.vx*sdt; b.y+=b.vy*sdt;
        if(b.y<12){ b.y=12; b.vy=Math.abs(b.vy); }
        if(b.y>H-12){ b.y=H-12; b.vy=-Math.abs(b.vy); }
        // left paddle (球向左时)：以"球左缘碰到拍面前沿"触发；y 容差与真实拍面高度(±PH/2)一致，杜绝拍子挡着却漏球/没挡却弹
        if(b.vx<0 && b.x-7.5<=PW+8 && b.x>PW-2 && Math.abs(b.y-this.you.y)<=PH/2 && !letLeft){ bounce(1); }
        // right paddle (球向右时)
        if(b.vx>0 && b.x+7.5>=W-PW-8 && b.x<W-PW+2 && Math.abs(b.y-this.ai.y)<=PH/2 && !letRight){ bounce(-1); }
        // scoring
        if(b.x< -10){ this.aiS++; this.score('ai'); return; }
        else if(b.x> W+10){ this.youS++; this.score('you'); return; }
      }
    }
    score(who){ this.updateUI();
      if(this.youS>=WIN || this.aiS>=WIN){ this.over=true; this.finish(); }
      else setTimeout(()=>{ if(!this.over) this.reset(); }, 700);
    }
    finish(){ if(this.autoPlay) this.stopAuto();
      const win=document.getElementById('overlay-win'), lose=document.getElementById('overlay-lose');
      if(this.youS>this.aiS){ document.getElementById('win-title').textContent='You Win!'; document.getElementById('win-msg').textContent=this.youS+' — '+this.aiS; win.classList.add('active'); }
      else { document.getElementById('lose-msg').textContent=this.youS+' — '+this.aiS; lose.classList.add('active'); }
    }
    loop(now){
      const dt=Math.max(0.3,Math.min(2.2,(now-this.last)/16.67)); this.last=now;
      this.step(dt); this.draw();
      this.raf=requestAnimationFrame(this.loop);
    }
    draw(){
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle='#1c2a4a'; ctx.lineWidth=2; ctx.setLineDash([8,12]);
      ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
      ctx.shadowColor='#4dffd0'; ctx.shadowBlur=12; ctx.fillStyle='#4dffd0';
      ctx.fillRect(4, this.you.y-PH/2, PW, PH);
      ctx.shadowColor='#ff4d6a'; ctx.fillStyle='#ff4d6a'; ctx.fillRect(W-PW-4, this.ai.y-PH/2, PW, PH);
      ctx.shadowColor='#fff'; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(this.ball.x,this.ball.y,8,0,7); ctx.fill(); ctx.shadowBlur=0;
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; document.getElementById('ai-status').textContent='AI controls both paddles'; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    bind(){
      canvas.addEventListener('pointermove',(e)=>{ if(this.autoPlay||this.over) return; const rect=canvas.getBoundingClientRect(); this.targetY=(e.clientY-rect.top)/rect.height*H; });
      canvas.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over) return; const rect=canvas.getBoundingClientRect(); this.targetY=(e.clientY-rect.top)/rect.height*H; });
    }
  }
  window.game=new Pong();
})();
</script>
</body>
</html>
