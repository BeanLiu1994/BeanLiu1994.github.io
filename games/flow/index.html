<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹水流连线 · Flow Free</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0b1024; --text:#e0e0f0; --muted:#8888aa;
    --accent:#4dd0ff; --accent-glow:#4dd0ff66; --danger:#ff5d8a; --gold:#ffd700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg);
    background-image: radial-gradient(ellipse at 30% 20%, #103048 0%, transparent 55%), radial-gradient(ellipse at 70% 80%, #301040 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),#a0e8ff,#4dd0ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 14px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .score-card.cv .value { color:var(--accent); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:auto; border-radius:10px; background:var(--board); cursor:pointer; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#0a0a1aee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; }
  .overlay-content h2 { font-size:1.9rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:14px; font-size:0.9rem; }
  .overlay.win h2 { color:var(--gold); }
  .controls { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:10px 12px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; text-align:center; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#021018; }
  .btn.primary:hover { box-shadow:0 0 20px var(--accent-glow); }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#021018; animation:pg 2s infinite; --glow:var(--accent-glow); }
  @keyframes pg { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:18px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bk .8s infinite; }
  @keyframes bk { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:6px; font-size:0.7rem; color:var(--muted); }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹水流</h1><div class="sub">F L O W &nbsp; F R E E</div></div>
    <div class="score-panel">
      <div class="score-card cv"><div class="label">Filled</div><div class="value" id="score-cv">0%</div></div>
      <div class="score-card"><div class="label">Colors</div><div class="value" id="score-col">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="cv" width="420" height="420"></canvas>
    <div class="overlay win" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2 id="win-title">Solved!</h2><p id="win-msg"></p><button class="btn primary" onclick="game.restart()">New Puzzle</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Puzzle</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI is connecting flows...</span></div>
  <div class="stats-bar"><span id="best-stat">Best: --</span><span>Connect all pairs, fill the board</span></div>
</div>
<script>
(function(){
  'use strict';
  const W=420, H=420, N=7, CS=W/N;
  const canvas=document.getElementById('cv'); const ctx=canvas.getContext('2d');
  const PAL=['#ff5d6a','#4dd0ff','#54e08a','#ffd24d','#b06bff','#ff8c1a','#2ad6c8','#ff5db1','#7ad0ff','#9b59ff','#36c24a','#ff6b3d','#5ad1ff','#e0e04d'];
  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
  const eq=(a,b)=>a&&b&&a.r===b.r&&a.c===b.c;
  const adj=(a,b)=>a&&b&&Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;

  class Flow {
    constructor(){
      this.autoPlay=false; this.last=0; this.raf=null; this.over=false;
      this.best=this.loadBest(); this.active=null; this.cool=0;
      this.autoColor=0; this.autoStep=0;
      this.loop=this.loop.bind(this);
      this.bind(); this.restart();
      this.last=performance.now(); this.raf=requestAnimationFrame(this.loop);
    }
    loadBest(){ try{ return localStorage.getItem('flow_best')||'--'; }catch(e){ return '--'; } }
    saveBest(v){ try{ localStorage.setItem('flow_best', v); }catch(e){} }
    generate(){
      this.cells=Array.from({length:N},()=>Array(N).fill(-1));
      this.routes=[]; this.endpoints=[]; this.draws=[];
      let color=0; let remaining=N*N;
      while(remaining>0){
        // pick start: prefer unassigned cell with an unassigned neighbor
        let starts=[];
        for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(this.cells[r][c]===-1){
          const nb=this.neighbors(r,c).some(n=>this.cells[n.r][n.c]===-1);
          if(nb) starts.push({r,c});
        }
        const s = starts.length? starts[(Math.random()*starts.length)|0] : this.firstUnassigned();
        const path=[s]; this.cells[s.r][s.c]=color; remaining--;
        let cur=s;
        const maxLen=2+((Math.random()*5)|0);
        while(path.length<maxLen){
          const opts=this.neighbors(cur.r,cur.c).filter(n=>this.cells[n.r][n.c]===-1);
          if(opts.length===0) break;
          if(path.length>=2 && Math.random()<0.25) break;
          const nx=opts[(Math.random()*opts.length)|0];
          path.push(nx); this.cells[nx.r][nx.c]=color; cur=nx; remaining--;
        }
        this.routes.push(path.slice());
        this.endpoints.push([path[0], path[path.length-1]]);
        this.draws.push([]);
        color++;
      }
      this.numColors=color;
    }
    firstUnassigned(){ for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(this.cells[r][c]===-1) return {r,c}; return {r:0,c:0}; }
    neighbors(r,c){ const o=[]; if(r>0)o.push({r:r-1,c}); if(r<N-1)o.push({r:r+1,c}); if(c>0)o.push({r,c:c-1}); if(c<N-1)o.push({r,c:c+1}); return o; }
    restart(){
      this.stopAuto(); this.over=false; this.active=null; this.cool=0; this.autoColor=0; this.autoStep=0;
      document.getElementById('overlay-win').classList.remove('active');
      this.generate(); this.updateUI();
    }
    updateUI(){
      let filled=0; for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(this.cells[r][c]>=0 && this.inAnyDraw(r,c)) filled++;
      document.getElementById('score-cv').textContent=Math.round(filled/(N*N)*100)+'%';
      document.getElementById('score-col').textContent=this.numColors;
      document.getElementById('best-stat').textContent='Best: '+this.best;
    }
    inAnyDraw(r,c){ for(const d of this.draws) for(const cell of d) if(cell.r===r&&cell.c===c) return true; return false; }
    occGrid(){ const g=Array.from({length:N},()=>Array(N).fill(-1)); for(let i=0;i<this.draws.length;i++) for(const cell of this.draws[i]) g[cell.r][cell.c]=i; return g; }
    isEndpoint(color, cell){ const e=this.endpoints[color]; return eq(e[0],cell)||eq(e[1],cell); }
    complete(color){ const d=this.draws[color]; if(d.length<2) return false; return this.isEndpoint(color,d[0]) && this.isEndpoint(color,d[d.length-1]) && eq(d[0],this.endpoints[color][0])!==false; }
    solved(){
      let cover=0; for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(this.inAnyDraw(r,c)) cover++;
      if(cover<N*N) return false;
      for(let i=0;i<this.numColors;i++) if(!this.complete(i)) return false;
      return true;
    }
    step(dt){
      if(this.over) return;
      if(this.autoPlay){
        if(this.cool>0){ this.cool--; }
        else {
          // draw next cell of current color route
          const route=this.routes[this.autoColor];
          if(this.autoStep < route.length){ this.draws[this.autoColor] = route.slice(0,this.autoStep+1); this.autoStep++; this.cool=6; }
          else { this.autoColor++; this.autoStep=0; this.cool=6; }
          this.updateUI();
          if(this.autoColor>=this.numColors){ this.over=true; this.finish(); }
        }
      }
    }
    finish(){ if(this.autoPlay) this.stopAuto();
      document.getElementById('win-title').textContent='Solved!';
      document.getElementById('win-msg').textContent=this.numColors+' colors connected';
      document.getElementById('overlay-win').classList.add('active');
      if(this.best==='--') this.saveBest('done');
    }
    loop(now){
      const dt=Math.max(0.3,Math.min(2.2,(now-this.last)/16.67)); this.last=now;
      this.step(dt); this.draw();
      this.raf=requestAnimationFrame(this.loop);
    }
    cellAt(e){ const r=canvas.getBoundingClientRect(); return {r:clamp(((e.clientY-r.top)/r.height*H/CS)|0,0,N-1), c:clamp(((e.clientX-r.left)/r.width*W/CS)|0,0,N-1)}; }
    draw(){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#0b1024'; ctx.fillRect(0,0,W,H);
      // grid
      ctx.strokeStyle='#1a2240'; ctx.lineWidth=1;
      for(let i=0;i<=N;i++){ ctx.beginPath(); ctx.moveTo(i*CS,0); ctx.lineTo(i*CS,H); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*CS); ctx.lineTo(W,i*CS); ctx.stroke(); }
      // drawn paths
      for(let i=0;i<this.draws.length;i++){
        const d=this.draws[i]; if(d.length===0) continue; const col=PAL[i%PAL.length];
        ctx.strokeStyle=col; ctx.lineWidth=CS*0.42; ctx.lineCap='round'; ctx.lineJoin='round';
        ctx.shadowColor=col; ctx.shadowBlur=12;
        ctx.beginPath(); ctx.moveTo(d[0].c*CS+CS/2, d[0].r*CS+CS/2);
        for(let k=1;k<d.length;k++) ctx.lineTo(d[k].c*CS+CS/2, d[k].r*CS+CS/2);
        ctx.stroke(); ctx.shadowBlur=0;
      }
      // endpoints
      for(let i=0;i<this.endpoints.length;i++){ const col=PAL[i%PAL.length]; const e=this.endpoints[i];
        for(const ep of e){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(ep.c*CS+CS/2, ep.r*CS+CS/2, CS*0.26, 0, 7); ctx.fill();
          ctx.fillStyle='#0a0a1a'; ctx.beginPath(); ctx.arc(ep.c*CS+CS/2, ep.r*CS+CS/2, CS*0.1, 0, 7); ctx.fill(); }
      }
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; document.getElementById('ai-status').textContent='AI is connecting flows...'; this.autoColor=0; this.autoStep=0; this.cool=10; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    bind(){
      const down=(e)=>{ if(this.autoPlay||this.over) return; canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId); const cell=this.cellAt(e);
        for(let i=0;i<this.endpoints.length;i++) if(this.isEndpoint(i,cell)){ this.active=i; this.draws[i]=[cell]; this.updateUI(); return; } };
      const move=(e)=>{ if(this.active===null||this.autoPlay||this.over) return; const cell=this.cellAt(e);
        const path=this.draws[this.active]; const last=path[path.length-1]; if(eq(cell,last)) return;
        const prev=path.length>=2?path[path.length-2]:null;
        if(prev&&eq(cell,prev)){ path.pop(); this.updateUI(); return; }
        if(!adj(cell,last)) return;
        const g=this.occGrid(); if(g[cell.r][cell.c]!==-1 && g[cell.r][cell.c]!==this.active) return;
        path.push(cell); this.updateUI();
        if(this.solved()) this.finish(); };
      const up=()=>{ this.active=null; };
      canvas.addEventListener('pointerdown',down);
      canvas.addEventListener('pointermove',move);
      canvas.addEventListener('pointerup',up);
    }
  }
  window.game=new Flow();
})();
</script>
</body>
</html>
