<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a18" />
<title>Missile Defense · Neon</title>
<style>
  :root{
    --bg:#0a0a18; --surface:#12122a; --text:#e7e7f5; --muted:#8888b0;
    --accent:#5ce1ff; --accent-glow:#5ce1ff66; --danger:#ff5d6c; --gold:#ffd76a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);background-image:radial-gradient(ellipse at 50% 0%,#2a103a 0%,transparent 55%),radial-gradient(ellipse at 80% 85%,#102a3a 0%,transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;}
  .container{width:100%;max-width:480px;padding:16px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .title-block h1{font-size:1.8rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#9fe9ff,#5ce1ff,#a98bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:6px 12px;text-align:center;min-width:48px;}
  .score-card .label{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0a;border-radius:14px;padding:10px;box-shadow:0 0 40px #00000040,0 0 70px var(--accent-glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#070712;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;z-index:10;opacity:0;transition:opacity .35s;pointer-events:none;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0a18ee;backdrop-filter:blur(4px);border-radius:14px;}
  .overlay-content{position:relative;text-align:center;z-index:1;}
  .overlay-content h2{font-size:1.8rem;font-weight:800;margin-bottom:6px;}
  .overlay-content p{color:var(--muted);margin-bottom:16px;font-size:.9rem;}
  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:90px;padding:12px 16px;border:1px solid #ffffff12;border-radius:10px;background:var(--surface);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff10;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#06121a;}
  .btn.primary:hover{box-shadow:0 0 20px var(--accent-glow);}
  .btn.auto-on{background:var(--accent);border-color:var(--accent);color:#06121a;animation:pulse-glow 2s infinite;--glow:var(--accent-glow);}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--glow,transparent);}50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);}}
  .ai-indicator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.75rem;color:var(--muted);justify-content:center;min-height:20px;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
  .hint{margin-top:8px;text-align:center;font-size:.7rem;color:var(--muted);}
  @media(max-width:400px){.title-block h1{font-size:1.4rem;}.btn{padding:10px 12px;font-size:.78rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Missile Defense</h1><div class="sub">导 弹 防 御 · N E O N</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="440" height="352"></canvas>
    <div class="overlay" id="overlay-end"><div class="overlay-bg"></div><div class="overlay-content"><h2>Cities Lost</h2><p id="end-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI defending…</span></div>
  <div class="hint">Tap to fire an interceptor from the nearest base. Protect your cities!</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  function fitCanvas(){ const w=canvas.clientWidth||440; const dpr=window.devicePixelRatio||1; canvas.width=w*dpr; canvas.height=w*0.8*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); return w; }
  const lerp=(a,b,t)=>a+(b-a)*t;
  class Missile{
    constructor(){ this.best=parseInt(localStorage.getItem('bestMissile')||'0'); this.autoPlay=false; this.bindInput(); this.restart(); this._tick=this.tick.bind(this); requestAnimationFrame(this._tick); }
    restart(){ this.stopAuto(); this.size=fitCanvas(); this.W=this.size; this.H=this.size*0.8; this.score=0; this.over=false;
      this.cities=[0.22,0.32,0.42,0.58,0.68,0.78].map(x=>({x:this.W*x,y:this.H-14,alive:true}));
      this.bases=[0.12,0.5,0.88].map(x=>({x:this.W*x,y:this.H-10,alive:true,cd:0}));
      this.incoming=[]; this.shots=[]; this.explos=[]; this.spawnT=0; this.rate=1.6; this.elapsed=0; this.autoAccum=0; this.hideOverlay(); this.updateUI(); }
    hideOverlay(){ document.getElementById('overlay-end').classList.remove('active'); }
    updateUI(){ document.getElementById('score').textContent=this.score; document.getElementById('best').textContent=this.best; }
    aliveCities(){ return this.cities.filter(c=>c.alive); }
    spawnIncoming(){ const targets=this.aliveCities().concat(this.bases.filter(b=>b.alive)); if(!targets.length) return; const t=targets[(Math.random()*targets.length)|0]; const sx=Math.random()*this.W; const sy=-6; const sp=this.H*(0.10+Math.random()*0.08); const dx=t.x-sx, dy=t.y-sy; const d=Math.hypot(dx,dy); this.incoming.push({x:sx,y:sy,vx:dx/d*sp,vy:dy/d*sp,alive:true}); }
    fire(bx,by,tx,ty){ const sp=this.H*0.9; const dx=tx-bx, dy=ty-by; const d=Math.hypot(dx,dy)||1; this.shots.push({x:bx,y:by,vx:dx/d*sp,vy:dy/d*sp,tx,ty,alive:true}); }
    nearestBase(x){ let best=null,bd=1e9; for(const b of this.bases){ if(!b.alive) continue; const d=Math.abs(b.x-x); if(d<bd){bd=d;best=b;} } return best; }
    playerFire(tx,ty){ if(this.over) return; const b=this.nearestBase(tx); if(b&&b.cd<=0){ b.cd=0.35; this.fire(b.x,b.y,tx,ty); } }
    aimAuto(){ if(this.over) return; const alive=this.incoming.filter(m=>m.alive).sort((a,b)=>b.y-a.y); if(!alive.length) return; // most urgent = closest to bottom
      for(const b of this.bases){ if(!b.alive||b.cd>0) continue; // find a missile this base can best intercept (closest)
        let target=null,bd=1e9; for(const m of alive){ const d=Math.abs(m.x-b.x)+Math.abs(m.y-b.y); if(d<bd){bd=d;target=m;} }
        if(target){ const tt=Math.hypot(target.x-b.x,target.y-b.y)/(this.H*0.9); const px=target.x+target.vx*tt, py=target.y+target.vy*tt; b.cd=0.3; this.fire(b.x,b.y,px,py); }
      }
    }
    explode(x,y){ this.explos.push({x,y,r:2,max:34,t:0}); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    tick(ts){ const dt=Math.min(50,(ts!==undefined)?((ts-(this._last||ts))):16)/1000; this._last=ts; this.update(dt); this.render(); requestAnimationFrame(this._tick); }
    update(dt){
      this.elapsed+=dt; this.rate=Math.max(0.5,1.6-this.elapsed*0.01);
      this.spawnT-=dt; if(this.spawnT<=0 && !this.over){ this.spawnT=this.rate*(0.7+Math.random()*0.6); this.spawnIncoming(); }
      for(const b of this.bases) if(b.cd>0) b.cd-=dt;
      for(const m of this.incoming){ if(!m.alive) continue; m.x+=m.vx*dt; m.y+=m.vy*dt; if(m.y>=this.H-14){ // hit ground
          m.alive=false; this.destroyAt(m.x); } }
      for(const s of this.shots){ if(!s.alive) continue; s.x+=s.vx*dt; s.y+=s.vy*dt; if(Math.hypot(s.x-s.tx,s.y-s.ty)<6 || s.y<-10){ s.alive=false; this.explode(s.tx,s.ty>=0?s.ty:s.y); } }
      for(const e of this.explos){ e.t+=dt; e.r=lerp(e.r,e.max,1-Math.pow(0.002,e.t*4)); }
      // explosions destroy incoming
      for(const e of this.explos){ for(const m of this.incoming){ if(m.alive && Math.hypot(m.x-e.x,m.y-e.y)<e.r){ m.alive=false; this.score+=10; if(this.score>this.best){this.best=this.score;localStorage.setItem('bestMissile',this.best);} this.updateUI(); } } }
      this.incoming=this.incoming.filter(m=>m.alive||m.y<this.H); this.incoming=this.incoming.filter(m=>m.alive);
      this.shots=this.shots.filter(s=>s.alive); this.explos=this.explos.filter(e=>e.t<0.8);
      if(this.aliveCities().length===0 && !this.over){ this.over=true; this.stopAuto(); document.getElementById('end-msg').textContent='Final score: '+this.score; document.getElementById('overlay-end').classList.add('active'); }
      if(this.autoPlay&&!this.over){ this.autoAccum+=dt; if(this.autoAccum>=0.2){ this.autoAccum=0; this.aimAuto(); } }
    }
    destroyAt(x){ for(const c of this.cities){ if(c.alive && Math.abs(c.x-x)<14){ c.alive=false; this.explode(c.x,c.y); } } for(const b of this.bases){ if(b.alive && Math.abs(b.x-x)<14){ b.alive=false; this.explode(b.x,b.y); } } }
    bindInput(){ const wrap=document.getElementById('board-wrap'); wrap.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over) return; const rect=canvas.getBoundingClientRect(); const x=e.clientX-rect.left, y=e.clientY-rect.top; e.preventDefault(); this.playerFire(x,y); }); window.addEventListener('resize',()=>{ this.size=fitCanvas(); this.W=this.size; this.H=this.size*0.8; }); }
    render(){ const W=this.W,H=this.H; ctx.clearRect(0,0,W,H);
      ctx.strokeStyle='#1a1a30'; ctx.lineWidth=1; for(let i=1;i<10;i++){ ctx.beginPath(); ctx.moveTo(0,i*H/10); ctx.lineTo(W,i*H/10); ctx.stroke(); }
      for(const c of this.cities){ if(!c.alive) continue; ctx.save(); ctx.shadowColor='#5ce1ff'; ctx.shadowBlur=10; ctx.fillStyle='#5ce1ff'; ctx.fillRect(c.x-7,c.y-12,14,12); ctx.fillRect(c.x-10,c.y,20,4); ctx.restore(); }
      for(const b of this.bases){ if(!b.alive) continue; ctx.save(); ctx.shadowColor='#7cff9b'; ctx.shadowBlur=10; ctx.fillStyle='#7cff9b'; ctx.beginPath(); ctx.moveTo(b.x-12,b.y+6); ctx.lineTo(b.x,b.y-12); ctx.lineTo(b.x+12,b.y+6); ctx.closePath(); ctx.fill(); ctx.restore(); }
      // incoming
      for(const m of this.incoming){ if(!m.alive) continue; ctx.strokeStyle='#ff5d6c'; ctx.lineWidth=2; ctx.shadowColor='#ff5d6c'; ctx.shadowBlur=8; ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(m.x-m.vx*0.06,m.y-m.vy*0.06); ctx.stroke(); ctx.fillStyle='#ffd76a'; ctx.beginPath(); ctx.arc(m.x,m.y,2.5,0,Math.PI*2); ctx.fill(); }
      // shots
      for(const s of this.shots){ if(!s.alive) continue; ctx.strokeStyle='#aef0ff'; ctx.lineWidth=2; ctx.shadowColor='#aef0ff'; ctx.shadowBlur=8; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*0.04,s.y-s.vy*0.04); ctx.stroke(); }
      // explosions
      for(const e of this.explos){ const a=Math.max(0,1-e.t/0.8); ctx.save(); ctx.globalAlpha=a; ctx.shadowColor='#ffd76a'; ctx.shadowBlur=24; ctx.strokeStyle='#ffe9a0'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.stroke(); ctx.fillStyle='rgba(255,180,90,'+(a*0.3)+')'; ctx.fill(); ctx.restore(); }
    }
  }
  window.game=new Missile();
})();
</script>
</body>
</html>
