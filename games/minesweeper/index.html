<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a1a" />
<title>Minesweeper · Neon</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#16163a; --text:#e0e0f0; --muted:#8888aa;
    --accent:#4d9dff; --accent-glow:#4d9dff66; --danger:#ff4d6a; --gold:#ffd700; --success:#4dff91; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg);
    background-image: radial-gradient(ellipse at 20% 20%, #102038 0%, transparent 55%), radial-gradient(ellipse at 80% 80%, #201040 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:16px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:12px; }
  .title-block h1 { font-size:1.85rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),#9ed0ff,#4d9dff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:6px 12px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.54rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.15rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  .grid { display:grid; gap:3px; }
  .cell { aspect-ratio:1; border-radius:6px; background:var(--board); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1rem; cursor:pointer; transition:background .12s, transform .08s; }
  .cell:active { transform:scale(0.94); }
  .cell.hidden { background:linear-gradient(145deg,#1e1e44,#16163a); }
  .cell.revealed { background:#0e0e22; box-shadow:inset 0 0 0 1px #ffffff08; }
  .cell.flag { color:var(--danger); }
  .cell.mine { background:var(--danger); color:#fff; box-shadow:0 0 14px var(--danger); }
  .c1{color:#4d9dff} .c2{color:#4dff91} .c3{color:#ffd700} .c4{color:#ff4d6a} .c5{color:#b388ff} .c6{color:#4dffd1} .c7{color:#ff9f4d} .c8{color:#ff9f4d}
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#0a0a1aee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; }
  .overlay-content h2 { font-size:2rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:16px; font-size:0.9rem; }
  .overlay.win h2 { color:var(--gold); } .overlay.lose h2 { color:var(--danger); }
  .controls { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:11px 14px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.82rem; font-weight:600; cursor:pointer; transition:all .2s; letter-spacing:.5px; text-align:center; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { box-shadow:0 0 20px var(--accent-glow); }
  .btn.flag-on { background:var(--danger); border-color:var(--danger); color:#fff; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#fff; animation:pulse-glow 2s infinite; --glow:var(--accent-glow); }
  @keyframes pulse-glow { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:20px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:blink .8s infinite; }
  @keyframes blink { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:8px; font-size:0.7rem; color:var(--muted); }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
  @media (max-width:400px){ .title-block h1{font-size:1.4rem;} .btn{padding:10px 10px; font-size:.76rem;} }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Mines</h1><div class="sub">N E O N &nbsp; S W E E P E R</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Mines</div><div class="value" id="mines">10</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>

  <div class="board-wrap" id="board-wrap">
    <div class="grid" id="grid"></div>
    <div class="overlay win" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2>Clear!</h2><p id="win-msg">All safe</p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
    <div class="overlay lose" id="overlay-lose"><div class="overlay-bg"></div><div class="overlay-content"><h2>Boom!</h2><p>You hit a mine</p><button class="btn primary" onclick="game.restart()">Try Again</button></div></div>
  </div>

  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-flag" onclick="game.toggleFlag()">🚩 Flag</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>

  <div class="ai-indicator" id="ai-indicator" style="display:none">
    <div class="ai-dot"></div><span id="ai-status">AI solving...</span>
  </div>

  <div class="stats-bar">
    <span id="revealed-stat">Revealed: 0</span>
    <span id="safety-stat">Safe: 100%</span>
  </div>
</div>

<script>
(function(){
  'use strict';
  const N=9, MINES=10;
  class Mine{
    constructor(){
      this.best=parseInt(localStorage.getItem('bestMine')||'0');
      this.autoPlay=false; this.autoTimer=null;
      this.flagMode=false;
      this.buildGrid();
      this.restart();
    }
    buildGrid(){
      const g=document.getElementById('grid'); g.innerHTML='';
      g.style.gridTemplateColumns=`repeat(${N},1fr)`;
      this.cells=[];
      for(let i=0;i<N*N;i++){
        const d=document.createElement('div'); d.className='cell hidden';
        d.dataset.i=i; g.appendChild(d); this.cells.push(d);
      }
    }
    restart(){
      this.stopAuto();
      this.board=Array.from({length:N},()=>Array(N).fill(0));
      this.revealed=Array.from({length:N},()=>Array(N).fill(false));
      this.flagged=Array.from({length:N},()=>Array(N).fill(false));
      this.minesSet=false; this.over=false; this.won=false;
      this.revealedCount=0;
      this.flagMode=false; document.getElementById('btn-flag').classList.remove('flag-on');
      document.getElementById('overlay-win').classList.remove('active');
      document.getElementById('overlay-lose').classList.remove('active');
      this.cells.forEach(c=>{ c.className='cell hidden'; c.textContent=''; });
      document.getElementById('mines').textContent=MINES;
      this.updateUI();
      this.bindInput();
    }
    idx(x,y){ return y*N+x; }
    neighbors(x,y){ const r=[]; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if(dx===0&&dy===0) continue; const nx=x+dx, ny=y+dy; if(nx>=0&&nx<N&&ny>=0&&ny<N) r.push([nx,ny]); } return r; }
    placeMines(sx,sy){
      const blocked=new Set([this.idx(sx,sy), ...this.neighbors(sx,sy).map(([x,y])=>this.idx(x,y))]);
      const all=[]; for(let i=0;i<N*N;i++) if(!blocked.has(i)) all.push(i);
      for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
      for(let k=0;k<MINES;k++){ const i=all[k]; this.board[Math.floor(i/N)][i%N]=1; }
      for(let y=0;y<N;y++) for(let x=0;x<N;x++){ if(this.board[y][x]===1) continue; let c=0; this.neighbors(x,y).forEach(([nx,ny])=>{ if(this.board[ny][nx]===1) c++; }); this.board[y][x]=-c; }
      this.minesSet=true;
    }
    reveal(x,y){
      if(this.over||this.won) return;
      if(!this.minesSet) this.placeMines(x,y);
      if(this.revealed[y][x]||this.flagged[y][x]) return;
      this.flood(x,y);
      this.checkWin();
      this.updateUI();
    }
    flood(x,y){
      const stack=[[x,y]];
      while(stack.length){
        const [cx,cy]=stack.pop();
        if(cx<0||cx>=N||cy<0||cy>=N) continue;
        if(this.revealed[cy][cx]||this.flagged[cy][cx]) continue;
        if(this.board[cy][cx]===1){ this.explode(cx,cy); return; }
        this.revealed[cy][cx]=true; this.revealedCount++;
        this.renderCell(cx,cy);
        if(this.board[cy][cx]===0){ this.neighbors(cx,cy).forEach(([nx,ny])=>{ if(!this.revealed[ny][nx]&&this.board[ny][nx]!==1) stack.push([nx,ny]); }); }
      }
    }
    explode(x,y){
      this.over=true;
      for(let yy=0;yy<N;yy++) for(let xx=0;xx<N;xx++){ if(this.board[yy][xx]===1){ this.revealed[yy][xx]=true; this.renderCell(xx,yy,true); } }
      this.cells[this.idx(x,y)].classList.add('mine');
      if(this.autoPlay) this.stopAuto();
      document.getElementById('overlay-lose').classList.add('active');
    }
    toggleFlag(x,y){
      if(this.over||this.won||this.revealed[y][x]) return;
      this.flagged[y][x]=!this.flagged[y][x];
      this.renderCell(x,y);
      this.updateUI();
    }
    checkWin(){
      if(this.revealedCount===N*N-MINES){ this.won=true; const sc=this.best+1; if(sc>this.best){ this.best=sc; localStorage.setItem('bestMine',this.best); }
        if(this.autoPlay) this.stopAuto();
        document.getElementById('win-msg').textContent='Solved with '+this.best+' wins';
        document.getElementById('overlay-win').classList.add('active'); }
    }
    renderCell(x,y,isMine){
      const c=this.cells[this.idx(x,y)];
      if(isMine){ c.className='cell mine'; c.textContent='💣'; return; }
      if(this.revealed[y][x]){
        c.className='cell revealed';
        const v=this.board[y][x];
        if(v<0 && v!==0){ c.textContent=(-v); c.classList.add('c'+(-v)); }
        else c.textContent='';
      } else if(this.flagged[y][x]){ c.className='cell hidden flag'; c.textContent='🚩'; }
      else { c.className='cell hidden'; c.textContent=''; }
    }
    updateUI(){
      let flags=0; this.flagged.forEach(r=>r.forEach(f=>{ if(f) flags++; }));
      document.getElementById('mines').textContent=MINES-flags;
      document.getElementById('best').textContent=this.best;
      document.getElementById('revealed-stat').textContent='Revealed: '+this.revealedCount+'/'+(N*N-MINES);
      const safe=this.revealedCount/(N*N-MINES)*100;
      document.getElementById('safety-stat').textContent='Safe: '+safe.toFixed(0)+'%';
    }

    // ---- AI solver ----
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over||this.won) this.restart(); this.startAuto(); } }
    startAuto(){
      this.autoPlay=true; const b=document.getElementById('btn-auto');
      b.textContent='Auto: ON'; b.classList.add('auto-on');
      document.getElementById('ai-indicator').style.display='flex';
      this.autoStep();
    }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){ clearTimeout(this.autoTimer); this.autoTimer=null; }
      const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on');
      document.getElementById('ai-indicator').style.display='none'; }
    autoStep(){
      if(!this.autoPlay||this.over||this.won){ if(this.over||this.won) this.stopAuto(); return; }
      const progressed=this.solveStep();
      if(this.won||this.over){ this.stopAuto(); return; }
      if(!progressed){
        // guess: pick a hidden cell adjacent to most numbers (low risk)
        const hidden=[];
        for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(!this.revealed[y][x]&&!this.flagged[y][x]) hidden.push([x,y]);
        if(hidden.length===0){ this.stopAuto(); return; }
        let best=hidden[0], bestN=-1;
        hidden.forEach(([x,y])=>{ let n=0; this.neighbors(x,y).forEach(([nx,ny])=>{ if(this.revealed[ny][nx]) n++; }); if(n>bestN){ bestN=n; best=[x,y]; } });
        this.reveal(best[0],best[1]);
        if(this.over){ this.stopAuto(); return; }
      }
      document.getElementById('ai-status').textContent='AI: revealed '+this.revealedCount;
      this.autoTimer=setTimeout(()=>this.autoStep(), 90);
    }
    solveStep(){
      let changed=false;
      for(let y=0;y<N;y++) for(let x=0;x<N;x++){
        if(!this.revealed[y][x]||this.board[y][x]>=0) continue;
        const n=-this.board[y][x];
        const nb=this.neighbors(x,y);
        let flagged=0; const hidden=[];
        nb.forEach(([nx,ny])=>{ if(this.flagged[ny][nx]) flagged++; else if(!this.revealed[ny][nx]) hidden.push([nx,ny]); });
        if(flagged===n && hidden.length>0){
          hidden.forEach(([hx,hy])=>{ if(!this.flagged[hy][hx]&&!this.revealed[hy][hx]){ this.flood(hx,hy); changed=true; } });
        } else if(hidden.length>0 && hidden.length===n-flagged){
          hidden.forEach(([hx,hy])=>{ if(!this.flagged[hy][hx]){ this.flagged[hy][hx]=true; this.renderCell(hx,hy); changed=true; } });
        }
      }
      if(changed) this.checkWin();
      return changed;
    }

    toggleFlag(){ this.flagMode=!this.flagMode; document.getElementById('btn-flag').classList.toggle('flag-on',this.flagMode); }
    bindInput(){
      if(this._bound) return; this._bound=true;
      const grid=document.getElementById('grid');
      grid.addEventListener('pointerdown',(e)=>{
        const t=e.target.closest('.cell'); if(!t) return;
        e.preventDefault();
        const i=+t.dataset.i, x=i%N, y=Math.floor(i/N);
        if(this.autoPlay||this.over||this.won) return;
        if(this.flagMode || e.button===2) this.toggleFlag(x,y);
        else this.reveal(x,y);
      });
      grid.addEventListener('contextmenu',(e)=>e.preventDefault());
    }
  }
  window.game=new Mine();
})();
</script>
</body>
</html>
