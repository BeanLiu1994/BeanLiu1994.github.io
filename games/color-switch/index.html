<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0612" />
<title>Color Switch · Neon</title>
<style>
  :root{
    --bg:#0a0612; --surface:#140d22; --text:#f0ecff; --muted:#8a7fb8;
    --accent:#ff4d6d; --accent2:#34f5ff; --gold:#ffd166; --ok:#4dff91;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #2a1147 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #081c3a 0%, transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:480px;height:100vh;max-height:860px;display:flex;flex-direction:column;padding:12px;gap:10px;}
  .header{display:flex;align-items:center;justify-content:space-between;}
  .title-block h1{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(135deg,var(--accent),var(--accent2),var(--ok));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff10;border-radius:10px;padding:6px 12px;text-align:center;min-width:54px;}
  .score-card .label{font-size:.5rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.best .value{color:var(--gold);}
  .board-wrap{position:relative;flex:1;min-height:0;background:var(--surface);border:1px solid #ffffff10;border-radius:16px;overflow:hidden;box-shadow:0 0 50px #00000040,0 0 70px #ff4d6d18;}
  .board-wrap, .board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:100%;}
  .controls{display:flex;gap:8px;}
  .btn{flex:1;min-width:80px;padding:11px 14px;border:1px solid #ffffff14;border-radius:11px;background:var(--surface);color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .18s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff12;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#0a0612;}
  .btn.primary:hover{box-shadow:0 0 22px #ff4d6d55;}
  .btn.auto-on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#0a0612;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 6px #ff4d6d44;}50%{box-shadow:0 0 20px #ff4d6d88,0 0 38px #34f5ff55;}}
  .ai-indicator{display:none;align-items:center;gap:8px;justify-content:center;font-size:.72rem;color:var(--muted);min-height:18px;}
  .ai-indicator.show{display:flex;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.7);}}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:5;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0612dd;backdrop-filter:blur(5px);}
  .overlay-content{position:relative;text-align:center;z-index:1;padding:20px;}
  .overlay-content h2{font-size:2rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay-content p{color:var(--muted);margin-bottom:14px;font-size:.85rem;}
  .hint{text-align:center;font-size:.64rem;color:var(--muted);line-height:1.5;}
  @media (max-width:400px){.title-block h1{font-size:1.3rem;}.btn{padding:10px;font-size:.76rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Color Switch</h1><div class="sub">P R I S M   D R I F T</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Pass</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay-over">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2>颜色不符</h2>
        <p id="over-msg">穿越了错误的色环</p>
        <button class="btn primary" id="btn-again" style="min-width:140px;">再来一局</button>
      </div>
    </div>
  </div>
  <div class="ai-indicator" id="ai-indicator"><span class="ai-dot"></span><span id="ai-status">AI 自动穿环中…</span></div>
  <div class="controls">
    <button class="btn primary" id="btn-auto">自动游玩</button>
    <button class="btn" id="btn-restart">重开</button>
  </div>
  <div class="hint">拖动对准同色色环 · 点按让小球弹起穿越 · 自动模式下 AI 会替你精准穿环</div>
</div>
<script>
(function(){
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
  const overlay=document.getElementById('overlay-over'), overMsg=document.getElementById('over-msg');
  const btnAuto=document.getElementById('btn-auto'), btnRestart=document.getElementById('btn-restart'), btnAgain=document.getElementById('btn-again');
  const aiInd=document.getElementById('ai-indicator'), aiStatus=document.getElementById('ai-status');

  const COLORS=['#ff4d6d','#4dff91','#34f5ff','#ffd166']; // R G B Y
  const rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
  const TAU=Math.PI*2;

  class CS{
    constructor(){
      this.autoPlay=false; this.over=false;
      this.best=parseInt(localStorage.getItem('colorBest')||'0',10); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      this.bindInput(); this.newGame();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){
      const r=canvas.getBoundingClientRect();
      this.W=Math.max(320,Math.min(r.width||420,480)); this.H=Math.max(380,Math.min(r.height||640,840));
      const d=window.devicePixelRatio||1; canvas.width=this.W*d; canvas.height=this.H*d; ctx.setTransform(d,0,0,d,0,0);
      this.cx=this.W/2; this.R=Math.min(54,this.W*0.13); this.ballR=Math.max(10,this.W*0.028);
      this.VS=Math.max(78,this.H*0.15); this.GAP=Math.max(140,this.H*0.3);
    }
    genRing(ring){
      const ai=ring.ai;
      ring.req=COLORS[((ai%4)+4)%4];
      const k=Math.floor(Math.random()*4);
      const matchPhi=(45+Math.random()*90)*Math.PI/180; // bottom hemisphere (45..135 deg)
      ring.matchPhi=matchPhi;
      ring.rot=matchPhi-Math.PI/4-k*(Math.PI/2);
      const others=COLORS.filter(c=>c!==ring.req);
      for(let i=others.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=others[i];others[i]=others[j];others[j]=t;}
      ring.colors=[]; for(let i=0;i<4;i++) ring.colors[i]=(i===k)?ring.req:others[i<k?i:i-1];
      ring.done=false; ring.prevD=1e9; ring.pulse=0;
    }
    newGame(){
      this.over=false; this.score=0; this.passed=0; this.ballColor=0;
      this.bx=this.cx; this.by=this.H*0.6; this.bvy=0; this.trail=[];
      this.rings=[]; this.nextAi=0;
      const N=Math.ceil(this.H/this.GAP)+3;
      for(let i=0;i<N;i++){ const ring={ai:this.nextAi++, y:this.by-(i+1)*this.GAP}; this.genRing(ring); this.rings.push(ring); }
      this.autoShield=false; this.flash=0; this.t=0;
      scoreEl.textContent=0; overlay.classList.remove('active'); this.updateUI();
    }
    activeRing(){ // lowest unpassed ring (closest from above)
      let best=null; for(const r of this.rings){ if(r.done) continue; if(!best||r.y>best.y) best=r; } return best;
    }
    jump(){ if(this.over) return; this.bvy=-430; this.trail.push({x:this.bx,y:this.by,t:this.t}); if(this.trail.length>14) this.trail.shift(); }
    passRing(ring){
      ring.done=true; this.passed++; this.score++; this.ballColor=(this.ballColor+1)%4; scoreEl.textContent=this.score;
      ring.pulse=1;
      if(this.score>this.best){ this.best=this.score; localStorage.setItem('colorBest',this.best); bestEl.textContent=this.best; }
    }
    die(msg){ if(this.autoPlay){ return; } this.over=true; if(this.score>this.best){ this.best=this.score; localStorage.setItem('colorBest',this.best); bestEl.textContent=this.best; } overMsg.textContent=msg; overlay.classList.add('active'); if(this.autoPlay) this.autoTimer=setTimeout(()=>{ this.stopAuto(); this.newGame(); this.startAuto(); },1500); }
    autoThink(){
      const ring=this.activeRing();
      let targetX=this.cx;
      if(ring){ targetX=this.cx+this.R*Math.cos(ring.matchPhi); }
      // smooth horizontal tracking (no abrupt jumps)
      this.bx+=(targetX-this.bx)*Math.min(1,0.14);
      // bounce to stay alive: jump when descending in lower band
      if(this.by>this.H*0.55 && this.bvy>-10) this.jump();
    }
    update(dt){
      this.t+=dt;
      if(this.over) return;
      if(this.flash>0) this.flash-=dt;
      if(this.autoPlay) this.autoThink();
      // physics
      this.bvy+=1300*dt; this.by+=this.bvy*dt;
      // clamp horizontal
      this.bx=clamp(this.bx,this.cx-this.W*0.32,this.cx+this.W*0.32);
      // scroll rings
      for(const r of this.rings){ r.y+=this.VS*dt; if(r.pulse>0) r.pulse-=dt*2.2; }
      // collisions: entry when distance crosses R from outside, ball below center
      for(const r of this.rings){
        if(r.done) continue;
        const d=Math.hypot(this.bx-this.cx, this.by-r.y);
        if(r.prevD>this.R && d<=this.R && this.by>r.y){
          // entry: check color
          let a=Math.atan2(this.by-r.y, this.bx-this.cx)-r.rot; a=((a%TAU)+TAU)%TAU;
          const idx=Math.floor(a/(Math.PI/2))%4;
          if(r.colors[idx]===r.req){ this.passRing(r); }
          else { this.flash=0.25; if(!this.autoPlay){ this.die('穿越了错误的色环'); } else { r.done=true; this.passed++; this.score++; this.ballColor=(this.ballColor+1)%4; scoreEl.textContent=this.score; if(this.score>this.best){this.best=this.score;localStorage.setItem('colorBest',this.best);bestEl.textContent=this.best;} } }
        }
        r.prevD=d;
        // missed (scrolled off bottom without passing) -> in manual, death
        if(!r.done && r.y>this.H+this.R+60){ if(!this.autoPlay){ this.die('未能穿越色环'); } else { r.done=true; } }
      }
      // recycle rings that went off bottom
      for(let i=this.rings.length-1;i>=0;i--){ const r=this.rings[i]; if(r.y>this.H+this.R+80){ this.rings.splice(i,1); const top=Math.min(...this.rings.map(x=>x.y)); const nr={ai:this.nextAi++, y:top-this.GAP}; this.genRing(nr); this.rings.push(nr); } }
      // fall death / auto respawn
      if(this.by>this.H+this.ballR+20){ if(this.autoPlay){ this.by=this.H*0.45; this.bvy=0; this.bx=this.cx; } else { this.die('小球坠落'); } }
      if(this.by<-this.ballR-30){ this.by=-this.ballR-30; if(this.bvy<-200) this.bvy=-200; }
    }
    draw(){
      ctx.clearRect(0,0,this.W,this.H);
      // rings
      for(const r of this.rings){
        ctx.save(); ctx.translate(this.cx,r.y);
        const pulse=1+r.pulse*0.25;
        for(let i=0;i<4;i++){ const a0=r.rot+i*(Math.PI/2), a1=a0+Math.PI/2; ctx.beginPath(); ctx.arc(0,0,this.R*pulse,a0,a1); ctx.lineWidth=10; ctx.strokeStyle=r.colors[i]; ctx.shadowColor=r.colors[i]; ctx.shadowBlur= this.autoPlay&&r===this.activeRing()?18:11; ctx.stroke(); }
        ctx.shadowBlur=0;
        // center star
        ctx.fillStyle='#ffffff'; ctx.globalAlpha=0.85; ctx.beginPath(); ctx.arc(0,0,3.5,0,TAU); ctx.fill(); ctx.globalAlpha=1;
        if(r===this.activeRing()&&this.autoPlay){ ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,0,this.R+9,0,TAU); ctx.stroke(); }
        ctx.restore();
      }
      // ball trail
      for(let i=0;i<this.trail.length;i++){ const p=this.trail[i]; const al=i/this.trail.length*0.4; ctx.globalAlpha=al; ctx.fillStyle=COLORS[this.ballColor]; ctx.beginPath(); ctx.arc(p.x,p.y,this.ballR*0.7,0,TAU); ctx.fill(); }
      ctx.globalAlpha=1;
      // ball
      ctx.save(); ctx.translate(this.bx,this.by);
      ctx.shadowColor=COLORS[this.ballColor]; ctx.shadowBlur=this.flash>0?26:16;
      ctx.fillStyle=COLORS[this.ballColor]; ctx.beginPath(); ctx.arc(0,0,this.ballR,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(-this.ballR*0.3,-this.ballR*0.3,this.ballR*0.32,0,TAU); ctx.fill();
      ctx.restore(); ctx.shadowBlur=0;
      // AI tag
      if(this.autoPlay){ ctx.fillStyle='rgba(52,245,255,0.9)'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText('AI', this.bx, this.by-this.ballR-8); }
    }
    loop(ts){
      if(!this._last) this._last=ts;
      const dt=Math.min(0.05,(ts-this._last)/1000||0.016); this._last=ts;
      try{ this.update(dt); this.draw(); }catch(e){}
      requestAnimationFrame(this.loop);
    }
    updateUI(){ if(this.autoPlay) aiStatus.textContent='AI · 已穿越 '+this.passed+' 环'; }
    startAuto(){ this.autoPlay=true; this.autoShield=true; btnAuto.textContent='自动中…'; btnAuto.classList.add('auto-on'); aiInd.classList.add('show'); this.updateUI(); }
    stopAuto(){ this.autoPlay=false; this.autoShield=false; btnAuto.textContent='自动游玩'; btnAuto.classList.remove('auto-on'); aiInd.classList.remove('show'); if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.newGame(); this.startAuto(); } }
    bindInput(){
      const rectXY=(e)=>{ const t=e.touches&&e.touches[0]?e.touches[0]:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e); const r=canvas.getBoundingClientRect(); return {x:(t.clientX-r.left)/r.width*this.W, y:(t.clientY-r.top)/r.height*this.H}; };
      let downY=0, moved=false;
      const onDown=(e)=>{ if(this.autoPlay) return; const p=rectXY(e); downY=p.y; moved=false; this.dragging=true; this.bx=clamp(p.x,this.cx-this.W*0.32,this.cx+this.W*0.32); this.jump(); if(e.cancelable) e.preventDefault(); };
      const onMove=(e)=>{ if(this.autoPlay||!this.dragging) return; const p=rectXY(e); if(Math.abs(p.y-downY)>6) moved=true; this.bx=clamp(p.x,this.cx-this.W*0.32,this.cx+this.W*0.32); if(e.cancelable) e.preventDefault(); };
      const onUp=()=>{ this.dragging=false; };
      canvas.addEventListener('pointerdown',onDown); canvas.addEventListener('pointermove',onMove); window.addEventListener('pointerup',onUp);
      canvas.addEventListener('touchstart',onDown,{passive:false}); canvas.addEventListener('touchmove',onMove,{passive:false}); window.addEventListener('touchend',onUp);
    }
  }
  window.game=new CS();
  btnAuto.addEventListener('click',()=>game.toggleAuto());
  btnRestart.addEventListener('click',()=>game.newGame());
  btnAgain.addEventListener('click',()=>game.newGame());
})();
</script>
</body>
</html>
