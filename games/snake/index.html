<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a1a" />
<title>Snake · Neon</title>
<style>
  :root {
    --bg: #0a0a1a;
    --surface: #12122a;
    --board: #16163a;
    --text: #e0e0f0;
    --muted: #8888aa;
    --accent: #4dff91;
    --accent-glow: #4dff9166;
    --danger: #ff4d6a;
    --gold: #ffd700;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 20%, #103020 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, #102038 0%, transparent 55%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
  }
  .container { width: 100%; max-width: 460px; padding: 16px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:12px; }
  .title-block h1 {
    font-size: 1.9rem; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent), #b6ffce, #4dff91);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height:1;
  }
  .title-block .sub { font-size:0.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:6px 14px; text-align:center; min-width:58px; }
  .score-card .label { font-size:0.58rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.2rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap {
    position: relative; background: var(--surface); border:1px solid #ffffff0a;
    border-radius:14px; padding:10px; box-shadow: 0 0 40px #00000030, 0 0 70px var(--accent-glow);
  }
  .board-wrap, .board-wrap * { touch-action: none; -webkit-touch-callout: none; }
  canvas { display:block; width:100%; height:auto; border-radius:10px; background: var(--board); }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#0a0a1aee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; }
  .overlay-content h2 { font-size:2rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:16px; font-size:0.9rem; }
  .overlay.lose h2 { color:var(--danger); }
  .controls { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .btn { flex:1; min-width:90px; padding:12px 16px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:600; cursor:pointer; transition:all .2s; letter-spacing:.5px; text-align:center; }
  .btn:hover { background:#ffffff10; }
  .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#0a0a1a; }
  .btn.primary:hover { box-shadow:0 0 20px var(--accent-glow); }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#0a0a1a; animation:pulse-glow 2s infinite; --glow:var(--accent-glow); }
  @keyframes pulse-glow { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:20px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:blink .8s infinite; }
  @keyframes blink { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:8px; font-size:0.7rem; color:var(--muted); }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
  @media (max-width:400px){ .title-block h1{font-size:1.4rem;} .btn{padding:10px 12px; font-size:.78rem;} }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>Snake</h1>
      <div class="sub">N E O N &nbsp; E D I T I O N</div>
    </div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>

  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay lose" id="overlay-lose">
      <div class="overlay-bg"></div>
      <div class="overlay-content">
        <h2>Game Over</h2>
        <p id="lose-msg">You crashed!</p>
        <button class="btn primary" onclick="game.restart()">Try Again</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>

  <div class="ai-indicator" id="ai-indicator" style="display:none">
    <div class="ai-dot"></div><span id="ai-status">AI thinking...</span>
  </div>

  <div class="stats-bar">
    <span id="len-stat">Length: 3</span>
    <span id="food-stat">Food left: 0</span>
  </div>
</div>

<script>
(function(){
  'use strict';
  const GRID = 20;
  const STEP_MS = 95;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Precomputed Hamiltonian cycle for a 20x20 board. Following it lets the snake
  // traverse every cell without ever reversing or self-trapping; over time it walks
  // through (and therefore opens up) any region divided by the body.
  const HAM = (function(){
    const h=[];
    for(let x=0;x<GRID;x++) h.push({x,y:0});
    for(let y=1;y<GRID;y++){
      if(y%2===1){ h.push({x:GRID-1,y}); for(let x=GRID-2;x>=1;x--) h.push({x,y}); }
      else { h.push({x:1,y}); for(let x=2;x<GRID;x++) h.push({x,y}); }
    }
    h.push({x:0,y:GRID-1});
    for(let y=GRID-2;y>=1;y--) h.push({x:0,y});
    return h;
  })();
  const HAM_INDEX = {};
  HAM.forEach((p,i)=>{ HAM_INDEX[p.x+','+p.y]=i; });

  function fitCanvas(){
    const w = canvas.clientWidth || 400;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = w * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return w;
  }

  class Snake {
    constructor(){
      this.bestScore = parseInt(localStorage.getItem('bestSnake')||'0');
      this.autoPlay = false;
      this.autoTimer = null;
      this.tickTimer = null;
      this.size = 400;
      this.bindInput();
      this.restart();
    }

    restart(){
      this.stopAuto();
      this.size = fitCanvas();
      this.cell = this.size / GRID;
      this.snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      this.dir = {x:1,y:0};
      this.nextDir = {x:1,y:0};
      this.score = 0;
      this.over = false;
      this.placeFood();
      this.hideOverlays();
      this.updateUI();
      this.loop();
    }

    placeFood(){
      const occupied = new Set(this.snake.map(s=>s.x+','+s.y));
      const free = [];
      for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++){
        if(!occupied.has(x+','+y)) free.push({x,y});
      }
      this.food = free.length ? free[Math.floor(Math.random()*free.length)] : null;
    }

    foodLeft(){ return GRID*GRID - this.snake.length - (this.food?1:0); }

    hideOverlays(){ document.getElementById('overlay-lose').classList.remove('active'); }

    gameOver(reason){
      this.over = true;
      this.stopLoop();
      if(this.autoPlay) this.stopAuto();
      document.getElementById('lose-msg').textContent = reason;
      document.getElementById('overlay-lose').classList.add('active');
    }

    step(){
      if(this.over) return;
      this.dir = this.nextDir;
      const head = {x:this.snake[0].x+this.dir.x, y:this.snake[0].y+this.dir.y};
      // wall
      if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID){ this.gameOver('You hit the wall!'); return; }
      // self (exclude tail because it moves away, unless growing)
      const willEat = this.food && head.x===this.food.x && head.y===this.food.y;
      const body = willEat ? this.snake : this.snake.slice(0,-1);
      if(body.some(s=>s.x===head.x&&s.y===head.y)){ this.gameOver('You bit yourself!'); return; }
      this.snake.unshift(head);
      if(willEat){
        this.score += 10;
        if(this.score>this.bestScore){ this.bestScore=this.score; localStorage.setItem('bestSnake',this.bestScore); }
        this.placeFood();
      } else {
        this.snake.pop();
      }
      this.updateUI();
      if(!this.food){ this.gameOver('You win — board cleared!'); }
    }

    // ---- AI ----
    // Strategy hierarchy (fixes the "snake traps itself by compressing when the
    // board is divided" problem):
    //   1. If a path to the food exists AND taking it keeps the snake survivable,
    //      follow the shortest path to the food.
    //   2. Otherwise follow the Hamiltonian cycle: this walks the longest safe path,
    //      eventually passing through (and thereby reconnecting) any region that the
    //      body currently splits off — it can never reverse or back itself into a
    //      pocket the way the greedy "max space" heuristic did.
    //   3. If the cycle is blocked right now, chase the tail and/or pick the move that
    //      keeps the most reachable free space as last resort.
    chooseDir(){
      const head = this.snake[0];
      const bodyBlock = new Set(this.snake.slice(0,-1).map(s=>s.x+','+s.y));

      if(this.food){
        const path = this.bfs(head, this.food, bodyBlock);
        if(path && path.length>1){
          const n = path[1];
          const d = {x:n.x-head.x, y:n.y-head.y};
          if(this.isSafe(d) && this.survivableAfter(d)){
            return d;
          }
        }
      }

      // Tail-chase: move toward the tail so the snake keeps advancing along its
      // own body instead of stalling or compressing into a pocket.
      const tail = this.snake[this.snake.length-1];
      const tpath = this.bfs(head, tail, bodyBlock);
      if(tpath && tpath.length>1){
        const n = tpath[1];
        const d = {x:n.x-head.x, y:n.y-head.y};
        if(this.isSafe(d) && this.survivableAfter(d)) return d;
      }

      // Hamiltonian-cycle fallback: pick the cycle-neighbour that is currently free.
      // Walking the full cycle passes through every cell, so over time it opens up
      // any region the body has split off — it can never back itself into a pocket.
      const hi = HAM_INDEX[head.x+','+head.y];
      const candidates = [
        HAM[(hi+1)%HAM.length],
        HAM[(hi-1+HAM.length)%HAM.length]
      ];
      for(const c of candidates){
        const d = {x:c.x-head.x, y:c.y-head.y};
        if(this.isSafe(d) && this.survivableAfter(d)){
          return d;
        }
      }

      // Last resort: largest reachable free space.
      let best=null, bestSpace=-1;
      const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      for(const d of dirs){
        if(this.isOpposite(d)) continue;
        if(!this.isSafe(d)) continue;
        const space = this.floodFill({x:head.x+d.x,y:head.y+d.y}, bodyBlock);
        if(space>bestSpace){ bestSpace=space; best=d; }
      }
      return best || this.dir;
    }

    // After moving in direction d, would the head still be able to reach its own
    // tail? If yes, the snake is not trapped. Guarantees we never take the food
    // path into a dead end.
    survivableAfter(d){
      const head=this.snake[0];
      const nx=head.x+d.x, ny=head.y+d.y;
      const willEat = this.food && nx===this.food.x && ny===this.food.y;
      const sim = this.snake.map(s=>({x:s.x,y:s.y}));
      if(willEat){ sim.unshift({x:nx,y:ny}); }      // tail stays
      else { sim.unshift({x:nx,y:ny}); sim.pop(); } // tail moves away
      const newHead = sim[0];
      const tail = sim[sim.length-1];
      const blocked = new Set(sim.slice(0,-1).map(s=>s.x+','+s.y));
      return !!this.bfs(newHead, tail, blocked);
    }

    isOpposite(d){ return d.x===-this.dir.x && d.y===-this.dir.y && this.snake.length>1; }
    isSafe(d){
      const head=this.snake[0];
      const nx=head.x+d.x, ny=head.y+d.y;
      if(nx<0||nx>=GRID||ny<0||ny>=GRID) return false;
      const blocked = new Set(this.snake.slice(0,-1).map(s=>s.x+','+s.y));
      return !blocked.has(nx+','+ny);
    }
    bfs(start, goal, blocked){
      const q=[start]; const prev={}; const seen=new Set([start.x+','+start.y]);
      const key=p=>p.x+','+p.y;
      while(q.length){
        const cur=q.shift();
        if(cur.x===goal.x&&cur.y===goal.y){
          const path=[]; let k=key(cur);
          while(k!==undefined){ const [x,y]=k.split(',').map(Number); path.unshift({x,y}); k=prev[k]; }
          return path;
        }
        for(const d of [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]){
          const nx=cur.x+d.x, ny=cur.y+d.y, nk=nx+','+ny;
          if(nx<0||nx>=GRID||ny<0||ny>=GRID) continue;
          if(seen.has(nk)) continue;
          if(blocked.has(nk) && !(nx===goal.x&&ny===goal.y)) continue;
          seen.add(nk); prev[nk]=key(cur); q.push({x:nx,y:ny});
        }
      }
      return null;
    }
    floodFill(start, blocked){
      if(start.x<0||start.x>=GRID||start.y<0||start.y>=GRID) return 0;
      if(blocked.has(start.x+','+start.y)) return 0;
      const seen=new Set([start.x+','+start.y]); const q=[start]; let c=0;
      while(q.length){
        const cur=q.pop(); c++;
        for(const d of [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]){
          const nx=cur.x+d.x, ny=cur.y+d.y, nk=nx+','+ny;
          if(nx<0||nx>=GRID||ny<0||ny>=GRID) continue;
          if(seen.has(nk)||blocked.has(nk)) continue;
          seen.add(nk); q.push({x:nx,y:ny});
        }
      }
      return c;
    }

    toggleAuto(){
      if(this.autoPlay) this.stopAuto();
      else { if(this.over) this.restart(); this.startAuto(); }
    }
    startAuto(){
      this.autoPlay=true;
      const b=document.getElementById('btn-auto');
      b.textContent='Auto: ON'; b.classList.add('auto-on');
      document.getElementById('ai-indicator').style.display='flex';
      this.autoStep();
    }
    stopAuto(){
      this.autoPlay=false;
      if(this.autoTimer){ clearTimeout(this.autoTimer); this.autoTimer=null; }
      const b=document.getElementById('btn-auto');
      b.textContent='Auto: OFF'; b.classList.remove('auto-on');
      document.getElementById('ai-indicator').style.display='none';
    }
    autoStep(){
      if(!this.autoPlay||this.over){ if(this.over) this.stopAuto(); return; }
      this.nextDir = this.chooseDir();
      document.getElementById('ai-status').textContent='AI: length '+this.snake.length+' · '+this.score+' pts';
      this.step();
      if(!this.over) this.autoTimer=setTimeout(()=>this.autoStep(), STEP_MS);
    }

    loop(){
      this.stopLoop();
      this.tickTimer=setInterval(()=>{
        if(this.autoPlay) return; // auto drives its own timer
        this.step();
      }, STEP_MS);
    }
    stopLoop(){ if(this.tickTimer){ clearInterval(this.tickTimer); this.tickTimer=null; } }

    updateUI(){
      document.getElementById('score').textContent=this.score;
      document.getElementById('best').textContent=this.bestScore;
      document.getElementById('len-stat').textContent='Length: '+this.snake.length;
      document.getElementById('food-stat').textContent='Food left: '+this.foodLeft();
      this.draw();
    }

    draw(){
      const c=this.cell;
      ctx.clearRect(0,0,this.size,this.size);
      // grid dots
      ctx.fillStyle='#ffffff08';
      for(let i=0;i<=GRID;i++){
        ctx.fillRect(i*c-0.5,0,1,this.size);
        ctx.fillRect(0,i*c-0.5,this.size,1);
      }
      // food
      if(this.food){
        const fx=this.food.x*c+c/2, fy=this.food.y*c+c/2;
        ctx.save();
        ctx.shadowColor='#ff4d6a'; ctx.shadowBlur=14;
        ctx.fillStyle='#ff4d6a';
        ctx.beginPath(); ctx.arc(fx,fy,c*0.3,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
      // snake
      this.snake.forEach((s,i)=>{
        const t=i/this.snake.length;
        const col = i===0 ? '#b6ffce' : '#4dff91';
        ctx.save();
        ctx.shadowColor='#4dff91'; ctx.shadowBlur=i===0?16:8;
        ctx.fillStyle=col;
        const pad=c*0.08;
        const r = i===0 ? c*0.28 : c*0.22;
        this.roundRect(s.x*c+pad, s.y*c+pad, c-pad*2, c-pad*2, r);
        ctx.fill();
        ctx.restore();
        if(i===0){
          ctx.fillStyle='#0a0a1a';
          const ex=s.x*c+c*0.42, ey=s.y*c+c*0.4;
          const ex2=s.x*c+c*0.58, ey2=s.y*c+c*0.4;
          ctx.beginPath(); ctx.arc(ex,ey,1.4,0,7); ctx.arc(ex2,ey2,1.4,0,7); ctx.fill();
        }
      });
    }
    roundRect(x,y,w,h,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
    }

    setDir(d){
      if(this.autoPlay||this.over) return;
      if(this.isOpposite(d)) return;
      this.nextDir=d;
    }

    bindInput(){
      document.addEventListener('keydown',(e)=>{
        if(this.autoPlay||this.over) return;
        let d=null;
        if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') d={x:0,y:-1};
        else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') d={x:0,y:1};
        else if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') d={x:-1,y:0};
        else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') d={x:1,y:0};
        if(d){ e.preventDefault(); this.setDir(d); }
      });
      const wrap=document.getElementById('board-wrap');
      let sx=0,sy=0,tracking=false,fired=false,activeId=null;
      const TH=22;
      wrap.addEventListener('pointerdown',(e)=>{
        if(this.autoPlay||this.over||activeId!==null) return;
        activeId=e.pointerId; sx=e.clientX; sy=e.clientY; tracking=true; fired=false;
        try{ wrap.setPointerCapture(e.pointerId);}catch(_){}
        e.preventDefault();
      });
      wrap.addEventListener('pointermove',(e)=>{
        if(!tracking||fired||this.autoPlay||this.over||e.pointerId!==activeId) return;
        const dx=e.clientX-sx, dy=e.clientY-sy;
        if(Math.max(Math.abs(dx),Math.abs(dy))>=TH){
          fired=true;
          if(Math.abs(dx)>Math.abs(dy)) this.setDir({x:dx>0?1:-1,y:0});
          else this.setDir({x:0,y:dy>0?1:-1});
        }
      });
      const end=(e)=>{ if(e.pointerId!==activeId) return; activeId=null; tracking=false;
        if(fired||this.autoPlay||this.over) return;
        const dx=e.clientX-sx, dy=e.clientY-sy;
        if(Math.max(Math.abs(dx),Math.abs(dy))>=TH){
          if(Math.abs(dx)>Math.abs(dy)) this.setDir({x:dx>0?1:-1,y:0});
          else this.setDir({x:0,y:dy>0?1:-1});
        }
      };
      wrap.addEventListener('pointerup',end);
      wrap.addEventListener('pointercancel',end);
      window.addEventListener('resize',()=>{ this.size=fitCanvas(); this.cell=this.size/GRID; this.draw(); });
    }
  }
  window.game=new Snake();
})();
</script>
</body>
</html>
