<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a18" />
<title>Dots &amp; Boxes · Neon</title>
<style>
  :root{
    --bg:#0a0a18; --surface:#12122a; --text:#e7e7f5; --muted:#8888b0;
    --accent:#ff6ad5; --accent2:#5ce1ff; --accent-glow:#ff6ad566; --gold:#ffd76a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);background-image:radial-gradient(ellipse at 25% 15%,#3a1030 0%,transparent 55%),radial-gradient(ellipse at 80% 85%,#0f2a3a 0%,transparent 55%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;}
  .container{width:100%;max-width:480px;padding:16px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;}
  .title-block h1{font-size:1.8rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#ff9ae0,#ff6ad5,#5ce1ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
  .score-panel{display:flex;gap:8px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0a;border-radius:10px;padding:6px 12px;text-align:center;min-width:54px;}
  .score-card .label{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:2px;}
  .score-card .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0a;border-radius:14px;padding:10px;box-shadow:0 0 40px #00000040,0 0 70px var(--accent-glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#0c0c20;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;z-index:10;opacity:0;transition:opacity .35s;pointer-events:none;}
  .overlay.active{opacity:1;pointer-events:auto;}
  .overlay-bg{position:absolute;inset:0;background:#0a0a18ee;backdrop-filter:blur(4px);border-radius:14px;}
  .overlay-content{position:relative;text-align:center;z-index:1;}
  .overlay-content h2{font-size:1.8rem;font-weight:800;margin-bottom:6px;}
  .overlay-content p{color:var(--muted);margin-bottom:16px;font-size:.9rem;}
  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:90px;padding:12px 16px;border:1px solid #ffffff12;border-radius:10px;background:var(--surface);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-align:center;}
  .btn:hover{background:#ffffff10;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0614;}
  .btn.primary:hover{box-shadow:0 0 20px var(--accent-glow);}
  .btn.auto-on{background:var(--accent);border-color:var(--accent);color:#1a0614;animation:pulse-glow 2s infinite;--glow:var(--accent-glow);}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px var(--glow,transparent);}50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);}}
  .ai-indicator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.75rem;color:var(--muted);justify-content:center;min-height:20px;}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
  .hint{margin-top:8px;text-align:center;font-size:.7rem;color:var(--muted);}
  @media(max-width:400px){.title-block h1{font-size:1.4rem;}.btn{padding:10px 12px;font-size:.78rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Dots &amp; Boxes</h1><div class="sub">C O N N E C T &nbsp; T O &nbsp; W I N</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Red</div><div class="value" id="s1" style="color:#ff6ad5">0</div></div>
      <div class="score-card"><div class="label">Blue</div><div class="value" id="s2" style="color:#5ce1ff">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="440" height="440"></canvas>
    <div class="overlay" id="overlay-end"><div class="overlay-bg"></div><div class="overlay-content"><h2 id="end-title">Game Over</h2><p id="end-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI plotting…</span></div>
  <div class="hint">Tap near a line to draw it. Close a box to score &amp; go again.</div>
</div>
<script>
(function(){
  'use strict';
  const N=5; // boxes per side -> (n+1)x(n+1) dots
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  function fitCanvas(){ const w=canvas.clientWidth||440; const dpr=window.devicePixelRatio||1; canvas.width=w*dpr; canvas.height=w*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); return w; }
  const lerp=(a,b,t)=>a+(b-a)*t;
  class Dots{
    constructor(){ this.autoPlay=false; this.bindInput(); this.restart(); this._tick=this.tick.bind(this); requestAnimationFrame(this._tick); }
    restart(){ this.stopAuto(); this.size=fitCanvas(); this.pad=26; this.cell=(this.size-2*this.pad)/N;
      this.h=new Array((N+1)*N).fill(false); this.v=new Array(N*(N+1)).fill(false);
      this.boxes=new Array(N*N).fill(0); this.scores=[0,0]; this.turn=1; this.over=false;
      this.phase='play'; this.busy=0; this.autoAccum=0; this.anim=null; this.lastBoxFlash=0; this.hideOverlay(); this.updateUI(); }
    hideOverlay(){ document.getElementById('overlay-end').classList.remove('active'); }
    updateUI(){ document.getElementById('s1').textContent=this.scores[0]; document.getElementById('s2').textContent=this.scores[1]; }
    idxH(r,c){ return r*N+c; } idxV(r,c){ return r*(N+1)+c; }
    hAt(r,c){ return this.h[this.idxH(r,c)]; } vAt(r,c){ return this.v[this.idxV(r,c)]; }
    boxEdges(r,c){ return [this.hAt(r,c),this.hAt(r+1,c),this.vAt(r,c),this.vAt(r,c+1)]; }
    boxComplete(r,c){ const e=this.boxEdges(r,c); return e[0]&&e[1]&&e[2]&&e[3]; }
    dotPos(r,c){ return [this.pad+c*this.cell, this.pad+r*this.cell]; }
    edgeGeom(type,er,ec){ if(type==='h'){ const [x1,y1]=this.dotPos(er,ec),[x2,y2]=this.dotPos(er,ec+1); return [x1,y1,x2,y2]; } else { const [x1,y1]=this.dotPos(er,ec),[x2,y2]=this.dotPos(er+1,ec); return [x1,y1,x2,y2]; } }
    nearestEdge(px,py){ const rect=canvas.getBoundingClientRect(); const x=px-rect.left, y=py-rect.top; let best=null,bd=1e9; for(let r=0;r<=N;r++)for(let c=0;c<N;c++){ if(this.hAt(r,c))continue; const [x1,y1,x2,y2]=this.edgeGeom('h',r,c); const mx=(x1+x2)/2,my=(y1+y2)/2; const d=Math.hypot(x-mx,y-my); if(d<bd){bd=d;best={type:'h',r,c};} } for(let r=0;r<N;r++)for(let c=0;c<=N;c++){ if(this.vAt(r,c))continue; const [x1,y1,x2,y2]=this.edgeGeom('v',r,c); const mx=(x1+x2)/2,my=(y1+y2)/2; const d=Math.hypot(x-mx,y-my); if(d<bd){bd=d;best={type:'v',r,c};} } if(best&&bd<this.cell*0.42) return best; return null; }
    applyEdge(e){
      if(this.over||this.phase!=='play') return false;
      if(e.type==='h') this.h[this.idxH(e.r,e.c)]=true; else this.v[this.idxV(e.r,e.c)]=true;
      const [x1,y1,x2,y2]=this.edgeGeom(e.type,e.r,e.c); this.anim={x1,y1,x2,y2,color:this.turn===1?'#ff6ad5':'#5ce1ff',t:0,dur:0.18}; this.busy=0.2; this.phase='anim';
      let completed=0;
      const br=[e.r-1,e.r], bc=[e.c-1,e.c];
      for(const r of br)for(const c of bc){ if(r>=0&&r<N&&c>=0&&c<N&&this.boxes[r*N+c]===0&&this.boxComplete(r,c)){ this.boxes[r*N+c]=this.turn; this.scores[this.turn-1]++; completed++; } }
      this.updateUI();
      if(completed>0){ if(this.scores[0]+this.scores[1]===N*N){ this.over=true; this.showEnd(); } return true; }
      this.turn = this.turn===1?2:1;
      if(this.scores[0]+this.scores[1]===N*N){ this.over=true; this.showEnd(); }
      return true;
    }
    showEnd(){ const w=this.scores[0]>this.scores[1]?1:2; document.getElementById('end-title').textContent=this.scores[0]===this.scores[1]?'Draw':(w===1?'Red Wins!':'Blue Wins!'); document.getElementById('end-msg').textContent='Red '+this.scores[0]+' · Blue '+this.scores[1]; document.getElementById('overlay-end').classList.add('active'); }
    // ---- AI ----
    emptyEdges(){ const out=[]; for(let r=0;r<=N;r++)for(let c=0;c<N;c++) if(!this.hAt(r,c)) out.push({type:'h',r,c}); for(let r=0;r<N;r++)for(let c=0;c<=N;c++) if(!this.vAt(r,c)) out.push({type:'v',r,c}); return out; }
    wouldComplete(e){ const h=this.h.slice(),v=this.v.slice(); if(e.type==='h')h[this.idxH(e.r,e.c)]=true; else v[this.idxV(e.r,e.c)]=true;
      const br=[e.r-1,e.r],bc=[e.c-1,e.c]; let comp=0; for(const r of br)for(const c of bc){ if(r>=0&&r<N&&c>=0&&c<N){ const b=[h[r*N+c]!==undefined?h[r*N+c]:this.hAt(r,c), /*placeholder*/]; } }
      // compute over temp arrays
      const boxC=(r,c)=>{ const e0=(r>=0&&r<=N&&c>=0&&c<N)?h[r*N+c]:this.hAt(r,c); const e1=(r+1>=0&&r+1<=N&&c>=0&&c<N)?h[(r+1)*N+c]:this.hAt(r+1,c); const e2=(r>=0&&r<N&&c>=0&&c<=N)?v[r*(N+1)+c]:this.vAt(r,c); const e3=(r>=0&&r<N&&c+1>=0&&c+1<=N)?v[r*(N+1)+(c+1)]:this.vAt(r,c+1); return e0&&e1&&e2&&e3; };
      for(const r of br)for(const c of bc){ if(r>=0&&r<N&&c>=0&&c<N&&this.boxes[r*N+c]===0&&boxC(r,c)) comp++; }
      return comp>0;
    }
    edgeMakes3(e){ const h=this.h.slice(),v=this.v.slice(); if(e.type==='h')h[this.idxH(e.r,e.c)]=true; else v[this.idxV(e.r,e.c)]=true; const br=[e.r-1,e.r],bc=[e.c-1,e.c];
      const cnt=(r,c)=>{ if(r<0||r>=N||c<0||c>=N) return -1; const e0=h[r*N+c],e1=h[(r+1)*N+c],e2=v[r*(N+1)+c],e3=v[r*(N+1)+c+1]; return (e0?1:0)+(e1?1:0)+(e2?1:0)+(e3?1:0); };
      for(const r of br)for(const c of bc){ if(r>=0&&r<N&&c>=0&&c<N&&this.boxes[r*N+c]===0){ if(cnt(r,c)===3) return true; } } return false;
    }
    chooseGreedy(){ const empties=this.emptyEdges();
      const completers=empties.filter(e=>this.wouldComplete(e));
      if(completers.length) return completers[0];
      const safe=empties.filter(e=>!this.edgeMakes3(e));
      if(safe.length) return safe[(Math.random()*safe.length)|0];
      return empties[(Math.random()*empties.length)|0];
    }
    chooseAuto(){ const e=this.chooseGreedy(); if(e) this.applyEdge(e); }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); document.getElementById('ai-indicator').style.display='flex'; }
    stopAuto(){ this.autoPlay=false; const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); document.getElementById('ai-indicator').style.display='none'; }
    tick(ts){ const dt=Math.min(50,(ts!==undefined)?((ts-(this._last||ts))):16)/1000; this._last=ts; this.update(dt); this.render(); requestAnimationFrame(this._tick); }
    update(dt){
      if(this.anim){ this.anim.t+=dt; if(this.anim.t>=this.anim.dur) this.anim=null; }
      if(this.busy>0){ this.busy-=dt; if(this.busy<=0){ this.busy=0; this.phase='play'; } }
      if(this.over||this.phase!=='play') return;
      if(this.autoPlay){ this.autoAccum+=dt; if(this.autoAccum>=0.35){ this.autoAccum=0; this.chooseAuto(); } }
      else if(this.turn===2){ this.autoAccum+=dt; if(this.autoAccum>=0.4){ this.autoAccum=0; this.chooseAuto(); } }
    }
    bindInput(){ const wrap=document.getElementById('board-wrap'); wrap.addEventListener('pointerdown',(e)=>{ if(this.autoPlay||this.over||this.phase!=='play'||this.turn!==1) return; const ed=this.nearestEdge(e.clientX,e.clientY); if(!ed) return; e.preventDefault(); this.applyEdge(ed); }); window.addEventListener('resize',()=>{ this.size=fitCanvas(); }); }
    render(){ const size=this.size; ctx.clearRect(0,0,size,size);
      // boxes fill
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const own=this.boxes[r*N+c]; if(own){ const [x,y]=this.dotPos(r,c); ctx.fillStyle=own===1?'#ff6ad522':'#5ce1ff22'; ctx.fillRect(x+2,y+2,this.cell-4,this.cell-4); const cx=x+this.cell/2,cy=y+this.cell/2; ctx.fillStyle=own===1?'#ff6ad5':'#5ce1ff'; ctx.font='bold '+(this.cell*0.4)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(own===1?'★':'●',cx,cy); } }
      // edges
      const drawLine=(e,col)=>{ const [x1,y1,x2,y2]=this.edgeGeom(e.type,e.r,e.c); ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=8; ctx.strokeStyle=col; ctx.lineWidth=4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore(); };
      for(let r=0;r<=N;r++)for(let c=0;c<N;c++) if(this.hAt(r,c)) drawLine({type:'h',r,c},'#e7e7f5');
      for(let r=0;r<N;r++)for(let c=0;c<=N;c++) if(this.vAt(r,c)) drawLine({type:'v',r,c},'#e7e7f5');
      // dots
      for(let r=0;r<=N;r++)for(let c=0;c<=N;c++){ const [x,y]=this.dotPos(r,c); ctx.fillStyle='#9aa0c0'; ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.fill(); }
      // anim edge
      if(this.anim){ const a=this.anim; const t=Math.min(1,a.t/a.dur); const ex=lerp(a.x1,a.x2,t),ey=lerp(a.y1,a.y2,t); ctx.save(); ctx.shadowColor=a.color; ctx.shadowBlur=12; ctx.strokeStyle=a.color; ctx.lineWidth=4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(a.x1,a.y1); ctx.lineTo(ex,ey); ctx.stroke(); ctx.restore(); }
      // turn indicator ring
      if(!this.over){ ctx.fillStyle=this.turn===1?'#ff6ad5':'#5ce1ff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='left'; ctx.fillText((this.autoPlay?'AI ':'')+(this.turn===1?'Red':'Blue')+' to move',10,size-8); }
    }
  }
  window.game=new Dots();
})();
</script>
</body>
</html>
