<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#04141c" />
<title>注水鱼缸 · Neon Aquarium</title>
<style>
  :root{
    --bg:#04141c; --surface:#0a2230; --text:#eaf2ff; --muted:#7e90b3;
    --accent:#3ad6c5; --accent2:#46a0ff; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#3ad6c555; --dim:#243352;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #0c3a4a 0%, transparent 60%),
                     radial-gradient(ellipse at 50% 100%, #0a1f44 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:460px;padding:12px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .title-block h1{font-size:1.4rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:54px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.t .value{color:var(--accent);}
  .score-card.p .value{color:var(--accent2);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#06141d;}
  .toolbar{display:flex;gap:8px;margin-top:10px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04141c;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  button.ghost{background:transparent;}
  .hint{text-align:center;color:var(--muted);font-size:0.72rem;margin-top:8px;line-height:1.5;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.7rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay p{color:var(--muted);font-size:0.9rem;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04141c;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>注水鱼缸 · NEON AQUARIUM</h1>
      <div class="sub">Water Tanks</div>
    </div>
    <div class="score-panel">
      <div class="score-card t"><div class="label">已对齐</div><div class="value" id="match">0 / 0</div></div>
      <div class="score-card p"><div class="label">最佳</div><div class="value" id="best">–</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">AUTO</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">胜利！</h2>
      <p id="ovText"></p>
      <button class="auto on" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="auto" id="autoBtn">自动游玩</button>
    <button class="ghost" id="restartBtn">重开</button>
  </div>
  <div class="hint">点鱼缸<b>注水/排空</b>（整缸统一）；让每列的注水位与顶部数字<b>对齐</b></div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const cv=$('cv'), elMatch=$('match'), elBest=$('best'),
        elBadge=$('badge'), elOverlay=$('overlay'), elOvTitle=$('ovTitle'), elOvText=$('ovText'),
        btnAuto=$('autoBtn'), btnRestart=$('restartBtn'), btnOv=$('ovBtn');

  const G=6, W=420, H=420, PAD=14, CELL=(W-2*PAD)/G, N=G*G;
  let dpr=Math.min(2,(typeof devicePixelRatio!=='undefined'?devicePixelRatio||1:1));
  function setupCanvas(){
    if(!cv||!cv.getContext) return;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px'; cv.style.maxWidth='100%';
  }
  setupCanvas();
  const ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;

  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  const inb=(r,c)=>r>=0&&c>=0&&r<G&&c<G;
  const idx=(r,c)=>r*G+c;
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  function genTanks(){
    const reg=new Array(N).fill(-1); let nextId=0;
    const order=shuffle([...Array(N).keys()]);
    for(const start of order){
      if(reg[start]!==-1) continue;
      const target=1+Math.floor(Math.random()*4); // 1..4
      const cells=[start]; reg[start]=nextId;
      while(cells.length<target){
        const frontier=[];
        for(const c of cells){ const r=Math.floor(c/G), col=c%G;
          for(const [dr,dc] of dirs){ const nr=r+dr,nc=col+dc; if(inb(nr,nc)){ const ni=idx(nr,nc); if(reg[ni]===-1) frontier.push(ni); } } }
        if(!frontier.length) break;
        const pick=frontier[Math.floor(Math.random()*frontier.length)];
        reg[pick]=nextId; cells.push(pick);
      }
      nextId++;
    }
    const remap={}; let nid=0;
    for(let i=0;i<N;i++){ if(remap[reg[i]]===undefined) remap[reg[i]]=nid++; }
    for(let i=0;i<N;i++) reg[i]=remap[reg[i]];
    return reg;
  }

  function genPuzzle(){
    const tank=genTanks();
    let numTanks=0; for(let i=0;i<N;i++) if(tank[i]+1>numTanks) numTanks=tank[i]+1;
    const filled=new Array(numTanks).fill(false);
    let anyF=false, anyE=false;
    for(let t=0;t<numTanks;t++){ filled[t]=Math.random()<0.5; if(filled[t]) anyF=true; else anyE=true; }
    if(!anyF) filled[Math.floor(Math.random()*numTanks)]=true;
    if(!anyE) filled[Math.floor(Math.random()*numTanks)]=false;
    const clue=new Array(G).fill(0);
    for(let c=0;c<G;c++){ let cnt=0; for(let r=0;r<G;r++){ if(filled[tank[idx(r,c)]]) cnt++; } clue[c]=cnt; }
    return {tank, numTanks, filled, clue};
  }

  let tank, numTanks, solFilled, clue, tankFilled;
  let over, won, auto, autoReplay, autoIdx, autoAccum, glowTank;
  let elapsed, best, winPulse, autoTimer;

  try{ best=parseFloat(localStorage.getItem('aquarium_best')); if(!(best>0)) best=0; }catch(e){best=0;}

  function resetToEmpty(){ tankFilled=new Array(numTanks).fill(false); glowTank=-1; }

  function newGame(){
    const p=genPuzzle();
    tank=p.tank; numTanks=p.numTanks; solFilled=p.filled; clue=p.clue;
    resetToEmpty();
    over=false; won=false; auto=false; autoReplay=false; autoIdx=0; autoAccum=0;
    elapsed=0; winPulse=0; autoTimer=0;
    if(elBadge) elBadge.classList.remove('show');
    if(btnAuto){ btnAuto.classList.remove('on'); btnAuto.textContent='自动游玩'; }
    elOverlay.classList.remove('show');
    updateHUD();
  }

  function updateHUD(){
    if(elMatch) elMatch.textContent=matchingCols()+' / '+G;
    if(elBest) elBest.textContent = best>0 ? best.toFixed(1)+'s' : '–';
  }

  function setAuto(v){
    auto=v;
    if(btnAuto){ btnAuto.classList.toggle('on',v); btnAuto.textContent=v?'自动中…':'自动游玩'; }
    if(elBadge) elBadge.classList.toggle('show',v);
    if(v){ resetToEmpty(); autoReplay=true; autoIdx=0; autoAccum=0; glowTank=-1; }
  }

  function autoStep(){
    if(autoIdx<numTanks){
      tankFilled[autoIdx]=solFilled[autoIdx]; glowTank=autoIdx; autoIdx++; updateHUD();
      if(autoIdx>=numTanks){ checkWin(); }
    }
  }

  function filledCol(c){ let cnt=0; for(let r=0;r<G;r++){ if(tankFilled[tank[idx(r,c)]]) cnt++; } return cnt; }
  function matchingCols(){ let m=0; for(let c=0;c<G;c++) if(filledCol(c)===clue[c]) m++; return m; }

  function checkWin(){
    if(over||won) return;
    if(matchingCols()!==G) return;
    winGame();
  }

  function winGame(){
    over=true; won=true; winPulse=1;
    if(best===0||elapsed<best){ best=elapsed; try{localStorage.setItem('aquarium_best',String(best));}catch(e){} }
    if(elBest) elBest.textContent=best.toFixed(1)+'s';
    if(auto){ elOvTitle.textContent='⚡ 自动通关！'; elOvText.textContent='用 '+elapsed.toFixed(1)+'s 对齐所有水位'; autoTimer=1.0; }
    else { elOvTitle.textContent='🎉 通关！'; elOvText.textContent='用 '+elapsed.toFixed(1)+'s 对齐所有水位'; elOverlay.classList.add('show'); }
  }

  function cellAt(x,y){
    const gx=Math.floor((x-PAD)/CELL), gy=Math.floor((y-PAD)/CELL);
    if(gx<0||gy<0||gx>=G||gy>=G) return -1;
    return idx(gy,gx);
  }
  function handleTap(x,y){
    if(over||auto) return;
    const i=cellAt(x,y); if(i<0) return;
    const tid=tank[i];
    tankFilled[tid]=!tankFilled[tid];
    updateHUD();
    checkWin();
  }

  function onDown(e){
    if(over||auto) return;
    let x=0,y=0;
    try{ const rect=cv.getBoundingClientRect(); const cx=(typeof e.clientX==='number')?e.clientX:0, cy=(typeof e.clientY==='number')?e.clientY:0;
      x=((cx-rect.left)/rect.width)*W; y=((cy-rect.top)/rect.height)*H; }catch(err){ return; }
    handleTap(x,y);
    e.preventDefault&&e.preventDefault();
  }
  function onUp(e){ e.preventDefault&&e.preventDefault(); }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointerdown',onDown,{passive:false});
    cv.addEventListener('pointerup',onUp,{passive:false});
    cv.addEventListener('pointercancel',onUp,{passive:false});
    cv.addEventListener('mousedown',onDown,{passive:false});
    cv.addEventListener('mouseup',onUp,{passive:false});
  }
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto) return; setAuto(!auto); if(auto&&over){ newGame(); setAuto(true);} });
  btnRestart&&btnRestart.addEventListener('click',()=>{ newGame(); setAuto(false); });
  btnOv&&btnOv.addEventListener('click',()=>{ newGame(); setAuto(false); });

  function update(dt){
    if(over){
      if(winPulse>0) winPulse=Math.max(0,winPulse-dt*1.5);
      if(auto){ autoTimer-=dt; if(autoTimer<=0){ newGame(); setAuto(true); } }
      return;
    }
    elapsed+=dt;
    if(auto && autoReplay){ autoAccum+=dt; if(autoAccum>=0.09){ autoAccum=0; autoStep(); } }
    if(winPulse>0) winPulse=Math.max(0,winPulse-dt*2);
  }

  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function cc(i){ return [PAD+(i%G)*CELL+CELL/2, PAD+Math.floor(i/G)*CELL+CELL/2]; }
  function tankHue(tid){ return (tid*67+30)%360; }

  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    // water cells
    for(let i=0;i<N;i++){
      const r=Math.floor(i/G), c=i%G, x=PAD+c*CELL, y=PAD+r*CELL;
      if(tankFilled[tank[i]]){
        const grd=ctx.createLinearGradient(x,y,x,y+CELL);
        grd.addColorStop(0,'rgba(70,160,255,0.55)'); grd.addColorStop(1,'rgba(58,214,197,0.35)');
        ctx.fillStyle=grd; roundRect(x+2,y+2,CELL-4,CELL-4,7); ctx.fill();
        ctx.save(); ctx.shadowColor='#46a0ff'; ctx.shadowBlur=8; ctx.fill(); ctx.restore();
      } else {
        ctx.fillStyle='rgba(255,255,255,0.03)'; roundRect(x+2,y+2,CELL-4,CELL-4,7); ctx.fill();
      }
    }
    // tank outlines
    ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=2;
    for(let r=0;r<G;r++)for(let c=0;c<G;c++){
      const i=idx(r,c);
      if(c<G-1 && tank[idx(r,c+1)]!==tank[i]){ const x=PAD+(c+1)*CELL; ctx.beginPath(); ctx.moveTo(x,PAD+r*CELL); ctx.lineTo(x,PAD+(r+1)*CELL); ctx.stroke(); }
      if(r<G-1 && tank[idx(r+1,c)]!==tank[i]){ const y=PAD+(r+1)*CELL; ctx.beginPath(); ctx.moveTo(PAD+c*CELL,y); ctx.lineTo(PAD+(c+1)*CELL,y); ctx.stroke(); }
    }
    // glow on auto-filled tank
    if(glowTank>=0 && auto){
      ctx.save(); ctx.strokeStyle='rgba(255,210,63,0.9)'; ctx.lineWidth=3; ctx.shadowColor='#ffd23f'; ctx.shadowBlur=18;
      for(let i=0;i<N;i++){ if(tank[i]===glowTank){ const r=Math.floor(i/G), c=i%G; roundRect(PAD+c*CELL+2,PAD+r*CELL+2,CELL-4,CELL-4,7); ctx.stroke(); } }
      ctx.restore();
    }
    // column clues (top)
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let c=0;c<G;c++){
      const cx=PAD+c*CELL+CELL/2, cy=PAD*0.5;
      const ok=filledCol(c)===clue[c];
      ctx.save();
      ctx.fillStyle = ok ? '#5dffa6' : '#ff6b8a';
      if(ok){ ctx.shadowColor='#5dffa6'; ctx.shadowBlur=10; }
      ctx.font='800 '+Math.floor(PAD*0.7)+'px Segoe UI,sans-serif';
      ctx.fillText(clue[c], cx, cy); ctx.restore();
    }
    if(winPulse>0){ ctx.save(); ctx.globalAlpha=winPulse*0.5; ctx.fillStyle='#5dffa6'; ctx.fillRect(0,0,W,H); ctx.restore(); }
  }

  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  function frame(ts){
    const now=(typeof performance!=='undefined'?(ts!==undefined?ts:performance.now()):Date.now());
    let dt=(now-last)/1000; if(!(dt>0)||dt>0.05) dt=0.016; last=now;
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  newGame();

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;},
    get score(){return matchingCols();}, get target(){return G;},
    get match(){return matchingCols();}, get best(){return best;}, get elapsed(){return elapsed;},
    startAuto(){ setAuto(true); if(over){ newGame(); setAuto(true);} },
    toggleAuto(){ setAuto(!auto); },
    restart(){ newGame(); setAuto(false); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); }, tick(dt){ update(dt); render(); },
    tap(i){ const p=cc(i); handleTap(p[0],p[1]); },
    get solFilled(){return solFilled;}, get tank(){return tank;},
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get match(){return matchingCols();}, get target(){return G;}, get best(){return best;}
  };
})();
</script>
</body>
</html>
