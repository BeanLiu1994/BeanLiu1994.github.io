<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0f1f" />
<title>拔河 · Tug of War</title>
<style>
  :root{
    --bg:#0a0f1f; --surface:#121a30; --text:#eaf2ff; --muted:#7e90b3;
    --accent:#46e0c8; --accent2:#7c8cff; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#46e0c855; --dim:#243352;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #15233f 0%, transparent 60%),
                     radial-gradient(ellipse at 50% 100%, #0a1a30 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:460px;padding:12px;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .title-block h1{font-size:1.4rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--bad));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:60px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.p1 .value{color:var(--accent);}
  .score-card.p2 .value{color:var(--bad);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:var(--board,#07101e);}
  .toolbar{display:flex;gap:8px;margin-top:10px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  button.ghost{background:transparent;}
  .hint{text-align:center;color:var(--muted);font-size:0.72rem;margin-top:8px;line-height:1.5;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.7rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .overlay p{color:var(--muted);font-size:0.9rem;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>拔河 · TUG OF WAR</h1>
      <div class="sub">Pull · Strain · Win</div>
    </div>
    <div class="score-panel">
      <div class="score-card p1"><div class="label">我方</div><div class="value" id="pWin">0</div></div>
      <div class="score-card"><div class="label">用时</div><div class="value" id="time">0.0</div></div>
      <div class="score-card p2"><div class="label">敌方</div><div class="value" id="eWin">0</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">AUTO</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">胜利！</h2>
      <p id="ovText"></p>
      <button class="auto on" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="auto" id="autoBtn">自动游玩</button>
    <button class="ghost" id="restartBtn">重开</button>
  </div>
  <div class="hint">在屏幕上<b>按住或连点</b>发力把红标拉过对方界线 · 自动模式会全速拉拽帮你取胜</div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const cv=$('cv'), elPWin=$('pWin'), elEWin=$('eWin'), elTime=$('time'),
        elBadge=$('badge'), elOverlay=$('overlay'), elOvTitle=$('ovTitle'), elOvText=$('ovText'),
        btnAuto=$('autoBtn'), btnRestart=$('restartBtn'), btnOv=$('ovBtn');

  const W=420, H=320, bw=W, bh=H;
  let dpr=Math.min(2,(typeof devicePixelRatio!=='undefined'?devicePixelRatio||1:1));
  function setupCanvas(){
    if(!cv||!cv.getContext) return;
    cv.width=bw*dpr; cv.height=bh*dpr;
    cv.style.width=bw+'px'; cv.style.height=bh+'px'; cv.style.maxWidth='100%';
  }
  setupCanvas();
  const ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;

  // ---- state ----
  // pos in [-1,1]: -1 => left wins, +1 => right wins. 0 = center.
  let pos=0, leftForce=0, rightForce=0;
  let leftImp=0, holding=false;
  let cpuTimer=0, cpuPulling=false;
  let auto=false, autoTimer=0;
  let over=false, winner=null, won=false;
  let elapsed=0, roundTime=0;
  let pWins=0, eWins=0;
  let best=0;
  try{ best=parseInt(localStorage.getItem('tug_best')||'0',10)||0; }catch(e){best=0;}
  let shake=0;

  function newGame(){
    pos=0; leftForce=0; rightForce=0; leftImp=0; holding=false;
    cpuTimer=0; cpuPulling=false; over=false; winner=null; won=false;
    elapsed=0; roundTime=0; autoTimer=0.4; shake=0;
    elOverlay.classList.remove('show');
  }

  function win(side){
    over=true; winner=side; won=(side==='L');
    if(won) pWins++; else eWins++;
    roundTime=elapsed;
    if(won && (best===0||roundTime<best)){ best=roundTime; try{localStorage.setItem('tug_best',String(best));}catch(e){} }
    if(auto){
      elOvTitle.textContent='⚡ 自动取胜！'; elOvText.textContent='用时 '+roundTime.toFixed(1)+'s，继续下一局…';
      autoTimer=1.0;
    } else {
      elOvTitle.textContent= won?'🎉 胜利！':'💥 被反拉';
      elOvText.textContent='用时 '+roundTime.toFixed(1)+'s';
      elOverlay.classList.add('show');
    }
  }

  function setAuto(v){
    auto=v;
    if(btnAuto){ btnAuto.classList.toggle('on',v); btnAuto.textContent=v?'自动中…':'自动游玩'; }
    if(elBadge) elBadge.classList.toggle('show',v);
  }

  // ---- input ----
  function onDown(e){ if(over||auto) return; holding=true; leftImp=Math.min(2.4,leftImp+0.5); e.preventDefault&&e.preventDefault(); }
  function onUp(e){ holding=false; }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointerdown',onDown,{passive:false});
    window.addEventListener('pointerup',onUp,{passive:false});
    cv.addEventListener('touchstart',onDown,{passive:false});
    window.addEventListener('touchend',onUp,{passive:false});
  }
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto) return; setAuto(!auto); if(auto&&over){ newGame(); setAuto(true);} });
  btnRestart&&btnRestart.addEventListener('click',()=>{ newGame(); setAuto(false); });
  btnOv&&btnOv.addEventListener('click',()=>{ newGame(); setAuto(false); });

  // ---- update ----
  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  function update(dt){
    if(over){
      if(auto){ autoTimer-=dt; if(autoTimer<=0){ newGame(); setAuto(true); } }
      if(shake>0) shake=Math.max(0,shake-dt*2);
      return;
    }
    elapsed+=dt;
    // left (player) force
    let leftTarget;
    if(auto) leftTarget=1.35;
    else leftTarget=(holding?1.0:0);
    leftImp*=Math.pow(0.90, dt*60);
    const leftImpF=Math.min(1.4, leftImp*0.6);
    leftForce += ((leftTarget+leftImpF)-leftForce)*Math.min(1,dt*12);
    // right (cpu) force
    let rightTarget;
    if(auto){ rightTarget=0.95; }
    else {
      cpuTimer-=dt;
      if(cpuTimer<=0){ cpuPulling=!cpuPulling; cpuTimer=cpuPulling?0.12:0.10; }
      rightTarget=cpuPulling?1.0:0.12;
    }
    rightForce += (rightTarget-rightForce)*Math.min(1,dt*12);

    const K=0.62;
    pos += (rightForce-leftForce)*dt*K;
    pos=Math.max(-1.05,Math.min(1.05,pos));
    if(Math.abs(rightForce-leftForce)>0.5) shake=Math.min(1,Math.abs(rightForce-leftForce)/1.4);

    if(pos<=-1){ win('L'); shake=1; }
    else if(pos>=1){ win('R'); shake=1; }

    if(elPWin) elPWin.textContent=pWins;
    if(elEWin) elEWin.textContent=eWins;
    if(elTime) elTime.textContent=elapsed.toFixed(1);
  }

  // ---- render ----
  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,bw,bh);
    const ropeY=H*0.42;
    const lx=54, rx=W-54;
    const range=(rx-lx)*0.42;
    const mx=(lx+rx)/2 + pos*range;
    // ground
    ctx.fillStyle='rgba(124,140,255,0.05)'; ctx.fillRect(0,H*0.62,W,H*0.38);
    // center line + win zones
    ctx.strokeStyle='rgba(180,200,230,0.25)'; ctx.lineWidth=2; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo((lx+rx)/2,ropeY-40); ctx.lineTo((lx+rx)/2,ropeY+60); ctx.stroke(); ctx.setLineDash([]);
    // rope with sag
    const sag=18;
    const shx=(shake>0)?(Math.random()-0.5)*shake*6:0;
    ctx.strokeStyle='#caa46a'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.shadowColor='#caa46a'; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.moveTo(lx+shx,ropeY); ctx.quadraticCurveTo((lx+rx)/2,ropeY+sag,rx+shx,ropeY); ctx.stroke();
    ctx.shadowBlur=0;
    // marker (red flag)
    ctx.save(); ctx.shadowColor='#ff6b8a'; ctx.shadowBlur=14; ctx.fillStyle='#ff6b8a';
    ctx.beginPath(); ctx.arc(mx,ropeY,9,0,6.28); ctx.fill(); ctx.restore();
    // characters
    drawFighter(lx, ropeY, leftForce, true, shx);
    drawFighter(rx, ropeY, rightForce, false, shx);
    // force bars
    drawBar(20, ropeY-2, 10, H*0.3, leftForce, '#46e0c8');
    drawBar(W-30, ropeY-2, 10, H*0.3, rightForce, '#ff6b8a');
  }
  function drawFighter(x, y, force, isLeft, shx){
    const dir=isLeft?1:-1;
    const lean=Math.max(-0.5,Math.min(0.5, (isLeft?-force:force)*0.4));
    ctx.save(); ctx.translate(x+shx, y);
    ctx.strokeStyle=isLeft?'#46e0c8':'#ff6b8a'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.shadowColor=isLeft?'#46e0c8':'#ff6b8a'; ctx.shadowBlur=10;
    // body (lean back when pulling)
    const bx=0, by=0;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx - dir*Math.sin(lean)*26, by+30); ctx.stroke();
    // legs
    ctx.beginPath(); ctx.moveTo(bx - dir*Math.sin(lean)*26, by+30);
    ctx.lineTo(bx - dir*Math.sin(lean)*26 - dir*14, by+58); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx - dir*Math.sin(lean)*26, by+30);
    ctx.lineTo(bx - dir*Math.sin(lean)*26 + dir*14, by+58); ctx.stroke();
    // arms pulling rope
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx + dir*16, by+8); ctx.stroke();
    // head
    ctx.fillStyle=isLeft?'#46e0c8':'#ff6b8a';
    ctx.beginPath(); ctx.arc(bx - dir*Math.sin(lean)*26, by+30-0, 8,0,6.28); ctx.fill();
    ctx.restore();
  }
  function drawBar(x,y,w,h,force,col){
    ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(x,y,w,h);
    const f=Math.max(0,Math.min(1.4,force))/1.4;
    ctx.fillStyle=col; ctx.fillRect(x,y+h-h*f,w,h*f);
  }

  function frame(ts){
    const now=(typeof performance!=='undefined'?ts:(typeof performance!=='undefined'?performance.now():Date.now()));
    const dt=Math.min(0.05,((ts!==undefined?ts:now)-(last))/1000); last=(ts!==undefined?ts:now);
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  newGame();

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;}, get winner(){return winner;},
    get pos(){return pos;}, get pWins(){return pWins;}, get eWins(){return eWins;}, get best(){return best;},
    startAuto(){ setAuto(true); if(over){ newGame(); setAuto(true);} },
    toggleAuto(){ setAuto(!auto); },
    restart(){ newGame(); setAuto(false); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); },
    tick(dt){ update(dt); render(); },
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get winner(){return winner;}, get pos(){return pos;}, get pWins(){return pWins;}, get eWins(){return eWins;}
  };
})();
</script>
</body>
</html>
