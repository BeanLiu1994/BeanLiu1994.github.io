<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0f1f" />
<title>霓虹汉诺塔 · Neon Hanoi</title>
<style>
  :root{
    --bg:#080b18; --surface:#121a30; --text:#eaf2ff; --muted:#7e90b3;
    --accent:#46e0ff; --accent2:#b46bff; --gold:#ffd23f; --ok:#5dffa6; --bad:#ff6b8a;
    --glow:#46e0ff55; --dim:#243352;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse at 50% 0%, #18304a 0%, transparent 60%),
                     radial-gradient(ellipse at 50% 100%, #20103a 0%, transparent 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  .container{width:100%;max-width:460px;padding:10px;display:flex;flex-direction:column;gap:8px;height:100%;}
  .header{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .title-block h1{font-size:1.3rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .title-block .sub{font-size:0.5rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:3px;}
  .score-panel{display:flex;gap:6px;}
  .score-card{background:var(--surface);border:1px solid #ffffff0d;border-radius:10px;padding:4px 9px;text-align:center;min-width:50px;}
  .score-card .label{font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .score-card .value{font-size:0.98rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .score-card.s .value{color:var(--accent);}
  .score-card.t .value{color:var(--accent2);}
  .board-wrap{position:relative;background:var(--surface);border:1px solid #ffffff0d;border-radius:14px;padding:8px;
    box-shadow:0 0 40px #00000040,0 0 60px var(--glow);flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;}
  .board-wrap,.board-wrap *{touch-action:none;-webkit-touch-callout:none;}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#060c1c;max-height:100%;}
  .toolbar{display:flex;gap:8px;align-items:center;flex:0 0 auto;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;color:var(--text);
    padding:10px 14px;font-size:0.85rem;background:var(--surface);border:1px solid #ffffff14;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  button.auto{flex:1;}
  button.auto.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;border-color:transparent;box-shadow:0 0 18px var(--glow);}
  button.ghost{background:transparent;}
  .hint{text-align:center;color:var(--muted);font-size:0.68rem;line-height:1.4;flex:0 0 auto;}
  .hint b{color:var(--accent);}
  .overlay{position:absolute;inset:8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#04101acc;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:1.6rem;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;}
  .overlay p{color:var(--muted);font-size:0.9rem;text-align:center;}
  .badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;letter-spacing:1px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121d;opacity:0;transform:translateY(-6px);
    transition:opacity .3s,transform .3s;z-index:4;}
  .badge.show{opacity:1;transform:translateY(0);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0px var(--glow);}50%{box-shadow:0 0 16px var(--glow);}}

.ai-indicator{position:fixed;left:50%;top:8px;transform:translateX(-50%) translateY(-12px);display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;background:rgba(10,14,24,.84);border:1px solid rgba(79,156,255,.55);color:var(--text,#e6e6e6);font-size:.78rem;font-weight:600;letter-spacing:.3px;z-index:60;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 18px rgba(79,156,255,.35);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease,transform .3s ease;pointer-events:none;white-space:nowrap}
.ai-indicator.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent,#4f9cff);box-shadow:0 0 8px var(--accent,#4f9cff);animation:aiPulse .8s infinite}
@keyframes aiPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.55);opacity:.5}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block">
      <h1>霓虹汉诺塔 · HANOI</h1>
      <div class="sub">Move · Stack · Win</div>
    </div>
    <div class="score-panel">
      <div class="score-card s"><div class="label">步数</div><div class="value" id="moves">0</div></div>
      <div class="score-card t"><div class="label">最佳</div><div class="value" id="best">--</div></div>
      <div class="score-card"><div class="label">目标</div><div class="value" id="target">柱③</div></div>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">AUTO</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">胜利！</h2>
      <p id="ovText"></p>
      <button class="auto on" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="auto" id="autoBtn">自动游玩</button>
    <button class="ghost" id="restartBtn">重开</button>
  </div>
  <div class="hint">点<b>起始柱</b>再点<b>目标柱</b>移动顶部圆盘 · 大盘不能压小盘 · <b>自动模式</b>会用最优步数流畅搬运通关</div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const cv=$('cv'), elMoves=$('moves'), elBest=$('best'), elBadge=$('badge'),
        elOverlay=$('overlay'), elOvTitle=$('ovTitle'), elOvText=$('ovText'),
        btnAuto=$('autoBtn'), btnRestart=$('restartBtn'), btnOv=$('ovBtn');

  const W=420, H=360, N=4, TARGET=2;
  const COLORS=['#ff5db1','#ffd23f','#5dffa6','#46e0ff','#b46bff','#ff8a3f'];
  let dpr=Math.min(2,(typeof devicePixelRatio!=='undefined'?devicePixelRatio||1:1));
  function setupCanvas(){
    if(!cv||!cv.getContext) return;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px'; cv.style.maxWidth='100%';
  }
  setupCanvas();
  const ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;

  let pegs, selected, anim, moves, best, auto, over, won, autoQueue, autoTimer, autoDelay, invalidT, invalidPeg;
  try{ best=parseInt(localStorage.getItem('hanoi_best')||'0',10)||0; }catch(e){best=0;}

  function diskW(size){ const minW=46, maxW=128; return minW + (size-1)/(N-1)*(maxW-minW); }
  const DISKH=22, BASEY=H-26, PEGTOP=70, PEGX=[W*0.2, W*0.5, W*0.8];

  function newGame(){
    pegs=[[],[],[]];
    for(let s=N;s>=1;s--) pegs[0].push(s); // bottom..top
    selected=-1; anim=null; moves=0; over=false; won=false; autoQueue=[]; autoTimer=0; autoDelay=0; invalidT=0; invalidPeg=-1;
    elOverlay.classList.remove('show');
  }
  function setAuto(v){
    auto=v;
    if(btnAuto){ btnAuto.classList.toggle('on',v); btnAuto.textContent=v?'自动中…':'自动游玩'; }
    if(elBadge) elBadge.classList.toggle('show',v);
    if(v){ selected=-1; buildAutoQueue(); autoTimer=0; }
  }
  function buildAutoQueue(){
    autoQueue=[];
    (function h(n,from,to,aux){ if(n===0) return; h(n-1,from,aux,to); autoQueue.push([from,to]); h(n-1,aux,to,from); })(N,0,TARGET,1);
  }

  function topDisk(peg){ return pegs[peg].length?pegs[peg][pegs[peg].length-1]:0; }
  function restY(peg, k){ return BASEY - k*DISKH - DISKH/2; } // k = stack index from bottom

  function startMove(from,to){
    if(anim) return false;
    const d=pegs[from].pop();
    anim={disk:d, from, to, t:0, dur:0.42};
    return true;
  }

  function tryManualMove(to){
    if(anim||over||auto) return;
    if(selected<0){
      if(pegs[to].length>0){ selected=to; }
      return;
    }
    if(to===selected){ selected=-1; return; }
    const d=topDisk(selected);
    if(d>0 && (pegs[to].length===0 || d<topDisk(to))){
      if(startMove(selected,to)){ moves++; selected=-1; }
    } else {
      invalidT=0.4; invalidPeg=to; selected=-1;
    }
  }

  function winGame(){
    over=true; won=true;
    if(!auto){ if(best===0||moves<best){ best=moves; try{localStorage.setItem('hanoi_best',String(best));}catch(e){} } }
    if(auto){ autoDelay=1.0; elOvTitle.textContent='⚡ 自动通关！'; elOvText.textContent='最优 '+moves+' 步'; }
    else { elOvTitle.textContent='🎉 通关！'; elOvText.textContent='用了 '+moves+' 步（最优 '+(Math.pow(2,N)-1)+'）'; elOverlay.classList.add('show'); }
  }

  // ---- input ----
  function pointerToPeg(e){
    let x=PEGX[0];
    try{ const rect=cv.getBoundingClientRect(); const px=(typeof e.clientX==='number'?e.clientX:0); x=((px-rect.left)/rect.width)*W; }catch(err){}
    let bestP=0,bd=1e9; for(let p=0;p<3;p++){ const d=Math.abs(x-PEGX[p]); if(d<bd){bd=d;bestP=p;} }
    return bestP;
  }
  function onDown(e){
    if(over||auto) return;
    const p=pointerToPeg(e); tryManualMove(p);
    e.preventDefault&&e.preventDefault();
  }
  if(cv&&cv.addEventListener){
    cv.addEventListener('pointerdown',onDown,{passive:false});
    cv.addEventListener('touchstart',onDown,{passive:false});
  }
  btnAuto&&btnAuto.addEventListener('click',()=>{ if(over&&!auto){ newGame(); return; } setAuto(!auto); });
  btnRestart&&btnRestart.addEventListener('click',()=>{ newGame(); setAuto(false); });
  btnOv&&btnOv.addEventListener('click',()=>{ newGame(); setAuto(false); });

  // ---- update ----
  function update(dt){
    if(over){
      if(auto){ autoDelay-=dt; if(autoDelay<=0){ newGame(); setAuto(true);} }
      if(invalidT>0) invalidT=Math.max(0,invalidT-dt*2.5);
      return;
    }
    if(invalidT>0) invalidT=Math.max(0,invalidT-dt*2.5);
    if(anim){
      anim.t += dt/anim.dur;
      if(anim.t>=1){ pegs[anim.to].push(anim.disk); anim=null; checkWin(); }
      return;
    }
    if(auto && autoQueue.length>0){
      autoTimer+=dt;
      if(autoTimer>=0.18){ autoTimer=0; const [f,t]=autoQueue.shift(); if(startMove(f,t)) moves++; }
    }
    if(elMoves) elMoves.textContent=moves;
    if(elBest) elBest.textContent= best>0?best:'--';
  }
  function checkWin(){
    if(pegs[TARGET].length===N){ winGame(); }
  }

  // ---- render ----
  function ease(x){ return x<0.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2; }
  function render(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    // bg grid
    ctx.strokeStyle='rgba(70,224,255,0.05)'; ctx.lineWidth=1;
    for(let gx=0;gx<=W;gx+=42){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
    for(let gy=0;gy<=H;gy+=42){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
    // pegs
    for(let p=0;p<3;p++){
      const x=PEGX[p];
      const hot = (selected===p) || (invalidPeg===p && invalidT>0);
      ctx.save();
      ctx.strokeStyle= hot ? (invalidT>0?'#ff6b8a':'#ffd23f') : '#2a3a5e';
      ctx.lineWidth= hot?5:4; ctx.shadowColor= hot?(invalidT>0?'#ff6b8a':'#ffd23f'):'#46e0ff'; ctx.shadowBlur= hot?16:6;
      ctx.beginPath(); ctx.moveTo(x,BASEY); ctx.lineTo(x,PEGTOP-10); ctx.stroke();
      ctx.restore();
      // base
      ctx.fillStyle='#16294d'; ctx.fillRect(x-70,BASEY,140,8);
      // target marker
      if(p===TARGET){ ctx.fillStyle='rgba(93,255,166,0.5)'; ctx.font='bold 13px system-ui'; ctx.textAlign='center'; ctx.fillText('目标',x,BASEY+22); }
    }
    // disks on pegs
    for(let p=0;p<3;p++){
      for(let k=0;k<pegs[p].length;k++){
        const size=pegs[p][k];
        const lifted = (selected===p && k===pegs[p].length-1);
        const y = restY(p,k) - (lifted?14:0);
        drawDisk(PEGX[p], y, size, (selected===p));
      }
    }
    // animating disk
    if(anim){
      const x0=PEGX[anim.from], x1=PEGX[anim.to];
      const yBot0=restY(anim.from, pegs[anim.from].length), yBot1=restY(anim.to, pegs[anim.to].length);
      const yTop=PEGTOP-6;
      const e=ease(Math.min(1,anim.t));
      let x,y;
      if(anim.t<0.33){ const u=ease(anim.t/0.33); x=x0; y=yBot0+(yTop-yBot0)*u; }
      else if(anim.t<0.66){ const u=ease((anim.t-0.33)/0.33); x=x0+(x1-x0)*u; y=yTop; }
      else { const u=ease((anim.t-0.66)/0.34); x=x1; y=yTop+(yBot1-yTop)*u; }
      drawDisk(x,y,anim.disk,true);
    }
  }
  function drawDisk(x,y,size,glow){
    const w=diskW(size), h=DISKH-3;
    const col=COLORS[(size-1)%COLORS.length];
    ctx.save();
    if(glow){ ctx.shadowColor=col; ctx.shadowBlur=16; }
    const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
    g.addColorStop(0,col+'55'); g.addColorStop(0.5,col); g.addColorStop(1,col+'55');
    ctx.fillStyle=g;
    roundRect(x-w/2,y-h/2,w,h,7); ctx.fill();
    ctx.strokeStyle='#ffffff'; ctx.globalAlpha=0.45; ctx.lineWidth=1.2; roundRect(x-w/2,y-h/2,w,h,7); ctx.stroke();
    ctx.restore();
  }
  function roundRect(x,y,w,h,r){ if(!ctx) return; ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function frame(ts){
    const now=(typeof performance!=='undefined'?(ts!==undefined?ts:performance.now()):Date.now());
    let dt=(now-last)/1000; if(!(dt>0)||dt>0.05) dt=0.016; last=now;
    update(dt); render();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
  }
  let last=(typeof performance!=='undefined'?performance.now():Date.now());
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);

  newGame(); setAuto(false);

  window.game={
    get autoPlay(){return auto;}, set autoPlay(v){ setAuto(!!v); },
    get over(){return over;}, get won(){return won;},
    get score(){return moves;}, get remaining(){return N-pegs[TARGET].length;},
    get best(){return best;}, get moves(){return moves;},
    startAuto(){ setAuto(true); }, toggleAuto(){ setAuto(!auto); }, restart(){ newGame(); setAuto(false); }
  };
  window.__test={
    setAuto(v){ setAuto(!!v); },
    tick(dt){ update(dt); render(); },
    get over(){return over;}, get won(){return won;}, get autoPlay(){return auto;},
    get score(){return moves;}, get remaining(){return N-pegs[TARGET].length;}, get best(){return best;}, get moves(){return moves;},
    move(from,to){ tryManualMove(to); /* selects then moves in two calls */ },
    selectPeg(p){ tryManualMove(p); }
  };
})();
</script>
<div class="ai-indicator" id="ai-indicator"><span class="ai-dot"></span><span id="ai-status">AI 自动游玩中…</span></div>
<script>
(function(){
  var pill=document.getElementById('ai-indicator'); if(!pill) return;
  var status=document.getElementById('ai-status');
  var btn=document.getElementById('autoBtn')||document.getElementById('btn-auto')||document.getElementById('auto-toggle')||document.querySelector('[id*="auto" i]');
  function isAuto(){
    var g=window.game||window.Game||window.__test;
    if(g){ if(typeof g.autoPlay==='boolean') return g.autoPlay; if(typeof g.auto==='boolean') return g.auto; }
    if(btn) return btn.classList.contains('on');
    return false;
  }
  var last=null;
  function sync(){ var on=isAuto(); if(on===last) return; last=on; pill.classList.toggle('show',on); if(on&&status) status.textContent='AI 自动游玩中…'; }
  sync();
  if(btn){ try{ var mo=new MutationObserver(sync); mo.observe(btn,{attributes:true,attributeFilter:['class']}); }catch(e){} }
  setInterval(sync,200);
})();
</script>
</body>
</html>
