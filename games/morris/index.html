<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#07120e" />
<title>九子棋 · Nine Men's Morris</title>
<style>
  :root { --bg:#07120e; --surface:#0e1f18; --board:#0a1813; --text:#e6fff4; --muted:#7fae97;
    --p1:#5ce1ff; --p2:#ff7aa8; --accent:#54e08a; --danger:#ff6b6b; --gold:#ffd700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg);
    background-image: radial-gradient(ellipse at 50% 26%, #103a28 0%, transparent 55%), radial-gradient(ellipse at 50% 82%, #0c3322 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:560px; padding:12px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--p1),#b6ffcf,var(--p2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 10px; text-align:center; min-width:46px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.2rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .score-card.p1 .value { color:var(--p1); } .score-card.p2 .value { color:var(--p2); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000030, 0 0 70px #54e08a22; }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:auto; border-radius:10px; background:var(--board); }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#07120eee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; }
  .overlay-content h2 { font-size:1.9rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:14px; font-size:0.9rem; }
  .overlay.win h2 { color:var(--gold); } .overlay.lose h2 { color:var(--danger); }
  .controls { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:10px 12px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; text-align:center; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#031208; }
  .btn.primary:hover { box-shadow:0 0 20px #54e08a66; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#031208; animation:pg 2s infinite; --glow:#54e08a66; }
  @keyframes pg { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:18px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bk .8s infinite; }
  @keyframes bk { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:6px; font-size:0.7rem; color:var(--muted); }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
  .hint { text-align:center; font-size:0.7rem; color:var(--muted); margin-top:8px; }
  #turn-stat b { color:var(--text); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>九子棋</h1><div class="sub">N I N E &nbsp; M E N ' S &nbsp; M O R R I S</div></div>
    <div class="score-panel">
      <div class="score-card p1"><div class="label">Blue</div><div class="value" id="p1-val">9</div></div>
      <div class="score-card p2"><div class="label">Red</div><div class="value" id="p2-val">9</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="cv" width="560" height="560"></canvas>
    <div class="overlay win" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2 id="win-title">Blue Wins!</h2><p id="win-msg"></p><button class="btn primary" onclick="game.restart()">Play Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI thinking…</span></div>
  <div class="stats-bar"><span id="turn-stat">Turn: <b>Blue</b></span><span id="phase-stat">Placing</span><span id="best-stat">Auto: both AI</span></div>
  <div class="hint">Blue = you (tap to place / move). Form a row of 3 to remove a Red piece. Reduce Red to 2 to win.</div>
</div>
<script>
(function(){
  'use strict';
  const W=560, H=560, PAD=46, STEP=(W-2*PAD)/6;
  const canvas=document.getElementById('cv'); const ctx=canvas.getContext('2d');
  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
  const lerp=(a,b,t)=>a+(b-a)*t;
  const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

  const COORDS=[
    [0,0],[3,0],[6,0],[6,3],[6,6],[3,6],[0,6],[0,3],
    [1,1],[3,1],[5,1],[5,3],[5,5],[3,5],[1,5],[1,3],
    [2,2],[3,2],[4,2],[4,3],[4,4],[3,4],[2,4],[2,3]
  ];
  const ADJ=[
    [1,7,8],[0,2,9],[1,3,10],[2,4,11],[3,5,12],[4,6,13],[5,7,14],[6,0,15],
    [9,15,0,16],[8,10,1,17],[9,11,2,18],[10,12,3,19],[11,13,4,20],[12,14,5,21],[13,15,6,22],[14,8,7,23],
    [17,23,8],[16,18,9],[17,19,10],[18,20,11],[19,21,12],[20,22,13],[21,23,14],[22,16,15]
  ];
  const MILLS=[
    [0,1,2],[2,3,4],[4,5,6],[6,7,0],
    [8,9,10],[10,11,12],[12,13,14],[14,15,8],
    [16,17,18],[18,19,20],[20,21,22],[22,23,16],
    [0,8,16],[2,10,18],[4,12,20],[6,14,22],
    [1,9,17],[3,11,19],[5,13,21],[7,15,23]
  ];
  function g2p(i){ const [gx,gy]=COORDS[i]; return { x:PAD+gx*STEP, y:PAD+gy*STEP }; }

  // ---- pure logic ----
  function newState(){
    return { b:new Array(24).fill(0), turn:1, p1placed:0, p2placed:0, p1men:0, p2men:0 };
  }
  function cloneState(s){ return { b:s.b.slice(), turn:s.turn, p1placed:s.p1placed, p2placed:s.p2placed, p1men:s.p1men, p2men:s.p2men }; }
  function millsOf(s,p){
    let n=0;
    for(const [a,b,c] of MILLS){ if(s.b[a]===p&&s.b[b]===p&&s.b[c]===p) n++; }
    return n;
  }
  function millSet(s,p){
    const set=new Set();
    for(const [a,b,c] of MILLS){ if(s.b[a]===p&&s.b[b]===p&&s.b[c]===p){ set.add(a+','+b+','+c); } }
    return set;
  }
  function newMillFormed(before, after, to, p){
    const mb=millSet(before,p), ma=millSet(after,p);
    for(const m of ma){ if(!mb.has(m)){ const [a,b,c]=m.split(',').map(Number); if(a===to||b===to||c===to) return true; } }
    return false;
  }
  function removableOpp(s, opp){
    const cand=[]; for(let i=0;i<24;i++) if(s.b[i]===opp) cand.push(i);
    const notInMill=cand.filter(i=>{ for(const [a,b,c] of MILLS){ if((a===i||b===i||c===i)&&s.b[a]===opp&&s.b[b]===opp&&s.b[c]===opp) return false; } return true; });
    return notInMill.length? notInMill : cand;
  }
  function genMoves(s){
    const t=s.turn, opp=3-t;
    const placing = (t===1? s.p1placed : s.p2placed) < 9;
    const base=[];
    if(placing){
      for(let i=0;i<24;i++) if(s.b[i]===0) base.push({type:'place', from:null, to:i});
    } else {
      const flying = (t===1? s.p1men : s.p2men) === 3;
      for(let i=0;i<24;i++) if(s.b[i]===t){
        const tgts = flying ? range(24).filter(j=>s.b[j]===0) : ADJ[i].filter(j=>s.b[j]===0);
        for(const j of tgts) base.push({type:'move', from:i, to:j});
      }
    }
    const out=[];
    for(const m of base){
      const ns=cloneState(s);
      if(m.type==='place'){ ns.b[m.to]=t; if(t===1){ns.p1placed++;ns.p1men++;}else{ns.p2placed++;ns.p2men++;} }
      else { ns.b[m.to]=t; ns.b[m.from]=0; }
      if(newMillFormed(s, ns, m.to, t)){
        for(const r of removableOpp(ns, opp)) out.push({type:m.type, from:m.from, to:m.to, remove:r});
      } else {
        out.push({type:m.type, from:m.from, to:m.to, remove:null});
      }
    }
    // order: captures / mills first
    out.sort((a,b)=> (b.remove!=null?1:0)-(a.remove!=null?1:0));
    return out;
  }
  function applyMove(s, m){
    const ns=cloneState(s); const t=s.turn, opp=3-t;
    if(m.type==='place'){ ns.b[m.to]=t; if(t===1){ns.p1placed++;ns.p1men++;}else{ns.p2placed++;ns.p2men++;} }
    else { ns.b[m.to]=t; ns.b[m.from]=0; }
    if(m.remove!=null){ ns.b[m.remove]=0; if(opp===1)ns.p1men--; else ns.p2men--; }
    ns.turn=opp;
    return ns;
  }
  function range(n){ const a=[]; for(let i=0;i<n;i++)a.push(i); return a; }
  function potential(s,p){
    let n=0;
    for(const [a,b,c] of MILLS){ const v=[s.b[a],s.b[b],s.b[c]]; const cnt=v.filter(x=>x===p).length; const empty=v.filter(x=>x===0).length; if(cnt===2&&empty===1) n++; }
    return n;
  }
  function blockedOpp(s,p){
    // count opp men that have no move in move-phase (rough)
    const opp=3-p;
    if((opp===1?s.p1men:s.p2men)===3) return 0;
    let n=0;
    for(let i=0;i<24;i++) if(s.b[i]===opp){ if(ADJ[i].filter(j=>s.b[j]===0).length===0) n++; }
    return n;
  }
  function evaluate(s){
    if(s.p1men<=2) return 100000;
    if(s.p2men<=2) return -100000;
    let sc=0;
    sc += (s.p1men-s.p2men)*120;
    sc += (millsOf(s,1)-millsOf(s,2))*42;
    sc += (potential(s,1)-potential(s,2))*14;
    sc += (blockedOpp(s,1)-blockedOpp(s,2))*8;
    return sc;
  }
  function terminal(s){
    if(s.p1men<=2) return 100000;
    if(s.p2men<=2) return -100000;
    if(genMoves(s).length===0) return (s.turn===1)? -100000 : 100000;
    return null;
  }
  let _nodes=0;
  function mm(s, depth, alpha, beta){
    const t=terminal(s);
    if(t!==null) return t;
    if(depth===0 || _nodes>140000) return evaluate(s);
    _nodes++;
    const moves=genMoves(s);
    if(s.turn===1){
      let best=-1e9;
      for(const m of moves){ const ns=applyMove(s,m); const v=mm(ns,depth-1,alpha,beta); if(v>best)best=v; if(best>alpha)alpha=best; if(alpha>=beta)break; }
      return best;
    } else {
      let best=1e9;
      for(const m of moves){ const ns=applyMove(s,m); const v=mm(ns,depth-1,alpha,beta); if(v<best)best=v; if(best<beta)beta=best; if(alpha>=beta)break; }
      return best;
    }
  }
  function bestMove(s){
    _nodes=0;
    const depth=((s.turn===1?s.p1placed:s.p2placed)<9)?3:4;
    const moves=genMoves(s);
    let best=null, bestV=(s.turn===1)?-1e9:1e9;
    for(const m of moves){
      const ns=applyMove(s,m);
      const v=mm(ns, depth-1, -1e9, 1e9);
      if(s.turn===1){ if(v>bestV){bestV=v;best=m;} }
      else { if(v<bestV){bestV=v;best=m;} }
    }
    return best;
  }

  // ---- UI ----
  class Morris{
    constructor(){
      this.autoPlay=false; this.over=false; this.raf=null;
      this.loop=this.loop.bind(this);
      this.bind();
      this.restart();
      this.last=performance.now(); this.raf=requestAnimationFrame(this.loop);
    }
    el(id){ return document.getElementById(id); }
    bind(){
      const bw=this.el('board-wrap');
      bw.addEventListener('pointerdown',(e)=>{ e.preventDefault(); this.onPointer(e); });
    }
    restart(){
      this.state=newState(); this.over=false; this.win=null;
      this.selected=null; this.removing=null; this.removable=null;
      this.anim=null; this.fade=null; this._aiScheduled=false; this._aiTimer=0;
      this.hideOverlay('overlay-win');
      this.updateUI();
      if(this.autoPlay) this.afterTurn(false);
    }
    onPointer(e){
      if(this.autoPlay||this.over||this.anim) return;
      const rect=canvas.getBoundingClientRect();
      const x=(e.clientX-rect.left)*(W/rect.width);
      const y=(e.clientY-rect.top)*(H/rect.height);
      let hit=-1,bd=1e9;
      for(let i=0;i<24;i++){ const p=g2p(i); const d=(p.x-x)*(p.x-x)+(p.y-y)*(p.y-y); if(d<bd){bd=d;hit=i;} }
      if(bd> (STEP*0.45)*(STEP*0.45)) return;
      this.handleTap(hit);
    }
    handleTap(i){
      const s=this.state; const t=s.turn;
      if(t!==1) return; // human only controls blue in manual
      // removing phase
      if(this.removing){
        if(this.removable.includes(i)){ this.doRemoveAndFinish(i); }
        return;
      }
      const placing=(s.p1placed<9);
      if(placing){
        if(s.b[i]===0){ this.execMove({type:'place',from:null,to:i,remove:null}, false); }
      } else {
        const flying=(s.p1men===3);
        if(this.selected===null){
          if(s.b[i]===1) this.selected=i;
        } else {
          if(i===this.selected){ this.selected=null; return; }
          const ok = flying ? s.b[i]===0 : (s.b[i]===0 && ADJ[this.selected].includes(i));
          if(ok){ this.execMove({type:'move',from:this.selected,to:i,remove:null}, false); this.selected=null; }
          else if(s.b[i]===1){ this.selected=i; }
        }
      }
    }
    execMove(m, isAI){
      const s=this.state, t=s.turn;
      const fromXY = m.from!=null? g2p(m.from) : null;
      const toXY = g2p(m.to);
      this.selected=null;
      this.anim={ fromXY, toXY, to:m.to, from:m.from, player:t, start:performance.now(), dur:230 };
      this._pendingMove=m;
    }
    finishAnim(){
      const m=this._pendingMove; const s=this.state, t=s.turn, opp=3-t;
      if(m.type==='place'){ s.b[m.to]=t; if(t===1){s.p1placed++;s.p1men++;}else{s.p2placed++;s.p2men++;} }
      else { s.b[m.to]=t; s.b[m.from]=0; }
      s.turn = 3 - s.turn; // pass turn to opponent
      this.anim=null;
      // does it form a mill?
      const ns=cloneState(s);
      if(newMillFormed(s, ns, m.to, t)){
        if(this.autoPlay){
          const rem=removableOpp(s, opp);
          const r = rem[0];
          this.fade={ idx:r, start:performance.now(), dur:220 };
          s.b[r]=0; if(opp===1)s.p1men--; else s.p2men--;
          this.afterTurn(false);
        } else if(t===1){
          // human removal
          this.removable=removableOpp(s, opp);
          this.removing=true;
          this.updateUI();
          return;
        } else {
          const rem=removableOpp(s, opp); const r=rem[0];
          this.fade={ idx:r, start:performance.now(), dur:220 }; s.b[r]=0; if(opp===1)s.p1men--; else s.p2men--;
          this.afterTurn(false);
        }
      } else {
        this.afterTurn(false);
      }
    }
    doRemoveAndFinish(i){
      const s=this.state; const opp=2;
      this.fade={ idx:i, start:performance.now(), dur:220 };
      s.b[i]=0; s.p2men--;
      this.removing=false; this.removable=null;
      this.afterTurn(false);
    }
    afterTurn(skipAI){
      this.updateUI();
      // win checks only valid once both sides have finished placing
      const placed = this.state.p1placed===9 && this.state.p2placed===9;
      if(placed){
        if(this.state.p1men<=2){ this.endGame(2); return; }
        if(this.state.p2men<=2){ this.endGame(1); return; }
        const mv=genMoves(this.state);
        if(mv.length===0){ this.endGame(this.state.turn===1?2:1); return; }
      }
      this.updateUI();
      if(!skipAI && (this.autoPlay || this.state.turn===2)){
        this._aiScheduled=true; this._aiTimer=0;
        if(this.autoPlay) this.el('ai-status').textContent='AI thinking…';
      }
    }
    doAITurn(){
      const mv=bestMove(this.state);
      if(!mv){ this.afterTurn(true); return; }
      this.execMove(mv, true);
    }
    endGame(winner){
      this.over=true; this.win=winner;
      if(this.autoPlay) this.stopAuto();
      const o=this.el('overlay-win');
      this.el('win-title').textContent = winner===1? 'Blue Wins!' : 'Red Wins!';
      this.el('win-msg').textContent = winner===1? 'You reduced Red to 2 pieces.' : 'Red reduced you to 2 pieces.';
      o.classList.add('active'); o.classList.toggle('win', winner===1); o.classList.toggle('lose', winner===2);
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else this.startAuto(); }
    startAuto(){
      this.autoPlay=true;
      const b=this.el('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on');
      this.el('ai-indicator').style.display='flex';
      this.selected=null; this.removing=false; this.removable=null;
      if(this.over) this.restart(); else this.afterTurn(false);
    }
    stopAuto(){
      this.autoPlay=false;
      const b=this.el('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on');
      this.el('ai-indicator').style.display='none';
    }
    loop(now){
      try{
        const dt=Math.min(0.05,(now!==undefined)?((now-(this._last||now))/1000):0.016); this._last=now;
        this.update(dt); this.render(now);
      }catch(e){ console.error(e); }
      this.raf=requestAnimationFrame(this.loop);
    }
    update(dt){
      if(this.anim){
        const t=(performance.now()-this.anim.start)/this.anim.dur;
        if(t>=1) this.finishAnim();
      }
      if(this.fade){
        if((performance.now()-this.fade.start)/this.fade.dur>=1) this.fade=null;
      }
      if(this._aiScheduled && !this.over && !this.anim){
        this._aiTimer+=dt;
        if(this._aiTimer>0.5){ this._aiScheduled=false; this.doAITurn(); }
      }
    }
    render(now){
      ctx.clearRect(0,0,W,H);
      // edges
      ctx.strokeStyle='#2c5a45'; ctx.lineWidth=3;
      for(let i=0;i<24;i++) for(const j of ADJ[i]) if(j>i){ const a=g2p(i),b=g2p(j); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      // nodes
      for(let i=0;i<24;i++){
        const p=g2p(i);
        ctx.fillStyle='#0e1f18'; ctx.strokeStyle='#3a6e54'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(p.x,p.y,15,0,7); ctx.fill(); ctx.stroke();
      }
      // removable highlight
      if(this.removing){
        const pulse=0.5+0.5*Math.sin(now/120);
        for(const i of this.removable){ const p=g2p(i); ctx.strokeStyle='#ff6b6b'; ctx.lineWidth=3+pulse*2; ctx.beginPath(); ctx.arc(p.x,p.y,19,0,7); ctx.stroke(); }
      }
      // selected
      if(this.selected!=null){ const p=g2p(this.selected); ctx.strokeStyle='#ffd700'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(p.x,p.y,19,0,7); ctx.stroke(); }
      // men
      for(let i=0;i<24;i++){
        if(this.fade && this.fade.idx===i) continue;
        if(this.anim && this.anim.to===i) continue;
        if(this.anim && this.anim.from===i && this.anim.fromXY) continue;
        if(this.state.b[i]===0) continue;
        this.drawMan(g2p(i), this.state.b[i], now);
      }
      // moving man
      if(this.anim){
        let x,y;
        if(this.anim.fromXY){ const t=ease(clamp((now-this.anim.start)/this.anim.dur,0,1)); x=lerp(this.anim.fromXY.x,this.anim.toXY.x,t); y=lerp(this.anim.fromXY.y,this.anim.toXY.y,t)-Math.sin(t*Math.PI)*10; }
        else { const t=clamp((now-this.anim.start)/this.anim.dur,0,1); x=this.anim.toXY.x; y=this.anim.toXY.y+ (1-t)*14; }
        this.drawMan({x,y}, this.anim.player, now);
      }
      // fade man
      if(this.fade){ const p=g2p(this.fade.idx); const a=1-clamp((now-this.fade.start)/this.fade.dur,0,1); ctx.save(); ctx.globalAlpha=a; this.drawMan(p,this.state.b[this.fade.idx]||2,now); ctx.restore(); }
    }
    drawMan(p, player, now){
      const col=player===1?'#5ce1ff':'#ff7aa8';
      const pulse=0.5+0.5*Math.sin(now/200);
      ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=12+pulse*6;
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p.x,p.y,12,0,7); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='#07120e'; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7); ctx.fill();
      ctx.restore();
    }
    showOverlay(id){ const o=this.el(id); if(o) o.classList.add('active'); }
    hideOverlay(id){ const o=this.el(id); if(o) o.classList.remove('active'); }
    updateUI(){
      this.el('p1-val').textContent=this.state.p1men;
      this.el('p2-val').textContent=this.state.p2men;
      const s=this.state;
      const t=s.turn;
      this.el('turn-stat').innerHTML='Turn: <b style="color:'+(t===1?'#5ce1ff':'#ff7aa8')+'">'+(t===1?'Blue':'Red')+'</b>';
      const ph=(t===1?s.p1placed:s.p2placed)<9?'Placing':((t===1?s.p1men:s.p2men)===3?'Flying':'Moving');
      this.el('phase-stat').textContent=ph;
      this.el('best-stat').textContent=this.removing?'Tap a red piece to remove':(this.autoPlay?'Auto: both AI':'Your move (Blue)');
    }
  }
  window.game=new Morris();
})();
</script>
