<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a1a" />
<title>星际突围 · Asteroids</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#05060f; --text:#e0e0f0; --muted:#8888aa;
    --accent:#9b8cff; --accent-glow:#9b8cff66; --danger:#ff4d6a; --gold:#ffd700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg);
    background-image: radial-gradient(ellipse at 30% 20%, #1a1040 0%, transparent 55%), radial-gradient(ellipse at 70% 80%, #102a30 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:440px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),#c8b8ff,#9b8cff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 11px; text-align:center; min-width:48px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.05rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:auto; border-radius:10px; background:var(--board); cursor:crosshair; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:14px; z-index:10; pointer-events:none; opacity:0; transition:opacity .35s; }
  .overlay.active { opacity:1; pointer-events:auto; }
  .overlay-bg { position:absolute; inset:0; background:#0a0a1aee; backdrop-filter:blur(4px); border-radius:14px; }
  .overlay-content { position:relative; text-align:center; z-index:1; }
  .overlay-content h2 { font-size:1.9rem; font-weight:800; margin-bottom:6px; }
  .overlay-content p { color:var(--muted); margin-bottom:14px; font-size:0.9rem; }
  .overlay.win h2 { color:var(--gold); } .overlay.lose h2 { color:var(--danger); }
  .controls { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:10px 12px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; text-align:center; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#0a0a1a; }
  .btn.primary:hover { box-shadow:0 0 20px var(--accent-glow); }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#0a0a1a; animation:pg 2s infinite; --glow:var(--accent-glow); }
  @keyframes pg { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:18px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bk .8s infinite; }
  @keyframes bk { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:6px; font-size:0.7rem; color:var(--muted); }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>星际突围</h1><div class="sub">A S T E R O I D S</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="cv" width="420" height="520"></canvas>
    <div class="overlay win" id="overlay-win"><div class="overlay-bg"></div><div class="overlay-content"><h2 id="win-title">Wave Cleared!</h2><p id="win-msg"></p><button class="btn primary" onclick="game.restart()">Next Wave</button></div></div>
    <div class="overlay lose" id="overlay-lose"><div class="overlay-bg"></div><div class="overlay-content"><h2>Game Over</h2><p id="lose-msg"></p><button class="btn primary" onclick="game.restart()">Try Again</button></div></div>
  </div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI piloting...</span></div>
  <div class="stats-bar"><span id="wave-stat">Wave: 1</span><span id="lives-stat">Lives: ♥♥♥</span></div>
</div>
<script>
(function(){
  'use strict';
  const W=420, H=520, SHIPR=12;
  const canvas=document.getElementById('cv');
  const ctx=canvas.getContext('2d');
  const TURN=0.075, THRUST=0.16, FRIC=0.992, MAXS=4.2, BSPEED=7;
  const RAD={1:16,2:26,3:38};
  const SCORE={1:20,2:50,3:100};
  function norm(a){ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; }
  function mkAst(size,x,y,vx,vy){
    const n=8+Math.floor(Math.random()*4);
    const v=[];
    for(let i=0;i<n;i++) v.push(0.7+Math.random()*0.5);
    return {x:x,y:y,vx:vx,vy:vy,size:size,r:RAD[size],rot:Math.random()*7,vrot:(Math.random()*2-1)*0.03,verts:v};
  }
  function g(id){ return document.getElementById(id); }

  class Ast {
    constructor(){
      this.best=parseInt(localStorage.getItem('astBest')||'0');
      this.autoPlay=false; this.last=0; this.raf=null; this.over=false; this.won=false;
      this.pdx=W/2; this.pdy=H/2; this.pdown=false;
      this.loop=this.loop.bind(this);
      this.bind();
      this.restart();
      this.last=performance.now();
      this.raf=requestAnimationFrame(this.loop);
    }
    restart(){
      this.stopAuto();
      this.score=0; this.lives=3; this.wave=1; this.over=false; this.won=false;
      this.ship={x:W/2,y:H/2,angle:-Math.PI/2,vx:0,vy:0,inv:90};
      this.bullets=[]; this.asts=[]; this.cool=0;
      g('overlay-win').classList.remove('active');
      g('overlay-lose').classList.remove('active');
      this.spawn(this.wave);
      this.updateUI();
    }
    spawn(w){
      const n=2+w;
      for(let i=0;i<n;i++){
        const edge=Math.floor(Math.random()*4);
        let x,y;
        if(edge===0){ x=Math.random()*W; y=-30; }
        else if(edge===1){ x=W+30; y=Math.random()*H; }
        else if(edge===2){ x=Math.random()*W; y=H+30; }
        else { x=-30; y=Math.random()*H; }
        const ang=Math.random()*7, sp=0.6+Math.random()*0.7;
        this.asts.push(mkAst(3,x,y,Math.cos(ang)*sp,Math.sin(ang)*sp));
      }
    }
    nearest(){
      let best=null, bd=1e9;
      for(const a of this.asts){
        const d=(a.x-this.ship.x)*(a.x-this.ship.x)+(a.y-this.ship.y)*(a.y-this.ship.y);
        if(d<bd){ bd=d; best=a; }
      }
      return best;
    }
    fire(){
      if(this.cool>0) return;
      const a=this.ship.angle;
      this.bullets.push({x:this.ship.x+Math.cos(a)*SHIPR, y:this.ship.y+Math.sin(a)*SHIPR, vx:Math.cos(a)*BSPEED, vy:Math.sin(a)*BSPEED, life:60});
      this.cool=14;
    }
    updateUI(){
      g('score').textContent=this.score;
      g('best').textContent=this.best;
      g('wave-stat').textContent='Wave: '+this.wave;
      g('lives-stat').textContent='Lives: '+('♥'.repeat(this.lives)||'—');
    }
    step(dt){
      if(this.over) return;
      const s=this.ship;
      let ta;
      if(this.autoPlay){
        const t=this.nearest();
        ta = t ? Math.atan2(t.y-s.y, t.x-s.x) : -Math.PI/2;
      } else {
        ta=Math.atan2(this.pdy-s.y, this.pdx-s.x);
      }
      const diff=norm(ta-s.angle);
      const turn=Math.max(-TURN*dt, Math.min(TURN*dt, diff));
      s.angle+=turn;
      let thrust=false;
      if(this.autoPlay){
        const t=this.nearest();
        if(t){ const d=Math.hypot(t.x-s.x, t.y-s.y); thrust = d>55 && d<270; }
        if(s.x<70||s.x>W-70||s.y<70||s.y>H-70) thrust=true;
      } else {
        thrust=this.pdown;
      }
      if(thrust){
        s.vx+=Math.cos(s.angle)*THRUST*dt;
        s.vy+=Math.sin(s.angle)*THRUST*dt;
      }
      s.vx*=Math.pow(FRIC,dt);
      s.vy*=Math.pow(FRIC,dt);
      const sp=Math.hypot(s.vx,s.vy);
      if(sp>MAXS){ s.vx*=MAXS/sp; s.vy*=MAXS/sp; }
      s.x+=s.vx*dt; s.y+=s.vy*dt;
      if(s.x<0)s.x+=W; if(s.x>W)s.x-=W;
      if(s.y<0)s.y+=H; if(s.y>H)s.y-=H;
      if(s.inv>0)s.inv-=dt;
      const aligned=Math.abs(norm(ta-s.angle))<0.3;
      if(this.cool>0)this.cool-=dt;
      if(aligned && this.cool<=0) this.fire();
      // bullets
      for(let i=this.bullets.length-1;i>=0;i--){
        const b=this.bullets[i];
        b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
        if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H) this.bullets.splice(i,1);
      }
      // asteroids
      for(const a of this.asts){
        a.x+=a.vx*dt; a.y+=a.vy*dt; a.rot+=a.vrot*dt;
        if(a.x<0)a.x+=W; if(a.x>W)a.x-=W;
        if(a.y<0)a.y+=H; if(a.y>H)a.y-=H;
      }
      // bullet vs asteroid
      for(let i=this.bullets.length-1;i>=0;i--){
        const b=this.bullets[i];
        for(let j=this.asts.length-1;j>=0;j--){
          const a=this.asts[j];
          const dx=a.x-b.x, dy=a.y-b.y;
          if(dx*dx+dy*dy < (a.r+2)*(a.r+2)){
            this.score+=SCORE[a.size];
            this.bullets.splice(i,1);
            this.asts.splice(j,1);
            if(a.size>1){
              const ang=Math.atan2(a.vy,a.vx);
              const spd=Math.hypot(a.vx,a.vy)+0.4;
              this.asts.push(mkAst(a.size-1, a.x, a.y, Math.cos(ang+0.7)*spd, Math.sin(ang+0.7)*spd));
              this.asts.push(mkAst(a.size-1, a.x, a.y, Math.cos(ang-0.7)*spd, Math.sin(ang-0.7)*spd));
            }
            break;
          }
        }
      }
      // asteroid vs ship
      if(s.inv<=0){
        for(const a of this.asts){
          const dx=a.x-s.x, dy=a.y-s.y;
          if(dx*dx+dy*dy < (a.r+SHIPR)*(a.r+SHIPR)){
            this.lives--;
            this.updateUI();
            if(this.lives<=0){ this.over=true; this.gameOver(); }
            else { s.x=W/2; s.y=H/2; s.vx=0; s.vy=0; s.angle=-Math.PI/2; s.inv=90; }
            break;
          }
        }
      }
      // wave cleared
      if(!this.over && this.asts.length===0){
        this.wave++;
        if(this.wave>6){ this.won=true; this.over=true; this.win(); }
        else {
          this.spawn(this.wave);
          g('win-title').textContent='Wave '+this.wave;
          g('win-msg').textContent='Score '+this.score;
          g('overlay-win').classList.add('active');
          setTimeout(()=>{ g('overlay-win').classList.remove('active'); }, 900);
        }
      }
      this.updateUI();
    }
    gameOver(){
      if(this.autoPlay) this.stopAuto();
      if(this.score>this.best){ this.best=this.score; localStorage.setItem('astBest',String(this.best)); }
      g('lose-msg').textContent='Score '+this.score;
      g('overlay-lose').classList.add('active');
    }
    win(){
      if(this.autoPlay) this.stopAuto();
      if(this.score>this.best){ this.best=this.score; localStorage.setItem('astBest',String(this.best)); }
      g('win-msg').textContent='You cleared all waves! Score '+this.score;
      g('overlay-win').classList.add('active');
    }
    loop(now){
      const dt=Math.max(0.3, Math.min(2.4, (now-this.last)/16.67));
      this.last=now;
      if(g('overlay-win').classList.contains('active') && !this.won){
        this.draw();
        this.raf=requestAnimationFrame(this.loop);
        return;
      }
      this.step(dt);
      this.draw();
      this.raf=requestAnimationFrame(this.loop);
    }
    draw(){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#ffffff';
      for(let i=0;i<40;i++){
        const x=(i*97.3)%W, y=(i*61.7)%H;
        ctx.globalAlpha=0.25+0.2*Math.sin(i*1.3);
        ctx.fillRect(x,y,1.5,1.5);
      }
      ctx.globalAlpha=1;
      for(const a of this.asts){
        ctx.save();
        ctx.translate(a.x,a.y);
        ctx.rotate(a.rot);
        ctx.strokeStyle='#9b8cff'; ctx.lineWidth=2;
        ctx.shadowColor='#9b8cff'; ctx.shadowBlur=8;
        ctx.beginPath();
        const n=a.verts.length;
        for(let i=0;i<=n;i++){
          const k=i%n, ang=Math.PI*2*k/n, r=a.r*a.verts[k];
          const x=Math.cos(ang)*r, y=Math.sin(ang)*r;
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.closePath(); ctx.stroke(); ctx.shadowBlur=0;
        ctx.restore();
      }
      ctx.fillStyle='#ffd700';
      for(const b of this.bullets){
        ctx.beginPath(); ctx.arc(b.x,b.y,2.5,0,7); ctx.fill();
      }
      const s=this.ship;
      if(s.inv<=0 || Math.floor(performance.now()/100)%2===0){
        ctx.save();
        ctx.translate(s.x,s.y);
        ctx.rotate(s.angle);
        ctx.fillStyle='#c8b8ff';
        ctx.shadowColor='#9b8cff'; ctx.shadowBlur=10;
        ctx.beginPath();
        ctx.moveTo(SHIPR,0);
        ctx.lineTo(-SHIPR*0.8,-SHIPR*0.7);
        ctx.lineTo(-SHIPR*0.4,0);
        ctx.lineTo(-SHIPR*0.8,SHIPR*0.7);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur=0; ctx.restore();
      }
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=g('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); g('ai-indicator').style.display='flex'; g('ai-status').textContent='AI piloting ship'; }
    stopAuto(){ this.autoPlay=false; const b=g('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); g('ai-indicator').style.display='none'; }
    bind(){
      const setp=(e)=>{
        const r=canvas.getBoundingClientRect();
        this.pdx=(e.clientX-r.left)/r.width*W;
        this.pdy=(e.clientY-r.top)/r.height*H;
      };
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); this.pdown=true; setp(e); });
      canvas.addEventListener('pointermove',(e)=>{ setp(e); });
      canvas.addEventListener('pointerup',()=>{ this.pdown=false; });
      canvas.addEventListener('pointercancel',()=>{ this.pdown=false; });
      canvas.addEventListener('pointerleave',()=>{ this.pdown=false; });
    }
  }
  window.game=new Ast();
})();
</script>
</body>
</html>
