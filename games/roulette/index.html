<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>霓虹幸运转盘 · Roulette</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0b1024; --text:#e0e0f0; --muted:#8888aa;
    --accent:#ff5d8a; --accent-glow:#ff5d8a66; --danger:#ff5d8a; --gold:#ffd700; --green:#3ecf8e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg);
    background-image: radial-gradient(ellipse at 50% 0%, #301028 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #102844 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .title-block h1 { font-size:1.6rem; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),#ffa6c4,#ff5d8a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:5px 12px; text-align:center; min-width:74px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:2px; }
  .score-card .value { font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .score-card.bal .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:8px; box-shadow:0 0 40px #00000030, 0 0 70px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:auto; border-radius:10px; background:var(--board); cursor:pointer; }
  .controls { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:62px; padding:9px 6px; border:1px solid #ffffff12; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.78rem; font-weight:600; cursor:pointer; transition:all .2s; text-align:center; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.96); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#1a0410; }
  .btn.sel { border-color:var(--gold); color:var(--gold); box-shadow:0 0 12px #ffd70044; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#1a0410; animation:pg 2s infinite; --glow:var(--accent-glow); }
  @keyframes pg { 0%,100%{box-shadow:0 0 8px var(--glow,transparent);} 50%{box-shadow:0 0 22px var(--glow,transparent),0 0 40px var(--glow,transparent);} }
  .ai-indicator { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.75rem; color:var(--muted); justify-content:center; min-height:18px; }
  .ai-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bk .8s infinite; }
  @keyframes bk { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
  .stats-bar { display:flex; gap:8px; justify-content:center; margin-top:6px; font-size:0.7rem; color:var(--muted); flex-wrap:wrap; }
  .stats-bar span { background:var(--surface); padding:3px 8px; border-radius:6px; border:1px solid #ffffff08; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>幸运转盘</h1><div class="sub">N E O N &nbsp; R O U L E T T E</div></div>
    <div class="score-panel">
      <div class="score-card bal"><div class="label">Balance</div><div class="value" id="score-bal">1000</div></div>
      <div class="score-card"><div class="label">Win</div><div class="value" id="score-win">0</div></div>
    </div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="cv" width="460" height="460"></canvas>
  </div>
  <div class="controls">
    <button class="btn sel" id="bet-red" onclick="game.setBet('red')">红 Red</button>
    <button class="btn" id="bet-black" onclick="game.setBet('black')">黑 Black</button>
    <button class="btn" id="bet-odd" onclick="game.setBet('odd')">单 Odd</button>
    <button class="btn" id="bet-even" onclick="game.setBet('even')">双 Even</button>
    <button class="btn primary" id="btn-spin" onclick="game.spin()">Spin</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="ai-indicator" id="ai-indicator" style="display:none"><div class="ai-dot"></div><span id="ai-status">AI is spinning…</span></div>
  <div class="stats-bar"><span id="best-stat">Best: 1000</span><span id="last-stat">Last: —</span></div>
</div>
<script>
(function(){
  'use strict';
  const W=460, H=460, CX=W/2, CY=H/2, R=200, NP=37;
  const canvas=document.getElementById('cv'); const ctx=canvas.getContext('2d');
  // standard European roulette colors
  const RED=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
  const isRed=(n)=> n>0 && RED.indexOf(n)>=0;
  const pocketColor=(n)=> n===0?'#3ecf8e':(isRed(n)?'#ff5d8a':'#2b3358');
  const easeOut=(t)=> 1-Math.pow(1-t,3);

  class Roulette {
    constructor(){
      this.autoPlay=false; this.last=0; this.raf=null;
      this.balance=1000; this.best=1000; this.wins=0; this.betType='red'; this.betAmt=50;
      this.wheelAngle=0; this.ballAngle=-Math.PI/2; this.ballR=R-26;
      this.phase='idle'; this.spinT=0; this.spinDur=170; this.target=0;
      this.startWheel=0; this.totalWheel=0; this.spinExtra=0; this.result=null; this.flash=0;
      this.loop=this.loop.bind(this);
      this.idleTimer=0;
      this.last=performance.now(); this.raf=requestAnimationFrame(this.loop);
    }
    loadBest(){ try{ return parseInt(localStorage.getItem('roulette_best')||'1000')||1000; }catch(e){ return 1000; } }
    saveBest(){ try{ localStorage.setItem('roulette_best', String(this.best)); }catch(e){} }
    setBet(t){ if(this.phase!=='idle'&&!this.autoPlay) {} this.betType=t;
      ['red','black','odd','even'].forEach(b=>{ const e=document.getElementById('bet-'+b); if(e) e.classList.toggle('sel', b===t); }); }
    spin(){
      if(this.phase!=='idle') return;
      if(this.balance < this.betAmt){ this.betAmt=Math.min(this.betAmt, this.balance); }
      if(this.balance<=0){ this.restart(); }
      this.target=(Math.random()*NP)|0;
      this.startWheel=this.wheelAngle;
      const finalWheel = (-this.target*(2*Math.PI/NP));
      let delta = ((finalWheel - this.startWheel)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
      this.totalWheel = 6*2*Math.PI + delta;
      this.spinExtra = 9*2*Math.PI;
      this.spinT=0; this.phase='spin'; this.result=null; this.flash=0;
    }
    resolve(){
      const n=this.target; const win = this.checkWin(n);
      if(win){ this.balance += this.betAmt; this.wins++; if(this.autoPlay) this.betAmt=50; }
      else { this.balance -= this.betAmt;
        if(this.autoPlay){ this.betAmt=Math.min(this.betAmt*2, this.balance, 400); if(this.betAmt<50) this.betAmt=50; } }
      if(this.balance>this.best){ this.best=this.balance; this.saveBest(); }
      const col = n===0?'Green':(isRed(n)?'Red':'Black');
      const nm = n===0?'0':(col);
      document.getElementById('score-bal').textContent=this.balance;
      document.getElementById('score-win').textContent=this.wins;
      document.getElementById('last-stat').textContent='Last: '+nm+' '+(win?'+'+this.betAmt:'-'+(this.betAmt));
      document.getElementById('best-stat').textContent='Best: '+this.best;
      this.result={n, win}; this.flash=1; this.phase='idle';
    }
    checkWin(n){
      const b=this.betType;
      if(b==='red') return isRed(n);
      if(b==='black') return n>0 && !isRed(n);
      if(b==='odd') return n>0 && n%2===1;
      if(b==='even') return n>0 && n%2===0;
      return false;
    }
    step(dt){
      if(this.flash>0) this.flash=Math.max(0,this.flash-dt*0.02);
      if(this.phase==='spin'){
        this.spinT += dt;
        const t=Math.min(1, this.spinT/this.spinDur);
        const e=easeOut(t);
        this.wheelAngle = this.startWheel + this.totalWheel*e;
        this.ballAngle = -Math.PI/2 + (1-e)*this.spinExtra;
        this.ballR = R-26 + Math.sin(e*Math.PI)*0 ; // stays on rim
        if(t>=1){ this.ballAngle=-Math.PI/2; this.resolve(); }
      } else if(this.autoPlay){
        this.idleTimer -= dt;
        if(this.idleTimer<=0){
          // AI picks a bet and spins
          this.betType = (Math.random()<0.5)?'red':'black';
          this.spin();
          this.idleTimer = 26;
        }
      }
    }
    loop(now){
      const dt=Math.max(0.4,Math.min(2.2,(now-this.last)/16.67)); this.last=now;
      this.step(dt); this.draw();
      this.raf=requestAnimationFrame(this.loop);
    }
    draw(){
      ctx.clearRect(0,0,W,H);
      ctx.save(); ctx.translate(CX,CY);
      // outer ring
      ctx.beginPath(); ctx.arc(0,0,R+14,0,7); ctx.fillStyle='#0b1024'; ctx.fill();
      ctx.lineWidth=4; ctx.strokeStyle='#2a3358'; ctx.stroke();
      // pockets
      for(let i=0;i<NP;i++){
        const a=this.wheelAngle + i*(2*Math.PI/NP) - Math.PI/2;
        const a2=this.wheelAngle + (i+1)*(2*Math.PI/NP) - Math.PI/2;
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.arc(0,0,R, a, a2); ctx.closePath();
        const c=pocketColor(i);
        ctx.fillStyle = (this.result && this.target===i && this.flash>0)? '#ffd700' : c;
        ctx.fill();
        ctx.strokeStyle='#0b1024'; ctx.lineWidth=1.5; ctx.stroke();
        // number
        const am=(a+a2)/2; const rx=Math.cos(am)*(R*0.84), ry=Math.sin(am)*(R*0.84);
        ctx.save(); ctx.translate(rx,ry); ctx.rotate(am+Math.PI/2);
        ctx.fillStyle = (i===0)?'#04140c':'#e9ecff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(String(i),0,0); ctx.restore();
      }
      // hub
      ctx.beginPath(); ctx.arc(0,0,R*0.22,0,7); ctx.fillStyle='#1a1f3a'; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle='#3a4478'; ctx.stroke();
      // ball
      const bx=Math.cos(this.ballAngle)*this.ballR, by=Math.sin(this.ballAngle)*this.ballR;
      ctx.shadowColor='#ffffff'; ctx.shadowBlur=14; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(bx,by,9,0,7); ctx.fill(); ctx.shadowBlur=0;
      // pointer at top
      ctx.fillStyle=this.flash>0?'#ffd700':'#ff5d8a';
      ctx.beginPath(); ctx.moveTo(0,-(R+14)); ctx.lineTo(-9,-(R+2)); ctx.lineTo(9,-(R+2)); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else this.startAuto(); }
    startAuto(){ this.autoPlay=true; this.betAmt=50; this.idleTimer=10;
      const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on');
      const ind=document.getElementById('ai-indicator'); if(ind) ind.style.display='flex';
      document.getElementById('ai-status').textContent='AI is spinning ('+(this.betType==='red'?'Red':'Black')+')'; }
    stopAuto(){ this.autoPlay=false;
      const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on');
      const ind=document.getElementById('ai-indicator'); if(ind) ind.style.display='none'; }
    restart(){ this.stopAuto(); this.balance=1000; this.betAmt=50; this.wins=0; this.phase='idle'; this.result=null; this.flash=0;
      document.getElementById('score-bal').textContent=this.balance; document.getElementById('score-win').textContent=this.wins;
      document.getElementById('last-stat').textContent='Last: —'; }
  }
  window.game=new Roulette();
})();
</script>
</body>
</html>
