<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>钻石矿工 · Diamond Dash</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#4dfff0; --accent-glow:#4dfff066; --gold:#ffd54a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 18% 12%, #0f2a2a 0%, transparent 55%), radial-gradient(ellipse at 82% 88%, #2a1038 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#4dfff0,#4d9bff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#062028; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#062028; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>钻石矿工</h1><div class="sub">D I A M O N D &nbsp; D A S H</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">钻石</div><div class="value" id="progress">0/10</div></div>
      <div class="score-card best"><div class="label">通关</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="460" height="360"></canvas></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">新矿洞</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">滑动/方向键移动矿工穿行、绕开巨石、捡钻石；集满 10 颗后出口开启，前往绿色出口逃脱。</div>
</div>
<script>
(function(){
  'use strict';
  const R=13, C=17;
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const progEl=document.getElementById('progress'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  const DIRS=[[-1,0],[1,0],[0,-1],[0,1]];
  class Dash {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0; this.tweens={}; this.pTween=null; this.swipe=null;
      this.best=parseInt(localStorage.getItem('dashBest')||'0'); bestEl.textContent=this.best;
      this.fit(); window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); if(this.autoPlay) return; const rect=canvas.getBoundingClientRect(); this.swipe={x:(e.clientX-rect.left)*(this.W/rect.width),y:(e.clientY-rect.top)*(this.W/rect.height),sx:this.swipe?0:0}; this.swipe.sx=(e.clientX-rect.left)*(this.W/rect.width); this.swipe.sy=(e.clientY-rect.top)*(this.W/rect.height); });
      canvas.addEventListener('pointerup',(e)=>{ if(this.autoPlay||!this.swipe) return; const rect=canvas.getBoundingClientRect(); const ex=(e.clientX-rect.left)*(this.W/rect.width), ey=(e.clientY-rect.top)*(this.W/rect.height); const dx=ex-this.swipe.sx, dy=ey-this.swipe.sy; if(Math.hypot(dx,dy)>this.cell*0.4){ if(Math.abs(dx)>Math.abs(dy)) this.move(0,dx>0?1:-1); else this.move(dy>0?1:-1,0); } else { // tap adjacent: move toward tap
        const cx=this.pc+Math.sign(ex/this.cell-this.pc), cy=this.pr+Math.sign(ey/this.cell-this.pr); if(Math.abs(ex/this.cell-this.pc)>Math.abs(ey/this.cell-this.pr)) this.move(0,Math.sign(ex/this.cell-this.pc)); else this.move(Math.sign(ey/this.cell-this.pr),0); }
        this.swipe=null; });
      window.addEventListener('keydown',(e)=>{ if(this.autoPlay) return; const k=e.key; if(k==='ArrowUp')this.move(-1,0); else if(k==='ArrowDown')this.move(1,0); else if(k==='ArrowLeft')this.move(0,-1); else if(k==='ArrowRight')this.move(0,1); });
      this.restart(); this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(280,Math.min(rect.width||460,460)); const dpr=window.devicePixelRatio||1; this.W=w; this.cell=w/C; this.H=this.cell*R; canvas.width=w*dpr; canvas.height=this.H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    genLevel(){ this.grid=Array.from({length:R},()=>new Array(C).fill(1)); this.target=10;
      // walls border
      for(let r=0;r<R;r++){ this.grid[r][0]=4; this.grid[r][C-1]=4; }
      for(let c=0;c<C;c++){ this.grid[0][c]=4; this.grid[R-1][c]=4; }
      // player start (bottom-left) cleared to empty
      this.grid[R-2][1]=0; this.grid[R-2][2]=0; this.grid[R-3][1]=0; this.pr=R-2; this.pc=1;
      // exit (top-right): closed until gems collected
      this.exit={r:1,c:C-2}; this.grid[1][C-2]=6; this.grid[1][C-3]=0; this.grid[2][C-2]=0;
      // gems on random interior dirt cells
      let placed=0, need=this.target+4, tries=0;
      while(placed<need && tries<3000){ tries++; const r=1+((Math.random()*(R-2))|0), c=1+((Math.random()*(C-2))|0);
        if(this.grid[r][c]===1 && !(r===this.pr&&c===this.pc) && !(r===this.exit.r&&c===this.exit.c)){ this.grid[r][c]=3; placed++; } }
      // boulders: only where the level stays solvable (rocks are static obstacles)
      let rocks=0, attempts=0;
      while(rocks<14 && attempts<500){ attempts++; const r=1+((Math.random()*(R-2))|0), c=1+((Math.random()*(C-2))|0);
        if(this.grid[r][c]!==1) continue; if(r===this.pr&&c===this.pc) continue;
        this.grid[r][c]=2; if(this.reachableAll()) rocks++; else this.grid[r][c]=1; }
      this.gems=0; this.tweens={}; this.pTween=null;
    }
    reachableAll(){ const dist=Array.from({length:R},()=>new Array(C).fill(-1)); const q=[[this.pr,this.pc]]; dist[this.pr][this.pc]=0; let h=0;
      while(h<q.length){ const [r,c]=q[h++]; for(const [dr,dc] of DIRS){ const nr=r+dr,nc=c+dc; if(nr<0||nr>=R||nc<0||nc>=C) continue; if(dist[nr][nc]!==-1) continue; const v=this.grid[nr][nc]; if(v===0||v===1||v===3||v===7||v===6){ dist[nr][nc]=dist[r][c]+1; q.push([nr,nc]); } } }
      for(let r=0;r<R;r++)for(let c=0;c<C;c++) if(this.grid[r][c]===3 && dist[r][c]<0) return false;
      return dist[this.exit.r][this.exit.c]>=0;
    }
    restart(){ this.stopAuto(); this.over=false; this.win=false; this._autoProgress=0; this.genLevel(); this.status('挖土穿行、绕开巨石、收集钻石，集满 '+this.target+' 颗后出口开启。'); this.updateUI(); }
    status(t){ statusEl.textContent=t; }
    updateUI(){ progEl.textContent=this.gems+'/'+this.target; }
    addTween(r,c,fromR,fromC){ this.tweens[r*C+c]={fromR,fromC,t:0}; }
    move(dr,dc){ if(this.over||this.win) return; const nr=this.pr+dr, nc=this.pc+dc; if(nr<0||nr>=R||nc<0||nc>=C) return; const cell=this.grid[nr][nc];
      if(cell===4) return;
      if(cell===6||cell===7){ if(this.gems>=this.target) this.winGame(); return; }
      if(cell===2){ const br=nr+dr, bc=nc+dc; if(br<0||br>=R||bc<0||bc>=C) return; const b=this.grid[br][bc]; if(b===0||b===1){ this.grid[br][bc]=2; this.grid[nr][nc]=0; this.addTween(br,bc,nr,nc); } else return; }
      if(cell===3){ this.gems++; this.updateUI(); if(this.gems>=this.target){ this.grid[this.exit.r][this.exit.c]=7; this.status('💎 钻石集满！前往出口（绿色）'); } }
      this.grid[nr][nc]=0; this.pTween={fromR:this.pr,fromC:this.pc,t:0}; this.pr=nr; this.pc=nc; this._autoProgress++;
    }
    gravity(){ let moved=true, steps=0; while(moved && steps<300){ moved=false; steps++;
        for(let r=R-2;r>=0;r--) for(let c=0;c<C;c++){ if(this.grid[r][c]===2){
          if(r+1===this.pr && c===this.pc){ this.killPlayer(); return; }
          if(this.grid[r+1][c]===0){ this.grid[r+1][c]=2; this.grid[r][c]=0; this.addTween(r+1,c,r,c); moved=true; }
        } }
      }
    }
    killPlayer(){ this.over=true; this.status('💥 被落石砸中！点“新矿洞”重来。'); if(this.autoPlay) this.autoNext(); }
    winGame(){ this.over=true; this.win=true; this.best++; localStorage.setItem('dashBest',String(this.best)); bestEl.textContent=this.best; this.status('🏆 成功逃出矿洞！'); if(this.autoPlay) this.autoNext(); }
    bfs(){ const dist=Array.from({length:R},()=>new Array(C).fill(-1)); const par=Array.from({length:R},()=>new Array(C).fill(null)); const q=[[this.pr,this.pc]]; dist[this.pr][this.pc]=0; let h=0;
      while(h<q.length){ const [r,c]=q[h++]; for(const [dr,dc] of DIRS){ const nr=r+dr,nc=c+dc; if(nr<0||nr>=R||nc<0||nc>=C) continue; if(dist[nr][nc]!==-1) continue; const v=this.grid[nr][nc]; if(v===0||v===1||v===3||v===7){ dist[nr][nc]=dist[r][c]+1; par[nr][nc]=[r,c]; q.push([nr,nc]); } } }
      return {dist,par};
    }
    pickTarget(cells){ const {dist,par}=this.bfs(); let best=null,bd=1e9; for(const t of cells){ if(dist[t.r][t.c]!==-1 && dist[t.r][t.c]<bd){ bd=dist[t.r][t.c]; best=t; } } if(!best) return null; // reconstruct
      let cur=[best.r,best.c]; const path=[cur]; while(par[cur[0]][cur[1]]){ cur=par[cur[0]][cur[1]]; path.push(cur); } path.reverse();
      return path.length>=2 ? {dr:path[1][0]-path[0][0], dc:path[1][1]-path[0][1]} : null;
    }
    gemsCells(){ const out=[]; for(let r=0;r<R;r++)for(let c=0;c<C;c++) if(this.grid[r][c]===3) out.push({r,c}); return out; }
    danger(r,c){ return false; }
    safeAdjacent(){ for(const [dr,dc] of DIRS){ const nr=this.pr+dr,nc=this.pc+dc; if(nr<0||nr>=R||nc<0||nc>=C) continue; const v=this.grid[nr][nc]; if((v===0||v===1||v===3||v===7) && !this.danger(nr,nc)) return {dr,dc}; } return null; }
    decideAuto(){ if(this.over||this.win) return; const cells = this.gems<this.target ? this.gemsCells() : [this.exit]; const step=this.pickTarget(cells);
      if(!step){ const alt=this.safeAdjacent(); if(alt) this.move(alt.dr,alt.dc); else this.autoNext(); return; }
      const nr=this.pr+step.dr, nc=this.pc+step.dc; if(this.danger(nr,nc)){ const alt=this.safeAdjacent(); if(alt) this.move(alt.dr,alt.dc); else this.autoNext(); return; }
      this.move(step.dr,step.dc);
    }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over||this.win) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this.autoStep(); }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){ clearTimeout(this.autoTimer); this.autoTimer=null; } const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    autoStep(){ if(!this.autoPlay||this.over||this.win) return; this.decideAuto(); if(!this.over&&!this.win) this.autoTimer=setTimeout(()=>this.autoStep(),240); }
    autoNext(){ this.stopAuto(); this.restart(); this.startAuto(); }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.draw(dt); }catch(err){ console.error(err); } }
    draw(dt){ const W=this.W,H=this.H,cell=this.cell; ctx.clearRect(0,0,W,H);
      const dur=0.12;
      for(let r=0;r<R;r++)for(let c=0;c<C;c++){ const v=this.grid[r][c]; if(v===0){ continue; }
        let dr=0,dc=0,t=1; const tw=this.tweens[r*C+c]; if(tw){ tw.t+=dt/dur; t=Math.min(1,tw.t); dr=(tw.fromR-r)*t; dc=(tw.fromC-c)*t; if(tw.t>=1) delete this.tweens[r*C+c]; }
        const x=(c+dc)*cell, y=(r+dr)*cell;
        if(v===1){ ctx.fillStyle='#241d3a'; ctx.fillRect(x+1,y+1,cell-2,cell-2); }
        else if(v===2){ ctx.save(); ctx.shadowColor='#9aa3b2'; ctx.shadowBlur=6; ctx.fillStyle='#7a8290'; ctx.beginPath(); ctx.arc(x+cell/2,y+cell/2,cell*0.38,0,7); ctx.fill(); ctx.restore(); }
        else if(v===3){ ctx.save(); ctx.shadowColor='#4dfff0'; ctx.shadowBlur=12; ctx.fillStyle='#4dfff0'; ctx.beginPath(); ctx.moveTo(x+cell/2,y+cell*0.2); ctx.lineTo(x+cell*0.8,y+cell/2); ctx.lineTo(x+cell/2,y+cell*0.8); ctx.lineTo(x+cell*0.2,y+cell/2); ctx.closePath(); ctx.fill(); ctx.restore(); }
        else if(v===4){ ctx.fillStyle='#15151f'; ctx.fillRect(x,y,cell,cell); ctx.strokeStyle='#2a2a3e'; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,cell-1,cell-1); }
        else if(v===6||v===7){ ctx.save(); if(v===7){ ctx.shadowColor='#3ecf8e'; ctx.shadowBlur=16; ctx.fillStyle='#3ecf8e'; } else ctx.fillStyle='#5a3a1a'; ctx.beginPath(); ctx.arc(x+cell/2,y+cell/2,cell*0.36,0,7); ctx.fill(); ctx.restore(); }
      }
      // player
      let pr=this.pr, pc=this.pc; if(this.pTween){ this.pTween.t+=dt/dur; const t=Math.min(1,this.pTween.t); pr=this.pTween.fromR+(this.pr-this.pTween.fromR)*t; pc=this.pTween.fromC+(this.pc-this.pTween.fromC)*t; if(this.pTween.t>=1) this.pTween=null; }
      const px=(pc+0.5)*cell, py=(pr+0.5)*cell; ctx.save(); ctx.shadowColor='#ffd54a'; ctx.shadowBlur=14; ctx.fillStyle='#ffd54a'; ctx.beginPath(); ctx.arc(px,py,cell*0.32,0,7); ctx.fill(); ctx.fillStyle='#1a1006'; ctx.beginPath(); ctx.arc(px,py,cell*0.14,0,7); ctx.fill(); ctx.restore();
    }
  }
  window.game=new Dash();
})();
</script>
</body>
</html>
