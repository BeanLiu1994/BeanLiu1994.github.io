<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>Cluster Pop · 同色消除</title>
<style>
  :root { --bg:#0a0a1a; --surface:#12122a; --board:#0e1226; --text:#e6e6f5; --muted:#8a8ab0; --accent:#4dff91; --accent-glow:#4dff9166; --gold:#ffd54a; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image: radial-gradient(ellipse at 18% 12%, #103024 0%, transparent 55%), radial-gradient(ellipse at 82% 88%, #2a1038 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:480px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#4dff91,#4dd0ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; min-width:80px; padding:10px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#06281a; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#06281a; animation:pulse 1.6s infinite; }
  @keyframes pulse {0%,100%{box-shadow:0 0 6px var(--accent-glow);} 50%{box-shadow:0 0 18px var(--accent-glow),0 0 34px var(--accent-glow);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>Cluster Pop</h1><div class="sub">P O P &nbsp; S A M E &nbsp; C O L O R S</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Cleared</div><div class="value" id="clr">0</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
      <div class="score-card"><div class="label">Left</div><div class="value" id="left">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="440" height="440"></canvas></div>
  <div class="controls">
    <button class="btn" onclick="game.restart()">New Board</button>
    <button class="btn primary" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">点任意≥2个相连的同色块即可消除，方块下落、空列左移</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
  const clrEl=document.getElementById('clr'), bestEl=document.getElementById('best'), leftEl=document.getElementById('left'), statusEl=document.getElementById('status');
  const COLS=12, ROWS=12, COLORS=['#ff5d6a','#4dd0ff','#4dff91','#ffd54a'];

  class SameGame {
    constructor(){
      this.autoPlay=false; this.autoTimer=null; this._last=0; this._autoProgress=0;
      this.best=parseInt(localStorage.getItem('sgBest')||'0'); this.fit();
      window.addEventListener('resize',()=>this.fit());
      canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); this.onDown(e); });
      this.restart();
      this.loop=this.loop.bind(this); requestAnimationFrame(this.loop);
    }
    fit(){ const rect=canvas.getBoundingClientRect(); const w=Math.max(300,Math.min(rect.width||440,440)); const dpr=window.devicePixelRatio||1;
      this.W=w; this.cell=w/COLS; canvas.width=w*dpr; canvas.height=this.cell*ROWS*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    restart(){ if(!this.autoPlay) this.stopAuto(); this.over=false; this.score=0; this.cleared=0; this.grid=[];
      for(let r=0;r<ROWS;r++){ this.grid[r]=[]; for(let c=0;c<COLS;c++) this.grid[r][c]=Math.floor(Math.random()*COLORS.length); }
      this.updateUI(); }
    updateUI(){ let left=0; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(this.grid[r][c]!==-1) left++;
      clrEl.textContent=this.cleared; bestEl.textContent=this.best; leftEl.textContent=left;
      statusEl.textContent=this.over?('无可消除 · 清除 '+this.cleared+'/'+ (this.cleared+left)):(this.autoPlay?'自动演示中…':'点≥2连块消除'); }
    clusterAt(r,c){ const col=this.grid[r][c]; if(col===-1) return []; const seen=new Set(), st=[[r,c]], out=[];
      while(st.length){ const [y,x]=st.pop(); const k=y+','+x; if(seen.has(k)) continue; seen.add(k); out.push([y,x]);
        for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){ const ny=y+dy,nx=x+dx; if(ny<0||nx<0||ny>=ROWS||nx>=COLS) continue; if(this.grid[ny][nx]===col&&!seen.has(ny+','+nx)) st.push([ny,nx]); } }
      return out; }
    hasMove(){ for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const v=this.grid[r][c]; if(v===-1) continue;
        if((c+1<COLS&&this.grid[r][c+1]===v)||(r+1<ROWS&&this.grid[r+1][c]===v)) return true; } return false; }
    bestCluster(){ let best=null; const done=new Set();
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ if(this.grid[r][c]===-1) continue; const k=r+','+c; if(done.has(k)) continue;
        const cl=this.clusterAt(r,c); for(const [y,x] of cl) done.add(y+','+x); if(cl.length>=2 && (!best||cl.length>best.size)) best={cells:cl,size:cl.length}; }
      return best; }
    clear(cells){ const n=cells.length; for(const [r,c] of cells) this.grid[r][c]=-1; this.cleared+=n; this.score+=(n-2)*(n-2);
      // gravity
      for(let c=0;c<COLS;c++){ const stk=[]; for(let r=ROWS-1;r>=0;r--) if(this.grid[r][c]!==-1) stk.push(this.grid[r][c]); for(let r=ROWS-1;r>=0;r--) this.grid[r][c]= stk.length? stk.shift():-1; }
      // shift empty columns left
      const kept=[]; for(let c=0;c<COLS;c++){ let has=false; for(let r=0;r<ROWS;r++) if(this.grid[r][c]!==-1){has=true;break;} if(has) kept.push(c); }
      const ng=[]; for(let r=0;r<ROWS;r++) ng[r]=new Array(COLS).fill(-1); for(let i=0;i<kept.length;i++){ const c=kept[i]; for(let r=0;r<ROWS;r++) ng[r][i]=this.grid[r][c]; }
      this.grid=ng; }
    onDown(e){ if(this.autoPlay||this.over) return; const rect=canvas.getBoundingClientRect(); const x=(e.clientX-rect.left)*(this.W/rect.width), y=(e.clientY-rect.top)*(this.W/rect.width);
      const c=Math.floor(x/this.cell), r=Math.floor(y/this.cell); if(r<0||r>=ROWS||c<0||c>=COLS) return; const cl=this.clusterAt(r,c); if(cl.length>=2){ this.clear(cl); this.afterMove(); } }
    afterMove(){ this.updateUI(); if(!this.hasMove()){ this.over=true; if(this.cleared>this.best){ this.best=this.cleared; localStorage.setItem('sgBest',String(this.best)); } this.updateUI(); } }
    toggleAuto(){ if(this.autoPlay) this.stopAuto(); else { if(this.over) this.restart(); this.startAuto(); } }
    startAuto(){ this.autoPlay=true; const b=document.getElementById('btn-auto'); b.textContent='Auto: ON'; b.classList.add('auto-on'); this.autoStep(); }
    stopAuto(){ this.autoPlay=false; if(this.autoTimer){clearTimeout(this.autoTimer);this.autoTimer=null;} const b=document.getElementById('btn-auto'); b.textContent='Auto: OFF'; b.classList.remove('auto-on'); }
    autoStep(){ if(!this.autoPlay) return; if(this.over){ this._autoNext(); return; }
      const best=this.bestCluster(); if(best){ this.clear(best.cells); this._autoProgress=this.cleared; this.afterMove(); }
      if(!this.over) this.autoTimer=setTimeout(()=>this.autoStep(),350); }
    _autoNext(){ this.stopAuto(); this.restart(); this.startAuto(); }
    loop(ts){ requestAnimationFrame(this.loop); try{ const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016); this._last=ts; this.draw(dt); }catch(err){ console.error(err); } }
    draw(){ const cl=this.cell; ctx.clearRect(0,0,this.W,this.cell*ROWS);
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const v=this.grid[r][c]; if(v===-1) continue; const x=c*cl, y=r*cl;
        ctx.save(); ctx.shadowColor=COLORS[v]; ctx.shadowBlur=8; ctx.fillStyle=COLORS[v]; this.rr(x+2,y+2,cl-4,cl-4,6); ctx.fill(); ctx.restore(); }
    }
    rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }
  window.game=new SameGame();
})();
</script>
</body>
</html>
