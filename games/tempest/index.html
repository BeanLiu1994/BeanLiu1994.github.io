<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0518" />
<title>Tempest · 霓虹隧道</title>
<style>
  :root { --bg:#0a0518; --surface:#160a26; --board:#060210; --text:#f6e6ff; --muted:#b08fd0; --accent:#c46bff; --accent2:#5dffd0; --accent-glow:#c46bff55; --gold:#ffd54a; --red:#ff5d6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); background-image:radial-gradient(ellipse at 50% 0%, #1a0a30 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, #0a0518 0%, transparent 55%);
    color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; touch-action:none; }
  .container { width:100%; max-width:460px; padding:14px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px; }
  .title-block h1 { font-size:1.5rem; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,#c46bff,#5dffd0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .title-block .sub { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:2px; }
  .score-panel { display:flex; gap:8px; }
  .score-card { background:var(--surface); border:1px solid #ffffff0a; border-radius:10px; padding:4px 10px; text-align:center; min-width:54px; }
  .score-card .label { font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .score-card .value { font-size:1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .score-card.best .value { color:var(--gold); }
  .board-wrap { position:relative; background:var(--surface); border:1px solid #ffffff0a; border-radius:14px; padding:10px; box-shadow:0 0 40px #00000040, 0 0 60px var(--accent-glow); }
  .board-wrap, .board-wrap * { touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; border-radius:10px; background:var(--board); }
  .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn { flex:1; min-width:80px; padding:11px; border:1px solid #ffffff14; border-radius:10px; background:var(--surface); color:var(--text); font-size:0.85rem; font-weight:700; cursor:pointer; transition:all .2s; letter-spacing:.5px; }
  .btn:hover { background:#ffffff10; } .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#160826; }
  .btn.auto-on { background:var(--accent); border-color:var(--accent); color:#160826; animation:pulse 1.6s infinite; --glow:var(--accent-glow); }
  @keyframes pulse { 0%,100%{box-shadow:0 0 6px var(--glow,transparent);} 50%{box-shadow:0 0 18px var(--glow,transparent),0 0 34px var(--glow,transparent);} }
  .status { margin-top:8px; font-size:0.74rem; color:var(--muted); text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-block"><h1>霓虹隧道</h1><div class="sub">T E M P E S T</div></div>
    <div class="score-panel">
      <div class="score-card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-card"><div class="label">Level</div><div class="value" id="level">1</div></div>
      <div class="score-card best"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="board-wrap"><canvas id="game" width="420" height="420"></canvas></div>
  <div class="controls">
    <button class="btn primary" onclick="game.restart()">New Game</button>
    <button class="btn" id="btn-auto" onclick="game.toggleAuto()">Auto: OFF</button>
  </div>
  <div class="status" id="status">拖动屏幕，爪子绕圆环转动 · 自动向圆心发射光弹击毁来敌</div>
</div>
<script>
(function(){
  'use strict';
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'), levelEl=document.getElementById('level'), bestEl=document.getElementById('best'), statusEl=document.getElementById('status');
  const btnAuto=document.getElementById('btn-auto');
  const W=canvas.width, H=canvas.height, CX=W/2, CY=H/2, R=W/2-18, N=16, STEP=2*Math.PI/N;
  function rint(n){ return Math.floor(Math.random()*n); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function laneAngle(l){ return l*STEP; }
  class Tempest {
    constructor(){
      this.autoPlay=false; this._last=0; this.time=0; this._autoProgress=0;
      this.bestKey='tempestBest'; this.best=parseInt(localStorage.getItem(this.bestKey)||'0'); bestEl.textContent=this.best;
      this.angle=0; this.targetAngle=0; this.bolt=null; this.enemies=[]; this.particles=[];
      this.lives=3; this.score=0; this.level=1; this.state='play'; this.fireCd=0; this.spawnCd=0.8; this.toSpawn=6; this.clearT=0; this.gameOverT=0;
      requestAnimationFrame(this.tick.bind(this));
    }
    restart(){ this.lives=3; this.score=0; this.level=1; this.state='play'; this.enemies=[]; this.particles=[]; this.bolt=null; this.toSpawn=6; this.spawnCd=0.8; this.gameOverT=0; this.clearT=0; levelEl.textContent='1'; scoreEl.textContent='0'; this.setStatus('拖动屏幕，爪子绕圆环转动 · 自动向圆心发射光弹'); }
    setStatus(t){ statusEl.textContent=t; }
    toggleAuto(){ this.autoPlay=!this.autoPlay; if(this.autoPlay){ btnAuto.textContent='Auto: ON'; btnAuto.classList.add('auto-on'); } else { btnAuto.textContent='Auto: OFF'; btnAuto.classList.remove('auto-on'); } }
    startAuto(){ this.autoPlay=true; btnAuto.textContent='Auto: ON'; btnAuto.classList.add('auto-on'); }
    stopAuto(){ this.autoPlay=false; btnAuto.textContent='Auto: OFF'; btnAuto.classList.remove('auto-on'); }
    get lane(){ return ((Math.round(this.angle/STEP)%N)+N)%N; }
    maybeAuto(dt){
      if(!this.autoPlay) return;
      // target nearest enemy by largest radius (closest to rim)
      let best=null, br=-1;
      for(const e of this.enemies){ if(e.alive && e.rad>br){ br=e.rad; best=e; } }
      if(best){ this.targetAngle = best.lane*STEP; }
      this.fireCd-=dt; if(this.fireCd<=0 && best){ this.fire(); this.fireCd=0.28; }
    }
    fire(){ if(this.bolt) return; this.bolt={lane:this.lane, rad:R, speed:520}; }
    update(dt){
      // rotate
      let diff=this.targetAngle-this.angle; while(diff>Math.PI) diff-=2*Math.PI; while(diff<-Math.PI) diff+=2*Math.PI;
      this.angle += diff*Math.min(1,dt*12);
      // spawn
      if(this.state==='play'){
        this.spawnCd-=dt;
        if(this.spawnCd<=0 && this.toSpawn>0){ this.spawnCd=Math.max(0.35, 1.1-this.level*0.06); this.toSpawn--; const lane=rint(N); this.enemies.push({lane, rad:0, alive:true, speed:36+this.level*6+Math.random()*14, spin:Math.random()*6}); }
        if(this.toSpawn===0 && this.enemies.length===0){ this.clearT-=dt; if(this.clearT<=0){ this.level++; levelEl.textContent=this.level; this.toSpawn=5+this.level; this.spawnCd=0.6; this.clearT=0; this.setStatus('Level '+this.level); } } else { this.clearT=1.2; }
      }
      // bolt
      if(this.bolt){ this.bolt.rad-=this.bolt.speed*dt; if(this.bolt.rad<=0) this.bolt=null; }
      // enemies
      for(const e of this.enemies){
        if(!e.alive) continue; e.rad+=e.speed*dt; e.spin+=dt*3;
        if(this.bolt && this.bolt.lane===e.lane && Math.abs(this.bolt.rad-e.rad)<16){ e.alive=false; this.bolt=null; this.score+=10; scoreEl.textContent=this.score; this._autoProgress++; this._burst(e.lane,e.rad,'#5dffd0'); }
        if(e.rad>=R){ e.alive=false; if(e.lane===this.lane){ this._hitPlayer(); } }
      }
      this.enemies=this.enemies.filter(e=>e.alive);
      for(const p of this.particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
      this.particles=this.particles.filter(p=>p.life>0);
      if(this.state==='over'){ this.gameOverT-=dt; if(this.gameOverT<=0) this.restart(); }
      if(this.score>this.best){ this.best=this.score; bestEl.textContent=this.best; localStorage.setItem(this.bestKey,String(this.best)); }
      this.maybeAuto(dt);
    }
    _hitPlayer(){ this.lives--; this._burst(this.lane,R,'#ff5d6a'); if(this.lives<=0){ this.state='over'; this.gameOverT=1.3; this.setStatus('Game Over · 自动重开'); } }
    _burst(lane,rad,c){ const x=CX+rad*Math.cos(laneAngle(lane)), y=CY+rad*Math.sin(laneAngle(lane)); for(let i=0;i<10;i++){ const a=Math.random()*6.28, s=40+Math.random()*120; this.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.3,c}); } }
    tick(ts){
      const dt=Math.min(0.05,(ts!==undefined)?((ts-(this._last||ts))/1000):0.016);
      this._last=ts!==undefined?ts:this._last; this.time+=dt;
      this.update(dt); this.draw(); requestAnimationFrame(this.tick.bind(this));
    }
    draw(){
      ctx.clearRect(0,0,W,H);
      const g=ctx.createRadialGradient(CX,CY,10,CX,CY,R+10); g.addColorStop(0,'#160a26'); g.addColorStop(1,'#060210'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      // web rings
      ctx.strokeStyle='#3a2a5a'; ctx.lineWidth=1;
      for(let k=1;k<=5;k++){ ctx.beginPath(); ctx.arc(CX,CY,R*k/5,0,6.28); ctx.stroke(); }
      // spokes
      for(let i=0;i<N;i++){ const a=laneAngle(i); ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(CX+R*Math.cos(a),CY+R*Math.sin(a)); ctx.stroke(); }
      // enemies
      for(const e of this.enemies){ const x=CX+e.rad*Math.cos(laneAngle(e.lane)), y=CY+e.rad*Math.sin(laneAngle(e.lane)); ctx.save(); ctx.shadowColor='#ff5de1'; ctx.shadowBlur=14; ctx.fillStyle='#ff5de1'; ctx.beginPath(); ctx.arc(x,y,9,0,6.28); ctx.fill(); ctx.fillStyle='#060210'; ctx.beginPath(); ctx.arc(x,y,3.5,0,6.28); ctx.fill(); ctx.restore(); }
      // bolt
      if(this.bolt){ const a=laneAngle(this.bolt.lane); ctx.strokeStyle='#5dffd0'; ctx.lineWidth=3; ctx.shadowColor='#5dffd0'; ctx.shadowBlur=12; ctx.beginPath(); ctx.moveTo(CX+R*Math.cos(a),CY+R*Math.sin(a)); ctx.lineTo(CX+this.bolt.rad*Math.cos(a),CY+this.bolt.rad*Math.sin(a)); ctx.stroke(); ctx.shadowBlur=0; }
      // player claw
      const a=this.angle, px=CX+R*Math.cos(a), py=CY+R*Math.sin(a);
      ctx.save(); ctx.shadowColor='#c46bff'; ctx.shadowBlur=18; ctx.strokeStyle='#c46bff'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(px,py,12,a-0.5,a+0.5); ctx.stroke();
      ctx.fillStyle='#c46bff'; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+14*Math.cos(a),py+14*Math.sin(a)); ctx.stroke();
      ctx.restore();
      for(const p of this.particles){ ctx.globalAlpha=Math.max(0,p.life*2); ctx.fillStyle=p.c; ctx.fillRect(p.x-2,p.y-2,4,4); } ctx.globalAlpha=1;
      ctx.fillStyle='#b08fd0'; ctx.font='12px Segoe UI'; ctx.textAlign='left'; ctx.fillText('♥'.repeat(Math.max(0,this.lives)), 10, H-10);
    }
  }
  function setTargetFromPointer(e){ const r=canvas.getBoundingClientRect(); const px=(e.clientX-r.left)*(canvas.width/r.width)-CX, py=(e.clientY-r.top)*(canvas.height/r.height)-CY; let a=Math.atan2(py,px); game.targetAngle=a; }
  canvas.addEventListener('pointerdown',(e)=>{ if(!game.autoPlay) setTargetFromPointer(e); });
  canvas.addEventListener('pointermove',(e)=>{ if((e.buttons||e.pointerType==='touch') && !game.autoPlay) setTargetFromPointer(e); });
  window.game=new Tempest();
})();
</script>
</body>
</html>
