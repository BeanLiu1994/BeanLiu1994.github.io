# Wallpaper Generator — deployed at dki.beanee.eu.org/wallpaper/
# Include this in the main nginx site config:
#   include /etc/nginx/snippets/wallpaper-gen.conf;

location /wallpaper/ {
    proxy_pass http://127.0.0.1:8002/;    # trailing slash strips /wallpaper/ prefix
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Increase body size for potential image uploads
    client_max_body_size 16m;
}
