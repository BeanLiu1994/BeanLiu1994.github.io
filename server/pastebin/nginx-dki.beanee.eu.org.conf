# /etc/nginx/sites-available/dki.beanee.eu.org
# Deployed at: dki.beanee.eu.org

server {
    server_name dki.beanee.eu.org;

    root /var/www/dki.beanee.eu.org;
    index index.html;

    # Proxy /text/ to pastebin backend (Python, port 8765)
    location /text/ {
        proxy_pass http://127.0.0.1:8765/;     # trailing slash strips /text/ prefix
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Include additional location configs
    include /etc/nginx/snippets/*.conf;

    # Static files for root and future services
    location / {
        try_files $uri $uri/ =404;
    }

    # SSL managed by Certbot (auto-renewing)
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dki.beanee.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dki.beanee.eu.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirect (managed by Certbot)
server {
    if ($host = dki.beanee.eu.org) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name dki.beanee.eu.org;
    return 404;
}
