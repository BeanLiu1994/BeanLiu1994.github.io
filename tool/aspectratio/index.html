<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宽高比计算器 · Aspect Ratio</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border)}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px;margin-top:4px}
  main{flex:1;display:flex;flex-direction:column;gap:20px;padding:24px;max-width:720px;width:100%;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;
    padding:12px;font-size:20px;outline:none;font-family:"SF Mono",Consolas,monospace}
  input:focus{border-color:var(--accent)}
  .ratio{font-size:40px;font-weight:700;color:var(--ok);text-align:center;font-family:"SF Mono",Consolas,monospace}
  .decimal{color:var(--muted);text-align:center;font-size:14px;margin-top:4px}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:#fff}
  .preview{display:flex;justify-content:center;align-items:center;margin-top:16px;height:180px}
  .box{background:linear-gradient(135deg,var(--accent),#7b5cff);border-radius:8px;max-width:100%;max-height:180px}
  .note{color:var(--muted);font-size:13px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>📐 宽高比计算器</h1>
  <div class="sub">纯本地运行 · 计算比例 · 锁定比例求缺失边</div>
</header>
<main>
  <div class="card">
    <div class="grid">
      <div><label>宽 Width</label><input id="w" type="number" value="1920"></div>
      <div><label>高 Height</label><input id="h" type="number" value="1080"></div>
    </div>
    <div class="presets">
      <span class="chip" data-r="16:9">16:9</span>
      <span class="chip" data-r="4:3">4:3</span>
      <span class="chip" data-r="21:9">21:9</span>
      <span class="chip" data-r="1:1">1:1</span>
      <span class="chip" data-r="3:2">3:2</span>
      <span class="chip" data-r="9:16">9:16</span>
      <span class="chip" data-r="2.39:1">2.39:1</span>
    </div>
    <div class="preview"><div class="box" id="box"></div></div>
  </div>
  <div class="card">
    <div class="ratio" id="ratio">16:9</div>
    <div class="decimal" id="dec">1.7778 : 1</div>
  </div>
  <div class="card">
    <label>按当前比例缩放</label>
    <div class="grid">
      <div><label style="text-transform:none">给定宽 → 求高</label><input id="sw" type="number" placeholder="输入宽"></div>
      <div><label style="text-transform:none">结果高</label><input id="rh" readonly></div>
    </div>
    <div class="grid" style="margin-top:14px">
      <div><label style="text-transform:none">给定高 → 求宽</label><input id="sh" type="number" placeholder="输入高"></div>
      <div><label style="text-transform:none">结果宽</label><input id="rw" readonly></div>
    </div>
    <div class="note">比例锁定为上方计算出的宽高比</div>
  </div>
</main>
<script>
(function(){
  const $=id=>document.getElementById(id);
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
  let ratio=16/9;
  function render(){
    let w=parseFloat($('w').value),h=parseFloat($('h').value);
    if(!(w>0&&h>0)){$('ratio').textContent='—';$('dec').textContent='请输入有效宽高';return;}
    ratio=w/h;
    // integer ratio if both integer
    let rtxt;
    if(Number.isInteger(w)&&Number.isInteger(h)){
      const g=gcd(w,h); rtxt=(w/g)+':'+(h/g);
    }else{ rtxt=ratio.toFixed(3)+':1'; }
    $('ratio').textContent=rtxt;
    $('dec').textContent=ratio.toFixed(4)+' : 1';
    // preview
    const box=$('box'); const maxW=Math.min(400,ratio*180), maxH=180;
    let bw=maxW, bh=bw/ratio; if(bh>maxH){bh=maxH;bw=bh*ratio;}
    box.style.width=bw+'px'; box.style.height=bh+'px';
    scale();
  }
  function scale(){
    const sw=parseFloat($('sw').value); $('rh').value=sw>0?(sw/ratio).toFixed(2):'';
    const sh=parseFloat($('sh').value); $('rw').value=sh>0?(sh*ratio).toFixed(2):'';
  }
  ['w','h'].forEach(id=>$(id).addEventListener('input',render));
  ['sw','sh'].forEach(id=>$(id).addEventListener('input',scale));
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const [a,b]=c.dataset.r.split(':').map(Number);
    $('w').value=a; $('h').value=b; render();
  });
  render();
})();
</script>
</body>
</html>
