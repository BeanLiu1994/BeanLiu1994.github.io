<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电话号码格式化与掩码 · Phone Formatter</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  input[type=text]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;font-size:14px;outline:none;font-family:inherit}
  input[type=text]:focus{border-color:var(--accent)}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  label{color:var(--muted);font-size:13px}
  button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  button:hover{filter:brightness(1.08)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted)}
  .kv .v{color:var(--text);word-break:break-all;text-align:right}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .badge.ok{background:rgba(62,207,142,.16);color:var(--ok)}
  .badge.err{background:rgba(255,93,108,.16);color:var(--err)}
  .big{font-size:20px;font-weight:700;margin:2px 0 10px;color:var(--accent);word-break:break-all}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;color:var(--muted);border:none;border-radius:0;padding:7px 12px}
  .seg button.on{background:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
  <div>
    <h1>📞 电话号码格式化与掩码</h1>
    <div class="sub">国际格式标准化 · 国家/地区识别 · 安全脱敏 · 纯本地</div>
  </div>
</header>
<main>
  <section class="pane">
    <div class="card">
      <div class="pane-head">输入号码（支持多行批量）</div>
      <input type="text" id="inp" value="13812345678" placeholder="如 13812345678 / +1 415 555 0132">
      <div class="row" style="margin-top:10px">
        <label>掩码模式</label>
        <div class="seg" id="mode">
          <button data-m="middle" class="on">中间掩码</button>
          <button data-m="last4">保留后4位</button>
          <button data-m="none">不掩码</button>
        </div>
      </div>
      <div class="row">
        <button id="fmt">格式化</button>
        <button class="ghost" id="copy">复制结果</button>
        <button class="ghost" id="clear">清空</button>
      </div>
      <div id="summary" class="big">—</div>
      <div id="details"></div>
    </div>
  </section>
  <section class="pane">
    <div class="card">
      <div class="pane-head">说明</div>
      <ul style="color:var(--muted);font-size:13px;line-height:1.8;margin:0;padding-left:18px">
        <li>自动识别中国（+86）、美国/加拿大（+1）、英国（+44）、日本（+81）、香港（+852）等常见区号。</li>
        <li>无国际前缀时，默认按中国大陆 11 位手机号格式化。</li>
        <li>掩码用于日志/展示脱敏，<b>不会</b>上传任何号码。</li>
        <li>本工具仅做格式规整，<b>不验证</b>号码是否真实分配。</li>
      </ul>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const CC = {
    '1':{name:'美国/加拿大',len:[10]}, '44':{name:'英国',len:[10,11]},
    '81':{name:'日本',len:[10,11]}, '852':{name:'中国香港',len:[8]},
    '886':{name:'中国台湾',len:[9,10]}, '86':{name:'中国大陆',len:[11]}
  };
  let mode='middle';

  function parse(raw){
    let s = raw.replace(/[\s().\-]/g,'');
    let cc=null, national=s;
    if(s.startsWith('+')){
      // 尝试最长匹配区号
      for(const k of ['86','886','852','81','44','1']){
        if(s.slice(1).startsWith(k)){ cc=k; national=s.slice(1+k.length); break; }
      }
      if(!cc){ cc='?'; national=s.slice(1); }
    } else if(s.startsWith('00')){
      const rest=s.slice(2);
      for(const k of ['86','886','852','81','44','1']){
        if(rest.startsWith(k)){ cc=k; national=rest.slice(k.length); break; }
      }
      if(!cc){ cc='?'; national=rest; }
    } else {
      // 无前缀：中国大陆
      if(/^1\d{10}$/.test(s)){ cc='86'; national=s; }
      else if(/^\d{7,12}$/.test(s)){ cc='86'; national=s; }
      else { cc=null; }
    }
    national = national.replace(/\D/g,'');
    return {raw,cc,national,digits:s.replace(/\D/g,'')};
  }

  function formatCN(nat){
    if(/^1\d{10}$/.test(nat)) return nat.replace(/(\d{3})(\d{4})(\d{4})/,'$1 $2 $3');
    return nat.replace(/(\d{3})(\d{4})(\d{4})?/,'$1 $2 $3').trim();
  }
  function formatUS(nat){
    if(nat.length===10) return '('+nat.slice(0,3)+') '+nat.slice(3,6)+'-'+nat.slice(6);
    return nat;
  }
  function fmt(p){
    if(!p.cc) return null;
    let body;
    if(p.cc==='86') body=formatCN(p.national);
    else if(p.cc==='1') body=formatUS(p.national);
    else body=p.national.replace(/(\d{3})(\d{4})(\d+)?/,'$1 $2 $3').trim();
    const prefix = p.cc==='?' ? '+' : '+'+p.cc+' ';
    return prefix+body;
  }

  function maskStr(formatted){
    if(mode==='none') return formatted;
    // 对数字部分做掩码，保留分隔符位置
    const digits = formatted.replace(/\D/g,'');
    let visible;
    if(mode==='last4') visible = digits.slice(-4);
    else visible = digits.length>6 ? digits.slice(0,3)+digits.slice(-4) : digits.slice(0,2);
    // 重建：把数字替换为掩码符号
    let di=0, out='';
    for(const ch of formatted){
      if(/\d/.test(ch)){
        if(mode==='last4'){ out += (di>=digits.length-4)?ch:'*'; }
        else { out += (di<3 || di>=digits.length-4)?ch:'*'; }
        di++;
      } else out+=ch;
    }
    return out;
  }

  function render(){
    const lines = $('inp').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const box=$('details'); box.innerHTML='';
    if(lines.length===0){ $('summary').textContent='—'; $('st').textContent='请输入号码'; return; }
    let results=[];
    lines.forEach(line=>{
      const p=parse(line);
      const f=fmt(p);
      const ccName = p.cc ? (CC[p.cc]?CC[p.cc].name:(p.cc==='?'?'未知':'+'+p.cc)) : '无法识别';
      const masked = f?maskStr(f):null;
      results.push(masked||line);
      const wrap=document.createElement('div'); wrap.style.marginBottom='10px';
      if(!f){
        wrap.innerHTML='<div class="kv"><span class="k">'+esc(line)+'</span><span class="v"><span class="badge err">无法识别</span></span></div>';
      } else {
        wrap.innerHTML=
          '<div class="kv"><span class="k">国际格式</span><span class="v">'+esc(f)+'</span></div>'+
          '<div class="kv"><span class="k">掩码</span><span class="v">'+esc(masked)+'</span></div>'+
          '<div class="kv"><span class="k">地区</span><span class="v">'+esc(ccName)+'</span></div>'+
          '<div class="kv"><span class="k">国内号</span><span class="v">'+esc(p.national)+'</span></div>';
      }
      box.appendChild(wrap);
    });
    $('summary').textContent = results.join('   ·   ');
    $('st').textContent='✓ 已格式化 '+lines.length+' 个号码';
    window.__results=results;
  }
  function esc(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  $('fmt').addEventListener('click',render);
  $('copy').addEventListener('click',()=>{ if(window.__results){ navigator.clipboard&&navigator.clipboard.writeText(window.__results.join('\n')); $('st').textContent='✓ 已复制结果'; } });
  $('clear').addEventListener('click',()=>{ $('inp').value=''; render(); });
  $('mode').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; mode=b.dataset.m;
    [...$('mode').children].forEach(x=>x.classList.toggle('on',x===b)); render(); });
  $('inp').addEventListener('input',render);
  render();
})();
</script>
</body>
</html>
