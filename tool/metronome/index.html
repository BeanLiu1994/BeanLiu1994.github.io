<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节拍器 · Metronome</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  a.btn{display:inline-flex;align-items:center;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 13px;font-size:13px;text-decoration:none;cursor:pointer;transition:.15s}
  a.btn:hover{border-color:var(--accent);color:#fff}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;align-items:center}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;width:100%;max-width:560px}
  .beats{display:flex;gap:10px;justify-content:center;margin:8px 0 18px}
  .dot{width:36px;height:36px;border-radius:50%;background:var(--bg);border:2px solid var(--border);transition:.05s}
  .dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
  .dot.accent.on{background:var(--ok);border-color:var(--ok)}
  .bpm{text-align:center;font-size:56px;font-weight:700;font-family:"SF Mono",Consolas,monospace}
  .bpm small{font-size:14px;color:var(--muted);font-weight:400;display:block;margin-top:-4px}
  .slider{width:100%;accent-color:var(--accent);margin:6px 0 14px}
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:9px 18px;font-size:14px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--ok);border-color:var(--ok);color:#06281c;font-weight:600}
  button.primary.stop{background:var(--err);border-color:var(--err);color:#2a0608}
  .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px}
  .row label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;justify-content:center}
</style>
</head>
<body>
<header>
  <div>
    <h1>🎵 节拍器</h1>
    <div class="sub">Web Audio · 无依赖 · 纯本地</div>
  </div>
  <div class="toolbar">
    <a class="btn" href="../../">🏠 首页</a>
  </div>
</header>
<main>
  <section class="card">
    <div class="beats" id="beats"></div>
    <div class="bpm"><span id="bpmv">120</span><small>BPM</small></div>
    <input type="range" class="slider" id="bpm" min="30" max="300" value="120">
    <div class="controls">
      <button id="start" class="primary">▶ 开始</button>
      <button id="tap">点击测速 Tap</button>
    </div>
    <div class="row">
      <label>每小节拍数
        <select id="bpmN" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px">
          <option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option>
        </select>
      </label>
      <label><input type="checkbox" id="accent" checked> 重音</label>
    </div>
  </section>
</main>
<div class="status" id="st">点击「开始」，调节滑块改变速度，或用 Tap 测速。</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const st=$('st');
  let ctx=null, playing=false, timer=null;
  let nextTime=0, beat=0, bpm=120, beatsPerBar=4;
  const lookahead=25, scheduleAhead=0.12;
  function ensureCtx(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); }
  function click(time,accent){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.value=accent?1500:900;
    g.gain.setValueAtTime(accent?0.9:0.55,time);
    g.gain.exponentialRampToValueAtTime(0.001,time+0.05);
    o.connect(g); g.connect(ctx.destination);
    o.start(time); o.stop(time+0.06);
  }
  function scheduler(){
    while(nextTime < ctx.currentTime + scheduleAhead){
      const accent = $('accent').checked && beat===0;
      click(nextTime, accent);
      drawBeat(beat, nextTime);
      nextTime += 60/bpm;
      beat=(beat+1)%beatsPerBar;
    }
  }
  // 视觉：在对应节拍发声时刻点亮
  const pending=[];
  function drawBeat(b,time){
    pending.push({b,time});
    if(!drawBeat._raf){ drawBeat._raf=requestAnimationFrame(flash); }
  }
  function flash(){
    const now=ctx?ctx.currentTime:0;
    const dots=$('beats').children;
    while(pending.length && pending[0].time<=now){
      const {b}=pending.shift();
      for(let i=0;i<dots.length;i++) dots[i].classList.remove('on');
      if(dots[b]){ dots[b].classList.add('on'); if(b===0)setTimeout(()=>{},0); }
    }
    if(pending.length) drawBeat._raf=requestAnimationFrame(flash); else drawBeat._raf=null;
  }
  function buildDots(){
    beatsPerBar=+$('bpmN').value;
    const c=$('beats'); c.innerHTML='';
    for(let i=0;i<beatsPerBar;i++){ const d=document.createElement('div'); d.className='dot'+(i===0?' accent':''); c.appendChild(d); }
  }
  function start(){
    ensureCtx(); if(ctx.state==='suspended')ctx.resume();
    playing=true; beat=0; nextTime=ctx.currentTime+0.05;
    timer=setInterval(scheduler,lookahead);
    $('start').textContent='■ 停止'; $('start').classList.add('stop');
    st.textContent='运行中…';
  }
  function stop(){
    playing=false; clearInterval(timer); timer=null;
    $('start').textContent='▶ 开始'; $('start').classList.remove('stop');
    [...$('beats').children].forEach(d=>d.classList.remove('on'));
    st.textContent='已停止';
  }
  // Tap 测速
  let taps=[];
  $('tap').onclick=()=>{
    const t=performance.now();
    if(taps.length && t-taps[taps.length-1]>2000) taps=[];
    taps.push(t);
    if(taps.length>5) taps.shift();
    if(taps.length>=2){
      const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);
      bpm=Math.min(300,Math.max(30,Math.round(60000/iv)));
      $('bpm').value=bpm; $('bpmv').textContent=bpm;
      st.textContent='测速结果：'+bpm+' BPM';
    }
  };
  $('start').onclick=()=>playing?stop():start();
  $('bpm').addEventListener('input',()=>{bpm=+$('bpm').value;$('bpmv').textContent=bpm;});
  $('bpmN').addEventListener('change',buildDots);
  buildDots();
})();
</script>
</body>
</html>
