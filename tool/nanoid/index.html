<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoID 生成器 · NanoID Generator</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  textarea{flex:1;min-height:200px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;
    padding:12px;font-family:"SF Mono",Consolas,Monaco,monospace;font-size:13px;line-height:1.7;resize:vertical;outline:none}
  .field{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .field label{color:var(--muted);font-size:13px}
  select,input[type=number],input[type=text]{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🆔 NanoID 生成器</h1>
    <div class="sub">基于 crypto.getRandomValues · 可定制字符集 · 纯本地</div>
  </div>
  <div class="toolbar">
    <button id="bGen" class="primary">生成</button>
    <button id="bCopy">复制全部</button>
  </div>
</header>
<main>
  <section class="pane">
    <div class="card">
      <div class="pane-head">选项 Options</div>
      <div class="field">
        <label>预设</label>
        <select id="preset">
          <option value="url" selected>URL 安全（A-Za-z0-9_-）</option>
          <option value="alnum">字母数字</option>
          <option value="num">纯数字</option>
          <option value="hex">十六进制</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="field" id="customWrap" style="display:none">
        <label>字符集</label>
        <input type="text" id="custom" value="ABCDEF1234567890" style="flex:1;min-width:160px">
      </div>
      <div class="field">
        <label>长度</label>
        <input type="number" id="size" value="21" min="1" max="128" style="width:80px">
        <label>数量</label>
        <input type="number" id="count" value="10" min="1" max="200" style="width:80px">
      </div>
      <div class="hint">使用密码学安全随机源，适合生成令牌、短链 ID、会话标识。</div>
    </div>
  </section>
  <section class="pane">
    <div class="card" style="display:flex;flex-direction:column;height:100%">
      <div class="pane-head">结果 Result（每行一个）</div>
      <textarea id="result" readonly placeholder="点击“生成”…"></textarea>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  const PRESETS={url:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-',
    alnum:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789',
    num:'0123456789', hex:'0123456789abcdef'};
  function alphabet(){
    const p=$('preset').value;
    return p==='custom'? $('custom').value : PRESETS[p];
  }
  function genOne(a,size){
    if(!a) throw new Error('字符集为空');
    const bytes=crypto.getRandomValues(new Uint8Array(size));
    let id='';
    for(let i=0;i<size;i++) id+=a[bytes[i]%a.length];
    return id;
  }
  function gen(){
    try{
      const a=alphabet();
      const size=Math.max(1,Math.min(128,parseInt($('size').value,10)||21));
      const count=Math.max(1,Math.min(200,parseInt($('count').value,10)||10));
      const out=[];
      for(let i=0;i<count;i++) out.push(genOne(a,size));
      $('result').value=out.join('\n');
      setStatus('✓ 已生成 '+count+' 个 ID（长度 '+size+'）','ok');
    }catch(e){ setStatus('✗ '+e.message,'err'); }
  }
  $('preset').addEventListener('change',()=>{ $('customWrap').style.display=$('preset').value==='custom'?'flex':'none'; });
  $('bGen').onclick=gen;
  $('bCopy').onclick=async()=>{ if(!$('result').value){setStatus('没有可复制的结果','err');return;} try{await navigator.clipboard.writeText($('result').value);setStatus('✓ 已复制到剪贴板','ok');}catch(e){setStatus('复制失败：'+e.message,'err');} };
  gen();
})();
</script>
</body>
</html>
