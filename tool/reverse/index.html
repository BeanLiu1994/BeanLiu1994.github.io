<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本反转与回文检测 · Text Reverser</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  textarea{width:100%;min-height:140px;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;font-size:14px;outline:none;font-family:inherit;resize:vertical}
  textarea:focus{border-color:var(--accent)}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  label{color:var(--muted);font-size:13px}
  button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  button:hover{filter:brightness(1.08)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;color:var(--muted);border:none;border-radius:0;padding:7px 12px}
  .seg button.on{background:var(--accent);color:#fff}
  .out{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;font-size:14px;min-height:60px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .badge.ok{background:rgba(62,207,142,.16);color:var(--ok)}
  .badge.err{background:rgba(255,93,108,.16);color:var(--err)}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
  .check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:8px 0}
  .check input{width:16px;height:16px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🔁 文本反转与回文检测</h1>
    <div class="sub">字符 / 单词 / 行反转 · 回文判断 · 纯本地</div>
  </div>
</header>
<main>
  <section class="pane">
    <div class="card">
      <div class="pane-head">输入文本</div>
      <textarea id="inp" placeholder="输入要反转的内容…">上海自来水来自海上</textarea>
      <div class="row" style="margin-top:10px">
        <label>模式</label>
        <div class="seg" id="mode">
          <button data-m="chars" class="on">反转字符</button>
          <button data-m="words">反转单词</button>
          <button data-m="lines">反转行序</button>
        </div>
      </div>
      <div class="row">
        <button id="run">反转</button>
        <button class="ghost" id="copy">复制</button>
        <button class="ghost" id="clear">清空</button>
      </div>
    </div>
  </section>
  <section class="pane">
    <div class="card">
      <div class="pane-head">结果</div>
      <div class="out" id="out">—</div>
      <div class="check"><input type="checkbox" id="pal"> 同时检测是否为回文（忽略空格与标点）</div>
      <div id="palRes"></div>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  let mode='chars';

  function reverseChars(s){ return Array.from(s).reverse().join(''); }
  function reverseWords(s){
    // 保留空白结构，仅反转单词顺序
    const tokens = s.match(/\s+|[^\s]+/g) || [];
    const words = tokens.filter(t=>/\S/.test(t));
    let wi = words.length-1;
    return tokens.map(t=>/\S/.test(t)?words[wi--]:t).join('');
  }
  function reverseLines(s){
    return s.split('\n').reverse().join('\n');
  }

  function run(){
    const s=$('inp').value;
    let r;
    if(mode==='chars') r=reverseChars(s);
    else if(mode==='words') r=reverseWords(s);
    else r=reverseLines(s);
    $('out').textContent = r.length?r:'(空)';
    if($('pal').checked) checkPal(s);
    else $('palRes').innerHTML='';
    $('st').textContent='✓ 已'+ (mode==='chars'?'反转字符':mode==='words'?'反转单词':'反转行序');
    window.__out=r;
  }
  function checkPal(s){
    const clean=Array.from(s.toLowerCase()).filter(c=>/[一-龥a-z0-9]/.test(c)).join('');
    const isP = clean && clean===Array.from(clean).reverse().join('');
    $('palRes').innerHTML = '<span class="badge '+(isP?'ok':'err')+'">'+(isP?'✓ 是回文':'✗ 不是回文')+'</span>'+
      ' <span style="color:var(--muted);font-size:13px">有效字符 '+clean.length+' 个</span>';
  }
  $('run').addEventListener('click',run);
  $('copy').addEventListener('click',()=>{ if(window.__out!==undefined){ navigator.clipboard&&navigator.clipboard.writeText(window.__out); $('st').textContent='✓ 已复制'; } });
  $('clear').addEventListener('click',()=>{ $('inp').value=''; run(); });
  $('mode').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; mode=b.dataset.m;
    [...$('mode').children].forEach(x=>x.classList.toggle('on',x===b)); run(); });
  $('pal').addEventListener('change',run);
  $('inp').addEventListener('input',run);
  run();
})();
</script>
</body>
</html>
