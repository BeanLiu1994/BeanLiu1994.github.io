<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV ⇄ JSON 转换 · CSV ⇄ JSON</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px}
  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0}
  .pane.left{border-right:1px solid var(--border)}
  .pane-head{padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:1px}
  textarea{flex:1;background:transparent;color:var(--text);border:0;resize:none;outline:none;
    padding:16px;font-family:"SF Mono",Consolas,Monaco,monospace;font-size:13px;line-height:1.6;tab-size:2}
  .status{padding:8px 20px;font-size:13px;border-top:1px solid var(--border);min-height:36px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  @media(max-width:720px){main{flex-direction:column}.pane.left{border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<header>
  <div>
    <h1>📊 CSV ⇄ JSON 转换</h1>
    <div class="sub">CSV 转 JSON（按首行表头）· JSON 转 CSV · 纯本地</div>
  </div>
  <div class="toolbar">
    <button id="bCsv2Json" class="primary">CSV → JSON</button>
    <button id="bJson2Csv">JSON → CSV</button>
    <label><input type="checkbox" id="flatten"> 扁平化嵌套字段</label>
    <button id="bCopy">复制</button>
    <button id="bExample">示例</button>
    <button id="bClear">清空</button>
  </div>
</header>
<main>
  <section class="pane left">
    <div class="pane-head"><span>输入 Input</span></div>
    <textarea id="input" placeholder="在此粘贴 CSV 或 JSON…">name,age,city
Alice,30,Beijing
Bob,25,Shanghai
Carol,28,Shenzhen</textarea>
  </section>
  <section class="pane">
    <div class="pane-head"><span>结果 Output</span><span class="hint" id="meta"></span></div>
    <textarea id="output" readonly placeholder="结果将显示在此…"></textarea>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script src="../shared/csv.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  function setStatus(m,t){const el=$('st');el.textContent=m;el.className='status'+(t?' '+t:'');}
  const isRecord=value=>value!==null && typeof value==='object' && !Array.isArray(value);

  function convert(action){
    try{
      action($('input').value);
    }catch(error){
      $('output').value='';
      $('meta').textContent='';
      setStatus('✗ '+error.message,'err');
    }
  }

  function csv2json(){
    convert(input=>{
      const rows=Csv.parse(input);
      Csv.validateRows(rows);
      const [headers,...data]=rows;
      if(new Set(headers).size!==headers.length) throw new Error('CSV 表头包含重复列名');
      const result=data.map(row=>Object.fromEntries(headers.map((name,i)=>[name,row[i]])));
      $('output').value=JSON.stringify(result,null,2);
      $('meta').textContent=result.length+' 条记录';
      setStatus('✓ CSV → JSON 完成','ok');
    });
  }

  function flatten(value,prefix,row){
    if(isRecord(value) && Object.keys(value).length){
      for(const [key,child] of Object.entries(value)) flatten(child,prefix+'.'+key,row);
    }else{
      if(row.has(prefix)) throw new Error('扁平化后列名重复：'+prefix);
      row.set(prefix,value);
    }
  }

  function json2csv(){
    convert(input=>{
      const data=JSON.parse(input);
      const records=Array.isArray(data)?data:[data];
      if(!records.length) throw new Error('空数组无法生成 CSV');
      const headers=new Set();
      const rows=records.map(record=>{
        const entries=isRecord(record)?Object.entries(record):[['value',record]];
        const row=new Map();
        for(const [key,value] of entries){
          if($('flatten').checked) flatten(value,key,row);
          else row.set(key,value);
        }
        for(const key of row.keys()) headers.add(key);
        return row;
      });
      const columns=[...headers];
      if(!columns.length) throw new Error('没有可转换的列');
      const output=rows.map(row=>columns.map(key=>{
        const value=row.get(key);
        return value!==null && typeof value==='object'?JSON.stringify(value):value;
      }));
      $('output').value=Csv.write([columns,...output]);
      $('meta').textContent=rows.length+' 条记录';
      setStatus('✓ JSON → CSV 完成','ok');
    });
  }
  if(new URLSearchParams(location.search).get('mode')==='flatten'){
    $('flatten').checked=true;
    $('input').value='[{"name":"Ada","address":{"city":"London"}}]';
    json2csv();
  }
  $('bCsv2Json').onclick=csv2json;
  $('bJson2Csv').onclick=json2csv;
  $('bExample').onclick=()=>{
    $('input').value='[\n  {"name":"Alice","age":30,"city":"Beijing"},\n  {"name":"Bob","age":25,"city":"Shanghai"}\n]';
    json2csv();
  };
  $('bCopy').onclick=async()=>{ if(!$('output').value){return;} try{ await navigator.clipboard.writeText($('output').value); setStatus('✓ 已复制','ok'); }catch(e){ setStatus('复制失败：'+e.message,'err'); } };
  $('bClear').onclick=()=>{ $('input').value=''; $('output').value=''; $('meta').textContent=''; };
})();
</script>
</body>
</html>
