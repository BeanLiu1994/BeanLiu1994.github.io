<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日历视图 · Calendar</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .cal{flex:1;min-width:300px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-title{font-size:16px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{text-align:center;color:var(--muted);font-size:12px;padding:4px 0}
  .cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:8px;
    background:var(--panel);border:1px solid var(--border);font-size:14px;cursor:pointer;transition:.12s}
  .cell:hover{border-color:var(--accent)}
  .cell.out{color:var(--muted);opacity:.4}
  .cell.today{border-color:var(--ok);color:var(--ok);font-weight:700}
  .cell.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .side{flex:1;min-width:260px;display:flex;flex-direction:column;gap:10px}
  .info{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .info .big{font-size:30px;font-weight:700}
  .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
  .row b{color:var(--text);font-weight:600}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>📅 日历视图</h1>
    <div class="sub">点击日期查看详情 · 纯本地</div>
  </div>
  <div class="toolbar">
    <button id="bPrev">◀ 上月</button>
    <button id="bToday" class="primary">今天</button>
    <button id="bNext">下月 ▶</button>
  </div>
</header>
<main>
  <section class="cal">
    <div class="cal-head"><span class="cal-title" id="title"></span></div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="side">
    <div class="info" id="info">
      <div class="big" id="iDate">—</div>
      <div class="row"><span>星期</span><b id="iDow">—</b></div>
      <div class="row"><span>年内第几天</span><b id="iDoy">—</b></div>
      <div class="row"><span>ISO 周数</span><b id="iWeek">—</b></div>
      <div class="row"><span>是否闰年</span><b id="iLeap">—</b></div>
      <div class="row"><span>Unix 时间戳</span><b id="iTs">—</b></div>
    </div>
    <div class="hint">周一为每周第一天。点击任意日期可在右侧查看详细信息。</div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const grid=$('grid'),title=$('title'),st=$('st');
  const DOW=['一','二','三','四','五','六','日'];
  const DOW_FULL=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  let cur=new Date(), sel=null;
  function setStatus(m){st.textContent=m;}
  function isoWeek(d){
    const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    const day=date.getUTCDay()||7;
    date.setUTCDate(date.getUTCDate()+4-day);
    const yearStart=new Date(Date.UTC(date.getUTCFullYear(),0,1));
    return Math.ceil((((date-yearStart)/86400000)+1)/7);
  }
  function dayOfYear(d){
    const start=new Date(d.getFullYear(),0,0);
    return Math.floor((d-start)/86400000);
  }
  function isLeap(y){ return (y%4===0&&y%100!==0)||y%400===0; }
  function show(d){
    $('iDate').textContent=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    $('iDow').textContent=DOW_FULL[d.getDay()];
    $('iDoy').textContent=dayOfYear(d)+' 天';
    $('iWeek').textContent='第 '+isoWeek(d)+' 周';
    $('iLeap').textContent=isLeap(d.getFullYear())?'是':'否';
    $('iTs').textContent=Math.floor(d.getTime()/1000);
  }
  function render(){
    const y=cur.getFullYear(),m=cur.getMonth();
    title.textContent=y+' 年 '+(m+1)+' 月';
    grid.innerHTML='';
    DOW.forEach(d=>{ const e=document.createElement('div'); e.className='dow'; e.textContent=d; grid.appendChild(e); });
    const first=new Date(y,m,1);
    const lead=(first.getDay()+6)%7;
    const days=new Date(y,m+1,0).getDate();
    const today=new Date();
    const total=Math.ceil((lead+days)/7)*7;
    for(let i=0;i<total;i++){
      const dayNum=i-lead+1;
      const cell=document.createElement('div');
      cell.className='cell';
      if(dayNum<1||dayNum>days){ cell.classList.add('out'); cell.textContent=dayNum<1?new Date(y,m,dayNum).getDate():new Date(y,m+1,dayNum-days).getDate(); }
      else{
        cell.textContent=dayNum;
        const cd=new Date(y,m,dayNum);
        if(cd.getFullYear()===today.getFullYear()&&cd.getMonth()===today.getMonth()&&cd.getDate()===today.getDate()) cell.classList.add('today');
        if(sel&&cd.getTime()===sel.getTime()) cell.classList.add('sel');
        cell.onclick=()=>{ sel=cd; show(cd); render(); };
      }
      grid.appendChild(cell);
    }
    setStatus('已显示 '+y+' 年 '+(m+1)+' 月');
  }
  $('bPrev').onclick=()=>{ cur=new Date(cur.getFullYear(),cur.getMonth()-1,1); render(); };
  $('bNext').onclick=()=>{ cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); render(); };
  $('bToday').onclick=()=>{ cur=new Date(); sel=new Date(); show(sel); render(); };
  sel=new Date(); show(sel); render();
})();
</script>
</body>
</html>
