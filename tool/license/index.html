<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开源协议生成器 · License Generator</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  label.indent{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
  select,input[type=text]{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;outline:none}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .left{flex:1;min-width:280px;display:flex;flex-direction:column;gap:12px}
  .right{flex:1;min-width:320px;display:flex;flex-direction:column}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  textarea{flex:1;min-height:380px;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:10px;resize:vertical;outline:none;padding:14px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;font-size:12px;line-height:1.6}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <h1>📜 开源协议生成器</h1>
    <div class="sub">自动填入版权信息 · 纯本地</div>
  </div>
  <div class="toolbar">
    <button id="bCopy" class="primary">复制</button>
    <button id="bDown">下载 LICENSE</button>
  </div>
</header>
<main>
  <section class="left">
    <div class="field">
      <span>选择协议</span>
      <select id="type">
        <option value="MIT">MIT License</option>
        <option value="BSD">BSD 3-Clause License</option>
        <option value="ISC">ISC License</option>
        <option value="Unlicense">The Unlicense</option>
        <option value="Apache">Apache License 2.0</option>
      </select>
    </div>
    <div class="field"><span>版权所有者（fullname）</span><input type="text" id="name" placeholder="例如 Peng Liu" value="Peng Liu"></div>
    <div class="field"><span>年份（year）</span><input type="text" id="year" placeholder="例如 2026" value="2026"></div>
    <div class="hint">生成的是常见开源协议的标准文本，可直接写入仓库根目录的 LICENSE 文件。请确认所选协议符合你的需求。</div>
  </section>
  <section class="right">
    <div class="pane-head">LICENSE 预览</div>
    <textarea id="out" spellcheck="false"></textarea>
  </section>
</main>
<div class="status" id="st">就绪</div>

  function build(){
    const name=$('name').value.trim()||'[fullname]';
    const year=$('year').value.trim()||'[year]';
    let t=T[$('type').value]||'';
    t=t.split('[fullname]').join(name).split('[year]').join(year);
    out.value=t;
    setStatus('✓ 已生成 '+($('type').selectedOptions[0].text),'ok');
  }
  $('type').onchange=build;
  $('name').oninput=build;
  $('year').oninput=build;
  $('bCopy').onclick=async()=>{ if(!out.value.trim()){setStatus('没有内容','err');return;} try{ await navigator.clipboard.writeText(out.value); setStatus('✓ 已复制','ok'); }catch(e){ setStatus('复制失败：'+e.message,'err'); } };
  $('bDown').onclick=()=>{
    const blob=new Blob([out.value],{type:'text/plain'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='LICENSE'; a.click();

</html>
