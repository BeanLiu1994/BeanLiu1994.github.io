<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作日计算 · Workday Counter</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  label{color:var(--muted);font-size:13px;min-width:64px}
  input[type=date],textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;outline:none;font-family:inherit}
  input[type=date]{flex:1;min-width:140px}
  input[type=date]:focus,textarea:focus{border-color:var(--accent)}
  textarea{width:100%;min-height:78px;resize:vertical;line-height:1.6}
  .result{font-size:15px;line-height:2}
  .result b{color:var(--accent);font-size:18px}
  .result .k{color:var(--muted)}
  .chk{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
</style>
</head>
<body>
<header><div><h1>📅 工作日计算</h1><div class="sub">两个日期之间的工作日天数（排除周末与自定义节假日）· 纯本地</div></div></header>
<main>
  <section class="pane">
    <div class="card">
      <div class="pane-head">日期范围（含首尾）</div>
      <div class="row"><label>开始</label><input type="date" id="start"></div>
      <div class="row"><label>结束</label><input type="date" id="end"></div>
      <div class="row"><label class="chk"><input type="checkbox" id="inc" checked style="width:16px;height:16px"> 包含节假日当天（不扣除）</label></div>
    </div>
    <div class="card">
      <div class="pane-head">自定义节假日（YYYY-MM-DD，每行一个，可选）</div>
      <textarea id="holidays" placeholder="2026-01-01&#10;2026-05-01&#10;2026-10-01"></textarea>
    </div>
  </section>
  <section class="pane">
    <div class="card">
      <div class="pane-head">结果</div>
      <div class="result" id="out">请选择日期</div>
    </div>
    <div class="card">
      <div class="pane-head">说明</div>
      <div style="color:var(--muted);font-size:13px;line-height:1.7">
        工作日 = 周一至周五。周末（周六、周日）不计入。<br>
        若在「节假日」中填写日期且该日落在工作日，默认会被扣除（取消勾选「包含节假日当天」即扣除）。<br>
        计算为闭区间：开始日与结束日都计入。
      </div>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  function ymd(d){ return d.toISOString().slice(0,10); }
  function parseHolidays(){
    return new Set($('holidays').value.split(/\n+/).map(s=>s.trim()).filter(Boolean));
  }
  function calc(){
    const s=$('start').value, e=$('end').value;
    if(!s||!e){ $('out').innerHTML='请选择开始与结束日期'; return; }
    let sd=new Date(s+'T00:00:00'), ed=new Date(e+'T00:00:00');
    if(sd>ed){ const t=sd; sd=ed; ed=t; }
    const hol=parseHolidays(), incH=$('inc').checked;
    let days=0, work=0, wknd=0, holi=0;
    for(let cur=new Date(sd); cur<=ed; cur.setDate(cur.getDate()+1)){
      days++;
      const dow=cur.getDay(); const key=ymd(cur);
      if(dow===0||dow===6){ wknd++; }
      else if(hol.has(key)){ if(incH){ work++; } else { holi++; } }
      else work++;
    }
    $('out').innerHTML=
      '<div><span class="k">总天数：</span><b>'+days+'</b> 天</div>'+
      '<div><span class="k">工作日：</span><b>'+work+'</b> 天</div>'+
      '<div><span class="k">周末：</span>'+wknd+' 天</div>'+
      (holi?('<div><span class="k">被扣除节假日：</span>'+holi+' 天</div>'):'');
    $('st').textContent='✓ 计算完成';
  }
  ['start','end','inc','holidays'].forEach(id=>$(id).addEventListener('input',calc));
  calc();
})();
</script>
</body>
</html>
