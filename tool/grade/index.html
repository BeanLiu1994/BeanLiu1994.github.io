<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加权成绩计算器 · Grade</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;max-width:760px;margin:0 auto;width:100%}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
  label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
  input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;outline:none;font-family:inherit}
  input:focus,select:focus{border-color:var(--accent)}
  td input{width:100%}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 6px;text-align:left;vertical-align:middle}
  th{color:var(--muted);font-weight:500}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
  .btn:hover{opacity:.9}
  .btn.sm{margin:0;padding:6px 10px;font-size:13px}
  .results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
  .stat .k{color:var(--muted);font-size:12px}
  .stat .v{font-size:19px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-all}
  .stat .v.ok{color:var(--ok)}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  @media(max-width:560px){ .results{grid-template-columns:1fr} }
</style>
</head>
<body>
<header><div><h1>📚 加权成绩计算器</h1><div class="sub">加权平均 · GPA(4.0) · 纯本地</div></div></header>
<main>
  <div class="card">
    <div class="pane-head">科目列表</div>
    <table id="tbl">
      <thead><tr><th style="width:42%">科目</th><th>成绩</th><th>学分</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <button id="add" class="btn" style="margin-top:10px">+ 添加科目</button>
  </div>
  <div class="card">
    <div class="results">
      <div class="stat"><div class="k">加权平均</div><div class="v ok" id="rAvg">—</div></div>
      <div class="stat"><div class="k">GPA (4.0)</div><div class="v" id="rGpa">—</div></div>
      <div class="stat"><div class="k">总学分</div><div class="v" id="rCredit">—</div></div>
    </div>
  </div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  function setStatus(m,t){ $('st').textContent=m; $('st').className='status'+(t?' '+t:''); }
  function gpaOf(s){ if(s>=90)return 4.0; if(s>=85)return 3.7; if(s>=82)return 3.3; if(s>=78)return 3.0; if(s>=75)return 2.7; if(s>=72)return 2.3; if(s>=68)return 2.0; if(s>=64)return 1.5; if(s>=60)return 1.0; return 0; }
  function addRow(name='',score='',credit=''){
    const tr=document.createElement('tr');
    tr.innerHTML='<td><input placeholder="科目" value="'+name+'"></td>'+
      '<td><input type="number" min="0" max="100" step="0.1" value="'+score+'" style="width:90px"></td>'+
      '<td><input type="number" min="0" step="0.5" value="'+credit+'" style="width:80px"></td>'+
      '<td><button class="btn sm">✕</button></td>';
    const ins=[tr.querySelector('input'),tr.querySelectorAll('input')[1],tr.querySelectorAll('input')[2]];
    ins.forEach(i=>i.addEventListener('input',calc));
    tr.querySelector('button').addEventListener('click',()=>{ tr.remove(); calc(); });
    $('tbl').querySelector('tbody').appendChild(tr);
  }
  function calc(){
    const rows=[...$('tbl').querySelector('tbody').querySelectorAll('tr')];
    let sumW=0,sumC=0,sumG=0,n=0;
    rows.forEach(tr=>{ const score=parseFloat(tr.querySelectorAll('input')[1].value); const credit=parseFloat(tr.querySelectorAll('input')[2].value);
      if(!isNaN(score)&&!isNaN(credit)&&credit>0){ sumW+=score*credit; sumC+=credit; sumG+=gpaOf(score)*credit; n++; } });
    if(n===0){ $('rAvg').textContent='—';$('rGpa').textContent='—';$('rCredit').textContent='—'; setStatus('请填写成绩与学分','err'); return; }
    $('rAvg').textContent=(sumW/sumC).toFixed(2);
    $('rGpa').textContent=(sumG/sumC).toFixed(2);
    $('rCredit').textContent=sumC;
    setStatus('✓ 已计算 '+n+' 门','ok');
  }
  $('add').addEventListener('click',()=>addRow());
  addRow('数学',92,4); addRow('英语',85,3); addRow('物理',78,3);
  calc();
})();
</script>
</body>
</html>
