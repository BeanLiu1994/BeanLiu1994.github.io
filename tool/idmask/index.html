<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>身份证 / 手机号脱敏校验 · ID & Phone Mask</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:12px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  input[type=text]{background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:11px 13px;font-size:14px;outline:none;width:100%}
  textarea{flex:1;min-height:180px;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:10px;resize:vertical;outline:none;padding:14px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;font-size:13px;line-height:1.6}
  .info-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:13px;line-height:1.9}
  .info-card b{color:var(--accent)}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🪪 身份证 / 手机号脱敏校验</h1>
    <div class="sub">GB 11643 校验码 · 纯本地运行 · 数据不上传</div>
  </div>
  <div class="toolbar">
    <button id="bProc" class="primary">校验 / 脱敏</button>
    <button id="bCopy">复制结果</button>
    <button id="bClear">清空</button>
  </div>
</header>
<main>
  <section class="pane">
    <div class="pane-head">输入 Input</div>
    <input type="text" id="in" placeholder="粘贴 18 位身份证号或 11 位手机号…" spellcheck="false" style="font-family:monospace">
    <div class="pane-head">脱敏结果 Masked</div>
    <textarea id="out" readonly spellcheck="false" placeholder="脱敏结果将显示在这里…"></textarea>
    <div class="hint">脱敏仅保留首尾，中间以 * 代替，可安全用于演示/日志。</div>
  </section>
  <section class="pane">
    <div class="pane-head">解析信息 Parsed</div>
    <div class="info-card" id="info">等待输入…</div>
  </section>
</main>
<div class="status" id="st">等待输入…</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const inp=$('in'),out=$('out'),info=$('info'),st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}

  function maskID(id){
    return id.slice(0,6)+'********'+id.slice(14);
  }
  function validateID(id){
    if(!/^\d{17}[\dXx]$/.test(id)) return {ok:false,msg:'格式错误：应为 18 位数字（末位可为 X）'};
    const w=[7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2];
    const c='10X98765432';
    let sum=0;
    for(let i=0;i<17;i++) sum+=(+id[i])*w[i];
    const ok=c[sum%11]===id[17].toUpperCase();
    return {ok,check:c[sum%11]};
  }
  function infoID(id){
    const y=+id.slice(6,10),m=+id.slice(10,12),d=+id.slice(12,14);
    const date=new Date(y,m-1,d); const now=new Date();
    let age=now.getFullYear()-y; if(now<new Date(now.getFullYear(),m-1,d)) age--;
    const gender=(+id[16])%2===1?'男':'女';
    return {y,m,d,age,gender};
  }

  function maskPhone(p){ return p.slice(0,3)+'****'+p.slice(7); }

  $('bProc').onclick=()=>{
    const v=inp.value.trim();
    if(!v){setStatus('请输入内容','err');return;}
    if(/^\d{17}[\dXx]$/.test(v)){
      const r=validateID(v);
      if(!r.ok){ out.value=maskID(v); info.innerHTML='<span style="color:var(--err)">✗ 校验码错误</span>（应为 '+r.check+'）'; setStatus('⚠ 号码校验码不正确，已脱敏','err'); return; }
      const i=infoID(v);
      out.value=maskID(v);
      info.innerHTML='<b>类型</b>：中国大陆居民身份证<br><b>出生</b>：'+i.y+'-'+String(i.m).padStart(2,'0')+'-'+String(i.d).padStart(2,'0')+
        '<br><b>年龄</b>：'+i.age+' 岁<br><b>性别</b>：'+i.gender+'<br><b>校验</b>：<span style="color:var(--ok)">✓ 合法</span>';
      setStatus('✓ 身份证校验通过并已脱敏','ok');
    } else if(/^1[3-9]\d{9}$/.test(v)){
      out.value=maskPhone(v);
      info.innerHTML='<b>类型</b>：中国大陆手机号<br><b>号段</b>：'+v.slice(0,3)+'<br><b>校验</b>：<span style="color:var(--ok)">✓ 格式合法</span>';
      setStatus('✓ 手机号校验通过并已脱敏','ok');
    } else {
      setStatus('✗ 无法识别：请输入 18 位身份证或 11 位手机号','err');
      out.value=''; info.innerHTML='无法识别的输入。';
    }
  };
  $('bCopy').onclick=async()=>{
    if(!out.value){setStatus('没有可复制的内容','err');return;}
    try{ await navigator.clipboard.writeText(out.value); setStatus('✓ 已复制','ok'); }
    catch(e){ setStatus('复制失败：'+e.message,'err'); }
  };
  $('bClear').onclick=()=>{ inp.value=''; out.value=''; info.innerHTML='等待输入…'; setStatus('已清空'); };
})();
</script>
</body>
</html>
