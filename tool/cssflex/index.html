<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox 生成器 · Flexbox</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;max-width:760px;margin:0 auto;width:100%}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
  select,input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;outline:none;font-family:inherit}
  select:focus,input:focus{border-color:var(--accent)}
  #preview{display:flex;min-height:170px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px}
  .box{width:48px;height:48px;background:var(--accent);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600;flex:0 0 auto}
  pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;overflow:auto;margin:0;font-family:"SF Mono",monospace;line-height:1.6}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;margin-top:10px}
  .btn:hover{opacity:.9}
  .pane-head{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  @media(max-width:560px){ .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>
<header><div><h1>📦 Flexbox 生成器</h1><div class="sub">可视化布局 · 一键复制 CSS</div></div></header>
<main>
  <div class="card">
    <div class="grid2">
      <div><label>flex-direction</label><select id="dir"><option>row</option><option>row-reverse</option><option>column</option><option>column-reverse</option></select></div>
      <div><label>flex-wrap</label><select id="wrap"><option>nowrap</option><option>wrap</option><option>wrap-reverse</option></select></div>
      <div><label>justify-content</label><select id="jc"><option>flex-start</option><option>flex-end</option><option>center</option><option>space-between</option><option>space-around</option><option>space-evenly</option></select></div>
      <div><label>align-items</label><select id="ai"><option>stretch</option><option>flex-start</option><option>flex-end</option><option>center</option><option>baseline</option></select></div>
      <div><label>align-content</label><select id="ac"><option>stretch</option><option>flex-start</option><option>flex-end</option><option>center</option><option>space-between</option><option>space-around</option></select></div>
      <div><label>gap (px)</label><input id="gap" type="number" value="10" min="0"></div>
    </div>
  </div>
  <div class="card">
    <div class="pane-head">实时预览</div>
    <div id="preview">
      <div class="box">1</div><div class="box">2</div><div class="box">3</div><div class="box">4</div><div class="box">5</div>
    </div>
  </div>
  <div class="card">
    <div class="pane-head">CSS 代码</div>
    <pre id="code"></pre>
    <button class="btn" id="copy">复制 CSS</button>
  </div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  function setStatus(m,t){ $('st').textContent=m; $('st').className='status'+(t?' '+t:''); }
  function copyText(t){
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>setStatus('✓ 已复制','ok'),()=>fb(t)); }
    else fb(t);
  }
  function fb(t){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');setStatus('✓ 已复制','ok');}catch(e){setStatus('复制失败，请手动复制','err');} document.body.removeChild(ta); }
  function build(){
    const p=$('preview');
    const dir=$('dir').value, wrap=$('wrap').value, jc=$('jc').value, ai=$('ai').value, ac=$('ac').value, gap=$('gap').value||0;
    p.style.flexDirection=dir; p.style.flexWrap=wrap; p.style.justifyContent=jc; p.style.alignItems=ai; p.style.alignContent=ac; p.style.gap=gap+'px';
    const css='.container {\n  display: flex;\n  flex-direction: '+dir+';\n  flex-wrap: '+wrap+';\n  justify-content: '+jc+';\n  align-items: '+ai+';\n  align-content: '+ac+';\n  gap: '+gap+'px;\n}';
    $('code').textContent=css;
  }
  ['dir','wrap','jc','ai','ac','gap'].forEach(id=>$(id).addEventListener('input',build));
  $('copy').addEventListener('click',()=>copyText($('code').textContent));
  build();
  setStatus('✓ 实时预览已就绪','ok');
})();
</script>
</body>
</html>
