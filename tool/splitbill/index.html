<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分账计算器</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
  header{padding:14px 20px;border-bottom:1px solid var(--border);width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;justify-content:center;padding:20px;width:100%}
  .card{width:720px;max-width:100%;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
  .fields{display:flex;gap:14px;flex-wrap:wrap}
  .f{flex:1;min-width:150px}
  label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
  input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:11px 12px;font-size:17px;outline:none}
  input:focus{border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .cell{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center}
  .cell .k{color:var(--muted);font-size:12px}
  .cell .v{color:var(--accent);font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
  button{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;
    padding:10px 16px;font-size:14px;cursor:pointer;transition:.12s;font-family:inherit}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04122b;font-weight:600}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  .hint{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.6}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);width:100%;min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
</style>
</head>
<body>
<header><div><h1>🧾 分账计算器</h1><div class="sub">聚餐 / 账单均摊 · 纯本地</div></div></header>
<main>
  <div class="card">
    <div class="fields">
      <div class="f"><label>账单总额</label><input id="total" type="number" min="0" step="0.01" value="328"></div>
      <div class="f"><label>人数</label><input id="people" type="number" min="1" step="1" value="4"></div>
      <div class="f"><label>小费比例 %</label><input id="tip" type="number" min="0" step="0.1" value="10"></div>
    </div>
    <div class="row">
      <button class="primary" id="calc">计算</button>
      <label class="chk"><input type="checkbox" id="round" checked> 每人金额四舍五入到分</label>
    </div>
    <div class="grid">
      <div class="cell"><div class="k">含小费总额</div><div class="v" id="gross">—</div></div>
      <div class="cell"><div class="k">小费金额</div><div class="v" id="tipAmt">—</div></div>
      <div class="cell"><div class="k">每人应付</div><div class="v" id="per">—</div></div>
    </div>
    <p class="hint">适合朋友聚餐、AA 制分摊。输入账单总额、人数与小费比例，即可得出每人应付金额。金额按人民币（¥）计算。</p>
  </div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const fmt=n=>'¥'+n.toFixed(2);
  function run(){
    const total=+$('total').value, people=Math.max(1,Math.floor(+$('people').value)||1), tip=Math.max(0,+$('tip').value||0);
    if(!(total>=0)){ $('st').textContent='⚠ 请输入有效金额'; return; }
    const tipAmt=total*tip/100;
    const gross=total+tipAmt;
    let per=gross/people;
    if($('round').checked) per=Math.round(per*100)/100;
    $('gross').textContent=fmt(gross);
    $('tipAmt').textContent=fmt(tipAmt);
    $('per').textContent=fmt(per);
    $('st').textContent='✓ '+people+' 人均摊 '+fmt(per);
  }
  $('calc').addEventListener('click',run);
  ['total','people','tip','round'].forEach(id=>$(id).addEventListener('input',run));
  run();
})();
</script>
</body>
</html>
