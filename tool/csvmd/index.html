<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV ⇄ Markdown 表格 · CSV to Markdown</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  a.btn{display:inline-flex;align-items:center;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 13px;font-size:13px;text-decoration:none;cursor:pointer;transition:.15s}
  a.btn:hover{border-color:var(--accent);color:#fff}
  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0}
  .pane.left{border-right:1px solid var(--border)}
  .pane-head{padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center}
  textarea{flex:1;background:transparent;color:var(--text);border:0;resize:none;outline:none;
    padding:16px;font-family:"SF Mono",Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre}
  .status{padding:8px 16px;font-size:13px;border-top:1px solid var(--border);min-height:36px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
  @media(max-width:720px){main{flex-direction:column}.pane.left{border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<header>
  <div>
    <h1>📋 CSV ⇄ Markdown 表格</h1>
    <div class="sub">纯本地运行 · 支持带引号字段 · CSV ⇄ Markdown Table</div>
  </div>
  <div class="toolbar">
    <button id="bCsv2md" class="primary">CSV → MD</button>
    <button id="bMd2csv">MD → CSV</button>
    <button id="bCopy">复制</button>
    <button id="bSample">示例</button>
    <button id="bClear">清空</button>
    <a class="btn" href="../../">🏠 首页</a>
  </div>
</header>
<main>
  <section class="pane left">
    <div class="pane-head"><span>输入 Input</span><span class="hint" id="inMeta">CSV 或 Markdown</span></div>
    <textarea id="in" spellcheck="false" placeholder="粘贴 CSV 或 Markdown 表格…"></textarea>
  </section>
  <section class="pane">
    <div class="pane-head"><span>结果 Output</span><span class="hint" id="outMeta"></span></div>
    <textarea id="out" spellcheck="false" readonly placeholder="转换结果将显示在这里"></textarea>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script src="../shared/csv.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  const escapable=/[\\|\x60*_[\]~]/;
  const encoded={ '&amp;':'&','&lt;':'<','&gt;':'>','&#32;':' ','&#9;':'\t' };

  function encodeCell(value){
    return value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
      .replace(/[\t]|^ +| +$/g,spaces=>spaces==='\t'?'&#9;':'&#32;'.repeat(spaces.length))
      .replace(/[\r\n]+/g,breaks=>[...breaks.replace(/\r\n/g,'\n')].map(()=>'<br>').join(''))
      .replace(new RegExp(escapable.source,'g'),'\\$&');
  }

  function markdownRow(row){ return '| '+row.join(' | ')+' |'; }

  function csvToMd(text){
    const [header,...data]=Csv.parse(text);
    const rows=header?[header,...data]:[];
    Csv.validateRows(rows);
    const lines=[markdownRow(header.map(encodeCell)),markdownRow(header.map(()=> '---'))];
    for(const row of data) lines.push(markdownRow(row.map(encodeCell)));
    return { result:lines.join('\n'), count:rows.length };
  }

  function splitMarkdownRow(line){
    const input=line.trim();
    const cells=[];
    let value='', endsWithPipe=false;
    for(let i=0;i<input.length;i++){
      const char=input[i];
      endsWithPipe=false;
      if(char==='\\' && escapable.test(input[i+1]||'')){ value+=input[++i]; }
      else if(char==='|'){ cells.push(value); value=''; endsWithPipe=true; }
      else value+=char;
    }
    if(!endsWithPipe) cells.push(value);
    if(input.startsWith('|')) cells.shift();
    return cells.map(cell=>cell.trim());
  }

  function mdToCsv(text){
    const lines=text.trim().split(/\r?\n/);
    const [header=[],separator=[],...data]=lines.map(splitMarkdownRow);
    if(!header.length || separator.length!==header.length || !separator.every(cell=>/^:?-+:?$/.test(cell))){
      throw new Error('需要 Markdown 表头和分隔行');
    }
    const decode=cell=>cell.replace(/<br\s*\/?>|&amp;|&lt;|&gt;|&#32;|&#9;/gi,
      match=>match.toLowerCase().startsWith('<br')?'\n':(encoded[match]??match));
    const rows=[header,...data];
    Csv.validateRows(rows);
    return { result:Csv.write(rows.map(row=>row.map(decode))), count:rows.length };
  }

  function convert(action,label){
    const text=$('in').value;
    try{
      if(!text.trim()) throw new Error('请输入要转换的表格');
      const {result,count}=action(text);
      $('out').value=result;
      $('outMeta').textContent=count+' 行';
      setStatus('✓ '+label+'，'+count+' 行','ok');
    }catch(error){
      $('out').value='';
      $('outMeta').textContent='';
      setStatus('✗ '+error.message,'err');
    }
  }
  const csv2md=()=>convert(csvToMd,'CSV → Markdown');
  const md2csv=()=>convert(mdToCsv,'Markdown → CSV');
  $('bCsv2md').onclick=csv2md;
  $('bMd2csv').onclick=md2csv;
  $('bCopy').onclick=async()=>{const t=$('out').value;if(!t){setStatus('没有可复制的内容','err');return;}try{await navigator.clipboard.writeText(t);setStatus('✓ 已复制','ok');}catch(e){setStatus('复制失败：'+e.message,'err');}};
  $('bClear').onclick=()=>{$('in').value='';$('out').value='';$('outMeta').textContent='';setStatus('已清空');};
  $('bSample').onclick=()=>{$('in').value='name,age,city\n"Liu, Peng",28,Nanjing\nAlice,31,"New York, NY"\nBob,25,Beijing';csv2md();};
  setStatus('就绪');
})();
</script>
</body>
</html>
