<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 预览 · Markdown Preview</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0}
  .pane.left{border-right:1px solid var(--border)}
  .pane-head{padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:1px}
  textarea{flex:1;background:transparent;color:var(--text);border:0;resize:none;outline:none;
    padding:16px;font-family:"SF Mono",Consolas,Monaco,monospace;font-size:13px;line-height:1.6;tab-size:2}
  #preview{flex:1;overflow:auto;padding:20px 24px;line-height:1.7}
  #preview h1,#preview h2,#preview h3{color:#fff;border-bottom:1px solid var(--border);padding-bottom:6px;margin-top:1.2em}
  #preview code{background:var(--panel);padding:2px 6px;border-radius:5px;font-family:Consolas,monospace;font-size:.9em}
  #preview pre{background:var(--panel);padding:14px;border-radius:10px;overflow:auto}
  #preview pre code{background:none;padding:0}
  #preview blockquote{margin:0;padding:6px 16px;border-left:3px solid var(--accent);color:var(--muted)}
  #preview table{border-collapse:collapse}
  #preview th,#preview td{border:1px solid var(--border);padding:6px 10px}
  #preview a{color:var(--accent)}
  #preview img{max-width:100%}
  .status{padding:8px 20px;font-size:13px;border-top:1px solid var(--border);min-height:36px;display:flex;align-items:center;gap:8px;color:var(--ok)}
  @media(max-width:720px){main{flex-direction:column}.pane.left{border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<header>
  <div>
    <h1>📄 Markdown 预览</h1>
    <div class="sub">实时渲染 · 基于 marked (MIT) · 纯本地</div>
  </div>
  <div class="toolbar">
    <button id="bCopyHtml" class="primary">复制 HTML</button>
    <button id="bExample">示例</button>
    <button id="bClear">清空</button>
  </div>
</header>
<main>
  <section class="pane left">
    <div class="pane-head"><span>输入 Markdown</span></div>
    <textarea id="md" placeholder="在此输入 Markdown…"># 标题 H1

支持 **加粗**、*斜体*、`代码` 与 [链接](https://github.com)。

- 列表项 A
- 列表项 B

> 引用一段话

\`\`\`js
console.log("Hello, WorkBuddy!");
\`\`\`
</textarea>
  </section>
  <section class="pane">
    <div class="pane-head"><span>预览 Preview</span></div>
    <div id="preview"></div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script src="marked.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  let lastHtml='';
  function render(){
    const src=$('md').value;
    try{
      const html=marked.parse(src);
      lastHtml=html;
      $('preview').innerHTML=html;
      $('st').textContent='✓ 已渲染 '+src.length+' 字符';
    }catch(e){
      $('st').textContent='✗ 渲染失败：'+e.message;
    }
  }
  $('md').addEventListener('input',render);
  $('bExample').onclick=()=>{ $('md').value='# 示例文档\n\n这是 **Markdown** 示例，支持表格：\n\n| 名称 | 说明 |\n| --- | --- |\n| 工具 | 实用小工具 |\n'; render(); };
  $('bClear').onclick=()=>{ $('md').value=''; render(); $('md').focus(); };
  $('bCopyHtml').onclick=async()=>{ if(!lastHtml){return;} try{ await navigator.clipboard.writeText(lastHtml); $('st').textContent='✓ 已复制 HTML'; }catch(e){ $('st').textContent='复制失败：'+e.message; } };
  render();
})();
</script>
</body>
</html>
