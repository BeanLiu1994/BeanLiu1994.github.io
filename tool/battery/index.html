<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电池状态 · Battery Status</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; --warn:#ffb454; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .battery-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
  .battery{width:160px;height:78px;border:3px solid var(--border);border-radius:12px;position:relative;padding:6px}
  .battery::after{content:'';position:absolute;right:-12px;top:24px;width:10px;height:30px;background:var(--border);border-radius:0 4px 4px 0}
  .battery .fill{height:100%;border-radius:5px;background:var(--ok);transition:width .3s,background .3s}
  .pct{font-size:34px;font-weight:700}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .stat .k{color:var(--muted);font-size:12px}
  .stat .v{font-size:20px;font-weight:600;color:var(--accent);margin-top:4px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;background:var(--bg);border:1px solid var(--border)}
</style>
</head>
<body>
<header>
  <div>
    <h1>🔋 电池状态监测</h1>
    <div class="sub">基于 Navigator.getBattery · 实时更新 · 纯本地</div>
  </div>
</header>
<main>
  <section class="pane">
    <div class="card">
      <div class="pane-head">电量 Battery</div>
      <div class="battery-wrap">
        <div class="battery"><div class="fill" id="fill" style="width:0%"></div></div>
        <div class="pct" id="pct">--%</div>
        <span class="badge" id="state">--</span>
      </div>
    </div>
  </section>
  <section class="pane">
    <div class="card" style="display:flex;flex-direction:column;height:100%">
      <div class="pane-head">详情 Details</div>
      <div class="stat-grid" id="stats"></div>
      <div class="status" id="st" style="border:none;padding:14px 0 0;color:var(--muted)">检测中…</div>
    </div>
  </section>
</main>
<div class="status" id="st2">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const st=$('st2');
  function fmtTime(s){ if(!s||!isFinite(s))return '未知'; s=Math.round(s); const m=Math.floor(s/60), r=s%60; return m+' 分 '+(r<10?'0':'')+r+' 秒'; }
  function render(b){
    const lvl=Math.round(b.level*100);
    $('fill').style.width=lvl+'%';
    $('fill').style.background = lvl<=20? 'var(--err)' : lvl<=50? 'var(--warn)' : 'var(--ok)';
    $('pct').textContent=lvl+'%';
    $('state').textContent = b.charging? '⚡ 充电中' : '未充电';
    $('stats').innerHTML=[
      ['电量',lvl+'%'],
      ['状态',b.charging?'充电中':'放电中'],
      ['充满预计',b.charging?fmtTime(b.chargingTime):'—'],
      ['用完预计',!b.charging?fmtTime(b.dischargingTime):'—'],
      ['是否充电',b.charging?'是':'否'],
      ['是否支持',b?'是':'否']
    ].map(([k,v])=>'<div class="stat"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>').join('');
    $('st').textContent='数据实时更新中（'+(b.charging?'充电':'放电')+'）';
    st.textContent='✓ 已连接电池接口';
  }
  if(navigator.getBattery){
    navigator.getBattery().then(b=>{
      render(b);
      b.addEventListener('levelchange',()=>render(b));
      b.addEventListener('chargingchange',()=>render(b));
      b.addEventListener('chargingtimechange',()=>render(b));
      b.addEventListener('dischargingtimechange',()=>render(b));
    }).catch(e=>{ $('st').textContent='无法读取电池信息：'+e.message; st.textContent='✗ 读取失败'; });
  } else {
    $('fill').style.width='100%'; $('pct').textContent='N/A'; $('state').textContent='不支持';
    $('stats').innerHTML='<div class="stat" style="grid-column:1/3"><div class="k">提示</div><div class="v" style="font-size:15px;color:var(--muted)">当前浏览器不支持 Battery Status API（部分浏览器出于隐私已移除该接口）。</div></div>';
    $('st').textContent='当前浏览器不支持 Battery Status API。';
    st.textContent='⚠ 浏览器不支持';
  }
})();
</script>
</body>
</html>
