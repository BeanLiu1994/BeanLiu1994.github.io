<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目标心率区间计算器 · Heart Rate Zones</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border)}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px;margin-top:4px}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  label{color:var(--muted);font-size:13px;min-width:110px}
  input[type=number]{flex:1;min-width:90px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;outline:none}
  input[type=number]:focus{border-color:var(--accent)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{background:var(--bg);color:var(--muted);border:0;padding:8px 12px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .result{font-size:24px;font-weight:700;color:var(--accent)}
  .big-label{color:var(--muted);font-size:13px;margin-bottom:2px}
  .zone{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;margin-bottom:8px}
  .zone .bar{width:6px;align-self:stretch;border-radius:3px}
  .zone .nm{font-weight:600;font-size:14px} .zone .ds{color:var(--muted);font-size:12px}
  .zone .bpm{margin-left:auto;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
</style>
</head>
<body>
<header>
  <h1>❤️ 目标心率区间计算器</h1>
  <div class="sub">最大心率法 / 储备心率法（Karvonen）· 五个训练强度区间 · 纯本地</div>
</header>
<main>
  <section class="pane">
    <div class="card">
      <div class="pane-head">参数</div>
      <div class="row"><label>年龄</label><input type="number" id="age" value="30"></div>
      <div class="row"><label>静息心率</label><input type="number" id="rest" value="65"></div>
      <div class="row"><label>计算方法</label>
        <div class="seg" id="method"><button data-m="hrr" class="on">储备心率(Karvonen)</button><button data-m="max">最大心率百分比</button></div>
      </div>
      <div class="big-label" style="margin-top:8px">预估最大心率 (220-年龄)</div>
      <div class="result" id="hrmax">—</div>
    </div>
  </section>
  <section class="pane">
    <div class="card">
      <div class="pane-head">训练区间</div>
      <div id="zones"></div>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  let method='hrr';
  const ZONES=[
    ['Z1 热身 / 恢复',0.50,0.60,'#3ecf8e','轻松，可轻松交谈'],
    ['Z2 燃脂 / 有氧基础',0.60,0.70,'#4f9cff','长距离耐力训练'],
    ['Z3 有氧耐力',0.70,0.80,'#c084fc','提升心肺功能'],
    ['Z4 无氧阈值',0.80,0.90,'#f59e0b','较难，配速训练'],
    ['Z5 极限 / 冲刺',0.90,1.00,'#ff5d6c','最大强度，短时间'],
  ];
  function calc(){
    const age=+$('age').value||0, rest=+$('rest').value||0;
    if(age<=0){ $('st').textContent='请输入年龄'; return; }
    const hrmax=220-age;
    $('hrmax').textContent=hrmax+' bpm';
    const box=$('zones'); box.innerHTML='';
    ZONES.forEach(([nm,lo,hi,col,ds])=>{
      let a,b;
      if(method==='hrr'){ a=Math.round(lo*(hrmax-rest)+rest); b=Math.round(hi*(hrmax-rest)+rest); }
      else { a=Math.round(lo*hrmax); b=Math.round(hi*hrmax); }
      const el=document.createElement('div'); el.className='zone'; el.style.background='rgba(255,255,255,0.03)';
      el.innerHTML='<div class="bar" style="background:'+col+'"></div>'+
        '<div><div class="nm">'+nm+'</div><div class="ds">'+ds+' · '+Math.round(lo*100)+'–'+Math.round(hi*100)+'%</div></div>'+
        '<div class="bpm" style="color:'+col+'">'+a+'–'+b+'</div>';
      box.appendChild(el);
    });
    $('st').textContent='✓ 方法：'+(method==='hrr'?'储备心率法（含静息心率）':'最大心率百分比');
  }
  $('method').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; method=b.dataset.m;
    [...$('method').children].forEach(x=>x.classList.toggle('on',x===b)); calc(); });
  document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));
  calc();
})();
</script>
</body>
</html>
