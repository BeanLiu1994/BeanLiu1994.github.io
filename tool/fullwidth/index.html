<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全角半角转换 · Full-width / Half-width</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  a.btn{display:inline-flex;align-items:center;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 13px;font-size:13px;text-decoration:none;cursor:pointer;transition:.15s}
  a.btn:hover{border-color:var(--accent);color:#fff}
  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0}
  .pane.left{border-right:1px solid var(--border)}
  .pane-head{padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center}
  textarea{flex:1;background:transparent;color:var(--text);border:0;resize:none;outline:none;
    padding:16px;font-family:"SF Mono",Consolas,monospace;font-size:14px;line-height:1.6}
  .status{padding:8px 16px;font-size:13px;border-top:1px solid var(--border);min-height:36px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
  @media(max-width:720px){main{flex-direction:column}.pane.left{border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<header>
  <div>
    <h1>🔡 全角 / 半角转换</h1>
    <div class="sub">纯本地运行 · Full-width ⇄ Half-width</div>
  </div>
  <div class="toolbar">
    <button id="bFW" class="primary">半角 → 全角</button>
    <button id="bHW">全角 → 半角</button>
    <button id="bCopy">复制结果</button>
    <button id="bClear">清空</button>
    <a class="btn" href="../../">🏠 首页</a>
  </div>
</header>
<main>
  <section class="pane left">
    <div class="pane-head"><span>输入 Input</span></div>
    <textarea id="in" spellcheck="false" placeholder="在此粘贴文本…"></textarea>
  </section>
  <section class="pane">
    <div class="pane-head"><span>结果 Output</span><span class="hint" id="meta"></span></div>
    <textarea id="out" spellcheck="false" readonly placeholder="转换结果将显示在这里"></textarea>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  function toFull(s){
    let r='';
    for(const ch of s){
      const c=ch.codePointAt(0);
      if(c>=0x21&&c<=0x7E) r+=String.fromCodePoint(c+0xFEE0);
      else if(ch===' ') r+='　';
      else r+=ch;
    }
    return r;
  }
  function toHalf(s){
    let r='';
    for(const ch of s){
      const c=ch.codePointAt(0);
      if(c>=0xFF01&&c<=0xFF5E) r+=String.fromCodePoint(c-0xFEE0);
      else if(ch==='　') r+=' ';
      else r+=ch;
    }
    return r;
  }
  function go(fn,label){
    const v=$('in').value;
    if(!v){setStatus('请先输入文本','err');return;}
    const r=fn(v);
    $('out').value=r;
    let changed=0;for(let i=0;i<r.length;i++) if(r[i]!==v[i]) changed++;
    $('meta').textContent='变化 '+changed+' 处';
    setStatus('✓ 已'+label,'ok');
  }
  $('bFW').onclick=()=>go(toFull,'转为全角');
  $('bHW').onclick=()=>go(toHalf,'转为半角');
  $('bCopy').onclick=async()=>{const t=$('out').value;if(!t){setStatus('没有可复制的内容','err');return;}try{await navigator.clipboard.writeText(t);setStatus('✓ 已复制','ok');}catch(e){setStatus('复制失败：'+e.message,'err');}};
  $('bClear').onclick=()=>{$('in').value='';$('out').value='';$('meta').textContent='';setStatus('已清空');};
  $('in').addEventListener('input',()=>{ if($('in').value) go(toFull,'转为全角'); });
  setStatus('就绪 · ASCII 与标点可在全角/半角间互转');
})();
</script>
</body>
</html>
