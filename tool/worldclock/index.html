<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界时钟 · World Clock</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .clk{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .clk .city{color:var(--muted);font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .clk .tz{font-size:11px;color:var(--border);background:var(--bg);padding:2px 7px;border-radius:999px}
  .clk .time{font-size:30px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .clk .date{color:var(--muted);font-size:13px;margin-top:4px}
  .clk .off{color:var(--accent);font-size:12px;margin-top:2px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
</style>
</head>
<body>
<header><div><h1>🌍 世界时钟</h1><div class="sub">多时区实时显示 · 纯本地（浏览器时区数据）</div></div></header>
<main>
  <div class="grid" id="grid"></div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const CITIES=[
    {n:'北京',     z:'Asia/Shanghai'},
    {n:'东京',     z:'Asia/Tokyo'},
    {n:'新加坡',   z:'Asia/Singapore'},
    {n:'迪拜',     z:'Asia/Dubai'},
    {n:'莫斯科',   z:'Europe/Moscow'},
    {n:'巴黎',     z:'Europe/Paris'},
    {n:'伦敦',     z:'Europe/London'},
    {n:'纽约',     z:'America/New_York'},
    {n:'洛杉矶',   z:'America/Los_Angeles'},
    {n:'悉尼',     z:'Australia/Sydney'},
    {n:'UTC',      z:'UTC'}
  ];
  const fmtTime=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'UTC'});
  const fmtDate=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short',timeZone:'UTC'});
  const fmtOff =new Intl.DateTimeFormat('en-US',{timeZoneName:'shortOffset',timeZone:'UTC'});
  // offset helper: compute UTC offset minutes for a zone at given date
  function offsetMin(z, date){
    const dtf=new Intl.DateTimeFormat('en-US',{timeZone:z,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const parts=dtf.formatToParts(date);
    const map={}; parts.forEach(p=>map[p.type]=p.value);
    let h=+map.hour; if(h===24)h=0;
    const asUTC=Date.UTC(+map.year,+map.month-1,+map.day,h,+map.minute,+map.second);
    return Math.round((asUTC - date.getTime())/60000);
  }
  function offStr(min){ const s=min<0?'-':'+'; const a=Math.abs(min); const h=Math.floor(a/60), m=a%60;
    return 'UTC'+s+h+(m?(':'+String(m).padStart(2,'0')):''); }
  const grid=$('grid');
  CITIES.forEach((c,i)=>{
    const d=document.createElement('div'); d.className='clk';
    d.innerHTML='<div class="city">'+c.n+'<span class="tz">'+c.z+'</span></div>'+
      '<div class="time" id="t'+i+'">--:--:--</div>'+
      '<div class="date" id="d'+i+'">—</div>'+
      '<div class="off" id="o'+i+'">—</div>';
    grid.appendChild(d);
  });
  function tick(){
    const now=new Date();
    CITIES.forEach((c,i)=>{
      const dtf=new Intl.DateTimeFormat('zh-CN',{timeZone:c.z,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,
        year:'numeric',month:'long',day:'numeric',weekday:'short'});
      const parts=dtf.formatToParts(now);
      const map={}; parts.forEach(p=>map[p.type]=p.value);
      $('t'+i).textContent=[map.hour,map.minute,map.second].join(':');
      $('d'+i).textContent=map.year+'年'+map.month+' '+map.day+'日 '+map.weekday;
      $('o'+i).textContent=offStr(offsetMin(c.z,now));
    });
    $('st').textContent='✓ 实时更新中';
  }
  tick(); setInterval(tick,1000);
})();
</script>
</body>
</html>
