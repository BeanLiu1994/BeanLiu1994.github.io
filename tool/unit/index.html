<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单位换算 · Unit Converter</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;max-width:720px;margin:0 auto;width:100%}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .row:last-child{margin-bottom:0}
  select,input[type=number]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;outline:none}
  input[type=number]{flex:1;min-width:140px;font-family:"SF Mono",monospace}
  select{min-width:130px}
  .arrow{color:var(--muted);font-size:18px}
  .table{display:grid;grid-template-columns:1fr auto;gap:8px 14px;margin-top:6px}
  .table .u{color:var(--muted);font-size:13px}
  .table .v{font-family:"SF Mono",monospace;font-size:13px;text-align:right;word-break:break-all}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>📐 单位换算</h1>
    <div class="sub">长度 · 重量 · 温度 · 数据 · 纯本地运行</div>
  </div>
</header>
<main>
  <div class="card">
    <div class="row">
      <select id="cat"></select>
      <span class="arrow">→</span>
    </div>
    <div class="row">
      <input type="number" id="val" value="1">
      <select id="from"></select>
      <span class="arrow">→</span>
      <input type="number" id="to" readonly>
      <select id="toUnit"></select>
    </div>
    <p class="hint" style="margin:10px 0 0">上下两个下拉框选择「从 / 到」单位；下方表格列出该类别下所有单位的等值换算。</p>
  </div>
  <div class="card">
    <div class="pane-head" style="color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">全部换算 All Conversions</div>
    <div class="table" id="all"></div>
  </div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  // 以基准单位换算（温度单独处理）
  const CATS={
    length:{base:'米 (m)',units:{ '毫米 (mm)':0.001,'厘米 (cm)':0.01,'分米 (dm)':0.1,'米 (m)':1,'千米 (km)':1000,
      '英寸 (in)':0.0254,'英尺 (ft)':0.3048,'码 (yd)':0.9144,'英里 (mi)':1609.344 }},
    weight:{base:'千克 (kg)',units:{ '毫克 (mg)':0.000001,'克 (g)':0.001,'千克 (kg)':1,'吨 (t)':1000,
      '盎司 (oz)':0.0283495231,'磅 (lb)':0.45359237,'斤':0.5 }},
    data:{base:'字节 (B)',units:{ '比特 (bit)':0.125,'字节 (B)':1,'千字节 (KB)':1024,'兆字节 (MB)':1048576,
      '吉字节 (GB)':1073741824,'太字节 (TB)':1099511627776 }},
    temperature:{base:'°C',special:true}
  };
  const CAT_LABEL={length:'长度 Length',weight:'重量 Weight',data:'数据 Data',temperature:'温度 Temperature'};

  function fmt(n){ if(!isFinite(n)) return '—';
    if(n!==0 && (Math.abs(n)<1e-6||Math.abs(n)>=1e15)) return n.toExponential(6);
    return (Math.round(n*1e6)/1e6).toString(); }

  function toBase(cat,unit,val){
    if(cat==='temperature'){
      if(unit==='°C') return val;
      if(unit==='°F') return (val-32)*5/9;
      if(unit==='K') return val-273.15;
    }
    return val*(CATS[cat].units[unit]);
  }
  function fromBase(cat,unit,base){
    if(cat==='temperature'){
      if(unit==='°C') return base;
      if(unit==='°F') return base*9/5+32;
      if(unit==='K') return base+273.15;
    }
    return base/(CATS[cat].units[unit]);
  }

  function init(){
    Object.keys(CATS).forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=CAT_LABEL[c]; $('cat').appendChild(o); });
    $('cat').onchange=loadCat;
    loadCat();
  }
  function loadCat(){
    const cat=$('cat').value; const c=CATS[cat];
    const units=Object.keys(c.units||{ '°C':1,'°F':1,'K':1 });
    ['from','toUnit'].forEach(sel=>{ $(sel).innerHTML=''; units.forEach(u=>{ const o=document.createElement('option'); o.value=u;o.textContent=u;$(sel).appendChild(o); }); });
    if(cat==='temperature'){ $('toUnit').value='°F'; }
    else { $('from').value=Object.keys(c.units)[0]; $('toUnit').value=Object.keys(c.units)[1]||Object.keys(c.units)[0]; }
    ['val','from','toUnit'].forEach(id=>$(id).addEventListener('input',convert));
    convert();
  }
  function convert(){
    const cat=$('cat').value; const v=parseFloat($('val').value);
    if(isNaN(v)){ $('to').value=''; $('all').innerHTML=''; setStatus('请输入数值','err'); return; }
    const base=toBase(cat,$('from').value,v);
    const res=fromBase(cat,$('toUnit').value,base);
    $('to').value=fmt(res);
    // 全部换算
    const units=Object.keys(CATS[cat].units||{ '°C':1,'°F':1,'K':1 });
    $('all').innerHTML=units.map(u=>{ const r=fmt(fromBase(cat,u,base)); return '<div class="u">'+u+'</div><div class="v">'+r+'</div>'; }).join('');
    setStatus('✓ 已换算','ok');
  }
  init();
})();
</script>
</body>
</html>
