<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颜色对比度检查 · Contrast Checker</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; --warn:#e5c07b; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .row{display:flex;align-items:center;gap:10px}
  input[type=color]{width:46px;height:38px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;padding:2px}
  input[type=text]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;flex:1;outline:none;font-family:"SF Mono",Consolas,monospace}
  input[type=text]:focus{border-color:var(--accent)}
  .preview{flex:1;min-height:150px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:6px;padding:20px;text-align:center;border:1px solid var(--border)}
  .preview .t{font-size:30px;font-weight:700}
  .preview .s{font-size:14px;opacity:.9}
  .ratio{font-size:40px;font-weight:800;text-align:center;color:var(--accent);margin:6px 0}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:13px;border:1px solid var(--border)}
  .badge.ok{color:var(--ok);border-color:rgba(62,207,142,.4);background:rgba(62,207,142,.08)}
  .badge.err{color:var(--err);border-color:rgba(255,93,108,.4);background:rgba(255,93,108,.08)}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
</style>
</head>
<body>
<header>
  <div>
    <h1>🎨 颜色对比度检查</h1>
    <div class="sub">WCAG 2.1 对比度 · 纯本地无障碍校验</div>
  </div>
</header>
<main>
  <section class="pane">
    <div class="card">
      <div class="pane-head">前景 Foreground</div>
      <div class="row"><input type="color" id="fgPick" value="#ffffff"><input type="text" id="fg" value="#ffffff"></div>
    </div>
    <div class="card">
      <div class="pane-head">背景 Background</div>
      <div class="row"><input type="color" id="bgPick" value="#0f1115"><input type="text" id="bg" value="#0f1115"></div>
    </div>
    <div class="card">
      <div class="pane-head">预览 Preview</div>
      <div class="preview" id="preview">
        <div class="t">Aa 文字示例</div>
        <div class="s">敏捷的棕色狐狸跳过懒狗</div>
      </div>
    </div>
  </section>
  <section class="pane">
    <div class="card">
      <div class="pane-head">对比度 Contrast Ratio</div>
      <div class="ratio" id="ratio">—</div>
      <div class="res-grid" id="results"></div>
    </div>
    <div class="card">
      <div class="pane-head">说明</div>
      <div style="color:var(--muted);font-size:13px;line-height:1.7">
        • <b>AA</b>：正文 ≥ 4.5，大文字(≥18px 或 14px 粗) ≥ 3.0<br>
        • <b>AAA</b>：正文 ≥ 7.0，大文字 ≥ 4.5<br>
        • <b>图形/UI 组件</b>：≥ 3.0 即可<br>
        比值基于 WCAG 2.1 相对亮度公式，符合无障碍规范。
      </div>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  function parseHex(h){ h=h.trim().replace(/^#/,''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); if(!/^[0-9a-fA-F]{6}$/.test(h)) return null; return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function lin(c){ c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
  function lum(rgb){ return 0.2126*lin(rgb[0])+0.7152*lin(rgb[1])+0.0722*lin(rgb[2]); }
  function ratio(a,b){ const L1=lum(a),L2=lum(b); const hi=Math.max(L1,L2),lo=Math.min(L1,L2); return (hi+0.05)/(lo+0.05); }
  function render(){
    const f=parseHex($('fg').value), b=parseHex($('bg').value);
    if(!f||!b){ $('st').textContent='✗ 请输入有效的十六进制颜色（如 #ffffff）'; $('st').style.color='var(--err)'; return; }
    $('fgPick').value='#'+f.map(x=>x.toString(16).padStart(2,'0')).join('');
    $('bgPick').value='#'+b.map(x=>x.toString(16).padStart(2,'0')).join('');
    const r=ratio(f,b);
    $('ratio').textContent=r.toFixed(2)+' : 1';
    const preview=$('preview');
    preview.style.background='#'+b.map(x=>x.toString(16).padStart(2,'0')).join('');
    preview.style.color='#'+f.map(x=>x.toString(16).padStart(2,'0')).join('');
    const rows=[
      ['正文 AA (≥4.5)', r>=4.5],
      ['大文字 AA (≥3.0)', r>=3.0],
      ['正文 AAA (≥7.0)', r>=7.0],
      ['大文字 AAA (≥4.5)', r>=4.5],
      ['UI/图形 (≥3.0)', r>=3.0],
    ];
    $('results').innerHTML=rows.map(([k,ok])=>'<div class="badge '+(ok?'ok':'err')+'">'+(ok?'✓ ':'✗ ')+k+'</div>').join('');
    $('st').textContent='✓ 对比度 '+r.toFixed(2)+' : 1'+(r>=4.5?'（满足 AA 正文）':'（未达 AA 正文）');
    $('st').style.color='';
  }
  ['fg','bg'].forEach(id=>{ $(id).addEventListener('input',render); });
  $('fgPick').addEventListener('input',()=>{ $('fg').value=$('fgPick').value; render(); });
  $('bgPick').addEventListener('input',()=>{ $('bg').value=$('bgPick').value; render(); });
  render();
})();
</script>
</body>
</html>
