<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科学计算器 · Calculator</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
  header{padding:14px 20px;border-bottom:1px solid var(--border);width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;justify-content:center;padding:20px;width:100%}
  .calc{width:340px;max-width:100%}
  .disp{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:right;margin-bottom:12px}
  .expr{color:var(--muted);font-size:14px;min-height:18px;word-break:break-all}
  .val{font-size:30px;font-weight:700;min-height:38px;word-break:break-all;font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:14px 0;font-size:16px;cursor:pointer;transition:.12s;font-family:inherit}
  button:hover{border-color:var(--accent)}
  button:active{transform:scale(.96)}
  button.fn{color:var(--muted);font-size:14px}
  button.op{color:var(--accent);font-weight:700}
  button.eq{background:var(--accent);border-color:var(--accent);color:#04122b;font-weight:700}
  button.del{color:#ff5d6c}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);width:100%;min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
</style>
</head>
<body>
<header><div><h1>🧮 科学计算器</h1><div class="sub">表达式计算 · 纯本地</div></div></header>
<main>
  <div class="calc">
    <div class="disp">
      <div class="expr" id="expr"></div>
      <div class="val" id="val">0</div>
    </div>
    <div class="grid" id="grid">
      <button class="fn" data-k="C">C</button>
      <button class="fn del" data-k="back">⌫</button>
      <button class="fn" data-k="(">(</button>
      <button class="fn" data-k=")">)</button>
      <button class="op" data-k="/">÷</button>

      <button class="fn" data-k="sin(">sin</button>
      <button class="fn" data-k="cos(">cos</button>
      <button class="fn" data-k="tan(">tan</button>
      <button class="fn" data-k="sqrt(">√</button>
      <button class="op" data-k="*">×</button>

      <button class="fn" data-k="log(">log</button>
      <button class="fn" data-k="ln(">ln</button>
      <button class="fn" data-k="Math.PI">π</button>
      <button class="fn" data-k="Math.E">e</button>
      <button class="op" data-k="-">−</button>

      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button class="op" data-k="^">xʸ</button>
      <button class="op" data-k="+">+</button>

      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button class="fn" data-k=".">.</button>
      <button class="eq" data-k="=">=</button>

      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button data-k="0">0</button>
      <button class="fn" data-k="ans">Ans</button>
    </div>
  </div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  let expr='', val='0', ans=null;
  function show(){ $('expr').textContent=expr; $('val').textContent=val; }
  function push(k){
    if(k==='C'){ expr=''; val='0'; }
    else if(k==='back'){ expr=expr.slice(0,-1); }
    else if(k==='='){ calc(); return; }
    else if(k==='ans'){ expr+= (ans===null?'':String(ans)); }
    else { expr+=k; }
    show();
  }
  function calc(){
    if(!expr.trim()) return;
    try{
      const safe=expr.replace(/\^/g,'**');
      if(!/^[\d+\-*/().\s,a-zA-Z]+$/.test(safe)) throw new Error('非法表达式');
      const r=new Function('return ('+safe+')')();
      if(typeof r!=='number'||!isFinite(r)) throw new Error('计算结果无效');
      ans=r; val=String(Math.round(r*1e10)/1e10); expr=String(Math.round(r*1e10)/1e10);
      $('st').textContent='✓ 计算结果';
    }catch(e){ val='错误'; $('st').textContent='⚠ '+e.message; }
    show();
  }
  $('grid').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; push(b.dataset.k); });
  document.addEventListener('keydown',e=>{
    const k=e.key;
    if(/[0-9.+\-*/()^]/.test(k)) push(k==='*'?'*':k);
    else if(k==='Enter'){ e.preventDefault(); push('='); }
    else if(k==='Backspace') push('back');
    else if(k==='Escape') push('C');
  });
  show();
})();
</script>
</body>
</html>
