<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片格式转换 · Image Converter</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .field{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .field label{color:var(--muted);font-size:13px}
  select,input[type=number]{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px}
  .drop{border:1.5px dashed var(--border);border-radius:10px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
  .drop:hover{border-color:var(--accent);color:var(--text)}
  .preview{display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:10px;padding:12px;min-height:200px}
  .preview img{max-width:100%;max-height:320px;border-radius:6px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
  input[type=file]{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🖼️ 图片格式转换</h1>
    <div class="sub">PNG / JPEG / WebP 互转 · 可缩放 · 纯本地处理</div>
  </div>
  <div class="toolbar">
    <button id="bDownload" class="primary">下载</button>
  </div>
</header>
<main>
  <section class="pane">
    <div class="card">
      <div class="pane-head">上传 Source</div>
      <div class="drop" id="drop">点击或拖拽图片到此处</div>
      <input type="file" id="file" accept="image/*" style="display:none">
    </div>
    <div class="card">
      <div class="pane-head">转换选项 Options</div>
      <div class="field">
        <label>格式</label>
        <select id="fmt">
          <option value="image/png">PNG</option>
          <option value="image/jpeg" selected>JPEG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>
      <div class="field" id="qField">
        <label>质量</label>
        <input type="number" id="quality" value="0.92" min="0.1" max="1" step="0.01" style="width:80px">
        <span class="hint">（仅 JPEG / WebP）</span>
      </div>
      <div class="field">
        <label>最大边长</label>
        <input type="number" id="maxdim" value="0" min="0" step="1" style="width:90px">
        <span class="hint">0 = 不缩放</span>
      </div>
    </div>
  </section>
  <section class="pane">
    <div class="card" style="display:flex;flex-direction:column;height:100%">
      <div class="pane-head">预览 Preview</div>
      <div class="preview" id="preview"><span class="hint">尚未选择图片</span></div>
      <div class="hint" id="meta" style="margin-top:10px"></div>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  let srcImg=null, blobUrl=null, outBlob=null, outName='image';
  function fmtExt(t){return t==='image/png'?'png':t==='image/jpeg'?'jpg':'webp';}
  function loadFile(f){
    if(!f||!f.type.startsWith('image/')){setStatus('请选择图片文件','err');return;}
    outName=f.name.replace(/\.[^.]+$/,'')||'image';
    const url=URL.createObjectURL(f);
    const img=new Image();
    img.onload=()=>{ srcImg=img; if(blobUrl)URL.revokeObjectURL(blobUrl); blobUrl=url; convert(); };
    img.onerror=()=>setStatus('图片加载失败','err');
    img.src=url;
    setStatus('已载入 '+f.name+'（'+(f.size/1024).toFixed(1)+' KB）');
  }
  function convert(){
    if(!srcImg)return;
    const fmt=$('fmt').value;
    const maxdim=parseInt($('maxdim').value,10)||0;
    let w=srcImg.naturalWidth, h=srcImg.naturalHeight;
    if(maxdim>0 && Math.max(w,h)>maxdim){ const r=maxdim/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const ctx=cv.getContext('2d');
    if(fmt==='image/png'){ ctx.clearRect(0,0,w,h); } else { ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); }
    ctx.drawImage(srcImg,0,0,w,h);
    const q=parseFloat($('quality').value)||0.92;
    cv.toBlob(b=>{
      if(!b){setStatus('转换失败','err');return;}
      outBlob=b;
      if($('preview').dataset.url)URL.revokeObjectURL($('preview').dataset.url);
      const pu=URL.createObjectURL(b);
      $('preview').dataset.url=pu;
      $('preview').innerHTML='<img alt="preview" src="'+pu+'">';
      $('meta').textContent='输出：'+w+'×'+h+' · '+fmtExt(fmt).toUpperCase()+' · '+(b.size/1024).toFixed(1)+' KB';
      setStatus('✓ 转换完成：'+w+'×'+h+'，'+(b.size/1024).toFixed(1)+' KB','ok');
    }, fmt, fmt==='image/png'?undefined:q);
  }
  $('drop').onclick=()=>$('file').click();
  $('file').onchange=e=>loadFile(e.target.files[0]);
  $('drop').ondragover=e=>{e.preventDefault();};
  $('drop').ondrop=e=>{e.preventDefault();loadFile(e.dataTransfer.files[0]);};
  ['fmt','quality','maxdim'].forEach(id=>$(id).addEventListener('input',convert));
  $('fmt').addEventListener('change',()=>{ $('qField').style.display=$('fmt').value==='image/png'?'none':'flex'; convert(); });
  $('bDownload').onclick=()=>{
    if(!outBlob){setStatus('没有可下载的图片','err');return;}
    const a=document.createElement('a'); a.href=URL.createObjectURL(outBlob);
    a.download=outName+'.'+fmtExt($('fmt').value); a.click();
    setStatus('✓ 已开始下载 '+a.download,'ok');
  };
})();
</script>
</body>
</html>
