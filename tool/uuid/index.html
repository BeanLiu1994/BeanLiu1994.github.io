<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID 生成器 · UUID Generator</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  label.indent{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
  input[type=number]{width:70px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px}
  .list{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto;max-height:60vh}
  .uuid-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-family:"SF Mono",Consolas,monospace;font-size:13px}
  .uuid-row:hover{background:rgba(255,255,255,.04)}
  .uuid-row .val{flex:1;word-break:break-all}
  .uuid-row button{padding:3px 9px;font-size:12px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🆔 UUID 生成器</h1>
    <div class="sub">RFC 4122 v4 · 基于 crypto 安全随机数</div>
  </div>
  <div class="toolbar">
    <label class="indent">数量 <input type="number" id="count" value="5" min="1" max="500"></label>
    <button id="bGen" class="primary">生成</button>
    <button id="bCopyAll">复制全部</button>
    <button id="bClear">清空</button>
  </div>
</header>
<main>
  <div class="hint">生成符合 RFC 4122 的随机 UUID v4，常用于数据库主键、追踪 ID 等。纯本地运行，数据不上传。</div>
  <div class="list" id="list"></div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const list=$('list'),st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  function uuid(){
    if(crypto.randomUUID) return crypto.randomUUID();
    const b=new Uint8Array(16); crypto.getRandomValues(b);
    b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
    const h=x=>b[x].toString(16).padStart(2,'0');
    return h(0)+h(1)+h(2)+h(3)+'-'+h(4)+h(5)+'-'+h(6)+h(7)+'-'+h(8)+h(9)+'-'+h(10)+h(11)+h(12)+h(13)+h(14)+h(15);
  }
  function gen(){
    const n=Math.max(1,Math.min(500,parseInt($('count').value)||5));
    list.innerHTML='';
    for(let i=0;i<n;i++){
      const u=uuid();
      const row=document.createElement('div'); row.className='uuid-row';
      row.innerHTML='<span class="val">'+u+'</span><button>复制</button>';
      row.querySelector('button').onclick=()=>copyText(u);
      list.appendChild(row);
    }
    setStatus('✓ 已生成 '+n+' 个 UUID','ok');
  }
  async function copyText(txt){ try{ await navigator.clipboard.writeText(txt); setStatus('✓ 已复制 '+txt,'ok'); }catch(e){ setStatus('复制失败：'+e.message,'err'); } }
  $('bGen').onclick=gen;
  $('bCopyAll').onclick=async()=>{
    const rows=[...list.querySelectorAll('.val')];
    if(!rows.length){setStatus('请先生成','err');return;}
    try{ await navigator.clipboard.writeText(rows.map(r=>r.textContent).join('\n')); setStatus('✓ 已复制全部 '+rows.length+' 个','ok'); }
    catch(e){ setStatus('复制失败：'+e.message,'err'); }
  };
  $('bClear').onclick=()=>{ list.innerHTML=''; setStatus('已清空'); };
  gen();
})();
</script>
</body>
</html>
