<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 阴影生成器 · Shadow Generator</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  label.indent{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
  input,select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  main{flex:1;display:flex;flex-direction:column;padding:16px;gap:14px;min-height:0}
  .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{color:var(--muted);font-size:12px}
  .field input[type=range]{width:100%}
  .field .val{color:var(--accent);font-size:12px;text-align:right}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:200px;
    background:repeating-conic-gradient(#1b1f27 0% 25%,#15181e 0% 50%) 50%/24px 24px; border:1px solid var(--border);border-radius:12px}
  #demo{font-size:34px;font-weight:700;color:#fff;padding:24px 36px;background:#4f9cff;border-radius:12px}
  #demoText{font-size:56px;font-weight:800;color:#4f9cff;letter-spacing:2px}
  pre{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;overflow:auto;
    font-size:13px;line-height:1.6;margin:0;white-space:pre-wrap;word-break:break-all}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
</style>
</head>
<body>
<header>
  <div>
    <h1>🌑 CSS 阴影生成器</h1>
    <div class="sub">纯本地 · 盒子 / 文字阴影 · 复制 CSS</div>
  </div>
  <div class="toolbar">
    <button id="btnCopy">复制 CSS</button>
  </div>
</header>
<main>
  <div class="controls">
    <label class="indent">模式
      <select id="mode"><option value="box">box-shadow</option><option value="text">text-shadow</option></select>
    </label>
    <div class="field"><label>水平偏移 X <span class="val" id="vx">0</span>px</label><input id="x" type="range" min="-50" max="50" value="8"></div>
    <div class="field"><label>垂直偏移 Y <span class="val" id="vy">8</span>px</label><input id="y" type="range" min="-50" max="50" value="8"></div>
    <div class="field"><label>模糊 <span class="val" id="vb">16</span>px</label><input id="blur" type="range" min="0" max="100" value="16"></div>
    <div class="field" id="spreadField"><label>扩散 <span class="val" id="vs">0</span>px</label><input id="spread" type="range" min="-50" max="50" value="0"></div>
    <div class="field"><label>颜色</label><input id="color" type="color" value="#000000"></div>
    <label class="indent" id="insetWrap"><input id="inset" type="checkbox"> inset</label>
  </div>
  <div class="stage" id="stage"><div id="demo">Shadow</div></div>
  <div>
    <div style="color:var(--muted);font-size:12px;margin-bottom:6px">生成的 CSS</div>
    <pre id="css"></pre>
  </div>
</main>
<div class="status" id="st">拖动滑块即时预览</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  function setStatus(m,t){ const s=$('st'); s.textContent=m; s.className='status'+(t?' '+t:''); }

  function build(){
    const mode=$('mode').value, x=$('x').value, y=$('y').value, blur=$('blur').value,
          spread=$('spread').value, color=$('color').value, inset=$('inset').checked;
    ['vx','vy','vb','vs'].forEach((id,i)=>{ $(['vx','vy','vb','vs'][i]).textContent=[x,y,blur,spread][i]; });
    let css;
    if(mode==='text'){
      css='text-shadow: '+x+'px '+y+'px '+blur+'px '+color+';';
    } else {
      css='box-shadow: '+(inset?'inset ':'')+x+'px '+y+'px '+blur+'px '+spread+'px '+color+';';
    }
    $('css').textContent=css;
    const demo=$('demo');
    if(mode==='text'){
      demo.textContent='Shadow'; demo.style.background='transparent'; demo.style.color='#4f9cff';
      demo.style.fontSize='56px'; demo.style.fontWeight='800'; demo.style.padding='24px 36px'; demo.style.borderRadius='12px';
      demo.style.textShadow=x+'px '+y+'px '+blur+'px '+color;
    } else {
      demo.textContent='Shadow'; demo.style.background='#4f9cff'; demo.style.color='#fff';
      demo.style.fontSize='34px'; demo.style.fontWeight='700'; demo.style.padding='24px 36px'; demo.style.borderRadius='12px';
      demo.style.textShadow='none';
      demo.style.boxShadow=(inset?'inset ':'')+x+'px '+y+'px '+blur+'px '+spread+'px '+color;
    }
    $('spreadField').style.opacity=mode==='text'?'0.4':'1';
    $('insetWrap').style.opacity=mode==='text'?'0.4':'1';
  }

  ['mode','x','y','blur','spread','color','inset'].forEach(id=>$(id).addEventListener('input',build));
  $('btnCopy').onclick=()=>{ navigator.clipboard.writeText($('css').textContent).then(()=>setStatus('✓ 已复制','ok'),()=>setStatus('复制失败','err')); };
  build();
})();
</script>
</body>
</html>
