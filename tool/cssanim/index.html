<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 动画生成器 · CSS Animation Generator</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  main{flex:1;padding:20px;display:flex;flex-direction:column;gap:18px;max-width:860px;width:100%;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}
  .card h2{margin:0 0 14px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted)}
  input,select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .preview-wrap{display:flex;justify-content:center;align-items:center;min-height:140px;background:var(--bg);border-radius:10px;margin-top:6px}
  .box{width:70px;height:70px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#9b6bff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
  textarea{width:100%;background:var(--bg);color:var(--accent);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:13px;line-height:1.7;font-family:"SF Mono",Consolas,Monaco,monospace;min-height:200px;resize:vertical;outline:none}
  .status{padding:8px 16px;font-size:13px;border-top:1px solid var(--border);min-height:36px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px;line-height:1.6;margin-top:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🎞️ CSS 动画生成器</h1>
    <div class="sub">纯本地运行 · 数据不上传 · CSS @keyframes Generator</div>
  </div>
  <div class="toolbar">
    <button id="btnPlay" class="primary">▶ 播放 / 重播</button>
    <button id="btnCopy">复制 CSS</button>
  </div>
</header>
<main>
  <section class="card">
    <h2>参数</h2>
    <div class="row">
      <div class="field"><label>动画类型</label>
        <select id="type"></select>
      </div>
      <div class="field"><label>时长 (s)</label><input id="dur" type="number" step="0.1" value="1" style="width:90px"></div>
      <div class="field"><label>延迟 (s)</label><input id="delay" type="number" step="0.1" value="0" style="width:90px"></div>
      <div class="field"><label>缓动</label>
        <select id="ease">
          <option>ease</option><option>linear</option><option>ease-in</option>
          <option>ease-out</option><option>ease-in-out</option>
          <option value="cubic-bezier(.68,-.55,.27,1.55)">back (回弹)</option>
        </select>
      </div>
      <div class="field"><label>次数</label>
        <select id="iter"><option>1</option><option>2</option><option>3</option><option>infinite</option></select>
      </div>
      <div class="field"><label>方向</label>
        <select id="dir"><option>normal</option><option>reverse</option><option>alternate</option><option>alternate-reverse</option></select>
      </div>
      <div class="field"><label>填充</label>
        <select id="fill"><option>none</option><option>forwards</option><option>backwards</option><option>both</option></select>
      </div>
    </div>
    <div class="preview-wrap"><div class="box" id="preview">CSS</div></div>
  </section>

  <section class="card">
    <h2>生成代码</h2>
    <textarea id="css" readonly spellcheck="false"></textarea>
    <p class="hint">生成标准 CSS @keyframes 与一条 <code>animation</code> 简写，可直接复制到项目中使用。动画定义为通用公开写法，无第三方依赖。</p>
  </section>
</main>
<div class="status" id="status">就绪</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const status=$('status');
  function setStatus(m,t){status.textContent=m;status.className='status'+(t?' '+t:'');}
  const KF={
    fadeIn:'from{opacity:0}to{opacity:1}',
    fadeOut:'from{opacity:1}to{opacity:0}',
    slideInUp:'from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}',
    slideInDown:'from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}',
    slideInLeft:'from{transform:translateX(-60px);opacity:0}to{transform:none;opacity:1}',
    slideInRight:'from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}',
    zoomIn:'from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}',
    zoomOut:'from{transform:scale(1);opacity:1}to{transform:scale(.5);opacity:0}',
    bounce:'0%,20%,53%,80%,100%{transform:translateY(0)}40%,43%{transform:translateY(-22px)}70%{transform:translateY(-11px)}90%{transform:translateY(-4px)}',
    pulse:'0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}',
    shake:'0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-8px)}20%,40%,60%,80%{transform:translateX(8px)}',
    spin:'from{transform:rotate(0)}to{transform:rotate(360deg)}',
    flip:'0%{transform:perspective(400px) rotateY(0)}100%{transform:perspective(400px) rotateY(360deg)}',
    flash:'0%,50%,100%{opacity:1}25%,75%{opacity:0}',
    swing:'20%{transform:rotate(15deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(5deg)}80%{transform:rotate(-5deg)}100%{transform:rotate(0)}',
    float:'0%{transform:translateY(0)}50%{transform:translateY(-12px)}100%{transform:translateY(0)}',
    heartBeat:'0%{transform:scale(1)}14%{transform:scale(1.3)}28%{transform:scale(1)}42%{transform:scale(1.3)}70%{transform:scale(1)}',
    jello:'0%,100%{transform:none}11%{transform:skewX(-12deg) skewY(-12deg)}22%{transform:skewX(6deg) skewY(6deg)}33%{transform:skewX(-3deg) skewY(-3deg)}44%{transform:skewX(2deg) skewY(2deg)}55%{transform:skewX(-1deg) skewY(-1deg)}'
  };
  const NAMES={fadeIn:'淡入',fadeOut:'淡出',slideInUp:'上滑入',slideInDown:'下滑入',slideInLeft:'左滑入',
    slideInRight:'右滑入',zoomIn:'放大进入',zoomOut:'缩小退出',bounce:'弹跳',pulse:'脉冲',shake:'抖动',
    spin:'旋转',flip:'翻转',flash:'闪烁',swing:'摇摆',float:'浮动',heartBeat:'心跳',jello:'果冻'};
  // populate select
  const sel=$('type');
  Object.keys(KF).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=NAMES[k]+' ('+k+')'; sel.appendChild(o); });
  sel.value='bounce';
  let styleEl=null;
  function build(){
    const t=$('type').value, dur=$('dur').value, delay=$('delay').value, ease=$('ease').value,
      iter=$('iter').value, dir=$('dir').value, fill=$('fill').value;
    const animName='tool-anim';
    const css='@keyframes '+animName+' {\n  '+KF[t]+'\n}\n\n.'+animName+' {\n  animation: '+animName+' '+dur+'s '+ease+' '+delay+'s '+iter+' '+dir+' '+fill+';\n}';
    $('css').value=css;
    if(!styleEl){ styleEl=document.createElement('style'); document.head.appendChild(styleEl); }
    styleEl.textContent='@keyframes '+animName+' {'+KF[t]+'}';
    const box=$('preview');
    box.style.animation='none';
    void box.offsetWidth; // reflow to restart
    box.style.animation=animName+' '+dur+'s '+ease+' '+delay+'s '+iter+' '+dir+' '+fill;
    setStatus('✓ 已生成并预览','ok');
  }
  ['type','dur','delay','ease','iter','dir','fill'].forEach(id=>$(id).addEventListener('input',build));
  ['type','ease','iter','dir','fill'].forEach(id=>$(id).addEventListener('change',build));
  $('btnPlay').onclick=build;
  $('btnCopy').onclick=async()=>{ try{await navigator.clipboard.writeText($('css').value);setStatus('✓ 已复制 CSS','ok');}catch(e){setStatus('复制失败','err');} };
  build();
  setStatus('就绪');
})();
</script>
</body>
</html>
