<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颜色名查找</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
  header{padding:14px 20px;border-bottom:1px solid var(--border);width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;justify-content:center;padding:20px;width:100%}
  .card{width:720px;max-width:100%;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
  .top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  input[type=text]{flex:1;min-width:160px;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:11px 12px;font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  input[type=color]{width:54px;height:44px;border:1px solid var(--border);border-radius:10px;background:var(--bg);cursor:pointer;padding:4px}
  .swatch{width:100%;height:70px;border-radius:10px;border:1px solid var(--border);margin-top:14px}
  .result{margin-top:12px;font-size:16px}
  .result b{color:var(--accent)}
  .list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
  .dot{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);flex:none}
  .item .nm{font-size:15px;min-width:130px}
  .item .hex{color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .item .d{margin-left:auto;color:var(--muted);font-size:13px}
  .hint{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.6}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);width:100%;min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
</style>
</head>
<body>
<header><div><h1>🎨 颜色名查找</h1><div class="sub">最近 CSS 命名颜色 · 纯本地</div></div></header>
<main>
  <div class="card">
    <div class="top">
      <input type="color" id="picker" value="#3a7bd5">
      <input type="text" id="inp" placeholder="#3a7bd5 或 58,123,213" value="#3a7bd5">
    </div>
    <div class="swatch" id="sw"></div>
    <div class="result" id="res">—</div>
    <div class="list" id="list"></div>
    <p class="hint">在 148 个 CSS 标准命名颜色中，按 RGB 欧氏距离找出最接近的颜色名。适用于把色值还原成易记的名称。</p>
  </div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const NAMES=[["aliceblue","#f0f8ff"],["antiquewhite","#faebd7"],["aqua","#00ffff"],["aquamarine","#7fffd4"],["azure","#f0ffff"],["beige","#f5f5dc"],["bisque","#ffe4c4"],["black","#000000"],["blanchedalmond","#ffebcd"],["blue","#0000ff"],["blueviolet","#8a2be2"],["brown","#a52a2a"],["burlywood","#deb887"],["cadetblue","#5f9ea0"],["chartreuse","#7fff00"],["chocolate","#d2691e"],["coral","#ff7f50"],["cornflowerblue","#6495ed"],["cornsilk","#fff8dc"],["crimson","#dc143c"],["cyan","#00ffff"],["darkblue","#00008b"],["darkcyan","#008b8b"],["darkgoldenrod","#b8860b"],["darkgray","#a9a9a9"],["darkgreen","#006400"],["darkkhaki","#bdb76b"],["darkmagenta","#8b008b"],["darkolivegreen","#556b2f"],["darkorange","#ff8c00"],["darkorchid","#9932cc"],["darkred","#8b0000"],["darksalmon","#e9967a"],["darkseagreen","#8fbc8f"],["darkslateblue","#483d8b"],["darkslategray","#2f4f4f"],["darkturquoise","#00ced1"],["darkviolet","#9400d3"],["deeppink","#ff1493"],["deepskyblue","#00bfff"],["dimgray","#696969"],["dodgerblue","#1e90ff"],["firebrick","#b22222"],["floralwhite","#fffaf0"],["forestgreen","#228b22"],["fuchsia","#ff00ff"],["gainsboro","#dcdcdc"],["ghostwhite","#f8f8ff"],["gold","#ffd700"],["goldenrod","#daa520"],["gray","#808080"],["green","#008000"],["greenyellow","#adff2f"],["honeydew","#f0fff0"],["hotpink","#ff69b4"],["indianred","#cd5c5c"],["indigo","#4b0082"],["ivory","#fffff0"],["khaki","#f0e68c"],["lavender","#e6e6fa"],["lavenderblush","#fff0f5"],["lawngreen","#7cfc00"],["lemonchiffon","#fffacd"],["lightblue","#add8e6"],["lightcoral","#f08080"],["lightcyan","#e0ffff"],["lightgoldenrodyellow","#fafad2"],["lightgray","#d3d3d3"],["lightgreen","#90ee90"],["lightpink","#ffb6c1"],["lightsalmon","#ffa07a"],["lightseagreen","#20b2aa"],["lightskyblue","#87cefa"],["lightslategray","#778899"],["lightsteelblue","#b0c4de"],["lightyellow","#ffffe0"],["lime","#00ff00"],["limegreen","#32cd32"],["linen","#faf0e6"],["magenta","#ff00ff"],["maroon","#800000"],["mediumaquamarine","#66cdaa"],["mediumblue","#0000cd"],["mediumorchid","#ba55d3"],["mediumpurple","#9370db"],["mediumseagreen","#3cb371"],["mediumslateblue","#7b68ee"],["mediumspringgreen","#00fa9a"],["mediumturquoise","#48d1cc"],["mediumvioletred","#c71585"],["midnightblue","#191970"],["mintcream","#f5fffa"],["mistyrose","#ffe4e1"],["moccasin","#ffe4b5"],["navajowhite","#ffdead"],["navy","#000080"],["oldlace","#fdf5e6"],["olive","#808000"],["olivedrab","#6b8e23"],["orange","#ffa500"],["orangered","#ff4500"],["orchid","#da70d6"],["palegoldenrod","#eee8aa"],["palegreen","#98fb98"],["paleturquoise","#afeeee"],["palevioletred","#db7093"],["papayawhip","#ffefd5"],["peachpuff","#ffdab9"],["peru","#cd853f"],["pink","#ffc0cb"],["plum","#dda0dd"],["powderblue","#b0e0e6"],["purple","#800080"],["rebeccapurple","#663399"],["red","#ff0000"],["rosybrown","#bc8f8f"],["royalblue","#4169e1"],["saddlebrown","#8b4513"],["salmon","#fa8072"],["sandybrown","#f4a460"],["seagreen","#2e8b57"],["seashell","#fff5ee"],["sienna","#a0522d"],["silver","#c0c0c0"],["skyblue","#87ceeb"],["slateblue","#6a5acd"],["slategray","#708090"],["snow","#fffafa"],["springgreen","#00ff7f"],["steelblue","#4682b4"],["tan","#d2b48c"],["teal","#008080"],["thistle","#d8bfd8"],["tomato","#ff6347"],["turquoise","#40e0d0"],["violet","#ee82ee"],["wheat","#f5deb3"],["white","#ffffff"],["whitesmoke","#f5f5f5"],["yellow","#ffff00"],["yellowgreen","#9acd32"]];
  const data=NAMES.map(([n,h])=>{ const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return {n,h,r,g,b}; });
  function parseRGB(s){
    s=s.trim();
    if(/^#?[0-9a-fA-F]{6}$/.test(s.replace('#',''))) { const h=s.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
    const m=s.match(/(\d{1,3})[, ]+(\d{1,3})[, ]+(\d{1,3})/);
    if(m) return [+m[1],+m[2],+m[3]];
    return null;
  }
  function run(){
    const rgb=parseRGB($('inp').value);
    if(!rgb){ $('st').textContent='⚠ 请输入 #RRGGBB 或 R,G,B'; return; }
    const [r,g,b]=rgb;
    $('sw').style.background=`rgb(${r},${g},${b})`;
    const dist=arr=>Math.sqrt((r-arr.r)**2+(g-arr.g)**2+(b-arr.b)**2);
    const sorted=[...data].sort((a,b)=>dist(a)-dist(b));
    const best=sorted[0];
    $('res').innerHTML=`最接近：<b>${best.n}</b> &nbsp; ${best.h} &nbsp; rgb(${best.r},${best.g},${best.b})`;
    $('list').innerHTML=sorted.slice(0,6).map(d=>{
      const d2=Math.round(dist(d));
      return `<div class="item"><div class="dot" style="background:${d.h}"></div><div class="nm">${d.n}</div><div class="hex">${d.h}</div><div class="d">Δ ${d2}</div></div>`;
    }).join('');
    $('st').textContent='✓ 已匹配最近颜色名';
  }
  $('inp').addEventListener('input',run);
  $('picker').addEventListener('input',e=>{ $('inp').value=e.target.value; run(); });
  run();
})();
</script>
</body>
</html>
