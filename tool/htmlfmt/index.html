<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 格式化美化 · HTML Formatter</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  a.btn{display:inline-flex;align-items:center;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 13px;font-size:13px;text-decoration:none;cursor:pointer;transition:.15s}
  a.btn:hover{border-color:var(--accent);color:#fff}
  label.indent{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
  select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px}
  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0}
  .pane.left{border-right:1px solid var(--border)}
  .pane-head{padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:1px}
  textarea{flex:1;background:transparent;color:var(--text);border:0;resize:none;outline:none;
    padding:16px;font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;font-size:13px;line-height:1.6;tab-size:2;white-space:pre}
  .status{padding:8px 16px;font-size:13px;border-top:1px solid var(--border);min-height:36px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
  @media(max-width:720px){main{flex-direction:column}.pane.left{border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<header>
  <div>
    <h1>🌐 HTML 格式化美化</h1>
    <div class="sub">纯本地运行 · 数据不上传 · HTML Beautifier</div>
  </div>
  <div class="toolbar">
    <label class="indent">缩进
      <select id="indent">
        <option value="2">2 空格</option>
        <option value="4">4 空格</option>
        <option value="\t">Tab</option>
      </select>
    </label>
    <button id="btnFmt" class="primary">格式化</button>
    <button id="btnCopy">复制结果</button>
    <button id="btnSample">示例</button>
    <button id="btnClear">清空</button>
    <a class="btn" href="../../">🏠 首页</a>
  </div>
</header>
<main>
  <section class="pane left">
    <div class="pane-head"><span>输入 Input</span><span class="hint" id="inMeta">0 字符</span></div>
    <textarea id="in" spellcheck="false" placeholder="在此粘贴 HTML 代码…"></textarea>
  </section>
  <section class="pane">
    <div class="pane-head"><span>结果 Output</span><span class="hint" id="outMeta"></span></div>
    <textarea id="out" spellcheck="false" readonly placeholder="格式化后的 HTML 将显示在这里"></textarea>
  </section>
</main>
<div class="status" id="st">等待输入…</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  const VOID=new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
  function unit(){const v=$('indent').value;return v==='\\t'?'\t':(v==='\t'?'\t':' '.repeat(+v));}
  function format(html){
    const tokens=html.match(/<[^>]+>|[^<]+/g)||[];
    let depth=0,out='',u=unit();
    for(let t of tokens){
      if(t.trim()==='') continue;
      if(t.startsWith('<')){
        const isClose=/^<\//.test(t);
        const isSelf=/\/>\s*$/.test(t);
        const m=/<\/?\s*([a-zA-Z0-9]+)/.exec(t);
        const tag=m?m[1].toLowerCase():'';
        const raw=t.trim();
        if(isClose){ depth=Math.max(0,depth-1); out+='\n'+u.repeat(depth)+raw; }
        else if(isSelf||VOID.has(tag)){ out+='\n'+u.repeat(depth)+raw; }
        else { out+='\n'+u.repeat(depth)+raw; depth++; }
      } else {
        const txt=t.replace(/\s+/g,' ').trim();
        if(txt) out+='\n'+u.repeat(depth)+txt;
      }
    }
    return out.replace(/^\n+/,'');
  }
  function run(){
    const src=$('in').value;
    if(!src.trim()){ $('out').value=''; $('outMeta').textContent=''; setStatus('等待输入…'); return; }
    try{
      const res=format(src);
      $('out').value=res;
      const tags=(res.match(/<[a-zA-Z\/!][^>]*>/g)||[]).length;
      $('outMeta').textContent=res.length+' 字符 · '+tags+' 标签';
      setStatus('✓ 已格式化','ok');
    }catch(e){ setStatus('✗ '+e.message,'err'); }
  }
  $('btnFmt').onclick=run;
  $('btnClear').onclick=()=>{$('in').value='';run();$('in').focus();};
  $('btnCopy').onclick=async()=>{const t=$('out').value;if(!t){setStatus('没有可复制的内容','err');return;}try{await navigator.clipboard.writeText(t);setStatus('✓ 已复制到剪贴板','ok');}catch(e){setStatus('复制失败：'+e.message,'err');}};
  $('btnSample').onclick=()=>{$('in').value='<div class="card"><h1>标题</h1><p>这是一段<b>加粗</b>文字，<img src="a.png"/>内联元素。</p><ul><li>项一</li><li>项二</li></ul></div>';run();};
  $('in').addEventListener('input',()=>{$('inMeta').textContent=$('in').value.length+' 字符';});
  $('indent').addEventListener('change',run);
  setStatus('等待输入…');
})();
</script>
</body>
</html>
