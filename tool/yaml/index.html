<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAML ⇄ JSON 转换 · YAML JSON Converter</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  a.btn{display:inline-flex;align-items:center;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 13px;font-size:13px;text-decoration:none;cursor:pointer;transition:.15s}
  a.btn:hover{border-color:var(--accent);color:#fff}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  textarea{width:100%;min-height:240px;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:12px;font-family:"SF Mono",Consolas,Monaco,monospace;font-size:13px;line-height:1.55;resize:vertical}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🔀 YAML ⇄ JSON 转换</h1>
    <div class="sub">YAML 与 JSON 互相转换 · 纯本地运行</div>
  </div>
  <div class="toolbar">
    <button id="bSample">示例</button>
    <a class="btn" href="../../">🏠 首页</a>
  </div>
</header>
<main>
  <section class="card">
    <h2>输入</h2>
    <textarea id="in" spellcheck="false" placeholder="在此粘贴 YAML 或 JSON …"></textarea>
    <div class="row">
      <button id="bToJson" class="primary">YAML → JSON</button>
      <button id="bToYaml">JSON → YAML</button>
      <button id="bCopy">复制结果</button>
      <button id="bClear">清空</button>
    </div>
  </section>
  <section class="card">
    <h2>输出</h2>
    <textarea id="out" spellcheck="false" readonly placeholder="转换结果将显示在这里"></textarea>
    <div class="hint" style="margin-top:8px">支持嵌套映射 / 列表 / 行内 [ ] { } / 注释 #。纯本地解析，数据不会上传。</div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script src="../shared/vendor/js-yaml-5.5.0.min.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  /* ---------- YAML core (verified) ---------- */
  function toJsonValue(key,value){
    if(typeof value==='number' && (!Number.isFinite(value)||(Number.isInteger(value)&&!Number.isSafeInteger(value)))){
      throw new Error('数字超出 JSON 可安全表示的范围');
    }
    return value;
  }

  function convert(dir){
    const src=$('in').value;
    if(!src.trim()){setStatus('请输入内容','err');return;}
    try{
      if(dir==='tojson'){
        const value=jsyaml.load(src,{schema:jsyaml.CORE_SCHEMA});
        if(value===undefined) throw new Error('未找到 YAML 文档');
        $('out').value=JSON.stringify(value,toJsonValue,2);
        setStatus('✓ 已转为 JSON','ok');
      }else{
        $('out').value=jsyaml.dump(JSON.parse(src),{schema:jsyaml.CORE_SCHEMA,noRefs:true});
        setStatus('✓ 已转为 YAML','ok');
      }
    }catch(error){
      $('out').value='';
      setStatus('转换失败：'+error.message,'err');
    }
  }
  async function copy(){const t=$('out').value;if(!t){setStatus('没有可复制的内容','err');return;}try{await navigator.clipboard.writeText(t);setStatus('✓ 已复制结果','ok');}catch(e){setStatus('复制失败：'+e.message,'err');}}
  $('bToJson').onclick=()=>convert('tojson');
  $('bToYaml').onclick=()=>convert('toyaml');
  $('bCopy').onclick=copy;
  $('bClear').onclick=()=>{$('in').value='';$('out').value='';setStatus('已清空');};
  $('bSample').onclick=()=>{$('in').value=`name: 工具箱
version: 2.1
enabled: true
features:
  - 转换
  - 校验
  - 格式化
config:
  timeout: 30
  retries: 3
  hosts: [a.example.com, b.example.com]
meta:
  author: peng
  note: "冒号: 保留"
  empty: ~`;setStatus('已填入示例 YAML，点击转换');};
})();
</script>
</body>
</html>
