<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日热量需求计算器 · TDEE Calculator</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
  input,select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  input[type=number]{width:110px}
  .result{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px}
  .item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px}
  .item .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .item .v{font-size:24px;font-weight:700;margin-top:6px}
  .item .v small{font-size:13px;font-weight:400;color:var(--muted)}
  .item.accent .v{color:var(--accent)}
  .item.ok .v{color:var(--ok)}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🔥 每日热量需求计算器 (TDEE)</h1>
    <div class="sub">基于 Mifflin-St Jeor 公式 · 纯本地运行</div>
  </div>
</header>
<main>
  <section class="card">
    <h2>基本信息</h2>
    <div class="row">
      <label>性别
        <select id="gender"><option value="male">男</option><option value="female">女</option></select>
      </label>
      <label>年龄(岁)<input type="number" id="age" value="28" min="1" max="120"></label>
      <label>体重(kg)<input type="number" id="weight" value="65" min="1" max="400" step="0.1"></label>
      <label>身高(cm)<input type="number" id="height" value="170" min="50" max="260"></label>
      <label>活动水平
        <select id="activity">
          <option value="1.2">久坐（几乎不运动）</option>
          <option value="1.375">轻度（每周 1-3 次）</option>
          <option value="1.55" selected>中度（每周 3-5 次）</option>
          <option value="1.725">高度（每周 6-7 次）</option>
          <option value="1.9">极高（体力劳动/运动员）</option>
        </select>
      </label>
    </div>
  </section>
  <section class="card">
    <h2>结果</h2>
    <div class="result" id="out"></div>
    <p class="hint" style="margin-top:12px">减脂按维持热量 −500 kcal、增肌按 +300 kcal 估算，结果仅供参考。</p>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
const $=id=>document.getElementById(id);
function calc(){
  const g=$('gender').value;
  const age=parseFloat($('age').value);
  const w=parseFloat($('weight').value);
  const h=parseFloat($('height').value);
  const act=parseFloat($('activity').value);
  if(!(age>0&&w>0&&h>0)){ $('out').innerHTML='<span class="hint">请输入有效的年龄/体重/身高</span>'; return; }
  let bmr=10*w+6.25*h-5*age+(g==='male'?5:-161);
  bmr=Math.round(bmr);
  const tdee=Math.round(bmr*act);
  const cut=Math.max(1200,tdee-500);
  const bulk=tdee+300;
  $('out').innerHTML=
    `<div class="item"><div class="k">基础代谢 BMR</div><div class="v">${bmr} <small>kcal</small></div></div>`+
    `<div class="item accent"><div class="k">每日消耗 TDEE</div><div class="v">${tdee} <small>kcal</small></div></div>`+
    `<div class="item"><div class="k">减脂建议</div><div class="v">${cut} <small>kcal</small></div></div>`+
    `<div class="item ok"><div class="k">增肌建议</div><div class="v">${bulk} <small>kcal</small></div></div>`;
  const s=$('st'); s.textContent='已计算'; s.className='status ok';
}
['gender','age','weight','height','activity'].forEach(id=>$(id).addEventListener('input',calc));
calc();
</script>
</body>
</html>
