<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XML ⇄ JSON 转换 · XML JSON Converter</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  a.btn{display:inline-flex;align-items:center;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 13px;font-size:13px;text-decoration:none;cursor:pointer;transition:.15s}
  a.btn:hover{border-color:var(--accent);color:#fff}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  textarea{width:100%;min-height:240px;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:12px;font-family:"SF Mono",Consolas,Monaco,monospace;font-size:13px;line-height:1.55;resize:vertical}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🔁 XML ⇄ JSON 转换</h1>
    <div class="sub">XML 与 JSON 互相转换 · 纯本地运行</div>
  </div>
  <div class="toolbar">
    <button id="bSample">示例</button>
    <a class="btn" href="../../">🏠 首页</a>
  </div>
</header>
<main>
  <section class="card">
    <h2>输入</h2>
    <textarea id="in" spellcheck="false" placeholder="在此粘贴 XML 或 JSON …"></textarea>
    <div class="row">
      <button id="bToJson" class="primary">XML → JSON</button>
      <button id="bToXml">JSON → XML</button>
      <button id="bCopy">复制结果</button>
      <button id="bClear">清空</button>
    </div>
  </section>
  <section class="card">
    <h2>输出</h2>
    <textarea id="out" spellcheck="false" readonly placeholder="转换结果将显示在这里"></textarea>
    <div class="hint" style="margin-top:8px">属性转换为 <code>@attributes</code>，文本节点为 <code>#text</code>。纯本地解析，数据不会上传。</div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function escText(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  /* XML -> JSON */
  function xmlToJson(node){
    function rec(n){
      const attrs={};
      if(n.attributes) for(let i=0;i<n.attributes.length;i++) attrs[n.attributes[i].name]=n.attributes[i].value;
      let textParts=[]; const childMap={}; let hasElement=false;
      for(let i=0;i<n.childNodes.length;i++){
        const c=n.childNodes[i];
        if(c.nodeType===1){hasElement=true;(childMap[c.nodeName]=childMap[c.nodeName]||[]).push(c);}
        else if((c.nodeType===3||c.nodeType===4)&&c.nodeValue.trim()!=='') textParts.push(c.nodeValue);
      }
      const text=textParts.join('').trim();
      if(!hasElement){
        if(Object.keys(attrs).length) return {'@attributes':attrs,'#text':text};
        return text;
      }
      const obj={};
      if(Object.keys(attrs).length) obj['@attributes']=attrs;
      for(const k in childMap){const arr=childMap[k].map(rec);obj[k]=arr.length===1?arr[0]:arr;}
      if(text) obj['#text']=text;
      return obj;
    }
    return rec(node);
  }
  /* JSON -> XML */
  function jsonToXml(obj){
    function build(name,val){
      const el=document.createElement(name);
      if(val && typeof val==='object' && !Array.isArray(val)){
        if(val['@attributes']) for(const k in val['@attributes']) el.setAttribute(k,val['@attributes'][k]);
        const text=val['#text'];
        for(const k in val){ if(k==='@attributes'||k==='#text') continue;
          const child=val[k];
          if(Array.isArray(child)) child.forEach(c=>el.appendChild(build(k,c)));
          else el.appendChild(build(k,child));
        }
        if(text!=null&&text!=='') el.appendChild(document.createTextNode(text));
      } else {
        el.appendChild(document.createTextNode(val==null?'':String(val)));
      }
      return el;
    }
    function serialize(el,indent){
      const pad='  '.repeat(indent);
      let s=pad+'<'+el.nodeName;
      if(el.attributes&&el.attributes.length) for(let i=0;i<el.attributes.length;i++){const a=el.attributes[i];s+=' '+a.name+'="'+escAttr(a.value)+'"';}
      const children=[...el.childNodes].filter(n=>!(n.nodeType===3&&!n.nodeValue.trim()));
      const hasElement=children.some(n=>n.nodeType===1);
      const text=children.filter(n=>n.nodeType===3).map(n=>n.nodeValue).join('').trim();
      if(!hasElement&&!text) return s+'/>\n';
      s+='>';
      if(hasElement){ s+='\n'; children.forEach(c=>{ if(c.nodeType===1) s+=serialize(c,indent+1); else if(c.nodeType===3&&c.nodeValue.trim()) s+=pad+'  '+escText(c.nodeValue.trim())+'\n'; }); s+=pad+'</'+el.nodeName+'>'; }
      else s+=escText(text)+'</'+el.nodeName+'>';
      return s+'\n';
    }
    let rootName='root', data=obj;
    if(obj && typeof obj==='object' && !Array.isArray(obj)){
      const keys=Object.keys(obj);
      if(keys.length===1){ rootName=keys[0]; data=obj[keys[0]]; }
    }
    const root=build(rootName,data);
    return '<?xml version="1.0" encoding="UTF-8"?>\n'+serialize(root,0);
  }
  function convert(dir){
    const src=$('in').value;
    if(!src.trim()){setStatus('请输入内容','err');return;}
    try{
      if(dir==='tojson'){
        const doc=new DOMParser().parseFromString(src,'text/xml');
        if(doc.getElementsByTagName('parsererror').length){setStatus('XML 解析失败，请检查格式','err');return;}
        const obj=xmlToJson(doc.documentElement);
        $('out').value=JSON.stringify(obj,null,2);
        setStatus('✓ 已转为 JSON','ok');
      } else {
        const obj=JSON.parse(src);
        $('out').value=jsonToXml(obj);
        setStatus('✓ 已转为 XML','ok');
      }
    }catch(e){setStatus('转换失败：'+e.message,'err');}
  }
  async function copy(){const t=$('out').value;if(!t){setStatus('没有可复制的内容','err');return;}try{await navigator.clipboard.writeText(t);setStatus('✓ 已复制结果','ok');}catch(e){setStatus('复制失败：'+e.message,'err');}}
  $('bToJson').onclick=()=>convert('tojson');
  $('bToXml').onclick=()=>convert('toxml');
  $('bCopy').onclick=copy;
  $('bClear').onclick=()=>{$('in').value='';$('out').value='';setStatus('已清空');};
  $('bSample').onclick=()=>{$('in').value=`<note id="1">
  <to>Tom</to>
  <from>Jane</from>
  <heading>Reminder</heading>
  <body>买牛奶</body>
  <items>
    <item>鸡蛋</item>
    <item>面包</item>
  </items>
</note>`;setStatus('已填入示例 XML，点击转换');};
})();
</script>
</body>
</html>
