<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji 表情面板 · Emoji Picker</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  input,select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  main{flex:1;display:flex;flex-direction:column;padding:16px;gap:14px;min-height:0}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:999px;
    padding:5px 13px;font-size:13px;cursor:pointer;transition:.15s}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));
    gap:6px;align-content:start;padding-right:4px}
  .grid button{width:100%;aspect-ratio:1;font-size:24px;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;cursor:pointer;padding:0;line-height:1}
  .grid button:hover{border-color:var(--accent);background:rgba(79,156,255,.12);transform:translateY(-2px)}
  .meta{color:var(--muted);font-size:13px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  @media(max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}}
</style>
</head>
<body>
<header>
  <div>
    <h1>😀 Emoji 表情面板</h1>
    <div class="sub">纯本地 · 搜索即可复制 · Emoji Picker</div>
  </div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索表情（如 笑 / cat / 心）" style="width:260px">
    <button id="btnCopyLast">复制上一个</button>
  </div>
</header>
<main>
  <div class="filters" id="cats"></div>
  <div class="meta" id="meta"></div>
  <div class="grid" id="grid"></div>
</main>

  const cats=['全部'].concat([...new Set(DATA.map(d=>d.cat))]);
  let curCat='全部', lastCopied='';

  const catBox=$('cats');
  cats.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'+(c==='全部'?' on':'');
    b.textContent=c;
    b.onclick=()=>{ curCat=c; [...catBox.children].forEach(x=>x.classList.toggle('on',x.textContent===c)); render(); };
    catBox.appendChild(b);
  });

  function copy(s){
    try{
      if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(s); }
      else{ const t=document.createElement('textarea'); t.value=s; document.body.appendChild(t); t.select();
        document.execCommand('copy'); t.remove(); }
      lastCopied=s;
      setStatus('✓ 已复制：'+s,'ok');
    }catch(e){ setStatus('复制失败：'+e.message,'err'); }
  }
  function setStatus(m,t){ const s=$('st'); s.textContent=m; s.className='status'+(t?' '+t:''); }

  function render(){
    const q=$('search').value.trim().toLowerCase();
    const list=DATA.filter(d=>{
      if(curCat!=='全部'&&d.cat!==curCat) return false;
      if(!q) return true;
      return d.k.toLowerCase().includes(q)||d.c===q;
    });
    const grid=$('grid'); grid.innerHTML='';
    list.forEach(d=>{
      const b=document.createElement('button');
      b.textContent=d.c; b.title=d.k.split(' ')[0];
      b.onclick=()=>copy(d.c);
      grid.appendChild(b);
    });
    $('meta').textContent='共 '+list.length+' 个表情'+(q?'（搜索：'+q+'）':'');
  }

  $('search').addEventListener('input',render);
  $('btnCopyLast').onclick=()=>{ if(lastCopied) copy(lastCopied); else setStatus('还没有复制过表情','err'); };
  render();
})();
</script>
</body>
</html>
