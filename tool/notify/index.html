<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面通知 · Desktop Notification</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  input[type=text],input[type=number]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;font-size:14px;outline:none}
  textarea{width:100%;min-height:90px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;
    padding:12px;font-size:14px;line-height:1.6;resize:vertical;outline:none;font-family:inherit}
  .field{margin-bottom:14px}
  .field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;background:var(--bg);border:1px solid var(--border)}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)} .status.warn{color:var(--warn,#ffb454)}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🔔 桌面通知发送</h1>
    <div class="sub">基于 Notification API · 纯本地触发</div>
  </div>
  <div class="toolbar">
    <button id="bPerm">授权通知</button>
    <button id="bSend" class="primary">发送通知</button>
  </div>
</header>
<main>
  <section class="pane">
    <div class="card" style="display:flex;flex-direction:column;height:100%">
      <div class="pane-head">内容 Content</div>
      <div class="field">
        <label>标题 Title</label>
        <input type="text" id="title" value="⏰ 提醒">
      </div>
      <div class="field">
        <label>正文 Body</label>
        <textarea id="body">该起身活动一下、喝口水啦！</textarea>
      </div>
      <div class="field">
        <label>延迟发送（毫秒，0 = 立即）</label>
        <input type="number" id="delay" value="0" min="0" step="500">
      </div>
      <div class="hint">通知权限状态：<span class="badge" id="perm">检测中…</span></div>
    </div>
  </section>
  <section class="pane">
    <div class="card" style="display:flex;flex-direction:column;height:100%">
      <div class="pane-head">说明 Notes</div>
      <div style="font-size:13px;line-height:1.8;color:var(--muted)">
        <p>• 桌面通知需要浏览器授予权限，且页面处于可见或后台均可接收。</p>
        <p>• 部分移动端浏览器对 Notification 支持有限，属正常现象。</p>
        <p>• 本工具仅在你的设备上触发通知，不收集任何数据。</p>
        <p>• 设置“延迟发送”可用于临时提醒（如 5 分钟后 = 输入 300000）。</p>
      </div>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  function refreshPerm(){
    if(!('Notification' in window)){ $('perm').textContent='不支持'; setStatus('⚠ 当前浏览器不支持 Notification API','warn'); return; }
    const p=Notification.permission;
    $('perm').textContent = p==='granted'?'已授权':p==='denied'?'已拒绝':'未授权';
  }
  function send(){
    if(!('Notification' in window)){ setStatus('⚠ 浏览器不支持 Notification','warn'); return; }
    if(Notification.permission!=='granted'){ setStatus('请先点击“授权通知”','err'); return; }
    const title=$('title').value||'通知';
    const body=$('body').value;
    const delay=Math.max(0,parseInt($('delay').value,10)||0);
    const fire=()=>{ const n=new Notification(title,{body}); n.onclick=()=>{window.focus();n.close();};
      setStatus('✓ 通知已发送','ok'); };
    if(delay>0){ setStatus('将在 '+delay+'ms 后发送…'); setTimeout(fire,delay); }
    else fire();
  }
  $('bPerm').onclick=async()=>{
    if(!('Notification' in window)){ setStatus('⚠ 浏览器不支持 Notification','warn'); return; }
    try{ const r=await Notification.requestPermission(); refreshPerm(); setStatus(r==='granted'?'✓ 已授权':'权限状态：'+r, r==='granted'?'ok':'warn'); }
    catch(e){ setStatus('授权失败：'+e.message,'err'); }
  };
  $('bSend').onclick=send;
  refreshPerm();
})();
</script>
</body>
</html>
