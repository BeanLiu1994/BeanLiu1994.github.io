<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词频统计 · Word Frequency</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  a.btn{display:inline-flex;align-items:center;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 13px;font-size:13px;text-decoration:none;cursor:pointer;transition:.15s}
  a.btn:hover{border-color:var(--accent);color:#fff}
  label.chk{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  textarea{width:100%;min-height:160px;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:12px;font-family:"SF Mono",Consolas,monospace;font-size:13px;line-height:1.55;resize:vertical}
  .opts{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;align-items:center}
  input[type=number]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;width:74px}
  table{width:100%;border-collapse:collapse;margin-top:4px;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500;text-transform:uppercase;font-size:11px;letter-spacing:1px}
  td.w{font-family:"SF Mono",Consolas,monospace;color:var(--accent)}
  .bar{height:6px;background:var(--accent);border-radius:3px;min-width:2px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>📊 词频统计</h1>
    <div class="sub">中文分词 / 英文单词 · 纯本地 · Word Frequency</div>
  </div>
  <div class="toolbar">
    <button id="bCopy">复制结果</button>
    <button id="bClear">清空</button>
    <a class="btn" href="../../">🏠 首页</a>
  </div>
</header>
<main>
  <section class="card">
    <h2>输入文本</h2>
    <textarea id="in" spellcheck="false" placeholder="粘贴一段文本，自动统计词频（支持中文分词）…"></textarea>
    <div class="opts">
      <label class="chk"><input type="checkbox" id="ci" checked> 忽略大小写</label>
      <label class="chk"><input type="checkbox" id="min3"> 仅长度 ≥ 2</label>
      <label class="chk">显示前 <input type="number" id="top" value="50" min="1" max="9999"> 项</label>
    </div>
    <div style="margin-top:12px"><button id="bRun" class="primary">统计</button></div>
  </section>
  <section class="card">
    <h2>结果（按频次降序）</h2>
    <div id="out"></div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  function tokenize(text){
    if(typeof Intl!=='undefined'&&Intl.Segmenter){
      try{
        const seg=new Intl.Segmenter('zh',{granularity:'word'});
        return [...seg.segment(text)].filter(s=>s.isWordLike).map(s=>s.segment);
      }catch(e){}
    }
    return text.match(/\p{L}[\p{L}\p{N}_]*/gu)||[];
  }
  function run(){
    const text=$('in').value;
    if(!text.trim()){ $('out').innerHTML=''; setStatus('请先输入文本'); return; }
    const ci=$('ci').checked, min3=$('min3').checked;
    const map=new Map();
    for(let raw of tokenize(text)){
      let w=ci?raw.toLowerCase():raw;
      if(min3 && [...w].length<2) continue;
      if(!w) continue;
      map.set(w,(map.get(w)||0)+1);
    }
    const total=[...map.values()].reduce((a,b)=>a+b,0);
    let arr=[...map.entries()].sort((a,b)=>b[1]-a[1]||(a[0]<b[0]?-1:1));
    const top=Math.max(1,parseInt($('top').value)||50);
    arr=arr.slice(0,top);
    const max=arr.length?arr[0][1]:1;
    if(!arr.length){ $('out').innerHTML='<p class="hint">没有可统计的词。</p>'; setStatus('无结果'); return; }
    let html='<table><thead><tr><th>#</th><th>词</th><th>次数</th><th>占比</th><th></th></tr></thead><tbody>';
    arr.forEach(([w,c],i)=>{
      const pct=(c/total*100).toFixed(1);
      html+=`<tr><td class="hint">${i+1}</td><td class="w">${esc(w)}</td><td>${c}</td><td class="hint">${pct}%</td><td><div class="bar" style="width:${Math.max(2,c/max*140)}px"></div></td></tr>`;
    });
    html+='</tbody></table>';
    $('out').innerHTML=html;
    setStatus(`✓ 共 ${map.size} 个不同词，总计 ${total} 词次，显示前 ${arr.length} 项`,'ok');
  }
  function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  async function copy(){
    const rows=[...$('out').querySelectorAll('tbody tr')];
    if(!rows.length){setStatus('没有可复制的内容','err');return;}
    let t='排名\t词\t次数\t占比\n';
    rows.forEach(r=>{const c=[...r.children].map(td=>td.textContent.trim());t+=c.slice(0,4).join('\t')+'\n';});
    try{await navigator.clipboard.writeText(t);setStatus('✓ 已复制为 TSV','ok');}catch(e){setStatus('复制失败：'+e.message,'err');}
  }
  $('bRun').onclick=run;
  $('bCopy').onclick=copy;
  $('bClear').onclick=()=>{$('in').value='';$('out').innerHTML='';setStatus('已清空');};
  $('in').addEventListener('input',()=>{ if($('in').value.trim()) run(); });
  setStatus('就绪');
})();
</script>
</body>
</html>
