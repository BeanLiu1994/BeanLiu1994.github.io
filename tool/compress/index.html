<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本压缩 · Gzip / Deflate</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  button:disabled{opacity:.45;cursor:not-allowed}
  label.indent{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
  select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:280px;display:flex;flex-direction:column}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  textarea{flex:1;min-height:240px;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:10px;resize:vertical;outline:none;padding:14px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;font-size:12px;line-height:1.6}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding:0 2px 4px}
  .stats b{color:var(--text)}
</style>
</head>
<body>
<header>
  <div>
    <h1>🗜️ 文本压缩</h1>
    <div class="sub">基于浏览器 CompressionStream · 纯本地</div>
  </div>
  <div class="toolbar">
    <label class="indent">算法
      <select id="algo"><option value="gzip">Gzip</option><option value="deflate">Deflate</option><option value="deflate-raw">Deflate (raw)</option></select>
    </label>
    <button id="bC" class="primary">压缩</button>
    <button id="bD">解压</button>
    <button id="bCopy">复制结果</button>
    <button id="bClear">清空</button>
  </div>
</header>
<main>
  <section class="pane">
    <div class="pane-head">输入 Input</div>
    <textarea id="in" placeholder="在此粘贴文本，或粘贴 Base64 压缩数据后点「解压」…" spellcheck="false"></textarea>
  </section>
  <section class="pane">
    <div class="pane-head">结果 Output（压缩后为 Base64）</div>
    <textarea id="out" readonly placeholder="结果将显示在这里…" spellcheck="false"></textarea>
  </section>
</main>
<div class="stats" id="stats"></div>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const inp=$('in'),out=$('out'),st=$('st'),stats=$('stats');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  function ab2b64(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
  function b64toab(b64){const bin=atob(b64.replace(/\s+/g,''));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
  if(typeof CompressionStream==='undefined'){
    setStatus('✗ 当前浏览器不支持 CompressionStream（请使用较新版 Chrome / Edge / Firefox / Safari）','err');
    $('bC').disabled=true; $('bD').disabled=true; return;
  }
  async function compress(algo,str){
    const cs=new CompressionStream(algo);
    const w=cs.writable.getWriter(); w.write(new TextEncoder().encode(str)); w.close();
    return new Uint8Array(await new Response(cs.readable).arrayBuffer());
  }
  async function decompress(algo,bytes){
    const ds=new DecompressionStream(algo);
    const w=ds.writable.getWriter(); w.write(bytes); w.close();
    return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
  }
  $('bC').onclick=async()=>{
    if(!inp.value){setStatus('请输入要压缩的文本','err');return;}
    try{
      const a=$('algo').value;
      const buf=await compress(a,inp.value);
      out.value=ab2b64(buf);
      const orig=new TextEncoder().encode(inp.value).length;
      const ratio=((1-buf.length/orig)*100).toFixed(1);
      stats.innerHTML='原始 <b>'+orig+'</b> 字节 · 压缩 <b>'+buf.length+'</b> 字节 · 缩减 <b>'+ratio+'%</b>';
      setStatus('✓ 已压缩（'+a+'）','ok');
    }catch(e){ setStatus('✗ 压缩失败：'+e.message,'err'); }
  };
  $('bD').onclick=async()=>{
    if(!inp.value.trim()){setStatus('请输入 Base64 压缩数据','err');return;}
    try{
      const a=$('algo').value;
      const txt=await decompress(a,b64toab(inp.value));
      out.value=txt;
      stats.innerHTML='解压后 <b>'+new TextEncoder().encode(txt).length+'</b> 字符';
      setStatus('✓ 已解压','ok');
    }catch(e){ setStatus('✗ 解压失败（算法或数据有误）：'+e.message,'err'); }
  };
  $('bCopy').onclick=async()=>{ if(!out.value){setStatus('没有可复制的内容','err');return;} try{ await navigator.clipboard.writeText(out.value); setStatus('✓ 已复制','ok'); }catch(e){ setStatus('复制失败：'+e.message,'err'); } };
  $('bClear').onclick=()=>{ inp.value=''; out.value=''; stats.innerHTML=''; setStatus('已清空'); };
})();
</script>
</body>
</html>
