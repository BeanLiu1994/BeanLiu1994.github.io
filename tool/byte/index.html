<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据存储单位换算 · Data Size Converter</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border)}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px;margin-top:4px}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  label{color:var(--muted);font-size:13px;min-width:64px}
  input[type=number]{flex:1;min-width:120px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:15px;outline:none}
  input[type=number]:focus{border-color:var(--accent)}
  select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{background:var(--bg);color:var(--muted);border:0;padding:8px 14px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  th,td{border:1px solid var(--border);padding:8px 10px;text-align:right}
  th{color:var(--muted)} td.k{text-align:left;color:var(--muted)}
  td.v{color:var(--accent);font-variant-numeric:tabular-nums}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
</style>
</head>
<body>
<header>
  <h1>💾 数据存储单位换算</h1>
  <div class="sub">bit / Byte / KB / MB / GB / TB / PB · 支持十进制(1000)与二进制(1024) · 纯本地</div>
</header>
<main>
  <section class="pane">
    <div class="card">
      <div class="pane-head">输入</div>
      <div class="row"><input type="number" id="val" value="1" step="any"><select id="unit"></select></div>
      <div class="row"><label>进制</label>
        <div class="seg" id="mode"><button data-b="dec" class="on">十进制 ×1000</button><button data-b="bin">二进制 ×1024</button></div>
      </div>
    </div>
  </section>
  <section class="pane">
    <div class="card">
      <div class="pane-head">换算结果</div>
      <table id="tbl"><tbody></tbody></table>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const decU=[['bit','bit'],['Byte','B'],['KB','KB'],['MB','MB'],['GB','GB'],['TB','TB'],['PB','PB']];
  const binU=[['bit','bit'],['Byte','B'],['KiB','KiB'],['MiB','MiB'],['GiB','GiB'],['TiB','TiB'],['PiB','PiB']];
  let base='dec';
  function factors(){
    const k=base==='dec'?1000:1024;
    // 相对 bit 的倍数：bit=1/8 B
    return [ ['bit',1/8], ['Byte',1], ['KB',k], ['MB',k*k], ['GB',k**3], ['TB',k**4], ['PB',k**5] ];
  }
  function fillUnit(){
    const list=base==='dec'?decU:binU;
    const cur=$('unit').value;
    $('unit').innerHTML=list.map((u,i)=>'<option value="'+i+'">'+u[1]+'</option>').join('');
    $('unit').value=cur&&+cur<list.length?cur:'3';
  }
  function fmt(n){
    if(!isFinite(n))return '—';
    if(n!==0&&(Math.abs(n)<1e-4||Math.abs(n)>=1e15))return n.toExponential(4);
    return (Math.round(n*1e6)/1e6).toLocaleString('en-US',{maximumFractionDigits:6});
  }
  function calc(){
    const list=base==='dec'?decU:binU;
    const f=factors();
    const idx=+$('unit').value||0;
    const val=+$('val').value||0;
    const inBytes=val*f[idx][1];
    const tb=$('tbl').querySelector('tbody'); tb.innerHTML='';
    f.forEach((fac,i)=>{
      const v=inBytes/fac[1];
      const tr=document.createElement('tr');
      tr.innerHTML='<td class="k">'+list[i][1]+'</td><td class="v">'+fmt(v)+'</td>';
      tb.appendChild(tr);
    });
    $('st').textContent='✓ 基准：'+fmt(inBytes)+' Byte（'+(base==='dec'?'1KB=1000B':'1KiB=1024B')+'）';
  }
  $('mode').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; base=b.dataset.b;
    [...$('mode').children].forEach(x=>x.classList.toggle('on',x===b)); fillUnit(); calc(); });
  $('val').addEventListener('input',calc);
  $('unit').addEventListener('change',calc);
  fillUnit(); calc();
})();
</script>
</body>
</html>
