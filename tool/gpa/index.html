<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA 绩点计算器 · Grade Point Average</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;max-width:760px;margin:0 auto;width:100%}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  select,input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;outline:none}
  select:focus,input:focus{border-color:var(--accent)}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;transition:.12s}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04122b;font-weight:600}
  .rows{display:flex;flex-direction:column;gap:8px}
  .r{display:grid;grid-template-columns:1fr 90px 90px 36px;gap:8px;align-items:center}
  .r.head{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .r input{padding:8px 10px;font-size:13px}
  .r .delc{text-align:center;color:var(--err);cursor:pointer;font-size:18px;user-select:none}
  .results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
  .stat .k{color:var(--muted);font-size:12px}
  .stat .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .stat .v.ok{color:var(--ok)}
  .pane-head{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  @media(max-width:560px){ .r{grid-template-columns:1fr 70px 70px 30px} .results{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div><h1>🎓 GPA 绩点计算器</h1><div class="sub">加权平均分 · 纯本地</div></div>
</header>
<main>
  <div class="card">
    <div class="topbar">
      <label style="color:var(--muted);font-size:13px;margin:0">计分制</label>
      <select id="scale">
        <option value="5">5.0 制（(分-50)/10）</option>
        <option value="4">4.0 制（美式 A~F）</option>
      </select>
      <button id="add">＋ 添加课程</button>
      <button id="clear">清空</button>
    </div>
    <div class="rows" id="rows">
      <div class="r head"><div>课程</div><div>学分</div><div>成绩</div><div></div></div>
    </div>
  </div>
  <div class="card">
    <div class="results">
      <div class="stat"><div class="k">GPA</div><div class="v ok" id="rGpa">—</div></div>
      <div class="stat"><div class="k">总学分</div><div class="v" id="rCred">—</div></div>
      <div class="stat"><div class="k">课程数</div><div class="v" id="rCnt">—</div></div>
    </div>
  </div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const rows=$('rows');
  function pt4(score){
    if(score>=93)return 4.0; if(score>=90)return 3.7; if(score>=87)return 3.3;
    if(score>=83)return 3.0; if(score>=80)return 2.7; if(score>=77)return 2.3;
    if(score>=73)return 2.0; if(score>=70)return 1.7; if(score>=60)return 1.0; return 0;
  }
  function toPoint(score,scale){
    if(scale==='4') return pt4(score);
    let p=(score-50)/10; if(score<60)p=0; return Math.max(0,Math.min(5,p));
  }
  function addRow(name,credit,score){
    const r=document.createElement('div'); r.className='r';
    r.innerHTML='<input class="name" placeholder="课程名" value="'+(''+name).replace(/"/g,'')+'">'+
      '<input class="credit" type="number" min="0" step="0.5" value="'+credit+'">'+
      '<input class="score" type="number" min="0" max="100" step="0.1" value="'+score+'">'+
      '<div class="delc" title="删除">×</div>';
    r.querySelector('.delc').onclick=()=>{ r.remove(); calc(); };
    rows.appendChild(r);
  }
  function calc(){
    const scale=$('scale').value;
    let gp=0,cred=0,cnt=0;
    rows.querySelectorAll('.r:not(.head)').forEach(r=>{
      const c=parseFloat(r.querySelector('.credit').value), s=parseFloat(r.querySelector('.score').value);
      if(isNaN(c)||isNaN(s)||c<=0) return;
      gp+=c*toPoint(s,scale); cred+=c; cnt++;
    });
    $('rGpa').textContent=cred>0?(gp/cred).toFixed(2):'—';
    $('rCred').textContent=cred>0?cred:'—';
    $('rCnt').textContent=cnt;
    $('st').textContent='✓ 已计算'; $('st').className='status ok';
  }
  $('add').onclick=()=>{ addRow('',3,85); calc(); };
  $('clear').onclick=()=>{ rows.querySelectorAll('.r:not(.head)').forEach(r=>r.remove()); calc(); };
  $('scale').onchange=calc;
  rows.addEventListener('input',calc);
  addRow('高等数学',4,90); addRow('大学英语',3,82); addRow('程序设计',3,95);
  calc();
})();
</script>
</body>
</html>
