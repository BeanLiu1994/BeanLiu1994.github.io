<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本处理 · Text Tools</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  a.btn{display:inline-flex;align-items:center;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 13px;font-size:13px;text-decoration:none;cursor:pointer;transition:.15s}
  a.btn:hover{border-color:var(--accent);color:#fff}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  textarea{width:100%;min-height:200px;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:12px;font-family:"SF Mono",Consolas,Monaco,monospace;font-size:13px;line-height:1.55;resize:vertical}
  .opts{display:flex;flex-wrap:wrap;gap:8px 16px;margin:4px 0 4px}
  label.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer}
  .sep{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:6px}
  .sep input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;width:120px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px}
  .stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .stat .v{font-size:16px;font-family:"SF Mono",Consolas,monospace;margin-top:2px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🧹 文本处理工具</h1>
    <div class="sub">去重 / 排序 / 去空行 / 统计 · 纯本地</div>
  </div>
  <div class="toolbar">
    <button id="bSample">示例</button>
    <a class="btn" href="../../">🏠 首页</a>
  </div>
</header>
<main>
  <section class="card">
    <h2>输入</h2>
    <textarea id="in" spellcheck="false" placeholder="每行一项，粘贴后选择下方操作…"></textarea>
    <div class="opts">
      <label class="chk"><input type="checkbox" id="cTrim"> 去除首尾空白</label>
      <label class="chk"><input type="checkbox" id="cEmpty"> 删除空行</label>
      <label class="chk"><input type="checkbox" id="cDedupe"> 去除重复行</label>
      <label class="chk"><input type="checkbox" id="cSort"> 按字母排序</label>
      <label class="chk"><input type="checkbox" id="cCi"> 排序忽略大小写</label>
      <label class="chk"><input type="checkbox" id="cReverse"> 倒序排列</label>
      <label class="chk"><input type="checkbox" id="cShuffle"> 随机打乱</label>
      <label class="chk"><input type="checkbox" id="cMerge"> 合并为一行</label>
    </div>
    <div class="sep">连接符（合并时使用）：<input type="text" id="sep" value=", "></div>
    <div class="row">
      <button id="bRun" class="primary">处理</button>
      <button id="bCopy">复制结果</button>
      <button id="bClear">清空</button>
    </div>
  </section>
  <section class="card">
    <h2>输出</h2>
    <textarea id="out" spellcheck="false" readonly placeholder="处理结果将显示在这里"></textarea>
    <div class="stats" id="stats">
      <div class="stat"><div class="k">行数</div><div class="v" id="sLines">0</div></div>
      <div class="stat"><div class="k">字符(含空格)</div><div class="v" id="sChar">0</div></div>
      <div class="stat"><div class="k">字符(无空格)</div><div class="v" id="sCharN">0</div></div>
      <div class="stat"><div class="k">词数</div><div class="v" id="sWord">0</div></div>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const st=$('st');
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function updateStats(txt){
    const lines=txt.split(/\r?\n/);
    const chars=txt.length;
    const charsNo=txt.replace(/\s/g,'').length;
    const words=(txt.trim().match(/\S+/g)||[]).length;
    $('sLines').textContent=lines.length;
    $('sChar').textContent=chars;
    $('sCharN').textContent=charsNo;
    $('sWord').textContent=words;
  }
  function process(){
    let lines=$('in').value.split(/\r?\n/);
    if($('cTrim').checked) lines=lines.map(l=>l.trim());
    if($('cEmpty').checked) lines=lines.filter(l=>l!=='');
    if($('cDedupe').checked) lines=[...new Set(lines)];
    if($('cSort').checked){
      const ci=$('cCi').checked;
      lines=lines.slice().sort((a,b)=>ci?a.toLowerCase().localeCompare(b.toLowerCase(),'zh'):a.localeCompare(b,'zh'));
    }
    if($('cReverse').checked) lines=lines.slice().reverse();
    if($('cShuffle').checked) lines=shuffle(lines);
    if($('cMerge').checked){ const sep=$('sep').value; $('out').value=lines.join(sep); }
    else $('out').value=lines.join('\n');
    updateStats($('out').value);
    setStatus('✓ 已处理，共 '+lines.length+' 行','ok');
  }
  async function copy(){const t=$('out').value;if(!t){setStatus('没有可复制的内容','err');return;}try{await navigator.clipboard.writeText(t);setStatus('✓ 已复制结果','ok');}catch(e){setStatus('复制失败：'+e.message,'err');}}
  $('bRun').onclick=process;
  $('bCopy').onclick=copy;
  $('bClear').onclick=()=>{$('in').value='';$('out').value='';updateStats('');setStatus('已清空');};
  $('bSample').onclick=()=>{$('in').value=`banana
Apple
  cherry
apple
banana
  date

fig
`;setStatus('已填入示例，试试勾选去重+排序');};
  updateStats('');
})();
</script>
</body>
</html>
