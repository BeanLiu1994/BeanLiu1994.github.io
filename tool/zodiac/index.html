<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星座 / 生肖查询 · Zodiac</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;max-width:620px;margin:0 auto;width:100%}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
  input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px;outline:none}
  input:focus{border-color:var(--accent)}
  .results{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .big{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center}
  .big .icon{font-size:44px}
  .big .name{font-size:22px;font-weight:700;margin-top:6px;color:var(--ok)}
  .big .sub{color:var(--muted);font-size:12px;margin-top:4px}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;grid-column:1/3}
  .stat .k{color:var(--muted);font-size:12px}
  .stat .v{font-size:15px;margin-top:4px;line-height:1.6}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.err{color:var(--err)}
</style>
</head>
<body>
<header>
  <div><h1>♈ 星座 / 生肖查询</h1><div class="sub">输入生日 → 星座 + 生肖 · 纯本地</div></div>
</header>
<main>
  <div class="card">
    <label>出生日期（公历）</label>
    <input id="date" type="date">
  </div>
  <div class="card">
    <div class="results">
      <div class="big"><div class="icon" id="cIcon">—</div><div class="name" id="cName">星座</div><div class="sub" id="cRange"></div></div>
      <div class="big"><div class="icon" id="zIcon">—</div><div class="name" id="zName">生肖</div><div class="sub" id="zSub"></div></div>
      <div class="stat"><div class="k">星座特质（传统说法，仅供娱乐）</div><div class="v" id="cTrait">—</div></div>
      <div class="stat"><div class="k">生肖信息</div><div class="v" id="zTrait">—</div></div>
    </div>
  </div>
</main>
<div class="status" id="st">请选择出生日期</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const signs=[
    ['摩羯座','♑','12/22–1/19','稳重务实、有责任感、目标明确'],
    ['水瓶座','♒','1/20–2/18','独立创新、思维独特、重视自由'],
    ['双鱼座','♓','2/19–3/20','浪漫敏感、富有想象、善解人意'],
    ['白羊座','♈','3/21–4/19','热情积极、行动力强、勇于开拓'],
    ['金牛座','♉','4/20–5/20','踏实可靠、耐心专注、追求稳定'],
    ['双子座','♊','5/21–6/21','机智灵活、好奇多变、沟通力强'],
    ['巨蟹座','♋','6/22–7/22','顾家温柔、情感细腻、保护欲强'],
    ['狮子座','♌','7/23–8/22','自信大方、有领导力、乐观热情'],
    ['处女座','♍','8/23–9/22','细致严谨、追求完美、逻辑清晰'],
    ['天秤座','♎','9/23–10/23','优雅公正、重视和谐、善于协调'],
    ['天蝎座','♏','10/24–11/22','专注神秘、洞察力强、情感深沉'],
    ['射手座','♐','11/23–12/21','乐观自由、热爱冒险、坦率真诚']
  ];
  // cutoff last day of each sign starting Capricorn
  const cut=[19,18,20,19,20,21,22,22,22,23,22,21];
  const zodiac=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
  const zIcon={'鼠':'🐭','牛':'🐮','虎':'🐯','兔':'🐰','龙':'🐲','蛇':'🐍','马':'🐴','羊':'🐑','猴':'🐵','鸡':'🐔','狗':'🐶','猪':'🐷'};
  const stems=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const branches=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  function calc(){
    const v=$('date').value;if(!v){$('st').textContent='请选择出生日期';$('st').className='status';return;}
    const d=new Date(v+'T00:00:00');const m=d.getMonth()+1,day=d.getDate(),y=d.getFullYear();
    // sign: index by month; if day<=cut[m-1] -> previous sign region
    let idx=m-1;
    if(day>cut[m-1])idx=m%12;
    const s=signs[idx];
    $('cIcon').textContent=s[1];$('cName').textContent=s[0];$('cRange').textContent=s[2];$('cTrait').textContent=s[3];
    // Chinese zodiac (approx by solar year; note actual uses lunar new year)
    const zi=((y-4)%12+12)%12;
    $('zIcon').textContent=zIcon[zodiac[zi]];$('zName').textContent='属'+zodiac[zi];
    // 干支
    const gi=((y-4)%10+10)%10;
    const ganzhi=stems[gi]+branches[zi];
    $('zSub').textContent=ganzhi+'年';
    $('zTrait').textContent='生肖：'+zodiac[zi]+' · 干支：'+ganzhi+'年 · 注：生肖以农历年为准，公历 1–2 月出生者请按当年农历春节核对。';
    $('st').textContent='✓ '+y+'年'+m+'月'+day+'日 → '+s[0]+' · 属'+zodiac[zi];$('st').className='status';$('st').style.color='var(--ok)';
  }
  $('date').addEventListener('input',calc);
  // default today
  $('date').value=new Date().toISOString().slice(0,10);calc();
})();
</script>
</body>
</html>
