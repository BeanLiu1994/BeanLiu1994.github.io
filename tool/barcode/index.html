<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>条形码生成器 · Code128 Barcode</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;max-width:640px;margin:0 auto;width:100%}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
  input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px;outline:none}
  input:focus{border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .btn{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;color:var(--text);transition:.12s}
  .btn:hover{border-color:var(--accent)}
  .preview{background:#fff;border-radius:10px;padding:18px;text-align:center;overflow:auto}
  #cv{max-width:100%}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.err{color:var(--err)} .status.ok{color:var(--ok)}
</style>
</head>
<body>
<header>
  <div><h1>📶 条形码生成器</h1><div class="sub">Code 128 · 纯本地渲染 · 可下载 PNG</div></div>
</header>
<main>
  <div class="card">
    <label>内容（ASCII 32–126）</label>
    <input id="txt" value="HELLO-12345" placeholder="输入文字或数字">
    <div class="row">
      <div><label>条宽 (px)</label><input id="bw" type="number" value="2" min="1" max="6" step="1"></div>
      <div><label>高度 (px)</label><input id="bh" type="number" value="90" min="30" max="300" step="10"></div>
    </div>
    <div class="toolbar">
      <span class="btn" id="dl">⬇️ 下载 PNG</span>
    </div>
  </div>
  <div class="card">
    <div class="preview"><canvas id="cv" width="400" height="140"></canvas></div>
  </div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  // Code128 B pattern table (widths for 11 modules each)
  const P=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
  function draw(){
    const s=$('txt').value;
    const bw=Math.max(1,parseInt($('bw').value)||2);
    const bh=Math.max(30,parseInt($('bh').value)||90);
    // validate ASCII 32-126
    for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(c<32||c>126){err('仅支持 ASCII 可见字符（32–126）：非法字符 "'+s[i]+'"');return;}}
    if(!s.length){err('请输入内容');return;}
    // Start B = 104
    const codes=[104];let sum=104;
    for(let i=0;i<s.length;i++){const v=s.charCodeAt(i)-32;codes.push(v);sum+=v*(i+1);}
    const check=sum%103;codes.push(check);codes.push(106); // stop
    let bits='';codes.forEach(c=>bits+=P[c]);
    // bits is sequence of widths, alternating bar/space starting with bar
    let total=0;for(const ch of bits)total+=parseInt(ch);
    const quiet=10*bw;
    const cv=$('cv');const w=total*bw+quiet*2;const th=bh+34;
    cv.width=w;cv.height=th;const ctx=cv.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,w,th);
    ctx.fillStyle='#000';let x=quiet;let bar=true;
    for(const ch of bits){const wd=parseInt(ch)*bw;if(bar)ctx.fillRect(x,6,wd,bh);x+=wd;bar=!bar;}
    ctx.fillStyle='#000';ctx.font='16px monospace';ctx.textAlign='center';
    ctx.fillText(s,w/2,bh+26);
    ok('✓ 已生成 Code128（'+s.length+' 字符）');
  }
  function ok(m){$('st').textContent=m;$('st').className='status ok';}
  function err(m){$('st').textContent='✗ '+m;$('st').className='status err';}
  $('dl').addEventListener('click',()=>{
    const a=document.createElement('a');a.download='barcode.png';a.href=$('cv').toDataURL('image/png');a.click();
  });
  ['txt','bw','bh'].forEach(id=>$(id).addEventListener('input',draw));
  draw();
})();
</script>
</body>
</html>
