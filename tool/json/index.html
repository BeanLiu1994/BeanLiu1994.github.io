<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化 / 校验器 · JSON Formatter</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c;
    --key:#7ec6ff; --str:#9ece6a; --num:#e5c07b; --bool:#c586c0; --null:#ff8080;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  label.indent{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
  select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px}
  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0}
  .pane.left{border-right:1px solid var(--border)}
  .pane-head{padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:1px}
  textarea{flex:1;background:transparent;color:var(--text);border:0;resize:none;outline:none;
    padding:16px;font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;font-size:13px;line-height:1.6;tab-size:2}
  #output{flex:1;overflow:auto;padding:16px;font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:13px;line-height:1.6;white-space:pre;margin:0}
  .status{padding:8px 16px;font-size:13px;border-top:1px solid var(--border);min-height:36px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .tok-key{color:var(--key)} .tok-str{color:var(--str)} .tok-num{color:var(--num)}
  .tok-bool{color:var(--bool)} .tok-null{color:var(--null)} .tok-punc{color:var(--muted)}
  .foldable{cursor:pointer} .foldable:hover{background:rgba(255,255,255,.04)}
  .fold-btn{display:inline-block;width:14px;color:var(--muted);user-select:none;text-align:center}
  .collapsed-preview{color:var(--muted);font-style:italic}
  .hint{color:var(--muted);font-size:12px}
  @media(max-width:720px){main{flex-direction:column}.pane.left{border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<header>
  <div>
    <h1>🧩 JSON 格式化 / 校验器</h1>
    <div class="sub">纯本地运行 · 数据不上传 · JSON Formatter &amp; Validator</div>
  </div>
  <div class="toolbar">
    <label class="indent">缩进
      <select id="indent">
        <option value="2">2 空格</option>
        <option value="4">4 空格</option>
        <option value="\t">Tab</option>
        <option value="0">压缩</option>
      </select>
    </label>
    <button id="btnFormat" class="primary">格式化</button>
    <button id="btnMinify">压缩</button>
    <button id="btnSort">键排序</button>
    <button id="btnCopy">复制结果</button>
    <button id="btnSample">示例</button>
    <button id="btnClear">清空</button>
  </div>
</header>
<main>
  <section class="pane left">
    <div class="pane-head"><span>输入 Input</span><span class="hint" id="inMeta">0 字符</span></div>
    <textarea id="input" placeholder="在此粘贴 JSON…（也支持含单引号 / 尾随逗号的宽松 JSON，会尽量修复）" spellcheck="false"></textarea>
  </section>
  <section class="pane">
    <div class="pane-head"><span>结果 Output</span><span class="hint" id="outMeta"></span></div>
    <pre id="output"></pre>
  </section>
</main>
<div class="status" id="status">等待输入…</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const input=$('input'), output=$('output'), status=$('status');

  function setStatus(msg, type){ status.textContent=msg; status.className='status'+(type?' '+type:''); }

  // 宽松修复：去掉注释、单引号转双引号、去尾随逗号（尽力而为）
  function looseFix(text){
    let s=text;
    s=s.replace(/\/\/[^\n\r]*/g,'').replace(/\/\*[\s\S]*?\*\//g,''); // 注释
    // 无引号键 -> 加双引号（{ 或 , 之后的裸标识符 + 冒号）
    s=s.replace(/([{,]\s*)([A-Za-z_$][\w$]*)(\s*:)/g,'$1"$2"$3');
    // 单引号字符串 -> 双引号（简单场景）
    s=s.replace(/'([^'\\]*(?:\\.[^'\\]*)*)'/g, (m,g)=> '"'+g.replace(/"/g,'\\"')+'"');
    s=s.replace(/,\s*([}\]])/g,'$1'); // 尾随逗号
    return s;
  }

  function parse(text){
    try{ return {ok:true,data:JSON.parse(text)}; }
    catch(e1){
      try{ const d=JSON.parse(looseFix(text)); return {ok:true,data:d,fixed:true}; }
      catch(e2){ return {ok:false,error:e1.message,pos:posOf(e1.message)}; }
    }
  }
  function posOf(msg){ const m=/position (\d+)/.exec(msg); return m?+m[1]:-1; }

  function getIndent(){ const v=$('indent').value; return v==='\\t'?'\t':(v==='\t'?'\t':(v==='0'?0:parseInt(v))); }

  function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  // 语法高亮渲染
  function highlight(jsonStr){
    return jsonStr.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g,
      function(match){
        let cls='tok-num';
        if(/^"/.test(match)){ cls=/:$/.test(match)?'tok-key':'tok-str'; }
        else if(/true|false/.test(match)) cls='tok-bool';
        else if(/null/.test(match)) cls='tok-null';
        return '<span class="'+cls+'">'+escapeHtml(match)+'</span>';
      }).replace(/([{}\[\],])/g,'<span class="tok-punc">$1</span>');
  }

  function render(data,{minify=false,sort=false}={}){
    let obj=data;
    if(sort) obj=sortKeys(obj);
    const indent=minify?0:getIndent();
    const str=JSON.stringify(obj,null,indent);
    output.innerHTML = minify ? highlight(escapeHtml(str)).replace(/&amp;lt;/g,'') : highlight(str);
    // 上面 escape 重复问题：直接用 highlight（其内部已 escape）
    output.innerHTML = highlight(str);
    $('outMeta').textContent = countInfo(obj)+' · '+str.length+' 字符';
  }

  function sortKeys(o){
    if(Array.isArray(o)) return o.map(sortKeys);
    if(o&&typeof o==='object'){
      return Object.keys(o).sort().reduce((a,k)=>{a[k]=sortKeys(o[k]);return a;},{});
    }
    return o;
  }

  function countInfo(o){
    let keys=0,arr=0,depth=0;
    (function walk(x,d){ depth=Math.max(depth,d);
      if(Array.isArray(x)){arr++;x.forEach(v=>walk(v,d+1));}
      else if(x&&typeof x==='object'){keys+=Object.keys(x).length;Object.values(x).forEach(v=>walk(v,d+1));}
    })(o,1);
    return keys+' 键 · '+arr+' 数组 · 深度 '+depth;
  }

  function run(opts){
    const text=input.value.trim();
    if(!text){ output.innerHTML=''; $('outMeta').textContent=''; setStatus('等待输入…'); return; }
    const r=parse(text);
    if(!r.ok){
      output.innerHTML='';
      let extra='';
      if(r.pos>=0){ const line=text.slice(0,r.pos).split('\n').length; extra='（约第 '+line+' 行）'; }
      setStatus('✗ 无效 JSON：'+r.error+' '+extra,'err');
      return;
    }
    render(r.data,opts);
    setStatus((r.fixed?'✓ 已自动修复并解析（宽松模式）':'✓ 有效 JSON'),'ok');
  }

  $('btnFormat').onclick=()=>run({});
  $('btnMinify').onclick=()=>run({minify:true});
  $('btnSort').onclick=()=>run({sort:true});
  $('btnClear').onclick=()=>{input.value='';run();input.focus();};
  $('btnCopy').onclick=async()=>{
    if(!output.textContent){setStatus('没有可复制的内容','err');return;}
    try{ await navigator.clipboard.writeText(output.textContent); setStatus('✓ 已复制到剪贴板','ok'); }
    catch(e){ setStatus('复制失败：'+e.message,'err'); }
  };
  $('btnSample').onclick=()=>{
    input.value=JSON.stringify({
      name:"Peng Liu",role:"developer",active:true,score:98.5,tags:["json","tool","web"],
      profile:{city:"Nanjing",repos:42,links:{github:"BeanLiu1994",site:"beanliu1994.github.io"}},
      history:[{v:"1.0",ok:true},{v:"2.0",ok:false,note:null}]
    });
    run({});
  };
  input.addEventListener('input',()=>{
    $('inMeta').textContent=input.value.length+' 字符';
    run({});
  });
  $('indent').addEventListener('change',()=>run({}));

  // Ctrl/Cmd+Enter 格式化
  input.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run({});}
  });

  setStatus('等待输入…');
})();
</script>
</body>
</html>
