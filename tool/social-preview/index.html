<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社交分享卡片预览 · Social Card Preview</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  input,textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  textarea{width:100%;min-height:60px;resize:vertical}
  pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;
    font-family:"SF Mono",Consolas,Monaco,monospace;font-size:12.5px;margin:0;white-space:pre-wrap}
  .tw{background:#fff;border:1px solid #e1e8ed;border-radius:14px;overflow:hidden;max-width:480px}
  .tw img{width:100%;display:block;aspect-ratio:1.91/1;object-fit:cover;background:#eaeaea}
  .tw .body{padding:10px 14px}
  .tw .site{color:#536471;font-size:13px;line-height:1.3}
  .tw .title{color:#0f1419;font-weight:700;font-size:15px;margin:2px 0;line-height:1.3}
  .tw .desc{color:#536471;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tw .url{color:#536471;font-size:13px;margin-top:4px;text-transform:lowercase}
  .og{background:#fff;border:1px solid #dadde1;border-radius:8px;overflow:hidden;max-width:480px}
  .og img{width:100%;display:block;aspect-ratio:1.91/1;object-fit:cover;background:#eaeaea}
  .og .body{padding:12px 14px}
  .og .site{color:#606770;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .og .title{color:#1c1e21;font-weight:600;font-size:17px;margin:3px 0;line-height:1.25}
  .og .desc{color:#606770;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
</style>
</head>
<body>
<header>
  <div>
    <h1>🔗 社交分享卡片预览</h1>
    <div class="sub">预览 Twitter / Open Graph 分享效果并生成 Meta 标签 · 纯本地运行</div>
  </div>
  <div class="toolbar">
    <button id="copy" class="primary">复制 Meta</button>
  </div>
</header>
<main>
  <section class="card">
    <h2>输入 Input</h2>
    <label>站点名称<input id="site" value="My Blog"></label>
    <label>标题<input id="title" value="一文搞懂 CSS Grid 布局"></label>
    <label>描述<textarea id="desc">从零开始学习 CSS Grid，包含大量可复制的示例与可视化效果，帮你快速掌握现代网页布局。</textarea></label>
    <label>图片 URL<input id="img" value="https://picsum.photos/600/315"></label>
    <label>链接 URL<input id="url" value="https://example.com/posts/css-grid"></label>
  </section>
  <section class="card">
    <h2>Twitter / X 卡片预览</h2>
    <div class="tw" id="tw"></div>
  </section>
  <section class="card">
    <h2>Open Graph 卡片预览</h2>
    <div class="og" id="og"></div>
  </section>
  <section class="card">
    <h2>生成的 Meta 标签</h2>
    <pre id="meta"></pre>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
const $=id=>document.getElementById(id);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
  const site=$('site').value, title=$('title').value, desc=$('desc').value, img=$('img').value, url=$('url').value;
  $('tw').innerHTML=`<img src="${esc(img)}" alt=""><div class="body">
    <div class="site">${esc(site)}</div>
    <div class="title">${esc(title)}</div>
    <div class="desc">${esc(desc)}</div>
    <div class="url">${esc(url)}</div></div>`;
  $('og').innerHTML=`<img src="${esc(img)}" alt=""><div class="body">
    <div class="site">${esc(site)}</div>
    <div class="title">${esc(title)}</div>
    <div class="desc">${esc(desc)}</div></div>`;
  const meta=`<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="${site}">
<meta name="twitter:title" content="${title}">
<meta name="twitter:description" content="${desc}">
<meta name="twitter:image" content="${img}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="${site}">
<meta property="og:title" content="${title}">
<meta property="og:description" content="${desc}">
<meta property="og:image" content="${img}">
<meta property="og:url" content="${url}">`;
  $('meta').textContent=meta;
}
['site','title','desc','img','url'].forEach(id=>$(id).addEventListener('input',render));
$('copy').addEventListener('click',()=>{
  navigator.clipboard.writeText($('meta').textContent).then(()=>{const s=$('st');s.textContent='已复制 Meta 标签';s.className='status ok';});
});
render();
</script>
</body>
</html>
