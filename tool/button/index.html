<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 按钮生成器 · CSS Button Generator</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  label{color:var(--muted);font-size:13px;min-width:72px}
  input[type=text],input[type=number]{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;outline:none}
  input[type=text]:focus,input[type=number]:focus{border-color:var(--accent)}
  input[type=color]{width:42px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;padding:2px}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px;flex-wrap:wrap}
  .seg button{background:transparent;border:0;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  .seg button.on{background:var(--accent);color:#fff}
  .preview{display:flex;align-items:center;justify-content:center;min-height:120px;padding:20px}
  .out pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;overflow:auto;font-family:"SF Mono",Consolas,Monaco,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;margin:0}
  button.act{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer}
  button.act:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
</style>
</head>
<body>
<header>
  <div>
    <h1>🔘 CSS 按钮生成器</h1>
    <div class="sub">可视化调整 · 一键复制代码 · 纯本地 · Button Generator</div>
  </div>
</header>
<main>
  <section class="pane">
    <div class="card">
      <div class="pane-head">文本与尺寸</div>
      <div class="row"><label>文字</label><input type="text" id="txt" value="点击我"></div>
      <div class="row"><label>字号</label><input type="range" id="fs" min="12" max="32" value="16"><span id="fsv">16px</span></div>
      <div class="row"><label>内边距</label><input type="range" id="pad" min="4" max="32" value="12"><span id="padv">12px</span></div>
      <div class="row"><label>圆角</label><input type="range" id="rad" min="0" max="40" value="8"><span id="radv">8px</span></div>
      <div class="row"><label>字重</label>
        <div class="seg" id="fw"><button data-w="400">常规</button><button data-w="600" class="on">中粗</button><button data-w="700">粗体</button></div>
      </div>
    </div>
    <div class="card">
      <div class="pane-head">颜色与边框</div>
      <div class="row"><label>背景</label><input type="color" id="bg" value="#4f9cff"><input type="text" id="bgx" value="#4f9cff" style="max-width:110px"></div>
      <div class="row"><label>文字</label><input type="color" id="fg" value="#ffffff"><input type="text" id="fgx" value="#ffffff" style="max-width:110px"></div>
      <div class="row"><label>边框</label><input type="range" id="bw" min="0" max="6" value="0"><span id="bwv">0px</span></div>
      <div class="row"><label>边框色</label><input type="color" id="bc" value="#2a2f3a"><input type="text" id="bcx" value="#2a2f3a" style="max-width:110px"></div>
      <div class="row"><label>阴影</label>
        <div class="seg" id="sh"><button data-s="0" class="on">无</button><button data-s="1">柔和</button><button data-s="2">强</button></div>
      </div>
      <div class="row"><label>悬停</label>
        <div class="seg" id="hv"><button data-h="dark" class="on">加深</button><button data-h="light">变亮</button><button data-h="none">不变</button></div>
      </div>
    </div>
  </section>
  <section class="pane">
    <div class="card">
      <div class="pane-head">实时预览</div>
      <div class="preview"><button id="pv">点击我</button></div>
    </div>
    <div class="card out">
      <div class="pane-head" style="display:flex;justify-content:space-between;align-items:center">代码 <button class="act primary" id="copy" style="padding:4px 10px;font-size:12px">复制</button></div>
      <pre id="code"></pre>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  let fw=600, sh=0, hv='dark';
  function clampHex(v){ v=v.trim(); if(!v.startsWith('#'))v='#'+v; if(/^#[0-9a-fA-F]{3}$/.test(v)) v='#'+v.slice(1).split('').map(c=>c+c).join(''); return /^#[0-9a-fA-F]{6}$/.test(v)?v.toLowerCase():'#000000'; }
  function shade(hex,amt){ let n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
  function render(){
    const txt=$('txt').value||'按钮';
    const fs=+$('fs').value, pad=+$('pad').value, rad=+$('rad').value, bw=+$('bw').value;
    const bg=clampHex($('bgx').value), fg=clampHex($('fgx').value), bc=clampHex($('bcx').value);
    const hBg = hv==='dark'?shade(bg,-28):hv==='light'?shade(bg,28):bg;
    const shadow = sh===1?'box-shadow: 0 4px 12px rgba(0,0,0,.18);':sh===2?'box-shadow: 0 8px 20px rgba(0,0,0,.35);':'';
    const border = bw>0?('border: '+bw+'px solid '+bc+';'):'border: none;';
    const css='.my-btn {\n  display: inline-block;\n  padding: '+pad+'px '+Math.round(pad*1.6)+'px;\n  font-size: '+fs+'px;\n  font-weight: '+fw+';\n  color: '+fg+';\n  background: '+bg+';\n  '+border+'\n  border-radius: '+rad+'px;\n  cursor: pointer;\n  transition: background .15s, transform .05s;\n  '+shadow+'\n}\n.my-btn:hover { background: '+hBg+'; }\n.my-btn:active { transform: translateY(1px); }';
    const html='<button class="my-btn">'+txt+'</button>';
    $('code').textContent='<!-- HTML -->\n'+html+'\n\n/* CSS */\n'+css;
    // preview
    const pv=$('pv'); pv.textContent=txt;
    pv.style.fontFamily='inherit'; pv.style.cursor='pointer';
    pv.style.padding=pad+'px '+Math.round(pad*1.6)+'px';
    pv.style.fontSize=fs+'px'; pv.style.fontWeight=fw; pv.style.color=fg; pv.style.background=bg;
    pv.style.borderRadius=rad+'px'; pv.style.border=bw>0?(bw+'px solid '+bc):'none';
    pv.style.boxShadow=sh===1?'0 4px 12px rgba(0,0,0,.18)':sh===2?'0 8px 20px rgba(0,0,0,.35)':'none';
    pv.onmouseenter=()=>pv.style.background=hBg; pv.onmouseleave=()=>pv.style.background=bg;
    $('st').textContent='✓ 已生成按钮代码';
  }
  function bindColor(picker,box){ $(picker).addEventListener('input',()=>{ $(box).value=$(picker).value; render(); }); $(box).addEventListener('input',()=>{ $(picker).value=clampHex($(box).value); render(); }); }
  bindColor('bg','bgx'); bindColor('fg','fgx'); bindColor('bc','bcx');
  ['txt','fs','pad','rad','bw'].forEach(id=>$(id).addEventListener('input',()=>{ $('fsv').textContent=$('fs').value+'px'; $('padv').textContent=$('pad').value+'px'; $('radv').textContent=$('rad').value+'px'; $('bwv').textContent=$('bw').value+'px'; render(); }));
  $('fw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fw=+b.dataset.w;[...$('fw').children].forEach(x=>x.classList.toggle('on',x===b));render();});
  $('sh').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sh=+b.dataset.s;[...$('sh').children].forEach(x=>x.classList.toggle('on',x===b));render();});
  $('hv').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;hv=b.dataset.h;[...$('hv').children].forEach(x=>x.classList.toggle('on',x===b));render();});
  $('copy').onclick=async()=>{ try{ await navigator.clipboard.writeText($('code').textContent); $('st').textContent='✓ 已复制代码'; }catch(e){ $('st').textContent='复制失败：'+e.message; } };
  render();
})();
</script>
</body>
</html>
