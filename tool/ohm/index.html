<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧姆定律计算器 · Ohm's Law</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;max-width:620px;margin:0 auto;width:100%}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
  input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px;outline:none}
  input:focus{border-color:var(--accent)}
  input:disabled{opacity:.5}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.6}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
  .stat .k{color:var(--muted);font-size:13px}
  .stat .v{font-size:18px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.err{color:var(--err)} .status.ok{color:var(--ok)}
</style>
</head>
<body>
<header>
  <div><h1>⚡ 欧姆定律计算器</h1><div class="sub">V = I·R , P = V·I · 填入任意两项</div></div>
</header>
<main>
  <div class="card">
    <div class="row">
      <div><label>电压 V (伏特)</label><input id="V" type="number" step="any" placeholder="V"></div>
      <div><label>电流 I (安培)</label><input id="I" type="number" step="any" placeholder="A"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div><label>电阻 R (欧姆)</label><input id="R" type="number" step="any" placeholder="Ω"></div>
      <div><label>功率 P (瓦特)</label><input id="P" type="number" step="any" placeholder="W"></div>
    </div>
    <div class="hint">填入任意两项，自动求出其余两项。改动会以最近输入的两项为准。</div>
  </div>
  <div class="card">
    <div class="stat"><span class="k">电压 V</span><span class="v" id="oV">—</span></div>
    <div class="stat"><span class="k">电流 I</span><span class="v" id="oI">—</span></div>
    <div class="stat"><span class="k">电阻 R</span><span class="v" id="oR">—</span></div>
    <div class="stat"><span class="k">功率 P</span><span class="v" id="oP">—</span></div>
  </div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const fields=['V','I','R','P'];
  let order=[];
  function r(x){return Math.abs(x)>=1e6||(x!==0&&Math.abs(x)<1e-4)?x.toExponential(4):Math.round(x*1e6)/1e6;}
  function calc(){
    const g=k=>{const v=$(k).value.trim();return v===''?null:parseFloat(v);};
    let V=g('V'),I=g('I'),R=g('R'),P=g('P');
    const known=order.filter(k=>$(k).value.trim()!=='').slice(-2);
    if(known.length<2){fields.forEach(k=>$('o'+k).textContent='—');$('st').textContent='请输入任意两项';$('st').className='status';return;}
    const s=known.slice().sort().join('');
    try{
      if(s==='IV'){R=V/I;P=V*I;}
      else if(s==='RV'){I=V/R;P=V*V/R;}
      else if(s==='PV'){I=P/V;R=V*V/P;}
      else if(s==='IR'){V=I*R;P=I*I*R;}
      else if(s==='IP'){V=P/I;R=P/(I*I);}
      else if(s==='PR'){V=Math.sqrt(P*R);I=Math.sqrt(P/R);}
    }catch(e){}
    if(![V,I,R,P].every(x=>isFinite(x))){$('st').textContent='✗ 数值无效（不能除以 0）';$('st').className='status err';return;}
    $('oV').textContent=r(V)+' V';$('oI').textContent=r(I)+' A';$('oR').textContent=r(R)+' Ω';$('oP').textContent=r(P)+' W';
    // reflect computed into empty inputs (read-only feel)
    fields.forEach(k=>{if(!known.includes(k))$(k).value=r({V,I,R,P}[k]);});
    $('st').textContent='✓ 已计算（依据 '+known.join(' + ')+'）';$('st').className='status ok';
  }
  fields.forEach(k=>$(k).addEventListener('input',()=>{
    order=order.filter(x=>x!==k);order.push(k);
    calc();
  }));
})();
</script>
</body>
</html>
