<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitemap 生成器 · Sitemap Generator</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
  button.ghost{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
  button:active{transform:translateY(1px)}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:320px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  textarea{resize:vertical;min-height:220px;line-height:1.5}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > div{flex:1;min-width:140px}
  pre{margin:0;white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:340px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
</style>
</head>
<body>
<header>
  <div><h1>🗺️ Sitemap 生成器</h1><div class="sub">把网址列表生成标准 sitemap.xml · 纯本地</div></div>
  <div class="toolbar">
    <button id="gen">生成</button>
    <button class="ghost" id="copy">复制</button>
    <button class="ghost" id="dl">下载</button>
  </div>
</header>
<main>
  <section class="pane">
    <div class="card">
      <div class="pane-head">网址列表（每行一个完整 URL）</div>
      <textarea id="urls" placeholder="https://example.com/&#10;https://example.com/about&#10;https://example.com/contact"></textarea>
      <div class="row" style="margin-top:12px">
        <div><label>默认更新频率 changefreq</label>
          <select id="freq"><option value="">不设置</option><option>always</option><option>hourly</option><option>daily</option><option selected>weekly</option><option>monthly</option><option>yearly</option><option>never</option></select></div>
        <div><label>默认优先级 priority</label>
          <select id="prio"><option value="">不设置</option><option>1.0</option><option>0.9</option><option selected>0.8</option><option>0.7</option><option>0.6</option><option>0.5</option><option>0.4</option><option>0.3</option><option>0.2</option><option>0.1</option></select></div>
      </div>
      <label><input type="checkbox" id="lastmod" style="width:auto;margin-right:6px">为每条 URL 写入最后修改时间（当前时间）</label>
    </div>
  </section>
  <section class="pane">
    <div class="card">
      <div class="pane-head"><span>sitemap.xml</span><span id="cnt" style="color:var(--accent)"></span></div>
      <pre id="out">// 在左侧输入网址后点击「生成」</pre>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  function build(){
    const lines=$('urls').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const freq=$('freq').value, prio=$('prio').value, lm=$('lastmod').checked;
    let ok=0; const bad=[];
    let body='';
    const now=new Date().toISOString();
    for(const u of lines){
      if(!/^https?:\/\//i.test(u)){ bad.push(u); continue; }
      ok++;
      body+='  <url>\n    <loc>'+esc(u)+'</loc>\n';
      if(lm) body+='    <lastmod>'+now+'</lastmod>\n';
      if(freq) body+='    <changefreq>'+freq+'</changefreq>\n';
      if(prio) body+='    <priority>'+prio+'</priority>\n';
      body+='  </url>\n';
    }
    if(ok===0){ $('out').textContent='// 没有有效的 http(s) 网址'; $('st').textContent='✗ 未生成，请检查输入'; $('cnt').textContent=''; return; }
    const xml='<?xml version="1.0" encoding="UTF-8"?>\n'+
      '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+body+'</urlset>\n';
    $('out').textContent=xml;
    $('cnt').textContent=ok+' 条';
    let msg='✓ 已生成 '+ok+' 条 URL';
    if(bad.length) msg+='，跳过 '+bad.length+' 个无效项';
    $('st').textContent=msg;
  }
  function copy(){ navigator.clipboard.writeText($('out').textContent).then(()=>$('st').textContent='✓ 已复制到剪贴板'); }
  function dl(){ const b=new Blob([$('out').textContent],{type:'application/xml'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='sitemap.xml'; a.click(); }
  $('gen').onclick=build; $('copy').onclick=copy; $('dl').onclick=dl;
})();
</script>
</body>
</html>
