<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>银行卡号 Luhn 校验</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
  header{padding:14px 20px;border-bottom:1px solid var(--border);width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;justify-content:center;padding:20px;width:100%}
  .card{width:720px;max-width:100%;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
  label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
  input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:11px 12px;font-size:18px;font-family:ui-monospace,Menlo,Consolas,monospace;outline:none;letter-spacing:2px}
  input:focus{border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;
    padding:10px 16px;font-size:14px;cursor:pointer;transition:.12s;font-family:inherit}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04122b;font-weight:600}
  .out{margin-top:14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;word-break:break-all}
  .out .k{color:var(--muted);font-size:12px;display:block;margin-bottom:4px}
  .out .v{color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px}
  .out.bad .v{color:var(--err)} .out.ok .v{color:var(--ok)}
  .hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.6}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);width:100%;min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
</style>
</head>
<body>
<header><div><h1>💳 银行卡号 Luhn 校验</h1><div class="sub">卡号合法性 · 卡组织识别 · 纯本地</div></div></header>
<main>
  <div class="card">
    <label>输入银行卡号（可带空格）</label>
    <input id="inp" placeholder="例如：4111111111111111" value="4111111111111111">
    <div class="row">
      <button class="primary" id="conv">校验</button>
      <button id="mask">脱敏显示</button>
      <button id="clear">清空</button>
    </div>
    <div class="out" id="o1"><span class="k">Luhn 校验</span><span class="v" id="valid">—</span></div>
    <div class="out" id="o2"><span class="k">卡组织（按卡号前缀识别）</span><span class="v" id="brand">—</span></div>
    <div class="out" id="o3"><span class="k">位数</span><span class="v" id="len">—</span></div>
    <p class="hint">Luhn 算法（模 10）用于校验银行卡号、IMEI 等编号的合法性。卡组织识别基于公开的 IIN（发卡行标识）前缀规则。本工具仅本地计算，不会上传任何卡号。</p>
  </div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const clean=s=>s.replace(/\s/g,'');
  function luhn(s){
    let sum=0, alt=false;
    for(let i=s.length-1;i>=0;i--){
      let d=+s[i]; if(isNaN(d)) return false;
      if(alt){ d*=2; if(d>9) d-=9; }
      sum+=d; alt=!alt;
    }
    return sum%10===0;
  }
  function brand(s){
    if(/^4/.test(s)) return 'Visa';
    if(/^(5[1-5]|2(2[2-9]|[3-6]|7[01]|720))/.test(s)) return 'Mastercard';
    if(/^3[47]/.test(s)) return 'American Express';
    if(/^(6011|65|64[4-9])/.test(s)) return 'Discover';
    if(/^62/.test(s)) return 'UnionPay 银联';
    if(/^35/.test(s)) return 'JCB';
    if(/^(30[0-5]|36|38|39)/.test(s)) return 'Diners Club';
    if(/^(2014|2149)/.test(s)) return 'enRoute';
    if(/^(50|56|57|58)/.test(s)) return 'Maestro';
    return '未知 / 其他';
  }
  function run(){
    const raw=clean($('inp').value);
    if(!raw){ $('valid').textContent='—'; $('brand').textContent='—'; $('len').textContent='—'; $('st').textContent='请输入卡号'; return; }
    if(!/^\d+$/.test(raw)){ $('st').textContent='⚠ 仅允许数字'; $('o1').className='out bad'; return; }
    const ok=luhn(raw);
    $('valid').textContent= ok?'✓ 通过 Luhn 校验':'✗ 未通过 Luhn 校验';
    $('brand').textContent= brand(raw);
    $('len').textContent= raw.length+' 位';
    $('o1').className='out '+(ok?'ok':'bad');
    $('st').textContent= ok?'✓ 校验完成':'⚠ 卡号校验未通过';
  }
  $('conv').addEventListener('click',run);
  $('inp').addEventListener('input',run);
  $('mask').addEventListener('click',()=>{
    const raw=clean($('inp').value); if(!/^\d+$/.test(raw)||raw.length<8) return;
    const m=raw.slice(0,4)+' **** **** '+raw.slice(-4);
    $('inp').value=m; $('st').textContent='已脱敏显示（仅为展示，请重新输入完整卡号校验）';
  });
  $('clear').addEventListener('click',()=>{ $('inp').value=''; run(); });
  run();
})();
</script>
</body>
</html>
