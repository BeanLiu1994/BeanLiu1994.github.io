<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片马赛克 / 像素化 · Image Pixelate</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  button:disabled{opacity:.45;cursor:not-allowed}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  input[type=range]{width:100%}
  .canvas-wrap{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;justify-content:center;overflow:auto}
  canvas{max-width:100%;height:auto;border-radius:4px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🟪 图片马赛克 / 像素化</h1>
    <div class="sub">像素化模糊敏感区域 · 纯本地运行，不上传</div>
  </div>
  <div class="toolbar">
    <button id="download" class="primary" disabled>下载 PNG</button>
  </div>
</header>
<main>
  <section class="card">
    <h2>上传图片</h2>
    <input type="file" id="file" accept="image/*">
    <p class="hint" style="margin-top:8px">图片仅在浏览器内处理，不会发送到任何服务器。</p>
  </section>
  <section class="card">
    <h2>参数</h2>
    <label>像素块大小：<span id="psVal">12</span> px
      <input type="range" id="ps" min="2" max="60" value="12">
    </label>
  </section>
  <section class="card">
    <h2>预览</h2>
    <div class="canvas-wrap"><canvas id="cv" width="400" height="300"></canvas></div>
  </section>
</main>
<div class="status" id="st">请选择一张图片</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
let img=null;
function setStatus(m,cls){const s=$('st');s.textContent=m;s.className='status '+(cls||'');}
function draw(){
  if(!img) return;
  const ps=parseInt($('ps').value);
  const w=img.naturalWidth, h=img.naturalHeight;
  cv.width=w; cv.height=h;
  const tw=Math.max(1,Math.floor(w/ps)), th=Math.max(1,Math.floor(h/ps));
  const small=document.createElement('canvas'); small.width=tw; small.height=th;
  small.getContext('2d').drawImage(img,0,0,tw,th);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(small,0,0,tw,th,0,0,w,h);
  $('download').disabled=false;
}
$('file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const im=new Image();
    im.onload=()=>{ img=im; draw(); setStatus('已加载：'+im.naturalWidth+'×'+im.naturalHeight,'ok'); };
    im.src=ev.target.result;
  };
  reader.readAsDataURL(f);
});
$('ps').addEventListener('input',()=>{ $('psVal').textContent=$('ps').value; draw(); });
$('download').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.download='pixelated.png';
  a.href=cv.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
