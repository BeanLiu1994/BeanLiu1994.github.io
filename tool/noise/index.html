<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白噪音生成器 · White Noise Generator</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  a.btn{display:inline-flex;align-items:center;background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 13px;font-size:13px;text-decoration:none;cursor:pointer;transition:.15s}
  a.btn:hover{border-color:var(--accent);color:#fff}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;align-items:center}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;width:100%;max-width:560px;text-align:center}
  .types{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
  .types button{background:var(--bg);color:var(--muted);border:1px solid var(--border);border-radius:10px;
    padding:12px 16px;font-size:14px;cursor:pointer;transition:.15s;min-width:96px}
  .types button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .wave{height:90px;display:flex;align-items:flex-end;justify-content:center;gap:3px;margin:6px 0 16px}
  .wave i{flex:1;background:var(--accent);opacity:.5;border-radius:2px;transition:.1s}
  .controls{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
  button.play{background:var(--ok);color:#06281c;border:1px solid var(--ok);border-radius:10px;
    padding:12px 28px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
  button.play.stop{background:var(--err);border-color:var(--err);color:#2a0608}
  .vol{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
  input[type=range]{accent-color:var(--accent)}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <h1>🌊 白噪音生成器</h1>
    <div class="sub">助眠 / 专注 / 放松 · Web Audio · 纯本地</div>
  </div>
  <div class="toolbar">
    <a class="btn" href="../../">🏠 首页</a>
  </div>
</header>
<main>
  <section class="card">
    <div class="types" id="types">
      <button data-t="white" class="active">白噪音 White</button>
      <button data-t="pink">粉噪音 Pink</button>
      <button data-t="brown">棕噪音 Brown</button>
    </div>
    <div class="wave" id="wave"></div>
    <div class="controls">
      <button id="play" class="play">▶ 播放</button>
      <div class="vol">音量 <input type="range" id="vol" min="0" max="100" value="40"></div>
    </div>
  </section>
</main>
<div class="status" id="st">选择一种噪音类型后点击播放。</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const st=$('st');
  let ctx=null, src=null, gain=null, playing=false, type='white';
  function ensureCtx(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); }
  function makeBuffer(){
    const len=ctx.sampleRate*2;
    const buf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=buf.getChannelData(0);
    if(type==='white'){ for(let i=0;i<len;i++) d[i]=Math.random()*2-1; }
    else if(type==='pink'){
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i<len;i++){
        const w=Math.random()*2-1;
        b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520;
        b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
        d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
      }
    } else { // brown
      let last=0;
      for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5; }
    }
    return buf;
  }
  function start(){
    ensureCtx(); if(ctx.state==='suspended')ctx.resume();
    src=ctx.createBufferSource(); src.buffer=makeBuffer(); src.loop=true;
    gain=ctx.createGain(); gain.gain.value=+$('vol').value/100*0.6;
    src.connect(gain); gain.connect(ctx.destination); src.start();
    playing=true; $('play').textContent='■ 停止'; $('play').classList.add('stop'); st.textContent='播放中：'+type+' noise';
    animate();
  }
  function stop(){
    playing=false;
    if(src){ try{src.stop();}catch(e){} src.disconnect(); }
    if(gain) gain.disconnect();
    $('play').textContent='▶ 播放'; $('play').classList.remove('stop'); st.textContent='已停止';
  }
  function animate(){
    const bars=$('wave').children;
    for(let i=0;i<bars.length;i++){
      const h = playing ? (8+Math.random()*82) : 6;
      bars[i].style.height=h+'%';
    }
    if(playing) requestAnimationFrame(animate);
  }
  // 波形占位条
  const w=$('wave'); for(let i=0;i<40;i++){ const b=document.createElement('i'); b.style.height='6%'; w.appendChild(b); }
  $('types').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $('types').querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); type=b.dataset.t;
    if(playing){ stop(); start(); }
    st.textContent='已选择：'+type+' noise';
  });
  $('play').onclick=()=>playing?stop():start();
  $('vol').addEventListener('input',()=>{ if(gain) gain.gain.value=+$('vol').value/100*0.6; });
})();
</script>
</body>
</html>
