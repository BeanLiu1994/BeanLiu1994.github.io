<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>速度 / 距离 / 时间 · Speed</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;max-width:760px;margin:0 auto;width:100%}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
  input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;font-family:inherit}
  input:focus,select:focus{border-color:var(--accent)}
  input[type=number]{font-family:"SF Mono",monospace}
  .inline{display:flex;gap:8px}
  .inline input{flex:1}
  .inline select{flex:0 0 110px}
  .results{display:flex;justify-content:center;margin-top:6px}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px 28px;text-align:center;min-width:240px}
  .stat .k{color:var(--muted);font-size:12px}
  .stat .v{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;word-break:break-all}
  .stat .v.ok{color:var(--ok)}
  .hint{color:var(--muted);font-size:12px;margin:12px 0 0}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  @media(max-width:560px){ .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>
<header><div><h1>🚗 速度 / 距离 / 时间</h1><div class="sub">填两项自动算第三项 · 纯本地</div></div></header>
<main>
  <div class="card">
    <div class="grid2">
      <div>
        <label>速度</label>
        <div class="inline"><input id="sp" type="number" step="any" placeholder="速度"><select id="spu"><option value="kmh">km/h</option><option value="ms">m/s</option><option value="mph">mph</option></select></div>
      </div>
      <div>
        <label>距离</label>
        <div class="inline"><input id="ds" type="number" step="any" placeholder="距离"><select id="dsu"><option value="km">km</option><option value="m">m</option><option value="mi">mi</option></select></div>
      </div>
      <div>
        <label>时间</label>
        <div class="inline"><input id="tm" type="number" step="any" placeholder="时间"><select id="tmu"><option value="h">小时</option><option value="min">分钟</option><option value="s">秒</option></select></div>
      </div>
      <div></div>
    </div>
    <p class="hint">填写任意两项即可自动计算第三项。</p>
  </div>
  <div class="card">
    <div class="results">
      <div class="stat"><div class="k">计算结果</div><div class="v ok" id="rVal">—</div></div>
    </div>
  </div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const SPEED={kmh:1000/3600, ms:1, mph:1609.344/3600};
  const DIST={km:1000, m:1, mi:1609.344};
  const TIME={h:3600, min:60, s:1};
  const LABEL={sp:'速度', ds:'距离', tm:'时间'};
  const UNIT={sp:{kmh:'km/h',ms:'m/s',mph:'mph'}, ds:{km:'km',m:'m',mi:'mi'}, tm:{h:'小时',min:'分钟',s:'秒'}};
  function setStatus(m,t){ $('st').textContent=m; $('st').className='status'+(t?' '+t:''); }
  function round(n){ if(!isFinite(n)) return '—'; if(n!==0 && (Math.abs(n)<1e-6||Math.abs(n)>=1e12)) return n.toExponential(6); return (Math.round(n*1e6)/1e6).toString(); }
  function calc(){
    const spRaw=$('sp').value.trim(), dsRaw=$('ds').value.trim(), tmRaw=$('tm').value.trim();
    const sp=parseFloat(spRaw), ds=parseFloat(dsRaw), tm=parseFloat(tmRaw);
    const hasSp=spRaw!=='' && !isNaN(sp);
    const hasDs=dsRaw!=='' && !isNaN(ds);
    const hasTm=tmRaw!=='' && !isNaN(tm);
    const cnt=(hasSp?1:0)+(hasDs?1:0)+(hasTm?1:0);
    if(cnt<2){ $('rVal').textContent='—'; setStatus('请填写任意两项','err'); return; }
    let msg='';
    if(!hasSp){
      const d=ds*DIST[$('dsu').value], t=tm*TIME[$('tmu').value];
      const mps=d/t; const val=mps/SPEED[$('spu').value];
      $('sp').value=round(val); msg='速度 = '+round(val)+' '+UNIT.sp[$('spu').value];
    } else if(!hasDs){
      const mps=sp*SPEED[$('spu').value], t=tm*TIME[$('tmu').value];
      const m=mps*t; const val=m/DIST[$('dsu').value];
      $('ds').value=round(val); msg='距离 = '+round(val)+' '+UNIT.ds[$('dsu').value];
    } else if(!hasTm){
      const mps=sp*SPEED[$('spu').value], m=ds*DIST[$('dsu').value];
      const s=m/mps; const val=s/TIME[$('tmu').value];
      $('tm').value=round(val); msg='时间 = '+round(val)+' '+UNIT.tm[$('tmu').value];
    }
    $('rVal').textContent=msg;
    setStatus('✓ '+msg,'ok');
  }
  ['sp','ds','tm'].forEach(id=>$(id).addEventListener('input',calc));
  ['spu','dsu','tmu'].forEach(id=>$(id).addEventListener('change',calc));
})();
</script>
</body>
</html>
