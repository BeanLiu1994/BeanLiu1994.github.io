<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>屏幕像素标尺 · Pixel Ruler</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;flex-direction:column;padding:16px;gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .tip{color:var(--muted);font-size:13px;line-height:1.7}
  .readout{font-size:20px;font-weight:700;color:var(--accent);margin:6px 0 2px}
  .stagewrap{position:relative;overflow:auto;max-height:64vh;border:1px solid var(--border);border-radius:12px;background:var(--bg)}
  .corner{position:sticky;top:0;left:0;width:34px;height:34px;background:var(--panel);z-index:3;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
  .rulerH{position:sticky;top:0;height:34px;background:var(--panel);z-index:2;border-bottom:1px solid var(--border)}
  .rulerV{position:sticky;left:0;width:34px;background:var(--panel);z-index:2;border-right:1px solid var(--border)}
  .inner{position:relative;min-width:1600px;min-height:800px}
  .measure{position:absolute;left:34px;top:34px;right:0;bottom:0;cursor:crosshair}
  .sel{position:absolute;border:1px solid var(--accent);background:rgba(79,156,255,.12);pointer-events:none;display:none}
  .sel .lab{position:absolute;left:4px;top:2px;color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent)}
</style>
</head>
<body>
<header><div><h1>📏 屏幕像素标尺</h1><div class="sub">拖拽测量任意区域尺寸 · 纯本地</div></div></header>
<main>
  <section class="card">
    <div class="readout" id="ro">在下方区域按住鼠标拖拽即可测量</div>
    <div class="row">
      <span class="tip">提示：上方与左侧为像素刻度尺，可直接对照量取元素尺寸。</span>
      <button id="clear">清除测量</button>
    </div>
  </section>
  <div class="stagewrap" id="stage">
    <div style="position:relative">
      <div class="corner"></div>
      <svg class="rulerH" id="rh" width="1600" height="34"></svg>
      <svg class="rulerV" id="rv" width="34" height="800"></svg>
      <div class="inner" id="inner">
        <div class="measure" id="measure">
          <div class="sel" id="sel"><span class="lab" id="lab"></span></div>
        </div>
      </div>
    </div>
  </div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  function drawRulers(){
    const W=$('inner').clientWidth, H=$('inner').clientHeight;
    $('rh').setAttribute('width',W); $('rv').setAttribute('height',H);
    let h='';
    for(let x=0;x<=W;x+=10){
      const big=x%100===0, mid=x%50===0;
      const y2=big?34:(mid?24:16);
      h+='<line x1="'+x+'" y1="34" x2="'+x+'" y2="'+y2+'" stroke="'+(big?'#9aa4b2':'#2a2f3a')+'" stroke-width="1"/>';
      if(big) h+='<text x="'+(x+2)+'" y="12" fill="#9aa4b2" font-size="10">'+x+'</text>';
    }
    $('rh').innerHTML=h;
    let v='';
    for(let y=0;y<=H;y+=10){
      const big=y%100===0, mid=y%50===0;
      const x2=big?34:(mid?24:16);
      v+='<line x1="34" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+(big?'#9aa4b2':'#2a2f3a')+'" stroke-width="1"/>';
      if(big) v+='<text x="3" y="'+(y+11)+'" fill="#9aa4b2" font-size="10">'+y+'</text>';
    }
    $('rv').innerHTML=v;
  }
  let dragging=false, sx=0, sy=0;
  const measure=$('measure'), sel=$('sel'), lab=$('lab');
  function pos(e){ const r=measure.getBoundingClientRect(); const cx=e.clientX-r.left, cy=e.clientY-r.top;
    return {x:Math.max(0,Math.min(cx,r.width)), y:Math.max(0,Math.min(cy,r.height))}; }
  measure.addEventListener('mousedown',e=>{ dragging=true; const p=pos(e); sx=p.x; sy=p.y; sel.style.display='block';
    sel.style.left=sx+'px'; sel.style.top=sy+'px'; sel.style.width='0'; sel.style.height='0'; });
  window.addEventListener('mousemove',e=>{ if(!dragging)return; const p=pos(e);
    const x=Math.min(p.x,sx), y=Math.min(p.y,sy), w=Math.abs(p.x-sx), h=Math.abs(p.y-sy);
    sel.style.left=x+'px'; sel.style.top=y+'px'; sel.style.width=w+'px'; sel.style.height=h+'px';
    lab.textContent=Math.round(w)+' × '+Math.round(h)+' px';
    $('ro').textContent='测量：'+Math.round(w)+' × '+Math.round(h)+' 像素'; });
  window.addEventListener('mouseup',()=>{ if(dragging){ dragging=false; $('st').textContent='✓ 测量完成'; } });
  $('clear').onclick=()=>{ sel.style.display='none'; $('ro').textContent='已清除'; $('st').textContent='就绪'; };
  drawRulers();
  window.addEventListener('resize',drawRulers);
})();
</script>
</body>
</html>
