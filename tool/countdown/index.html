<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倒数日 · Countdown Days</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border)}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px;margin-top:4px}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  input[type=text],input[type=date]{flex:1;min-width:120px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  button.add{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
  .item .name{font-size:15px;font-weight:600}
  .item .date{color:var(--muted);font-size:12px;margin-top:2px}
  .item .days{font-size:24px;font-weight:700}
  .item .days.future{color:var(--accent)} .item .days.past{color:var(--muted)} .item .days.today{color:var(--ok)}
  .item .unit{font-size:12px;color:var(--muted);text-align:right}
  .del{background:transparent;border:0;color:var(--err);font-size:18px;cursor:pointer;padding:4px 8px}
  .empty{color:var(--muted);font-size:13px;padding:20px;text-align:center}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
</style>
</head>
<body>
<header>
  <h1>📆 倒数日</h1>
  <div class="sub">记录重要日子 · 自动计算相隔天数 · 数据保存在本地浏览器</div>
</header>
<main>
  <section class="pane" style="flex:0 0 320px">
    <div class="card">
      <div class="pane-head">添加事件</div>
      <div class="row"><input type="text" id="nm" placeholder="事件名称，如 生日 / 考试"></div>
      <div class="row"><input type="date" id="dt"></div>
      <div class="row"><button class="add" id="addBtn">➕ 添加</button></div>
    </div>
  </section>
  <section class="pane">
    <div class="card">
      <div class="pane-head">我的倒数日</div>
      <div id="list"></div>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const KEY='countdown_events_v1';
  function load(){ try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []} }
  function save(a){ localStorage.setItem(KEY,JSON.stringify(a)); }
  function daysDiff(target){
    const now=new Date(); const t=new Date(target+'T00:00:00');
    const a=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    return Math.round((t-a)/86400000);
  }
  function render(){
    const arr=load().sort((x,y)=>Math.abs(daysDiff(x.date))-Math.abs(daysDiff(y.date)));
    const box=$('list');
    if(!arr.length){ box.innerHTML='<div class="empty">还没有事件，先在左侧添加一个吧 👈</div>'; return; }
    box.innerHTML='';
    arr.forEach(ev=>{
      const d=daysDiff(ev.date);
      let cls,txt,unit;
      if(d>0){cls='future';txt=d;unit='天后';}
      else if(d<0){cls='past';txt=Math.abs(d);unit='天前';}
      else{cls='today';txt='今天';unit='就是今天 🎉';}
      const el=document.createElement('div'); el.className='item';
      el.innerHTML='<div><div class="name">'+escapeHtml(ev.name)+'</div><div class="date">'+ev.date+'</div></div>'+
        '<div style="display:flex;align-items:center;gap:10px"><div style="text-align:right"><div class="days '+cls+'">'+txt+'</div><div class="unit">'+unit+'</div></div>'+
        '<button class="del" data-id="'+ev.id+'">✕</button></div>';
      box.appendChild(el);
    });
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  $('addBtn').addEventListener('click',()=>{
    const nm=$('nm').value.trim(), dt=$('dt').value;
    if(!nm||!dt){ $('st').textContent='请填写名称和日期'; return; }
    const arr=load(); arr.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),name:nm,date:dt});
    save(arr); $('nm').value=''; render(); $('st').textContent='✓ 已添加';
  });
  $('list').addEventListener('click',e=>{ const b=e.target.closest('.del'); if(!b)return;
    save(load().filter(x=>x.id!==b.dataset.id)); render(); $('st').textContent='✓ 已删除'; });
  // 默认日期为今天
  $('dt').value=new Date().toISOString().slice(0,10);
  render();
})();
</script>
</body>
</html>
