<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI 计算器 · BMI Calculator</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --warn:#e5c07b; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  .pane{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .pane-head{padding:6px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  label{color:var(--muted);font-size:13px;min-width:64px}
  input[type=number]{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;outline:none}
  input[type=number]:focus{border-color:var(--accent)}
  .seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px}
  .seg button{background:transparent;border:0;color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
  .seg button.on{background:var(--accent);color:#fff}
  .big{font-size:46px;font-weight:800;text-align:center;color:var(--accent)}
  .cat{text-align:center;font-size:16px;font-weight:600;margin-top:4px}
  .bar{height:12px;border-radius:999px;background:var(--bg);margin:18px 0 8px;position:relative;overflow:hidden;display:flex}
  .bar .seg1{flex:1;background:#5d9cec} .bar .seg2{flex:1.2;background:var(--ok)} .bar .seg3{flex:1.4;background:var(--warn)} .bar .seg4{flex:1.6;background:var(--err)}
  .marker{position:absolute;top:-4px;width:4px;height:20px;background:#fff;border-radius:2px;box-shadow:0 0 4px rgba(0,0,0,.6);transition:left .2s}
  .scale{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px;color:var(--ok)}
  .note{color:var(--muted);font-size:13px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div>
    <h1>⚖️ BMI 计算器</h1>
    <div class="sub">身体质量指数 · 纯本地 · 仅供参考</div>
  </div>
</header>
<main>
  <section class="pane">
    <div class="card">
      <div class="pane-head">单位</div>
      <div class="seg" id="unit">
        <button data-u="metric" class="on">公制 (cm/kg)</button>
        <button data-u="imperial">英制 (in/lb)</button>
      </div>
    </div>
    <div class="card">
      <div class="pane-head">输入</div>
      <div class="row"><label id="lH">身高</label><input type="number" id="height" placeholder="170" value="170"> <span id="uH">cm</span></div>
      <div class="row"><label id="lW">体重</label><input type="number" id="weight" placeholder="65" value="65"> <span id="uW">kg</span></div>
      <div class="row"><label>年龄</label><input type="number" id="age" placeholder="可选" value="30"> <span>岁</span></div>
      <div class="row"><label>性别</label>
        <div class="seg" id="sex"><button data-s="m" class="on">男</button><button data-s="f">女</button></div>
      </div>
    </div>
  </section>
  <section class="pane">
    <div class="card">
      <div class="pane-head">结果</div>
      <div class="big" id="bmi">—</div>
      <div class="cat" id="cat">请输入身高体重</div>
      <div class="bar">
        <div class="seg1"></div><div class="seg2"></div><div class="seg3"></div><div class="seg4"></div>
        <div class="marker" id="marker" style="left:33%"></div>
      </div>
      <div class="scale"><span>偏瘦</span><span>正常</span><span>超重</span><span>肥胖</span></div>
      <div class="note" style="margin-top:14px" id="advice"></div>
    </div>
  </section>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  let unit='metric', sex='m';
  function fmt(v){ return Math.round(v*10)/10; }
  function render(){
    let h=parseFloat($('height').value), w=parseFloat($('weight').value);
    if(!h||!w||h<=0||w<=0){ $('bmi').textContent='—'; $('cat').textContent='请输入有效的身高和体重'; $('marker').style.left='0%'; $('advice').textContent=''; return; }
    if(unit==='imperial'){ h*=2.54; w*=0.453592; }
    const bmi=w/Math.pow(h/100,2);
    $('bmi').textContent=fmt(bmi);
    let cat,color,advice;
    if(bmi<18.5){ cat='偏瘦 (Underweight)'; color='var(--accent)'; advice='体重偏低，建议均衡饮食、适度增加营养摄入。'; }
    else if(bmi<24){ cat='正常 (Normal)'; color='var(--ok)'; advice='体重在健康范围，继续保持规律作息与运动。'; }
    else if(bmi<28){ cat='超重 (Overweight)'; color='var(--warn)'; advice='体重略高，建议控制热量、增加有氧运动。'; }
    else { cat='肥胖 (Obese)'; color='var(--err)'; advice='体重过高，建议咨询医生或营养师制定健康计划。'; }
    $('cat').textContent=cat; $('cat').style.color=color; $('bmi').style.color=color;
    const pos=Math.min(100,Math.max(0,((bmi-15)/(35-15))*100));
    $('marker').style.left=pos+'%';
    let extra='';
    const a=parseFloat($('age').value);
    if(a>0){ extra=' 当前年龄 '+a+' 岁，性别 '+(sex==='m'?'男':'女')+'。'; }
    $('advice').textContent=advice+extra+'（BMI 仅供初步参考，不能反映体脂率与肌肉量。）';
    $('st').textContent='✓ BMI = '+fmt(bmi)+' · '+cat;
  }
  $('unit').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; unit=b.dataset.u;
    [...$('unit').children].forEach(x=>x.classList.toggle('on',x===b));
    const imp=unit==='imperial'; $('lH').textContent='身高'; $('uH').textContent=imp?'in':'cm'; $('uW').textContent=imp?'lb':'kg'; render(); });
  $('sex').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; sex=b.dataset.s;
    [...$('sex').children].forEach(x=>x.classList.toggle('on',x===b)); render(); });
  ['height','weight','age'].forEach(id=>$(id).addEventListener('input',render));
  render();
})();
</script>
</body>
</html>
