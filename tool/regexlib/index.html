<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常用正则片段库 · Regex Library</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px;outline:none}
  input:focus{border-color:var(--accent)}
  main{flex:1;display:flex;flex-direction:column;padding:16px;gap:14px;min-height:0}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;align-content:start;padding-right:4px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:.15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card .name{font-weight:600;font-size:14px;margin-bottom:4px}
  .card .pat{font-family:"SF Mono",Consolas,monospace;font-size:12px;color:var(--accent);word-break:break-all;background:var(--bg);
    padding:6px 8px;border-radius:6px;margin:6px 0}
  .card .desc{color:var(--muted);font-size:12px}
  .card .sample{color:var(--muted);font-size:11px;margin-top:4px;word-break:break-all}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
</style>
</head>
<body>
<header>
  <div>
    <h1>📚 常用正则片段库</h1>
    <div class="sub">纯本地片段 · 点击复制正则 · Regex Library</div>
  </div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索用途或片段…" style="width:240px">
  </div>
</header>
<main>
  <div class="filters" id="cats"></div>
  <div class="grid" id="grid"></div>
</main>
<div class="status" id="st">点击卡片复制 /pattern/flags</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const DATA=[
    {n:'邮箱 Email',p:'[\\w.%+-]+@[\\w.-]+\\.[A-Za-z]{2,}',f:'g',cat:'验证',d:'匹配标准电子邮件地址',s:'peng.liu@example.com'},
    {n:'URL 网址',p:'https?://[\\w.-]+(?:/[\\w./?%&=-]*)?',f:'g',cat:'验证',d:'匹配 http/https 链接',s:'https://example.com/path?q=1'},
    {n:'IPv4 地址',p:'\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b',f:'g',cat:'验证',d:'粗略匹配 IPv4（不校验 0-255）',s:'192.168.1.1'},
    {n:'中国大陆手机号',p:'1[3-9]\\d{9}',f:'g',cat:'验证',d:'匹配 11 位手机号',s:'13812345678'},
    {n:'十六进制颜色',p:'#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})\\b',f:'g',cat:'验证',d:'匹配 #fff 或 #ffffff',s:'#4f9cff'},
    {n:'日期 YYYY-MM-DD',p:'\\d{4}-\\d{2}-\\d{2}',f:'g',cat:'验证',d:'匹配 ISO 日期',s:'2026-07-12'},
    {n:'时间 HH:MM(:SS)',p:'([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?',f:'g',cat:'验证',d:'匹配 24 小时制时间',s:'07:01:49'},
    {n:'整数',p:'-?\\d+',f:'g',cat:'数字',d:'匹配正负整数',s:'-42'},
    {n:'小数 / 浮点',p:'-?\\d+(\\.\\d+)?',f:'g',cat:'数字',d:'匹配整数与小数',s:'3.14'},
    {n:'正整数',p:'[1-9]\\d*',f:'g',cat:'数字',d:'不含 0 的正数',s:'1024'},
    {n:'中文字符',p:'[\\u4e00-\\u9fa5]+',f:'g',cat:'文本',d:'匹配连续中文',s:'你好世界'},
    {n:'用户名(字母数字下划线)',p:'^[A-Za-z_]\\w{3,15}$',f:'',cat:'验证',d:'4-16 位，字母/数字/下划线，字母或下划线开头',s:'peng_liu'},
    {n:'强密码(8+位含大小写数字)',p:'(?=.*[a-z])(?=.*[A-Z])(?=.*\\d).{8,}',f:'',cat:'验证',d:'至少 8 位且含小写、大写、数字',s:'Passw0rd'},
    {n:'提取域名',p:'(?<=https?://)[\\w.-]+',f:'g',cat:'提取',d:'从 URL 中提取主机名',s:'https://sub.example.com/x'},
    {n:'提取引号内文本',p:'"([^"]*)"',f:'g',cat:'提取',d:'捕获双引号之间的内容',s:'name="peng"'},
    {n:'HTML 标签',p:'<([a-z][\\w-]*)\\b[^>]*>',f:'gi',cat:'提取',d:'匹配开始标签',s:'<div class="x">'},
    {n:'空白行',p:'^\\s*$',f:'gm',cat:'文本',d:'匹配空行',s:'（空行）'},
    {n:'重复单词',p:'\\b(\\w+)\\s+\\1\\b',f:'gi',cat:'文本',d:'找出连续重复的词',s:'the the cat'},
    {n:'Base64 串',p:'[A-Za-z0-9+/]{8,}={0,2}',f:'g',cat:'文本',d:'粗略匹配 Base64',s:'SGVsbG8='},
    {n:'UUID',p:'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}',f:'g',cat:'验证',d:'匹配标准 UUID',s:'123e4567-e89b-12d3-a456-426614174000'},
    {n:'Windows 路径',p:'[A-Za-z]:\\\\[\\w\\\\./-]+',f:'g',cat:'文本',d:'匹配盘符路径',s:'C:\\\\Users\\\\peng'},
    {n:'版本号 SemVer',p:'\\d+\\.\\d+\\.\\d+(?:-[\\w.]+)?',f:'g',cat:'验证',d:'匹配语义化版本',s:'v1.2.3-beta.1'}
  ];
  const cats=[['全部',''],['验证','验证'],['数字','数字'],['文本','文本'],['提取','提取']];
  let cur='';
  const catBox=$('cats');
  cats.forEach(([label,val])=>{ const b=document.createElement('button'); b.className='chip'+(val===''?' on':''); b.textContent=label;
    b.onclick=()=>{ cur=val; [...catBox.children].forEach(x=>x.classList.toggle('on',x.textContent===label)); render(); }; catBox.appendChild(b); });

  function copy(s){ try{ navigator.clipboard.writeText(s); setStatus('✓ 已复制：'+s,'ok'); }
    catch(e){ setStatus('复制失败：'+e.message,'err'); } }
  function setStatus(m,t){ const s=$('st'); s.textContent=m; s.className='status'+(t?' '+t:''); }
  function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function render(){
    const q=$('search').value.trim().toLowerCase();
    const grid=$('grid'); grid.innerHTML='';
    DATA.filter(d=>{ if(cur&&d.cat!==cur) return false; if(!q) return true;
      return d.n.toLowerCase().includes(q)||d.p.toLowerCase().includes(q)||d.d.includes(q); })
    .forEach(d=>{
      const el=document.createElement('div'); el.className='card';
      el.innerHTML='<div class="name">'+esc(d.n)+'</div>'+
        '<div class="pat">/'+esc(d.p)+'/'+(d.f||'')+'</div>'+
        '<div class="desc">'+esc(d.d)+'</div>'+
        '<div class="sample">示例：'+esc(d.s)+'</div>';
      el.onclick=()=>copy('/'+d.p+'/'+(d.f||''));
      grid.appendChild(el);
    });
  }
  $('search').addEventListener('input',render);
  render();
})();
</script>
</body>
</html>
