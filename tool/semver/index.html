<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语义化版本 · SemVer</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6;
    --muted:#9aa4b2; --accent:#4f9cff; --ok:#3ecf8e; --err:#ff5d6c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  main{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px}
  .cmp{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:200px}
  .field span{font-size:12px;color:var(--muted)}
  .field input{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px;outline:none;font-family:"SF Mono",Consolas,monospace}
  .field input.bad{border-color:var(--err)}
  .field input.good{border-color:var(--ok)}
  .result{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;font-size:16px;min-height:60px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .badge.ok{background:rgba(62,207,142,.15);color:var(--ok)}
  .badge.err{background:rgba(255,93,108,.15);color:var(--err)}
  .status{padding:10px 20px;font-size:13px;border-top:1px solid var(--border);min-height:40px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🔢 语义化版本 SemVer</h1>
    <div class="sub">校验与比较 · 遵循 semver.org 规范 · 纯本地</div>
  </div>
  <div class="toolbar">
    <button id="bCmp" class="primary">比较</button>
  </div>
</header>
<main>
  <div class="cmp">
    <div class="field"><span>版本 A</span><input id="a" value="2.1.0-rc.1" spellcheck="false"></div>
    <div class="field"><span>版本 B</span><input id="b" value="2.0.9" spellcheck="false"></div>
  </div>
  <div class="result" id="res">输入两个版本后点击「比较」</div>
  <div class="hint">格式：主版本.次版本.修订号[-预发布标识][+构建标识]，例如 1.0.0、2.1.0-beta.2、3.0.0+build.5。预发布版本（带 -）优先级低于正式版本。</div>
</main>
<div class="status" id="st">就绪</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const res=$('res'),st=$('st');
  const RE=/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;
  function setStatus(m,t){st.textContent=m;st.className='status'+(t?' '+t:'');}
  function parse(v){ const m=RE.exec(v.trim()); if(!m) return null; return {maj:+m[1],min:+m[2],pat:+m[3],pre:m[4]?m[4].split('.'):null,build:m[5]||null}; }
  function cmpPre(x,y){
    if(!x&&!y) return 0;
    if(!x) return 1;   // no prerelease > prerelease
    if(!y) return -1;
    const n=Math.max(x.length,y.length);
    for(let i=0;i<n;i++){
      if(x[i]===undefined) return -1;
      if(y[i]===undefined) return 1;
      const xn=/^\d+$/.test(x[i]), yn=/^\d+$/.test(y[i]);
      if(xn&&yn){ const a=+x[i],b=+y[i]; if(a!==b) return a<b?-1:1; }
      else if(xn&&!yn) return -1;
      else if(!xn&&yn) return 1;
      else if(x[i]!==y[i]) return x[i]<y[i]?-1:1;
    }
    return 0;
  }
  function cmp(x,y){
    if(x.maj!==y.maj) return x.maj<y.maj?-1:1;
    if(x.min!==y.min) return x.min<y.min?-1:1;
    if(x.pat!==y.pat) return x.pat<y.pat?-1:1;
    return cmpPre(x.pre,y.pre);
  }
  function validate(){
    const va=parse($('a').value), vb=parse($('b').value);
    $('a').className=$('a').className.replace(/ (good|bad)/g,'')+(va?' good':' bad');
    $('b').className=$('b').className.replace(/ (good|bad)/g,'')+(vb?' good':' bad');
    return [va,vb];
  }
  function go(){
    const [va,vb]=validate();
    if(!va||!vb){ setStatus('✗ 存在无效的版本号','err'); res.innerHTML='<span class="badge err">无效</span> 请检查标红的版本号格式。'; return; }
    const c=cmp(va,vb);
    let msg, badge;
    if(c===0){ msg=$('a').value.trim()+' 与 '+$('b').value.trim()+' 等价'; badge='ok'; }
    else if(c<0){ msg=$('a').value.trim()+' &lt; '+$('b').value.trim(); badge='ok'; }
    else { msg=$('a').value.trim()+' &gt; '+$('b').value.trim(); badge='ok'; }
    res.innerHTML='<span class="badge '+badge+'">'+msg+'</span>';
    setStatus('✓ 比较完成','ok');
  }
  ['a','b'].forEach(id=>$(id).addEventListener('input',validate));
  $('bCmp').onclick=go;
  validate();
})();
</script>
</body>
</html>
